# Override de despliegue de services/cuentas/ms-cumplimiento.
#
# Hasta hoy este archivo declaraba el contenedor de la aplicacion y nada mas:
# sin base de datos, sin mem_limit, sin restart y sin depends_on. Con
# DB_HOST apuntando a un servidor que este compose no levanta, el contenedor
# arranca y muere en el primer intento de conexion -- y sin mem_limit, en un
# host de 1910 MiB, un servicio sin techo puede llevarse por delante a los que
# sostienen el MVP. Los cinco secrets que le faltan tampoco se habian echado
# en falta, porque el servicio nunca llego a intentar desplegarse de verdad.
#
# Ahora sigue el mismo patron que ms-identidad, ms-finanzas y ms-subastas:
# solo "image:" (la construye y publica cd.yml, nunca el servidor), su propia
# base (regla 7: aislamiento de datos), y su techo de memoria.
#
# Puerto 8091 en el host y en el contenedor (EXPOSE 8091). Salud en
# /actuator/health: no tiene context-path (confirmado en su
# application.properties, y el guardian del catalogo lo comprueba).
#
# CAPACIDAD: servicios.json lo marca desplegableDev segun lo medido; ver
# infrastructure/despliegue/CAPACIDAD.md.

services:
  cumplimiento-db:
    image: postgres:17-alpine
    container_name: cumplimiento-db
    restart: unless-stopped
    mem_limit: 128m
    environment:
      POSTGRES_DB: ${MS_CUMPLIMIENTO_DB_NAME:-cumplimientodb}
      POSTGRES_USER: ${MS_CUMPLIMIENTO_DB_USER}
      POSTGRES_PASSWORD: ${MS_CUMPLIMIENTO_DB_PASSWORD}
    volumes:
      - cumplimiento-db-datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MS_CUMPLIMIENTO_DB_USER} -d ${MS_CUMPLIMIENTO_DB_NAME:-cumplimientodb}"]
      interval: 5s
      timeout: 5s
      retries: 20

  srv-ms-cumplimiento:
    image: ghcr.io/vortex-play-nexus-battles/nexus-battles-vi-ms-cumplimiento:${TAG}
    container_name: srv-ms-cumplimiento
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "8091:8091"
    depends_on:
      # Corre Flyway al arrancar: con la base a medias el contenedor no
      # levanta y el healthcheck del despliegue lo da por muerto.
      cumplimiento-db:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC"
      DB_HOST: ${MS_CUMPLIMIENTO_DB_HOST:-cumplimiento-db}
      DB_PORT: ${MS_CUMPLIMIENTO_DB_PORT:-5432}
      DB_NAME: ${MS_CUMPLIMIENTO_DB_NAME:-cumplimientodb}
      DB_USER: ${MS_CUMPLIMIENTO_DB_USER}
      DB_PASSWORD: ${MS_CUMPLIMIENTO_DB_PASSWORD}
      IDENTIDAD_JWKS_URL: ${IDENTIDAD_JWKS_URL:-http://srv-ms-identidad:8089/api/v1/auth/jwks}

volumes:
  cumplimiento-db-datos:
