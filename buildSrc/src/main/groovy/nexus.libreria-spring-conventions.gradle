// Convenciones para BIBLIOTECAS compartidas que necesitan clases de Spring.
//
// No aplica el plugin de Spring Boot a proposito: ese construye un bootJar y
// exige una clase principal. Una biblioteca se enlaza, no se despliega.
//
// Lo que si aporta es el catalogo de versiones de Spring Boot, para que la
// biblioteca declare dependencias sin numero de version y no se desincronice
// de los servicios que la consumen.

plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        // Misma version que declara buildSrc/build.gradle para el plugin de Boot.
        // Si una sube, la otra tiene que subir con ella.
        mavenBom 'org.springframework.boot:spring-boot-dependencies:4.1.1'
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
