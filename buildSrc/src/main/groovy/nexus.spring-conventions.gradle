// Convenciones compartidas por todos los microservicios Spring del monorepo.
//
// Un servicio que aplica este plugin no necesita declarar version de Spring Boot,
// version de Java, repositorios, motor de pruebas ni jacoco: todo baja de aqui.
// Asi la pila tecnologica se cambia en un solo archivo y no en veinte.

plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // En Spring Boot 4 el starter web se llama 'webmvc'; 'spring-boot-starter-web'
    // es el nombre de la linea 3.x y ya no resuelve.
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    // Regla 3 de plataforma: todo servicio expone salud y metricas de Actuator.
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // HU-REN-001, CA-01: instrumentacion de latencia extremo a extremo.
    //
    // Se reparte desde aqui, y no copiando el filtro en cada servicio, por la
    // misma razon que JaCoCo o el Actuator de arriba: son veinte modulos de
    // tres equipos distintos. Copiado, en dos sprints habria veinte variantes
    // del mismo filtro midiendo cosas ligeramente distintas y el informe de
    // RNF-REN-001 no seria comparable entre servicios.
    //
    // La biblioteca trae una autoconfiguracion, asi que un servicio nuevo queda
    // instrumentado por existir: no tiene que declarar nada ni escribir codigo.
    implementation project(':shared:libs:plataforma-observabilidad')

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

    // Sin esta linea Gradle 9 no descubre las pruebas de JUnit 5 y rompe la
    // compilacion con "the test task did not discover any tests to execute".
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// HU-CICD-001: cobertura de pruebas centralizada aqui para que los 8
// servicios de services/plataforma/* (y cualquiera que se sume despues a
// settings.gradle) la hereden automaticamente, sin repetir configuracion
// JaCoCo servicio por servicio.
jacoco {
    toolVersion = '0.8.12'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')

    // Que el log diga POR QUE fallo, no solo que fallo.
    //
    // Por omision Gradle imprime la clase de la excepcion y la linea, pero no
    // el mensaje ni la causa raiz: en el servidor de integracion continua no
    // hay forma de abrir el informe HTML, asi que un fallo se leia como
    // "SchemaManagementException at AbstractSchemaValidator.java:163" y habia
    // que reproducirlo en local para saber que columna era. Con esto el
    // mensaje completo y toda la cadena de causas quedan en la corrida.
    testLogging {
        events 'failed'
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
        stackTraceFilters 'ENTRY_POINT'
    }
}

// La clase de arranque no cuenta para la cobertura.
//
// `XApplication` son tres lineas: la declaracion, el constructor implicito y
// `SpringApplication.run(...)`. Ese `main` no se puede ejercitar desde una
// prueba unitaria -arrancaria la aplicacion entera-, y lo que de verdad importa
// de el, que el contexto levante, ya lo comprueba el IT de arranque de cada
// servicio. Contarlo solo anade ruido: en los servicios con codigo son dos
// lineas perdidas entre cientos, pero en los que todavia son andamiaje es el
// 100 % del modulo y arrastra el porcentaje a 33 %.
//
// Mismo criterio que motor-combate, que ya excluye `nexus/combate/arranque/**`.
def clasesFueraDeLaCobertura = ['**/*Application.class']

jacocoTestReport {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: clasesFueraDeLaCobertura)
        }))
    }
}

// Regla 11 de plataforma y punto (d) del Definition of Done: cobertura minima
// del 80 %. ACTIVA desde el bloque B1 (19 sep 2026).
//
// Estuvo declarada y comentada desde agosto porque los modulos que aun son
// andamiaje reportaban 0 % y habrian dejado el build en rojo para los tres
// equipos. Se midio antes de encenderla, y el motivo resulto ser mas pequeño de
// lo que parecia: lo unico sin cubrir en esos modulos era su `XApplication`,
// que ahora queda fuera del computo por lo que explica el bloque de arriba.
//
// Linea base medida el 19 sep 2026 (corrida "Medir cobertura"), antes de anadir
// una sola prueba: comentarios 98,0 · metricas-plataforma 94,6 · correo 93,8 ·
// notificaciones 93,7 · salas-partidas 89,6 · motor-combate 88,0 ·
// moderacion-sanciones 86,4. Ninguno estaba por debajo del umbral: lo que
// faltaba no era cobertura, era la compuerta.
jacocoTestCoverageVerification {
    dependsOn tasks.named('test')
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 0.99
            }
        }
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: clasesFueraDeLaCobertura)
        }))
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}
