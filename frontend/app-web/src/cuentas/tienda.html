<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus Battles VI - Tienda</title>
  <link rel="stylesheet" href="../../../../shared/ui-kit/css/tokens.css" />
  <link rel="stylesheet" href="../../../../shared/ui-kit/css/base.css" />
  <link rel="stylesheet" href="../../../../shared/ui-kit/css/componentes.css" />
  <link rel="stylesheet" href="./tema-cuentas.css" />
  <link rel="stylesheet" href="tienda.css" />
</head>
<body>
<!-- Barra de navegación compartida. Reemplaza el <header class="navbar"> del
 mockup Figma con enlaces hardcoded (href="#") por el mismo patrón que
 usan auditoria, perfil, gestion-usuarios y crear-cuenta-admin: un solo
 componente vivo con búsqueda, secciones y panel de cuenta, servido desde
 src/comun/barra-navegacion.js. Cambio pedido por Santiago para unificar
 la navegación del dominio cuentas en la misma barra que todos usan. -->
<div id="navbar-container"></div>

<script type="module">
  import { montarCabecera, exigirSesion } from '../comun/cabecera-app.js';

  if (!exigirSesion()) {
    throw new Error('sin sesion: redirigiendo al login');
  }
  // Cabecera unica de la aplicacion (HU-UX-001): navegacion, sesion y estado activo.
  montarCabecera(document.getElementById('navbar-container'), { seccionActiva: 'cuenta' });
</script>

<main class="main-container">
  <!-- Columna de Productos -->
  <section class="store-section">
    <div class="store-header">
      <h2>Tienda</h2>
      <p>Paga con moneda local (COP) usando tus métodos registrados.</p>
    </div>

    <!-- El contenedor donde JS inyectará las tarjetas -->
    <div id="productos-grid" class="products-grid">
      <!-- Cargando productos... -->
    </div>
  </section>

  <!-- Columna del Carrito -->
  <aside class="cart-section">
    <div class="cart-card">
      <h3>Tu carro</h3>

      <div id="cart-items" class="cart-items-container">
        <!-- JS inyectará los items del carrito aquí -->
        <p class="t-meta">Tu carrito está vacío</p>
      </div>

      <div class="cart-summary">
        <div class="summary-row">
          <span>Subtotal</span>
          <span id="cart-subtotal">0 COP</span>
        </div>
        <div class="summary-row total-row">
          <span>Total a pagar</span>
          <span id="cart-total" class="total-price">0 COP</span>
        </div>
      </div>

      <!-- Mensaje de advertencia replicado del Figma -->
      <div id="warning-msg" class="warning-box hidden">
        No te alcanzan los fondos en tu cuenta principal. Revisa tu billetera o quita algo del
        carro.
      </div>

      <!--
        HU-CAR-010: abre el diálogo de resumen y pago. El diálogo no está
        en este HTML: lo construye tienda.js con abrirDialogo() y campo()
        del kit, así que sus clases y su foco son los del kit y los datos
        de la tarjeta desaparecen de la página al cerrarlo.
      -->
      <button id="btn-pagar" class="btn-pagar" disabled>PAGAR</button>
    </div>
  </aside>
</main>

<!--
type="module" desde P3.1: el archivo importa el interceptor
compartido, la base de la API y la identidad de la sesion. Los
botones ya no usan onclick -no funcionaria en un modulo-: la
escucha esta delegada en la rejilla.
-->
<script type="module" src="tienda.js"></script>
</body>
</html>
