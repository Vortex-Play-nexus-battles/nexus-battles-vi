<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Registro de auditoría · The Nexus Battles VI</title>
    <link rel="stylesheet" href="../../../../shared/ui-kit/css/tokens.css" />
    <link rel="stylesheet" href="../../../../shared/ui-kit/css/base.css" />
    <link rel="stylesheet" href="../../../../shared/ui-kit/css/componentes.css" />
  </head>
  <body>
    <div data-cabecera-app></div>

    <!--
      §7.3.5 (SA-5, ms-cumplimiento-auditoria 1.3.0) con el kit de la
      consola: cifras, filtros, la tabla de acciones con su detalle en un
      panel lateral y la exportación en CSV o PDF. La monta `montarAuditoria`
      sobre las zonas `[data-zona=...]`. Solo el Super Administrador.
    -->
    <main class="pagina consola-integral" data-vista="auditoria">
      <div data-zona="encabezado"></div>
      <div data-zona="aviso" aria-live="polite" hidden></div>
      <div data-zona="indicadores"></div>
      <div data-zona="consola"></div>
    </main>

    <script type="module">
      import { montarCabecera } from '../comun/cabecera-app.js';
      import { exigirAcceso } from '../comun/acceso.js';
      import { montarAuditoria } from './auditoria.js';

      if (!exigirAcceso('auditoria')) {
        throw new Error('sin sesion: redirigiendo al login');
      }
      // Cabecera unica de la aplicacion (HU-UX-001).
      montarCabecera(document.querySelector('[data-cabecera-app]'), {
        vista: 'auditoria',
        seccionActiva: 'auditoria',
      });
      montarAuditoria(document);
    </script>
  </body>
</html>
