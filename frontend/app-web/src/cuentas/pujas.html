<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nexus Battles VI - Pujar en una subasta</title>
    <link rel="stylesheet" href="../comun/barra-navegacion.css" />
    <link rel="stylesheet" href="./tema-cuentas.css" />
    <link rel="stylesheet" href="./pujas.css" />
  </head>
  <body>
    <!-- Barra de navegación compartida. Mismo patrón vivo que tienda.html -->
    <div id="navbar-container"></div>

    <!-- Contenedor Principal de la Aplicación -->
    <main id="subastas-app" class="contenedor-subastas">
      <!-- Inyectado por pujas.js -->
    </main>

    <script type="module">
      import { construirBarra } from '../comun/barra-navegacion.js';
      import { montarSubastas } from './pujas.js';
      import { crearApiSubastas, urlDelCanal } from './pujas-api.js';

      // Montar la barra compartida con rutas funcionales y sesión real
      const navbarContainer = document.getElementById('navbar-container');
      if (navbarContainer) {
        const tieneSesion = Boolean(
          sessionStorage.getItem('nexus.token') ||
          sessionStorage.getItem('nexus.rolActual') ||
          sessionStorage.getItem('token') ||
          sessionStorage.getItem('usuarioId')
        );

        const RUTAS = {
          '/jugar': '../plataforma/salas-partidas/batallas.html',
          '/misiones': './index.html',
          '/torneo': '../plataforma/salas-partidas/batallas.html',
          '/inventario': '../contenido/inventario/inventario.html',
          '/subasta': './subastas.html',
          '/cuenta': './perfil.html',
        };

        const barra = construirBarra({
          seccionActiva: 'subasta',
          sesion: { autenticado: tieneSesion },
          navegar: (ruta) => {
            const destino = RUTAS[ruta] || ruta;
            window.location.href = destino;
          },
        });

        // Enlazar opciones del panel de cuenta
        barra.querySelectorAll('.barra__opcion-cuenta').forEach((btn) => {
          if (btn.textContent.includes('Mi perfil')) {
            btn.addEventListener('click', () => { window.location.href = './perfil.html'; });
          } else if (btn.textContent.includes('Cerrar sesion')) {
            btn.addEventListener('click', () => {
              sessionStorage.clear();
              window.location.href = './login.html';
            });
          } else if (btn.textContent.includes('Registrarse')) {
            btn.addEventListener('click', () => { window.location.href = './registro.html'; });
          }
        });

        // Búsqueda funcional
        const campoBusqueda = barra.querySelector('.barra__busqueda input');
        if (campoBusqueda) {
          campoBusqueda.placeholder = 'Buscar subastas o productos...';
          campoBusqueda.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && campoBusqueda.value.trim()) {
              window.location.href = `./subastas.html?criterio=${encodeURIComponent(campoBusqueda.value.trim())}`;
            }
          });
        }

        navbarContainer.appendChild(barra);
      }

      const contenedor = document.getElementById('subastas-app');
      const parametros = new URLSearchParams(location.search);

      // ?id=<uuid> abre directamente el detalle de esa subasta. Es el enganche
      // que espera el listado de HU-SUB-011: su vitrina ya llama a
      // alAbrirDetalle, que hoy apunta a /subasta/{id} — una ruta que no
      // existe. Cambiar ese destino por ./pujas.html?id={id} conecta las dos
      // pantallas, pero es una linea en el archivo de Cristian y la decide el.
      const subastaId = parametros.get('id');

      // Siempre contra el servicio real. No hay modo de demostracion: una
      // pantalla que se pinta con datos inventados cuando el backend no
      // responde engana justo cuando mas importa saberlo, y en una
      // sustentacion haria creer que funciona algo que no esta funcionando.
      // Si el servicio no esta, la pantalla lo dice y ofrece reintentar.
      // urlCanal es opcional: si el WebSocket no levanta, la pantalla sigue
      // con el sondeo de 5 s. Anade inmediatez, no la sustituye.
      montarSubastas(contenedor, {
        api: crearApiSubastas(),
        urlCanal: urlDelCanal(),
        ...(subastaId ? { subastaInicialId: subastaId } : {})
      });
    </script>
  </body>
</html>
