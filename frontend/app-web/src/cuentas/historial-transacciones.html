<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Historial de transacciones — Nexus Battles VI</title>
    <link rel="stylesheet" href="../../../../shared/ui-kit/css/tokens.css" />
    <link rel="stylesheet" href="../../../../shared/ui-kit/css/base.css" />
    <link rel="stylesheet" href="../../../../shared/ui-kit/css/componentes.css" />
    <link rel="stylesheet" href="./tema-cuentas.css" />
    <link rel="stylesheet" href="./historial-transacciones.css" />
  </head>
  <body>
    <!-- Barra de navegación compartida (mismo patrón que auditoria/perfil/etc.). -->
    <div id="navbar-container"></div>

    <div class="pagina">
      <header class="encabezado-pagina">
        <div class="encabezado-pagina__contenido">
          <div>
            <h1 class="titulo">Historial de transacciones</h1>
            <p class="ayuda">
              Todas tus transacciones en moneda real: cargas, compras y reversos. El listado es solo
              tuyo.
            </p>
          </div>
          <button id="btn-volver" type="button" class="btn-contorno">Volver</button>
        </div>
      </header>

      <section class="tarjeta">
        <div class="tabla-envoltorio">
          <table class="tabla-historial">
            <thead>
              <tr>
                <th>Fecha</th>
                <th>Concepto</th>
                <th class="celda-monto">Monto</th>
                <th>Moneda</th>
                <th>Resultado</th>
                <th>Comprobante</th>
              </tr>
            </thead>
            <tbody id="historial-tbody">
              <!-- filas insertadas por historial-transacciones.js -->
            </tbody>
          </table>
        </div>

        <p id="historial-estado" class="estado" hidden></p>
      </section>

      <nav class="paginacion" aria-label="Paginación">
        <button type="button" id="btn-anterior" class="btn-contorno" disabled>Anterior</button>
        <span id="historial-pagina-actual" class="ayuda">Página 1</span>
        <button type="button" id="btn-siguiente" class="btn-contorno" disabled>Siguiente</button>
      </nav>
    </div>

    <script type="module">
      import { montarCabecera, exigirSesion } from '../comun/cabecera-app.js';

      if (!exigirSesion()) {
        throw new Error('sin sesion: redirigiendo al login');
      }
      // Cabecera unica de la aplicacion (HU-UX-001): navegacion, sesion y estado activo.
      montarCabecera(document.getElementById('navbar-container'), { seccionActiva: 'cuenta' });
    </script>

    <script type="module" src="./historial-transacciones.js"></script>
  </body>
</html>
