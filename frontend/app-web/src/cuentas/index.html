<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inicio — NEXUS BATTLES VI</title>
    <link rel="stylesheet" href="../../../../shared/ui-kit/css/tokens.css" />
    <link rel="stylesheet" href="../../../../shared/ui-kit/css/base.css" />
    <link rel="stylesheet" href="../../../../shared/ui-kit/css/componentes.css" />
  </head>
  <body>
    <div data-cabecera-app></div>

    <main class="pagina home">
      <!--
        UX-R3.2 — la portada del jugador.

        Antes eran dos bloques separados: un panel oscuro con el saludo y el
        botón de jugar, y debajo una sección «Tu héroe» con su tarjeta. El
        orden de la pantalla decía «hola, juega» y solo después «ah, y este es
        tu héroe», cuando es AL REVÉS: el héroe equipado es lo que decide si
        se puede entrar a una sala (HU-SAL-003), y en un juego es lo primero
        que uno mira al volver.

        Ahora es una sola pieza: a la izquierda quién eres y qué vas a hacer, a
        la derecha con qué. Las dos cosas a la vez, que es como se leen.
      -->
      <section class="home__portada">
        <div class="home__presentacion">
          <p class="home__sobretitulo">Tu Nexo</p>
          <h1 class="home__saludo" data-zona="saludo">Hola</h1>
          <p class="home__lema">
            Equipa tu héroe, entra a una sala y decide el combate turno a turno.
          </p>
          <div class="home__acciones">
            <!--
              El CTA domina. Era un botón primario del mismo tamaño que los
              «Reintentar» de las tarjetas de abajo: la acción por la que uno
              entra al juego pesaba lo mismo que reintentar una consulta.
            -->
            <a
              class="boton boton--acento boton--grande home__jugar"
              href="../plataforma/salas-partidas/crear-sala.html"
            >
              Jugar ahora
            </a>
            <a
              class="boton boton--contorno boton--grande"
              href="../plataforma/salas-partidas/batallas.html"
            >
              Ver salas abiertas
            </a>
          </div>
        </div>

        <!-- El héroe equipado, dentro de la portada. Su contenido lo pinta
             `home.js` desde el inventario: retrato con anillo de rareza si lo
             hay, y si no, por qué no y a dónde ir. -->
        <div class="home__heroe" data-zona="bloque-heroe"></div>
      </section>

      <!--
        El estado: cuánto tienes, qué se está jugando, qué te llegó. Cada
        bloque se carga por su cuenta y dice por su nombre si su servicio no
        está en este entorno.
      -->
      <div class="home__rejilla">
        <section class="pila pila--compacta">
          <h2 class="t-subtitulo">Tus créditos</h2>
          <div data-zona="bloque-saldo"></div>
        </section>

        <section class="pila pila--compacta">
          <h2 class="t-subtitulo">Torneo</h2>
          <div data-zona="bloque-torneo"></div>
        </section>

        <section class="pila pila--compacta">
          <h2 class="t-subtitulo">Tus avisos</h2>
          <div data-zona="bloque-avisos"></div>
        </section>
      </div>

      <section class="pila pila--compacta">
        <h2 class="t-subtitulo">A dónde ir</h2>
        <div class="home__accesos" data-zona="accesos"></div>
      </section>

      <!--
        UX-R3.2 — aquí había una sección «Administración» con cuatro tarjetas
        y `data-roles` en cada una. Ya no: quien opera el Nexo tiene su propia
        consola (`plataforma/consola/`), con su armazón, su navegación y sus
        permisos. Repetir cuatro atajos administrativos en la home del jugador
        era exactamente la mezcla que UX-R3 vino a deshacer — y además era la
        cuarta lista de roles del producto, escrita a mano en el marcado.
      -->
    </main>

    <script type="module" src="./index.js"></script>
    <script type="module">
      import { montarAsistente } from '../comun/ui/asistente.js';

      // RF-CHA-001 / HU-CHA-001 CA-03: el icono responde y dice la verdad.
      montarAsistente(document);
    </script>
  </body>
</html>
