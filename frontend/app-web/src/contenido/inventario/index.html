<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vitrina del inventario</title>
  <link rel="stylesheet" href="./vitrina.css">
</head>
<body class="vitrina-pagina">
  <h1 class="vitrina-titulo">Mi inventario</h1>
  <div id="contenedor-vitrina"></div>

  <!--
    Raiz de composicion de SCRUM-319: pide la pagina y pinta la rejilla.
    El estado vacio y el aviso de error son SCRUM-320; el propietario
    autenticado llega con HU-INF-009.
  -->
  <script type="module">
    import { consultarPagina } from './cliente-inventario.js';
    import { construirVitrina } from './vitrina.js';

    const contenedor = document.getElementById('contenedor-vitrina');
    const propietarioId = new URLSearchParams(location.search).get('propietario');
    const numeroPagina = Number(
      new URLSearchParams(location.search).get('pagina') ?? 0);

    consultarPagina(propietarioId, numeroPagina)
      .then((pagina) => contenedor.replaceChildren(construirVitrina(pagina)))
      .catch((error) => console.error('No se pudo cargar la vitrina', error));
  </script>
</body>
</html>
