<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vitrina del inventario</title>
    <link rel="stylesheet" href="../../../../../shared/ui-kit/css/tokens.css" />
    <link rel="stylesheet" href="../../../../../shared/ui-kit/css/base.css" />
    <link rel="stylesheet" href="../../../../../shared/ui-kit/css/componentes.css" />
    <link rel="stylesheet" href="./vitrina.css" />
    <link rel="stylesheet" href="./ficha-producto.css" />
  </head>
  <body class="vitrina-pagina">
    <div id="contenedor-barra"></div>
    <main id="inventario-app"></main>

    <!--
    Raiz de composicion: resuelve el propietario y delega en montarInventario,
    que integra las escrituras de HU-INV-003 con la vitrina de HU-INV-001.
    El propietario real lo decide el servicio por el JWT de la sesion
    (contrato 1.1.0); el apodo de aqui solo etiqueta la vista. Se toma de la
    sesion que dejo el login, y ?jugador= queda como atajo para revisar la
    vista suelta.
  -->
    <script type="module">
      import { montarInventario } from './inventario.js';
      import { montarCabecera } from '../../comun/cabecera-app.js';
      import { exigirAcceso } from '../../comun/acceso.js';

      const parametros = new URLSearchParams(location.search);
      const contenedor = document.getElementById('inventario-app');
      const identidad = parametros.get('jugador') ?? sessionStorage.getItem('nexus.apodoActual');
      const numeroPagina = Number(parametros.get('pagina') ?? 0);

      // Vista privada (HU-UX-001): sin sesion se va al login con vuelta aqui.
      if (!exigirAcceso('inventario')) {
        throw new Error('sin sesion: redirigiendo al login');
      }
      montarCabecera(document.getElementById('contenedor-barra'), {
        vista: 'inventario',
        seccionActiva: 'inventario',
      });

      montarInventario(contenedor, identidad, numeroPagina);
    </script>
  </body>
</html>
