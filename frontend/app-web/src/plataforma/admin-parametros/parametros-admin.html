<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parámetros de plataforma · The Nexus Battles VI</title>
    <link rel="stylesheet" href="../../../../../shared/ui-kit/css/tokens.css" />
    <link rel="stylesheet" href="../../../../../shared/ui-kit/css/base.css" />
    <link rel="stylesheet" href="../../../../../shared/ui-kit/css/componentes.css" />
  </head>
  <body>
    <div data-cabecera-app></div>

    <!--
      HU-ADM-001 (admin-parametros.yaml) con el kit de la consola (SA-8, punto
      22 del informe): cifras, búsqueda y filtros, una tabla por área y los
      paneles de cambio e historial. La monta `montarParametros` sobre las
      zonas `[data-zona=...]`.
    -->
    <main class="pagina consola-integral" data-vista="parametros-admin">
      <div data-zona="encabezado"></div>
      <div data-zona="aviso" aria-live="polite" hidden></div>
      <div data-zona="indicadores"></div>
      <div class="consola-integral__rejilla" data-zona="catalogo"></div>
    </main>

    <script type="module">
      import { montarCabecera, leerSesion } from '../../comun/cabecera-app.js';
      import { exigirAcceso } from '../../comun/acceso.js';
      import { montarParametros } from './parametros.js';

      if (!exigirAcceso('parametros-admin')) {
        throw new Error('sin sesion: redirigiendo al login');
      }
      montarCabecera(document.querySelector('[data-cabecera-app]'), {
        vista: 'parametros-admin',
        seccionActiva: 'parametros',
      });
      montarParametros(document, { rol: leerSesion().rol });
    </script>
  </body>
</html>
