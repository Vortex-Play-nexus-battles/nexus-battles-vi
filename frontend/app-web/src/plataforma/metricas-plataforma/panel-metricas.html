<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Métricas de plataforma · The Nexus Battles VI</title>

    <!--
      Ejecucion INTEGRADA (Spring Boot sirve esta vista): la API vive en el
      mismo origen y no hay que declarar nada.
      Para apuntar a un backend que corra en otro sitio, descomenta y ajusta:
      <meta name="nexus-api-base" content="http://127.0.0.1:8087" />
    -->

    <link rel="stylesheet" href="../../../../../shared/ui-kit/css/tokens.css" />
    <link rel="stylesheet" href="../../../../../shared/ui-kit/css/base.css" />
    <link rel="stylesheet" href="../../../../../shared/ui-kit/css/componentes.css" />
    <link rel="stylesheet" href="./panel-metricas.css" />
  </head>

  <body>
    <div data-cabecera-app></div>

    <!--
      HU-DIS-001, HU-REN-001/002/003 y HU-DIS-003 (metricas-plataforma.yaml) con
      el kit de la consola (SA-8, puntos 23 y 24 del informe): cifras arriba,
      una tabla por fuente y actualización en vivo. La monta
      `montarPanelMetricas` sobre las zonas `[data-zona=...]`.
    -->
    <main class="pagina consola-integral" data-vista="panel-metricas">
      <div data-zona="encabezado"></div>
      <div data-zona="indicadores"></div>
      <div class="consola-integral__rejilla" data-zona="paneles"></div>
    </main>

    <script type="module">
      import { exigirAcceso } from '../../comun/acceso.js';
      import { montarCabecera } from '../../comun/cabecera-app.js';
      import { montarPanelMetricas } from './panel-metricas.js';

      // La guarda va primero y en el mismo bloque: nada consulta al servicio
      // de métricas hasta que se sabe que quien mira es de administración.
      const sesion = exigirAcceso('panel-metricas');
      if (sesion) {
        montarCabecera(document.querySelector('[data-cabecera-app]'), {
          vista: 'panel-metricas',
          seccionActiva: 'metricas',
        });
        montarPanelMetricas(document);
      }
    </script>
  </body>
</html>
