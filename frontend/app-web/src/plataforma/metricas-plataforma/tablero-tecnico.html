<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tablero técnico · The Nexus Battles VI</title>
    <link rel="stylesheet" href="../../../../../shared/ui-kit/css/tokens.css" />
    <link rel="stylesheet" href="../../../../../shared/ui-kit/css/base.css" />
    <link rel="stylesheet" href="../../../../../shared/ui-kit/css/componentes.css" />
    <link rel="stylesheet" href="./panel-metricas.css" />
  </head>
  <body>
    <div data-cabecera-app></div>
    <main class="pagina consola pila" data-vista="tablero-tecnico">
      <div data-zona="encabezado"></div>

      <section class="tarjeta pila pila--compacta" aria-labelledby="titulo-tecnicas">
        <div class="encabezado-seccion">
          <h2 id="titulo-tecnicas">Consumo y errores por servicio</h2>
          <div class="encabezado-seccion__acciones">
            <div data-zona="control-tecnicas"></div>
            <button type="button" class="boton boton--secundario" data-accion="exportar-tecnicas">
              Descargar informe
            </button>
          </div>
        </div>
        <div class="pila pila--compacta" data-zona="tecnicas"></div>
      </section>

      <section class="tarjeta pila pila--compacta">
        <h2>Usuarios y moderación</h2>
        <form class="fila" data-zona="periodo">
          <label class="campo">
            <span class="campo__etiqueta">Desde</span>
            <input class="campo__control" type="datetime-local" name="desde" />
          </label>
          <label class="campo">
            <span class="campo__etiqueta">Hasta</span>
            <input class="campo__control" type="datetime-local" name="hasta" />
          </label>
          <button type="submit" class="boton boton--primario">Consultar periodo</button>
          <button type="button" class="boton boton--secundario" data-accion="exportar-moderacion">
            Descargar datos del periodo
          </button>
        </form>
        <div class="pila pila--compacta" data-zona="moderacion"></div>
      </section>
    </main>

    <script type="module">
      import { montarCabecera } from '../../comun/cabecera-app.js';
      import { exigirAcceso } from '../../comun/acceso.js';
      import { montarTableroTecnico } from './tablero-tecnico.js';

      if (!exigirAcceso('tablero-tecnico')) {
        throw new Error('sin sesion: redirigiendo al login');
      }
      montarCabecera(document.querySelector('[data-cabecera-app]'), {
        vista: 'tablero-tecnico',
        seccionActiva: 'tecnico',
      });
      montarTableroTecnico(document);
    </script>
  </body>
</html>
