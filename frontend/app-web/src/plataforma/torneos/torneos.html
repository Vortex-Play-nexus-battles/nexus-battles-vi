<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Torneo · Nexus Battles VI</title>
    <link rel="stylesheet" href="../../../../../shared/ui-kit/css/tokens.css" />
    <link rel="stylesheet" href="../../../../../shared/ui-kit/css/base.css" />
    <link rel="stylesheet" href="../../../../../shared/ui-kit/css/componentes.css" />
  </head>
  <body>
    <div data-cabecera-app></div>

    <main class="contenedor pila" data-vista="torneos">
      <h1>Torneo</h1>
      <p class="t-meta">
        Un torneo cada 91 dias, ocho equipos de dos jugadores y un arbol de doble eliminacion.
        Cualquiera consulta los equipos y el arbol; para inscribirte necesitas sesion.
      </p>

      <div class="aviso" data-zona="aviso" role="status" hidden></div>

      <form class="tarjeta pila pila--compacta" data-zona="crear-torneo" hidden>
        <h2>Crear torneo</h2>
        <div class="fila">
          <label class="campo">
            <span class="campo__etiqueta">Nombre</span>
            <input class="campo__control" name="nombre" minlength="3" maxlength="80" required />
          </label>
          <label class="campo">
            <span class="campo__etiqueta">Inscripciones hasta</span>
            <input
              class="campo__control"
              type="datetime-local"
              name="inscripcionesCierranEn"
              required
            />
          </label>
          <label class="campo">
            <span class="campo__etiqueta">Inscripcion (creditos, 0 = gratis)</span>
            <input class="campo__control" type="number" name="costoInscripcion" min="0" value="0" />
          </label>
        </div>
        <button class="boton boton--primario" type="submit">Crear y abrir inscripciones</button>
      </form>

      <section class="pila pila--compacta">
        <h2>Torneos</h2>
        <div class="pila pila--compacta" data-zona="listado"></div>
      </section>

      <section class="tarjeta pila pila--compacta" data-zona="detalle" hidden></section>
    </main>

    <script type="module">
      import { montarCabecera, leerSesion } from '../../comun/cabecera-app.js';
      import { montarTorneos } from './torneos.js';

      montarCabecera(document.querySelector('[data-cabecera-app]'), { seccionActiva: 'torneo' });
      const sesion = leerSesion();
      montarTorneos(document, {
        uid: sesion.autenticado ? sesion.uid : null,
        rol: sesion.autenticado ? sesion.rol : null,
        torneoInicial: new URLSearchParams(location.search).get('torneo'),
      });
    </script>
  </body>
</html>
