<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lista negra · The Nexus Battles VI</title>
    <link rel="stylesheet" href="../../../../../shared/ui-kit/css/tokens.css" />
    <link rel="stylesheet" href="../../../../../shared/ui-kit/css/base.css" />
    <link rel="stylesheet" href="../../../../../shared/ui-kit/css/componentes.css" />
  </head>
  <body>
    <div data-cabecera-app></div>

    <!--
      HU-ADM-002 (moderacion-lista-negra.yaml 2.1.x) con el kit de la consola
      (SA-4, punto 21 del informe): cifras, alta, tabla con las acciones a un
      lado y edición completa en un panel lateral. La monta `montarListaNegra`
      sobre las zonas `[data-zona=...]`.
    -->
    <main class="pagina consola-integral" data-vista="lista-negra-admin">
      <div data-zona="encabezado"></div>
      <div data-zona="aviso" aria-live="polite" hidden></div>
      <div data-zona="indicadores"></div>
      <div data-zona="consola"></div>
    </main>

    <script type="module">
      import { montarCabecera } from '../../comun/cabecera-app.js';
      import { exigirAcceso } from '../../comun/acceso.js';
      import { montarListaNegra } from './lista-negra-admin.js';

      if (!exigirAcceso('lista-negra-admin')) {
        throw new Error('sin sesion: redirigiendo al login');
      }
      // Cabecera unica de la aplicacion (HU-UX-001).
      montarCabecera(document.querySelector('[data-cabecera-app]'), {
        vista: 'lista-negra-admin',
        seccionActiva: 'lista-negra',
      });
      montarListaNegra(document);
    </script>
  </body>
</html>
