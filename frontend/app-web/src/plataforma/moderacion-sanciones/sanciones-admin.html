<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moderacion — Sanciones · Nexus Battles VI</title>
    <link rel="stylesheet" href="../../../../../shared/ui-kit/css/tokens.css" />
    <link rel="stylesheet" href="../../../../../shared/ui-kit/css/base.css" />
    <link rel="stylesheet" href="../../../../../shared/ui-kit/css/componentes.css" />
  </head>
  <body>
    <div data-cabecera-app></div>

    <main class="pagina consola pila" data-vista="sanciones-admin">
      <h1>Moderación · Sanciones</h1>
      <!-- Advertencias RF-USR-004, suspensiones RF-USR-005, baneos RF-USR-006,
           apelaciones RF-USR-007. -->
      <p class="t-meta">
        Advertencias, suspensiones temporales, baneos definitivos y apelaciones. Quien emite queda
        registrado y nada se borra: una sanción se revoca, no se elimina.
      </p>

      <div data-zona="aviso" hidden></div>

      <section class="tarjeta pila pila--compacta">
        <h2>Historial de un usuario</h2>
        <form class="fila" data-zona="buscar">
          <label class="campo">
            <span class="campo__etiqueta">Identificador (uid) del usuario</span>
            <input
              class="campo__control"
              name="usuarioId"
              required
              placeholder="uuid del jugador"
            />
          </label>
          <button class="boton boton--secundario" type="submit">Ver historial</button>
        </form>
        <div class="pila pila--compacta" data-zona="historial"></div>
      </section>

      <section class="tarjeta pila pila--compacta">
        <h2>Emitir sanción</h2>
        <form class="pila pila--compacta" data-zona="emitir">
          <label class="campo">
            <span class="campo__etiqueta">Usuario (uid)</span>
            <input class="campo__control" name="usuarioId" required />
          </label>
          <label class="campo">
            <span class="campo__etiqueta">Tipo</span>
            <select class="campo__control" name="tipo">
              <option value="ADVERTENCIA">Advertencia (no restringe el acceso)</option>
              <option value="SUSPENSION">Suspension temporal</option>
              <option value="BANEO">Baneo definitivo</option>
            </select>
          </label>
          <label class="campo" data-solo="SUSPENSION">
            <span class="campo__etiqueta">Duración en horas (1 hora a 30 días)</span>
            <input
              class="campo__control"
              type="number"
              name="duracionHoras"
              min="1"
              max="720"
              value="24"
            />
          </label>
          <label class="campo">
            <span class="campo__etiqueta">Motivo (obligatorio)</span>
            <textarea class="campo__control" name="motivo" rows="3" required></textarea>
          </label>
          <label class="campo">
            <span class="campo__etiqueta">Política violada (opcional)</span>
            <input class="campo__control" name="politica" />
          </label>
          <label class="campo">
            <span class="campo__etiqueta">Comentario de origen (opcional)</span>
            <input class="campo__control" name="comentarioId" />
          </label>
          <label class="campo fila--envuelta" data-solo="BANEO">
            <input type="checkbox" name="confirmacion" />
            <span
              >Confirmo que el baneo es definitivo y solo lo revierte una apelación favorable</span
            >
          </label>
          <div class="acciones">
            <button class="boton boton--primario" type="submit">Emitir</button>
          </div>
        </form>
      </section>

      <section class="tarjeta pila pila--compacta">
        <h2>Apelaciones pendientes</h2>
        <div class="pila pila--compacta" data-zona="apelaciones"></div>
      </section>
    </main>

    <script type="module">
      import { montarCabecera, leerSesion } from '../../comun/cabecera-app.js';
      import { exigirAcceso } from '../../comun/acceso.js';
      import { montarPanelDeModeracion } from './sanciones.js';

      if (!exigirAcceso('sanciones-admin')) {
        throw new Error('sin sesion: redirigiendo al login');
      }
      montarCabecera(document.querySelector('[data-cabecera-app]'), {
        vista: 'sanciones-admin',
        seccionActiva: 'sanciones',
      });
      montarPanelDeModeracion(document, { rol: leerSesion().rol });
      // Un 403 de RBAC lleva al menu, no al login (mismo criterio que la lista negra).
      window.addEventListener('nexus:rbac-forbidden', () => {
        window.location.href = new URL('../../cuentas/index.html', import.meta.url).href;
      });
    </script>
  </body>
</html>
