<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sanciones · The Nexus Battles VI</title>
    <link rel="stylesheet" href="../../../../../shared/ui-kit/css/tokens.css" />
    <link rel="stylesheet" href="../../../../../shared/ui-kit/css/base.css" />
    <link rel="stylesheet" href="../../../../../shared/ui-kit/css/componentes.css" />
  </head>
  <body>
    <div data-cabecera-app></div>

    <!-- SA-4 (§7.3.2, §7.3.8): la consola de sanciones. Todas las sanciones
         con filtros, las apelaciones con el plazo del panel y la emisión con
         la cuenta a la vista. `?usuario=<uid>` abre la emisión con esa cuenta
         (desde la ficha o la cola de moderación). -->
    <main class="pagina consola-integral" data-vista="sanciones-admin">
      <div data-zona="encabezado"></div>

      <div data-zona="aviso" aria-live="polite" hidden></div>
      <div data-zona="indicadores"></div>
      <div data-zona="consola"></div>
    </main>

    <script type="module">
      import { montarCabecera, leerSesion } from '../../comun/cabecera-app.js';
      import { exigirAcceso } from '../../comun/acceso.js';
      import { montarConsolaDeSanciones } from './consola-sanciones.js';

      if (!exigirAcceso('sanciones-admin')) {
        throw new Error('sin sesion: redirigiendo al login');
      }
      montarCabecera(document.querySelector('[data-cabecera-app]'), {
        vista: 'sanciones-admin',
        seccionActiva: 'sanciones',
      });
      montarConsolaDeSanciones(document, { rol: leerSesion().rol });
      // Un 403 de RBAC lleva al menu, no al login (mismo criterio que la lista negra).
      window.addEventListener('nexus:rbac-forbidden', () => {
        window.location.href = new URL('../../cuentas/index.html', import.meta.url).href;
      });
    </script>
  </body>
</html>
