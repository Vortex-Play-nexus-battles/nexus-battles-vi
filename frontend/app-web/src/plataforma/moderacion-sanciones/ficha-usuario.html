<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ficha del usuario · The Nexus Battles VI</title>
    <link rel="stylesheet" href="../../../../../shared/ui-kit/css/tokens.css" />
    <link rel="stylesheet" href="../../../../../shared/ui-kit/css/base.css" />
    <link rel="stylesheet" href="../../../../../shared/ui-kit/css/componentes.css" />
    <link rel="stylesheet" href="./ficha-usuario.css" />
  </head>
  <body>
    <div data-cabecera-app></div>

    <!-- HU-USR-010 (RF-USR-010): la ficha administrativa de una cuenta. Se
         abre con `?usuario=` y la clave del directorio o el uid del autor de
         un comentario reportado. -->
    <main class="pagina consola-integral" data-vista="ficha-usuario">
      <div data-zona="encabezado"></div>

      <!-- Nota permanente, como en Control integral: lo que no se ve es
           porque no se pudo preguntar o porque nadie lo publica, nunca un
           cero inventado. -->
      <p class="consola-integral__contrato t-meta">
        Cada sección consulta al servicio dueño del dato, con tu sesión y bajo los mismos permisos
        del resto del producto. Donde el servicio no responde verás
        <strong>SERVICIO DEGRADADO</strong>; donde ningún servicio publica el dato,
        <strong>SIN FUENTE</strong>. Abrir esta ficha queda registrado en la auditoría: son datos
        personales.
      </p>

      <div data-zona="aviso" aria-live="polite"></div>
      <div data-zona="ficha" aria-live="polite"></div>
    </main>

    <script type="module">
      import { exigirAcceso } from '../../comun/acceso.js';
      import { montarCabecera } from '../../comun/cabecera-app.js';
      import { montarFichaDeUsuario } from './ficha-usuario.js';

      const sesion = exigirAcceso('ficha-usuario');
      if (sesion) {
        montarCabecera(document.querySelector('[data-cabecera-app]'), {
          vista: 'ficha-usuario',
          seccionActiva: 'usuarios',
        });
        montarFichaDeUsuario(document);
      }
    </script>
  </body>
</html>
