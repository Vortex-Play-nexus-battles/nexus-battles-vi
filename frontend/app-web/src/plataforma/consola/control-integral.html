<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Control integral · The Nexus Battles VI</title>
    <link rel="stylesheet" href="../../../../../shared/ui-kit/css/tokens.css" />
    <link rel="stylesheet" href="../../../../../shared/ui-kit/css/base.css" />
    <link rel="stylesheet" href="../../../../../shared/ui-kit/css/componentes.css" />
  </head>
  <body>
    <div data-cabecera-app></div>

    <main class="pagina consola-integral">
      <div data-zona="encabezado"></div>

      <div data-zona="secciones"></div>
    </main>

    <script type="module">
      import { exigirAcceso } from '../../comun/acceso.js';
      import { montarCabecera } from '../../comun/cabecera-app.js';
      import { montarControlIntegral } from './control-integral.js';

      const sesion = exigirAcceso('control-integral');
      if (sesion) {
        montarCabecera(document.querySelector('[data-cabecera-app]'), {
          vista: 'control-integral',
          seccionActiva: 'control',
        });
        montarControlIntegral(document, sesion);
      }
    </script>
  </body>
</html>
