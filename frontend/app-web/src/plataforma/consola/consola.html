<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Control · The Nexus Battles VI</title>
    <link rel="stylesheet" href="../../../../../shared/ui-kit/css/tokens.css" />
    <link rel="stylesheet" href="../../../../../shared/ui-kit/css/base.css" />
    <link rel="stylesheet" href="../../../../../shared/ui-kit/css/componentes.css" />
  </head>
  <body>
    <div data-cabecera-app></div>

    <!--
      SA-7 (informe de revisión, punto 1): el resumen del sistema. Cifras clave,
      últimos movimientos, estabilidad y accesos rápidos; cada dato de su
      servicio y solo lo que el rol puede consultar (consola.js).
    -->
    <main class="pagina consola resumen-consola">
      <div data-zona="encabezado"></div>
      <section aria-label="Cifras clave" data-zona="indicadores"></section>
      <div class="resumen-consola__paneles" data-zona="paneles"></div>
      <section class="pila pila--compacta" data-zona="accesos" hidden></section>
    </main>

    <script type="module">
      import { exigirAcceso } from '../../comun/acceso.js';
      import { montarCabecera } from '../../comun/cabecera-app.js';
      import { montarConsola } from './consola.js';

      // Guarda completa: sesión y rol. Sin rol de trastienda esta pantalla no
      // se pinta a medias — se explica y se ofrece una salida (§17).
      const sesion = exigirAcceso('consola');
      if (sesion) {
        montarCabecera(document.querySelector('[data-cabecera-app]'), {
          vista: 'consola',
          seccionActiva: 'resumen',
        });
        montarConsola(document, sesion);
      }
    </script>
  </body>
</html>
