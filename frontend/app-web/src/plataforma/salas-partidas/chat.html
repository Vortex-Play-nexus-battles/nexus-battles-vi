<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat · The Nexus Battles VI</title>

    <!-- Sistema de diseno compartido, sin estilos propios. Mismas rutas que crear-sala.html.
         UXC-6: la conversacion (globos, redactor, lista de conversaciones) es del
         kit porque la pintan el chat general, el de la sala y los mensajes privados. -->
    <link rel="stylesheet" href="../../../../../shared/ui-kit/css/tokens.css" />
    <link rel="stylesheet" href="../../../../../shared/ui-kit/css/base.css" />
    <link rel="stylesheet" href="../../../../../shared/ui-kit/css/componentes.css" />
  </head>

  <body>
    <div data-cabecera-app></div>

    <main id="chat" class="pagina pila" data-vista="chat">
      <div class="pila pila--compacta">
        <div class="chat__titulo-fila">
          <h1 data-zona="titulo">Chat</h1>
          <!-- Solo en el chat de una sala (`?sala=`): chat.js le pone su destino. -->
          <a
            class="boton boton--secundario boton--pequeno"
            data-zona="volver-a-la-sala"
            href="./batallas.html"
            hidden
            >Volver a la sala</a
          >
        </div>
        <p class="t-cuerpo" data-zona="intro">
          Habla con otros jugadores para armar partidas. Lo que escribes pasa por el filtro de
          contenido antes de salir, y el historial queda para quien entra después.
        </p>
      </div>

      <!-- Pestañas «Chat general» y «Mensajes privados». En el chat de una sala no hay. -->
      <div class="chat__pestanas" data-zona="pestanas-chat"></div>

      <section
        class="tarjeta conversacion chat__general"
        data-panel-chat="general"
        aria-labelledby="titulo-conversacion"
      >
        <header class="conversacion__barra">
          <h2 class="conversacion__titulo" id="titulo-conversacion" data-zona="titulo-conversacion">
            Conversación general
          </h2>
          <!-- Dice lo que hay de verdad: conectando, conectado, reconectando (con el
               intento) o sin conexión con su «Reintentar». -->
          <span class="conexion conexion--reconectando" data-zona="conexion" role="status"
            >Conectando…</span
          >
        </header>

        <div class="conversacion__cuerpo">
          <ol data-zona="mensajes"></ol>
          <!-- Cargando, en silencio o sin canal: lo pinta chat.js y desaparece con
               el primer mensaje. -->
          <div class="conversacion__estado" data-zona="sin-mensajes"></div>
        </div>

        <form id="formulario-chat" class="redactor-mensaje" novalidate>
          <div data-zona="aviso" hidden></div>

          <div class="redactor-mensaje__fila">
            <div class="campo redactor-mensaje__campo">
              <label class="campo__etiqueta solo-lectores" for="texto">Mensaje</label>
              <textarea
                class="campo__control redactor-mensaje__texto"
                id="texto"
                name="texto"
                rows="2"
                maxlength="500"
                placeholder="Escribe un mensaje…"
                required
              ></textarea>
            </div>
            <button class="boton boton--primario redactor-mensaje__enviar" type="submit">
              Enviar
            </button>
          </div>
          <p class="campo__pista redactor-mensaje__pista" id="pista-mensaje">
            Hasta 500 caracteres.
          </p>

          <!-- CA-02: compartir un logro de mision. Opcional, plegado por defecto. -->
          <details class="redactor-mensaje__logro">
            <summary class="t-etiqueta">Compartir un logro de misión</summary>
            <div class="fila">
              <div class="campo">
                <label class="campo__etiqueta" for="logroMision">Misión</label>
                <input class="campo__control" id="logroMision" name="logroMision" type="text" />
              </div>
              <div class="campo">
                <label class="campo__etiqueta" for="logroTitulo">Logro</label>
                <input class="campo__control" id="logroTitulo" name="logroTitulo" type="text" />
              </div>
            </div>
          </details>
        </form>
      </section>
    </main>

    <!--
      RF-CHA-001: el icono flotante del asistente va en todas las vistas.
      Lo monta `comun/ui/asistente.js`, que ademas le da comportamiento:
      hasta ahora el boton estaba copiado aqui y no hacia nada al pulsarlo.
    -->

    <script type="module">
      import { montarAsistente } from '../../comun/ui/asistente.js';
      import { montarVistaDeChat } from './chat.js';
      import { montarCabecera } from '../../comun/cabecera-app.js';
      import { exigirAcceso } from '../../comun/acceso.js';

      // Vista privada: sin sesion (o caducada) se va al login con vuelta aqui.
      if (!exigirAcceso('chat')) {
        throw new Error('sin sesion: redirigiendo al login');
      }
      // Cabecera unica de la aplicacion (HU-UX-001): navegacion, sesion y estado activo.
      montarCabecera(document.querySelector('[data-cabecera-app]'), {
        vista: 'chat',
        seccionActiva: 'jugar',
      });

      // UXC-6 — el chat general o el de la sala, y la pestaña de mensajes
      // privados (con su estado honesto mientras no haya servicio).
      montarVistaDeChat(document);

      // RF-CHA-001 / HU-CHA-001 CA-03: el icono responde y dice la verdad.
      montarAsistente(document);
    </script>
  </body>
</html>
