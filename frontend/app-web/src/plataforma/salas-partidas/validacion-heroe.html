<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verificación de héroe · The Nexus Battles VI</title>

    <!--
      Ejecucion INTEGRADA (Spring Boot sirve esta vista): la API vive en el
      mismo origen y no hay que declarar nada.
      Ejecucion ESTATICA para revision visual: no hay API detras y las vistas
      lo dicen con todas las letras. Para apuntarlas a un backend que corra
      en otro sitio, descomenta y ajusta:
      <meta name="nexus-api-base" content="http://127.0.0.1:8083" />
    -->

    <link rel="stylesheet" href="../../../../../shared/ui-kit/css/tokens.css" />
    <link rel="stylesheet" href="../../../../../shared/ui-kit/css/base.css" />
    <link rel="stylesheet" href="../../../../../shared/ui-kit/css/componentes.css" />
  </head>

  <body>
    <!--
      Pantalla 4 del sistema de diseno (nodo 24:105): cabecera, velo al 45 %
      sobre el contenido, dialogo centrado y chatbot.
    -->
    <div data-cabecera-app></div>

    <!-- En Figma el velo arranca por debajo de la cabecera, que queda nitida. -->
    <div class="velo velo--bajo-cabecera">
      <section id="validacion-heroe" class="dialogo dialogo--ancho pila"></section>
    </div>

    <!--
      RF-CHA-001: el icono flotante del asistente va en todas las vistas.
      Lo monta `comun/ui/asistente.js`, que ademas le da comportamiento:
      hasta ahora el boton estaba copiado aqui y no hacia nada al pulsarlo.
    -->

    <script type="module">
      import { montarAsistente } from '../../comun/ui/asistente.js';
      import { montarValidacionDeHeroe } from './validacion-heroe.js';
      import { verificarHeroe } from './cliente-salas.js';
      import { montarCabecera, exigirSesion } from '../../comun/cabecera-app.js';

      // Vista privada: sin sesion (o caducada) se va al login con vuelta aqui.
      if (!exigirSesion()) {
        throw new Error('sin sesion: redirigiendo al login');
      }
      // Cabecera unica de la aplicacion (HU-UX-001): navegacion, sesion y estado activo.
      montarCabecera(document.querySelector('[data-cabecera-app]'), { seccionActiva: 'jugar' });

      // Sin `?sala=` el modulo pinta su estado de error con la instruccion de
      // como llegar; no se llama al servicio con una sala inexistente.
      const idSala = new URLSearchParams(location.search).get('sala');

      montarValidacionDeHeroe(document.getElementById('validacion-heroe'), {
        idSala,
        // El puerto real. Hoy el servicio devuelve 404 en esta ruta porque
        // HU-SAL-003 espera a que el modulo de contenido publique cual es el
        // heroe activo del jugador; la vista muestra su estado de error en vez
        // de fingir un veredicto.
        verificar: (sala) => verificarHeroe(sala),
        // Vuelve a donde estaba; si se abrio directamente, al listado.
        alCancelar: () =>
          history.length > 1 ? history.back() : location.assign('./batallas.html'),
        alConfirmar: (verificacion) =>
          console.info('Accion principal del dialogo', verificacion.resultado),
      });

      // RF-CHA-001 / HU-CHA-001 CA-03: el icono responde y dice la verdad.
      montarAsistente(document);
    </script>
  </body>
</html>
