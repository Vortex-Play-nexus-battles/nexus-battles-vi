<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verificación de héroe · The Nexus Battles VI</title>

    <!--
      Ejecucion INTEGRADA (Spring Boot sirve esta vista): la API vive en el
      mismo origen y no hay que declarar nada.
      Ejecucion ESTATICA para revision visual: no hay API detras y las vistas
      lo dicen con todas las letras. Para apuntarlas a un backend que corra
      en otro sitio, descomenta y ajusta:
      <meta name="nexus-api-base" content="http://127.0.0.1:8083" />
    -->

    <link rel="stylesheet" href="../../../../../shared/ui-kit/css/tokens.css" />
    <link rel="stylesheet" href="../../../../../shared/ui-kit/css/base.css" />
    <link rel="stylesheet" href="../../../../../shared/ui-kit/css/componentes.css" />
  </head>

  <body>
    <!--
      Pantalla 4 del sistema de diseno (nodo 24:105): cabecera, velo al 45 %
      sobre el contenido, dialogo centrado y chatbot.
    -->
    <div data-cabecera-app></div>

    <!-- En Figma el velo arranca por debajo de la cabecera, que queda nitida. -->
    <div class="velo velo--bajo-cabecera">
      <section id="validacion-heroe" class="dialogo dialogo--ancho pila"></section>
    </div>

    <!--
      RF-CHA-001: el icono flotante del asistente va en todas las vistas.
      Lo monta `comun/ui/asistente.js`, que ademas le da comportamiento:
      hasta ahora el boton estaba copiado aqui y no hacia nada al pulsarlo.
    -->

    <script type="module">
      import { montarAsistente } from '../../comun/ui/asistente.js';
      import { montarValidacionDeHeroe, avisarFalloDeAccion } from './validacion-heroe.js';
      import { verificarHeroe, ingresarASala } from './cliente-salas.js';
      import { montarCabecera } from '../../comun/cabecera-app.js';
      import { exigirAcceso } from '../../comun/acceso.js';

      // Vista privada: sin sesion (o caducada) se va al login con vuelta aqui.
      if (!exigirAcceso('validacion-heroe')) {
        throw new Error('sin sesion: redirigiendo al login');
      }
      // Cabecera unica de la aplicacion (HU-UX-001): navegacion, sesion y estado activo.
      montarCabecera(document.querySelector('[data-cabecera-app]'), {
        vista: 'validacion-heroe',
        seccionActiva: 'jugar',
      });

      // Sin `?sala=` el modulo pinta su estado de error con la instruccion de
      // como llegar; no se llama al servicio con una sala inexistente.
      const parametros = new URLSearchParams(location.search);
      const idSala = parametros.get('sala');
      // FI-R6 · el codigo de una sala privada viaja con el enlace: quien llega
      // aqui desde el listado ya lo escribio una vez, y volver a pedirselo
      // seria hacerle repetir el mismo tramite.
      const codigoInvitacion = parametros.get('codigo')?.trim() || null;

      /** Equipar o cambiar de heroe se hace en el inventario. */
      const RUTA_INVENTARIO = '../../contenido/inventario/inventario.html';

      /**
       * Entra a la sala y va a ella, igual que el listado de batallas. Si el
       * servidor lo rechaza, la vista lo dice en su aviso: quedarse callado
       * seria volver al defecto que este bloque viene a quitar.
       */
      async function entrarALaSala() {
        try {
          const sala = await ingresarASala(idSala, { codigoInvitacion });
          location.assign(`./sala-batalla.html?sala=${encodeURIComponent(sala?.id ?? idSala)}`);
        } catch (error) {
          avisarFalloDeAccion(
            document.getElementById('validacion-heroe'),
            error?.problema?.detail ??
              error?.detalle ??
              'No pudimos entrar a la sala. Vuelve a intentarlo en un momento.',
          );
        }
      }

      montarValidacionDeHeroe(document.getElementById('validacion-heroe'), {
        idSala,
        // FI-R0 — este comentario decia que el servicio devolvia 404 aqui.
        // Ya no es cierto y probablemente llevaba tiempo sin serlo:
        // `SalasController` mapea `GET /salas/{id}/verificacion-heroe`, y dos
        // pruebas de extremo a extremo lo ejercitan con exito
        // (`sala-de-batalla.e2e.spec.js`, `zz-guion-de-demo.e2e.spec.js`).
        // Un comentario que miente sobre el backend es peor que ninguno:
        // justifico durante semanas que el boton de esta pantalla no hiciera
        // nada.
        verificar: (sala) => verificarHeroe(sala),
        // Vuelve a donde estaba; si se abrio directamente, al listado.
        //
        // FI-R6 — `history.back()` importa ahora mas que antes: a esta pantalla
        // se llega desde el listado, y «Cancelar» tiene que devolver a la
        // pagina y los filtros que la persona tenia puestos, no a un listado
        // recien cargado. Cuando se abre de cero (enlace pegado, pestana
        // nueva) no hay a donde volver y se va al listado.
        alCancelar: () =>
          history.length > 1 ? history.back() : location.assign('./batallas.html'),
        // UX-R4.5 — el boton principal solo escribia en la consola. Es el
        // mismo defecto que `batallas.html` ya se encontro y arreglo: «el
        // ingreso se aceptaba en el servidor y la persona se quedaba mirando
        // el listado sin saber que habia entrado». Aqui era peor, porque no
        // pasaba nada en absoluto y el boton es el primario de la pantalla.
        //
        // Cada variante lleva a donde dice su etiqueta. Ninguno de los tres
        // destinos se inventa: el inventario existe y es a donde se va a
        // equipar o cambiar de heroe, y entrar a la sala es `ingresarASala`,
        // que es por donde entra `batallas.html`. Lo que sigue pendiente de
        // HU-SAL-003 es el veredicto —`verificacion-heroe` esta en el
        // contrato pero no en el servicio—, no a donde ir con el.
        alConfirmar: (verificacion) => {
          if (verificacion.resultado === 'DISPONIBLE') {
            return entrarALaSala();
          }
          location.assign(RUTA_INVENTARIO);
          return undefined;
        },
      });

      // RF-CHA-001 / HU-CHA-001 CA-03: el icono responde y dice la verdad.
      montarAsistente(document);
    </script>
  </body>
</html>
