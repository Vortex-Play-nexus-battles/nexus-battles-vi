<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Batallas · The Nexus Battles VI</title>

    <!--
      Ejecucion INTEGRADA (Spring Boot sirve esta vista): la API vive en el
      mismo origen y no hay que declarar nada.
      Ejecucion ESTATICA para revision visual: no hay API detras y las vistas
      lo dicen con todas las letras. Para apuntarlas a un backend que corra
      en otro sitio, descomenta y ajusta:
      <meta name="nexus-api-base" content="http://127.0.0.1:8083" />
    -->

    <link rel="stylesheet" href="../../../../../shared/ui-kit/css/tokens.css" />
    <link rel="stylesheet" href="../../../../../shared/ui-kit/css/base.css" />
    <link rel="stylesheet" href="../../../../../shared/ui-kit/css/componentes.css" />
  </head>

  <body>
    <!--
      Cabecera de 64 px con los seis destinos de RF-INV-008 y el buscador de
      productos de RF-INV-004. Se repite en cada vista mientras no exista una
      forma acordada de compartir fragmentos de HTML sin framework.
    -->
    <div data-cabecera-app></div>

    <main id="vista-batallas" class="pagina pila">
      <header class="encabezado-pagina">
        <div class="pila pila--compacta">
          <h1>Batallas</h1>
          <p class="t-cuerpo" data-zona="subtitulo">Buscando batallas</p>
        </div>
        <div class="encabezado-pagina__acciones">
          <!--
            HU-JUE-015: el chat de la vista general, para cuadrar partidas. La
            vista existia (chat.html) pero nadie enlazaba a ella (#441).
          -->
          <a class="boton boton--secundario" href="./chat.html" data-zona="enlace-chat-general"
            >Chat general</a
          >
          <a class="boton boton--primario boton--grande" href="./crear-sala.html">CREAR SALA</a>
        </div>
      </header>

      <!--
        Dos filtros, los dos del contrato. El buscador que tenia la maqueta se
        elimino de Figma en HU-SAL-002: buscaba por un nombre de sala que se
        retiro en HU-SAL-001 y que ningun requisito pide.
      -->
      <div class="fila">
        <label class="campo">
          <span class="campo__etiqueta">Modalidad</span>
          <select class="campo__control" name="modalidad">
            <option value="">Modalidad: todas</option>
            <option value="UNO_CONTRA_UNO">1 contra 1</option>
            <option value="CONTRA_IA">Contra la IA</option>
            <option value="HASTA_SEIS">Hasta seis</option>
          </select>
        </label>

        <label class="campo">
          <span class="campo__etiqueta">Estado</span>
          <select class="campo__control" name="estado">
            <option value="">Estado: todos</option>
            <option value="ABIERTA">Abierta</option>
            <option value="LLENA">Llena</option>
            <option value="PRIVADA">Privada</option>
          </select>
        </label>
      </div>

      <!--
        HU-SAL-006: por que se volvio al listado (saliste, cancelaste, o el
        anfitrion cancelo y te devolvieron). Lo deja la sala de espera en
        sessionStorage y se muestra una sola vez.
      -->
      <div class="aviso" data-zona="aviso-sala" role="status" hidden>
        <p class="aviso__titulo" data-zona="aviso-sala-titulo"></p>
        <p class="t-cuerpo" data-zona="aviso-sala-detalle"></p>
      </div>

      <!-- RNF-USA-003: cargando, vacio y error comparten esta zona. -->
      <div class="estado-vista" data-zona="estado" role="status" aria-live="polite"></div>

      <!-- HU-DIS-003: «Seccion degradada» cuando entrar a una sala no se puede
           comprobar porque el inventario no responde. El listado se queda. -->
      <div data-zona="degradacion" data-seccion="Inventario" hidden></div>

      <!--
        Estado del canal en tiempo real (HU-SAL-002, criterio 3). Se dice con
        todas las letras si esta conectado o no, en vez de dejar que la persona
        adivine por que una sala no cambia.
      -->
      <p class="t-meta" data-zona="canal" role="status" aria-live="polite" hidden></p>

      <div class="rejilla-salas" data-zona="salas" hidden></div>

      <nav class="paginacion" data-zona="paginacion" aria-label="Paginas del listado" hidden></nav>
    </main>

    <!--
      RF-CHA-001: el icono flotante del asistente va en todas las vistas.
      Lo monta `comun/ui/asistente.js`, que ademas le da comportamiento:
      hasta ahora el boton estaba copiado aqui y no hacia nada al pulsarlo.
    -->

    <script type="module">
      import { montarAsistente } from '../../comun/ui/asistente.js';
      import { montarBatallas, mostrarAvisoDeSala } from './batallas.js';
      import { urlDelCanal } from './canal-sala.js';
      import { baseDeApi } from './cliente-salas.js';
      import { recogerAvisoDelListado } from './sala-de-espera.js';
      // Canal del servicio: `cliente-chat.js` pone el JWT en el CONNECT sobre el
      // transporte STOMP comun de `src/comun/transporte-stomp.js` (#351).
      import { conectarChat } from './cliente-chat.js';
      import { montarCabecera, exigirSesion } from '../../comun/cabecera-app.js';

      // Vista privada: sin sesion (o caducada) se va al login con vuelta aqui.
      if (!exigirSesion()) {
        throw new Error('sin sesion: redirigiendo al login');
      }
      // Cabecera unica de la aplicacion (HU-UX-001): navegacion, sesion y estado activo.
      montarCabecera(document.querySelector('[data-cabecera-app]'), { seccionActiva: 'jugar' });

      // El mismo token que adjunta `src/comun/interceptors/http-error.interceptor.js`
      // a cada peticion HTTP. Sin sesion no hay canal, y la vista lo dice.
      const token = sessionStorage.getItem('nexus.token');

      // HU-SAL-006: si se viene de salir o de una cancelacion, se dice.
      mostrarAvisoDeSala(document, recogerAvisoDelListado(sessionStorage));

      montarBatallas(document.getElementById('vista-batallas'), {
        conectarCanal: () =>
          token
            ? conectarChat({ url: urlDelCanal({ base: baseDeApi() }), token })
            : Promise.resolve(null),
        // Entrar lleva a la sala. Antes esto solo escribia en la consola, asi
        // que el ingreso se aceptaba en el servidor y la persona se quedaba
        // mirando el listado sin saber que habia entrado.
        alEntrar: (sala) => {
          globalThis.location.href = `./sala-batalla.html?sala=${encodeURIComponent(sala.id)}`;
        },
      });

      // RF-CHA-001 / HU-CHA-001 CA-03: el icono responde y dice la verdad.
      montarAsistente(document);
    </script>
  </body>
</html>
