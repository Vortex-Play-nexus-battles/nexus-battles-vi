asyncapi: 3.0.0

# =============================================================================
# Nexus Battles VI — Canal en tiempo real de salas y partidas
#
# Regla 1 de plataforma: contrato primero. Este documento describe los destinos
# STOMP sobre WebSocket por los que viaja el combate turno a turno.
#
# Lo que NO esta aqui: la creacion, el listado y el ingreso a la sala, que son
# peticiones HTTP y viven en contracts/openapi/salas-partidas.yaml.
#
# Trazabilidad:
#   RF-JUE-004  Modalidades de partida
#   RF-JUE-009  Barra de progreso de vida con valor numerico y umbrales 60/40
#   RF-JUE-015  Chat de salas y de vista general   → ver AVISO DE PROPIEDAD
#   RF-JUE-017  Interfaz de combate: turno en curso, efectos por icono
#
# Salidas exigidas por el PDF de requisitos, seccion 3.1:
#   "Sala creada o unida, orden de turnos, barra de vida actualizada con su
#    codigo de color, turno en curso, resultado de la partida, creditos
#    repartidos y cofres otorgados."
#
# ---------------------------------------------------------------------------
# AVISO DE PROPIEDAD — chat (HU-JUE-015)
#
# Los destinos de chat corresponden a HU-JUE-015, cuyo responsable es
# Alexander Nino. Comparten la sala y el broker STOMP con HU-SAL-001..005, y
# el esquema de sus mensajes lo fijo su dueno en esta version: ya no es una
# propuesta de encaje.
#
# NO fusionar cambios a los destinos de chat sin aprobacion de Alexander Nino.
# ---------------------------------------------------------------------------
# =============================================================================

info:
  title: Nexus Battles VI — Canal de salas y partidas
  version: 1.7.0
  description: |
    Canal WebSocket + STOMP del modulo `salas-partidas`.

    **1.7.0 (auditoria del 4-oct) — cada golpe dice a quien y por que.
    Aditivo.** `accionResuelta` gana `idObjetivo` (a quien apunto la accion) y,
    en cada afectado, `causas`: por que cambio su vida, tal como lo anoto el
    motor (`DANO`, `REFLEJO`, `SANACION`, `DANO_POR_TURNO`...). Un jugador veia
    bajar su propia barra en el mismo aviso de su ataque —el contragolpe de la
    maquina llega en la misma rafaga, y los Pinchos de escudo o Toma y lleva le
    devuelven dano— y el registro lo contaba como «X golpea a X»: parecia que
    atacar le hacia dano a si mismo. Con `REFLEJO` y su `origen`, la vista dice
    quien se lo devolvio. El servidor, ademas, entrega los avisos de una sesion
    en el orden en que se publicaron.

    **1.6.0 (auditoria de DEV del 30-sep) — chat sin dibujos ni inundaciones.
    Aditivo.** Ningun destino ni esquema cambia. Antes de la lista negra, el
    texto de `enviarChat` y `enviarChatGeneral` se depura (Unicode NFKC, sin
    caracteres de control ni de formato invisibles, los saltos de linea en
    una sola forma) y se rechaza con `errorDeCanal` `type` `mensaje-invalido`
    (400) si tiene demasiadas lineas, una racha larga del mismo caracter o, en
    un texto largo, casi solo simbolos; el `detail` explica cual. Y quien
    escribe mas deprisa de lo admitido recibe `errorDeCanal` `type`
    `demasiados-mensajes` (429), el mismo de los mensajes privados. Los
    valores son provisionales (D-37) y viven en la configuracion del servicio.

    **1.5.0 (B7, BACKEND-09) — combate contractual. Aditivo.** El combate usa
    el heroe real y las reglas de la seccion 6: `codigoAccion` admite las
    acciones de la Tabla 7 y las epicas de la Tabla 20 por su nombre, y el
    servidor valida poder, carga y objetivo (un rechazo llega por la cola
    privada como `errorDeCanal` con `type` `accion-no-permitida`). Los mensajes
    del combate ganan campos opcionales: poder, cargas, acciones disponibles y
    efectos activos (`turnoCambiado`, `accionResuelta`, `partidaIniciada`),
    el detalle auditable de la tirada (`accionResuelta.accion.ataque`) y el
    `resultado` formal del final. El orden de turnos se sortea al empezar.
    Los efectos que actuan al empezar un turno (sangrados, sanaciones por
    turno) se anuncian como `accionResuelta` con `accion.codigo`
    `EFECTO_POR_TURNO`.

    Convenciones:
      - Prefijo de suscripcion (servidor → cliente): `/tema`
      - Prefijo de envio (cliente → servidor):       `/app`
      - Cola privada de un usuario:                  `/usuario/cola`

    Todo mensaje propaga el identificador de traza en la cabecera `traceparent`
    (regla 5 de plataforma).

    Los errores que viajan por el canal usan el mismo formato problem details
    que la API HTTP (regla 4), para que la interfaz los pinte con el mismo
    componente `Aviso`. Ver `shared/ui-kit/MAPEO-ERRORES.md`.

    1.4.1 (B6, autorizacion del broker; ningun destino ni mensaje cambia): el
    servidor solo acepta `SEND` a destinos `/app/**` (un `SEND` directo a
    `/tema/**`, `/cola/**` o `/usuario/**` se rechaza con un frame `ERROR`:
    antes el broker lo reenviaba sin pasar por lista negra, sancion ni
    historial) y solo admite `SUBSCRIBE` a los destinos de este documento, a
    `/usuario/cola/**` y a los de `mensajes-directos.yaml`, en forma canonica
    (sin comodines `*`/`**`, sin `//` ni `..`). La regla de sala privada de
    `salaEstado` se aplica tambien al `SEND` de `enviarChat` y a la
    suscripcion de `historialDeSala`; las salas publicas no cambian.
    `partidaEstado` solo lo siguen los participantes de la partida.
  license:
    name: Uso academico — Proyecto Integrador II, UPB Bucaramanga

servers:
  local:
    host: localhost:8084
    protocol: ws
    pathname: /ws
    description: Entorno local de desarrollo
  desplegado:
    host: api.nexusbattles.local
    protocol: wss
    pathname: /salas-partidas/ws
    description: Entorno desplegado
    security:
      - $ref: '#/components/securitySchemes/keycloak'

channels:

  salaEstado:
    address: '/tema/salas/{idSala}'
    title: Estado de la sala
    description: |
      Cambios en la sala mientras se llena y antes de comenzar: quien entra,
      quien sale, quien esta listo, y la cancelacion por el anfitrion.
      Alimenta la vista de sala de espera y, mientras esta no exista, las
      tarjetas del listado de Batallas.

      Autorizacion de la suscripcion (HU-SAL-002). Estar autenticado no
      basta: el servidor decide frame a frame de SUBSCRIBE.
        - Sala publica: cualquier jugador autenticado, este dentro o no. Lo
          que viaja por aqui es lo mismo que muestra el listado publico.
        - Sala privada: solo sus participantes. Cualquier otro recibe un
          frame ERROR y la suscripcion no se registra.
        - Sala inexistente: ERROR.
      La regla cubre todo lo que cuelga de `/tema/salas/{idSala}`, incluido
      `/tema/salas/{idSala}/chat`.
    parameters:
      idSala:
        description: Identificador de la sala
    messages:
      participanteIngreso:
        $ref: '#/components/messages/ParticipanteIngreso'
      participanteSalio:
        $ref: '#/components/messages/ParticipanteSalio'
      salaCancelada:
        $ref: '#/components/messages/SalaCancelada'
      partidaIniciada:
        $ref: '#/components/messages/PartidaIniciada'

  partidaEstado:
    address: '/tema/partidas/{idPartida}'
    title: Avance del combate
    description: |
      Estado del combate turno a turno. Es el canal que pinta la vista de
      batalla: vida, turno en curso y efectos activos.

      Desde 1.4.1 solo se suscriben los participantes de la partida; a
      cualquier otro, o a una partida que no existe, el servidor le responde
      con un frame `ERROR` y la suscripcion no se registra.
    parameters:
      idPartida:
        description: Identificador de la partida
    messages:
      partidaIniciada:
        $ref: '#/components/messages/PartidaIniciada'
      turnoCambiado:
        $ref: '#/components/messages/TurnoCambiado'
      accionResuelta:
        $ref: '#/components/messages/AccionResuelta'
      partidaFinalizada:
        $ref: '#/components/messages/PartidaFinalizada'

  accionDelJugador:
    address: '/app/partidas/{idPartida}/acciones'
    title: Accion del jugador
    description: |
      Envio de la accion del turno. El servidor valida que sea el turno de
      quien envia; si no lo es, responde por la cola privada con un error en
      formato problem details.
    parameters:
      idPartida:
        description: Identificador de la partida
    messages:
      ejecutarAccion:
        $ref: '#/components/messages/EjecutarAccion'

  colaPrivada:
    address: '/usuario/cola/salas'
    title: Respuestas dirigidas a un solo jugador
    description: |
      Errores y confirmaciones que solo conciernen a quien envio la accion.
      No se difunden al resto de la sala.
    messages:
      errorDeCanal:
        $ref: '#/components/messages/ErrorDeCanal'

  # ---------------------------------------------------------------------------
  # PROPIEDAD DE HU-JUE-015 — Alexander Nino. Propuesta de encaje, no cerrada.
  # ---------------------------------------------------------------------------
  chatDeSala:
    address: '/tema/salas/{idSala}/chat'
    title: Chat de la sala (HU-JUE-015)
    description: |
      Mensajes del chat de la sala (RF-JUE-015). El PDF exige entregar los
      mensajes a los participantes, conservar el historial y filtrar el
      contenido segun las politicas — el filtrado se apoya en la lista negra
      de HU-ADM-002.

      Los errores de envio (jugador silenciado, contenido bloqueado, filtro
      no disponible, mensaje invalido, demasiados mensajes) no se difunden:
      vuelven a quien escribio por /usuario/cola/salas como errorDeCanal
      (CA-03).
    parameters:
      idSala:
        description: Identificador de la sala
    messages:
      mensajeDeChat:
        $ref: '#/components/messages/MensajeDeChat'

  enviarChat:
    address: '/app/salas/{idSala}/chat'
    title: Envio de mensaje de chat (HU-JUE-015)
    description: Envio desde la sala. El texto pasa por la lista negra antes de salir al canal.
    parameters:
      idSala:
        description: Identificador de la sala
    messages:
      enviarMensaje:
        $ref: '#/components/messages/EnviarMensaje'

  chatGeneral:
    address: '/tema/chat/general'
    title: Chat de la vista general (HU-JUE-015)
    description: |
      Conversacion de la vista general, para cuadrar partidas y buscar con
      quien jugar. Mismas reglas que el chat de sala: filtro de la lista
      negra de HU-ADM-002 y silencio por sancion (RF-USR-004).
    messages:
      mensajeDeChat:
        $ref: '#/components/messages/MensajeDeChat'

  enviarChatGeneral:
    address: '/app/chat/general'
    title: Envio de mensaje al chat general (HU-JUE-015)
    messages:
      enviarMensaje:
        $ref: '#/components/messages/EnviarMensaje'

  historialDeSala:
    address: '/app/salas/{idSala}/chat/historial'
    title: Historial del chat de la sala (HU-JUE-015)
    description: |
      Al suscribirse, el servidor responde una sola vez a esa conexion con
      los ultimos mensajes de la sala, para que quien entra despues se ponga
      al dia. La suscripcion en vivo sigue siendo /tema/salas/{idSala}/chat.
    parameters:
      idSala:
        description: Identificador de la sala
    messages:
      historialDeChat:
        $ref: '#/components/messages/HistorialDeChat'

  historialGeneral:
    address: '/app/chat/general/historial'
    title: Historial del chat general (HU-JUE-015)
    messages:
      historialDeChat:
        $ref: '#/components/messages/HistorialDeChat'

operations:

  recibirEstadoDeSala:
    action: receive
    channel:
      $ref: '#/channels/salaEstado'
    summary: El cliente se suscribe al estado de la sala mientras espera

  recibirEstadoDePartida:
    action: receive
    channel:
      $ref: '#/channels/partidaEstado'
    summary: El cliente se suscribe al avance del combate

  enviarAccion:
    action: send
    channel:
      $ref: '#/channels/accionDelJugador'
    summary: El cliente envia su accion cuando es su turno

  recibirErrores:
    action: receive
    channel:
      $ref: '#/channels/colaPrivada'
    summary: El cliente recibe los errores que solo le conciernen

  recibirChat:
    action: receive
    channel:
      $ref: '#/channels/chatDeSala'
    summary: 'HU-JUE-015 — dueno Alexander Nino'

  enviarMensajeDeChat:
    action: send
    channel:
      $ref: '#/channels/enviarChat'
    summary: 'HU-JUE-015 — dueno Alexander Nino'

  recibirChatGeneral:
    action: receive
    channel:
      $ref: '#/channels/chatGeneral'
    summary: 'HU-JUE-015'

  enviarMensajeAlChatGeneral:
    action: send
    channel:
      $ref: '#/channels/enviarChatGeneral'
    summary: 'HU-JUE-015'

  recibirHistorialDeSala:
    action: receive
    channel:
      $ref: '#/channels/historialDeSala'
    summary: 'HU-JUE-015 — respuesta unica al suscribirse'

  recibirHistorialGeneral:
    action: receive
    channel:
      $ref: '#/channels/historialGeneral'
    summary: 'HU-JUE-015 — respuesta unica al suscribirse'

components:

  securitySchemes:
    keycloak:
      type: openIdConnect
      openIdConnectUrl: /realms/nexus-battles/.well-known/openid-configuration
      description: |
        El token viaja en la cabecera `Authorization` del CONNECT de STOMP.
        Si caduca durante la partida el servidor emite `errorDeCanal` con
        `type` de sesion caducada y cierra la conexion.

  messages:

    ParticipanteIngreso:
      name: participanteIngreso
      title: Un jugador entro a la sala
      description: |
        Simetrico con `participanteSalio`: lleva el HECHO —quien entro y cuanta
        ocupacion queda—, no la ficha del participante. Entrar y salir son la
        misma accion en espejo y no hay requisito que justifique que una
        necesite mas identidad que la otra.

        NO usa el esquema `Participante` a proposito. Ese exige `vidaActual` y
        `vidaMaxima`, que la sala de espera no muestra por ninguna parte y que
        no existen hasta que empieza el combate (RF-JUE-009, Pantalla 3). Se
        reutilizaba por comodidad, no por requisito.

        El detalle del roster que si pinta la Pantalla 5 —apodo, nombre del
        heroe y nivel— llega con HU-SAL-003, que es quien verifica y por tanto
        conoce el heroe equipado. Hasta entonces el cliente lo resuelve con
        `GET /salas/{idSala}`.
      payload:
        type: object
        required: [tipo, idSala, idJugador, ocupacion]
        properties:
          tipo: { const: 'sala.participante.ingreso' }
          idSala: { type: string, format: uuid }
          idJugador: { type: string, format: uuid }
          ocupacion: { $ref: '#/components/schemas/Ocupacion' }

    ParticipanteSalio:
      name: participanteSalio
      title: Un jugador abandono la sala
      payload:
        type: object
        required: [tipo, idSala, idJugador, ocupacion]
        properties:
          tipo: { const: 'sala.participante.salio' }
          idSala: { type: string, format: uuid }
          idJugador: { type: string, format: uuid }
          ocupacion: { $ref: '#/components/schemas/Ocupacion' }

    SalaCancelada:
      name: salaCancelada
      title: El anfitrion cancelo la sala
      description: |
        La interfaz saca a todos de la sala de espera y devuelve al listado,
        informando del motivo. Los creditos comprometidos se devuelven.
      payload:
        type: object
        required: [tipo, idSala, motivo]
        properties:
          tipo: { const: 'sala.cancelada' }
          idSala: { type: string, format: uuid }
          motivo:
            type: string
            enum: [CANCELADA_POR_ANFITRION, INACTIVIDAD, ERROR_DEL_SISTEMA]
          creditosDevueltos: { type: integer, minimum: 0 }

    PartidaIniciada:
      name: partidaIniciada
      title: La sala se lleno y comenzo el combate
      description: |
        Trae el orden de turnos, que el PDF exige como salida.

        Viaja por DOS canales a proposito. Por `partidaEstado` para quien ya
        esta en el combate, y por `salaEstado` porque quien espera en la sala
        todavia no conoce `idPartida` y por tanto no puede estar suscrito al
        tema de la partida: sin el aviso por la sala, el anfitrion entraria al
        combate y los demas se quedarian mirando la lista de participantes.

        `participantes` YA SE EMITE (P2.4). La puerta de heroe de SCRUM-1074
        guarda el heroe validado al entrar a la sala, asi que el aviso trae la
        ficha completa y la vista de batalla pinta la barra de vida real
        (RF-JUE-009) sin una segunda peticion.

        `Participante.heroe` es anulable a proposito, y desde HU-SAL-004 queda
        un solo caso legitimo sin heroe: un participante que entro antes de la
        migracion V7. Se dice con null en vez de inventar una vida: una barra a
        100/100 falsa es peor que una barra que no se pinta.

        La IA SI trae heroe. Desde 1.5.0 es un HEROE ALEATORIO del catalogo
        (§7.6: «si se incluye un heroe aleatorio controlado por la IA»), sin
        sanadores, en el nivel del heroe del anfitrion y sin equipamiento
        (D-B7-11); si el catalogo no responde al empezar, combate con una copia
        del heroe del anfitrion, como antes.

        `ordenDeTurnos` (1.5.0) es un SORTEO entre todos los participantes al
        empezar (§6.1.3: «El orden de los turnos para la primera ronda se
        determina aleatoriamente entre todos los participantes y se mantiene
        invariable hasta la conclusion del combate»), con una semilla que la
        partida guarda. Ya no abre siempre el anfitrion.

        `posicionEnCampo` sigue sin emitirse (D-B7-19).
      payload:
        type: object
        required: [tipo, idSala, idPartida, ordenDeTurnos, turnoActual, participantes]
        properties:
          tipo: { const: 'sala.partida.iniciada' }
          idSala: { type: string, format: uuid }
          idPartida: { type: string, format: uuid }
          ordenDeTurnos:
            type: array
            description: Identificadores de jugador en el orden en que jugaran.
            items: { type: string, format: uuid }
          turnoActual:
            type: object
            description: |
              Quien abre el combate. Es siempre el primero de `ordenDeTurnos`;
              viaja aparte para que la vista no tenga que deducirlo y para que
              el mensaje tenga la misma forma que `turnoCambiado`.
            required: [idJugador, numeroTurno]
            properties:
              idJugador: { type: string, format: uuid }
              numeroTurno: { type: integer, minimum: 1 }
          participantes:
            type: array
            items: { $ref: '#/components/schemas/Participante' }

    TurnoCambiado:
      name: turnoCambiado
      title: Cambio el turno
      description: |
        Desde 1.5.0 trae el estado de quien juega ahora YA con lo que ocurre al
        empezar su turno (+2 de poder, efectos por turno): su poder, sus
        cargas, sus efectos y las acciones que puede jugar, calculadas por el
        motor de combate.
      payload:
        type: object
        required: [tipo, idPartida, idJugador, numeroTurno]
        properties:
          tipo: { const: 'partida.turno.cambiado' }
          idPartida: { type: string, format: uuid }
          idJugador: { type: string, format: uuid }
          numeroTurno: { type: integer, minimum: 1 }
          segundosParaJugar:
            type: [integer, 'null']
            description: |
              Cuenta atras del turno. Nula mientras el Product Owner no fije
              `salas.partidas.segundos-por-turno` (D-B7-14).
          motivo:
            type: [string, 'null']
            enum: [ACCION, TIEMPO_AGOTADO, TURNO_PERDIDO, null]
            description: (1.5.0) Por que paso el turno. `TIEMPO_AGOTADO` si se acabo el tiempo sin accion.
          poderActual: { type: [integer, 'null'], minimum: 0 }
          poderMaximo: { type: [integer, 'null'], minimum: 0 }
          recargas:
            type: object
            additionalProperties: { type: integer, minimum: 1 }
          efectosActivos:
            type: array
            items: { $ref: '#/components/schemas/Efecto' }
          acciones:
            type: array
            description: (1.5.0) Lo que puede jugar quien tiene el turno, y por que no lo demas.
            items: { $ref: '#/components/schemas/EstadoDeAccion' }

    AccionResuelta:
      name: accionResuelta
      title: Se resolvio una accion de combate
      description: |
        Lleva la vida resultante de cada heroe afectado. La barra de vida
        muestra siempre el valor numerico junto al color (RF-JUE-009): por eso
        viajan `vidaActual` y `vidaMaxima`, y NUNCA un color. El umbral de
        color lo aplica el cliente con `--vida-umbral-alto` (60) y
        `--vida-umbral-medio` (40).
      payload:
        type: object
        required: [tipo, idPartida, idEjecutor, accion, afectados]
        properties:
          tipo: { const: 'partida.accion.resuelta' }
          idPartida: { type: string, format: uuid }
          idEjecutor: { type: string, format: uuid }
          idObjetivo:
            type: [string, 'null']
            format: uuid
            description: |
              (1.7.0) A quien apunto la accion: el rival de un ataque, el
              companero de una sanacion. Nulo en un efecto por turno
              (`EFECTO_POR_TURNO`) o si el motor no lo dijo. Un ataque nunca
              apunta a su ejecutor ni a un companero de su equipo (§6.1.3).
          accion:
            type: object
            required: [codigo, nombre]
            properties:
              codigo:
                type: string
                description: |
                  La accion que SE JUGO: la que pidio el jugador
                  (`EjecutarAccion.codigoAccion`) o `ATAQUE_BASICO` si no pidio
                  ninguna. Desde 1.5.0 puede ser distinta de la pedida
                  (`accionPedida`) cuando falto poder y el turno se jugo con
                  el valor base (§6.1.1). `EFECTO_POR_TURNO` cuando no es una
                  accion sino un efecto que actuo al empezar un turno
                  (sangrado, sanacion por turno); entonces `idEjecutor` es
                  quien lo causo y `nombre` el efecto.
              nombre:
                type: string
                description: |
                  En un ataque, la categoria que sorteo el motor
                  (`CategoriaEfecto` de motor-combate.yaml: CAUSAR_DANO,
                  CAUSAR_DANO_CRITICO, EVADIR_EL_GOLPE, RESISTIR_EL_GOLPE,
                  ESCAPAR_AL_GOLPE, SIN_EFECTO). La interfaz la reconoce por su
                  valor y la narra (UXC-2). En una defensa, una sanacion o un
                  efecto por turno, el nombre de la accion o del efecto.
              icono:
                type: [string, 'null']
                description: Todos los efectos y controles se representan con icono (RF-JUE-017).
              accionPedida:
                type: [string, 'null']
                description: (1.5.0) La que pidio el jugador, si no es la que se jugo.
              enValorBase:
                type: boolean
                description: '(1.5.0) Falto poder, la accion no se ejecuto y el ataque se redujo a su valor base (§6.1.1).'
              tipo:
                type: [string, 'null']
                enum: [ATAQUE, DEFENSA, SANACION, SANACION_GRUPAL, REANIMACION, APOYO, EFECTO, null]
              esEpica: { type: boolean }
              potenciada:
                type: boolean
                description: (1.5.0) Epica jugada por su tipo de heroe afin (efecto epico de la Tabla 20).
              ataque:
                type: [object, 'null']
                description: (1.5.0) La tirada, para que el combate sea auditable.
                properties:
                  ataqueResuelto: { type: integer }
                  defensaObjetivo: { type: integer }
                  acierta: { type: boolean }
                  indiceTabla: { type: [integer, 'null'] }
                  porcentajeDano: { type: [integer, 'null'] }
          afectados:
            type: array
            items:
              type: object
              required: [idJugador, vidaActual, vidaMaxima]
              properties:
                idJugador: { type: string, format: uuid }
                vidaActual: { type: integer, minimum: 0 }
                vidaMaxima: { type: integer, minimum: 1 }
                diferencia:
                  type: integer
                  description: Negativo si es dano, positivo si es curacion.
                efectosActivos:
                  type: array
                  items: { $ref: '#/components/schemas/Efecto' }
                poderActual:
                  type: [integer, 'null']
                  minimum: 0
                  description: (1.5.0) Poder tras la accion (el ejecutor gasta; algunas epicas y objetos quitan poder).
                poderMaximo: { type: [integer, 'null'], minimum: 0 }
                recargas:
                  type: object
                  additionalProperties: { type: integer, minimum: 1 }
                  description: (1.5.0) Acciones en carga y turnos propios que les faltan.
                causas:
                  type: array
                  description: |
                    (1.7.0) Por que cambio la vida de este afectado, en el
                    orden en que lo anoto el motor (esquema `Evento` de
                    motor-combate.yaml). Vacia si no cambio. Una `diferencia`
                    negativa del propio `idEjecutor` en un ataque solo puede
                    venir de un `REFLEJO`: el dano que le devolvio el
                    objetivo (Pinchos de escudo, Toma y lleva), nunca de su
                    propio golpe.
                  items:
                    type: object
                    required: [tipo]
                    properties:
                      tipo:
                        type: string
                        enum: [DANO, REFLEJO, SANACION, DANO_POR_TURNO, SANACION_POR_TURNO, REANIMACION]
                      origen:
                        type: [string, 'null']
                        format: uuid
                        description: Quien lo causo (el atacante de un DANO, el defensor de un REFLEJO)
                      efecto:
                        type: [string, 'null']
                        description: La accion, el objeto o la epica que lo causo
                      cantidad: { type: [integer, 'null'], minimum: 0 }

    PartidaFinalizada:
      name: partidaFinalizada
      title: Termino la partida
      description: |
        Cubre las salidas que exige el PDF: resultado de la partida, creditos
        repartidos y cofres otorgados. Alimenta la vista de resultado, que
        RF-JUE-017 pide de alto impacto.
      payload:
        type: object
        # `reparto` es OPCIONAL. Desde HU-JUE-014 (1.1.0) `salas-partidas` SI
        # lo emite, y lo que lleva es el resultado neto de la APUESTA por
        # participante: negativo si perdio lo apostado, positivo si se llevo lo
        # de los demas, cero si se le devolvio (empate, o partida contra la
        # maquina). NO incluye la recompensa por jugar (2/4 creditos al ganador,
        # 1 por participar) ni los cofres: eso es HU-JUE-012 y lo reparte
        # ms-finanzas; `experiencia` y `cofre` viajan nulos/ausentes por eso.
        #
        # Se OMITE en dos casos: la partida no tenia apuesta, y el libro de
        # creditos no respondio al terminar (CA-06). En el segundo, el mismo
        # mensaje se vuelve a emitir CON reparto cuando la liquidacion se
        # cierra; la interfaz no debe tratarlo como duplicado.
        #
        # `recompensa` (1.4.0, HU-JUE-012) es OPCIONAL y es la otra cosa que el
        # PDF pide en este mensaje: los creditos por JUGAR (2 al ganador de un
        # uno contra uno, 4 a cada ganador de una grupal, 1 por participar) y
        # el cofre si toco uno, tal cual los acredito ms-finanzas. Solo humanos
        # no sancionados. Se OMITE si el libro no respondio (queda pendiente y
        # el mensaje vuelve a salir con ella) y si ya se anuncio antes. Es
        # independiente de `reparto`: puede venir una, la otra, las dos o
        # ninguna, y la interfaz las suma por separado.
        required: [tipo, idPartida, ganadores]
        properties:
          tipo: { const: 'partida.finalizada' }
          idPartida: { type: string, format: uuid }
          ganadores:
            type: array
            description: |
              Quien gano: el heroe en pie o —en el modo cooperativo de
              RF-JUE-004 (HU-SAL-004, 1.2.0)— todos los del equipo ganador,
              desde 1.5.0 tambien los que cayeron (gana el equipo, D-B7-15).
              Vacio si nadie quedo en pie (empate).
            items: { type: string, format: uuid }
          resultado:
            type: string
            enum: [GANADOR, EMPATE]
            description: (1.5.0) El final formal de la partida.
          equipoGanador:
            type: integer
            minimum: 1
            description: |
              Solo en el modo cooperativo (1.2.0): el equipo que gano. Ausente
              en todos contra todos. Con equipo ganador de mas de uno en pie
              `reparto`, si hay apuesta, devuelve lo apostado a todos: el
              reparto entre companeros es una decision pendiente del PO
              (D-12 en docs/gobierno/DECISIONES-PENDIENTES-DEL-PO.md).
          reparto:
            type: array
            items:
              type: object
              required: [idJugador, creditos]
              properties:
                idJugador: { type: string, format: uuid }
                creditos:
                  type: integer
                  description: Creditos repartidos. Negativo si perdio lo apostado.
                experiencia: { type: [integer, 'null'] }
                cofre:
                  type: [object, 'null']
                  description: Cofre otorgado, si corresponde.
                  properties:
                    id: { type: string }
                    nombre: { type: string }
                    rareza: { type: string }
          recompensa:
            type: array
            description: Creditos por jugar acreditados por el libro (HU-JUE-012, 1.4.0).
            items:
              type: object
              required: [idJugador, creditos, ganador]
              properties:
                idJugador: { type: string, format: uuid }
                creditos:
                  type: integer
                  minimum: 0
                  description: 2, 4 o 1. Nunca negativo.
                ganador:
                  type: boolean
                  description: Si los recibio por ganar (true) o por participar (false).
                cofre:
                  type: string
                  format: uuid
                  description: Cofre entregado con estos creditos (RF-JUE-013), si toco uno.

    EjecutarAccion:
      name: ejecutarAccion
      title: El jugador ejecuta su accion
      description: |
        El cliente solo elige accion y objetivo; el servidor valida todo lo
        demas (1.5.0): que sea su turno, que la accion sea de su heroe y este
        desbloqueada en su nivel, que no este en carga, que el objetivo valga
        (nunca un companero en un ataque) y que un sanador no ataque. Sin poder
        suficiente la accion no se ejecuta y el turno se juega con el valor
        base (§6.1.1). Un rechazo vuelve por la cola privada con `type`
        `accion-no-permitida` y el turno sigue siendo del jugador. Dos acciones
        simultaneas del mismo turno aplican una sola: la otra recibe `type`
        `partida-modificada` (bloqueo optimista).
      payload:
        type: object
        required: [codigoAccion]
        properties:
          codigoAccion:
            type: string
            description: |
              `ATAQUE_BASICO`, `SANACION_BASICA` (sanadores), el nombre de una
              accion de la Tabla 7 o de una epica de la Tabla 20, tal como
              aparece en `acciones` del heroe.
          idObjetivo:
            type: [string, 'null']
            format: uuid
            description: Objetivo de la accion, si la accion lo requiere.

    ErrorDeCanal:
      name: errorDeCanal
      title: Error dirigido a un solo jugador
      description: |
        Mismo formato que los errores HTTP (regla 4). La interfaz lo pinta con
        el componente `Aviso` aplicando `shared/ui-kit/MAPEO-ERRORES.md`.

        Desde 1.3.0 (HU-DIS-003): si el motor de combate no responde cuando
        el jugador juega su turno, llega por aqui el mismo problem detail que
        produce la API HTTP para una dependencia caida — `type`
        `seccion-no-disponible`, `status` 503, `seccion` («Motor de combate»),
        `reintentarEnSegundos` y `dependencia`. La accion no se aplico y el
        turno sigue siendo del jugador; la interfaz pinta `Seccion degradada`
        (MAPEO-ERRORES §5.5) sobre los controles de combate, con reintentar, y
        el resto de la vista (barras de vida, chat, sala) sigue.
      payload:
        $ref: '#/components/schemas/ProblemDetail'

    # -- HU-JUE-015 · dueno Alexander Nino · esquema cerrado ------------------
    MensajeDeChat:
      name: mensajeDeChat
      title: Mensaje del chat (HU-JUE-015)
      description: |
        Un mensaje ya aceptado: paso el filtro de la lista negra y su autor
        no esta silenciado. No existe una version "filtrada" del mensaje
        porque CA-03 pide bloquear sin entregar, no censurar por partes.
      payload:
        $ref: '#/components/schemas/MensajeDeChat'

    EnviarMensaje:
      name: enviarMensaje
      title: Envio de un mensaje al chat (HU-JUE-015)
      payload:
        type: object
        required: [texto]
        properties:
          texto: { type: string, minLength: 1, maxLength: 500 }
          logro:
            type: [object, 'null']
            description: Presente para compartir un logro de mision (CA-02).
            required: [mision, titulo]
            properties:
              mision: { type: string }
              titulo: { type: string }

    HistorialDeChat:
      name: historialDeChat
      title: Historial de la sesion del chat (HU-JUE-015)
      description: |
        Respuesta unica a la suscripcion de historial: los ultimos mensajes
        del canal, del mas antiguo al mas reciente.
      payload:
        type: array
        items:
          $ref: '#/components/schemas/MensajeDeChat'

  schemas:

    MensajeDeChat:
      type: object
      description: Mensaje del chat de sala o de la vista general (HU-JUE-015).
      required: [id, tipo, autor, texto, enviadoEn]
      properties:
        id: { type: string, format: uuid }
        tipo: { type: string, enum: [chat.mensaje, chat.logro] }
        idSala:
          type: [string, 'null']
          format: uuid
          description: Nulo en el chat de la vista general.
        autor: { $ref: '#/components/schemas/ResumenJugador' }
        texto: { type: string, maxLength: 500 }
        logro:
          type: [object, 'null']
          description: Solo en chat.logro (CA-02), el logro de mision que se comparte.
          properties:
            mision: { type: string }
            titulo: { type: string }
        enviadoEn: { type: string, format: date-time }

    ProblemDetail:
      type: object
      description: Problem details RFC 7807, identico al de la API HTTP.
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }

    Ocupacion:
      type: object
      description: Cuantos hay dentro sobre el maximo, para la tarjeta de sala.
      required: [actual, maximo]
      properties:
        actual: { type: integer, minimum: 0 }
        maximo: { type: integer, minimum: 2, maximum: 6 }

    ResumenJugador:
      type: object
      required: [id, apodo]
      properties:
        id: { type: string, format: uuid }
        apodo: { type: string }
        avatarUrl: { type: [string, 'null'], format: uri }
        rango: { type: [string, 'null'] }

    Efecto:
      type: object
      required: [codigo, nombre]
      properties:
        codigo: { type: string }
        nombre: { type: string }
        icono: { type: [string, 'null'] }
        turnosRestantes: { type: [integer, 'null'] }
        tipo:
          type: [string, 'null']
          description: (1.5.0) Tipo de efecto del motor de combate (BONO_DEFENSA, DANO_POR_TURNO...).
        valor: { type: [integer, 'null'] }

    EstadoDeAccion:
      type: object
      description: (1.5.0) Una accion jugable y su disponibilidad, calculada por el motor de combate.
      required: [codigo, nombre, disponible]
      properties:
        codigo: { type: string, description: Lo que se manda como codigoAccion }
        nombre: { type: string }
        tipo: { type: [string, 'null'] }
        esEpica: { type: boolean }
        costoPoder: { type: [integer, 'null'], description: Nulo si cuesta todo el poder }
        turnosDeCarga: { type: [integer, 'null'] }
        nivelRequerido: { type: [integer, 'null'] }
        disponible: { type: boolean }
        motivo: { type: [string, 'null'] }

    Participante:
      type: object
      required: [jugador, esIA]
      properties:
        jugador: { $ref: '#/components/schemas/ResumenJugador' }
        heroe:
          # Anulable desde P2.4: el heroe de la IA lo decide el motor de
          # combate, y los participantes anteriores a la migracion V7 entraron
          # antes de que la puerta guardara el suyo. Null dice la verdad.
          type: ['object', 'null']
          required: [id, nombre, vidaActual, vidaMaxima]
          properties:
            id: { type: string, format: uuid }
            nombre: { type: string }
            retratoUrl: { type: [string, 'null'], format: uri }
            nivel: { type: [integer, 'null'] }
            vidaActual: { type: integer, minimum: 0 }
            vidaMaxima: { type: integer, minimum: 1 }
            efectosActivos:
              type: array
              items: { $ref: '#/components/schemas/Efecto' }
            prototipo:
              type: [string, 'null']
              description: (1.5.0) Tipo de heroe del catalogo («Mago Hielo»).
            poderActual: { type: [integer, 'null'], minimum: 0 }
            poderMaximo: { type: [integer, 'null'], minimum: 0 }
            acciones:
              type: array
              description: (1.5.0) Acciones jugables y su disponibilidad al empezar.
              items: { $ref: '#/components/schemas/EstadoDeAccion' }
        esIA: { type: boolean }
        equipo: { type: [integer, 'null'] }
        posicionEnCampo:
          type: [integer, 'null']
          description: |
            Casilla asignada en el campo. RF-JUE-017 exige que la ubicacion
            sea aleatoria; la decide el servidor, el cliente solo la pinta.
