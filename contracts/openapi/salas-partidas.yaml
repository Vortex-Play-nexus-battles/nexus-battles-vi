openapi: 3.1.0

# =============================================================================
# Nexus Battles VI — Salas y partidas (modulo de plataforma, Grupo 6)
#
# Regla 1 de plataforma: contrato primero. Este documento se acuerda ANTES de
# implementar y es la referencia para el backend, el frontend y las pruebas de
# contrato (Pact JVM).
#
# Cada operacion y cada campo esta anclado a un requisito de
# REQUISITOS_GRUPO_6_EMPRESA_A.pdf. No hay campos inventados: si algo no
# aparece en un RF o en una pantalla ya aprobada del archivo de Figma, no esta
# aqui.
#
# Trazabilidad:
#   RF-JUE-001  Creacion de sala de batalla
#   RF-JUE-002  Ingreso a una sala existente
#   RF-JUE-003  Exigencia de personaje equipado
#   RF-JUE-004  Modalidades de partida
#   RF-JUE-009  Barra de progreso de vida
#   RF-JUE-014  Apuesta de creditos en batallas
#   RF-JUE-017  Diseno de la interfaz de combate
#
# Historias de usuario: HU-SAL-001 a HU-SAL-005 (Simon Perez Gomez)
# Canal en tiempo real: contracts/websocket/salas-partidas.yaml
# =============================================================================

info:
  title: Nexus Battles VI — Salas y partidas (salas-partidas)
  description: |
    API de creacion, listado e ingreso a salas de batalla, y de consulta del
    estado de una partida en curso.

    El avance del combate turno a turno NO viaja por esta API: viaja por el
    canal WebSocket descrito en `contracts/websocket/salas-partidas.yaml`.
    Esta API cubre el ciclo de vida de la sala hasta el inicio del combate, y
    la consulta puntual de estado para reconexion.

    Errores: todos los errores se devuelven en formato problem details
    (RFC 7807) con `Content-Type: application/problem+json`, identico en los 20
    modulos (regla 4 de plataforma). La correspondencia entre este formato y el
    componente `Aviso` de la interfaz esta en
    `shared/ui-kit/MAPEO-ERRORES.md`.

    Trazas: toda peticion propaga `traceparent` (regla 5 de plataforma).

    Cambios 1.2.0 (HU-SAL-004, aditivos): `heroesIA` en `CrearSalaRequest` y en
    `Sala` — cuantos cupos son de la inteligencia artificial; cuentan en
    `ocupacion`. `CONTRA_IA` lleva siempre uno; `UNO_CONTRA_UNO` ninguno;
    `HASTA_SEIS` de cero a `maximoParticipantes - 1`. `incluirHeroeIA` se
    conserva y vale por uno. En el modo cooperativo (`tamanoEquipo`) los
    participantes de la partida traen `equipo` asignado por orden de entrada.

    Cambios 1.3.0 (HU-DIS-003, degradacion controlada): cuando una dependencia
    de este servicio NO RESPONDE (inventario, motor de combate, libro de
    creditos), la operacion que la necesita responde `503` con `type`
    `seccion-no-disponible`, la propiedad `seccion` (que funcion queda
    limitada), `reintentarEnSegundos` y la cabecera `Retry-After`; el resto de
    operaciones sigue sirviendo. Es el problem detail comun de
    `shared/libs/plataforma-resiliencia`, y la interfaz lo pinta con el
    componente `Seccion degradada` (MAPEO-ERRORES §5.5). Los `type` propios
    (`creditos-no-disponibles`, `inventario-no-disponible`,
    `motor-de-combate-no-disponible`) se conservan para cuando la dependencia
    contesta pero lo que contesta no sirve. Ver `DependenciaNoDisponible`.

    Cambios 1.4.0 (HU-TOR-004 CA-04, aditivo): `torneo` opcional en
    `CrearSalaRequest` vincula la sala a un encuentro de torneo
    (`torneoId` + `numeroEncuentro` 1..14). Al terminar la partida, este
    servicio informa al jugador ganador a torneos
    (`POST /torneos/{id}/encuentros/{n}/resultado` con `ganadorUid`,
    `contracts/openapi/torneos.yaml` 1.1.0) con su credencial de servicio. Si
    torneos no responde, el fallo queda anotado en el vinculo y lo resuelve un
    administrador con motivo; la partida termina igual. Un encuentro fuera de
    rango o sin torneo es `400` `parametros-invalidos` con el campo
    (`torneo.numeroEncuentro` / `torneo.torneoId`) y la sala no se crea.

    Cambios 1.6.0 (B0/B6, aditivo — FEEDBACK DEL PROFESOR, no requisito del
    documento): mensajes privados entre jugadores sobre el mismo chat.
    Historial y conversaciones por REST (`/mensajes-directos/**`); el envio en
    tiempo real por STOMP (`contracts/websocket/mensajes-directos.yaml`).
    `POST .../mensajes` es la via de respaldo cuando el WebSocket no esta
    disponible (degradacion controlada a consulta periodica, riesgo #7 del
    Project Charter): mismo control de lista negra, sancion y frecuencia.
    Solo los dos participantes ven una conversacion.
  version: 1.6.0
  contact:
    name: Grupo 6 — Tiempo real, comunidad y plataforma
  license:
    name: Uso academico — Proyecto Integrador II, UPB Bucaramanga

servers:
  - url: http://localhost:8084/api/v1
    description: Entorno local de desarrollo
  - url: https://api.nexusbattles.local/salas-partidas/api/v1
    description: Entorno desplegado

tags:
  - name: Salas
    description: Ciclo de vida de la sala de batalla
  - name: Partidas
    description: Estado de la partida en curso
  - name: Mensajes
    description: Mensajes privados entre jugadores (feedback del profesor, 1.6.0)

paths:

  # ---------------------------------------------------------------------------
  # RF-JUE-001 · HU-SAL-001 — Creacion de sala de batalla
  # RF-JUE-014 — Apuesta de creditos
  # ---------------------------------------------------------------------------
  /salas:
    post:
      tags: [Salas]
      summary: Crear una sala de batalla
      description: |
        Crea una sala indicando cuantos jugadores participaran, la recompensa
        en juego y si se incluye un heroe controlado por la inteligencia
        artificial (RF-JUE-001).

        Los creditos de la recompensa quedan comprometidos al crear la sala
        (RF-JUE-014). Si el jugador no tiene saldo suficiente la operacion se
        rechaza con `422` y el `detail` indica cuantos creditos tiene y cuantos
        hacen falta — el requisito exige comunicar el MOTIVO del rechazo, no
        solo que fallo.
      operationId: crearSala
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearSalaRequest'
      responses:
        '201':
          description: Sala creada. El creador queda dentro como anfitrion.
          headers:
            Location:
              description: URI de la sala creada
              schema: { type: string, format: uri }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sala'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/JugadorSancionado'
        '422':
          description: |
            El anfitrion no cumple algun requisito para crear la sala.
            Distinguir por `type`:

            - `creditos-insuficientes`: el saldo no cubre la recompensa;
              `detail` incluye el saldo actual y el requerido.
            - `heroe-no-equipado` / `heroe-ocupado`: RF-JUE-003, SCRUM-1074. El
              anfitrion entra a su propia sala al crearla, asi que pasa la misma
              puerta de heroe que los demas.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                creditosInsuficientes:
                  summary: RF-JUE-014 — saldo insuficiente
                  value:
                    type: 'https://nexusbattles.local/errores/creditos-insuficientes'
                    title: 'Creditos insuficientes'
                    status: 422
                    detail: 'Tienes 240 creditos y necesitas 400 para crear esta sala.'
                    instance: '/api/v1/salas'
                heroeNoEquipado:
                  summary: RF-JUE-003 — sin personaje equipado
                  value:
                    type: 'https://nexusbattles.local/errores/heroe-no-equipado'
                    title: 'No tienes un heroe equipado'
                    status: 422
                    detail: 'Equipa un heroe en tu inventario antes de entrar a una batalla.'
                    instance: '/api/v1/salas'
        '503':
          $ref: '#/components/responses/DependenciaNoDisponible'

    # -------------------------------------------------------------------------
    # RF-JUE-002 · HU-SAL-002 — Listado de salas creadas por otros jugadores
    # -------------------------------------------------------------------------
    get:
      tags: [Salas]
      summary: Listar salas disponibles
      description: |
        Devuelve la lista de salas creadas por otros jugadores para que el
        jugador seleccione una e ingrese (RF-JUE-002).

        La paginacion es de 16 elementos por pagina, valor fijado en el sistema
        de diseno y confirmado por el componente `Paginacion`, cuya descripcion
        cita RNF-USA-001: «dieciseis elementos por pagina en vitrinas y
        listados».

        LAS SALAS PRIVADAS SI APARECEN. La Pantalla 2 del sistema de diseno
        (nodo 19:29) pinta ocho tarjetas y dos llevan la insignia `Privada`.
        Aparecer no es poder entrar: el ingreso a una privada sin codigo se
        rechaza con `403` en `POST /salas/{idSala}/participantes`. Si no
        aparecieran, ese 403 seria inalcanzable desde el listado.
      operationId: listarSalas
      parameters:
        - name: pagina
          in: query
          description: Numero de pagina, base 0
          schema: { type: integer, minimum: 0, default: 0 }
        - name: tamano
          in: query
          description: Elementos por pagina. El valor de diseno es 16.
          schema: { type: integer, minimum: 1, maximum: 50, default: 16 }
        - name: modalidad
          in: query
          description: Filtro por modalidad de partida (RF-JUE-004)
          schema:
            $ref: '#/components/schemas/Modalidad'
        - name: estado
          in: query
          description: Filtro por estado de la sala
          schema:
            $ref: '#/components/schemas/EstadoSala'
        # RETIRADO: buscaba por nombre de sala, y las salas no tienen nombre.
        # Ningun requisito pide buscar en el listado; RF-JUE-002 solo habla de
        # seleccionar una sala de la lista.
        #
        # RESUELTO EN HU-SAL-002. La Pantalla 2 conservaba un campo «Buscar una
        # sala por nombre...» que quedo huerfano al retirar `Nombre` de la
        # tarjeta en HU-SAL-001: ninguna de sus ocho tarjetas mostraba un nombre,
        # porque la propiedad `Meta` de `Tarjeta de sala` solo lleva
        # participantes, recompensa y heroe de la IA. El campo se elimino de la
        # maqueta, no solo del codigo, para que el diseno no prometa una funcion
        # que no existe. Quedan los dos filtros que si tienen respaldo:
        # modalidad y estado.
      responses:
        '200':
          description: Pagina de salas disponibles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaDeSalas'
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /salas/{idSala}:
    parameters:
      - $ref: '#/components/parameters/IdSala'
    get:
      tags: [Salas]
      summary: Consultar una sala
      operationId: obtenerSala
      responses:
        '200':
          description: Detalle de la sala
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sala'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/SalaNoEncontrada'

    delete:
      tags: [Salas]
      summary: Cancelar una sala
      description: |
        Solo el anfitrion puede cancelar. Los creditos comprometidos por los
        participantes se devuelven. Emite el evento `sala.cancelada` por el
        canal en tiempo real para que quienes esten dentro salgan de la vista
        de espera.
      operationId: cancelarSala
      responses:
        '204':
          description: Sala cancelada y creditos devueltos
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: Solo el anfitrion puede cancelar la sala
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404':
          $ref: '#/components/responses/SalaNoEncontrada'
        '409':
          description: La partida ya comenzo; no se puede cancelar
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  # ---------------------------------------------------------------------------
  # RF-JUE-002 + RF-JUE-003 · HU-SAL-002 / HU-SAL-003 — Ingreso con validacion
  # ---------------------------------------------------------------------------
  /salas/{idSala}/participantes:
    parameters:
      - $ref: '#/components/parameters/IdSala'
    post:
      tags: [Salas]
      summary: Ingresar a una sala
      description: |
        Ingresa al jugador autenticado en la sala seleccionada (RF-JUE-002).

        Antes de admitirlo, el sistema exige que tenga su personaje equipado
        (RF-JUE-003) y que ese heroe no este comprometido en otra partida. Los
        dos rechazos posibles se distinguen por `type`, porque la interfaz
        muestra un dialogo distinto para cada uno:

          - `heroe-no-equipado`  → invita a ir al inventario
          - `heroe-ocupado`      → nombra la sala donde esta y ofrece cambiarlo

        Al ingresar se comprometen los creditos de la apuesta (RF-JUE-014).
      operationId: ingresarASala
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngresoRequest'
      responses:
        '200':
          description: Ingreso aceptado. Devuelve la sala con el participante dentro.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sala'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: |
            No puede entrar. Distinguir por `type`:

            - `codigo-invitacion-invalido`: la sala es privada y el codigo
              falta o no corresponde.
            - `jugador-sancionado` (HU-USR-005/006, R10.2): tiene una sancion
              activa. Se comprueba ANTES que el heroe y antes de reservar
              creditos, asi que un rechazo por esta via no deja nada a medias.
              Ver la respuesta `JugadorSancionado`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
              examples:
                codigoInvalido:
                  summary: sala privada sin codigo valido
                  value:
                    type: 'https://nexusbattles.local/errores/codigo-invitacion-invalido'
                    title: 'Codigo de invitacion invalido'
                    status: 403
                    detail: 'Esta sala es privada y el codigo no corresponde.'
                jugadorSancionado:
                  summary: HU-USR-005/006 — sancion activa
                  value:
                    type: 'https://nexusbattles.local/errores/jugador-sancionado'
                    title: 'Tienes una sancion activa'
                    status: 403
                    detail: 'Mientras la sancion siga vigente no puedes crear salas ni entrar a batallas. Puedes consultarla, y apelarla si crees que es injusta, en «Mis sanciones».'
        '404':
          $ref: '#/components/responses/SalaNoEncontrada'
        '409':
          description: La sala esta llena o la partida ya comenzo
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '422':
          description: |
            El jugador no cumple algun requisito para entrar. Distinguir por
            `type`:

            - `heroe-no-equipado` / `heroe-ocupado`: RF-JUE-003 (ver
              `HeroeNoDisponible`).
            - `creditos-insuficientes`: RF-JUE-014, HU-JUE-014 CA-02. La sala
              tiene recompensa y el saldo disponible no la cubre; `detail`
              incluye el saldo actual y el requerido. La sala no cambia y
              nada queda reservado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                creditosInsuficientes:
                  value:
                    type: 'https://nexusbattles.local/errores/creditos-insuficientes'
                    title: 'Creditos insuficientes'
                    status: 422
                    detail: 'Tienes 80 creditos y necesitas 150 para crear esta sala.'
                heroeNoEquipado:
                  value:
                    type: 'https://nexusbattles.local/errores/heroe-no-equipado'
                    title: 'No tienes un heroe equipado'
                    status: 422
                    detail: 'Equipa un heroe en tu inventario antes de entrar a una batalla.'
        '503':
          $ref: '#/components/responses/DependenciaNoDisponible'

    delete:
      tags: [Salas]
      summary: Abandonar la sala
      description: |
        Saca al jugador autenticado de la sala antes de que comience la
        partida y le devuelve los creditos comprometidos. Una vez iniciado el
        combate, abandonar cuenta como derrota y no hay devolucion.
      operationId: abandonarSala
      responses:
        '204':
          description: Jugador retirado de la sala
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/SalaNoEncontrada'

  # ---------------------------------------------------------------------------
  # HU-SAL-003 — Verificacion previa, sin efectos secundarios
  # ---------------------------------------------------------------------------
  /salas/{idSala}/verificacion-heroe:
    parameters:
      - $ref: '#/components/parameters/IdSala'
    get:
      tags: [Salas]
      summary: Verificar el heroe antes de intentar ingresar
      description: |
        Comprueba si el jugador puede entrar, SIN ingresarlo ni comprometer
        creditos. La interfaz la usa para mostrar el dialogo de validacion de
        heroe antes de pulsar Entrar (RF-JUE-003), de modo que el jugador no
        descubra el problema despues de la accion.
      operationId: verificarHeroe
      responses:
        '200':
          description: Resultado de la verificacion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificacionHeroe'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/SalaNoEncontrada'
        '503':
          # La verificacion pregunta al inventario: si no responde, no hay
          # veredicto (ni inventado). El dialogo pinta `Seccion degradada`
          # con reintentar en vez de una de sus cuatro variantes.
          $ref: '#/components/responses/DependenciaNoDisponible'

  # ---------------------------------------------------------------------------
  # HU-SAL-004 · RF-JUE-017 — Arranque del combate
  # ---------------------------------------------------------------------------
  /salas/{idSala}/partida:
    parameters:
      - $ref: '#/components/parameters/IdSala'
    post:
      tags: [Partidas]
      summary: Iniciar la partida de una sala
      description: |
        Arranca el combate. Solo el anfitrion, y una sola vez por sala: al
        empezar, la sala pasa a `EN_JUEGO` y deja de admitir ingresos.

        A los demas participantes les llega el aviso `sala.partida.iniciada`
        (ver `contracts/websocket/salas-partidas.yaml`) tambien por el canal de
        la SALA, no solo por el de la partida: en la sala de espera todavia no
        conocen el identificador de la partida y no pueden estar suscritos a su
        tema.

        Pulsar dos veces no es un error: la segunda llamada devuelve la misma
        partida, con el mismo identificador.
      operationId: iniciarPartida
      responses:
        '201':
          description: Partida iniciada, con su estado inicial.
          headers:
            Location:
              description: URI de la partida creada
              schema: { type: string, format: uri }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: |
            Solo el anfitrion inicia la partida.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404':
          $ref: '#/components/responses/SalaNoEncontrada'
        '409':
          description: |
            La sala no admite empezar: ya esta en juego, fue cancelada, ya
            termino, o no hay rival —una sala de un solo participante sin heroe
            de la IA no es un enfrentamiento (RF-JUE-004)—.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '422':
          # SCRUM-1074: entre entrar a la sala y pulsar «empezar» puede pasar un
          # buen rato, y en ese rato el heroe del anfitrion puede haber entrado
          # en otra batalla. La puerta del ingreso no vale para siempre.
          $ref: '#/components/responses/HeroeNoDisponible'
        '503':
          # Esa misma puerta pregunta al inventario (HU-DIS-003).
          $ref: '#/components/responses/DependenciaNoDisponible'

  # ---------------------------------------------------------------------------
  # RF-JUE-017 — Estado de la partida, para pintar la vista y para reconectar
  # ---------------------------------------------------------------------------
  /partidas/{idPartida}:
    parameters:
      - name: idPartida
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Partidas]
      summary: Consultar el estado de una partida
      description: |
        Devuelve el estado completo del combate: participantes con su vida,
        turno en curso y efectos activos.

        Se consulta al entrar al combate y al reconectar tras una caida del
        canal en tiempo real. Durante el juego normal el estado llega por
        WebSocket, no por esta ruta.
      operationId: obtenerPartida
      responses:
        '200':
          description: Estado de la partida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          description: Partida no encontrada
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /mensajes-directos/conversaciones:
    get:
      tags: [Mensajes]
      operationId: misConversaciones
      summary: Conversaciones privadas del jugador (1.6.0)
      x-implementacion: pendiente
      x-fase: B6
      security:
        - keycloak: []
      responses:
        '200':
          description: Conversaciones, la de actividad mas reciente primero.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResumenDeConversacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /mensajes-directos/conversaciones/{uidOtro}/mensajes:
    parameters:
      - $ref: '#/components/parameters/UidOtro'
    get:
      tags: [Mensajes]
      operationId: mensajesDeConversacion
      summary: Historial de la conversacion con otro jugador (1.6.0)
      x-implementacion: pendiente
      x-fase: B6
      description: |
        Solo la conversacion entre el dueno del token y `uidOtro`: no hay forma
        de pedir la de otros dos. Paginado hacia atras con `antesDe`.
      security:
        - keycloak: []
      parameters:
        - name: antesDe
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: limite
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Mensajes, del mas antiguo al mas reciente dentro de la pagina.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MensajeDirecto'
        '400':
          description: '`uidOtro` es el propio jugador o no es un UUID.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
    post:
      tags: [Mensajes]
      operationId: enviarMensajeDirecto
      summary: Envia un mensaje privado (respaldo del WebSocket) (1.6.0)
      x-implementacion: pendiente
      x-fase: B6
      security:
        - keycloak: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [texto]
              properties:
                texto: { type: string, minLength: 1, maxLength: 500 }
                idCliente: { type: string, maxLength: 64 }
      responses:
        '201':
          description: Mensaje guardado y entregado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeDirecto'
        '400':
          description: Texto vacio o demasiado largo, o destinatario propio.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: Remitente sancionado.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404':
          description: El destinatario no existe o no esta activo.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '422':
          description: El texto contiene terminos de la lista negra (no se entrega).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '429':
          description: Demasiados mensajes seguidos.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '503':
          description: La moderacion no responde; el mensaje no se entrega sin revisar.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /mensajes-directos/conversaciones/{uidOtro}/leido:
    parameters:
      - $ref: '#/components/parameters/UidOtro'
    post:
      tags: [Mensajes]
      operationId: marcarConversacionLeida
      summary: Marca como leidos los mensajes recibidos de ese jugador (1.6.0)
      x-implementacion: pendiente
      x-fase: B6
      security:
        - keycloak: []
      responses:
        '204':
          description: Hecho (idempotente).
        '401':
          $ref: '#/components/responses/NoAutenticado'

components:

  parameters:
    UidOtro:
      name: uidOtro
      in: path
      required: true
      description: '`uid` del otro jugador de la conversacion.'
      schema: { type: string, format: uuid }
    IdSala:
      name: idSala
      in: path
      required: true
      description: Identificador de la sala
      schema: { type: string, format: uuid }

  responses:
    # SCRUM-1074 — la puerta de heroe. Misma forma en las tres operaciones que
    # la aplican (crear, entrar, empezar): quien pinta el dialogo es el mismo
    # componente y no tiene por que distinguir por ruta.
    HeroeNoDisponible:
      description: |
        El jugador no cumple el requisito de heroe (RF-JUE-003). Distinguir por
        `type`: `heroe-no-equipado` si no tiene ninguno, `heroe-ocupado` si el
        suyo ya combate en otra partida.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
          examples:
            heroeNoEquipado:
              summary: RF-JUE-003 — sin personaje equipado
              value:
                type: 'https://nexusbattles.local/errores/heroe-no-equipado'
                title: 'No tienes un heroe equipado'
                status: 422
                detail: 'Equipa un heroe en tu inventario antes de entrar a una batalla.'
            heroeOcupado:
              summary: RF-JUE-003 — heroe comprometido en otra partida
              value:
                type: 'https://nexusbattles.local/errores/heroe-ocupado'
                title: 'Tu heroe esta en otra partida'
                status: 422
                detail: 'Sombra de Vael esta combatiendo en Caceria nocturna. Elige otro heroe.'

    NoAutenticado:
      description: Falta el token o esta caducado
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    # HU-DIS-003 — la misma forma en toda operacion que necesita a otro servicio.
    DependenciaNoDisponible:
      description: |
        Una dependencia de este servicio no esta disponible. Nada queda a medias
        (ninguna reserva, ningun ingreso) y se puede reintentar. Distinguir por
        `type`:

        - `seccion-no-disponible` (HU-DIS-003): la dependencia **no responde**
          —conexion, tiempo agotado, 5xx— o su corta circuitos esta abierto.
          Trae `seccion` (que funcion queda limitada: «Inventario», «Motor de
          combate», «Apuesta de creditos»), `reintentarEnSegundos` y la cabecera
          `Retry-After`; `dependencia` es el nombre interno, para la bitacora, y
          no se muestra al jugador. La interfaz pinta `Seccion degradada` en el
          hueco de esa seccion (MAPEO-ERRORES §5.5) y el resto de la vista sigue.
        - `creditos-no-disponibles` (HU-JUE-014, CA-06): el libro de creditos
          **contesto**, pero algo que no sirve (un rechazo distinto de saldo
          insuficiente, una reserva sin identificador). Solo en salas con
          recompensa. `type` estable.
        - `inventario-no-disponible` (HU-SAL-003): inventario contesto con un
          rechazo (4xx) y no hay veredicto sobre el heroe.
        - `sanciones-no-disponibles` (HU-USR-005/006, R10.2): no se pudo
          comprobar si el jugador esta sancionado. A diferencia de los
          anteriores **no se degrada**: la accion se bloquea. Es la excepcion
          deliberada a HU-DIS-003, porque aqui no se degrada una consulta sino
          una puerta.
      headers:
        Retry-After:
          description: Segundos tras los que conviene reintentar. Solo con `seccion-no-disponible`.
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            seccionNoDisponible:
              summary: HU-DIS-003 — el inventario no responde
              value:
                type: 'https://nexusbattles.local/errores/seccion-no-disponible'
                title: 'Inventario no disponible temporalmente'
                status: 503
                detail: 'La seccion de Inventario no esta disponible temporalmente. El resto del juego sigue funcionando.'
                instance: '/api/v1/salas'
                seccion: 'Inventario'
                reintentarEnSegundos: 30
                dependencia: 'inventario'
            creditosNoDisponibles:
              summary: HU-JUE-014 CA-06 — el libro contesto algo que no sirve
              value:
                type: 'https://nexusbattles.local/errores/creditos-no-disponibles'
                title: 'El libro de creditos no esta disponible ahora mismo'
                status: 503
                detail: 'No se pudieron comprometer los creditos de la apuesta: el libro rechazo la reserva con 400. Nada quedo reservado; vuelve a intentarlo en unos segundos.'
                instance: '/api/v1/salas'
    # HU-USR-005/006 (R10.2) — la sancion dejo de ser solo un silencio en el chat.
    JugadorSancionado:
      description: |
        El jugador tiene una **sancion activa** (RF-USR-004): una suspension
        temporal o un baneo emitidos en moderacion-sanciones. Mientras siga
        vigente no puede crear salas ni entrar a ninguna.

        Es `403` y no `422` a proposito: no le falta un requisito que pueda
        arreglar —equipar un heroe, conseguir creditos—, es que **no tiene
        permitido** hacerlo ahora. La interfaz debe llevarlo a «Mis sanciones»,
        donde puede verla y apelarla (HU-USR-007).

        Si el servicio de sanciones **no responde**, la respuesta es `503`
        (`sanciones-no-disponibles`) y no `403`: no es que no pueda, es que no
        se sabe. Se bloquea igualmente (fail-closed, decision D-14): dar por
        buena la entrada convertiria una caida en una via de escape.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
          example:
            type: 'https://nexusbattles.local/errores/jugador-sancionado'
            title: 'Tienes una sancion activa'
            status: 403
            detail: 'Mientras la sancion siga vigente no puedes crear salas ni entrar a batallas. Puedes consultarla, y apelarla si crees que es injusta, en «Mis sanciones».'
            instance: '/api/v1/salas'
    SalaNoEncontrada:
      description: La sala no existe o ya fue cerrada
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    ParametrosInvalidos:
      description: |
        Parametros fuera de rango. `errores` detalla campo por campo para que
        la interfaz marque el campo concreto, no solo el formulario.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }

  schemas:
    MensajeDirecto:
      type: object
      required: [id, conversacion, remitente, destinatario, texto, fecha, leido]
      properties:
        id: { type: string, format: uuid }
        conversacion: { type: string, description: '`dm:{uidMenor}:{uidMayor}`' }
        remitente: { type: string, format: uuid }
        apodoRemitente: { type: string }
        destinatario: { type: string, format: uuid }
        texto: { type: string }
        fecha: { type: string, format: date-time }
        leido: { type: boolean }
        idCliente: { type: [string, 'null'] }

    ResumenDeConversacion:
      type: object
      required: [uidOtro, ultimoMensaje, noLeidos]
      properties:
        uidOtro: { type: string, format: uuid }
        apodoOtro: { type: [string, 'null'] }
        ultimoMensaje: { $ref: '#/components/schemas/MensajeDirecto' }
        noLeidos: { type: integer, minimum: 0 }


    # -- Formato de error comun a los 20 modulos (regla 4) --------------------
    ProblemDetail:
      type: object
      description: |
        Problem details RFC 7807. Identico en los 20 modulos.
        Correspondencia con la interfaz en `shared/ui-kit/MAPEO-ERRORES.md`.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: Identificador estable del tipo de error. La interfaz decide por aqui, nunca por el texto.
        title:
          type: string
          description: Titulo corto. Va al titulo del componente Aviso.
        status:
          type: integer
          description: Codigo HTTP. Determina el tono del Aviso.
        detail:
          type: string
          description: Explicacion legible para el jugador. Va al cuerpo del Aviso.
        instance:
          type: string
          description: Ruta que produjo el error.
        errores:
          type: array
          description: Errores por campo, presente solo en validaciones de formulario.
          items:
            type: object
            required: [campo, mensaje]
            properties:
              campo: { type: string }
              mensaje: { type: string }

    # -- Enumeraciones ---------------------------------------------------------
    Modalidad:
      type: string
      description: |
        Modalidades admitidas (RF-JUE-004): uno contra uno, uno contra la
        inteligencia artificial, y partidas de hasta seis jugadores.

        Limites por modalidad (los aplica el servicio; fuera de ellos, `400`
        con el campo y el limite superado):

        | Modalidad      | maximoParticipantes | heroesIA                 | tamanoEquipo |
        |----------------|---------------------|--------------------------|--------------|
        | UNO_CONTRA_UNO | exactamente 2       | 0                        | no admite    |
        | CONTRA_IA      | exactamente 2       | exactamente 1 (implicito)| no admite    |
        | HASTA_SEIS     | 2 a 6               | 0 a maximoParticipantes-1| 1 a 3        |
      enum: [UNO_CONTRA_UNO, CONTRA_IA, HASTA_SEIS]

    EstadoSala:
      type: string
      description: |
        Estado de la sala. Se corresponde uno a uno con las variantes del
        componente `Insignia` en el sistema de diseno.
      enum: [ABIERTA, LLENA, EN_JUEGO, PRIVADA, CANCELADA, FINALIZADA]

    ResultadoVerificacion:
      type: string
      description: |
        Resultado de la verificacion de heroe (RF-JUE-003). Cada valor
        corresponde a una variante del dialogo de validacion.
      enum: [DISPONIBLE, SIN_HEROE_EQUIPADO, HEROE_OCUPADO, CREDITOS_INSUFICIENTES]

    # -- Peticiones ------------------------------------------------------------
    CrearSalaRequest:
      type: object
      description: |
        Parametros de creacion de sala.

        Las entradas son EXACTAMENTE las tres que enumera RF-JUE-001: «Numero de
        jugadores; recompensa comprometida; inclusion de heroe controlado por
        inteligencia artificial». No hay nombre de sala: ningun requisito, regla
        de negocio ni la seccion 7.6 del Proyecto Integrador lo pide, y
        RF-JUE-002 selecciona la sala por su identificador. Cuando el SRS quiere
        un nombre lo dice, como en RF-TOR-003 para los equipos de torneo.

        Privada y tamanoEquipo salen de los flujos alternativos de RF-JUE-001 y
        de RF-JUE-004.
      required: [maximoParticipantes, modalidad, recompensaCreditos]
      properties:
        maximoParticipantes:
          type: integer
          minimum: 2
          maximum: 6
          description: |
            Cuantos jugadores participaran (RF-JUE-001). El maximo de seis lo
            fija RF-JUE-004.
        modalidad:
          $ref: '#/components/schemas/Modalidad'
        recompensaCreditos:
          type: integer
          minimum: 0
          description: |
            Creditos puestos en juego (RF-JUE-001, RF-JUE-014). Se comprometen
            al crear la sala.
        incluirHeroeIA:
          type: boolean
          default: false
          description: |
            Incluir un heroe aleatorio controlado por la IA (RF-JUE-001).
            Equivale a `heroesIA: 1`; si viene `heroesIA`, manda `heroesIA`.
        heroesIA:
          type: integer
          minimum: 0
          maximum: 5
          description: |
            Cuantos cupos ocupa la inteligencia artificial (RF-JUE-004,
            HU-SAL-004): «cualquiera puede ser controlado por la IA». Cada uno
            cuenta en el aforo; el anfitrion siempre juega, asi que como maximo
            `maximoParticipantes - 1`. Ver los limites por modalidad en
            `Modalidad`. Ausente: vale lo que diga `incluirHeroeIA`.
        privada:
          type: boolean
          default: false
          description: |
            Una sala privada aparece en el listado con la insignia `Privada`,
            pero solo se entra con el codigo de invitacion: sin el, el ingreso
            se rechaza con `403`.
        tamanoEquipo:
          type: integer
          minimum: 1
          maximum: 3
          description: |
            Integrantes por equipo en modo cooperativo. RF-JUE-004 fija el
            maximo en tres. Solo aplica con modalidad HASTA_SEIS. Al iniciar la
            partida los participantes se reparten en equipos de ese tamano por
            orden de entrada (el anfitrion abre el equipo 1; los heroes de la
            IA van al final); cada `Participante` trae su `equipo`. La partida
            termina cuando solo queda un equipo en pie y no se puede atacar a
            un companero.
        torneo:
          $ref: '#/components/schemas/EncuentroDeTorneo'

    EncuentroDeTorneo:
      type: object
      description: |
        (1.4.0, HU-TOR-004) La sala es la partida del encuentro `numeroEncuentro`
        del torneo `torneoId`. Al terminar, el ganador se informa a torneos por
        API; nunca se registra a mano desde aqui.
      required: [torneoId, numeroEncuentro]
      properties:
        torneoId:
          type: string
          format: uuid
        numeroEncuentro:
          type: integer
          minimum: 1
          maximum: 14
          description: Numero del encuentro en el arbol doble (1..14, `torneos.yaml`).

    IngresoRequest:
      type: object
      properties:
        codigoInvitacion:
          type: string
          description: Obligatorio unicamente si la sala es privada.

    # -- Respuestas ------------------------------------------------------------
    Sala:
      type: object
      description: |
        Una sala publicada. El listado de RF-JUE-002 muestra lo que exige la
        seccion 3.1.1 del SRS: «el numero de participantes, la recompensa en
        juego y si se incluye un heroe controlado por la inteligencia
        artificial».

        La `Tarjeta de sala` del sistema de diseno (conjunto 14:33) confirma esa
        lista y no anade nada: tiene exactamente dos propiedades, la variante
        `Estado` -Abierta, Llena, Privada- y un unico texto `Meta` que los ocho
        ejemplos de la Pantalla 2 resuelven como
        «4 de 6 jugadores · 320 creditos · Con heroe de la IA».

        Por eso aqui NO viajan ni el apodo del anfitrion, ni el heroe de cada
        participante, ni un indicador de preparacion: ninguna pantalla los
        muestra y ningun requisito los pide. Un participante se identifica por
        su UUID, que es lo unico que este servicio conoce — el apodo pertenece
        al modulo de cuentas y no se replica aqui (regla 7 de plataforma).
      required: [id, estado, modalidad, maximoParticipantes, ocupacion, recompensaCreditos, incluirHeroeIA, heroesIA]
      properties:
        id: { type: string, format: uuid }
        estado: { $ref: '#/components/schemas/EstadoSala' }
        modalidad: { $ref: '#/components/schemas/Modalidad' }
        maximoParticipantes: { type: integer, minimum: 2, maximum: 6 }
        ocupacion:
          type: integer
          minimum: 0
          description: |
            Cupos ocupados: las personas de `participantes` mas `heroesIA`. Es
            el primer numero de «N de M jugadores» en la tarjeta. Se deriva,
            nunca se almacena aparte. Una sala contra la IA nace con 2 de 2.
        recompensaCreditos: { type: integer, minimum: 0 }
        incluirHeroeIA:
          type: boolean
          description: |
            Si la sala incluye al menos un heroe controlado por la IA
            (RF-JUE-001). La tarjeta lo pinta como el sufijo «· Con heroe de
            la IA», presente solo cuando es verdadero.
        heroesIA:
          type: integer
          minimum: 0
          maximum: 5
          description: Cuantos cupos son de la inteligencia artificial (HU-SAL-004).
        privada: { type: boolean }
        tamanoEquipo: { type: integer, minimum: 1, maximum: 3 }
        idAnfitrion:
          type: string
          format: uuid
          description: |
            Quien creo la sala. Solo el puede cancelarla. Ninguna pantalla lo
            muestra todavia, asi que viaja como identificador, no como perfil.
        participantes:
          type: array
          description: Identificadores de quienes estan dentro, el anfitrion incluido.
          items: { type: string, format: uuid }
        idPartida:
          type: [string, 'null']
          format: uuid
          description: Presente solo cuando la partida ya comenzo.
        creadaEn: { type: string, format: date-time }
        codigoInvitacion:
          type: string
          description: |
            Llave de acceso de una sala privada. **Solo viaja hacia el
            anfitrion**, y solo en las respuestas de `crearSala`,
            `obtenerSala` e `ingresarASala`; a cualquier otro jugador el campo
            ni siquiera aparece en el JSON. Ausente tambien en las salas
            publicas, que no tienen codigo.

            Lo genera el servidor al crear la sala —ocho caracteres de un
            alfabeto sin `I`, `O`, `0` ni `1`, agrupados de cuatro en cuatro—
            para que se pueda dictar en voz alta sin ambiguedad. El cliente
            nunca lo elige.

            Se anadio despues del congelado del Sprint 1 porque sin el las
            salas privadas eran inaccesibles incluso para su anfitrion: el
            contrato ya exigia `codigoInvitacion` en `IngresoRequest`, pero no
            habia ninguna operacion que lo entregara. Es un campo opcional
            nuevo, compatible hacia atras: ningun consumidor que lo ignore se
            rompe.
          example: 'H7KM-3PQX'

    PaginaDeSalas:
      type: object
      required: [contenido, pagina, tamano, totalElementos, totalPaginas]
      properties:
        contenido:
          type: array
          items: { $ref: '#/components/schemas/Sala' }
        pagina: { type: integer }
        tamano: { type: integer, description: 'El valor de diseno es 16.' }
        totalElementos: { type: integer }
        totalPaginas: { type: integer }

    ResumenJugador:
      type: object
      required: [id, apodo]
      properties:
        id: { type: string, format: uuid }
        apodo: { type: string }
        avatarUrl: { type: [string, 'null'], format: uri }
        rango: { type: [string, 'null'] }

    Participante:
      type: object
      required: [jugador, heroe, esIA, listo]
      properties:
        jugador: { $ref: '#/components/schemas/ResumenJugador' }
        heroe: { $ref: '#/components/schemas/HeroeEnPartida' }
        esIA:
          type: boolean
          description: Verdadero si lo controla la inteligencia artificial (RF-JUE-001, RF-JUE-004).
        listo: { type: boolean }
        equipo:
          type: [integer, 'null']
          description: Numero de equipo en modo cooperativo.
        creditosApostados: { type: integer, minimum: 0 }

    HeroeEnPartida:
      type: object
      description: |
        Datos del heroe que la sala y el combate necesitan mostrar. El detalle
        completo del heroe pertenece al modulo de contenido: aqui solo viaja
        lo que la vista de batalla pinta.
      required: [id, nombre, vidaActual, vidaMaxima]
      properties:
        id:
          type: string
          minLength: 1
          description: |
            Identificador del heroe en el inventario de su dueno. Es una cadena
            opaca, no un UUID: `ElementoInventario.id` de
            `contracts/openapi/inventario.yaml` lo declara `type: string` y este
            servicio no lo interpreta, solo lo devuelve tal cual lo recibe.
            Exigir aqui formato uuid rompia la verificacion de HU-SAL-003 con
            inventarios perfectamente validos.
        nombre: { type: string }
        retratoUrl: { type: [string, 'null'], format: uri }
        nivel: { type: [integer, 'null'] }
        vidaActual:
          type: integer
          minimum: 0
          description: |
            Vida actual. La barra muestra SIEMPRE el valor numerico junto al
            color (RF-JUE-009): el color nunca es el unico indicador.
        vidaMaxima:
          type: integer
          minimum: 1
          description: |
            Vida maxima. El porcentaje se calcula en el cliente. Los umbrales
            de color son 60 % y 40 % (RF-JUE-009) y viven en el sistema de
            diseno como `--vida-umbral-alto` y `--vida-umbral-medio`; el
            servidor NO envia color.
        efectosActivos:
          type: array
          description: Efectos en curso. Cada uno se representa con icono (RF-JUE-017).
          items:
            type: object
            required: [codigo, nombre]
            properties:
              codigo: { type: string }
              nombre: { type: string }
              turnosRestantes: { type: [integer, 'null'] }

    VerificacionHeroe:
      type: object
      required: [resultado, puedeIngresar]
      properties:
        resultado: { $ref: '#/components/schemas/ResultadoVerificacion' }
        puedeIngresar: { type: boolean }
        heroe:
          oneOf:
            - $ref: '#/components/schemas/HeroeEnPartida'
            - type: 'null'
        salaQueLoOcupa:
          type: [string, 'null']
          description: |
            Nombre de la sala donde el heroe esta comprometido. Presente solo
            si el resultado es HEROE_OCUPADO, porque el dialogo debe nombrarla.
        creditosDisponibles: { type: [integer, 'null'] }
        creditosRequeridos: { type: [integer, 'null'] }

    Partida:
      type: object
      description: Estado del combate (RF-JUE-017).
      required: [id, idSala, estado, participantes, turnoActual]
      properties:
        id: { type: string, format: uuid }
        idSala: { type: string, format: uuid }
        estado:
          type: string
          enum: [EN_CURSO, FINALIZADA]
        participantes:
          type: array
          items: { $ref: '#/components/schemas/Participante' }
        turnoActual:
          type: object
          required: [idJugador, numeroTurno]
          properties:
            idJugador: { type: string, format: uuid }
            numeroTurno: { type: integer, minimum: 1 }
            segundosRestantes: { type: [integer, 'null'] }
        recompensaEnJuego: { type: integer, minimum: 0 }
        iniciadaEn: { type: string, format: date-time }

  securitySchemes:
    keycloak:
      type: openIdConnect
      openIdConnectUrl: /realms/nexus-battles/.well-known/openid-configuration
      description: Identidad emitida por Keycloak 26.

security:
  - keycloak: []
