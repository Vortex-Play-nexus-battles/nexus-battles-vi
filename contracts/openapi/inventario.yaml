openapi: 3.1.0
info:
  title: Servicio de inventario
  # 1.2.0 (FI-TRANSFER-1): se declara POST .../transferencias, que ya existia
  # implementada (#670) y no estaba en el contrato. Un endpoint sin declarar es
  # el mismo problema que una ruta declarada sin implementar, del reves: el
  # consumidor no puede saber que existe, y el que la llamaba lo hacia contra
  # una API «acordada de palabra». Aditivo, asi que sube la menor.
  # 1.3.0 (Grupo 2, #685): crear un elemento exige que el producto exista y
  # este activo en el catalogo (422 inexistente, 409 suspendido, 400 tipo que
  # no coincide, 503 catalogo no disponible). Aditivo: solo agrega respuestas.
  version: 1.3.0
  description: >
    Consulta paginada de la vitrina para HU-INV-001, y creacion y modificacion
    de elementos propios del jugador para HU-INV-003, y equipamiento de
    heroes con limites para HU-INV-005, y busqueda indexada de productos
    propios para HU-INV-002. HU-INV-010 registra el bloqueo de los productos
    publicados en una subasta vigente y evita operarlos mientras siga activo.

    Identidad (1.1.1, ADR-001/ADR-002/ADR-005). Las rutas del jugador exigen
    un token de acceso: si es de un jugador, el propietario es su identificador
    estable (claim uid, o sub en UUID; es el propietarioUid de HU-INV-010 y
    como el inventario guarda propietarioId) y la cabecera X-User-Name se
    ignora; si es una credencial de servicio (rol SERVICIO, por ejemplo
    salas-partidas al verificar el heroe de cada participante), X-User-Name es
    obligatoria y lleva ese identificador estable del jugador afectado
    (400 sin ella). Sin token 401. Las operaciones internas acordadas con
    Subastas siguen exigiendo su credencial (azp = ms-subastas). Hasta la
    1.0.0 X-User-Name a secas era la identidad, sin verificar.

    Solo productos del catalogo (1.2.0). Crear un elemento consulta el
    producto en el servicio de productos (GET /api/v1/productos/{id}): el
    jugador tiene instancias con nombre propio de productos que existen, no
    inventa productos (los crea el rol disenador, RG-074 del 29-jul). Un
    producto inexistente responde 422, uno suspendido 409, un tipo distinto
    al del producto 400, y si productos no responde 503: nunca se acepta a
    ciegas. En 1.1.1 cualquier productoId se aceptaba.
servers:
  - url: http://localhost:8080
    description: Entorno local de desarrollo
security:
  - TokenDeAcceso: []
paths:
  /api/v1/inventario/elementos:
    get:
      summary: Consulta la vitrina del jugador autenticado en paginas de dieciseis
      description: >
        HU-INV-001. El tamano de pagina es fijo en dieciseis porque el criterio
        de aceptacion exige ese numero de productos en la vista de referencia
        de 1360 x 768. La identidad viaja en la cabecera y nunca en la ruta:
        un jugador no puede consultar el inventario de otro. HU-INV-010 evalua
        la disponibilidad desde el bloqueo persistido: si subastas no responde
        o no envia un aviso de cierre, el producto permanece no disponible.
      operationId: consultarInventarioPaginado
      parameters:
        - name: pagina
          in: query
          required: false
          description: Numero de pagina, desde cero.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: >
            Pagina del inventario. Un jugador sin productos recibe una pagina
            vacia con este mismo estado: no tener nada no es un error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaInventario"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/IdentidadRequerida"
    post:
      summary: Crea un elemento en el inventario del jugador autenticado
      description: >
        El elemento es una instancia de un producto del catalogo. Antes de
        guardar, el servidor consulta productoId en el servicio de productos
        y exige que exista, que no este suspendido y que su tipo sea el que
        trae la peticion.
      operationId: crearElementoPropio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearElemento"
      responses:
        "201":
          description: Elemento creado y persistido en el inventario propio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElementoInventario"
        "400":
          description: >
            Datos invalidos ("Solicitud invalida") o tipo distinto al del
            producto del catalogo ("Tipo no coincide": "El tipo no coincide
            con el producto del catalogo.").
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DetalleDeProblema"
        "401":
          $ref: "#/components/responses/IdentidadRequerida"
        "409":
          $ref: "#/components/responses/ProductoSuspendido"
        "422":
          $ref: "#/components/responses/ProductoInexistente"
        "503":
          description: >
            La escritura no pudo completarse ("Inventario no disponible") o el
            servicio de productos no respondio y el producto no se pudo
            verificar ("Catalogo no disponible"). En ambos casos no se guarda
            nada.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DetalleDeProblema"
  /api/v1/inventario/elementos/busqueda:
    get:
      summary: Busca productos en el inventario del jugador autenticado
      description: >
        HU-INV-002. Usa el indice de texto de la informacion registrada en los
        elementos y solo consulta el inventario derivado de X-User-Name. El
        criterio debe contener al menos cuatro caracteres y los resultados
        conservan la paginacion fija de dieciseis elementos.
      operationId: buscarElementosInventario
      parameters:
        - name: criterio
          in: query
          required: true
          description: Texto que se busca en productoId, tipo, nombre propio y parte de armadura.
          schema:
            type: string
            minLength: 4
        - name: pagina
          in: query
          required: false
          description: Numero de pagina de coincidencias, desde cero.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Pagina de productos propios que coinciden con el criterio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaInventario"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/IdentidadRequerida"
  /api/v1/inventario/elementos/{elementoId}:
    get:
      summary: Consulta una unidad concreta para una integracion entre servicios
      description: >
        HU-INV-010. Operacion interna consumida por ms-subastas antes de publicar
        una unidad. Requiere un token OAuth2 obtenido mediante client_credentials;
        propietarioUid es un dato de negocio y no la identidad del token.
      operationId: consultarElementoInventarioPorId
      security:
        - BearerInterno: []
      parameters:
        - $ref: "#/components/parameters/ElementoId"
      responses:
        "200":
          description: Unidad encontrada con su propietario y estado de uso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetalleElementoInventario"
        "401":
          $ref: "#/components/responses/AutenticacionInternaRequerida"
        "403":
          $ref: "#/components/responses/ServicioInternoNoAutorizado"
        "404":
          $ref: "#/components/responses/ElementoNoEncontrado"
        "409":
          description: El inventario historico aun no usa identificadores UUID
    patch:
      summary: Modifica el nombre propio de un elemento del jugador autenticado
      operationId: modificarElementoPropio
      parameters:
        - name: elementoId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModificarElemento"
      responses:
        "200":
          description: Elemento modificado y persistido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElementoInventario"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/IdentidadRequerida"
        "403":
          description: El elemento pertenece al inventario de otro jugador
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DetalleDeProblema"
        "404":
          description: El elemento solicitado no existe
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DetalleDeProblema"
        "503":
          $ref: "#/components/responses/PersistenciaNoDisponible"
    delete:
      summary: Elimina un elemento disponible del inventario del jugador autenticado
      operationId: eliminarElementoPropio
      parameters:
        - $ref: "#/components/parameters/ElementoId"
      responses:
        "204":
          description: Elemento eliminado
        "401":
          $ref: "#/components/responses/IdentidadRequerida"
        "403":
          $ref: "#/components/responses/InventarioAjeno"
        "404":
          $ref: "#/components/responses/ElementoNoEncontrado"
        "409":
          $ref: "#/components/responses/ElementoNoDisponible"
        "503":
          $ref: "#/components/responses/PersistenciaNoDisponible"
  /api/v1/inventario/elementos/{elementoId}/bloqueo-subasta:
    put:
      summary: Bloquea un producto mientras su publicacion en subasta siga vigente
      description: >
        HU-INV-010. Operacion idempotente para la misma subasta. El servicio de
        subastas se autentica con OAuth2 client_credentials y envia el UUID
        estable del propietario como dato de negocio. Un elemento equipado o
        reservado por otra subasta se rechaza.
      operationId: bloquearElementoEnSubasta
      security:
        - BearerInterno: []
      parameters:
        - $ref: "#/components/parameters/ElementoId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BloquearEnSubasta"
      responses:
        "200":
          description: Producto bloqueado y marcado como no disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElementoInventario"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/AutenticacionInternaRequerida"
        "403":
          $ref: "#/components/responses/BloqueoSubastaNoAutorizado"
        "404":
          $ref: "#/components/responses/ElementoNoEncontrado"
        "409":
          $ref: "#/components/responses/ElementoNoDisponible"
        "503":
          $ref: "#/components/responses/PersistenciaNoDisponible"
  /api/v1/inventario/elementos/{elementoId}/transferencias:
    post:
      summary: Cambia de dueno un elemento al concluir una subasta
      description: >
        HU-SUB-004. La adjudicacion de una subasta mueve el elemento del
        inventario del vendedor al del comprador. El inventario esta modelado
        POR DUENO, asi que no es un cambio de campo: el elemento sale de un
        agregado y entra en otro.

        **Solo transfiere quien bloqueo.** Se exige que el elemento este
        bloqueado por ESA subasta (`subastaId`); sin esa comprobacion,
        cualquier servicio con credencial podria mover un elemento ajeno
        inventandose un identificador de subasta. El bloqueo se **conserva**
        tras la transferencia: es lo que permite deshacerla si el cobro falla
        despues, y lo que impide que el comprador use un objeto que todavia no
        ha pagado. Lo libera `DELETE .../bloqueo-subasta/{subastaId}` cuando la
        venta es definitiva.

        Idempotente por estado, no por clave: si el elemento ya pertenece al
        destino, la operacion termina bien sin volver a moverlo. Hace falta,
        porque el cierre por vencimiento de ms-subastas reintenta la misma
        subasta cada 30 s. `Idempotency-Key` se acepta y se registra, pero no
        se persiste: el estado es la verdad.

        El nuevo dueno viaja en el CUERPO y no en una cabecera de identidad
        porque de las tres veces que ms-subastas llama a esta operacion, dos
        las dispara un trabajo programado sin token de jugador —el cierre por
        vencimiento— y la tercera devuelve el elemento AL VENDEDOR como
        compensacion cuando el cobro falla, y el vendedor no es quien pidio
        nada.
      operationId: transferirElementoPorSubasta
      security:
        - BearerInterno: []
      parameters:
        - $ref: "#/components/parameters/ElementoId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferirElemento"
      responses:
        "200":
          description: >
            Elemento ya en el inventario del nuevo dueno, con su bloqueo
            intacto. Tambien es la respuesta de un reintento de una
            transferencia ya aplicada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElementoInventario"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/AutenticacionInternaRequerida"
        "403":
          $ref: "#/components/responses/TransferenciaNoAutorizada"
        "404":
          $ref: "#/components/responses/ElementoNoEncontrado"
        "409":
          $ref: "#/components/responses/TransferenciaSinBloqueo"
        "503":
          $ref: "#/components/responses/PersistenciaNoDisponible"
  /api/v1/inventario/elementos/{elementoId}/bloqueo-subasta/{subastaId}:
    delete:
      summary: Libera el producto cuando la subasta se cierra o cancela
      description: >
        HU-INV-010. El servicio de subastas envia este aviso al cerrar o
        cancelar la publicacion. La operacion es idempotente si el producto ya
        esta disponible. Si subastaId no corresponde al bloqueo vigente,
        responde 409 y conserva el producto bloqueado.
      operationId: liberarElementoDeSubasta
      security:
        - BearerInterno: []
      parameters:
        - $ref: "#/components/parameters/ElementoId"
        - $ref: "#/components/parameters/SubastaId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Producto liberado o aviso repetido procesado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElementoInventario"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/AutenticacionInternaRequerida"
        "403":
          $ref: "#/components/responses/ServicioInternoNoAutorizado"
        "404":
          $ref: "#/components/responses/ElementoNoEncontrado"
        "409":
          $ref: "#/components/responses/ElementoNoDisponible"
        "503":
          $ref: "#/components/responses/PersistenciaNoDisponible"
  /api/v1/inventario/heroes/{heroeId}/equipamiento:
    get:
      summary: Consulta las ranuras equipadas de un heroe propio
      operationId: consultarEquipamientoPropio
      parameters:
        - $ref: "#/components/parameters/HeroeId"
      responses:
        "200":
          description: Armas, armaduras e items equipados actualmente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipamientoHeroe"
        "401":
          $ref: "#/components/responses/IdentidadRequerida"
        "403":
          $ref: "#/components/responses/InventarioAjeno"
        "404":
          $ref: "#/components/responses/ElementoNoEncontrado"
  /api/v1/inventario/heroes/{heroeId}/equipamiento/{elementoId}:
    parameters:
      - $ref: "#/components/parameters/HeroeId"
      - $ref: "#/components/parameters/ElementoId"
    put:
      summary: Equipa un arma, armadura o item propio en un heroe propio
      operationId: equiparElementoPropio
      responses:
        "200":
          description: Equipamiento completo despues de ocupar la ranura
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipamientoHeroe"
        "400":
          $ref: "#/components/responses/ElementoNoEquipable"
        "401":
          $ref: "#/components/responses/IdentidadRequerida"
        "403":
          $ref: "#/components/responses/InventarioAjeno"
        "404":
          $ref: "#/components/responses/ElementoNoEncontrado"
        "409":
          $ref: "#/components/responses/LimiteEquipamiento"
        "503":
          $ref: "#/components/responses/PersistenciaNoDisponible"
    delete:
      summary: Desequipa un elemento de un heroe propio
      operationId: desequiparElementoPropio
      responses:
        "200":
          description: Equipamiento completo despues de liberar la ranura
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipamientoHeroe"
        "401":
          $ref: "#/components/responses/IdentidadRequerida"
        "403":
          $ref: "#/components/responses/InventarioAjeno"
        "404":
          $ref: "#/components/responses/ElementoNoEncontrado"
        "503":
          $ref: "#/components/responses/PersistenciaNoDisponible"
  /api/v1/inventario/heroes/{heroeId}/estadisticas:
    get:
      summary: Consulta las estadisticas de un heroe propio con el equipamiento aplicado
      description: >
        HU-INV-006. Recalcula poder, vida, defensa y las formulas de ataque,
        daño y sanacion del heroe indicado sumando los modificadores de cada
        elemento que tiene equipado actualmente. La identidad viaja en la
        cabecera y nunca en la ruta: un jugador no puede consultar las
        estadisticas del heroe de otro.
      operationId: consultarEstadisticasEquipadas
      parameters:
        - $ref: "#/components/parameters/HeroeId"
      responses:
        "200":
          description: Estadisticas del heroe con el efecto del equipamiento ya aplicado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstadisticasEquipadas"
        "401":
          $ref: "#/components/responses/IdentidadRequerida"
        "403":
          $ref: "#/components/responses/InventarioAjeno"
        "404":
          $ref: "#/components/responses/ElementoNoEncontrado"
components:
  securitySchemes:
    TokenDeAcceso:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Token de ms-identidad (RS256, JWKS). De jugador: el propietario es su
        identificador estable (uid, o sub en UUID); un token de usuario sin el
        recibe 403. De servicio (rol SERVICIO): el identificador estable del
        jugador afectado va en X-User-Name, obligatoria. Sustituye al esquema IdentidadTemporal
        (X-User-Name sin verificar) de la 1.0.0.
    BearerInterno:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token OAuth2 client_credentials emitido para ms-subastas.
  schemas:
    CrearElemento:
      type: object
      additionalProperties: false
      description: >
        productoId debe existir en el catalogo del servicio de productos y no
        estar suspendido. El tipo lo manda el producto: el campo se conserva
        por compatibilidad, pero debe coincidir con el tipo del producto o la
        peticion se rechaza con 400. parteArmadura sigue viniendo de la
        peticion (obligatoria si el tipo es ARMADURA).
      required: [productoId, tipo, nombrePropio]
      properties:
        productoId:
          type: string
          minLength: 1
          description: Identificador de un producto existente del catalogo.
        tipo:
          type: string
          enum: [HEROE, HABILIDAD, ARMA, ARMADURA, ITEM, EPICA]
          description: Debe ser el mismo tipo que tiene el producto en el catalogo.
        nombrePropio:
          type: string
          minLength: 1
        parteArmadura:
          $ref: "#/components/schemas/ParteArmadura"
    ModificarElemento:
      type: object
      additionalProperties: false
      required: [nombrePropio]
      properties:
        nombrePropio:
          type: string
          minLength: 1
    BloquearEnSubasta:
      type: object
      additionalProperties: false
      required: [propietarioUid, subastaId]
      properties:
        propietarioUid:
          type: string
          format: uuid
        subastaId:
          type: string
          format: uuid
    TransferirElemento:
      type: object
      additionalProperties: false
      required: [nuevoPropietarioUid, subastaId]
      properties:
        nuevoPropietarioUid:
          type: string
          format: uuid
          description: >
            Quien pasa a ser el dueno. El ganador de la subasta, o el vendedor
            cuando se esta deshaciendo una adjudicacion cuyo cobro fallo.
        subastaId:
          type: string
          format: uuid
          description: >
            La subasta que mantiene el bloqueo sobre el elemento. Si no
            coincide, 409 y no se mueve nada.
    ElementoInventario:
      type: object
      required: [id, productoId, tipo, nombrePropio, disponible, subastaId]
      properties:
        id: { type: string }
        productoId: { type: string }
        tipo:
          type: string
          enum: [HEROE, HABILIDAD, ARMA, ARMADURA, ITEM, EPICA]
        nombrePropio: { type: string }
        parteArmadura:
          oneOf:
            - $ref: "#/components/schemas/ParteArmadura"
            - type: "null"
        disponible:
          type: boolean
          description: Falso mientras exista un bloqueo por subasta vigente.
        subastaId:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
    DetalleElementoInventario:
      type: object
      additionalProperties: false
      required: [elementoId, productoId, propietarioUid, enUso, disponible, subastaId]
      properties:
        elementoId:
          type: string
        productoId:
          type: string
          format: uuid
        propietarioUid:
          type: string
          format: uuid
        enUso:
          type: boolean
        disponible:
          type: boolean
        subastaId:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
    ParteArmadura:
      type: string
      enum: [CASCO, PECHO, GUANTES, BRAZALETES, PANTALON, ZAPATOS]
    EquipamientoHeroe:
      type: object
      additionalProperties: false
      required: [heroeId, armas, armaduras, items]
      properties:
        heroeId:
          type: string
        armas:
          type: array
          maxItems: 2
          uniqueItems: true
          items: { type: string }
        armaduras:
          type: object
          maxProperties: 6
          propertyNames:
            $ref: "#/components/schemas/ParteArmadura"
          additionalProperties: { type: string }
        items:
          type: array
          maxItems: 2
          uniqueItems: true
          items: { type: string }
    PaginaInventario:
      type: object
      required: [elementos, numero, tamanio, totalElementos, totalPaginas, ultima]
      properties:
        elementos:
          type: array
          maxItems: 16
          items:
            $ref: "#/components/schemas/ElementoInventario"
        numero:
          type: integer
          minimum: 0
          description: Pagina devuelta, desde cero.
        tamanio:
          type: integer
          const: 16
          description: Productos por pagina, fijo por el criterio de HU-INV-001.
        totalElementos:
          type: integer
          minimum: 0
        totalPaginas:
          type: integer
          minimum: 0
        ultima:
          type: boolean
    EstadisticasEquipadas:
      type: object
      additionalProperties: false
      required: [heroeId, poder, vida, defensa]
      description: >
        Espejo de EstadisticasEquipadasResponse. ataque, dano y sanar pueden
        ser null: no todos los prototipos de heroe tienen las tres formulas
        (ver ResolutorDeEstadisticasHeroe), y la ausencia de una formula no
        es un error.
      properties:
        heroeId:
          type: string
        poder:
          type: integer
        vida:
          type: integer
        defensa:
          type: integer
        ataque:
          oneOf:
            - $ref: "#/components/schemas/FormulaDetalle"
            - type: "null"
        dano:
          oneOf:
            - $ref: "#/components/schemas/FormulaDetalle"
            - type: "null"
        sanar:
          oneOf:
            - $ref: "#/components/schemas/FormulaDetalle"
            - type: "null"
    FormulaDetalle:
      type: object
      additionalProperties: false
      required: [base, cantidadDados, caras, formula]
      properties:
        base:
          type: integer
        cantidadDados:
          type: integer
        caras:
          type: integer
        formula:
          type: string
          description: >
            Representacion legible ya formateada por el servidor, ej.
            "10 + 1d6", "1d4", o solo el valor base si no hay dados.
    DetalleDeProblema:
      type: object
      description: Formato estandar de detalles de problema RFC 9457.
      properties:
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
  responses:
    SolicitudInvalida:
      description: Los datos enviados no son validos
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/DetalleDeProblema"
    IdentidadRequerida:
      description: No se recibio la identidad autenticada del jugador
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/DetalleDeProblema"
    AutenticacionInternaRequerida:
      description: Token Bearer ausente o invalido
    ServicioInternoNoAutorizado:
      description: El token no identifica al cliente OAuth2 autorizado de ms-subastas
    BloqueoSubastaNoAutorizado:
      description: El token no identifica a ms-subastas o propietarioUid no es el propietario
    TransferenciaNoAutorizada:
      description: >
        El token no identifica a ms-subastas. Cambiar de dueno un elemento es
        mas delicado que bloquearlo, asi que no cae en el comodin de
        «cualquier servicio autenticado»: se comprueba el `azp`.
    TransferenciaSinBloqueo:
      description: >
        El elemento no esta bloqueado por esa subasta. Es 409 y no 403 a
        proposito: quien pide puede pedirlo, lo que no encaja es el estado del
        elemento, y reintentarlo va a fallar igual.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/DetalleDeProblema"
    PersistenciaNoDisponible:
      description: La escritura atomica no pudo completarse y no se aplicaron cambios parciales
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/DetalleDeProblema"
    ProductoInexistente:
      description: >
        El productoId no existe en el catalogo ("Producto inexistente": "El
        producto no existe en el catalogo."). No se guarda nada.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/DetalleDeProblema"
    ProductoSuspendido:
      description: >
        El producto existe pero esta suspendido en el catalogo ("Producto
        suspendido"). No se guarda nada.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/DetalleDeProblema"
    InventarioAjeno:
      description: El heroe o elemento pertenece al inventario de otro jugador
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/DetalleDeProblema"
    ElementoNoEncontrado:
      description: El heroe o elemento no existe
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/DetalleDeProblema"
    ElementoNoEquipable:
      description: El destino no es un heroe o el tipo no ocupa una ranura
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/DetalleDeProblema"
    LimiteEquipamiento:
      description: La ranura esta ocupada o se excede el maximo permitido
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/DetalleDeProblema"
    ElementoNoDisponible:
      description: El producto esta equipado o bloqueado por una subasta vigente
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/DetalleDeProblema"
  parameters:
    HeroeId:
      name: heroeId
      in: path
      required: true
      schema: { type: string }
    ElementoId:
      name: elementoId
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
    SubastaId:
      name: subastaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
