openapi: 3.1.0
info:
  title: Servicio de inventario
  version: 1.0.0
  description: >
    Creacion y modificacion de elementos propios del jugador para HU-INV-003.
    La identidad temporal sigue la convencion X-User-Name de ms-identidad hasta
    que HU-AUT-004 publique el subject del token.
servers:
  - url: http://localhost:8080
    description: Entorno local de desarrollo
security:
  - IdentidadTemporal: []
paths:
  /api/v1/inventario/elementos:
    post:
      summary: Crea un elemento en el inventario del jugador autenticado
      operationId: crearElementoPropio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearElemento"
      responses:
        "201":
          description: Elemento creado y persistido en el inventario propio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElementoInventario"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/IdentidadRequerida"
  /api/v1/inventario/elementos/{elementoId}:
    patch:
      summary: Modifica el nombre propio de un elemento del jugador autenticado
      operationId: modificarElementoPropio
      parameters:
        - name: elementoId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModificarElemento"
      responses:
        "200":
          description: Elemento modificado y persistido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElementoInventario"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/IdentidadRequerida"
        "403":
          description: El elemento pertenece al inventario de otro jugador
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DetalleDeProblema"
        "404":
          description: El elemento solicitado no existe
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DetalleDeProblema"
components:
  securitySchemes:
    IdentidadTemporal:
      type: apiKey
      in: header
      name: X-User-Name
      description: >
        Identidad suministrada por la capa de autenticacion. Es temporal y sera
        reemplazada por el subject del JWT cuando HU-AUT-004 este disponible.
  schemas:
    CrearElemento:
      type: object
      additionalProperties: false
      required: [productoId, tipo, nombrePropio]
      properties:
        productoId:
          type: string
          minLength: 1
        tipo:
          type: string
          enum: [HEROE, HABILIDAD, ARMA, ARMADURA, ITEM, EPICA]
        nombrePropio:
          type: string
          minLength: 1
    ModificarElemento:
      type: object
      additionalProperties: false
      required: [nombrePropio]
      properties:
        nombrePropio:
          type: string
          minLength: 1
    ElementoInventario:
      type: object
      required: [id, productoId, tipo, nombrePropio]
      properties:
        id: { type: string }
        productoId: { type: string }
        tipo:
          type: string
          enum: [HEROE, HABILIDAD, ARMA, ARMADURA, ITEM, EPICA]
        nombrePropio: { type: string }
    DetalleDeProblema:
      type: object
      description: Formato estandar de detalles de problema RFC 9457.
      properties:
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
  responses:
    SolicitudInvalida:
      description: Los datos enviados no son validos
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/DetalleDeProblema"
    IdentidadRequerida:
      description: No se recibio la identidad autenticada del jugador
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/DetalleDeProblema"
