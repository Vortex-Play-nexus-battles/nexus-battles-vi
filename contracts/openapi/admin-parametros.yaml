openapi: 3.1.0
info:
  title: Nexus Battles VI - Parametros del sistema (HU-ADM-001)
  description: >
    Configuracion de los parametros operativos desde un panel, con
    validacion, versionado y auditoria (RF-ADM-001). Grupo 6, servicio
    `admin-parametros`.

    Un parametro tiene clave, tipo, rango (o lista de opciones), valor
    vigente, quien lo cambio y cuando, y un historial de versiones. Los
    valores que el Project Charter fija como inalterables (91 dias entre
    torneos, 8 cupos, creditos por partida 2/4/1, 75 % de procesador para el
    autoescalado, 500 ms, 99,95 %...) estan en el catalogo con
    `inalterable: true`: se consultan igual que los demas pero no se editan
    (409). Un cambio puede programarse con `vigenteDesde` en el futuro: hasta
    esa fecha el valor vigente sigue siendo el anterior.

    Quien lee: cualquier servicio (regla 7: nadie toca la base de este
    modulo; `GET /parametros/{clave}/valor` es la lectura ligera). Quien
    edita: ADMINISTRADOR o SUPER_ADMINISTRADOR, con motivo. Cada cambio queda
    versionado aqui y se envia a la auditoria de ms-cumplimiento
    (HU-AUD-001, `POST /admin/auditoria/eventos` con la credencial de
    servicio); si la auditoria no responde el cambio se aplica igual y queda
    en la bitacora (fail-open, como el correo de registro).

    El catalogo inicial sale de docs/gobierno/DECISIONES-PENDIENTES-DEL-PO.md
    (D-02, D-16, D-20, D-23, D-25) y de los parametros que ms-subastas
    declara «configurables desde admin-parametros». Un parametro sin valor
    (`valor: null`) es una decision que el PO no ha tomado: el consumidor
    aplica su comportamiento por omision y lo dice.

    1.1.0 (SA-11, §7.3.7 «cambios en politicas de uso que afecten al
    usuario», RF-NOT-005) — la administracion publica aqui un cambio en una
    politica de uso (los terminos y condiciones del servicio o la politica
    de privacidad, las dos que nombran las causales de §7.3.2): que politica,
    un titulo, lo que cambia en palabras del jugador, desde cuando rige y el
    motivo. Publicar es de ADMINISTRADOR o SUPER_ADMINISTRADOR, como cambiar
    un parametro, y cada publicacion llega a la bitacora central de
    ms-cumplimiento (§7.3.5) con la misma cola y los mismos reintentos que
    los cambios de parametros (`CREACION` de `politica:<POLITICA>`, con la IP
    de quien publico y la referencia `admin-parametros:politica-<id>`, que
    hace idempotente el reintento). Leer es publico, como el catalogo: es un
    anuncio para todos los jugadores, y por eso la respuesta no lleva quien
    publico, ni el motivo ni la IP. Notificaciones lee los cambios
    posteriores a su punto de lectura (`/parametros/politicas/cambios/posteriores`)
    y los lleva a la bandeja de cada jugador en su siguiente ingreso.
    Compatible: solo anade operaciones y esquemas.
  version: 1.1.0
servers:
  - url: http://localhost:8088/api/v1
    description: Entorno local de desarrollo

security:
  - tokenDeUsuario: []

paths:
  /parametros:
    get:
      summary: Catalogo completo con el valor vigente de cada parametro
      operationId: listarParametros
      security: []
      responses:
        '200':
          description: Catalogo completo de parametros vigentes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Parametro' }

  /parametros/{clave}:
    get:
      summary: Un parametro con su valor vigente y el programado, si lo hay
      operationId: obtenerParametro
      security: []
      parameters: [ { $ref: '#/components/parameters/Clave' } ]
      responses:
        '200':
          description: El parametro con su valor vigente, su rango y su version.
          content: { application/json: { schema: { $ref: '#/components/schemas/Parametro' } } }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    put:
      summary: Cambiar el valor (ahora o con vigencia futura), con motivo
      operationId: cambiarParametro
      parameters: [ { $ref: '#/components/parameters/Clave' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CambioDeParametro' }
      responses:
        '200':
          description: Cambio aplicado (o programado); nueva version en el historial
          content: { application/json: { schema: { $ref: '#/components/schemas/Parametro' } } }
        '400':
          description: Valor fuera de rango, de tipo distinto, fuera de las opciones o sin motivo (VALOR_INVALIDO / SOLICITUD_INVALIDA)
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } }
        '401': { description: Sin token }
        '403':
          description: El rol no configura parametros (PERMISO_INSUFICIENTE)
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: El parametro es inalterable por el Charter (INALTERABLE)
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } }

  /parametros/{clave}/valor:
    get:
      summary: Lectura ligera del valor vigente, para los servicios
      operationId: valorVigente
      security: []
      parameters: [ { $ref: '#/components/parameters/Clave' } ]
      responses:
        '200':
          description: Solo el valor vigente, para el consumidor que no necesita el resto.
          content:
            application/json:
              schema:
                type: object
                required: [clave, version]
                properties:
                  clave: { type: string }
                  valor: { type: [string, 'null'], description: Siempre como texto; el tipo dice como leerlo. null = sin decision del PO }
                  tipo: { $ref: '#/components/schemas/Tipo' }
                  version: { type: integer }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /parametros/{clave}/historial:
    get:
      summary: Versiones del parametro, de la mas reciente a la mas antigua
      operationId: historialDeParametro
      parameters: [ { $ref: '#/components/parameters/Clave' } ]
      responses:
        '200':
          description: Historial de cambios del parametro, del mas reciente al mas antiguo.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Version' }
        '401': { description: Sin token }
        '403':
          description: Solo administracion ve el historial (PERMISO_INSUFICIENTE)
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /parametros/politicas/cambios:
    get:
      summary: Los cambios publicados en las politicas de uso, del mas reciente al mas antiguo (los 50 ultimos)
      operationId: historialDeCambiosDePolitica
      security: []
      responses:
        '200':
          description: Los cambios publicados, del mas reciente al mas antiguo.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CambioDePolitica' }
    post:
      summary: Publicar un cambio en una politica de uso, con motivo (SA-11, §7.3.7)
      operationId: publicarCambioDePolitica
      description: >
        Lo publica quien administra (ADMINISTRADOR o SUPER_ADMINISTRADOR) y
        queda en la bitacora central (§7.3.5). Los jugadores lo reciben en su
        bandeja de notificaciones en su siguiente ingreso. Una vigencia en el
        pasado (mas de 5 minutos) se rechaza: los jugadores se enteran desde
        hoy; sin vigencia rige desde ya.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicacionDePolitica' }
      responses:
        '201':
          description: Publicado; llega a la bandeja de cada jugador en su siguiente ingreso
          content: { application/json: { schema: { $ref: '#/components/schemas/CambioDePolitica' } } }
        '400':
          description: Politica que no existe, textos fuera de su largo, sin motivo o vigencia en el pasado (SOLICITUD_INVALIDA)
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } }
        '401': { description: Sin token }
        '403':
          description: El rol no publica cambios en las politicas (PERMISO_INSUFICIENTE)
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } }

  /parametros/politicas/cambios/posteriores:
    get:
      summary: Lo publicado despues de un punto de lectura, en el orden en que se publico
      operationId: cambiosDePoliticaPosteriores
      description: >
        La lectura de notificaciones: devuelve los cambios con `publicadoEn`
        estrictamente posterior a `desde`, del mas antiguo al mas reciente,
        hasta `limite`. `hasta` es el `publicadoEn` del ultimo que viene (o
        `desde` si no viene ninguno) y se envia como `desde` la vez siguiente;
        `completo` falso dice que hay mas despues de `hasta`.
      security: []
      parameters:
        - name: desde
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: limite
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
          description: Fuera de 1..100 se ajusta al extremo
      responses:
        '200':
          description: El lote de cambios posteriores a `desde`.
          content: { application/json: { schema: { $ref: '#/components/schemas/LoteDeCambiosDePolitica' } } }
        '400':
          description: Falta `desde` o no es una fecha ISO-8601
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } }

components:
  securitySchemes:
    tokenDeUsuario:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Clave:
      name: clave
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9.-]+$' }
      description: Por ejemplo `sanciones.suspension.maxima-dias`

  responses:
    NoEncontrado:
      description: No existe un parametro con esa clave (NO_ENCONTRADO)
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } }

  schemas:
    Tipo:
      type: string
      enum: [ENTERO, DECIMAL, BOOLEANO, TEXTO]

    Parametro:
      type: object
      required: [clave, descripcion, tipo, inalterable, version, origen]
      properties:
        clave: { type: string }
        descripcion: { type: string }
        tipo: { $ref: '#/components/schemas/Tipo' }
        valor: { type: [string, 'null'], description: Valor vigente ahora, como texto. null = sin decision del PO }
        unidad: { type: [string, 'null'] }
        minimo: { type: [number, 'null'] }
        maximo: { type: [number, 'null'] }
        opciones:
          type: [array, 'null']
          items: { type: string }
          description: Para TEXTO con valores cerrados (por ejemplo LIBERAR | CONSUMIR)
        inalterable: { type: boolean, description: Fijado por el Charter; no editable }
        origen: { type: string, description: De donde sale el valor (D-xx, Charter, HU) }
        version: { type: integer }
        actualizadoPor: { type: [string, 'null'], format: uuid }
        actualizadoEn: { type: [string, 'null'], format: date-time }
        valorProgramado: { type: [string, 'null'] }
        vigenteDesde: { type: [string, 'null'], format: date-time, description: Cuando entra el valor programado }

    CambioDeParametro:
      type: object
      required: [motivo]
      properties:
        valor: { type: [string, 'null'], description: Nuevo valor como texto; null vacia una decision (solo si el parametro lo admite) }
        motivo: { type: string, minLength: 3, maxLength: 500 }
        vigenteDesde:
          type: [string, 'null']
          format: date-time
          description: Si es futura, el cambio queda programado (CA-03); si falta o ya paso, se aplica ahora

    Version:
      type: object
      required: [version, cambiadoPor, cambiadoEn, motivo]
      properties:
        version: { type: integer }
        valorAnterior: { type: [string, 'null'] }
        valorNuevo: { type: [string, 'null'] }
        motivo: { type: string }
        cambiadoPor: { type: string, format: uuid }
        cambiadoEn: { type: string, format: date-time }
        vigenteDesde: { type: string, format: date-time }

    Politica:
      type: string
      enum: [TERMINOS_Y_CONDICIONES, POLITICA_DE_PRIVACIDAD]
      description: Las politicas de uso que nombran las causales de sancion (§7.3.2)

    PublicacionDePolitica:
      type: object
      required: [politica, titulo, descripcion, motivo]
      properties:
        politica: { $ref: '#/components/schemas/Politica' }
        titulo: { type: string, minLength: 5, maxLength: 120 }
        descripcion: { type: string, minLength: 20, maxLength: 2000, description: Lo que cambia, en palabras del jugador }
        vigenteDesde:
          type: [string, 'null']
          format: date-time
          description: Desde cuando rige; sin ella, desde ya. No puede estar en el pasado (holgura de 5 minutos)
        motivo: { type: string, minLength: 3, maxLength: 500, description: Va a la bitacora central, no al jugador }

    CambioDePolitica:
      type: object
      required: [id, politica, nombreDeLaPolitica, titulo, descripcion, vigenteDesde, publicadoEn]
      properties:
        id: { type: string, format: uuid }
        politica: { $ref: '#/components/schemas/Politica' }
        nombreDeLaPolitica: { type: string, description: Como se lee (por ejemplo «Política de privacidad») }
        titulo: { type: string }
        descripcion: { type: string }
        vigenteDesde: { type: string, format: date-time }
        publicadoEn: { type: string, format: date-time }

    LoteDeCambiosDePolitica:
      type: object
      required: [cambios, hasta, completo]
      properties:
        cambios:
          type: array
          items: { $ref: '#/components/schemas/CambioDePolitica' }
        hasta: { type: string, format: date-time, description: El punto de lectura siguiente }
        completo: { type: boolean, description: Falso si hay mas despues de `hasta` }

    ProblemDetail:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        motivo:
          type: string
          enum: [PERMISO_INSUFICIENTE, SOLICITUD_INVALIDA, VALOR_INVALIDO, NO_ENCONTRADO, INALTERABLE]
