openapi: 3.1.0
info:
  title: Nexus Battles VI - Moderacion y Sanciones (consulta de sancion activa)
  description: >
    Consulta de solo lectura para que otros microservicios sepan si un jugador
    tiene una sancion activa que le impida participar en una operacion (por
    ejemplo, HU-SUB-001: no publicar subastas con sanciones activas).

    1.1.0 (Sprint 3, HU-USR-004..006 #477 #478 #479): la respuesta sale del
    historial real de sanciones (moderacion-sanciones-admin.yaml). Restringe
    una SUSPENSION no vencida o un BANEO no revertidos; una ADVERTENCIA nunca
    (CA-02 de HU-USR-004). Se anade `tipo` para que el consumidor distinga
    (D-14 actualizada: silencia la suspension o el baneo, no la advertencia).
    Compatible con 1.0.0: la forma anterior no cambia.

    1.3.0 (R12, HU-ADM-001 CA-04): se anade `GET /sanciones/limites`. El rango
    de la suspension y el plazo de apelacion son configurables desde
    admin-parametros, y la interfaz los tenia escritos a mano en cinco sitios
    («30 dias», `max="720"`): bajar el plazo a 7 dejaba al jugador con un boton
    «Apelar» que el servicio rechazaba. Este recurso publica los que el
    servicio aplica AHORA, que es la unica fuente que no se puede desincronizar.
    Aditivo: no cambia nada de 1.2.0.

    1.4.0 (B0/B2): `GET /sanciones/usuarios/{usuarioId}/activa` deja de ser
    publico. La auditoria contractual encontro que cualquiera, sin sesion,
    podia leer el motivo y la vigencia de la sancion de cualquier jugador (y
    los uid son publicos en los torneos). Ahora exige token: un JUGADOR solo
    consulta la suya (el contador de tiempo restante del 7.3.2); un token de
    servicio o de MODERADOR, ADMINISTRADOR o SUPER_ADMINISTRADOR, la de
    cualquiera. La forma de la respuesta no cambia.
  version: 1.4.0
servers:
  - url: http://localhost:8086/api/v1
    description: Entorno local de desarrollo

paths:
  /sanciones/usuarios/{usuarioId}/activa:
    get:
      summary: Consultar si un usuario tiene una sancion activa
      operationId: consultarSancionActiva
      security:
        - bearerAuth: []
      parameters:
        - name: usuarioId
          in: path
          required: true
          description: >
            Identificador publico y estable del jugador (claim "uid" del JWT
            de identidad), no el id interno secuencial.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Estado de sancion del usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SancionActivaResponse'
        '400':
          description: usuarioId no tiene formato de UUID valido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: 1.4.0 — sin token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: 1.4.0 — un jugador consultando la sancion de otro.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /sanciones/metricas:
    get:
      summary: Agregados de moderacion de un periodo (HU-MET-001 / RF-MET-001)
      description: >
        Solo cuentas, sin identificadores de jugador ni de moderador: sanciones
        emitidas por tipo y por dia, apelaciones por estado (las abiertas en el
        periodo), moderadores distintos que emitieron y sanciones revertidas.
        Lo consume metricas-plataforma para el tablero de usuarios y
        moderacion. Sin `desde`/`hasta`: los ultimos 30 dias. Un periodo sin
        actividad devuelve ceros, no error. Version 1.2.0 (compatible).
      operationId: metricasDeModeracion
      parameters:
        - name: desde
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: hasta
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Agregados del periodo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricasDeModeracion'
        '400':
          description: Periodo invalido (hasta no posterior a desde)

  /sanciones/limites:
    get:
      summary: Limites vigentes de sancion (HU-ADM-001 CA-04 / RF-ADM-001)
      description: >
        Rango de la suspension temporal y plazo de apelacion tal como los
        aplica el servicio en este momento. Salen de admin-parametros
        (`sanciones.suspension.minima-horas`, `sanciones.suspension.maxima-dias`
        y `sanciones.apelacion.plazo-dias`) y, si el catalogo no responde, del
        respaldo de variable de entorno del propio servicio: nunca falla por
        esa causa.

        Lo consume la interfaz para no llevar los numeros escritos a mano. No
        devuelve ningun identificador de jugador, pero exige sesion como el
        resto de `/sanciones/**`: las dos vistas que lo usan son de usuario
        autenticado. Si el consumidor no lo puede leer, debe hablar del plazo
        SIN numero, nunca suponer uno.
      operationId: limitesDeSancion
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Los limites que aplica el servicio ahora mismo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitesDeSancion'
        '401':
          description: Sin sesion.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT


  schemas:
    SancionActivaResponse:
      type: object
      required:
        - sancionActiva
      properties:
        sancionActiva:
          type: boolean
        motivo:
          type: string
          nullable: true
          description: Solo presente si sancionActiva es true.
        vigenteHasta:
          type: string
          format: date-time
          nullable: true
          description: Solo presente si sancionActiva es true y es una SUSPENSION (un BANEO no vence).
        tipo:
          type: string
          nullable: true
          enum: [SUSPENSION, BANEO, null]
          description: (1.1.0) Que sancion restringe. Solo presente si sancionActiva es true.
        sancionId:
          type: string
          format: uuid
          nullable: true
          description: (1.4.0) La sancion que restringe, para levantarla o apelarla. Solo presente si sancionActiva es true.
      examples:
        - sancionActiva: false
          motivo: null
          vigenteHasta: null
          tipo: null
        - sancionActiva: true
          motivo: "Lenguaje ofensivo reiterado"
          vigenteHasta: "2026-09-20T00:00:00Z"
          tipo: SUSPENSION

    LimitesDeSancion:
      type: object
      required:
        - suspensionMinimaHoras
        - suspensionMaximaHoras
        - suspensionMaximaDias
        - apelacionPlazoDias
      properties:
        suspensionMinimaHoras:
          type: integer
          description: Duracion minima de una suspension temporal, en horas.
        suspensionMaximaHoras:
          type: integer
          description: >
            El mismo maximo que `suspensionMaximaDias`, en horas. Va las dos
            veces para que el formulario use el tope de su campo sin repetir la
            conversion (y equivocarse, que es lo que pasaba con `max="720"`).
        suspensionMaximaDias:
          type: integer
          description: Duracion maxima de una suspension temporal, en dias.
        apelacionPlazoDias:
          type: integer
          description: Dias desde la emision durante los que se puede apelar.
      examples:
        - suspensionMinimaHoras: 1
          suspensionMaximaHoras: 720
          suspensionMaximaDias: 30
          apelacionPlazoDias: 30
        - suspensionMinimaHoras: 2
          suspensionMaximaHoras: 48
          suspensionMaximaDias: 2
          apelacionPlazoDias: 7

    ProblemDetail:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string

    MetricasDeModeracion:
      type: object
      required: [desde, hasta, total, porTipo, porDia, apelaciones, moderadoresActivos, revertidas]
      properties:
        desde: { type: string, format: date-time }
        hasta: { type: string, format: date-time }
        total: { type: integer }
        porTipo:
          type: object
          properties:
            ADVERTENCIA: { type: integer }
            SUSPENSION: { type: integer }
            BANEO: { type: integer }
        porDia:
          type: array
          items:
            type: object
            properties:
              fecha: { type: string, format: date }
              emitidas: { type: integer }
        apelaciones:
          type: object
          properties:
            PENDIENTE: { type: integer }
            MANTENIDA: { type: integer }
            REDUCIDA: { type: integer }
            REVERTIDA: { type: integer }
        moderadoresActivos: { type: integer }
        revertidas: { type: integer }
