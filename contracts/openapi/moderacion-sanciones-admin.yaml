openapi: 3.1.0
info:
  title: Nexus Battles VI - Moderacion y Sanciones (emision y apelaciones)
  description: >
    Historial disciplinario de los jugadores: advertencias (RF-USR-004),
    suspensiones temporales (RF-USR-005), baneos definitivos (RF-USR-006) y
    apelaciones (RF-USR-007). Grupo 6, servicio `moderacion-sanciones`.

    Quien actua sale SIEMPRE del token (claims `uid` y `rol`, ADR-002), nunca
    del cuerpo. Reglas de rol (Tabla 24 del documento oficial): moderador,
    administrador y super administrador emiten advertencias y suspensiones;
    el moderador solo sanciones temporales, asi que el BANEO es de
    administrador o super administrador y exige `confirmacion: true`. Las
    apelaciones las abre el sancionado (una abierta por sancion, dentro de 30
    dias desde la emision) y las resuelve un administrador con decision
    motivada: MANTENIDA, REDUCIDA (nueva fecha fin) o REVERTIDA.

    Lo que este contrato NO cubre: el estado de la cuenta en ms-identidad
    (rechazar el inicio de sesion, cerrar sesiones: HU-AUT-004 #50, Grupo 4)
    ni el correo (HU-NOT-005 por correo: pendiente de un contrato de lectura
    de correo por uid). El aviso en la app SI: cada emision y cada resolucion
    llegan a la bandeja del jugador por `POST /internal/notifications` con la
    credencial de servicio de este modulo (CA-06 de HU-NOT-005), con reintento
    (CA-04). Ninguna sancion se borra: revertir o reducir actualiza (CA-04 de
    HU-USR-006). Todo cambio incompatible abre version nueva (regla 2).

    1.1.0 (B0/B2, aditivo — sanciones unificadas). Esta es la UNICA fuente de
    verdad de las sanciones. Cada emision, reversion, reduccion o
    levantamiento que cambia el acceso se proyecta sobre la cuenta en
    ms-identidad (`PUT /api/v1/internal/usuarios/{uid}/estado-sancion`, con
    reintento hasta confirmarse), que es lo que niega el login a una cuenta
    suspendida o baneada y revoca sus sesiones. La suspension y el baneo se
    notifican al correo (`POST /correos/sancion`; 7.3.2), con la direccion
    que ms-identidad da por `GET /api/v1/internal/usuarios/{uid}/contacto`.
    Nuevo `POST /sanciones/{sancionId}/levantamiento`: un Administrador o
    Super Administrador levanta una sancion vigente sin pasar por apelacion
    (el «reactivar» del panel de usuarios). Los roles se comparan con
    jerarquia: SUPER_ADMINISTRADOR puede todo lo de ADMINISTRADOR.

    1.2.0 (B2, aditivo): implementado `POST /sanciones/{sancionId}/levantamiento`
    y las salidas de 1.1.0. Cada emision, resolucion de apelacion y
    levantamiento deja en la misma transaccion sus salidas en una cola
    persistente con reintento (aviso en la app, proyeccion en ms-identidad y
    correo), asi que la sancion queda registrada aunque identidad o correo
    esten caidos. La proyeccion lleva el estado de acceso VIGENTE del jugador
    en el momento de entregarse, no el del evento. El correo sale con
    `Idempotency-Key` estable (`sancion-<id>-emision`,
    `apelacion-<id>-resolucion`); la advertencia tambien se avisa por correo y
    no proyecta nada; el levantamiento no se envia por correo porque
    `correo.yaml` 1.4.0 no tiene tipo para el. Menor y no parche porque el
    levantamiento documenta su 400 y su 409, y el 409 trae un motivo nuevo en
    `ProblemDetail.motivo`: `SANCION_NO_VIGENTE`.

    1.3.0 (7.3.1, aditivo — jerarquia). La Tabla 24 dice que puede hacer cada
    rol; la jerarquia dice sobre quien: emitir, levantar y resolver la
    apelacion solo sobre una cuenta de rol ESTRICTAMENTE inferior al de quien
    actua (Jugador < Moderador < Administrador < Super Administrador). Antes un
    moderador podia suspender a un administrador y un administrador banear a
    un super administrador. El rol de la cuenta se pregunta a ms-identidad en
    el momento (`GET /api/v1/internal/usuarios/{uid}/rol`, credencial de
    servicio) y no se guarda. Si no se puede (ms-identidad no responde),
    **503** `identidad-no-disponible` con `Retry-After` y no se registra nada:
    una sancion puede esperar unos segundos; una indebida no se deshace sola.
    Una cuenta que no existe en ms-identidad es 404 `no-encontrada`. Rechazo
    por jerarquia: 403 `jerarquia-insuficiente` (`ProblemDetail.motivo`
    `JERARQUIA_INSUFICIENTE`). Para sancionar a una cuenta administrativa, un
    Super Administrador le cambia el rol primero (y ese cambio queda auditado).

    1.4.0 (SA-4, aditivo — causales, listado, plazos). (a) **Causal**: §7.3.2
    «Causales de sancion» enumera ocho; cada sancion puede llevar la suya
    (`causal`, enumerado `Causal`), ademas del `motivo` con el hecho concreto.
    Es opcional en la API para no romper a quien ya emite (la consola la
    exige) y viaja al aviso y al correo con el texto del documento oficial
    (§7.3.7). Una causal fuera del enumerado es 400. (b) **Listado global**
    `GET /sanciones` con filtros por tipo, causal, estado (vigente, cumplida o
    revertida), cuenta y periodo de emision, paginado de 16 en 16 y de la mas
    reciente a la mas antigua; solo quien modera. (c) **Plazo de decision**:
    cada `Apelacion` trae `decisionAntesDe`, el final del decimoquinto dia
    habil desde que se presento (§7.3.2 «notificacion de la decision final en
    un plazo de 15 dias habiles»; de lunes a viernes en la hora de Colombia,
    sin los festivos que se configuren), y `vencida`, si sigue pendiente fuera
    de ese plazo. Al apelar, el sancionado recibe en la app el aviso
    `APELACION_RECIBIDA` con esa fecha. (d) `GET /apelaciones?estado=`
    PENDIENTES (por omision), RESUELTAS o TODAS. (e) **El baneo solo se
    revierte por apelacion**: §7.3.2 lo define como «inhabilitacion
    permanente» y RF-USR-007 fija la apelacion como la via para revertirlo.
    `POST /sanciones/{id}/levantamiento` sobre un baneo responde 409
    `baneo-solo-por-apelacion`, tambien a un Super Administrador; ms-identidad
    ya se negaba a reactivar una cuenta baneada. Menor y no mayor porque
    ninguna operacion, parametro obligatorio ni propiedad de respuesta
    desaparece: el 409 es un motivo nuevo de un error ya documentado.

    1.5.0 (HU-USR-008, aditivo; #909 de Santiago Anaya, integrado en SA-4):
    nuevo `GET /sanciones/reincidentes`, la lista de quienes tienen N
    sanciones o mas **no revertidas** (de cualquier tipo; una revertida por
    apelacion o levantada ya no cuenta). Es una de las dos senales de
    «comportamiento sospechoso» que fijo el Product Owner en la historia (la
    otra, las cuentas bloqueadas por intentos fallidos, es de ms-identidad).
    Sin `minimo` es 3, el numero del PO («con 3 tambien», D-45). Solo quien
    modera: lleva identificadores de personas, asi que no es publica como
    `/sanciones/metricas`.
  version: 1.5.0
servers:
  - url: http://localhost:8086/api/v1
    description: Entorno local de desarrollo

security:
  - tokenDeUsuario: []

paths:
  /sanciones:
    post:
      summary: Emitir una sancion (advertencia, suspension o baneo)
      operationId: emitirSancion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmitirSancionRequest'
            examples:
              advertencia:
                value: { usuarioId: 11111111-1111-1111-1111-111111111111, tipo: ADVERTENCIA, causal: LENGUAJE_OFENSIVO, motivo: Lenguaje ofensivo en el chat, politica: Normas de convivencia }
              suspension:
                value: { usuarioId: 11111111-1111-1111-1111-111111111111, tipo: SUSPENSION, causal: ACOSO, motivo: Reincidencia, duracionHoras: 48 }
              baneo:
                value: { usuarioId: 11111111-1111-1111-1111-111111111111, tipo: BANEO, causal: FRAUDE, motivo: Fraude comprobado en subastas, confirmacion: true }
      responses:
        '201':
          description: Sancion emitida y anotada en el historial
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sancion'
        '400':
          description: >-
            Sin motivo, duracion fuera de rango, baneo sin confirmacion,
            autosancion (`solicitud-invalida`), o 1.4.0, una `causal` que no
            es de las ocho de §7.3.2.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } }
        '401':
          description: Sin token o token invalido
        '403':
          description: >-
            El rol no alcanza (jugador; moderador baneando; token de servicio)
            (`permiso-insuficiente`), o 1.3.0, la cuenta tiene un rol igual o
            superior al de quien actua (`jerarquia-insuficiente`).
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } }
        '404':
          description: 1.3.0 — la cuenta no existe en ms-identidad (`no-encontrada`).
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } }
        '409':
          description: El usuario ya esta baneado; no procede ninguna sancion mas (`usuario-baneado`)
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } }
        '503':
          $ref: '#/components/responses/IdentidadNoDisponible'
    get:
      summary: Listado global de sanciones con filtros (1.4.0)
      operationId: listarSanciones
      description: |
        Todas las sanciones, de la mas reciente a la mas antigua, con los
        filtros combinados con Y. Solo quien modera (moderador, administrador
        o super administrador); un jugador recibe 403. `estado` aplica la misma
        regla que `vigente`: VIGENTE es «no revertida y, si es suspension, no
        vencida»; CUMPLIDA, una suspension que ya termino; REVERTIDA, la
        levantada o revertida en apelacion.
      parameters:
        - name: tipo
          in: query
          required: false
          schema: { type: string, enum: [ADVERTENCIA, SUSPENSION, BANEO] }
        - name: causal
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Causal' }
        - name: estado
          in: query
          required: false
          schema: { type: string, enum: [VIGENTE, CUMPLIDA, REVERTIDA] }
        - name: usuarioId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Claim `uid` de la cuenta sancionada.
        - name: desde
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Emitidas desde este instante (incluido), ISO-8601 con zona.
        - name: hasta
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Emitidas antes de este instante (excluido); posterior a `desde`.
        - name: pagina
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: tamano
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 16 }
          description: Dieciseis por pagina por omision (RNF-USA-001).
      responses:
        '200':
          description: Una pagina del listado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaDeSanciones' }
        '400':
          description: >-
            Un filtro fuera de su enumerado, una fecha que no es ISO-8601,
            `hasta` no posterior a `desde`, o una pagina o un tamano fuera de
            rango (`solicitud-invalida`).
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } }
        '401':
          description: Sin token o token invalido
        '403':
          description: No moderas (`permiso-insuficiente`).
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } }

  /sanciones/usuarios/{usuarioId}:
    get:
      summary: Historial de sanciones de un usuario (el propio usuario o quien modera)
      operationId: historialDeSanciones
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
      responses:
        '200':
          description: Del mas reciente al mas antiguo; vacio si nunca fue sancionado
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Sancion' }
        '403':
          description: Un jugador pidiendo el historial de otro
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } }

  /sanciones/reincidentes:
    get:
      summary: Usuarios con varias sanciones no revertidas (comportamiento sospechoso, HU-USR-008)
      operationId: reincidentesDeSanciones
      parameters:
        - name: minimo
          in: query
          required: false
          description: Sanciones no revertidas desde las que un usuario entra en la lista. Por omision 3 (D-45, decision del PO).
          schema: { type: integer, minimum: 1, default: 3 }
      responses:
        '200':
          description: >
            Del mas sancionado al menos y, a igual cantidad, del mas reciente. La lista se corta
            en 100 usuarios; `total` dice cuantos cumplen el criterio en realidad.
          content: { application/json: { schema: { $ref: '#/components/schemas/Reincidentes' } } }
        '400':
          description: '`minimo` menor que 1 (`solicitud-invalida`)'
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } }
        '403':
          description: Un jugador (esta lista es de quien modera)
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } }

  /sanciones/{sancionId}:
    get:
      summary: Una sancion
      operationId: obtenerSancion
      parameters:
        - $ref: '#/components/parameters/SancionId'
      responses:
        '200':
          description: La sancion con su estado actual y su apelacion, si la tiene.
          content: { application/json: { schema: { $ref: '#/components/schemas/Sancion' } } }
        '403':
          description: No es tuya y no moderas
        '404':
          description: No existe (`no-encontrada`)

  /sanciones/{sancionId}/apelaciones:
    post:
      summary: Apelar una sancion propia (HU-USR-007)
      operationId: apelarSancion
      parameters:
        - $ref: '#/components/parameters/SancionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [argumento]
              properties:
                argumento: { type: string, maxLength: 2000 }
      responses:
        '201':
          description: >-
            Apelacion abierta, asignada al panel de revision. 1.4.0: con su
            `decisionAntesDe`, y el sancionado recibe en la app el aviso
            `APELACION_RECIBIDA` con esa fecha.
          content: { application/json: { schema: { $ref: '#/components/schemas/Apelacion' } } }
        '400':
          description: Sin argumento (`solicitud-invalida`)
        '404':
          description: No existe la sancion (`no-encontrada`)
        '422':
          description: No procede — no es tuya, ya no esta vigente, fuera de los 30 dias, o ya hay una abierta (`apelacion-no-procede`)
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } }

  /sanciones/{sancionId}/levantamiento:
    post:
      summary: Levanta una sancion vigente (1.1.0)
      operationId: levantarSancion
      description: |
        Solo ADMINISTRADOR o SUPER_ADMINISTRADOR. La sancion queda revertida
        con el motivo y el autor (no se borra), se proyecta sobre la cuenta el
        estado de acceso que le quede al jugador (`ACTIVO` si no tiene otra
        sancion que lo restrinja) y se avisa al jugador en la app. Levantar
        una sancion ya no vigente (revertida, o suspension vencida) responde
        409. Una apelacion abierta sobre la sancion no se toca: la resuelve el
        panel.

        1.4.0: un baneo no se levanta desde aqui, ni por un Super
        Administrador (§7.3.2, «inhabilitacion permanente»): solo lo revierte
        una apelacion favorable del panel. Responde 409
        `baneo-solo-por-apelacion` y nada cambia.
      security:
        - tokenDeUsuario: []
      parameters:
        - $ref: '#/components/parameters/SancionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo: { type: string, minLength: 3, maxLength: 1000 }
      responses:
        '200':
          description: Sancion levantada.
          content: { application/json: { schema: { $ref: '#/components/schemas/Sancion' } } }
        '400':
          description: Motivo vacio, de menos de 3 o de mas de 1000 caracteres (`solicitud-invalida`).
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } }
        '403':
          description: >-
            Rol insuficiente (`permiso-insuficiente`), o 1.3.0, la cuenta
            sancionada tiene un rol igual o superior (`jerarquia-insuficiente`).
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } }
        '404':
          description: No existe (`no-encontrada`).
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } }
        '409':
          description: >-
            La sancion ya no esta vigente (`sancion-no-vigente`), o 1.4.0, es
            un baneo: solo lo revierte una apelacion (`baneo-solo-por-apelacion`).
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } }
        '503':
          $ref: '#/components/responses/IdentidadNoDisponible'

  /apelaciones:
    get:
      summary: Apelaciones pendientes (panel) o las propias
      operationId: listarApelaciones
      parameters:
        - name: mias
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: "`true`: las del propio usuario, con su estado. `false` (por omision): el panel, solo para quien modera."
        - name: estado
          in: query
          required: false
          schema: { type: string, enum: [PENDIENTES, RESUELTAS, TODAS], default: PENDIENTES }
          description: >-
            1.4.0, solo el panel (`mias=false`): las pendientes (por omision),
            las resueltas o todas. Un valor fuera del enumerado es 400.
      responses:
        '200':
          description: >-
            Las pendientes, de la mas antigua a la mas reciente (el orden en
            que vencen); las resueltas, de la ultima decision a la primera;
            todas, de la mas reciente a la mas antigua.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Apelacion' }
        '400':
          description: 1.4.0 — un `estado` fuera de su enumerado.
        '403':
          description: Un jugador pidiendo el panel

  /apelaciones/{apelacionId}/resolucion:
    post:
      summary: Resolver una apelacion (administrador o super administrador)
      operationId: resolverApelacion
      parameters:
        - name: apelacionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, motivo]
              properties:
                decision:
                  type: string
                  enum: [MANTENIDA, REDUCIDA, REVERTIDA]
                motivo: { type: string, maxLength: 1000 }
                nuevaVigencia:
                  type: string
                  format: date-time
                  description: Obligatoria con REDUCIDA; anterior a la fecha fin actual y posterior a ahora.
      responses:
        '200':
          description: Resuelta; con REDUCIDA o REVERTIDA la sancion ya cambio (CA-04) y el jugador queda avisado
          content: { application/json: { schema: { $ref: '#/components/schemas/Apelacion' } } }
        '400':
          description: Sin motivo, REDUCIDA sin fecha, fecha invalida, reducir algo que no es suspension
        '403':
          description: >-
            El rol no alcanza (`permiso-insuficiente`), o 1.3.0, la cuenta
            sancionada tiene un rol igual o superior (`jerarquia-insuficiente`)
        '404':
          description: No existe (`no-encontrada`)
        '409':
          description: Ya estaba resuelta (`apelacion-resuelta`)
        '503':
          $ref: '#/components/responses/IdentidadNoDisponible'

components:
  responses:
    IdentidadNoDisponible:
      description: >-
        1.3.0 — ms-identidad no dijo el rol de la cuenta (no responde, tiempo
        agotado o respuesta ilegible): sin saberlo no se decide
        (`identidad-no-disponible`). No se registro nada.
      headers:
        Retry-After:
          description: Segundos sugeridos antes de reintentar (30).
          schema:
            type: integer
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } }
  securitySchemes:
    tokenDeUsuario:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de sesion de ms-identidad (ADR-002) con claims `uid` y `rol`.

  parameters:
    UsuarioId:
      name: usuarioId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Claim `uid` del jugador, no su id interno.
    SancionId:
      name: sancionId
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    Causal:
      type: string
      description: >-
        1.4.0 — las ocho causales de §7.3.2, en su orden: uso de lenguaje
        ofensivo o abusivo en comentarios o chat; acoso a otros jugadores;
        intentos de fraude o manipulacion del sistema; uso de software no
        autorizado o trampas; suplantacion de identidad; violacion de
        politicas de privacidad; incumplimiento de terminos y condiciones del
        servicio; terminacion de la relacion legal entre las partes.
      enum:
        - LENGUAJE_OFENSIVO
        - ACOSO
        - FRAUDE
        - SOFTWARE_NO_AUTORIZADO
        - SUPLANTACION_DE_IDENTIDAD
        - VIOLACION_DE_PRIVACIDAD
        - INCUMPLIMIENTO_DE_TERMINOS
        - TERMINACION_DE_RELACION_LEGAL

    EmitirSancionRequest:
      type: object
      required: [usuarioId, tipo, motivo]
      properties:
        usuarioId: { type: string, format: uuid }
        tipo:
          type: string
          enum: [ADVERTENCIA, SUSPENSION, BANEO]
        causal:
          $ref: '#/components/schemas/Causal'
          description: 1.4.0 — por cual causal de §7.3.2 se sanciona. Opcional en la API; la consola la exige.
        motivo: { type: string, maxLength: 1000, description: El hecho concreto; obligatorio siempre }
        politica: { type: string, maxLength: 200, description: Politica violada, si aplica }
        comentarioId: { type: string, maxLength: 64, description: Comentario que origino la sancion (HU-COM-006/008), si aplica }
        duracionHoras:
          type: integer
          minimum: 1
          description: Solo SUSPENSION. Rango configurable (por omision 1 hora a 30 dias, D-20).
        confirmacion:
          type: boolean
          default: false
          description: Solo BANEO. Debe ser `true` (CA-01 de HU-USR-006).

    Sancion:
      type: object
      required: [id, usuarioId, tipo, motivo, emitidaPor, rolEmisor, emitidaEn, vigente]
      properties:
        id: { type: string, format: uuid }
        usuarioId: { type: string, format: uuid }
        tipo: { type: string, enum: [ADVERTENCIA, SUSPENSION, BANEO] }
        causal:
          description: 1.4.0 — la causal de §7.3.2; `null` en las emitidas sin ella (las anteriores a 1.4.0).
          oneOf:
            - $ref: '#/components/schemas/Causal'
            - type: 'null'
        motivo: { type: string }
        politica: { type: [string, 'null'] }
        comentarioId: { type: [string, 'null'] }
        emitidaPor: { type: string, format: uuid }
        rolEmisor: { type: string }
        emitidaEn: { type: string, format: date-time }
        vigenteHasta: { type: [string, 'null'], format: date-time, description: Solo SUSPENSION }
        revertidaEn: { type: [string, 'null'], format: date-time }
        motivoReversion: { type: [string, 'null'] }
        vigente:
          type: boolean
          description: No revertida y, si es suspension, no vencida. Una advertencia vigente no restringe.

    Reincidentes:
      type: object
      required: [minimo, total, usuarios]
      properties:
        minimo: { type: integer, minimum: 1, description: El criterio aplicado (sanciones no revertidas o mas) }
        total: { type: integer, minimum: 0, description: Cuantos usuarios lo cumplen, aunque `usuarios` venga cortada }
        usuarios:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/UsuarioReincidente' }

    UsuarioReincidente:
      type: object
      required: [usuarioId, sanciones, ultimaEn]
      properties:
        usuarioId: { type: string, format: uuid }
        sanciones: { type: integer, minimum: 1, description: Sanciones no revertidas, de cualquier tipo }
        ultimaEn: { type: string, format: date-time, description: Cuando recibio la ultima de ellas }

    Apelacion:
      type: object
      required: [id, sancionId, usuarioId, argumento, creadaEn, estado, decisionAntesDe, vencida]
      properties:
        id: { type: string, format: uuid }
        sancionId: { type: string, format: uuid }
        usuarioId: { type: string, format: uuid }
        argumento: { type: string }
        creadaEn: { type: string, format: date-time }
        estado: { type: string, enum: [PENDIENTE, MANTENIDA, REDUCIDA, REVERTIDA] }
        decisionMotivo: { type: [string, 'null'] }
        resueltaPor: { type: [string, 'null'], format: uuid }
        resueltaEn: { type: [string, 'null'], format: date-time }
        nuevaVigencia: { type: [string, 'null'], format: date-time }
        decisionAntesDe:
          type: string
          format: date-time
          description: >-
            1.4.0 — el ultimo instante para notificar la decision: el final
            (23:59:59.999, hora de Colombia) del decimoquinto dia habil
            siguiente a `creadaEn` (§7.3.2). Dias habiles: de lunes a viernes,
            sin los festivos configurados.
        vencida:
          type: boolean
          description: 1.4.0 — sigue PENDIENTE y ya paso `decisionAntesDe`. Una resuelta nunca va vencida.

    PaginaDeSanciones:
      type: object
      description: 1.4.0 — una pagina del listado global.
      required: [contenido, pagina, tamano, total, totalPaginas]
      properties:
        contenido:
          type: array
          items: { $ref: '#/components/schemas/Sancion' }
        pagina: { type: integer, minimum: 0 }
        tamano: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0, description: Sanciones que cumplen los filtros. }
        totalPaginas: { type: integer, minimum: 0 }

    ProblemDetail:
      type: object
      description: RFC 9457. `type` = https://nexusbattles.local/errores/<motivo-en-kebab>; `motivo` repite el motivo en mayusculas.
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        motivo:
          type: string
          enum: [PERMISO_INSUFICIENTE, SOLICITUD_INVALIDA, USUARIO_BANEADO, NO_ENCONTRADA, APELACION_NO_PROCEDE, APELACION_RESUELTA, SANCION_NO_VIGENTE, JERARQUIA_INSUFICIENTE, IDENTIDAD_NO_DISPONIBLE, BANEO_SOLO_POR_APELACION]
