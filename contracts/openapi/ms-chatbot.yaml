openapi: 3.1.0

# =============================================================================
# Nexus Battles VI — Chatbot de soporte (ms-chatbot · equipo de Cuentas y
# comercio, Grupo 4)
#
# Regla 1 de plataforma: contrato primero. Este documento se escribe A PARTIR
# de lo que `services/cuentas/ms-chatbot` YA implementa y tiene probado
# (`ChatController`, `ChatService`, `CalificacionService`), historia por
# historia:
#
#   HU-CHA-001  chat 24/7 para visitantes y usuarios autenticados
#   HU-CHA-004  motor de respuestas basado en reglas con escalamiento
#   HU-CHA-008  consultas y acciones asistidas para usuarios autenticados
#   HU-CHA-011  calificacion de respuestas y brechas de conocimiento
#   HU-CHA-012  panel de administracion: analiticas, base de conocimiento y
#               "reentrenamiento" (versiones evaluadas antes de desplegarse)
#   7.4.8 (1.4.0) revision final: nada sensible se guarda, la inyeccion de
#               codigo se detecta y bloquea, el uid sale solo del claim
#               `uid`, y limite tambien por direccion de origen
#   7.4 (1.5.0) revision final: la base de conocimiento dice lo que el juego
#               hace (V11), las respuestas en vivo y los escalamientos en
#               ingles, busqueda en el inventario, seguimiento de la
#               respuesta anterior e informe de actividad en paralelo
#   7.4.10 (1.6.0) gestion de la base de conocimiento: intenciones
#               adicionales por tema (V12), titulo duplicado 409
#               TEMA_DUPLICADO, importacion acotada (413) y transiciones de
#               version en fila (409 CAMBIO_CONCURRENTE en vez de un 500)
#   7.4.5 y 7.4.7 (1.7.0) aprendizaje continuo y analiticas: las preguntas
#               sin respuesta (brechas) llegan al panel con su estado (V13),
#               el resultado de cada respuesta del bot se guarda (V13) y las
#               formulas del tablero quedan corregidas y documentadas; el CSV
#               ya no puede llevar formulas
#   7.4.3 (1.8.0) soporte desde la conversacion y centro de ayuda: la
#               solicitud se arma con la pregunta que el asistente no
#               resolvio (`POST /chat/tickets/desde-conversacion`) y lo que
#               sabe responder se lee sin chatear (`GET /chat/ayuda`)
#   7.4.9 (1.9.0) requisitos tecnicos: canal en tiempo real (STOMP sobre
#               WebSocket, contracts/websocket/chatbot.yaml 1.0.0) y cache de
#               las respuestas frecuentes de la base de conocimiento
#   7.4.1, 7.4.2 y 7.4.5 (1.10.0) catalogo en vivo: los productos que se
#               venden hoy, sus precios y su ficha salen del catalogo publico
#               (productos.yaml), no de un texto copiado en la base
#   7.4.4 y 7.4.8 (1.11.0) lo que se vio en DEV: la redaccion tapa tambien
#               la puntuacion en que termina un secreto (V14), un visitante
#               que pide datos de su cuenta recibe que hace falta una sesion,
#               las consultas en vivo se reconocen con mas formas de
#               preguntar y la navegacion a secciones publicas es para todos
#   7.4 (1.3.0) lo que faltaba del modulo 7.4: tickets y soporte humano
#               (RF-CHA-007, RF-ADM-004), sugerencias y autocompletado,
#               respuestas enriquecidas sin imagenes, vista del jugador y
#               "mis misiones"
#
# Dueno del contrato: Grupo 4 (ms-chatbot).
#
# ---------------------------------------------------------------------------
# QUIEN LO LLAMA
#
# Solo el frontend (`frontend/app-web`): la ventana de chat (`/chat/**`) y el
# panel administrativo (`/chatbot/admin/**`). Ningun otro servicio llama a
# ms-chatbot.
#
# ---------------------------------------------------------------------------
# PANEL ADMINISTRATIVO (`/chatbot/admin/**`, HU-CHA-012)
#
# Exige token valido con claim `rol` ADMINISTRADOR o SUPER_ADMINISTRADOR:
# sin token, 401; con otro rol, 403. A diferencia del chat, aqui un token
# invalido NO degrada a visitante.
#
# El prefijo es `/chatbot/admin` y no `/admin/chatbot` porque el borde
# (`infrastructure/red-balanceo`) envia todo `/api/v1/admin...` a
# ms-identidad.
#
# Sobre el "reentrenamiento" (RF-CHA-014): el chatbot es un motor de reglas,
# no un modelo entrenable. El "modelo" es una VERSION de la base de
# conocimiento: se edita una candidata (`borrador`), se evalua contra la de
# produccion con los casos de evaluacion, y solo se despliega si no acierta
# menos. Interpretacion pendiente de confirmar con el cliente.
#
# ---------------------------------------------------------------------------
# IDENTIDAD EN EL CHAT: VISITANTE O USUARIO AUTENTICADO (1.2.0, B11)
#
# Todas las rutas de `/chat/**` aceptan las dos formas, porque el chat debe
# funcionar para visitantes sin cuenta (criterio de HU-CHA-001):
#
#   * Usuario autenticado: `Authorization: Bearer <JWT de ms-identidad>`. La
#     conversacion se identifica SOLO por el claim `uid` del token (ADR-002).
#     Con token valido, `X-Id-Sesion-Anonima` se ignora. Desde 1.4.0 un token
#     sin `uid` (o con un `uid` que no es UUID) es un visitante: el `sub` es
#     el apodo y NUNCA se interpreta como uid, aunque tenga forma de UUID.
#   * Visitante: sin token, con la cabecera `X-Id-Sesion-Anonima` en una de
#     dos formas:
#       - EMITIDA POR EL SERVIDOR (`POST /chat/sesiones`, o la cabecera de
#         respuesta del primer `POST /chat/mensajes`): `anon_` + 43 caracteres
#         base64url de 256 bits aleatorios. La recomendada.
#       - DECLARADA POR EL NAVEGADOR: `visitante-` + 10 a 64 caracteres
#         `[A-Za-z0-9-]`. Es la que ya manda el asistente de la interfaz
#         (`comun/cliente-chatbot.js`, `visitante-` + crypto.randomUUID()); se
#         registra la primera vez que escribe.
#     En los dos casos el servidor solo guarda su huella SHA-256, y la
#     conversacion del visitante vive en un espacio de claves distinto del de
#     los `uid` (`anonimo:<sesion>`), asi que un identificador de visitante
#     NUNCA puede abrir la conversacion de un usuario registrado.
#
# El fallo que cierra la 1.2.0: hasta la 1.1.0 el servidor usaba la cabecera
# como la misma clave que el `uid`. Un visitante que mandara
# `X-Id-Sesion-Anonima: <uid de un jugador>` (los `uid` son publicos, p. ej. en
# `GET /torneos`) leia, calificaba o BORRABA el historial de ese jugador.
# Ahora un `uid` a secas, un valor sin ninguna de las dos formas o una sesion
# vencida no dan acceso a nada: `GET /historial` responde vacio, `DELETE` no
# borra nada y calificar responde 404.
#
# Un JWT invalido o vencido NO produce 401 en estas rutas: la peticion se
# atiende como la de un visitante (HU-CHA-008). Asi, a un jugador cuya sesion
# vence a mitad de conversacion no se le corta el chat; solo pierde las
# consultas asistidas, que exigen token valido.
#
# ---------------------------------------------------------------------------
# DEPENDENCIAS SALIENTES (HU-CHA-008, B11)
#
# Con un usuario autenticado, `POST /chat/mensajes` puede consultar
# inventario (`inventario.yaml`), subastas (`ms-subastas-pujas.yaml`),
# notificaciones (`notificaciones.yaml`) y sus movimientos de creditos
# (`creditos.yaml`, `GET /creditos/{uid}/movimientos`) y sus misiones en curso
# (`misiones.yaml` 1.0.0, `GET /api/v1/misiones/en-curso`, desde 1.3.0),
# y buscar en su inventario (`inventario.yaml`,
# `GET /api/v1/inventario/elementos/busqueda`, desde 1.5.0),
# reenviando el MISMO token del jugador: esos servicios derivan el dueno del
# claim `uid`. El
# chatbot NUNCA usa una credencial de servicio para leer datos de un jugador.
# Los torneos se consultan como dato publico (`torneos.yaml`, `GET /torneos`),
# y desde 1.10.0, para visitantes y jugadores, el catalogo de productos
# (`productos.yaml`, `GET /api/v1/productos`, sin credencial).
# Todo el texto del usuario pasa antes por la lista negra
# (`moderacion-lista-negra.yaml` 2.0.0, contexto CHAT_GENERAL). Todas las
# llamadas tienen tiempo de espera y ninguna ocurre dentro de una transaccion.
# Si una consulta no responde, el chatbot contesta igual, con un aviso de
# "servicio no disponible" solo para esa parte.
# =============================================================================

info:
  title: Nexus Battles VI — Chatbot de soporte
  version: 1.11.0
  description: |
    Chat de soporte 24/7 para visitantes y jugadores: respuestas desde una
    base de conocimiento, consultas en vivo sobre la propia cuenta,
    historial de conversacion y calificacion de respuestas. Incluye el panel
    administrativo del chatbot: analiticas, gestion de la base de
    conocimiento y despliegue evaluado de sus versiones.

    Errores en formato problem details (regla 4), con el `ProblemDetail`
    estandar de Spring; los de 1.2.0 traen ademas `motivo`.

    ### 1.11.0 — 7.4.4 y 7.4.8: lo que se vio en DEV

    Todo compatible: ninguna operacion ni forma cambia; cambia lo que se
    guarda y lo que se responde.

    * **Redaccion (7.4.8).** El valor anunciado de un secreto se tapa
      entero, tambien la puntuacion en que termina: «mi contrasena es
      Hunter2024!» se guarda «mi contrasena es ***», no «***!» (ese simbolo
      es parte de la contrasena; la politica de claves exige uno). La
      migracion V14 vuelve a redactar lo guardado con la regla nueva.
    * **Un visitante que pide datos de su cuenta** («¿que tengo en mi
      inventario?», «mis ultimas transacciones», «llevame a mi inventario»)
      recibe que hace falta una sesion, con enlaces a `login` y `registro`
      (`resultado` TEMA). No se consulta nada, no se busca un tema y no se
      registra como pregunta sin respuesta. Antes acababa en «no te
      entendi» y en las brechas.
    * **Consultas en vivo con mas formas de preguntar (7.4.3, 7.4.4).**
      Subastas, notificaciones, transacciones y misiones se reconocen como
      el inventario: tema + «mi/mis/tengo/my» y no una pregunta de reglas
      («¿tengo alguna mision activa?», «¿cuales son mis ultimas
      transacciones?», «¿que subastas tengo?»). Y una pregunta de reglas
      sobre lo propio («¿puedo cancelar mi puja?», «¿que pasa si abandono mi
      mision?», «¿tengo que pagar para subastar?») ya no se toma por una
      consulta: la responde la base.
    * **Navegacion a secciones publicas, para todos (7.4.4).** «Llevame a la
      subasta», «ir al centro de ayuda», «take me to the store»: enlace a la
      vista (`resultado` NAVEGACION). La tienda, el chat general y «Jugar
      online» piden sesion: a un visitante se le dice que entre, con enlaces
      a `login` y `registro`. «Ir al inicio» lleva a `portada` o a `home`.

    ### 1.10.0 — 7.4.1, 7.4.2 y 7.4.5: el catalogo de hoy

    Todo compatible: ninguna forma cambia; cambia lo que se responde.

    * **Productos, precios y fichas en vivo**, para visitantes y jugadores:
      «¿que productos hay en la tienda?», «¿que armas venden?», «¿cuanto
      cuesta la espada de una mano?», «¿que hace el Orbe de manos
      ardientes?» se responden con el catalogo publico de `productos.yaml`
      (`GET /api/v1/productos`, sin credencial: la proyeccion que ve
      cualquier visitante). Un producto nuevo, un precio cambiado o uno
      retirado se ven en el chat sin editar la base de conocimiento: es la
      «actualizacion automatica con nueva informacion del sistema» de 7.4.5.
    * Se guarda una sola copia del catalogo para todo el servicio (es dato
      publico, igual para todos) durante 5 minutos; si el catalogo no
      responde, se sigue usando la ultima copia hasta 30 minutos (D-CHA-10).
    * Una pregunta de precio o de ficha que no nombra ningun producto
      («¿cuanto cuesta publicar una subasta?») y las de como hacer algo
      («¿como compro en la tienda?») siguen respondiendolas los temas de la
      base. Sin catalogo, el listado dice que no esta disponible
      (`resultado` NO_DISPONIBLE) y el precio lo intenta la base.
    * Las respuestas del catalogo guardan `resultado` CONSULTA_EN_VIVO y
      enlazan a la «Tienda».

    ### 1.9.0 — 7.4.9: tiempo real y respuestas frecuentes en cache

    Todo compatible: ninguna operacion ni forma cambia. 7.4.9 («Requisitos
    tecnicos») pide «WebSocket para comunicacion en tiempo real» y «sistema
    de cache para respuestas frecuentes»; hasta aqui el chat era solo esta
    API y no habia cache.

    * **Canal en tiempo real** (`contracts/websocket/chatbot.yaml` 1.0.0):
      STOMP sobre WebSocket en `/api/v1/ws-chatbot`, con la identidad de
      siempre en el CONNECT (`Authorization` o `X-Id-Sesion-Anonima`, las
      reglas de «IDENTIDAD EN EL CHAT»). Una pregunta enviada por el canal
      recorre el mismo camino que `POST /chat/mensajes` (limites, revision de
      la entrada, lista negra, motores, guardado) y su respuesta es el mismo
      `Mensaje`: el historial es uno solo. El canal ademas avisa
      «escribiendo» y le lleva al dueno de una solicitud de soporte cada
      cambio que hace un administrador
      (`PATCH /chatbot/admin/tickets/{ticketId}`), con la forma de
      `GET /chat/tickets`. Esta API no cambia: es el camino cuando el canal
      no abre o se cae. El handshake no exige token (la identidad va en el
      CONNECT) y solo admite los origenes de `CORS_ORIGENES`. El broker es
      en memoria de la instancia; en DEV hay una sola.
    * **Respuestas frecuentes en cache.** La respuesta de la base de
      conocimiento se guarda en memoria por version en produccion, pregunta
      normalizada (sin tildes, mayusculas ni signos), idioma pedido, nivel de
      detalle y `vista`: la misma pregunta se responde sin volver a puntuar
      los temas. Como mucho 500 respuestas y 30 minutos cada una (D-CHA-08,
      provisional). Nunca se guardan las consultas en vivo (inventario,
      subastas, notificaciones, creditos, misiones, torneos), los
      seguimientos («mas detalle», «no me sirvio») ni nada que dependa de
      quien pregunta; tampoco el aviso de un dato tapado, que se anade
      despues. Desplegar o revertir la base cambia la version en produccion:
      lo guardado de la anterior deja de valer y se descarta. Los temas de
      produccion tambien se leen de la base una vez por version, no en cada
      mensaje. Una pregunta escalada que sale de la cache se sigue
      registrando como brecha, y cuenta en las analiticas como cualquier
      otra (con su tiempo de respuesta, menor). Cache por instancia; sus
      metricas, en Actuator (`chatbot_cache_*`).

    ### 1.8.0 — 7.4.3: solicitud desde la conversacion y centro de ayuda

    Todo compatible: dos operaciones nuevas, un campo opcional nuevo en
    `EnlaceInterno` y un valor nuevo de `motivo`. Ninguna operacion ni campo
    existente cambia de forma. Sin migracion: no hace falta nada nuevo en la
    base.

    * **`POST /chat/tickets/desde-conversacion`** («escalamiento a agente
      humano con contexto de la conversacion»). Despues de que el asistente
      no entendio o de un «no me sirvio», el jugador abre la solicitud con
      un clic: el servidor toma de SU conversacion (la del `uid` del token,
      nunca un id que mande el cliente) la ultima pregunta sin resolver, y
      si no hay ninguna, la ultima pregunta. El tema sale de la respuesta
      que no sirvio, o de `vista`, o es FAQ_GENERAL. Mismas reglas que
      `POST /chat/tickets`: solo jugadores (401 SESION_REQUERIDA), limite
      (429), revision y lista negra (422 y 503), una abierta a la vez (409
      TICKET_ABIERTO). Sin ninguna pregunta en la conversacion: 409
      SIN_CONVERSACION. El borde la cuenta en su zona de escritura, como
      `POST /chat/tickets`.
    * **`GET /chat/ayuda`** (centro de ayuda, 7.4.3 «enlaces a documentacion
      relevante»): los temas activos de la version EN PRODUCCION agrupados
      por categoria, con su respuesta en espanol e ingles y sus pasos.
      Publica y sin identidad; nada de lo interno de un tema (clave,
      variantes, prioridad, version). `Cache-Control: public, max-age=300`.
    * **`EnlaceInterno.ancla`** (opcional): el fragmento dentro de la vista,
      p. ej. `categoria-cuenta-y-registro` en el centro de ayuda. Al no
      entender una pregunta o tras un «no me sirvio», la respuesta trae
      ademas el enlace «Ver el centro de ayuda» (`destino` `ayuda`), con el
      ancla de la categoria cuando se sabe.

    ### 1.7.0 — 7.4.5 y 7.4.7: preguntas sin respuesta y analiticas

    Todo compatible: operaciones nuevas, campos nuevos en las respuestas y
    definiciones corregidas. Ningun campo existente cambia de forma.

    * **Preguntas sin respuesta** (7.4.5 «registro de preguntas frecuentes
      no cubiertas», «analisis de patrones de consulta»). Las brechas de
      conocimiento (HU-CHA-011) se guardaban y nadie las veia.
      `GET /chatbot/admin/brechas` las lista, las mas repetidas primero
      (escalamientos + «no util»), por periodo y estado, por paginas;
      `PATCH /chatbot/admin/brechas/{brechaId}` las marca ATENDIDA (un tema
      ya la cubre) o DESCARTADA (ruido), o las devuelve a PENDIENTE, y
      guarda quien y cuando (migracion V13). Una brecha ATENDIDA que se
      vuelve a preguntar vuelve sola a PENDIENTE y suma una `reaperturas`:
      el tema que la cubria no basta. La pregunta de ejemplo sale ya
      redactada (1.4.0).
    * **Resultado de cada respuesta del bot** (V13, columna
      `mensajes.resultado`): TEMA, CONSULTA_EN_VIVO, NAVEGACION,
      NO_DISPONIBLE, ESCALADO, NO_SIRVIO o PIDE_REFORMULAR, decidido por el
      motor que respondio, no adivinado despues. Las respuestas anteriores a
      V13 no lo tienen y no cuentan en la tasa de resolucion.
    * **Formulas del tablero corregidas** (`GET /chatbot/admin/analiticas`;
      cada una explicada en su campo de `AnaliticaChatbot`):
      - `conversaciones` son las conversaciones INICIADAS en el periodo
        (`fecha_inicio`), no las que tuvieron una pregunta: borrar un
        historial ya no cambia el pasado. Lo que contaba antes sigue, con su
        nombre, en `conversacionesConActividad`; tambien la tendencia diaria
        cuenta las iniciadas ese dia.
      - `tasaResolucion` es resueltas / clasificadas: solo un tema de la
        base, una consulta en vivo que trajo datos o una navegacion asistida
        resuelven (D-CHA-07). Antes una consulta en vivo que decia «no
        disponible» contaba como resuelta.
      - `escalamientos` son las veces que el ASISTENTE ofrecio soporte
        humano; las solicitudes que de verdad se abrieron son
        `tickets.total`. Son dos cifras distintas.
      - Nuevo `preguntasFrecuentes`: las preguntas mas repetidas del
        periodo, normalizadas y ya redactadas, solo las que hicieron al
        menos 3 conversaciones distintas (D-CHA-06).
      - `palabrasClave` agrega la tendencia de cada palabra contra el
        periodo anterior de la misma duracion.
      - `tiempoRespuestaPromedioMs` dice por fin que mide.
    * **CSV sin formulas**: en la exportacion, una celda que empieza por
      `=`, `+`, `-`, `@`, tabulador o retorno de carro lleva delante una
      comilla simple, para que Excel no la ejecute. Bloques nuevos:
      resultado de las respuestas y preguntas frecuentes.

    ### 1.6.0 — 7.4.10: gestion de la base de conocimiento

    Todo compatible: un campo opcional nuevo en los temas, respuestas de
    error nuevas y valores nuevos de `motivo`. Ninguna operacion ni campo
    existente cambia de forma.

    * **Intenciones adicionales** («asociar respuestas con multiples
      intenciones»). `DatosDeTema` (y con el `Tema` y `TemaIntercambio`)
      agrega `intencionesAdicionales`: otras categorias que atiende la
      misma respuesta, ademas de `categoria`. Hasta 5, sin repetir y nunca
      la propia `categoria` (400 con el motivo en `detail`). Sin valor es
      ninguna; en las respuestas siempre viene, vacia si no hay. Viajan con
      el tema (migracion V12): crear la candidata las copia, desplegar o
      revertir no las toca, exportar las incluye e importar las respeta; un
      archivo anterior a 1.6.0, sin el campo, se importa igual. El chatbot
      las usa al desempatar por la seccion del jugador (`vista`), al proponer
      preguntas relacionadas (un tema sale entre las de cada una de sus
      intenciones) y en `GET /chat/sugerencias` con `categoria`. Las
      analiticas siguen contando la categoria principal.
    * **Titulo duplicado** (RF-CHA-013 «entrada duplicada»): agregar o
      editar un tema de la candidata con el mismo titulo que otro (sin
      contar tildes, mayusculas ni signos) responde 409 con `motivo`
      TEMA_DUPLICADO. La importacion reemplaza la candidata entera, asi que
      ahi el duplicado solo puede estar dentro del archivo: tambien 409
      TEMA_DUPLICADO, y no se escribe nada. Las variantes de pregunta
      repetidas de un tema (con la misma regla) se guardan una sola vez, sin
      error.
    * **Importacion acotada**: como mucho 500 temas y 8 MB. Mas responde 413
      con `motivo` IMPORTACION_DEMASIADO_GRANDE y no se escribe nada.
    * **Transiciones en fila**: desplegar (el boton y la publicacion
      programada), revertir, crear o descartar la candidata, editarla,
      importarla, evaluarla y programarla ya no se cruzan. Nunca quedan dos
      versiones en produccion ni ninguna; la operacion que llega con un
      estado que otra acaba de cambiar responde 409 con `motivo`
      CAMBIO_CONCURRENTE (antes, un 500 o una version publicada dos veces).
      No se cambia nada: el panel muestra el estado nuevo y el administrador
      decide otra vez. La publicacion programada que pierde la carrera no
      hace nada y vuelve a mirar al minuto siguiente.

    ### 1.5.0 — 7.4.1 a 7.4.5: lo que dice el chatbot (revision final)

    Todo compatible: ninguna forma cambia; cambia lo que se responde.

    * **La base de conocimiento dice lo que el juego hace hoy** (#948). La
      migracion V11 retira la version en produccion y publica una nueva,
      copia suya, con los temas corregidos contra el juego real (sin logros,
      mazos ni perdida de objetos que el juego no tiene; el torneo, la
      verificacion del correo, las subastas y las misiones como son) y con
      los temas que faltaban del 7.4.1: 59 temas, cada uno con sus variantes
      en espanol e ingles, y 118 casos de evaluacion nuevos. La version
      anterior queda RETIRADA y se puede revertir desde el panel. La
      candidata en edicion, si la hay, recibe las mismas correcciones. Los
      temas sembrados en V2 cambian su clave (antes su UUID) por una
      legible (`crear-cuenta`, `publicar-subasta`); los casos de evaluacion
      y las respuestas ya guardadas pasan a la clave nueva, asi que las
      analiticas siguen contando cada tema junto.
    * **Ingles en todo** (7.4.2): las consultas en vivo, la navegacion, los
      avisos de servicio no disponible, el escalamiento y lo que se anade a
      una respuesta (preguntas relacionadas, aviso de dato tapado) salen en
      el idioma de la pregunta, o en el de `PreferenciasDelChat.idioma`.
      Las secciones se nombran como en la barra («Mi inventario»,
      «Subasta», «Torneo», «Mi Cuenta»); en ingles, la etiqueta espanola
      con su traduccion al lado, porque la interfaz solo esta en espanol.
    * **Errores de tecleo** (7.4.2): dos letras vecinas cambiadas cuentan
      como un solo error («subatsa» es «subasta»), en la base y en las
      frases de las consultas en vivo.
    * **Busqueda en el inventario** (7.4.4): «busca espada en mi
      inventario», «¿tengo alguna pocion en mi inventario?» o «search my
      inventory for a sword» usan la busqueda real del inventario
      (`GET /api/v1/inventario/elementos/busqueda`, con el token del
      jugador). Un criterio de menos de 4 letras no consulta nada.
    * **Seguimiento de la respuesta anterior** (7.4.2 contexto, 7.4.5): «mas
      detalle», «en ingles», «en espanol», «repitelo» o «no me sirvio»
      (solos o con «por favor» y similares) se refieren a la ultima
      respuesta del bot en esa conversacion: se responde ese tema otra vez
      con lo pedido. «No me sirvio» ofrece soporte humano y otras preguntas
      del tema, cuenta como escalamiento en las analiticas y no se registra
      como brecha. Si la respuesta anterior no salio de la base (una
      consulta en vivo), se pide la pregunta completa. Sin respuesta
      anterior, la frase es una pregunta mas.
    * **Enlaces** (7.4.3): cada tema enlaza a la vista de su seccion por su
      clave (recuperar la contrasena lleva a «Recuperar contraseña», los
      creditos al historial de transacciones, los cofres a «Mis cofres»). Al
      escalar, hasta dos enlaces a las secciones de las preguntas
      relacionadas. Nunca a una vista de administracion.
    * **Informe de actividad en paralelo** (7.4.11): sus cinco partes se
      piden a la vez y se espera como mucho 1,7 s en total; la que no llega
      se dice no disponible y el resto se entrega.
    * **`ProblemDetail.motivo`** nombra por fin OTRO_TICKET_ABIERTO (1.3.9) e
      INYECCION_DETECTADA (1.4.0), que las respuestas ya traian.

    ### 1.4.0 — 7.4.8: privacidad, inyeccion e identidad (revision final)

    Todo compatible: respuestas de error nuevas y comportamiento mas
    estricto sobre lo que se guarda. Ninguna forma cambia.

    * **Ningun dato sensible se guarda.** Todo texto del usuario (la
      pregunta de `POST /chat/mensajes`, el comentario de una calificacion,
      el asunto y el mensaje de un ticket) se revisa ANTES de moderarlo,
      procesarlo o guardarlo: se quitan los caracteres de control y los
      invisibles, y se tapan contrasenas, tarjetas, tokens y claves. De ahi
      en adelante solo circula el texto redactado: la lista negra, los
      motores, las brechas de conocimiento, las analiticas y la base nunca
      ven el original. Si se tapo algo, la respuesta del bot empieza
      diciendolo. La migracion V10 redacto lo que ya estaba guardado.
    * **Inyeccion de codigo detectada y bloqueada** (422, `motivo`
      INYECCION_DETECTADA): etiquetas y manejadores de HTML, SQL
      encadenado, expresiones de plantilla (p. ej. `${jndi:...}`), comandos
      del sistema, operadores de NoSQL y rutas del sistema. No se guarda ni
      se reenvia nada; se cuenta en la metrica
      `chatbot_inyecciones_bloqueadas_total` por tipo, sin el texto.
    * **El comentario de una calificacion pasa por la lista negra** como
      cualquier texto del usuario: 422 CONTENIDO_BLOQUEADO o 503
      MODERACION_NO_DISPONIBLE, y no se guarda.
    * **Limite tambien por direccion de origen** en `POST /chat/mensajes`
      (`CHATBOT_LIMITE_MENSAJES_POR_ORIGEN`, 120/min por omision), sumando
      todas las sesiones de esa direccion: 429 con `Retry-After`.
    * **El uid sale solo del claim `uid`** (ver IDENTIDAD arriba).
    * **Borrar el historial** dice ahora que se borra y que queda.

    ### 1.3.9 — tickets: reabrir con otro abierto y redaccion primero

    * `PATCH /chatbot/admin/tickets/{ticketId}`: reabrir un ticket cuando
      el jugador ya tiene otro abierto responde 409 con `motivo`
      OTRO_TICKET_ABIERTO (antes, el indice unico daba un 500).
    * `POST /chat/tickets`: el asunto y el mensaje se redactan ANTES de
      pasar por la lista negra; ningun otro servicio los ve sin redactar.
      Sin cambios de forma: compatible.

    ### 1.3.8 — publicacion programada de la candidata (7.4.10)

    `PUT` y `DELETE /chatbot/admin/base-conocimiento/borrador/programacion`
    programan o cancelan la publicacion automatica de la candidata. Al
    llegar la hora se evalua como un despliegue manual y solo se publica si
    no rinde peor. `VersionBaseConocimiento` agrega `despliegueProgramadoEn`
    y `programacionRechazadaEn`. Operaciones y campos nuevos: compatible.

    ### 1.3.7 — analiticas de soporte y palabras clave (7.4.7)

    `GET /chatbot/admin/analiticas` agrega `tickets` (solicitudes de soporte
    del periodo por estado y categoria, y horas promedio de atencion) y
    `palabrasClave` (las palabras mas usadas en las preguntas). La
    exportacion CSV agrega los mismos dos bloques. Campos nuevos en la
    respuesta: compatible.

    ### 1.3.6 — preferencias y nivel de detalle (7.4.5)

    `GET` y `PUT /chat/preferencias`: el idioma de las respuestas
    (`AUTOMATICO`, `ES`, `EN`) y el nivel de detalle (`BREVE`, `NORMAL`,
    `DETALLADO`), guardados por conversacion (V8): los de un jugador lo
    siguen entre dispositivos. Con las de por defecto el chatbot responde
    exactamente como en 1.3.5. Operaciones nuevas: compatible.

    ### 1.3.5 — historial por paginas (7.4.6, scroll infinito)

    `GET /chat/historial` acepta `limite` (1 a 100) y `antesDe` (el `id` de
    un mensaje de la conversacion) para traer el historial por partes, del
    mas reciente hacia atras. La respuesta sigue siendo la misma lista en
    orden cronologico. Sin ninguno de los dos parametros responde todo el
    historial, igual que antes: compatible con 1.3.4.

    ### 1.3.4 — `vista` y `enriquecido` implementados

    * `vista` llega al motor: a igual puntaje gana el tema de la categoria de
      esa seccion, y si la consulta se escala las respuestas rapidas se
      completan con temas de esa seccion.
    * `enriquecido` sale en las respuestas del bot y se guarda con el mensaje
      (el historial lo devuelve igual): pasos de los temas paso a paso,
      enlace a la seccion del tema o de la consulta asistida, tarjetas de las
      misiones en curso, otras preguntas de la misma categoria y, al escalar,
      `ofrecerSoporteHumano: true`. Sin cambios de forma.

    ### 1.3.3 — sugerencias implementadas

    `GET /chat/sugerencias` ya tiene codigo (fuera
    `x-implementacion: pendiente`). `pregunta` es el titulo del tema, y el
    chat reconoce el titulo tal cual como pregunta de ese tema: pulsar una
    sugerencia siempre obtiene su respuesta. Los temas de cortesia (saludo,
    despedida) no se sugieren. Sin cambios de forma.

    ### 1.3.2 — bandeja de tickets del administrador implementada

    `GET /chatbot/admin/tickets`, `GET` y `PATCH
    /chatbot/admin/tickets/{ticketId}` ya tienen codigo (fuera
    `x-implementacion: pendiente`). Sin cambios de forma.

    ### 1.3.1 — tickets del jugador implementados

    `POST /chat/tickets` y `GET /chat/tickets` ya tienen codigo (fuera
    `x-implementacion: pendiente`). Sin cambios de forma.

    ### 1.3.0 (7.4) — compatible con 1.2.0

    Todo lo nuevo es adicional: campos opcionales y operaciones nuevas.
    Las operaciones que aun no tienen codigo llevan
    `x-implementacion: pendiente` y se les quita la marca en el PR que las
    implementa (guardian `rutas-contrato-codigo.py`).

    * **Mis misiones en vivo:** "mis misiones" deja de responder "en
      construccion" y consulta `misiones.yaml` con el token del jugador.
    * **Sin imagenes** (decision del cliente): `adjuntoUrl` queda obsoleto.
      El servidor lo acepta para no romper a nadie, pero lo ignora y ya no
      lo guarda; los mensajes viejos lo siguen devolviendo.
    * **`vista` opcional en `EnviarMensaje`:** la seccion donde esta el
      jugador, para respuestas contextuales (7.4.3).
    * **`enriquecido` opcional en `Mensaje`:** pasos, enlaces a secciones
      internas, tarjetas de texto, botones de respuesta rapida y la oferta de
      soporte humano (7.4.3 y 7.4.6), sin imagenes.
    * **`GET /chat/sugerencias`:** preguntas rapidas, temas frecuentes y
      autocompletado, tomados de la version EN PRODUCCION de la base.
    * **Tickets de soporte** (7.4.3, RF-CHA-007, RF-ADM-004): el jugador con
      sesion abre uno (`POST /chat/tickets`) y ve los suyos; el
      administrador los lista, los lee con el contexto de la conversacion ya
      redactado y los atiende (`/chatbot/admin/tickets`). Sin email, nombre
      ni telefono.

    ### 1.2.0 (B11) — compatible con 1.1.0

    * **Sesion de visitante en su propio espacio de claves.** Un valor de
      `X-Id-Sesion-Anonima` ya nunca es la clave de la conversacion de un
      usuario: cierra el acceso de un visitante al historial de un jugador
      cuyo `uid` conociera (auditoria de B11). El identificador que ya
      declara el asistente de la interfaz (`visitante-...`) sigue valiendo
      tal cual; `POST /chat/sesiones` emite ademas uno de 256 bits para el
      cliente que lo prefiera. Un valor sin ninguna de las dos formas se
      trata como si no viniera.
    * **Limite de frecuencia** por usuario o sesion en `POST /chat/mensajes`
      y por direccion en `POST /chat/sesiones`: 429 con `Retry-After`
      (7.4.8 del documento).
    * **Filtrado del texto del usuario** con la lista negra (contexto
      CHAT_GENERAL): un mensaje bloqueado responde 422 y no se guarda; si la
      lista negra no responde, 503 (fail-closed, igual que el resto de la
      plataforma, D-14).
    * **Consultas en vivo nuevas:** torneos (dato publico) y movimientos de
      creditos del propio jugador (con su token). Las secciones de torneos y
      misiones ya existen en el menu: la navegacion asistida lleva a ellas.
    * **Sin cambios de forma** en los cuerpos de peticion y respuesta que ya
      existian; lo nuevo (`POST /chat/sesiones`, las respuestas 422, 429 y
      503, el campo `motivo`) es adicional.
  license:
    name: Uso academico — Proyecto Integrador II, UPB Bucaramanga

servers:
  - url: http://localhost:8094/api/v1
    description: Desarrollo local (context-path /api/v1 del propio servicio)

tags:
  - name: chat
    description: Conversacion con el chatbot e historial (HU-CHA-001, HU-CHA-004, HU-CHA-008)
  - name: calificaciones
    description: Calificacion de respuestas del chatbot (HU-CHA-011)
  - name: admin-analiticas
    description: Tablero de analiticas del chatbot (HU-CHA-012, RF-CHA-012)
  - name: admin-aprendizaje
    description: Preguntas sin respuesta (brechas de conocimiento) y su atencion (1.7.0, 7.4.5, RF-CHA-011)
  - name: admin-base-conocimiento
    description: Versiones y temas de la base de conocimiento (HU-CHA-012, RF-CHA-013)
  - name: admin-reentrenamiento
    description: Casos de evaluacion, despliegue evaluado y reversion (HU-CHA-012, RF-CHA-014)
  - name: soporte
    description: Tickets de soporte humano del jugador (1.3.0, 7.4.3, RF-CHA-007)
  - name: ayuda
    description: Centro de ayuda publico con lo que el chatbot sabe responder (1.8.0, 7.4.3)
  - name: admin-soporte
    description: Atencion de los tickets de soporte (1.3.0, RF-ADM-004)

paths:
  /chat/sesiones:
    post:
      tags: [chat]
      operationId: crearSesionAnonimaDelChatbot
      summary: Emite la sesion de un visitante (1.2.0)
      description: |
        Devuelve un identificador aleatorio de 256 bits (`anon_` + 43
        caracteres base64url) que el visitante manda despues en
        `X-Id-Sesion-Anonima`. El servidor guarda solo su huella SHA-256 y lo
        da por vencido tras `expiraEn` sin actividad (se renueva con cada
        mensaje). No hace falta token; con token no hace falta sesion.
        Opcional: el identificador que declara el navegador (`visitante-...`)
        tambien vale. Limitado por direccion de origen para que nadie fabrique
        sesiones en masa (429).
      security:
        - {}
      responses:
        '201':
          description: Sesion emitida. La misma va en la cabecera `X-Id-Sesion-Anonima`.
          headers:
            X-Id-Sesion-Anonima:
              $ref: '#/components/headers/SesionAnonimaEmitida'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesionAnonima'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'

  /chat/mensajes:
    post:
      tags: [chat]
      operationId: enviarMensajeAlChatbot
      summary: Envia un mensaje al chatbot y devuelve su respuesta
      description: |
        Guarda el mensaje del usuario en su conversacion (la crea si es el
        primero de esa sesion) y devuelve la respuesta del bot, que tambien
        queda guardada.

        Antes de responder (1.2.0): limite de frecuencia por usuario o sesion
        (429), y el texto pasa por la lista negra en el contexto CHAT_GENERAL:
        si coincide con un termino prohibido, 422 y no se guarda nada; si la
        lista negra no responde, 503 y tampoco.

        Desde 1.4.0, antes que todo eso: limite tambien por direccion de
        origen (429); se quitan los caracteres de control y los invisibles
        (si no queda texto, 400); un intento de inyeccion de codigo responde
        422 INYECCION_DETECTADA sin guardar nada; y se tapan las
        contrasenas, tarjetas, tokens y claves. Solo el texto redactado se
        modera, se procesa y se guarda, y si se tapo algo la respuesta del
        bot empieza avisandolo.

        Un visitante con un identificador declarado (`visitante-...`) lo
        conserva: la primera vez queda registrado y no se emite otro (si
        habia vencido, su mensaje abre una conversacion nueva). Un visitante
        sin sesion valida (sin `X-Id-Sesion-Anonima`, con un valor sin
        ninguna de las dos formas o con una sesion emitida que vencio) recibe
        una sesion NUEVA en la cabecera de respuesta `X-Id-Sesion-Anonima` y
        su mensaje abre una conversacion nueva: el cliente debe guardarla y
        mandarla en las siguientes peticiones para conservar su historial.

        Como se genera la respuesta:

        0. Desde 1.5.0, si el mensaje es un seguimiento de la respuesta
           anterior del bot en esta conversacion («mas detalle», «en
           ingles», «repitelo», «no me sirvio»), se responde ese tema otra
           vez con lo pedido.
        1. Solo con usuario autenticado: si el mensaje pide datos de la
           propia cuenta (inventario, subastas, notificaciones, movimientos
           de creditos), el estado de sus torneos, ir a una seccion del sitio
           o un informe de actividad, se responde con datos en vivo
           (HU-CHA-008). Desde 1.3.0 tambien sus misiones en curso
           (`misiones.yaml`); desde 1.5.0, buscar en su inventario.
           Desde 1.11.0, un visitante que pide algo de eso recibe que hace
           falta una sesion (enlaces a `login` y `registro`), sin consultar
           nada.
        1b. Desde 1.11.0, para todos: ir a una seccion publica («llevame a
           la subasta», «ir al centro de ayuda»); las que piden sesion, a un
           visitante se le dice que entre.
        2. Desde 1.10.0, para todos: si pregunta por los productos que se
           venden, por el precio o por la ficha de un producto del catalogo,
           se responde con el catalogo publico de hoy (`productos.yaml`).
        3. Si no, se busca en la base de conocimiento (HU-CHA-004).
        4. Si la pregunta no se entiende, se escala: la respuesta ofrece
           soporte humano y temas relacionados, y la pregunta se registra
           como brecha de conocimiento (HU-CHA-011).

        Desde 1.5.0 la respuesta va en el idioma de la pregunta, o en el de
        las preferencias del chat si no son AUTOMATICO.

        Desde 1.3.0 la respuesta puede traer `enriquecido` (pasos, enlaces,
        tarjetas, respuestas rapidas, oferta de soporte humano), y la `vista`
        opcional de la peticion ayuda a elegir la respuesta contextual.

        Nunca ejecuta operaciones economicas (pujas, compras): solo consulta.
      security:
        - {}
        - tokenDeUsuario: []
      parameters:
        - $ref: '#/components/parameters/IdSesionAnonima'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnviarMensaje'
            example:
              contenido: como subo de nivel a mi heroe
      responses:
        '200':
          description: Respuesta del bot, ya guardada en el historial.
          headers:
            X-Id-Sesion-Anonima:
              description: Solo si el servidor acaba de emitir una sesion de visitante para esta peticion.
              schema:
                type: string
                pattern: '^anon_[A-Za-z0-9_-]{43}$'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensaje'
              example:
                id: 0148c91d-1436-4a7c-8dbc-f339f8f634ce
                remitente: BOT
                contenido: Puedes revisar tu inventario en la seccion de Inventario del menu principal.
                adjuntoUrl: null
                fechaEnvio: '2026-09-23T18:09:10.326633Z'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '422':
          description: |
            El texto contiene un termino de la lista negra (`motivo`
            CONTENIDO_BLOQUEADO) o, desde 1.4.0, un intento de inyeccion de
            codigo (`motivo` INYECCION_DETECTADA; el detalle no repite el
            texto). No se guarda ni el mensaje ni ninguna respuesta.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '503':
          description: |
            La lista negra no responde y el mensaje no se puede verificar
            (`motivo` MODERACION_NO_DISPONIBLE). No se guarda nada.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /chat/historial:
    get:
      tags: [chat]
      operationId: obtenerHistorialDelChatbot
      summary: Historial de la conversacion de la sesion
      description: |
        Mensajes (del usuario y del bot) de la conversacion de esta sesion,
        del mas antiguo al mas reciente. Lista vacia si la sesion todavia no
        ha escrito, y tambien (1.2.0) si no hay token valido ni una sesion de
        visitante vigente y registrada: un `uid` u otro valor no abre la
        conversacion de nadie.

        Sin `limite` ni `antesDe` devuelve todo el historial. Con alguno de
        los dos (1.3.5) devuelve una pagina: los `limite` mensajes mas
        recientes o, con `antesDe`, los `limite` anteriores a ese mensaje.
        Para seguir hacia atras se pasa como `antesDe` el `id` del primer
        mensaje recibido; una lista vacia indica que no hay mas.
      security:
        - { }
        - tokenDeUsuario: [ ]
      parameters:
        - $ref: '#/components/parameters/IdSesionAnonima'
        - name: antesDe
          in: query
          required: false
          description: |
            (1.3.5) `id` de un mensaje de esta conversacion: devuelve los
            anteriores a el. Un `id` de otra conversacion, o que ya no existe,
            devuelve lista vacia.
          schema:
            type: string
            format: uuid
        - name: limite
          in: query
          required: false
          description: |
            (1.3.5) Maximo de mensajes de la pagina. Si llega `antesDe` sin
            `limite`, se usan 50.
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Mensajes de la conversacion, en orden cronologico.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Mensaje'
        '400':
          $ref: '#/components/responses/PeticionInvalida'

    delete:
      tags: [chat]
      operationId: limpiarHistorialDelChatbot
      summary: Borra el historial de la conversacion de la sesion
      description: |
        Borra todos los mensajes de la conversacion y, con ellos, sus
        calificaciones. Idempotente: sin conversacion previa, responde igual.
        Sin token valido ni sesion de visitante vigente y registrada no borra
        nada (1.2.0).

        Lo que queda (1.4.0, documentado para 7.4.8 «cumplimiento con
        politicas de proteccion de datos»):
        * la fila de la conversacion, vacia (solo su clave y sus fechas);
        * las preferencias del chat (idioma y nivel de detalle), que son una
          configuracion y no historial; `PUT /chat/preferencias` las cambia;
        * las brechas de conocimiento: un agregado sin vinculo con la sesion
          y, desde 1.4.0, siempre redactado;
        * los tickets de soporte con su contexto (redactado), que son la
          constancia de una atencion humana: el jugador los sigue viendo en
          `GET /chat/tickets`;
        * las copias de respaldo del entorno, hasta que caducan.
      security:
        - {}
        - tokenDeUsuario: []
      parameters:
        - $ref: '#/components/parameters/IdSesionAnonima'
      responses:
        '204':
          description: Historial borrado (o no habia nada que borrar).
        '400':
          $ref: '#/components/responses/PeticionInvalida'

  /chat/mensajes/{mensajeId}/calificacion:
    post:
      tags: [calificaciones]
      operationId: calificarRespuestaDelChatbot
      summary: Califica una respuesta del bot como util o no util (HU-CHA-011)
      description: |
        Una sola calificacion por respuesta. Solo se califican mensajes del
        bot, y solo los de la propia conversacion: un mensaje de otra sesion
        responde 404, igual que uno inexistente, para no revelar que existe.
        Sin token valido ni sesion de visitante vigente y registrada, 404 (1.2.0).

        Una calificacion "no util" registra como brecha de conocimiento la
        pregunta del usuario que origino esa respuesta.

        Desde 1.4.0 el `comentario` se revisa como cualquier texto del
        usuario (sin caracteres de control, inyeccion bloqueada, datos
        sensibles tapados) y pasa por la lista negra: 422 o 503 y no se
        guarda la calificacion. La revision va DESPUES de comprobar que la
        respuesta es de quien llama, asi que un mensaje ajeno sigue siendo
        404.
      security:
        - {}
        - tokenDeUsuario: []
      parameters:
        - name: mensajeId
          in: path
          required: true
          description: '`id` de un mensaje del bot, tal como lo devolvio `POST /chat/mensajes`.'
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdSesionAnonima'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalificarRespuesta'
            example:
              util: false
              comentario: No respondio lo que pregunte
      responses:
        '201':
          description: Calificacion registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Calificacion'
        '400':
          description: |
            Cuerpo invalido (falta `util`, comentario de mas de 1000
            caracteres), `mensajeId` que no es un UUID, falta de identidad, o
            el mensaje es del usuario y no del bot.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No existe un mensaje con ese `id` en la conversacion de quien llama.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Esa respuesta ya fue calificada.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: |
            (1.4.0) El comentario contiene un termino de la lista negra
            (`motivo` CONTENIDO_BLOQUEADO) o un intento de inyeccion de codigo
            (`motivo` INYECCION_DETECTADA). No se guarda la calificacion.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: |
            (1.4.0) La lista negra no responde y el comentario no se puede
            verificar (`motivo` MODERACION_NO_DISPONIBLE). No se guarda nada.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /chat/sugerencias:
    get:
      tags: [chat]
      operationId: sugerirPreguntasDelChatbot
      summary: Preguntas rapidas, temas frecuentes y autocompletado (1.3.0)
      description: |
        Salen de la version EN PRODUCCION de la base de conocimiento, asi que
        cada sugerencia es una pregunta que el chatbot sabe responder.

        * Sin `q`: los temas mas consultados, para los botones de preguntas
          rapidas y el menu de temas frecuentes (7.4.6). Con `categoria`,
          solo los de esa categoria (desde 1.6.0, tambien los que la
          atienden como intencion adicional).
        * Con `q` (2 o mas caracteres): autocompletado; los temas cuyo
          titulo o variantes empiezan o contienen lo que el usuario lleva
          escrito, con la misma tolerancia a tildes y mayusculas del motor.

        Es igual para todos (no depende de quien pregunta), asi que no lleva
        identidad y se puede guardar en cache.
      security:
        - {}
      parameters:
        - name: q
          in: query
          required: false
          description: Lo que el usuario lleva escrito. Menos de 2 caracteres equivale a no mandarlo.
          schema:
            type: string
            maxLength: 100
        - name: categoria
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Categoria'
        - name: limite
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 6
      responses:
        '200':
          description: Sugerencias, la mas relevante primero. Lista vacia si no hay ninguna.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SugerenciaDePregunta'
        '400':
          $ref: '#/components/responses/PeticionInvalida'

  /chat/preferencias:
    get:
      tags: [ chat ]
      operationId: obtenerPreferenciasDelChatbot
      summary: Preferencias de respuesta de esta sesion (1.3.6)
      description: |
        El idioma y el nivel de detalle con que responde el chatbot (7.4.5).
        Quien nunca las cambio, o no tiene token valido ni una sesion de
        visitante vigente y registrada, recibe las de por defecto
        (`AUTOMATICO`, `NORMAL`), que responden exactamente como antes de
        1.3.6. Un `uid` en la cabecera no abre las preferencias de nadie.
      security:
        - { }
        - tokenDeUsuario: [ ]
      parameters:
        - $ref: '#/components/parameters/IdSesionAnonima'
      responses:
        '200':
          description: Preferencias vigentes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferenciasDelChat'
              example:
                idioma: AUTOMATICO
                nivelDetalle: NORMAL
    put:
      tags: [ chat ]
      operationId: guardarPreferenciasDelChatbot
      summary: Guarda las preferencias de respuesta (1.3.6)
      description: |
        Guarda el par completo (no es un parche). Las de un jugador se
        guardan por su `uid` y lo siguen entre dispositivos; las de un
        visitante, por su sesion, y se pierden cuando esta vence. Como el
        primer mensaje, si el visitante no tiene una sesion registrada se le
        emite una y vuelve en `X-Id-Sesion-Anonima`.
      security:
        - { }
        - tokenDeUsuario: [ ]
      parameters:
        - $ref: '#/components/parameters/IdSesionAnonima'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferenciasDelChat'
            example:
              idioma: EN
              nivelDetalle: BREVE
      responses:
        '200':
          description: Preferencias guardadas.
          headers:
            X-Id-Sesion-Anonima:
              description: Solo si el servidor acaba de emitir una sesion de visitante para esta peticion.
              schema:
                type: string
                pattern: '^anon_[A-Za-z0-9_-]{43}$'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferenciasDelChat'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'

  /chat/tickets:
    post:
      tags: [soporte]
      operationId: abrirTicketDeSoporteDelChatbot
      summary: Abre un ticket de soporte humano (1.3.0)
      description: |
        Solo para jugadores con sesion: el ticket queda a nombre del `uid`
        del token. A un visitante se le responde 401 (`motivo`
        SESION_REQUERIDA) y la ventana le explica que necesita una cuenta y
        le ofrece iniciar sesion o crear una.

        El servidor guarda con el ticket el contexto de la conversacion
        actual (los ultimos mensajes, ya redactados: sin contrasenas,
        tarjetas ni tokens). No se piden ni se guardan email, nombre ni
        telefono.

        Un solo ticket abierto (ABIERTO o EN_PROCESO) por conversacion: el
        segundo responde 409 (`motivo` TICKET_ABIERTO). Pasa por el mismo
        limite de frecuencia (429) y la misma lista negra (422 y 503) que
        `POST /chat/mensajes`.
      security:
        - tokenDeUsuario: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbrirTicket'
            example:
              categoria: SOPORTE_TECNICO
              asunto: No carga mi inventario
              mensaje: Desde ayer la seccion de inventario se queda cargando.
      responses:
        '201':
          description: Ticket abierto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDeSoporte'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          description: Sin token valido (`motivo` SESION_REQUERIDA).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Ya hay un ticket abierto para esta conversacion (`motivo` TICKET_ABIERTO).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: |
            El asunto o el mensaje tienen un termino de la lista negra (`motivo`
            CONTENIDO_BLOQUEADO) o, desde 1.4.0, un intento de inyeccion de
            codigo (`motivo` INYECCION_DETECTADA). No se guarda nada.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '503':
          description: La lista negra no responde (`motivo` MODERACION_NO_DISPONIBLE). No se guarda nada.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    get:
      tags: [soporte]
      operationId: listarMisTicketsDelChatbot
      summary: Tickets del propio jugador, el mas reciente primero (1.3.0)
      security:
        - tokenDeUsuario: []
      responses:
        '200':
          description: Tickets del `uid` del token, con su estado y la respuesta de soporte si ya la hay.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketDeSoporte'
        '401':
          description: Sin token valido (`motivo` SESION_REQUERIDA).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /chat/tickets/desde-conversacion:
    post:
      tags: [soporte]
      operationId: abrirTicketDesdeLaConversacionDelChatbot
      summary: Abre un ticket con la pregunta que el chatbot no resolvio (1.8.0)
      description: |
        La «solicitud en un clic» de la ventana despues de un escalamiento o
        de un «no me sirvio». El servidor arma el ticket con la conversacion
        de QUIEN LLAMA (el `uid` del token; ningun identificador del cuerpo
        elige la conversacion):

        * Pregunta: la ultima sin resolver, es decir, la que el chatbot no
          entendio (escalada) o la que respondio con algo que «no le sirvio»
          (la pregunta, no el «no me sirvio»). Si no hay ninguna, la ultima
          pregunta de la conversacion. Ya esta redactada: se guardo asi.
        * `categoria`: la del tema que respondio esa pregunta; si no hubo
          tema, la de `vista`; si tampoco, FAQ_GENERAL.
        * `asunto`: «Sin respuesta del asistente: <pregunta>», recortado a
          150 caracteres.
        * `mensaje`: la pregunta y que paso con ella y, si llega,
          `comentario`; como mucho 2000 caracteres.
        * El contexto (los ultimos mensajes, redactados), igual que
          `POST /chat/tickets`.

        Mismas reglas que `POST /chat/tickets`: solo jugadores (401
        SESION_REQUERIDA), mismo limite de frecuencia (429), el asunto y el
        mensaje pasan por la revision (422 INYECCION_DETECTADA) y la lista
        negra (422 CONTENIDO_BLOQUEADO, 503 MODERACION_NO_DISPONIBLE), y una
        sola solicitud abierta (409 TICKET_ABIERTO).
      security:
        - tokenDeUsuario: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbrirTicketDesdeConversacion'
            example:
              vista: SUBASTAS
      responses:
        '201':
          description: Ticket abierto, como lo ve el jugador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDeSoporte'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          description: Sin token valido (`motivo` SESION_REQUERIDA).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: |
            Ya hay un ticket abierto (`motivo` TICKET_ABIERTO), o la
            conversacion no tiene ninguna pregunta de la cual partir
            (`motivo` SIN_CONVERSACION).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: |
            El comentario, o la pregunta tomada de la conversacion, tiene un
            termino de la lista negra (`motivo` CONTENIDO_BLOQUEADO) o un
            intento de inyeccion de codigo (`motivo` INYECCION_DETECTADA). No
            se guarda nada.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '503':
          description: La lista negra no responde (`motivo` MODERACION_NO_DISPONIBLE). No se guarda nada.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /chat/ayuda:
    get:
      tags: [ayuda]
      operationId: obtenerCentroDeAyudaDelChatbot
      summary: Lo que el chatbot sabe responder, por categoria (1.8.0)
      description: |
        El centro de ayuda: los temas ACTIVOS de la version EN PRODUCCION de
        la base de conocimiento, agrupados por su categoria (en el orden de
        `Categoria`, sin las que no tienen temas), y dentro de cada una el de
        mayor prioridad primero y despues por titulo. Sin los temas de
        cortesia (saludo, despedida).

        Solo lo que lee un jugador: titulo, respuesta en espanol y en ingles
        y sus pasos. Nada interno (clave, variantes de pregunta, prioridad,
        version, fechas).

        Es igual para todos: no lee identidad, no tiene limite propio en el
        borde (como toda lectura) y se puede guardar en cache cinco minutos.
        Sin version en produccion, `categorias` viene vacia.
      security:
        - {}
      responses:
        '200':
          description: El centro de ayuda.
          headers:
            Cache-Control:
              description: '`public, max-age=300`.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CentroDeAyuda'

  # ===========================================================================
  # PANEL ADMINISTRATIVO (HU-CHA-012)
  # ===========================================================================

  /chatbot/admin/analiticas:
    get:
      tags: [admin-analiticas]
      operationId: consultarAnaliticasDelChatbot
      summary: Tablero de analiticas del chatbot para un periodo
      description: |
        Indicadores del periodo, temas mas consultados (hasta 10) y tendencia
        diaria con todos los dias del periodo (tambien los que no tuvieron
        actividad).

        Definiciones (1.7.0; la formula exacta de cada una esta en su campo
        de `AnaliticaChatbot`):

        * `conversaciones`: conversaciones INICIADAS en el periodo.
        * `tasaResolucion`: respuestas resueltas sin intervencion humana
          entre las respuestas con resultado guardado (desde V13).
        * `escalamientos`: veces que el asistente ofrecio soporte humano.
          Las solicitudes de soporte abiertas son `tickets.total`.
        * `satisfaccion`: proporcion de calificaciones "util".
        * `tiempoRespuestaPromedioMs`: tiempo que tarda el servidor en
          generar la respuesta.

        Las tasas son proporciones entre 0 y 1, y `null` cuando no hay datos
        para calcularlas (no es lo mismo que 0). Los tiempos y los
        escalamientos cuentan desde la migracion V4, que es cuando se
        empezaron a medir; la tasa de resolucion, desde V13.
      security:
        - tokenDeAdministrador: []
      parameters:
        - $ref: '#/components/parameters/Desde'
        - $ref: '#/components/parameters/Hasta'
      responses:
        '200':
          description: Tablero del periodo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnaliticaChatbot'
        '400':
          $ref: '#/components/responses/PeriodoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'

  /chatbot/admin/analiticas/exportacion:
    get:
      tags: [admin-analiticas]
      operationId: exportarAnaliticasDelChatbot
      summary: Descarga el tablero de analiticas como CSV
      description: |
        Mismo contenido que `GET /chatbot/admin/analiticas`, en bloques
        separados por una linea en blanco: resumen, temas frecuentes,
        tendencia diaria, solicitudes de soporte (1.3.7), palabras clave
        (1.3.7, con su tendencia desde 1.7.0) y, desde 1.7.0, resultado de
        las respuestas y preguntas frecuentes. Pensado para abrirse directo
        en Excel en espanol: separador `;`, UTF-8 con BOM y lineas CRLF.
        Las tasas van en porcentaje.

        1.7.0 — sin formulas: una celda que empieza por `=`, `+`, `-`, `@`,
        tabulador o retorno de carro (una pregunta o una palabra que escribio
        un jugador) lleva delante una comilla simple `'`, para que la hoja de
        calculo la muestre como texto y no la ejecute. Las comillas y el
        separador se siguen escapando como siempre.
      security:
        - tokenDeAdministrador: []
      parameters:
        - $ref: '#/components/parameters/Desde'
        - $ref: '#/components/parameters/Hasta'
      responses:
        '200':
          description: Archivo CSV, con `Content-Disposition` de descarga (`analiticas-chatbot-<desde>-a-<hasta>.csv`).
          content:
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/PeriodoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'

  /chatbot/admin/brechas:
    get:
      tags: [admin-aprendizaje]
      operationId: listarBrechasDeConocimientoDelChatbot
      summary: Preguntas sin respuesta, las mas repetidas primero (1.7.0)
      description: |
        Las brechas de conocimiento (HU-CHA-011): preguntas que el asistente
        no entendio (escalamiento) o cuya respuesta se califico «no util»,
        agrupadas por su texto normalizado. Es un agregado sin vinculo con
        la sesion de nadie, y la pregunta de ejemplo ya esta redactada
        (1.4.0).

        * **Orden**: `total` (escalamientos + «no util») de mayor a menor;
          a igual total, la que se pregunto mas recientemente.
        * **Periodo** (`desde`, `hasta`, dias completos en hora de
          Colombia): las brechas con actividad en el: preguntadas por
          ultima vez desde el inicio del periodo y por primera vez antes de
          su fin. Los contadores son los de toda su vida, no los del
          periodo: el servicio no guarda cada ocurrencia, solo la primera,
          la ultima y cuantas van.
        * **Estado**: sin `estado`, todas.

        Una brecha ATENDIDA que se vuelve a preguntar vuelve sola a
        PENDIENTE y suma una `reaperturas`. Una DESCARTADA sigue
        DESCARTADA aunque se repita (sigue contando).
      security:
        - tokenDeAdministrador: []
      parameters:
        - $ref: '#/components/parameters/Desde'
        - $ref: '#/components/parameters/Hasta'
        - name: estado
          in: query
          required: false
          description: Solo las de ese estado. Sin el, todas.
          schema:
            $ref: '#/components/schemas/EstadoDeBrecha'
        - name: pagina
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: tamano
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Una pagina de brechas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaDeBrechas'
        '400':
          description: Fecha mal escrita, periodo invalido (ver `PeriodoInvalido`), `estado` desconocido o pagina fuera de rango.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'

  /chatbot/admin/brechas/{brechaId}:
    parameters:
      - name: brechaId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [admin-aprendizaje]
      operationId: cambiarEstadoDeBrechaDelChatbot
      summary: Marca una pregunta sin respuesta como atendida o descartada (1.7.0)
      description: |
        ATENDIDA: un tema de la base ya la cubre. DESCARTADA: es ruido (una
        prueba, algo que no es del juego). PENDIENTE: vuelve a la lista de
        trabajo. Se guarda quien (el claim `uid` del token del
        administrador, o su `sub` si el token no trae `uid`; nunca un dato
        del cuerpo) y cuando. Marcarla con el estado que ya tiene no cambia
        nada.
      security:
        - tokenDeAdministrador: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambiarEstadoDeBrecha'
            example:
              estado: ATENDIDA
      responses:
        '200':
          description: La brecha, con su estado nuevo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrechaDeConocimiento'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /chatbot/admin/base-conocimiento/versiones:
    get:
      tags: [admin-base-conocimiento]
      operationId: listarVersionesDeLaBaseDeConocimiento
      summary: Todas las versiones de la base de conocimiento
      description: De la mas reciente a la mas antigua. Hay exactamente una en `PRODUCCION` y como mucho una en `BORRADOR`.
      security:
        - tokenDeAdministrador: []
      responses:
        '200':
          description: Versiones.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VersionBaseConocimiento'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'

  /chatbot/admin/base-conocimiento/versiones/{versionId}/exportacion:
    get:
      tags: [admin-base-conocimiento]
      operationId: exportarVersionDeLaBaseDeConocimiento
      summary: Descarga una version completa como JSON
      description: |
        Cualquier version, en cualquier estado. El archivo se puede volver a
        subir tal cual con `PUT /chatbot/admin/base-conocimiento/borrador/importacion`.
      security:
        - tokenDeAdministrador: []
      parameters:
        - name: versionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Archivo JSON, con `Content-Disposition` de descarga (`base-conocimiento-v<numero>.json`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportacionBaseConocimiento'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /chatbot/admin/base-conocimiento/borrador:
    post:
      tags: [admin-base-conocimiento]
      operationId: crearVersionCandidataDeLaBaseDeConocimiento
      summary: Crea la version candidata como copia de produccion
      description: |
        La candidata (`BORRADOR`) es la unica version que se edita. Nace con
        todos los temas de produccion, que conservan su `clave`. El cuerpo es
        opcional.
      security:
        - tokenDeAdministrador: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearCandidata'
      responses:
        '201':
          description: Candidata creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionBaseConocimiento'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '409':
          $ref: '#/components/responses/ConflictoDeVersion'
    delete:
      tags: [admin-base-conocimiento]
      operationId: descartarVersionCandidataDeLaBaseDeConocimiento
      summary: Descarta la version candidata y sus temas
      security:
        - tokenDeAdministrador: []
      responses:
        '204':
          description: Candidata descartada.
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '409':
          $ref: '#/components/responses/ConflictoDeVersion'

  /chatbot/admin/base-conocimiento/borrador/temas:
    get:
      tags: [admin-base-conocimiento]
      operationId: listarTemasDeLaVersionCandidata
      summary: Temas de la version candidata, activos o no
      security:
        - tokenDeAdministrador: []
      responses:
        '200':
          description: Temas, ordenados por titulo.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tema'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '409':
          $ref: '#/components/responses/ConflictoDeVersion'
    post:
      tags: [admin-base-conocimiento]
      operationId: agregarTemaALaVersionCandidata
      summary: Agrega un tema a la version candidata
      description: |
        El tema recibe una `clave` nueva.

        Desde 1.6.0: con `intencionesAdicionales` (hasta 5, sin repetir,
        nunca la `categoria`; si no, 400); un titulo igual al de otro tema de
        la candidata, sin contar tildes, mayusculas ni signos, es 409
        TEMA_DUPLICADO; las variantes repetidas se guardan una vez.
      security:
        - tokenDeAdministrador: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatosDeTema'
            example:
              categoria: SUBASTA_Y_COMERCIO
              intencionesAdicionales: [CUENTA_Y_REGISTRO]
              tipoRespuesta: PASO_A_PASO
              titulo: Cómo conseguir créditos para pujar
              variantesEs: [como consigo creditos, me faltan creditos para pujar]
              variantesEn: [how do I get credits]
              respuestaEs: 'Los créditos se ganan en las misiones y las batallas. 1) Entra a «Misiones». 2) Completa una misión.'
              respuestaEn: null
              prioridad: 1
              activo: true
      responses:
        '201':
          description: Tema creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tema'
        '400':
          $ref: '#/components/responses/TemaInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '409':
          $ref: '#/components/responses/ConflictoDeTema'

  /chatbot/admin/base-conocimiento/borrador/temas/{temaId}:
    parameters:
      - name: temaId
        in: path
        required: true
        description: '`id` del tema dentro de la candidata (no su `clave`).'
        schema:
          type: string
          format: uuid
    put:
      tags: [admin-base-conocimiento]
      operationId: editarTemaDeLaVersionCandidata
      summary: Edita un tema de la version candidata
      description: |
        La `clave` no cambia. Un tema de otra version responde 404.

        Desde 1.6.0 `intencionesAdicionales` reemplaza las que tenia (sin
        valor = ninguna), con las mismas reglas que al agregar. Conservar el
        propio titulo no es un duplicado; tomar el de otro tema, si (409
        TEMA_DUPLICADO).
      security:
        - tokenDeAdministrador: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatosDeTema'
      responses:
        '200':
          description: Tema actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tema'
        '400':
          $ref: '#/components/responses/TemaInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ConflictoDeTema'
    delete:
      tags: [admin-base-conocimiento]
      operationId: eliminarTemaDeLaVersionCandidata
      summary: Elimina un tema de la version candidata
      security:
        - tokenDeAdministrador: []
      responses:
        '204':
          description: Tema eliminado.
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ConflictoDeVersion'

  /chatbot/admin/base-conocimiento/borrador/importacion:
    put:
      tags: [admin-base-conocimiento]
      operationId: importarTemasEnLaVersionCandidata
      summary: Reemplaza todo el contenido de la candidata por el de un archivo
      description: |
        Acepta el archivo de `.../exportacion` tal cual: de el solo se lee
        `temas`. Un tema con `clave` la conserva (asi sigue contando como el
        mismo tema en las analiticas); sin `clave`, se trata como nuevo. Una
        `clave` repetida en el archivo responde 400.

        Desde 1.6.0:
        * cada tema conserva sus `intencionesAdicionales` (mismas reglas que
          al agregarlo; el 400 dice que tema del archivo falla). Un archivo
          anterior a 1.6.0, sin el campo, se importa igual;
        * como el archivo reemplaza la candidata entera, un titulo duplicado
          solo puede estar dentro del archivo: dos temas con el mismo
          titulo (sin contar tildes, mayusculas ni signos) responden 409
          TEMA_DUPLICADO;
        * como mucho 500 temas y 8 MB: mas responde 413
          IMPORTACION_DEMASIADO_GRANDE (el tamano se mira antes de leer el
          cuerpo).

        Todo se comprueba antes de tocar la candidata: con cualquier error no
        se escribe nada.
      security:
        - tokenDeAdministrador: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportacionBaseConocimiento'
      responses:
        '200':
          description: Temas de la candidata despues de importar.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tema'
        '400':
          $ref: '#/components/responses/TemaInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '409':
          $ref: '#/components/responses/ConflictoDeTema'
        '413':
          $ref: '#/components/responses/ImportacionDemasiadoGrande'

  /chatbot/admin/base-conocimiento/borrador/evaluacion:
    post:
      tags: [admin-reentrenamiento]
      operationId: evaluarVersionCandidataDelChatbot
      summary: Compara la candidata con produccion, sin desplegar
      description: |
        Corre los casos de evaluacion activos contra las dos versiones, con
        la misma logica con la que el chatbot responde, y guarda las dos
        evaluaciones. `candidataApta` dice si un despliegue pasaria.
      security:
        - tokenDeAdministrador: []
      responses:
        '200':
          description: Resultado de las dos versiones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparacionEvaluacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '409':
          $ref: '#/components/responses/ConflictoDeVersion'

  /chatbot/admin/base-conocimiento/borrador/despliegue:
    post:
      tags: [admin-reentrenamiento]
      operationId: desplegarVersionCandidataDelChatbot
      summary: Despliega la candidata si no rinde peor que produccion
      description: |
        Evalua como `.../borrador/evaluacion`. Si la candidata acierta al
        menos tantos casos como produccion, pasa a `PRODUCCION` y la
        anterior a `RETIRADA`; rige desde el siguiente mensaje del chat. Si
        acierta menos, nada cambia y responde 409 con los dos resultados.
      security:
        - tokenDeAdministrador: []
      responses:
        '200':
          description: La candidata, ya en produccion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionBaseConocimiento'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '409':
          description: |
            La candidata rinde peor (cuerpo `DespliegueRechazado`), o no hay
            candidata, o no hay casos de evaluacion activos (problem details
            simple). Desde 1.6.0 tambien si otro despliegue, una reversion o
            la publicacion programada cambiaron las versiones mientras esta
            esperaba su turno (`motivo` CAMBIO_CONCURRENTE): no se despliega
            nada, y nunca quedan dos versiones en produccion.
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/DespliegueRechazado'
                  - $ref: '#/components/schemas/ProblemDetail'
              examples:
                cambioConcurrente:
                  $ref: '#/components/examples/CambioConcurrente'
  /chatbot/admin/base-conocimiento/borrador/programacion:
    put:
      tags: [admin-reentrenamiento]
      operationId: programarDespliegueDelChatbot
      summary: Programa la publicacion de la candidata (1.3.8)
      description: |
        Deja la candidata lista para publicarse sola en `desplegarEn`
        (7.4.10). Al llegar la hora, el servicio hace exactamente lo mismo
        que `.../borrador/despliegue`: evalua y solo la publica si no acierta
        menos que produccion. Si no pasa (o faltan casos o produccion), queda
        sin programar y con `programacionRechazadaEn`. Programar de nuevo
        reemplaza la fecha anterior. Con varias instancias del servicio se
        publica una sola vez.
      security:
        - tokenDeAdministrador: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramarDespliegue'
            example:
              desplegarEn: '2026-10-01T15:00:00Z'
      responses:
        '200':
          description: La candidata, con su fecha programada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionBaseConocimiento'
        '400':
          description: |
            Sin fecha, a menos de un minuto o a mas de 90 dias de ahora.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '409':
          description: |
            No hay version candidata, o (1.6.0) otra operacion la cambio
            mientras esta esperaba su turno (`motivo` CAMBIO_CONCURRENTE).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                cambioConcurrente:
                  $ref: '#/components/examples/CambioConcurrente'
    delete:
      tags: [admin-reentrenamiento]
      operationId: cancelarDespliegueProgramadoDelChatbot
      summary: Cancela la publicacion programada de la candidata (1.3.8)
      description: La candidata sigue igual, sin fecha de publicacion.
      security:
        - tokenDeAdministrador: []
      responses:
        '200':
          description: La candidata, sin programar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionBaseConocimiento'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '409':
          description: |
            No hay version candidata, o (1.6.0) otra operacion la cambio
            mientras esta esperaba su turno (`motivo` CAMBIO_CONCURRENTE).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                cambioConcurrente:
                  $ref: '#/components/examples/CambioConcurrente'

  /chatbot/admin/base-conocimiento/produccion/reversion:
    post:
      tags: [admin-reentrenamiento]
      operationId: revertirVersionEnProduccionDelChatbot
      summary: Vuelve a la version que estuvo en produccion justo antes
      description: |
        La version en produccion pasa a `RETIRADA` y la retirada que entro a
        produccion mas recientemente vuelve a `PRODUCCION`. Revertir dos
        veces seguidas vuelve a la version de partida.

        Desde 1.6.0, si un despliegue (o la publicacion programada) cambio la
        version en produccion mientras la reversion esperaba su turno, 409
        CAMBIO_CONCURRENTE: no se revierte una version que el administrador
        no estaba viendo.
      security:
        - tokenDeAdministrador: []
      responses:
        '200':
          description: La version restaurada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionBaseConocimiento'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '409':
          $ref: '#/components/responses/ConflictoDeVersion'

  /chatbot/admin/base-conocimiento/casos-evaluacion:
    get:
      tags: [admin-reentrenamiento]
      operationId: listarCasosDeEvaluacionDelChatbot
      summary: Casos de evaluacion, los mas nuevos primero
      security:
        - tokenDeAdministrador: []
      responses:
        '200':
          description: Casos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CasoEvaluacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
    post:
      tags: [admin-reentrenamiento]
      operationId: crearCasoDeEvaluacionDelChatbot
      summary: Crea un caso de evaluacion
      security:
        - tokenDeAdministrador: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatosDeCasoEvaluacion'
      responses:
        '201':
          description: Caso creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasoEvaluacion'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'

  /chatbot/admin/base-conocimiento/casos-evaluacion/{casoId}:
    parameters:
      - name: casoId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [admin-reentrenamiento]
      operationId: editarCasoDeEvaluacionDelChatbot
      summary: Edita un caso de evaluacion
      security:
        - tokenDeAdministrador: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatosDeCasoEvaluacion'
      responses:
        '200':
          description: Caso actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasoEvaluacion'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    delete:
      tags: [admin-reentrenamiento]
      operationId: eliminarCasoDeEvaluacionDelChatbot
      summary: Elimina un caso de evaluacion
      security:
        - tokenDeAdministrador: []
      responses:
        '204':
          description: Caso eliminado.
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /chatbot/admin/tickets:
    get:
      tags: [admin-soporte]
      operationId: listarTicketsDelChatbot
      summary: Tickets de soporte, los mas recientes primero (1.3.0)
      security:
        - tokenDeAdministrador: []
      parameters:
        - name: estado
          in: query
          required: false
          description: Solo los de ese estado. Sin el, todos.
          schema:
            $ref: '#/components/schemas/EstadoDeTicket'
        - name: pagina
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: tamano
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Una pagina de tickets (sin el contexto de la conversacion).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaDeTickets'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'

  /chatbot/admin/tickets/{ticketId}:
    parameters:
      - name: ticketId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [admin-soporte]
      operationId: consultarTicketDelChatbot
      summary: Un ticket con el contexto de la conversacion (1.3.0)
      security:
        - tokenDeAdministrador: []
      responses:
        '200':
          description: El ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDeSoporteAdmin'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    patch:
      tags: [admin-soporte]
      operationId: atenderTicketDelChatbot
      summary: Cambia el estado, lo asigna o le responde (1.3.0)
      description: |
        Solo cambia los campos que vienen. Transiciones validas:
        ABIERTO -> EN_PROCESO, RESUELTO o CERRADO; EN_PROCESO -> RESUELTO o
        CERRADO; RESUELTO -> CERRADO o EN_PROCESO (reabrir). Un ticket
        CERRADO ya no cambia (409, `motivo` TRANSICION_NO_PERMITIDA).
        Pasar a RESUELTO exige una `respuesta`, que es lo que ve el jugador.
      security:
        - tokenDeAdministrador: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtenderTicket'
            example:
              estado: RESUELTO
              respuesta: Ya revisamos tu inventario; vuelve a entrar y deberia cargar.
      responses:
        '200':
          description: Ticket actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDeSoporteAdmin'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: |
            El estado actual no permite ese cambio (`motivo`
            TRANSICION_NO_PERMITIDA), o (1.3.9) se quiere reabrir el ticket y
            el jugador ya tiene otro abierto (`motivo` OTRO_TICKET_ABIERTO):
            solo puede tener uno a la vez.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

components:
  securitySchemes:
    tokenDeUsuario:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token de sesion de un usuario (ADR-002), firmado por ms-identidad y
        verificado contra su JWKS, con claim `uid`. Opcional en todas las
        rutas de `/chat/**`: sin el, la peticion es de un visitante.
    tokenDeAdministrador:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Mismo token de ms-identidad, con claim `rol` igual a ADMINISTRADOR o
        SUPER_ADMINISTRADOR. Obligatorio en `/chatbot/admin/**`.

  headers:
    SesionAnonimaEmitida:
      description: Sesion de visitante recien emitida por el servidor (1.2.0).
      schema:
        type: string
        pattern: '^anon_[A-Za-z0-9_-]{43}$'

  parameters:
    IdSesionAnonima:
      name: X-Id-Sesion-Anonima
      in: header
      required: false
      description: |
        Sesion de un visitante (1.2.0): emitida por el servidor (`anon_` + 43
        caracteres base64url, `POST /chat/sesiones`) o declarada por el
        navegador (`visitante-` + 10 a 64 caracteres `[A-Za-z0-9-]`). Se
        ignora si hay token valido. Nunca es la clave de la conversacion de un
        usuario; un valor sin ninguna de las dos formas, o vencido, se trata
        como si no viniera.
      schema:
        type: string
        maxLength: 255
    Desde:
      name: desde
      in: query
      required: false
      description: Primer dia del periodo, inclusive, en hora de Colombia. Por omision, 29 dias antes de `hasta`.
      schema:
        type: string
        format: date
      example: '2026-09-01'
    Hasta:
      name: hasta
      in: query
      required: false
      description: Ultimo dia del periodo, inclusive, en hora de Colombia. Por omision, hoy. El periodo no puede superar 366 dias.
      schema:
        type: string
        format: date
      example: '2026-09-30'

  responses:
    PeticionInvalida:
      description: Cuerpo invalido.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    DemasiadasPeticiones:
      description: |
        Limite de frecuencia superado (`motivo` LIMITE_DE_FRECUENCIA, 7.4.8).
        `Retry-After` dice en cuantos segundos se puede volver a intentar.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    PeriodoInvalido:
      description: Fecha mal escrita, `hasta` anterior a `desde`, o periodo de mas de 366 dias.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NoAutenticado:
      description: Sin token, o token invalido o vencido.
    SinPermiso:
      description: El token no tiene rol ADMINISTRADOR ni SUPER_ADMINISTRADOR.
    NoEncontrado:
      description: No existe ese recurso (o el tema no es de la version candidata).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ConflictoDeVersion:
      description: |
        El estado de las versiones no lo permite: no hay candidata, ya hay
        una, no hay version anterior a la cual revertir, o no hay casos de
        evaluacion activos. Desde 1.6.0 tambien cuando otra operacion
        (despliegue, reversion, publicacion programada o un cambio en la
        candidata) cambio las versiones mientras esta esperaba su turno:
        `motivo` CAMBIO_CONCURRENTE, y no se cambio nada.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            sinCandidata:
              $ref: '#/components/examples/SinCandidata'
            cambioConcurrente:
              $ref: '#/components/examples/CambioConcurrente'
    ConflictoDeTema:
      description: |
        1.6.0. No hay candidata; otro tema de la candidata ya tiene ese
        titulo, sin contar tildes, mayusculas ni signos (`motivo`
        TEMA_DUPLICADO; en una importacion, dos temas del mismo archivo); u
        otra operacion cambio las versiones mientras esta esperaba su turno
        (`motivo` CAMBIO_CONCURRENTE). No se escribe nada.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            temaDuplicado:
              $ref: '#/components/examples/TemaDuplicado'
            temaDuplicadoEnElArchivo:
              $ref: '#/components/examples/TemaDuplicadoEnElArchivo'
            cambioConcurrente:
              $ref: '#/components/examples/CambioConcurrente'
            sinCandidata:
              $ref: '#/components/examples/SinCandidata'
    TemaInvalido:
      description: |
        Cuerpo invalido. Desde 1.6.0 tambien `intencionesAdicionales` con mas
        de 5, una repetida o la propia `categoria` del tema; `detail` dice
        cual (y, en una importacion, que tema del archivo).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            intencionPrincipal:
              summary: La categoria principal tambien como adicional
              value:
                type: about:blank
                title: Bad Request
                status: 400
                detail: La intencion PRODUCTO ya es la categoria principal del tema; no se repite como adicional.
                instance: /api/v1/chatbot/admin/base-conocimiento/borrador/temas
            demasiadasIntenciones:
              summary: Mas de cinco intenciones adicionales
              value:
                type: about:blank
                title: Bad Request
                status: 400
                detail: Un tema atiende como maximo 5 intenciones ademas de su categoria y llegaron 6.
                instance: /api/v1/chatbot/admin/base-conocimiento/borrador/temas
            intencionEnLaImportacion:
              summary: En una importacion, el tema del archivo que falla
              value:
                type: about:blank
                title: Bad Request
                status: 400
                detail: "Tema 3 del archivo ('Como pujar'): la intencion SUBASTA_Y_COMERCIO esta repetida en las intenciones adicionales."
                instance: /api/v1/chatbot/admin/base-conocimiento/borrador/importacion
    ImportacionDemasiadoGrande:
      description: |
        1.6.0. El archivo trae mas de 500 temas o pesa mas de 8 MB (`motivo`
        IMPORTACION_DEMASIADO_GRANDE). El tamano se mira antes de leer el
        cuerpo. No se escribe nada.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            demasiadosTemas:
              summary: Mas de 500 temas
              value:
                type: about:blank
                title: Archivo demasiado grande
                status: 413
                detail: El archivo trae 612 temas y se importan como maximo 500. Divide la base o quita temas antes de importarla.
                instance: /api/v1/chatbot/admin/base-conocimiento/borrador/importacion
                motivo: IMPORTACION_DEMASIADO_GRANDE
            demasiadosBytes:
              summary: Mas de 8 MB
              value:
                type: about:blank
                title: Archivo demasiado grande
                status: 413
                detail: El archivo pesa mas de 8 MB, el maximo que se importa (500 temas). Revisa que sea una exportacion de la base de conocimiento.
                instance: /api/v1/chatbot/admin/base-conocimiento/borrador/importacion
                motivo: IMPORTACION_DEMASIADO_GRANDE

  examples:
    CambioConcurrente:
      summary: Otra operacion cambio las versiones a la vez (1.6.0)
      value:
        type: about:blank
        title: Cambio simultaneo
        status: 409
        detail: "Otro administrador cambio la base de conocimiento al mismo tiempo (otro despliegue, una reversion o un cambio en la candidata). No se cambio nada: revisa el estado actual y vuelve a intentarlo."
        instance: /api/v1/chatbot/admin/base-conocimiento/produccion/reversion
        motivo: CAMBIO_CONCURRENTE
    TemaDuplicado:
      summary: Otro tema de la candidata ya tiene ese titulo (1.6.0)
      value:
        type: about:blank
        title: Tema duplicado
        status: 409
        detail: "El titulo '¿COMO crear una CUENTA?' es el mismo que el del tema 'Cómo crear una cuenta' de la version candidata (sin contar tildes, mayusculas ni signos). Cambialo o edita ese tema."
        instance: /api/v1/chatbot/admin/base-conocimiento/borrador/temas
        motivo: TEMA_DUPLICADO
    TemaDuplicadoEnElArchivo:
      summary: Dos temas del archivo de importacion con el mismo titulo (1.6.0)
      value:
        type: about:blank
        title: Tema duplicado
        status: 409
        detail: "Los temas 1 y 3 del archivo tienen el mismo titulo ('Cómo pujar' y 'como PUJAR?', sin contar tildes, mayusculas ni signos). Una version no puede tener dos temas con el mismo titulo: cambia uno o quitalo del archivo."
        instance: /api/v1/chatbot/admin/base-conocimiento/borrador/importacion
        motivo: TEMA_DUPLICADO
    SinCandidata:
      summary: No hay version candidata
      value:
        type: about:blank
        title: Conflict
        status: 409
        detail: No hay una version candidata. Crea una a partir de la version en produccion.
        instance: /api/v1/chatbot/admin/base-conocimiento/borrador/temas

  schemas:
    EnviarMensaje:
      type: object
      required: [contenido]
      properties:
        contenido:
          type: string
          minLength: 1
          maxLength: 4000
          description: Texto del mensaje; no puede ser solo espacios.
        adjuntoUrl:
          type: [string, 'null']
          maxLength: 500
          deprecated: true
          description: |
            Obsoleto desde 1.3.0: el cliente decidio que el chatbot no recibe
            imagenes. Se acepta para no romper a quien lo mande, pero el
            servidor lo ignora y ya no lo guarda.
        vista:
          oneOf:
            - $ref: '#/components/schemas/VistaDelChat'
            - type: 'null'
          description: |
            1.3.0. Seccion donde esta el jugador al escribir, para la
            respuesta contextual (7.4.3). Opcional; sin ella se responde
            igual que en 1.2.0.

    Mensaje:
      type: object
      required: [id, remitente, contenido, fechaEnvio]
      properties:
        id:
          type: string
          format: uuid
        remitente:
          type: string
          enum: [USUARIO, BOT]
        contenido:
          type: string
        adjuntoUrl:
          type: [string, 'null']
          deprecated: true
          description: Obsoleto desde 1.3.0. Solo lo traen mensajes guardados antes; los nuevos, null.
        fechaEnvio:
          type: string
          format: date-time
        enriquecido:
          oneOf:
            - $ref: '#/components/schemas/RespuestaEnriquecida'
            - type: 'null'
          description: |
            1.3.0. Solo en mensajes del BOT. null en los del usuario y en los
            guardados antes de 1.3.0. El texto de `contenido` sigue siendo la
            respuesta completa: quien no sepa pintar esto no pierde nada.

    VistaDelChat:
      type: string
      description: 1.3.0. Seccion del sitio donde esta el jugador.
      enum: [INICIO, INVENTARIO, MISIONES, TORNEOS, SUBASTAS, CUENTA]

    RespuestaEnriquecida:
      type: object
      description: |
        1.3.0. Partes de la respuesta que la ventana pinta como elementos
        interactivos (7.4.3, 7.4.6). Sin imagenes (decision del cliente).
        Todas las listas pueden venir vacias.
      required: [pasos, enlaces, tarjetas, respuestasRapidas, ofrecerSoporteHumano]
      properties:
        pasos:
          type: array
          maxItems: 20
          description: Instrucciones en orden, para las respuestas paso a paso.
          items:
            type: string
            maxLength: 500
        enlaces:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/EnlaceInterno'
        tarjetas:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/TarjetaInformativa'
        respuestasRapidas:
          type: array
          maxItems: 6
          description: Botones; al pulsar uno, la ventana envia su texto como la siguiente pregunta.
          items:
            type: string
            minLength: 1
            maxLength: 200
        ofrecerSoporteHumano:
          type: boolean
          description: true cuando conviene ofrecer abrir un ticket (escalamiento).

    EnlaceInterno:
      type: object
      description: |
        1.3.0. Enlace a una seccion del propio sitio. `destino` es el
        identificador de la vista en la matriz de acceso del frontend
        (`comun/matriz-acceso.js`), nunca una URL: asi el chatbot no puede
        mandar a nadie fuera del sitio. Desde 1.5.0 `texto` lleva la
        etiqueta que la vista tiene en la barra («Ir a Mi inventario»; en
        ingles «Go to Mi inventario») y `destino` es siempre una vista de
        jugador o publica. Desde 1.8.0 puede traer `ancla`.
      required: [texto, destino]
      properties:
        texto:
          type: string
          maxLength: 80
        destino:
          type: string
          pattern: '^[a-z0-9-]{1,40}$'
          example: inventario
        ancla:
          type: [string, 'null']
          pattern: '^[a-z0-9-]{1,60}$'
          description: |
            1.8.0. Fragmento dentro de la vista de `destino` (sin `#`), p. ej.
            `categoria-cuenta-y-registro` en el centro de ayuda. Sin valor, o
            ausente, el enlace va al principio de la vista.
          example: categoria-subasta-y-comercio

    TarjetaInformativa:
      type: object
      description: 1.3.0. Bloque de texto con titulo y, opcionalmente, un enlace interno.
      required: [titulo, texto]
      properties:
        titulo:
          type: string
          maxLength: 120
        texto:
          type: string
          maxLength: 1000
        enlace:
          oneOf:
            - $ref: '#/components/schemas/EnlaceInterno'
            - type: 'null'

    SugerenciaDePregunta:
      type: object
      description: 1.3.0. Una pregunta que la version en produccion sabe responder.
      required: [clave, titulo, categoria, pregunta]
      properties:
        clave:
          type: string
          description: Clave estable del tema.
        titulo:
          type: string
        categoria:
          $ref: '#/components/schemas/Categoria'
        pregunta:
          type: string
          description: |
            Texto listo para enviar como pregunta: el titulo del tema. El chat
            reconoce un titulo tal cual (sin importar tildes ni mayusculas)
            como pregunta de ese tema (1.3.3).

    PreferenciasDelChat:
      type: object
      description: |
        1.3.6 (7.4.5). Como responde el chatbot a esta sesion.
      required: [ idioma, nivelDetalle ]
      properties:
        idioma:
          type: string
          enum: [ AUTOMATICO, ES, EN ]
          description: |
            `AUTOMATICO`: el idioma de la pregunta (como antes de 1.3.6).
            `ES`: siempre en espanol. `EN`: en ingles cuando el tema tiene
            respuesta en ingles; si no, en espanol.
        nivelDetalle:
          type: string
          enum: [ BREVE, NORMAL, DETALLADO ]
          description: |
            `BREVE`: solo la primera oracion (los temas paso a paso conservan
            sus pasos). `NORMAL`: la respuesta completa. `DETALLADO`: la
            respuesta completa y, al final, los temas relacionados.

    EstadoDeTicket:
      type: string
      description: 1.3.0.
      enum: [ABIERTO, EN_PROCESO, RESUELTO, CERRADO]

    AbrirTicket:
      type: object
      description: 1.3.0.
      required: [categoria, asunto, mensaje]
      properties:
        categoria:
          $ref: '#/components/schemas/Categoria'
        asunto:
          type: string
          minLength: 1
          maxLength: 150
        mensaje:
          type: string
          minLength: 1
          maxLength: 2000

    AbrirTicketDesdeConversacion:
      type: object
      description: |
        1.8.0. Todo opcional: el ticket sale de la conversacion de quien
        llama. Un cuerpo vacio (o ninguno) vale.
      properties:
        vista:
          oneOf:
            - $ref: '#/components/schemas/VistaDelChat'
            - type: 'null'
          description: |
            Donde esta el jugador. Decide la categoria solo si la pregunta no
            tuvo tema que la respondiera.
        comentario:
          type: [string, 'null']
          maxLength: 2000
          description: |
            Lo que el jugador quiera agregar. Pasa por la misma revision y
            lista negra que el resto del ticket; vacio o solo espacios es sin
            comentario.

    CentroDeAyuda:
      type: object
      description: 1.8.0. Lo que el chatbot sabe responder, agrupado por categoria.
      required: [categorias]
      properties:
        categorias:
          type: array
          items:
            $ref: '#/components/schemas/CategoriaDeAyuda'

    CategoriaDeAyuda:
      type: object
      description: 1.8.0.
      required: [categoria, ancla, temas]
      properties:
        categoria:
          $ref: '#/components/schemas/Categoria'
        ancla:
          type: string
          pattern: '^[a-z0-9-]{1,60}$'
          description: |
            Fragmento de esta categoria en la pagina del centro de ayuda
            (`categoria-` y el valor en minusculas con guiones). Es el mismo
            que trae `EnlaceInterno.ancla`.
          example: categoria-cuenta-y-registro
        temas:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TemaDeAyuda'

    TemaDeAyuda:
      type: object
      description: 1.8.0. Un tema publicado, como lo lee un jugador.
      required: [titulo, respuestaEs, respuestaEn, pasosEs, pasosEn]
      properties:
        titulo:
          type: string
          maxLength: 150
        respuestaEs:
          type: string
        respuestaEn:
          type: [string, 'null']
          description: null si el tema no tiene respuesta en ingles.
        pasosEs:
          type: array
          maxItems: 20
          description: |
            Los pasos «1) … 2) …» de la respuesta en espanol, si el tema es
            paso a paso (como en `RespuestaEnriquecida.pasos`); vacia si no.
          items:
            type: string
            maxLength: 500
        pasosEn:
          type: array
          maxItems: 20
          description: Los de la respuesta en ingles; vacia si no hay o no es paso a paso.
          items:
            type: string
            maxLength: 500

    TicketDeSoporte:
      type: object
      description: 1.3.0. Lo que ve el jugador de su ticket.
      required: [ticketId, categoria, asunto, mensaje, estado, creadoEn, actualizadoEn]
      properties:
        ticketId:
          type: string
          format: uuid
        categoria:
          $ref: '#/components/schemas/Categoria'
        asunto:
          type: string
        mensaje:
          type: string
          description: Ya redactado (sin contrasenas, tarjetas ni tokens).
        estado:
          $ref: '#/components/schemas/EstadoDeTicket'
        respuesta:
          type: [string, 'null']
          description: La respuesta de soporte, cuando la hay.
        creadoEn:
          type: string
          format: date-time
        actualizadoEn:
          type: string
          format: date-time

    TicketDeSoporteAdmin:
      description: 1.3.0. El ticket como lo ve el administrador.
      allOf:
        - $ref: '#/components/schemas/TicketDeSoporte'
        - type: object
          required: [uid, contexto]
          properties:
            uid:
              type: string
              description: Jugador que lo abrio (claim `uid` de su token). Sin email, nombre ni telefono.
            asignadoA:
              type: [string, 'null']
              description: '`uid` del administrador que lo atiende.'
            contexto:
              type: array
              maxItems: 20
              description: Ultimos mensajes de la conversacion al abrir el ticket, ya redactados.
              items:
                $ref: '#/components/schemas/MensajeDeContexto'

    MensajeDeContexto:
      type: object
      description: 1.3.0.
      required: [remitente, contenido, fechaEnvio]
      properties:
        remitente:
          type: string
          enum: [USUARIO, BOT]
        contenido:
          type: string
        fechaEnvio:
          type: string
          format: date-time

    AtenderTicket:
      type: object
      description: 1.3.0. Todos opcionales; solo cambia lo que viene. Al menos uno.
      minProperties: 1
      properties:
        estado:
          $ref: '#/components/schemas/EstadoDeTicket'
        asignadoA:
          type: [string, 'null']
          maxLength: 64
          description: '`uid` de un administrador; null lo desasigna.'
        respuesta:
          type: [string, 'null']
          maxLength: 2000

    PaginaDeTickets:
      type: object
      description: 1.3.0.
      required: [contenido, pagina, tamano, totalElementos]
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/TicketDeSoporte'
        pagina:
          type: integer
        tamano:
          type: integer
        totalElementos:
          type: integer
          format: int64

    CalificarRespuesta:
      type: object
      required: [util]
      properties:
        util:
          type: boolean
          description: Obligatorio. Un cuerpo sin este campo responde 400, nunca se asume "no util".
        comentario:
          type: [string, 'null']
          maxLength: 1000
          description: Comentario libre opcional. Vacio o solo espacios se guarda como sin comentario.

    Calificacion:
      type: object
      required: [id, mensajeId, util, fechaCalificacion]
      properties:
        id:
          type: string
          format: uuid
        mensajeId:
          type: string
          format: uuid
        util:
          type: boolean
        comentario:
          type: [string, 'null']
        fechaCalificacion:
          type: string
          format: date-time

    ProblemDetail:
      type: object
      description: Formato estandar de error (RFC 9457, regla 4 de plataforma).
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        motivo:
          type: string
          enum: [LIMITE_DE_FRECUENCIA, CONTENIDO_BLOQUEADO, MODERACION_NO_DISPONIBLE,
                 SESION_REQUERIDA, TICKET_ABIERTO, TRANSICION_NO_PERMITIDA,
                 OTRO_TICKET_ABIERTO, INYECCION_DETECTADA,
                 TEMA_DUPLICADO, IMPORTACION_DEMASIADO_GRANDE, CAMBIO_CONCURRENTE,
                 SIN_CONVERSACION]
          description: |
            1.2.0. Solo en los errores nuevos de /chat/**. 1.3.0 agrega los de
            los tickets: SESION_REQUERIDA, TICKET_ABIERTO y
            TRANSICION_NO_PERMITIDA. 1.3.9: OTRO_TICKET_ABIERTO. 1.4.0:
            INYECCION_DETECTADA. (1.5.0 completa esta lista, que no los
            nombraba aunque las respuestas ya los traian.) 1.6.0 agrega los del
            panel de la base de conocimiento: TEMA_DUPLICADO (409),
            IMPORTACION_DEMASIADO_GRANDE (413) y CAMBIO_CONCURRENTE (409).
            1.8.0: SIN_CONVERSACION (409), una solicitud desde una
            conversacion sin preguntas.

    SesionAnonima:
      type: object
      description: 1.2.0. Sesion de visitante emitida por el servidor.
      required: [idSesionAnonima, expiraEn]
      properties:
        idSesionAnonima:
          type: string
          pattern: '^anon_[A-Za-z0-9_-]{43}$'
        expiraEn:
          type: string
          format: date-time
          description: Vence si no se usa hasta entonces; cada mensaje la renueva.

    # ---------------------------------------------------------------------
    # Panel administrativo (HU-CHA-012)
    # ---------------------------------------------------------------------

    AnaliticaChatbot:
      type: object
      description: |
        Tablero de un periodo. 1.7.0: cada cifra dice en su campo que cuenta
        y desde cuando se mide.
      required: [desde, hasta, zonaHoraria, conversaciones, preguntas, respuestasMedidas, escalamientos,
                 calificaciones, calificacionesUtiles, temasFrecuentes, tendencia]
      properties:
        desde:
          type: string
          format: date-time
          description: Inicio del periodo (medianoche de `desde` en `zonaHoraria`), inclusive.
        hasta:
          type: string
          format: date-time
          description: Fin del periodo (medianoche del dia siguiente a `hasta`), exclusivo.
        zonaHoraria:
          type: string
          example: America/Bogota
        conversaciones:
          type: integer
          format: int64
          description: |
            7.4.7 «conversaciones iniciadas por periodo». Desde 1.7.0, las
            conversaciones cuyo inicio (`fecha_inicio`, su primer mensaje)
            cae en [desde, hasta). Un jugador tiene una sola conversacion,
            por su `uid`, que empieza la primera vez que escribe; un
            visitante, una por sesion. Borrar el historial no la cambia: la
            fila de la conversacion queda (1.4.0), asi que el pasado no se
            mueve. Hasta 1.6.0 contaba las conversaciones con alguna pregunta
            en el periodo, que ahora es `conversacionesConActividad`.
        conversacionesConActividad:
          type: integer
          format: int64
          description: |
            1.7.0. Conversaciones distintas con al menos una pregunta
            guardada en el periodo (lo que contaba `conversaciones` hasta
            1.6.0). Baja si alguien borra despues su historial.
        preguntas:
          type: integer
          format: int64
          description: Mensajes del usuario guardados en el periodo. Baja si alguien borra despues su historial.
        respuestasMedidas:
          type: integer
          format: int64
          description: Respuestas del bot del periodo con tiempo y escalamiento medidos (desde V4).
        escalamientos:
          type: integer
          format: int64
          description: |
            7.4.7 «consultas que requirieron escalamiento». Respuestas del
            bot del periodo que OFRECIERON soporte humano: no entendio la
            pregunta (ESCALADO) o el jugador dijo que la respuesta no le
            sirvio (NO_SIRVIO). Es lo que hizo el asistente, no lo que hizo
            el jugador: las solicitudes de soporte que de verdad se abrieron
            son `tickets.total`. Desde V4.
        respuestasClasificadas:
          type: integer
          format: int64
          description: |
            1.7.0. Respuestas del bot del periodo con `resultado` guardado
            (las generadas desde la migracion V13).
        respuestasResueltas:
          type: integer
          format: int64
          description: |
            1.7.0. De las clasificadas, las resueltas sin intervencion
            humana: resultado TEMA, CONSULTA_EN_VIVO o NAVEGACION (ver
            `ResultadoDeRespuesta`).
        tasaResolucion:
          type: [number, 'null']
          minimum: 0
          maximum: 1
          description: |
            7.4.7 «tasa de resolucion (consultas resueltas sin intervencion
            humana)». Desde 1.7.0, `respuestasResueltas /
            respuestasClasificadas`; null si no hay clasificadas. No
            resuelven ESCALADO, NO_SIRVIO, NO_DISPONIBLE ni PIDE_REFORMULAR.
            Las respuestas anteriores a V13 no tienen resultado y no
            cuentan, ni a favor ni en contra. Hasta 1.6.0 era la proporcion
            de respuestas no escaladas, y una consulta en vivo que decia «no
            disponible» contaba como resuelta.
        resultados:
          type: array
          description: |
            1.7.0. Cuantas respuestas clasificadas del periodo hubo de cada
            resultado, en el orden de `ResultadoDeRespuesta`; los que no
            ocurrieron vienen con 0. Suman `respuestasClasificadas`.
          items:
            type: object
            required: [resultado, respuestas]
            properties:
              resultado:
                $ref: '#/components/schemas/ResultadoDeRespuesta'
              respuestas:
                type: integer
                format: int64
        tiempoRespuestaPromedioMs:
          type: [number, 'null']
          description: |
            7.4.7 «tiempo promedio de respuesta». Promedio de lo que tardo
            el servidor en generar cada respuesta medida del periodo: desde
            que la pregunta, ya revisada (1.4.0) y aprobada por la lista
            negra, empieza a procesarse hasta que la respuesta esta lista
            para guardarse. Incluye el motor de reglas, las consultas en
            vivo a otros servicios y, si no la entendio, anotar la pregunta
            sin respuesta; no incluye la lista negra, el guardado de la
            conversacion ni la red hasta el navegador. null sin respuestas
            medidas.
        calificaciones:
          type: integer
          format: int64
          description: Calificaciones hechas en el periodo.
        calificacionesUtiles:
          type: integer
          format: int64
        satisfaccion:
          type: [number, 'null']
          minimum: 0
          maximum: 1
          description: '`calificacionesUtiles / calificaciones`; null sin calificaciones.'
        temasFrecuentes:
          type: array
          maxItems: 10
          description: Los 10 temas de la base que mas respuestas dieron en el periodo, por su clave estable.
          items:
            type: object
            required: [clave, titulo, respuestas]
            properties:
              clave:
                type: string
              titulo:
                type: string
              respuestas:
                type: integer
                format: int64
        preguntasFrecuentes:
          type: array
          maxItems: 10
          description: |
            1.7.0 (7.4.7 «preguntas mas frecuentes»). Las preguntas mas
            repetidas del periodo, de las ultimas 5000 (como las palabras
            clave): el texto como lo lee el motor (`NormalizadorTexto`: sin
            tildes, mayusculas ni signos) del mensaje ya redactado (1.4.0),
            recortado a 200 caracteres. Para no mostrar el texto de una
            persona, solo salen las que hicieron al menos 3 conversaciones
            distintas (D-CHA-06, convencion tecnica provisional). Hasta 10,
            la mas repetida primero; a igual numero, la de mas
            conversaciones.
          items:
            type: object
            required: [texto, preguntas, conversaciones]
            properties:
              texto:
                type: string
                maxLength: 200
              preguntas:
                type: integer
                format: int64
                description: Veces que se pregunto asi en el periodo.
              conversaciones:
                type: integer
                format: int64
                description: Conversaciones distintas que la preguntaron (3 o mas).
        tendencia:
          type: array
          description: |
            Un punto por cada dia del periodo, tambien los que no tuvieron
            actividad. Desde 1.7.0 `conversaciones` son las iniciadas ese
            dia (hasta 1.6.0, las que tuvieron preguntas ese dia);
            `respuestas` son las medidas.
          items:
            type: object
            required: [dia, conversaciones, preguntas, respuestas, escalamientos]
            properties:
              dia:
                type: string
                format: date
              conversaciones:
                type: integer
                format: int64
              preguntas:
                type: integer
                format: int64
              respuestas:
                type: integer
                format: int64
              escalamientos:
                type: integer
                format: int64
        tickets:
          type: object
          description: |
            1.3.7 (7.4.7). Solicitudes de soporte abiertas en el periodo.
            Siempre viene; sin solicitudes, todo en 0. `total` es lo que de
            verdad llego a una persona del equipo; no confundir con
            `escalamientos`, que es cuando el asistente lo ofrecio.
          required: [total, abiertos, enProceso, resueltos, cerrados, porCategoria]
          properties:
            total:
              type: integer
              format: int64
            abiertos:
              type: integer
              format: int64
              description: Sin atender todavia.
            enProceso:
              type: integer
              format: int64
            resueltos:
              type: integer
              format: int64
            cerrados:
              type: integer
              format: int64
            horasPromedioDeAtencion:
              type: [number, 'null']
              minimum: 0
              description: |
                Horas promedio entre que se abre una solicitud y su ultima
                actualizacion, solo de las respondidas o cerradas. null si
                no hay ninguna ("sin datos" no es 0 horas).
            porCategoria:
              type: array
              description: La categoria con mas solicitudes primero.
              items:
                type: object
                required: [categoria, tickets]
                properties:
                  categoria:
                    $ref: '#/components/schemas/Categoria'
                  tickets:
                    type: integer
                    format: int64
        palabrasClave:
          type: array
          maxItems: 15
          description: |
            1.3.7 (7.4.7). Las palabras mas usadas en las preguntas del
            periodo (de las ultimas 5000), sin tildes ni mayusculas, la mas
            usada primero. Para no exponer datos de una persona (7.4.8), solo
            salen palabras de 4 o mas letras, sin digitos, usadas en al menos
            2 conversaciones distintas. Desde 1.7.0 cada una trae su
            tendencia contra el periodo anterior de la misma duracion
            ([desde - duracion, desde), tambien de sus ultimas 5000
            preguntas).
          items:
            type: object
            required: [palabra, preguntas, conversaciones]
            properties:
              palabra:
                type: string
              preguntas:
                type: integer
                format: int64
                description: Preguntas que la contienen.
              conversaciones:
                type: integer
                format: int64
              preguntasPeriodoAnterior:
                type: integer
                format: int64
                description: 1.7.0. Preguntas que la contenian en el periodo anterior de la misma duracion.
              tendencia:
                type: string
                enum: [SUBE, BAJA, IGUAL, NUEVA]
                description: |
                  1.7.0. NUEVA si en el periodo anterior no aparecio; si no,
                  SUBE, BAJA o IGUAL comparando `preguntas` con
                  `preguntasPeriodoAnterior`.

    ResultadoDeRespuesta:
      type: string
      description: |
        1.7.0 (V13). Como termino una respuesta del bot; lo decide el motor
        que la genero y se guarda con ella.

        * TEMA: la respondio un tema de la base (tambien «mas detalle», «en
          ingles» o «repitelo» sobre el tema anterior). Resuelve.
        * CONSULTA_EN_VIVO: una consulta en vivo que trajo datos: sobre la
          propia cuenta (inventario y su busqueda, subastas, notificaciones,
          movimientos, misiones, torneos; el informe de actividad con al
          menos una parte) o, desde 1.10.0, sobre el catalogo publico.
          Resuelve, aunque los datos digan «no tienes ninguno».
        * NAVEGACION: llevo al jugador a la seccion que pidio. Resuelve.
        * NO_DISPONIBLE: la consulta en vivo no respondio (o ninguna parte
          del informe, o el catalogo para un listado). No resuelve.
        * ESCALADO: el motor no entendio la pregunta y ofrecio soporte
          humano. No resuelve.
        * NO_SIRVIO: el jugador dijo que la respuesta anterior no le sirvio
          y se le ofrecio soporte humano. No resuelve.
        * PIDE_REFORMULAR: el bot pidio la pregunta completa (un seguimiento
          sin tema anterior) o un criterio de busqueda mas largo. No
          resuelve.
      enum: [TEMA, CONSULTA_EN_VIVO, NAVEGACION, NO_DISPONIBLE, ESCALADO, NO_SIRVIO, PIDE_REFORMULAR]

    EstadoDeBrecha:
      type: string
      description: |
        1.7.0 (V13). PENDIENTE = nadie la ha atendido (o volvio a
        preguntarse despues de atenderla); ATENDIDA = un tema de la base ya
        la cubre; DESCARTADA = ruido.
      enum: [PENDIENTE, ATENDIDA, DESCARTADA]

    BrechaDeConocimiento:
      type: object
      description: 1.7.0. Una pregunta sin respuesta, agregada por su texto normalizado.
      required: [brechaId, pregunta, escalamientos, noUtiles, total, primeraVez, ultimaVez, estado, reaperturas]
      properties:
        brechaId:
          type: string
          format: uuid
        pregunta:
          type: string
          description: La primera forma en que alguien la pregunto, ya redactada (sin contrasenas, tarjetas ni tokens).
        escalamientos:
          type: integer
          description: Veces que el asistente no la entendio y ofrecio soporte humano.
        noUtiles:
          type: integer
          description: Veces que la respuesta a esta pregunta se califico «no util».
        total:
          type: integer
          description: '`escalamientos + noUtiles`: lo que ordena el listado.'
        primeraVez:
          type: string
          format: date-time
        ultimaVez:
          type: string
          format: date-time
        estado:
          $ref: '#/components/schemas/EstadoDeBrecha'
        estadoCambiadoPor:
          type: [string, 'null']
          description: '`uid` del administrador que le puso el estado; null si nadie lo cambio o si volvio sola a PENDIENTE.'
        estadoCambiadoEn:
          type: [string, 'null']
          format: date-time
        reaperturas:
          type: integer
          description: Veces que volvio sola a PENDIENTE porque se pregunto otra vez despues de marcarla ATENDIDA.

    PaginaDeBrechas:
      type: object
      description: 1.7.0.
      required: [contenido, pagina, tamano, totalElementos]
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/BrechaDeConocimiento'
        pagina:
          type: integer
        tamano:
          type: integer
        totalElementos:
          type: integer
          format: int64

    CambiarEstadoDeBrecha:
      type: object
      description: 1.7.0.
      required: [estado]
      properties:
        estado:
          $ref: '#/components/schemas/EstadoDeBrecha'

    VersionBaseConocimiento:
      type: object
      required: [id, numero, estado, fechaCreacion]
      properties:
        id:
          type: string
          format: uuid
        numero:
          type: integer
        estado:
          $ref: '#/components/schemas/EstadoVersion'
        descripcion:
          type: [string, 'null']
        fechaCreacion:
          type: string
          format: date-time
        fechaDespliegue:
          type: [string, 'null']
          format: date-time
          description: Ultima vez que la version entro a produccion (al desplegarse o al restaurarse).

        despliegueProgramadoEn:
          type: [string, 'null']
          format: date-time
          description: 1.3.8. Cuando se publicara sola la candidata; null si no esta programada.
        programacionRechazadaEn:
          type: [string, 'null']
          format: date-time
          description: |
            1.3.8. Cuando se intento publicar la candidata programada y no
            paso la evaluacion (o faltaban casos o produccion); null si no
            ocurrio o si se volvio a programar.

    ProgramarDespliegue:
      type: object
      description: 1.3.8. Cuando publicar la candidata.
      required: [desplegarEn]
      properties:
        desplegarEn:
          type: string
          format: date-time
          description: Entre un minuto y 90 dias desde ahora.

    EstadoVersion:
      type: string
      enum: [BORRADOR, PRODUCCION, RETIRADA]
      description: |
        BORRADOR = candidata en edicion; PRODUCCION = la que responde a los
        jugadores; RETIRADA = estuvo en produccion y se puede restaurar.

    CrearCandidata:
      type: object
      properties:
        descripcion:
          type: [string, 'null']
          maxLength: 500

    Categoria:
      type: string
      description: La "intencion" que atiende el tema.
      enum: [PRODUCTO, MECANICA_JUEGO, MODALIDAD_JUEGO, CUENTA_Y_REGISTRO, SUBASTA_Y_COMERCIO,
             SOPORTE_TECNICO, POLITICAS_Y_TERMINOS, FAQ_GENERAL]

    TipoRespuesta:
      type: string
      enum: [DIRECTA, PASO_A_PASO, SUGERENCIA_PROACTIVA, CONTEXTUAL]

    Variantes:
      type: array
      description: |
        Frases con las que un usuario haria la pregunta. Ninguna puede
        contener `,` (400): el motor las guarda separadas por coma. Desde
        1.6.0 las repetidas (sin contar tildes, mayusculas ni signos) se
        guardan una sola vez, sin error.
      items:
        type: string
        minLength: 1
        maxLength: 200

    DatosDeTema:
      type: object
      required: [categoria, tipoRespuesta, titulo, variantesEs, respuestaEs]
      properties:
        categoria:
          $ref: '#/components/schemas/Categoria'
        intencionesAdicionales:
          type: [array, 'null']
          maxItems: 5
          uniqueItems: true
          default: []
          items:
            $ref: '#/components/schemas/Categoria'
          description: |
            1.6.0 (7.4.10 «asociar respuestas con multiples intenciones»):
            otras intenciones que atiende la misma respuesta, ademas de
            `categoria`. Hasta 5, sin repetir y nunca la propia `categoria`
            (400). Sin valor = ninguna. El chatbot las cuenta al desempatar
            por la seccion del jugador, en las preguntas relacionadas y en
            las sugerencias por categoria; las analiticas siguen contando la
            `categoria`.
          example: [CUENTA_Y_REGISTRO, PRODUCTO]
        tipoRespuesta:
          $ref: '#/components/schemas/TipoRespuesta'
        titulo:
          type: string
          minLength: 1
          maxLength: 150
          description: |
            Desde 1.6.0, unico en la version: el mismo que el de otro tema,
            sin contar tildes, mayusculas ni signos, es 409 TEMA_DUPLICADO.
        variantesEs:
          allOf:
            - $ref: '#/components/schemas/Variantes'
          minItems: 1
        variantesEn:
          $ref: '#/components/schemas/Variantes'
        respuestaEs:
          type: string
          minLength: 1
          maxLength: 4000
        respuestaEn:
          type: [string, 'null']
          maxLength: 4000
        prioridad:
          type: integer
          minimum: 0
          default: 0
          description: Desempate cuando dos temas coinciden con el mismo puntaje; gana el mayor.
        activo:
          type: [boolean, 'null']
          default: true
          description: Sin valor se toma como `true`.

    Tema:
      allOf:
        - $ref: '#/components/schemas/DatosDeTema'
        - type: object
          required: [id, clave, prioridad, activo, intencionesAdicionales]
          properties:
            id:
              type: string
              format: uuid
            clave:
              type: string
              description: Identifica al mismo tema en todas las versiones; no cambia al editarlo.
            activo:
              type: boolean
            intencionesAdicionales:
              type: array
              items:
                $ref: '#/components/schemas/Categoria'
              description: 1.6.0. Siempre viene, en el orden del enum; vacia si el tema no tiene.

    TemaIntercambio:
      description: |
        Desde 1.6.0 la exportacion trae siempre `intencionesAdicionales`
        (vacia si no tiene); un archivo anterior, sin el campo, se importa
        igual (sin intenciones).
      allOf:
        - $ref: '#/components/schemas/DatosDeTema'
        - type: object
          properties:
            clave:
              type: [string, 'null']
              maxLength: 80
              description: Siempre viene al exportar; opcional al importar (sin clave, el tema es nuevo).

    ExportacionBaseConocimiento:
      type: object
      required: [version, estado, fechaExportacion, temas]
      properties:
        version:
          type: integer
        estado:
          $ref: '#/components/schemas/EstadoVersion'
        fechaExportacion:
          type: string
          format: date-time
        temas:
          type: array
          items:
            $ref: '#/components/schemas/TemaIntercambio'

    ImportacionBaseConocimiento:
      type: object
      required: [temas]
      description: |
        Mismo formato que `ExportacionBaseConocimiento`; los demas campos se
        ignoran. Desde 1.6.0, como mucho 500 temas y 8 MB en total (413
        IMPORTACION_DEMASIADO_GRANDE).
      properties:
        temas:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/TemaIntercambio'

    DatosDeCasoEvaluacion:
      type: object
      required: [pregunta]
      properties:
        pregunta:
          type: string
          minLength: 1
          maxLength: 1000
        temaClaveEsperada:
          type: [string, 'null']
          maxLength: 80
          description: |
            `clave` del tema que deberia responder. Vacia o sin valor = el
            chatbot deberia ESCALAR esa pregunta. Una clave que no existe en
            ningun tema responde 400.
        activo:
          type: [boolean, 'null']
          default: true

    CasoEvaluacion:
      type: object
      required: [id, pregunta, activo, fechaCreacion]
      properties:
        id:
          type: string
          format: uuid
        pregunta:
          type: string
        temaClaveEsperada:
          type: [string, 'null']
        activo:
          type: boolean
        fechaCreacion:
          type: string
          format: date-time

    ResultadoEvaluacion:
      type: object
      required: [versionId, numero, casosEvaluados, aciertos, fallos]
      properties:
        versionId:
          type: string
          format: uuid
        numero:
          type: integer
        casosEvaluados:
          type: integer
        aciertos:
          type: integer
        tasaAcierto:
          type: [number, 'null']
          minimum: 0
          maximum: 1
        fallos:
          type: array
          items:
            type: object
            required: [casoId, pregunta]
            properties:
              casoId:
                type: string
                format: uuid
              pregunta:
                type: string
              temaClaveEsperada:
                type: [string, 'null']
                description: Sin valor = se esperaba que escalara.
              temaClaveObtenido:
                type: [string, 'null']
                description: Sin valor = el chatbot escalo.

    ComparacionEvaluacion:
      type: object
      required: [candidata, produccion, candidataApta]
      properties:
        candidata:
          $ref: '#/components/schemas/ResultadoEvaluacion'
        produccion:
          $ref: '#/components/schemas/ResultadoEvaluacion'
        candidataApta:
          type: boolean
          description: true si la candidata acierta al menos tantos casos como produccion.

    DespliegueRechazado:
      allOf:
        - $ref: '#/components/schemas/ProblemDetail'
        - type: object
          required: [candidata, produccion]
          properties:
            candidata:
              $ref: '#/components/schemas/ResultadoEvaluacion'
            produccion:
              $ref: '#/components/schemas/ResultadoEvaluacion'
