openapi: 3.1.0

# =============================================================================
# Nexus Battles VI — Perfil del jugador (ms-identidad · equipo de Cuentas)
#
# Regla 1 de plataforma: contrato primero. Estas dos rutas llevaban semanas en
# produccion SIN contrato publicado —`ms-identidad-auth.yaml` cubre solo
# `/api/v1/auth` y lo dice en su nota de alcance—, y esa ausencia es
# exactamente lo que dejo pasar el defecto que este documento cierra:
#
#   * `cuenta.js` pide el perfil por el `uid` del token (un UUID);
#   * el controlador declaraba el segmento como `Long usuarioId`, el id
#     autonumerico de la tabla, que el navegador no conoce en ningun sitio.
#
# Spring no podia convertir un UUID a Long y la peticion moria con un 4xx
# antes de llegar al controlador. La pantalla «Mi cuenta» mostraba «No
# pudimos cargar tu perfil» a TODOS los jugadores (R16, 24-sep-2026). Con un
# contrato que dijera de que tipo es `{usuario}`, el desacuerdo entre los dos
# lados se habria visto en la revision y no en AWS.
#
# Se escribe a partir de `PerfilController`, `PerfilUsuarioResponse`,
# `ActualizarPerfilRequest` y `SecurityInterceptor`. Queda pendiente de
# validacion por el dueno del modulo antes de tratarlo como acordado.
# =============================================================================

info:
  title: Nexus Battles VI — Perfil del jugador (ms-identidad)
  version: 1.4.0
  description: |
    Consulta y edicion del perfil propio (HU-USR-001), y desde 1.4.0 el
    cierre de la propia cuenta (derecho al olvido, HU-PRV-005).

    **1.4.0 (RFINAL-05, HU-PRV-004 y HU-PRV-005, 7.3.6):** dos cambios
    aditivos.

    * `GET` y `PUT /api/v1/perfiles/{usuario}` devuelven tambien `email`, el
      correo con el que la persona entra. Solo lo recibe el dueno del perfil
      (es la unica persona a la que estas rutas responden). Lo necesita el
      portal de privacidad de «Mi cuenta» (RF-PRV-004: consultar los datos
      personales que el sistema guarda) y lo usa el Resumen, que ya lo
      mostraba si llegaba.
    * `GET | POST | DELETE /api/v1/perfiles/{usuario}/cierre`: consultar,
      solicitar y cancelar el cierre de la propia cuenta (RF-PRV-005,
      RN-USR-011). Solicitar exige la contrasena actual (verificacion de
      identidad; un fallo cuenta como intento fallido de la cuenta,
      RF-AUT-009) y programa la eliminacion a **30 dias**; hasta entonces se
      puede cancelar. Se rechaza, sin cambiar nada, si la persona tiene
      subastas activas como vendedora o pujas vigentes (ms-subastas, con su
      propio token). Al vencer el plazo, una tarea programada de este
      servicio anonimiza la cuenta (ver `POST`) y conserva lo que la ley
      obliga a conservar.

    **1.3.0 (RFINAL-03):** el `400` de `PUT /api/v1/perfiles/{usuario}` es
    un problem details discriminable (`apodo-no-permitido`, `apodo-en-uso`,
    `perfil-invalido`) para quien lo pide con `Accept:
    application/problem+json`; el texto plano se conserva para el resto.
    La unicidad del apodo nuevo deja de distinguir mayusculas, como el
    registro. Y la sesion sigue valida tras cambiar de apodo: el interceptor
    busca al titular por el `uid` del token, no por el `sub` viejo. Aditivo.

    **1.2.1 (B6):** implementada `GET /api/v1/perfiles/publicos` (sin
    cambios de forma): prefijo del apodo sin distinguir mayusculas, `%` y `_`
    literales, solo cuentas `ACTIVO`, orden por apodo, tope de 10, permiso
    `MODIFICAR_PERFIL_PROPIO` (los cuatro roles) e indice en V4.

    **1.2.0 (B2, BACKEND-02):** `PUT /api/v1/perfiles/{usuario}` puede
    responder `503 moderacion-no-disponible` (con `Retry-After`): la lista
    negra del apodo es fail-closed y, si moderacion-sanciones no responde, el
    apodo nuevo no se da por bueno (antes se aceptaba cualquiera). Aditivo.

    **1.1.0 (B0/B6):** `GET /api/v1/perfiles/publicos?apodo=` — busqueda de
    jugadores por apodo para escribirles un mensaje privado (feedback del
    profesor). Devuelve solo datos publicos (uid, apodo, avatar), nunca
    correo ni nombres.

    El servicio escucha en el puerto 8089 y **no tiene context-path**: las
    rutas son absolutas e incluyen el `/api/v1` (regla 2), igual que en
    `ms-identidad-auth.yaml`.

    ### Que identificador va en la ruta

    **El `uid` del token**, el UUID publico que ADR-002 pone en el claim
    `uid` y que el frontend guarda en su sesion. Es el unico identificador de
    una persona que conoce el navegador.

    Se sigue aceptando el id numerico interno por compatibilidad, pero
    **ningun consumidor debe depender de el**: es la clave primaria de una
    tabla y no sale en ningun token ni respuesta publica.

    ### Quien puede leer un perfil

    Solo su dueno. Se compara el `uid` del token con el del perfil; el apodo
    (`sub`) queda como respaldo para tokens emitidos antes de que existiera
    el `uid`. Comparar solo por apodo fallaba justo despues de que el
    jugador cambiara de apodo desde este mismo formulario: su token seguia
    diciendo el apodo viejo y la siguiente lectura daba 403.

servers:
  - url: http://localhost:8089
    description: Desarrollo local (sin context-path; el /api/v1 va en la ruta)
  - url: http://srv-ms-identidad:8089
    description: Red de compose

tags:
  - name: perfil
    description: Perfil propio del jugador (HU-USR-001)
  - name: privacidad
    description: Cierre de la propia cuenta — derecho al olvido (HU-PRV-005, 7.3.6)

paths:
  /api/v1/perfiles/{usuario}:
    parameters:
      - name: usuario
        in: path
        required: true
        description: |
          `uid` del token (UUID). Por compatibilidad tambien se acepta el id
          numerico interno; cualquier otro valor responde 404.
        schema:
          oneOf:
            - type: string
              format: uuid
            - type: string
              pattern: '^[0-9]{1,18}$'
    get:
      tags: [perfil]
      operationId: obtenerPerfilPropio
      summary: Perfil del jugador autenticado
      security:
        - tokenDeUsuario: []
      responses:
        '200':
          description: El perfil del dueno del token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilUsuario'
        '403':
          description: |
            Sin token valido, sin permiso `MODIFICAR_PERFIL_PROPIO`, o el
            perfil es de otra persona. Lo responde el interceptor (con problem
            details) o el propio controlador.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No existe perfil para ese identificador.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    put:
      tags: [perfil]
      operationId: actualizarPerfilPropio
      summary: Edita el perfil propio (y opcionalmente apodo y avatar)
      security:
        - tokenDeUsuario: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ActualizarPerfil'
      responses:
        '200':
          description: El perfil ya actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilUsuario'
        '400':
          description: |
            Apodo en la lista negra, apodo en uso u otro dato invalido.

            **1.3.0 (RFINAL-03):** quien manda `Accept: application/problem+json`
            recibe un problem details cuyo `type` dice el motivo:

            * `.../errors/apodo-no-permitido` — el apodo coincide con la lista
              negra (HU-ADM-002, 7.1.1). Lleva `campo: apodo`. El `detail` es la
              frase generica de moderacion: nunca nombra el termino ni su
              categoria.
            * `.../errors/apodo-en-uso` — otra cuenta ya usa ese apodo, sin
              distinguir mayusculas (igual que el registro). Lleva `campo: apodo`.
              Cambiar solo las mayusculas del apodo propio no cuenta.
            * `.../errors/perfil-invalido` — cualquier otro dato rechazado.

            Sin ese `Accept`, el cuerpo sigue siendo el motivo en texto plano,
            como en 1.2.x (compatible).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetailDeCampo'
            text/plain:
              schema:
                type: string
        '403':
          description: Sin token valido, sin permiso, o el perfil es de otra persona.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No existe perfil para ese identificador.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: |
            1.2.0 — la lista negra no respondio al cambiar el apodo (fail-closed,
            B2). `type` `.../errors/moderacion-no-disponible`; nada se guardo.
          headers:
            Retry-After:
              description: Segundos sugeridos antes de reintentar (30).
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/perfiles/publicos:
    get:
      tags: [perfil]
      operationId: buscarPerfilesPublicos
      summary: Busca jugadores por apodo (datos publicos) — 1.1.0
      description: |
        Para elegir destinatario de un mensaje privado. Exige sesion (no es un
        directorio publico), minimo 3 caracteres, maximo 10 resultados, solo
        cuentas `ACTIVO`. Coincidencia por prefijo del apodo sin distinguir
        mayusculas.

        El texto se recorta (espacios alrededor) y se busca literalmente: `%`
        y `_` no son comodines. Los resultados salen ordenados por apodo sin
        distinguir mayusculas. Una cuenta sin perfil (las administrativas)
        sale con `avatar` null. La lista puede incluir a quien busca si su
        apodo coincide.
      security:
        - tokenDeUsuario: []
      parameters:
        - name: apodo
          in: query
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 50
      responses:
        '200':
          description: Coincidencias.
          content:
            application/json:
              schema:
                type: array
                maxItems: 10
                items:
                  $ref: '#/components/schemas/PerfilPublico'
        '400':
          description: |
            Apodo demasiado corto: ausente o de menos de 3 caracteres sin los
            espacios de alrededor (o de mas de 50, lo que mide un apodo).
            `type` `.../errors/datos-invalidos`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: |
            Sin sesion valida: sin token, token invalido o revocado. Lo responde
            el interceptor (`type` `.../errors/forbidden`) con el permiso
            `MODIFICAR_PERFIL_PROPIO`, que tienen los cuatro roles.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/perfiles/{usuario}/cierre:
    parameters:
      - name: usuario
        in: path
        required: true
        description: |
          `uid` del token (UUID). Solo la propia cuenta: con el `uid` de otra
          persona responde 403; un valor que no es un UUID, 404.
        schema:
          type: string
          format: uuid
    get:
      tags: [privacidad]
      operationId: consultarCierreDeCuenta
      summary: Si el cierre de la propia cuenta esta programado, y para cuando — 1.4.0
      security:
        - tokenDeUsuario: []
      responses:
        '200':
          description: |
            `PROGRAMADO` con sus fechas, o `SIN_SOLICITUD`. Nunca cachear
            (`Cache-Control: no-store`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CierreDeCuenta'
        '403':
          description: Sin sesion valida, o la cuenta de la ruta no es la del token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: El segmento no es un UUID o no existe esa cuenta.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    post:
      tags: [privacidad]
      operationId: solicitarCierreDeCuenta
      summary: Solicita el cierre de la propia cuenta, programado a 30 dias — 1.4.0
      description: |
        Verifica la identidad con la **contrasena actual** y programa la
        eliminacion para dentro de **30 dias** (`plazoDias`, RN-USR-011: el
        plazo es del requisito y no se configura).

        Orden de las comprobaciones, cada una sin cambiar nada si falla:

        1. cuenta bloqueada por intentos fallidos (RF-AUT-009): 423, sin
           comparar la contrasena;
        2. contrasena incorrecta: 422, y cuenta como intento fallido de la
           cuenta (tras varios, se bloquea);
        3. si ya hay un cierre programado: 200 con ese mismo cierre
           (idempotente: no se programa otro ni se mueve la fecha);
        4. subastas activas como vendedor o pujas vigentes (`GANANDO`, o una
           puja automatica configurada en una subasta `ACTIVA`), consultadas
           en ms-subastas con el token de quien llama: 409;
        5. si ms-subastas no responde: 503 (fail-closed: sin poder
           comprobarlo, no se programa).

        **Al vencer el plazo** una tarea programada de ms-identidad, idempotente,
        anonimiza la cuenta: el apodo se sustituye por un alias aleatorio que
        no deriva del anterior; se borran el perfil (nombres, apellidos,
        avatar y su archivo, preferencias), las preguntas de seguridad, los
        dispositivos conocidos y los codigos de un solo uso; el correo pasa a
        una direccion no entregable (`.invalid`) y la contrasena a un valor
        aleatorio; la cuenta queda `ELIMINADO`, sin poder entrar, y se revocan
        sus sesiones. Se **conservan** los registros financieros y de
        auditoria de los demas servicios, ligados al `uid`, que ya no permite
        saber quien era la persona. El evento queda en la auditoria
        (ms-cumplimiento).

        Desde entonces el directorio de administracion y
        `GET /api/v1/internal/usuarios/{uid}/contacto` (ms-identidad-admin.yaml)
        devuelven esa cuenta con estado `ELIMINADO`, el alias y el correo no
        entregable: quien produzca correos a partir del `uid` no debe
        escribirle.

        Lo que este servicio todavia NO hace al completarse: enviar el correo
        de confirmacion (el servicio de correo no publica una plantilla de
        cierre de cuenta; queda en la auditoria y en la bitacora), ni
        anonimizar las copias del apodo que guardan otros servicios
        (comentarios, chat, mensajes privados, subastas).
      security:
        - tokenDeUsuario: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitarCierre'
      responses:
        '201':
          description: Cierre programado ahora.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CierreDeCuenta'
        '200':
          description: Ya habia un cierre programado; se devuelve tal cual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CierreDeCuenta'
        '400':
          description: Cuerpo ausente o sin `passwordActual`. `type` `.../errors/datos-invalidos`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Sin sesion valida, o la cuenta de la ruta no es la del token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: El segmento no es un UUID o no existe esa cuenta.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: |
            `type` `.../errors/cierre-con-operaciones-pendientes`: la persona
            tiene subastas activas como vendedora o pujas vigentes. Lleva
            cuantas de cada una; nada cambio.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetailDeCierre'
        '422':
          description: |
            `type` `.../errors/contrasena-actual-incorrecta`. Cuenta como
            intento fallido de la cuenta (RF-AUT-009).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '423':
          description: |
            `type` `.../errors/cuenta-bloqueada`: demasiados intentos fallidos;
            no se comparo la contrasena.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: |
            `type` `.../errors/subastas-no-disponibles`: ms-subastas no
            respondio y no se pudo comprobar si hay subastas o pujas abiertas.
            Nada cambio.
          headers:
            Retry-After:
              description: Segundos sugeridos antes de reintentar (30).
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    delete:
      tags: [privacidad]
      operationId: cancelarCierreDeCuenta
      summary: Cancela el cierre programado de la propia cuenta — 1.4.0
      description: |
        Idempotente: sin cierre programado (nunca lo hubo o ya se cancelo)
        responde igual, `SIN_SOLICITUD`. Un cierre ya ejecutado no se puede
        cancelar: la cuenta ya no tiene sesiones validas.
      security:
        - tokenDeUsuario: []
      responses:
        '200':
          description: Sin cierre programado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CierreDeCuenta'
        '403':
          description: Sin sesion valida, o la cuenta de la ruta no es la del token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: El segmento no es un UUID o no existe esa cuenta.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

components:
  securitySchemes:
    tokenDeUsuario:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token de sesion emitido por `POST /api/v1/auth/login` (ADR-002). Lleva
        `sub` = apodo, `rol` y `uid` = UUID publico estable.

  schemas:
    PerfilPublico:
      type: object
      required: [uid, apodo]
      properties:
        uid:
          type: string
          format: uuid
        apodo:
          type: string
        avatar:
          type: [string, 'null']

    PerfilUsuario:
      type: object
      required: [id, apodo]
      properties:
        id:
          type: integer
          format: int64
          description: Id interno del perfil. No identifica a la persona fuera de este servicio.
        apodo:
          type: string
        email:
          type: [string, 'null']
          format: email
          description: |
            1.4.0 — el correo con el que la persona entra. Solo lo recibe el
            dueno del perfil. No se cambia por esta ruta.
        nombres:
          type: [string, 'null']
        apellidos:
          type: [string, 'null']
        avatar:
          type: [string, 'null']
          description: URL del avatar guardado, si lo hay.
        preferencias:
          type: [string, 'null']

    CierreDeCuenta:
      type: object
      description: 1.4.0 — el cierre de la propia cuenta (HU-PRV-005).
      required: [estado, plazoDias]
      properties:
        estado:
          type: string
          enum: [SIN_SOLICITUD, PROGRAMADO]
        plazoDias:
          type: integer
          const: 30
          description: |
            Dias entre la solicitud y la eliminacion (RN-USR-011). Lo da el
            servidor para que la interfaz no lo repita por su cuenta.
        solicitadoEn:
          type: [string, 'null']
          format: date-time
          description: |
            Cuando se pidio, con su desplazamiento horario (el del servicio).
            Nulo en `SIN_SOLICITUD`.
        programadoPara:
          type: [string, 'null']
          format: date-time
          description: |
            Cuando se ejecutara, con su desplazamiento horario: `solicitadoEn`
            mas `plazoDias` dias de calendario. La tarea que anonimiza pasa
            periodicamente, asi que la ejecucion ocurre en la primera pasada
            despues de vencer, nunca antes. Nulo en `SIN_SOLICITUD`.

    SolicitarCierre:
      type: object
      description: 1.4.0 — verificacion de identidad para cerrar la cuenta.
      required: [passwordActual]
      properties:
        passwordActual:
          type: string
          minLength: 1
          maxLength: 255
          writeOnly: true

    ActualizarPerfil:
      type: object
      properties:
        nombres:
          type: string
        apellidos:
          type: string
        avatar:
          type: string
          format: binary
          description: Archivo de imagen. Si no llega, se conserva el anterior.
        preferencias:
          type: string
        apodo:
          type: string
          description: Nuevo apodo. Se valida contra la lista negra y la unicidad.

    ProblemDetail:
      type: object
      description: Problem details RFC 7807 (regla 4).
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string

    ProblemDetailDeCierre:
      description: |
        1.4.0 — el 409 `cierre-con-operaciones-pendientes`, con cuantas
        operaciones lo impiden.
      allOf:
        - $ref: '#/components/schemas/ProblemDetail'
        - type: object
          properties:
            subastasActivas:
              type: integer
              minimum: 0
              description: Subastas propias en estado `ACTIVA`.
            pujasVigentes:
              type: integer
              minimum: 0
              description: |
                Subastas `ACTIVA` en las que la persona va ganando o tiene una
                puja automatica configurada.

    ProblemDetailDeCampo:
      description: 1.3.0 — el 400 del cambio de perfil, con el campo que fallo.
      allOf:
        - $ref: '#/components/schemas/ProblemDetail'
        - type: object
          properties:
            campo:
              type: string
              enum: [apodo]
              description: Solo en `apodo-no-permitido` y `apodo-en-uso`.
