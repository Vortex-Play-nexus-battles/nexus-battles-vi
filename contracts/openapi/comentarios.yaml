openapi: 3.1.0
info:
  title: Nexus Battles VI - Comentarios (publicacion sobre productos)
  description: >
    API para publicar comentarios con texto e imagenes sobre productos, con
    calificacion unica por jugador y filtro automatico de contenido (HU-COM-001,
    RF-COM-001, RF-COM-002 y RF-COM-007; el contenido del comentario sigue
    RN-CMT-001). El filtro se apoya en la lista negra de
    HU-ADM-002, consumida por REST segun contracts/openapi/moderacion-lista-negra.yaml.

    Desde la 1.1.0 el autor y su apodo salen del token de acceso (ADR-002:
    identificador estable `uid` y apodo), no del cuerpo. Los campos `autorId`
    y `apodoAutor` de `PublicacionComentarioRequest` se conservan como
    obsoletos y se ignoran, asi un cliente de la 1.0.0 sigue recibiendo 201 y
    no 400: por eso es una version menor y no una mayor. Publicar exige un
    usuario autenticado (401 sin token; 403 con un token que no es de usuario,
    como uno de servicio); leer el hilo sigue siendo publico.

    1.2.0 (HU-COM-002/003/004, #483 #484 #485): la segunda calificacion de un
    jugador sobre un producto YA NO es 409 — el comentario entra sin estrellas
    y `calificacionDescartada: true` lo dice (RF-COM-002, decision D-07); el
    409 queda solo para la colision concurrente. Nuevo `DELETE
    /products/{productId}/comments/{commentId}` para retirar un comentario
    propio: 204 (idempotente), 403 ajeno, 404 inexistente; un comentario
    retirado no sale en el hilo ni cuenta en `calificacionPromedio`. Todo
    compatible con clientes 1.1.0: por eso es menor.

    1.3.0 (R10.1) cierra el flujo de moderacion. Hasta aqui un comentario podia
    entrar en EN_REVISION —lo hacia el filtro automatico de RF-COM-007— y no
    habia ningun camino para sacarlo: ni cola donde apareciera, ni accion que
    lo resolviera. Un defecto de producto, no de codigo: el estado existia y la
    salida no. Ahora se anaden el reporte del jugador (RF-COM-006), la cola del
    moderador (RF-COM-005) y las acciones con su asiento (RF-COM-008), y el
    estado OCULTO, que RF-COM-008 exige distinguir de ELIMINADO porque
    "Ocultar debe preservar el registro en base de datos".
  version: 1.3.0
servers:
  - url: http://localhost:8081/api/v1
    description: Entorno local de desarrollo
paths:
  /products/{productId}/comments:
    get:
      summary: Leer el hilo de comentarios de un producto
      operationId: consultarHilo
      description: >
        Devuelve los comentarios PUBLICADOS de un producto, del mas antiguo al
        mas reciente, junto con el promedio de calificacion en cinco estrellas.
        Es el lado proveedor de HU-INV-014 (la ficha de producto pinta este
        hilo) y cierra el criterio CA-01 de HU-COM-001: un comentario "se suma
        al hilo", y el hilo tiene que poder leerse.

        Los comentarios EN_REVISION no salen: estan a la espera de un
        moderador y no son publicos. No mueven el promedio.

        Un producto sin comentarios responde 200 con la lista vacia y sin
        promedio, nunca 404: no tener comentarios es un estado normal de un
        producto, no un error, y la ficha lo pinta como estado vacio. La
        existencia del producto no se verifica contra el catalogo, igual que
        en la publicacion.
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: El hilo del producto, aunque este vacio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HiloDeComentariosResponse"
    post:
      summary: Publicar un comentario sobre un producto
      operationId: publicarComentario
      security:
        - bearerAuth: []
      description: >
        Exige un usuario autenticado: el autor es el `uid` del token y el
        apodo, su sujeto. Sin token responde 401; con un token de servicio,
        403.


        La retencion y el rechazo no son lo mismo. Si el filtro senala el texto,
        el comentario si se guarda pero queda esperando a un moderador y la
        respuesta es 202, no 201. Si el autor esta silenciado (403) o alguna
        imagen viene en formato no admitido (422), el comentario no se guarda.
        Un jugador comenta cuantas veces quiera pero califica una sola vez.
        Si el jugador envía una calificación para un producto que ya calificó,
        el sistema rechaza la solicitud con un error 409 (CALIFICACION_DUPLICADA).
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
          description: >
            Identificador del producto comentado. La verificacion de que el
            producto exista contra el catalogo queda pendiente de integrar
            cuando el catalogo publique su contrato; mientras tanto el
            identificador se acepta tal cual.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicacionComentarioRequest"
      responses:
        "201":
          description: Comentario publicado y visible en el hilo del producto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComentarioResponse"
        "202":
          description: >
            Comentario retenido por el filtro automatico, guardado a la espera
            de revision de un moderador. No aparece en el hilo ni mueve el
            promedio hasta que se apruebe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComentarioResponse"
        "400":
          description: Datos de la solicitud invalidos o incompletos
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Sin token de acceso, o con un token caducado o no verificable
        "403":
          description: >
            El autor tiene una sancion activa de silencio y no puede publicar
            (problem detail con motivo AUTOR_SILENCIADO), o el token no es de
            un usuario (por ejemplo, un token de servicio; sin cuerpo)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: >
            Colisión concurrente: dos solicitudes del mismo jugador intentaron
            calificar el mismo producto a la vez y la segunda chocó con el
            índice único. Reintentar sin calificación. (Desde 1.2.0 la segunda
            calificación en secuencia no es 409: entra sin estrellas con
            `calificacionDescartada: true`.)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          description: Al menos una imagen viene en un formato que no se admite
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /products/{productId}/comments/{commentId}:
    delete:
      operationId: eliminarComentario
      summary: Retira un comentario propio (HU-COM-004, RF-COM-004)
      description: >
        Solo el autor retira su comentario; quién es sale del `uid` del token,
        nunca del cuerpo. Un comentario retirado desaparece del hilo y su
        calificación deja de contar en el promedio (y libera la única
        calificación del autor sobre el producto: puede volver a calificar en
        un comentario nuevo, decisión D-19). Idempotente: retirar uno ya
        retirado responde 204.
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
        - name: commentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Retirado (o ya lo estaba)
        "401":
          description: Sin token, caducado o firmado por otro
        "403":
          description: >
            El comentario es de otro jugador (`type` =
            `https://nexusbattles.local/errores/comentario-ajeno`), o el token
            no es de usuario
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: >
            No hay ningún comentario con ese id en el hilo de ese producto
            (`type` = `https://nexusbattles.local/errores/comentario-no-encontrado`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /products/{productId}/comments/{commentId}/reportes:
    post:
      summary: Reportar un comentario inapropiado (RF-COM-006)
      operationId: reportarComentario
      description: >
        Cualquier usuario autenticado puede reportar un comentario publicado.
        El reportante sale del token (`uid`), nunca del cuerpo: quien reporta es
        quien manda la peticion.


        El primer reporte pasa el comentario a EN_REVISION y lo pone en la cola
        del moderador. Los reportes siguientes sobre el mismo comentario se
        agrupan: suben su prioridad en la cola, no crean otra entrada.


        El limite de reportes por usuario lo exige la ficha sin fijar su valor
        ("[LIMITE DE REPORTES POR USUARIO POR DEFINIR]"). Se resuelve por
        parametro administrable (`comentarios.reportes.maximo-por-usuario-por-dia`),
        no por una constante escrita en el codigo.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
        - $ref: "#/components/parameters/CommentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReporteRequest"
      responses:
        "201":
          description: Reporte registrado; el comentario queda en revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReporteResponse"
        "401":
          description: Sin token.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: El comentario no existe en ese producto.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: >
            Este usuario ya reporto este comentario (`motivo:
            REPORTE_DUPLICADO`). Reportar dos veces no sube la prioridad: eso
            seria premiar la insistencia de uno sobre el acuerdo de varios.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "429":
          description: >
            Limite diario de reportes agotado (`motivo: LIMITE_DE_REPORTES`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  # La ruta NO es /moderacion/comentarios, que seria la natural: el prefijo
  # /api/v1/moderacion ya es de metricas-plataforma (sus agregados de
  # moderacion, metricas-plataforma.yaml 1.6.0) y el borde lo enruta alli por
  # una regex. Dos servicios bajo el mismo prefijo habrian funcionado en
  # pruebas y dado 404 en el navegador. /api/v1/comentarios es de este
  # servicio y de nadie mas.
  /comentarios/moderacion:
    get:
      summary: Cola de comentarios pendientes de revision (RF-COM-005)
      operationId: colaDeModeracion
      description: >
        Solo MODERADOR, ADMINISTRADOR y SUPER_ADMINISTRADOR. Devuelve los
        comentarios en EN_REVISION ordenados por numero de reportes (mas
        reportado primero) y, a igualdad, por antiguedad: lo que mas gente
        marco y lleva mas tiempo esperando se atiende antes.


        Una cola vacia es `200` con lista vacia y `total: 0`, no un 404: no
        tener trabajo pendiente es una respuesta correcta (CA-03).
      security:
        - bearerAuth: []
      parameters:
        - name: productoId
          in: query
          required: false
          schema:
            type: string
          description: Acota la cola a un producto.
        - name: pagina
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: tamano
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Cola priorizada (puede venir vacia).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ColaDeModeracionResponse"
        "401":
          description: Sin token.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: El rol no modera.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /comentarios/moderacion/{commentId}:
    get:
      summary: Un comentario en revision, con su contexto (RF-COM-005)
      operationId: detalleDeModeracion
      description: >
        El comentario, sus reportes agrupados por categoria y el historial de
        acciones de moderacion que ya se le aplicaron. Es lo que el moderador
        necesita para decidir sin salir de la pantalla.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CommentId"
      responses:
        "200":
          description: Detalle del comentario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetalleDeModeracionResponse"
        "401":
          description: Sin token.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: El rol no modera.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: No existe.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /comentarios/moderacion/{commentId}/decision:
    post:
      summary: Resolver un comentario en revision (RF-COM-008)
      operationId: resolverComentario
      description: >
        Aplica la accion y deja el asiento: quien la hizo, cuando, con que
        motivo y entre que estados. El moderador sale del token, nunca del
        cuerpo.


        `OCULTAR` conserva el registro en base de datos y es reversible con
        `RESTAURAR` — es la distincion que pide la ficha frente a `ELIMINAR`.


        El motivo es obligatorio en todas las acciones, incluida APROBAR: "por
        que se dejo pasar" es tan parte de la trazabilidad como "por que se
        retiro".
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CommentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionRequest"
      responses:
        "200":
          description: Comentario resuelto, con su asiento.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionResponse"
        "401":
          description: Sin token.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: El rol no modera.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: No existe.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: >
            La transicion no es valida desde el estado actual (`motivo:
            TRANSICION_INVALIDA`). Cubre el caso de CA-03: otro moderador ya lo
            resolvio mientras este miraba la pantalla, y nada cambia.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

components:
  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
      description: Identificador del producto comentado.
    CommentId:
      name: commentId
      in: path
      required: true
      schema:
        type: string
      description: Identificador del comentario.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Token de acceso emitido por ms-identidad (RS256, verificado contra su
        JWKS, ADR-002). El autor del comentario es el claim `uid`; el apodo,
        el sujeto (o `preferred_username` con Keycloak). Cualquiera de los
        roles de usuario (JUGADOR, MODERADOR, ADMINISTRADOR,
        SUPER_ADMINISTRADOR) puede publicar; un token de servicio no.
  schemas:
    PublicacionComentarioRequest:
      type: object
      required:
        - texto
      properties:
        autorId:
          type: string
          deprecated: true
          description: >
            Obsoleto desde la 1.1.0: se ignora. El autor es el `uid` del token.
            Se conserva para que un cliente de la 1.0.0 no reciba 400.
        apodoAutor:
          type: string
          deprecated: true
          description: >
            Obsoleto desde la 1.1.0: se ignora. El apodo sale del token.
        texto:
          type: string
          description: >
            Contenido escrito. El largo maximo esta pendiente de definir con el
            Product Owner (issue 34), por eso todavia no se limita aqui.
        imagenes:
          type: array
          items:
            type: string
          description: >
            Nombres de archivo de los adjuntos. Los formatos admitidos estan
            pendientes de definir con el Product Owner y por eso son
            configurables en el servicio.
        estrellas:
          type: integer
          minimum: 1
          maximum: 5
          description: >
            Calificacion pretendida. Omitir si no se quiere calificar.

    ComentarioResponse:
      type: object
      required:
        - id
        - productoId
        - autorId
        - apodoAutor
        - texto
        - fechaPublicacion
        - estado
      properties:
        id:
          type: string
        productoId:
          type: string
        autorId:
          type: string
        apodoAutor:
          type: string
        texto:
          type: string
        imagenes:
          type: array
          items:
            type: string
        estrellas:
          type: integer
          description: Ausente cuando el jugador ya habia calificado el producto
        fechaPublicacion:
          type: string
          format: date-time
        estado:
          $ref: "#/components/schemas/EstadoDeComentario"
        calificacionDescartada:
          type: boolean
          default: false
          description: >
            (1.2.0) `true` en la respuesta de publicar cuando las estrellas que
            venían se descartaron porque el jugador ya había calificado el
            producto (RF-COM-002, D-07). El comentario entró igual. En el hilo
            siempre `false`.

    HiloDeComentariosResponse:
      type: object
      required:
        - productoId
        - comentarios
        - total
        - totalCalificaciones
      properties:
        productoId:
          type: string
        comentarios:
          type: array
          description: Solo los PUBLICADOS, del mas antiguo al mas reciente.
          items:
            $ref: "#/components/schemas/ComentarioResponse"
        total:
          type: integer
          description: Cuantos comentarios trae la lista.
        calificacionPromedio:
          type:
            - number
            - "null"
          minimum: 1
          maximum: 5
          description: >
            Promedio de las estrellas de los comentarios publicados que
            calificaron, con dos decimales. Nulo si nadie ha calificado: la
            ficha debe mostrar "sin valoraciones", no un cero.
        totalCalificaciones:
          type: integer
          description: Cuantos de los comentarios publicados traen estrellas.

    ReporteRequest:
      type: object
      required:
        - categoria
      properties:
        categoria:
          $ref: "#/components/schemas/CategoriaDeReporte"
        descripcion:
          type: string
          maxLength: 500
          description: Motivo en palabras del reportante. Opcional (ficha RF-COM-006).

    CategoriaDeReporte:
      type: string
      description: >
        Las seis categorias de la ficha RF-COM-006, en su orden. No es una
        lista abierta: ampliarla es cambiar el requisito, no la API.
      enum:
        - SPAM
        - CONTENIDO_OFENSIVO
        - ACOSO
        - INFORMACION_FALSA
        - CONTENIDO_INAPROPIADO
        - VIOLACION_DE_DERECHOS

    ReporteResponse:
      type: object
      required:
        - id
        - comentarioId
        - categoria
        - fecha
        - estadoDelComentario
        - reportesTotales
      properties:
        id:
          type: string
        comentarioId:
          type: string
        categoria:
          $ref: "#/components/schemas/CategoriaDeReporte"
        descripcion:
          type: string
        fecha:
          type: string
          format: date-time
        estadoDelComentario:
          $ref: "#/components/schemas/EstadoDeComentario"
        reportesTotales:
          type: integer
          description: >
            Cuantos reportes acumula el comentario despues de este. Es lo que
            ordena la cola del moderador.

    EstadoDeComentario:
      type: string
      description: >
        OCULTO entra en la 1.3.0: RF-COM-008 exige que "Ocultar preserve el
        registro en base de datos, a diferencia de Eliminar", asi que no puede
        ser el mismo estado. ELIMINADO sigue siendo terminal; OCULTO se
        revierte con RESTAURAR.
      enum:
        - PUBLICADO
        - EN_REVISION
        - OCULTO
        - ELIMINADO

    AccionDeModeracion:
      type: string
      enum:
        - APROBAR
        - OCULTAR
        - ELIMINAR
        - RESTAURAR

    DecisionRequest:
      type: object
      required:
        - accion
        - motivo
      properties:
        accion:
          $ref: "#/components/schemas/AccionDeModeracion"
        motivo:
          type: string
          minLength: 3
          maxLength: 500
          description: >
            Obligatorio en TODAS las acciones, incluida APROBAR: por que se
            dejo pasar es tan parte de la trazabilidad como por que se retiro.

    AsientoDeModeracion:
      type: object
      required:
        - id
        - accion
        - moderadorId
        - apodoModerador
        - motivo
        - estadoAnterior
        - estadoNuevo
        - fecha
      properties:
        id:
          type: string
        accion:
          $ref: "#/components/schemas/AccionDeModeracion"
        moderadorId:
          type: string
          description: El `uid` del token, nunca un campo del cuerpo.
        apodoModerador:
          type: string
        motivo:
          type: string
        estadoAnterior:
          $ref: "#/components/schemas/EstadoDeComentario"
        estadoNuevo:
          $ref: "#/components/schemas/EstadoDeComentario"
        fecha:
          type: string
          format: date-time

    DecisionResponse:
      type: object
      required:
        - comentario
        - asiento
      properties:
        comentario:
          $ref: "#/components/schemas/ComentarioResponse"
        asiento:
          $ref: "#/components/schemas/AsientoDeModeracion"
        autorNotificado:
          type: boolean
          description: >
            Si el aviso al autor salio. `false` no invalida la decision: la
            notificacion es fail-open a proposito (HU-DIS-003), porque un
            servicio de avisos caido no puede impedir que se retire un
            comentario ofensivo.

    EntradaDeCola:
      type: object
      required:
        - comentario
        - reportes
        - primerReporte
      properties:
        comentario:
          $ref: "#/components/schemas/ComentarioResponse"
        reportes:
          type: integer
          description: Cuantas personas distintas lo reportaron.
        porCategoria:
          type: object
          additionalProperties:
            type: integer
          description: Reportes agrupados por categoria, para ver de que se le acusa.
        primerReporte:
          type: string
          format: date-time
          description: Desempata la cola a igualdad de reportes.

    ColaDeModeracionResponse:
      type: object
      required:
        - entradas
        - total
        - pagina
        - tamano
      properties:
        entradas:
          type: array
          items:
            $ref: "#/components/schemas/EntradaDeCola"
        total:
          type: integer
          description: Cuantos comentarios hay en revision en total, no en esta pagina.
        pagina:
          type: integer
        tamano:
          type: integer

    DetalleDeModeracionResponse:
      type: object
      required:
        - comentario
        - reportes
        - historial
      properties:
        comentario:
          $ref: "#/components/schemas/ComentarioResponse"
        reportes:
          type: array
          items:
            $ref: "#/components/schemas/ReporteResponse"
        historial:
          type: array
          description: Acciones de moderacion ya aplicadas, de la mas antigua a la mas reciente.
          items:
            $ref: "#/components/schemas/AsientoDeModeracion"

    ProblemDetail:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        motivo:
          type: string
          enum:
            - AUTOR_SILENCIADO
            - FORMATO_DE_IMAGEN_NO_ADMITIDO
            - CALIFICACION_DUPLICADA
            - REPORTE_DUPLICADO
            - LIMITE_DE_REPORTES
            - TRANSICION_INVALIDA
          description: >
            Presente en los rechazos de publicación (403 y 422), para que el
            cliente distinga el motivo sin interpretar el texto del detalle.
            `CALIFICACION_DUPLICADA` ya no rechaza desde 1.2.0; se conserva
            por compatibilidad con clientes 1.1.0.
