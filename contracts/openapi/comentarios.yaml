openapi: 3.1.0
info:
  title: Nexus Battles VI - Comentarios (publicacion sobre productos)
  description: >
    API para publicar comentarios con texto e imagenes sobre productos, con
    calificacion unica por jugador y filtro automatico de contenido (HU-COM-001,
    RF-COM-001, RF-COM-002 y RF-COM-007; el contenido del comentario sigue
    RN-CMT-001). El filtro se apoya en la lista negra de
    HU-ADM-002, consumida por REST segun contracts/openapi/moderacion-lista-negra.yaml.

    Desde la 1.1.0 el autor y su apodo salen del token de acceso (ADR-002:
    identificador estable `uid` y apodo), no del cuerpo. Los campos `autorId`
    y `apodoAutor` de `PublicacionComentarioRequest` se conservan como
    obsoletos y se ignoran, asi un cliente de la 1.0.0 sigue recibiendo 201 y
    no 400: por eso es una version menor y no una mayor. Publicar exige un
    usuario autenticado (401 sin token; 403 con un token que no es de usuario,
    como uno de servicio); leer el hilo sigue siendo publico.

    1.2.0 (HU-COM-002/003/004, #483 #484 #485): la segunda calificacion de un
    jugador sobre un producto YA NO es 409 — el comentario entra sin estrellas
    y `calificacionDescartada: true` lo dice (RF-COM-002, decision D-07); el
    409 queda solo para la colision concurrente. Nuevo `DELETE
    /products/{productId}/comments/{commentId}` para retirar un comentario
    propio: 204 (idempotente), 403 ajeno, 404 inexistente; un comentario
    retirado no sale en el hilo ni cuenta en `calificacionPromedio`. Todo
    compatible con clientes 1.1.0: por eso es menor.

    1.3.0 (R10.1) cierra el flujo de moderacion. Hasta aqui un comentario podia
    entrar en EN_REVISION —lo hacia el filtro automatico de RF-COM-007— y no
    habia ningun camino para sacarlo: ni cola donde apareciera, ni accion que
    lo resolviera. Un defecto de producto, no de codigo: el estado existia y la
    salida no. Ahora se anaden el reporte del jugador (RF-COM-006), la cola del
    moderador (RF-COM-005) y las acciones con su asiento (RF-COM-008), y el
    estado OCULTO, que RF-COM-008 exige distinguir de ELIMINADO porque
    "Ocultar debe preservar el registro en base de datos".

    1.4.0 (B0/B3 — comunidad de producto; 7.1 del documento del curso: «vista de
    detalle ... calificacion promedio valorada en cinco estrellas, incluyendo el
    hilo de comentarios ... Los usuarios solo pueden calificar un producto una
    vez, pero podran agregar o retirar tantos comentarios como sea de su
    agrado»). La calificacion se separa del comentario: `POST
    /products/{productId}/rating` califica sin escribir nada, una sola vez por
    jugador y producto, y el resumen (promedio, total, distribucion) lo calcula
    el servidor. Los comentarios se paginan (`pagina`, `tamano`; del mas
    reciente al mas antiguo) y se comprueba que el producto exista en el
    catalogo. Las imagenes dejan de ser nombres de archivo: se suben por
    `POST /comentarios/imagenes` (JPEG, PNG o WebP comprobados por su firma de
    bytes, no por la extension ni por Content-Type) y el comentario lleva sus
    `id`. La moderacion gana EDITAR (con registro del texto anterior) y
    MARCAR/DESMARCAR (7.3.3). `estrellas` en el cuerpo del comentario sigue
    aceptandose por compatibilidad: si el jugador aun no califico, se registra
    como su calificacion; si ya lo hizo, se descarta como hasta ahora.

    1.5.0 (B3, BACKEND-05): implementadas las cinco operaciones que la 1.4.0
    dejaba pendientes (`rating` GET y POST, `rating/mia`, subida y descarga de
    imagenes), la paginacion del hilo, la validacion del producto y EDITAR,
    MARCAR y DESMARCAR. Es menor y no parche porque, al implementarlas, el
    contrato gana piezas compatibles que la 1.4.0 no declaraba: en el hilo
    `pagina`, `tamano` y `totalPaginas` (y `total` pasa a contar todas las
    paginas); en el comentario `editado` y, solo en las respuestas de
    moderacion, `marcado`; en la cola el filtro `marcado`; y las respuestas 404
    y 503 de publicar y calificar. Se aclara ademas lo que ya decia la 1.4.0
    y el texto de algunas operaciones contradecia: las estrellas de cada
    comentario son las de la calificacion de su autor; retirar u ocultar un
    comentario ya no toca esa calificacion (sustituye a la decision D-19); el
    promedio del hilo y el de `GET /rating` son el mismo numero, con un
    decimal; y una segunda calificacion al comentar no es 409 sino
    `calificacionDescartada`. Publicar con nombres de archivo en `imagenes`
    ya no responde 422 sino 400, como fijaba la 1.4.0.

    1.6.0 (HU-COM-006): `prioridadElevada` (boolean) en la respuesta del reporte
    y en cada entrada de la cola, y el 400 `REPORTE_INVALIDO` de `POST
    .../reportes`, que el servicio ya respondia sin que el contrato lo
    declarara. Es menor: solo anade un campo y documenta un error existente.
    `prioridadElevada` es `false` mientras no haya umbral configurado; el valor
    del umbral lo fija el Product Owner y no se escribe aqui.

    1.8.0 (HU-COM-008, CA-02, #522): `POST /comentarios/moderacion/decisiones`
    aplica una misma accion y un mismo motivo a varios comentarios de una vez,
    todo o nada: si uno solo no se puede resolver, no cambia ninguno y el 409
    `LOTE_RECHAZADO` dice cuales fallaron y por que. Es menor: anade una ruta
    y no toca `/{commentId}/decision`.
  version: 1.8.0
servers:
  - url: http://localhost:8081/api/v1
    description: Entorno local de desarrollo
paths:
  /products/{productId}/comments:
    get:
      summary: Leer el hilo de comentarios de un producto
      operationId: consultarHilo
      description: >
        Devuelve una pagina de los comentarios PUBLICADOS de un producto, del
        mas reciente al mas antiguo (y, a igual fecha, por id, para que el orden
        sea estable entre paginas), junto con el resumen de su calificacion en
        cinco estrellas. Es el lado proveedor de HU-INV-014 (la ficha de
        producto pinta este hilo) y cierra el criterio CA-01 de HU-COM-001: un
        comentario "se suma al hilo", y el hilo tiene que poder leerse.

        Los comentarios EN_REVISION, OCULTO y ELIMINADO no salen. El promedio
        no depende de ellos (1.5.0): sale de la tabla de calificaciones, la
        misma fuente que `GET /products/{productId}/rating`.

        Un producto sin comentarios, o una pagina mas alla de la ultima,
        responde 200 con la lista vacia, nunca 404: no tener comentarios es un
        estado normal de un producto, no un error, y la ficha lo pinta como
        estado vacio. Leer el hilo no pregunta al catalogo: sigue funcionando
        aunque el servicio de productos no responda.
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
        - name: pagina
          in: query
          required: false
          description: 1.4.0 — pagina (desde 0) de comentarios, del mas reciente al mas antiguo. Negativa, 400.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: tamano
          in: query
          required: false
          description: >
            1.4.0 — comentarios por pagina (16 por omision, como la vitrina).
            Menor que 1, 400; mas de 50 se recorta a 50 (la respuesta dice el
            tamano que se aplico).
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 16
      responses:
        "200":
          description: El hilo del producto, aunque este vacio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HiloDeComentariosResponse"
        "400":
          description: pagina negativa, tamano menor que 1 o alguno que no es un numero.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    post:
      summary: Publicar un comentario sobre un producto
      operationId: publicarComentario
      security:
        - bearerAuth: []
      description: >
        Exige un usuario autenticado: el autor es el `uid` del token y el
        apodo, su sujeto. Sin token responde 401; con un token de servicio,
        403.


        La retencion y el rechazo no son lo mismo. Si el filtro senala el texto
        (la lista negra se consulta con `contexto: COMENTARIO` y su accion
        `REVISION` retiene, igual que si la lista negra no responde), el
        comentario si se guarda pero queda esperando a un moderador y la
        respuesta es 202, no 201. Si el autor esta silenciado (403), el
        producto no existe (404) o alguna imagen no se puede adjuntar (400), el
        comentario no se guarda. Si el catalogo o sanciones no responden, 503:
        no se publica a ciegas.


        Un jugador comenta cuantas veces quiera pero califica una sola vez
        (7.1). Si trae `estrellas` y aun no habia calificado el producto, pasan
        a ser su calificacion (la misma de `POST /products/{productId}/rating`);
        si ya lo habia hecho, el comentario entra igual y la respuesta lo dice
        con `calificacionDescartada: true` (1.2.0, D-07), tambien si otra
        peticion simultanea suya califico primero.
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
          description: >
            Identificador del producto comentado. Desde la 1.5.0 se comprueba
            contra el catalogo (`GET /api/v1/productos/{id}`, productos.yaml):
            uno que no existe responde 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicacionComentarioRequest"
      responses:
        "201":
          description: Comentario publicado y visible en el hilo del producto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComentarioResponse"
        "202":
          description: >
            Comentario retenido por el filtro automatico, guardado a la espera
            de revision de un moderador. No aparece en el hilo ni mueve el
            promedio hasta que se apruebe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComentarioResponse"
        "400":
          description: >
            Datos de la solicitud invalidos o incompletos: sin texto, estrellas
            fuera de 1..5, o imagenes que no se pueden adjuntar (`type`
            `https://nexusbattles.local/errores/imagenes-no-validas`): mas de
            tres, repetidas, un nombre de archivo en vez de un id, o el id de
            una imagen ajena, ya usada o inexistente.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Sin token de acceso, o con un token caducado o no verificable
        "403":
          description: >
            El autor tiene una sancion activa de silencio y no puede publicar
            (`type` `https://nexusbattles.local/errores/autor-silenciado`,
            motivo AUTOR_SILENCIADO), o el token no es de un usuario (por
            ejemplo, un token de servicio; sin cuerpo)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          $ref: "#/components/responses/ProductoInexistente"
        "409":
          description: >
            Otra solicitud simultanea choco con una restriccion de la base.
            Reintentar. Desde la 1.5.0 la calificacion unica ya no llega aqui:
            una segunda calificacion, en secuencia o a la vez, entra como
            `calificacionDescartada: true`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "503":
          $ref: "#/components/responses/DependenciaNoDisponible"

  /products/{productId}/comments/{commentId}:
    delete:
      operationId: eliminarComentario
      summary: Retira un comentario propio (HU-COM-004, RF-COM-004)
      description: >
        Solo el autor retira su comentario; quién es sale del `uid` del token,
        nunca del cuerpo. Un comentario retirado desaparece del hilo.
        Idempotente: retirar uno ya retirado responde 204.


        Desde la 1.5.0 retirar un comentario NO toca la calificación de su
        autor: la calificación vive aparte, se da una sola vez y no se retira
        (7.1: «solo pueden calificar un producto una vez, pero podrán agregar o
        retirar tantos comentarios como sea de su agrado»). Sustituye a la
        decisión D-19, que al retirar el comentario liberaba la calificación.
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
        - name: commentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Retirado (o ya lo estaba)
        "401":
          description: Sin token, caducado o firmado por otro
        "403":
          description: >
            El comentario es de otro jugador (`type` =
            `https://nexusbattles.local/errores/comentario-ajeno`), o el token
            no es de usuario
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: >
            No hay ningún comentario con ese id en el hilo de ese producto
            (`type` = `https://nexusbattles.local/errores/comentario-no-encontrado`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /products/{productId}/comments/{commentId}/reportes:
    post:
      summary: Reportar un comentario inapropiado (RF-COM-006)
      operationId: reportarComentario
      description: >
        Cualquier usuario autenticado puede reportar un comentario publicado.
        El reportante sale del token (`uid`), nunca del cuerpo: quien reporta es
        quien manda la peticion.


        El primer reporte pasa el comentario a EN_REVISION y lo pone en la cola
        del moderador. Los reportes siguientes sobre el mismo comentario se
        agrupan: suben su prioridad en la cola, no crean otra entrada.


        1.6.0 — cuando los reportes del comentario alcanzan el umbral de
        prioridad elevada, `prioridadElevada` es `true` en la respuesta y en su
        entrada de la cola. Sin umbral configurado es siempre `false`. El valor
        del umbral lo fija el Product Owner, no este contrato.


        El limite de reportes por usuario lo exige la ficha sin fijar su valor
        ("[LIMITE DE REPORTES POR USUARIO POR DEFINIR]"). Se resuelve por
        parametro administrable (`comentarios.reportes.maximo-por-usuario-por-dia`),
        no por una constante escrita en el codigo.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
        - $ref: "#/components/parameters/CommentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReporteRequest"
      responses:
        "201":
          description: Reporte registrado; el comentario queda en revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReporteResponse"
        "400":
          description: >
            1.6.0 — el reporte no es valido: categoria ausente o descripcion de
            mas de 500 caracteres (`motivo: REPORTE_INVALIDO`). Una categoria
            fuera de las seis definidas tambien es 400.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Sin token.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: El comentario no existe en ese producto.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: >
            Este usuario ya reporto este comentario (`motivo:
            REPORTE_DUPLICADO`). Reportar dos veces no sube la prioridad: eso
            seria premiar la insistencia de uno sobre el acuerdo de varios.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "429":
          description: >
            Limite diario de reportes agotado (`motivo: LIMITE_DE_REPORTES`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  # La ruta NO es /moderacion/comentarios, que seria la natural: el prefijo
  # /api/v1/moderacion ya es de metricas-plataforma (sus agregados de
  # moderacion, metricas-plataforma.yaml 1.6.0) y el borde lo enruta alli por
  # una regex. Dos servicios bajo el mismo prefijo habrian funcionado en
  # pruebas y dado 404 en el navegador. /api/v1/comentarios es de este
  # servicio y de nadie mas.
  /comentarios/moderacion:
    get:
      summary: Cola de comentarios pendientes de revision (RF-COM-005)
      operationId: colaDeModeracion
      description: >
        Solo MODERADOR, ADMINISTRADOR y SUPER_ADMINISTRADOR. Devuelve los
        comentarios en EN_REVISION ordenados por numero de reportes (mas
        reportado primero) y, a igualdad, por antiguedad: lo que mas gente
        marco y lleva mas tiempo esperando se atiende antes.


        Una cola vacia es `200` con lista vacia y `total: 0`, no un 404: no
        tener trabajo pendiente es una respuesta correcta (CA-03).


        1.5.0 — con `marcado=true` es la lista de seguimiento especial (7.3.3,
        «Marcar: senalar comentarios para seguimiento especial»): los marcados
        en cualquier estado salvo ELIMINADO, tambien los ya publicados, con la
        misma prioridad. Con `marcado=false`, los EN_REVISION sin marcar. Sin el
        parametro, la cola de siempre. En estas respuestas cada comentario trae
        `marcado`.
      security:
        - bearerAuth: []
      parameters:
        - name: productoId
          in: query
          required: false
          schema:
            type: string
          description: Acota la cola a un producto.
        - name: marcado
          in: query
          required: false
          schema:
            type: boolean
          description: 1.5.0 — `true` lista de seguimiento; `false` solo los en revision sin marcar.
        - name: pagina
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: tamano
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Cola priorizada (puede venir vacia).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ColaDeModeracionResponse"
        "401":
          description: Sin token.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: El rol no modera.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /comentarios/moderacion/{commentId}:
    get:
      summary: Un comentario en revision, con su contexto (RF-COM-005)
      operationId: detalleDeModeracion
      description: >
        El comentario, sus reportes agrupados por categoria y el historial de
        acciones de moderacion que ya se le aplicaron. Es lo que el moderador
        necesita para decidir sin salir de la pantalla.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CommentId"
      responses:
        "200":
          description: Detalle del comentario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetalleDeModeracionResponse"
        "401":
          description: Sin token.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: El rol no modera.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: No existe.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /comentarios/moderacion/{commentId}/decision:
    post:
      summary: Resolver un comentario en revision (RF-COM-008)
      operationId: resolverComentario
      description: >
        Aplica la accion y deja el asiento: quien la hizo, cuando, con que
        motivo y entre que estados. El moderador sale del token, nunca del
        cuerpo.


        `OCULTAR` conserva el registro en base de datos y es reversible con
        `RESTAURAR` — es la distincion que pide la ficha frente a `ELIMINAR`.


        El motivo es obligatorio en todas las acciones, incluida APROBAR: "por
        que se dejo pasar" es tan parte de la trazabilidad como "por que se
        retiro".


        1.4.0/1.5.0 — EDITAR, MARCAR y DESMARCAR no cambian el estado del
        comentario y valen desde PUBLICADO, EN_REVISION u OCULTO (ELIMINADO
        sigue siendo terminal). EDITAR exige `textoNuevo`, deja el comentario
        `editado` y guarda en el asiento el texto anterior y el nuevo; editar
        no aprueba: si estaba en revision, sigue en revision hasta que alguien
        decida. MARCAR sobre uno ya marcado, o DESMARCAR sobre uno sin marca, es
        409 TRANSICION_INVALIDA. MARCAR y DESMARCAR no se avisan al autor (son
        una nota interna: `autorNotificado: false`); EDITAR si. Cada asiento
        guarda ademas la IP de origen de la peticion (el primer valor de
        `X-Forwarded-For`, o la del socket), que no se devuelve por la API.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CommentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionRequest"
      responses:
        "200":
          description: Comentario resuelto, con su asiento.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionResponse"
        "400":
          description: >
            Falta la accion, el motivo no tiene de 3 a 500 caracteres, o EDITAR
            llega sin `textoNuevo` de 1 a 2000 caracteres.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Sin token.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: El rol no modera.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: No existe.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: >
            La transicion no es valida desde el estado actual (`motivo:
            TRANSICION_INVALIDA`). Cubre el caso de CA-03: otro moderador ya lo
            resolvio mientras este miraba la pantalla, y nada cambia. Tambien
            MARCAR un comentario ya marcado o DESMARCAR uno sin marca.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /comentarios/moderacion/decisiones:
    post:
      summary: Resolver varios comentarios en lote (HU-COM-008, CA-02)
      operationId: resolverComentariosEnLote
      description: >
        Aplica UNA accion con UN motivo a todos los comentarios de
        `comentarioIds`. Es todo o nada: primero se comprueba cada comentario y,
        si alguno no existe o la accion no vale desde su estado actual, se
        rechaza el lote entero (409 `LOTE_RECHAZADO`) sin cambiar ninguno ni
        dejar asiento. Si todos valen, se aplican juntos, cada uno con su
        asiento (quien, cuando, motivo, estado anterior y nuevo, IP de origen).


        El moderador sale del token, nunca del cuerpo. Las reglas de cada
        accion son las de `POST /comentarios/moderacion/{commentId}/decision`;
        EDITAR queda fuera del lote porque cada comentario necesita su propio
        `textoNuevo`. El maximo de comentarios por lote (50 por omision) es
        configurable en el servicio; el contrato fija 50 como tope.


        Una vez confirmado el lote se avisa a cada autor (salvo MARCAR y
        DESMARCAR) y se audita cada asiento; ambos son fail-open, y
        `autorNotificado` de cada resultado dice si el aviso salio.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionEnLoteRequest"
      responses:
        "200":
          description: Todos los comentarios resueltos, en el orden pedido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionEnLoteResponse"
        "400":
          description: >
            Falta la accion o es EDITAR, el motivo no tiene de 3 a 500
            caracteres, la lista esta vacia, trae mas de 50 ids, repite un id o
            trae un id en blanco.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Sin token.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: El rol no modera.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: >
            `motivo: LOTE_RECHAZADO`. Al menos un comentario no existe o no
            admite la accion; no se cambio ninguno. `fallidos` los lista todos
            (no solo el primero) en el orden pedido.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/LoteRechazado"

  /products/{productId}/rating:
    get:
      summary: Resumen de la calificacion de un producto (1.4.0)
      operationId: resumenDeCalificaciones
      description: >
        Promedio, total y distribucion por estrellas, calculados por el
        servidor (la unica fuente de verdad del promedio). Publico: la vitrina
        y la ficha lo muestran sin sesion. Producto sin calificaciones:
        promedio nulo y total 0, nunca 404; producto que no existe en el
        catalogo: 404. Si el catalogo no responde, es una lectura y se degrada
        (HU-DIS-003): se sirve lo que hay en la tabla en vez de fallar.
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Resumen de calificaciones.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumenDeCalificaciones"
        "404":
          $ref: "#/components/responses/ProductoInexistente"
    post:
      summary: Calificar un producto de 1 a 5 estrellas, una sola vez (1.4.0)
      operationId: calificarProducto
      description: >
        El autor sale del token. Una sola calificacion por jugador y producto,
        sin edicion ni retirada (7.1: «solo pueden calificar un producto una
        vez»): la segunda responde 409 `ya-calificado`. No exige escribir un
        comentario. Un jugador sancionado (suspension o baneo) recibe 403.
        La unicidad la decide una restriccion unica de la base: dos peticiones
        simultaneas del mismo jugador dejan una calificacion (201) y la otra
        recibe 409. Si el catalogo o sanciones no responden, 503 y nada
        guardado.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalificacionRequest"
      responses:
        "201":
          description: Calificacion registrada; trae el resumen ya actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalificacionResponse"
        "400":
          description: Estrellas fuera de 1..5.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Sin sesion.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: >
            Jugador sancionado (`type`
            `https://nexusbattles.local/errores/autor-silenciado`, motivo
            AUTOR_SILENCIADO), o un token que no es de usuario.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          $ref: "#/components/responses/ProductoInexistente"
        "409":
          description: >
            El jugador ya califico este producto (`type`
            `https://nexusbattles.local/errores/ya-calificado`, motivo
            CALIFICACION_DUPLICADA).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "503":
          $ref: "#/components/responses/DependenciaNoDisponible"

  /products/{productId}/rating/mia:
    get:
      summary: La calificacion del propio jugador sobre un producto (1.4.0)
      operationId: miCalificacion
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: La calificacion propia.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalificacionResponse"
        "401":
          description: Sin sesion.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: >
            El jugador todavia no califico este producto (`type`
            `https://nexusbattles.local/errores/calificacion-no-encontrada`).
            Es el estado normal de quien aun no ha opinado.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /comentarios/imagenes:
    post:
      summary: Sube una imagen para adjuntarla a un comentario (1.4.0)
      operationId: subirImagenDeComentario
      description: >
        `multipart/form-data` con el campo `archivo`. Se acepta solo si la
        firma de bytes es JPEG, PNG o WebP y su cabecera describe una imagen
        de como maximo 4096x4096; tamano maximo 2 MB. El nombre original se
        descarta: la imagen recibe un UUID y se guarda fuera de cualquier
        carpeta publica. Queda asociada al autor y pendiente hasta que un
        comentario suyo la use; las no usadas en 24 h se borran.


        1.5.0 — ni la extension ni el `Content-Type` que declara el cliente
        cuentan: el tipo lo dice la firma de bytes. Ademas de la firma se
        comprueba, sin decodificar la imagen, que el archivo termine donde su
        formato dice que termina (PNG en su bloque `IEND` con los CRC en orden,
        JPEG en su marcador de fin, WebP en el tamano de su cabecera RIFF): un
        archivo cortado o con otro documento pegado detras (un poliglota) es
        415. La imagen se guarda en la base del servicio, asi que viaja con sus
        respaldos. `COMENTARIOS_FORMATOS_IMAGEN` puede acotar los formatos a un
        subconjunto de los tres.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo:
                  type: string
                  format: binary
      responses:
        "201":
          description: Imagen guardada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImagenSubida"
        "400":
          description: >
            Archivo ausente o vacio (`type`
            `https://nexusbattles.local/errores/imagen-ausente`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Sin sesion.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "413":
          description: >
            Mas de 2 MB, o una cabecera que describe mas de 4096 pixeles en
            algun lado (`type`
            `https://nexusbattles.local/errores/imagen-demasiado-grande`). El
            borde corta antes los cuerpos de mas de 3 MB con su propio 413.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "415":
          description: >
            No es una imagen JPEG, PNG o WebP valida (`type`
            `https://nexusbattles.local/errores/imagen-no-admitida`, motivo
            FORMATO_DE_IMAGEN_NO_ADMITIDO), o la peticion no es multipart.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /comentarios/imagenes/{imagenId}:
    get:
      summary: Descarga una imagen de comentario (1.4.0)
      operationId: obtenerImagenDeComentario
      description: >
        Publica si pertenece a un comentario PUBLICADO; si no, solo para su
        autor y para moderacion. Se sirve con el tipo detectado,
        `X-Content-Type-Options: nosniff`, `Content-Security-Policy:
        default-src 'none'` y `Cache-Control` de larga duracion (el id es
        inmutable).


        1.5.0 — la cache larga (`public, max-age=31536000, immutable`) solo va
        en las publicas; las demas salen con `private, no-store`. Sin token se
        ven solo las publicas (se pintan con un `<img>` normal); con el token
        del autor o de MODERADOR, ADMINISTRADOR o SUPER_ADMINISTRADOR, tambien
        las privadas. Para cualquier otro, una imagen que no puede ver es 404,
        igual que una que no existe: no se dice que existe.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: imagenId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Los bytes de la imagen.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: >
            No existe o no es visible para quien la pide (`type`
            `https://nexusbattles.local/errores/imagen-no-encontrada`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

components:
  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
      description: Identificador del producto comentado.
    CommentId:
      name: commentId
      in: path
      required: true
      schema:
        type: string
      description: Identificador del comentario.
  responses:
    ProductoInexistente:
      description: >
        1.4.0 — `type` `https://nexusbattles.local/errores/producto-inexistente`:
        el producto no existe en el catalogo (se comprueba contra `GET
        /api/v1/productos/{id}`; solo su 404 lo afirma).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    DependenciaNoDisponible:
      description: >
        1.5.0 — una escritura que necesita a otro servicio y no obtuvo
        respuesta: el catalogo de productos (`type`
        `https://nexusbattles.local/errores/catalogo-no-disponible`) o el de
        sanciones (`.../sanciones-no-disponibles`). No se guarda nada a ciegas;
        el cliente reintenta en un momento.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Token de acceso emitido por ms-identidad (RS256, verificado contra su
        JWKS, ADR-002). El autor del comentario es el claim `uid`; el apodo,
        el sujeto (o `preferred_username` con Keycloak). Cualquiera de los
        roles de usuario (JUGADOR, MODERADOR, ADMINISTRADOR,
        SUPER_ADMINISTRADOR) puede publicar; un token de servicio no.
  schemas:
    PublicacionComentarioRequest:
      type: object
      required:
        - texto
      properties:
        autorId:
          type: string
          deprecated: true
          description: >
            Obsoleto desde la 1.1.0: se ignora. El autor es el `uid` del token.
            Se conserva para que un cliente de la 1.0.0 no reciba 400.
        apodoAutor:
          type: string
          deprecated: true
          description: >
            Obsoleto desde la 1.1.0: se ignora. El apodo sale del token.
        texto:
          type: string
          description: >
            Contenido escrito. El largo maximo esta pendiente de definir con el
            Product Owner (issue 34), por eso todavia no se limita aqui.
        imagenes:
          type: array
          items:
            type: string
          maxItems: 3
          description: >
            1.4.0 — `id` de imagenes subidas antes con `POST
            /comentarios/imagenes` por el mismo autor (maximo 3). Un nombre de
            archivo o el id de una imagen ajena responde 400.
        estrellas:
          type: integer
          minimum: 1
          maximum: 5
          description: >
            Calificacion pretendida. Omitir si no se quiere calificar.

    ComentarioResponse:
      type: object
      required:
        - id
        - productoId
        - autorId
        - apodoAutor
        - texto
        - fechaPublicacion
        - estado
      properties:
        id:
          type: string
        productoId:
          type: string
        autorId:
          type: string
        apodoAutor:
          type: string
        texto:
          type: string
        imagenes:
          type: array
          items:
            type: string
          description: >
            1.5.0 — los `id` de sus imagenes, que se descargan en
            `GET /comentarios/imagenes/{id}`. Los comentarios anteriores a la
            1.4.0 pueden traer aqui los nombres de archivo que se guardaban
            entonces, sin imagen detras.
        estrellas:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 5
          description: >
            1.5.0 — las estrellas de la calificacion de su autor sobre el
            producto (el comentario ya no guarda estrellas propias); nulo si el
            autor no ha calificado. En las respuestas de moderacion va nulo: la
            calificacion no es contenido que se modere.
        fechaPublicacion:
          type: string
          format: date-time
        estado:
          $ref: "#/components/schemas/EstadoDeComentario"
        calificacionDescartada:
          type: boolean
          default: false
          description: >
            (1.2.0) `true` en la respuesta de publicar cuando las estrellas que
            venían se descartaron porque el jugador ya había calificado el
            producto (RF-COM-002, D-07). El comentario entró igual. En el hilo
            siempre `false`.
        editado:
          type: boolean
          default: false
          description: >
            1.5.0 — un moderador cambio su texto (EDITAR, 7.3.3). Publico: quien
            lo lee tiene que saber que ese texto no es exactamente el que
            escribio su autor.
        marcado:
          type: boolean
          description: >
            1.5.0 — marcado para seguimiento especial (MARCAR, 7.3.3). Solo en
            las respuestas de moderacion; el hilo publico no lo trae.

    HiloDeComentariosResponse:
      type: object
      required:
        - productoId
        - comentarios
        - total
        - totalCalificaciones
      properties:
        productoId:
          type: string
        comentarios:
          type: array
          description: >
            Solo los PUBLICADOS de la pagina pedida, del mas reciente al mas
            antiguo (1.4.0; hasta la 1.3.0, todos y al reves).
          items:
            $ref: "#/components/schemas/ComentarioResponse"
        pagina:
          type: integer
          description: 1.5.0 — la pagina servida, desde 0.
        tamano:
          type: integer
          description: 1.5.0 — el tamano de pagina que se aplico (el pedido, recortado a 50).
        total:
          type: integer
          description: >
            Cuantos comentarios publicados tiene el producto en todas las
            paginas (1.5.0; con una sola pagina, lo mismo que antes).
        totalPaginas:
          type: integer
          description: 1.5.0 — cuantas paginas hay con ese tamano; 0 si no hay comentarios.
        calificacionPromedio:
          type:
            - number
            - "null"
          minimum: 1
          maximum: 5
          description: >
            1.5.0 — el promedio de todas las calificaciones del producto, con un
            decimal: el mismo numero que `promedio` en `GET
            /products/{productId}/rating`, de la misma tabla. Nulo si nadie ha
            calificado: la ficha debe mostrar "sin valoraciones", no un cero.
        totalCalificaciones:
          type: integer
          description: 1.5.0 — cuantas calificaciones tiene el producto (el `total` del resumen).

    ReporteRequest:
      type: object
      required:
        - categoria
      properties:
        categoria:
          $ref: "#/components/schemas/CategoriaDeReporte"
        descripcion:
          type: string
          maxLength: 500
          description: Motivo en palabras del reportante. Opcional (ficha RF-COM-006).

    CategoriaDeReporte:
      type: string
      description: >
        Las seis categorias de la ficha RF-COM-006, en su orden. No es una
        lista abierta: ampliarla es cambiar el requisito, no la API.
      enum:
        - SPAM
        - CONTENIDO_OFENSIVO
        - ACOSO
        - INFORMACION_FALSA
        - CONTENIDO_INAPROPIADO
        - VIOLACION_DE_DERECHOS

    ReporteResponse:
      type: object
      required:
        - id
        - comentarioId
        - categoria
        - fecha
        - estadoDelComentario
        - reportesTotales
      properties:
        id:
          type: string
        comentarioId:
          type: string
        categoria:
          $ref: "#/components/schemas/CategoriaDeReporte"
        descripcion:
          type: string
        fecha:
          type: string
          format: date-time
        estadoDelComentario:
          $ref: "#/components/schemas/EstadoDeComentario"
        reportesTotales:
          type: integer
          description: >
            Cuantos reportes acumula el comentario despues de este. Es lo que
            ordena la cola del moderador.
        prioridadElevada:
          type: boolean
          description: >
            1.6.0 — presente en la respuesta del POST; no aplica en el detalle
            de moderacion. `true` si el comentario alcanzo el umbral de
            prioridad elevada; `false` si no o si no hay umbral configurado.

    EstadoDeComentario:
      type: string
      description: >
        OCULTO entra en la 1.3.0: RF-COM-008 exige que "Ocultar preserve el
        registro en base de datos, a diferencia de Eliminar", asi que no puede
        ser el mismo estado. ELIMINADO sigue siendo terminal; OCULTO se
        revierte con RESTAURAR.
      enum:
        - PUBLICADO
        - EN_REVISION
        - OCULTO
        - ELIMINADO

    AccionDeModeracion:
      type: string
      description: >
        EDITAR, MARCAR y DESMARCAR entran en la 1.4.0 (7.3.3: «Editar: modificar
        contenido inapropiado manteniendo el contexto del comentario (con
        registro de la edicion)»; «Marcar: senalar comentarios para seguimiento
        especial»). EDITAR exige `textoNuevo` y guarda el anterior en el asiento.
      enum:
        - APROBAR
        - OCULTAR
        - ELIMINAR
        - RESTAURAR
        - EDITAR
        - MARCAR
        - DESMARCAR

    DecisionRequest:
      type: object
      required:
        - accion
        - motivo
      properties:
        accion:
          $ref: "#/components/schemas/AccionDeModeracion"
        motivo:
          type: string
          minLength: 3
          maxLength: 500
          description: >
            Obligatorio en TODAS las acciones, incluida APROBAR: por que se
            dejo pasar es tan parte de la trazabilidad como por que se retiro.
        textoNuevo:
          type: string
          minLength: 1
          maxLength: 2000
          description: >
            1.4.0 — obligatorio con EDITAR; el texto que queda visible. En las
            demas acciones se ignora.

    AsientoDeModeracion:
      type: object
      description: >
        Lo que queda escrito de cada accion (7.3.3: usuario, fecha, motivo,
        estado anterior y nuevo). Desde la 1.5.0 el servicio guarda ademas la IP
        de origen de la peticion, para auditoria; no se devuelve aqui, porque
        el historial lo leen otros moderadores.
      required:
        - id
        - accion
        - moderadorId
        - apodoModerador
        - motivo
        - estadoAnterior
        - estadoNuevo
        - fecha
      properties:
        id:
          type: string
        accion:
          $ref: "#/components/schemas/AccionDeModeracion"
        moderadorId:
          type: string
          description: El `uid` del token, nunca un campo del cuerpo.
        apodoModerador:
          type: string
        motivo:
          type: string
        estadoAnterior:
          $ref: "#/components/schemas/EstadoDeComentario"
        estadoNuevo:
          $ref: "#/components/schemas/EstadoDeComentario"
        fecha:
          type: string
          format: date-time
        textoAnterior:
          type: [string, "null"]
          description: 1.4.0 — solo en EDITAR.
        textoNuevo:
          type: [string, "null"]
          description: 1.4.0 — solo en EDITAR.

    DecisionResponse:
      type: object
      required:
        - comentario
        - asiento
      properties:
        comentario:
          $ref: "#/components/schemas/ComentarioResponse"
        asiento:
          $ref: "#/components/schemas/AsientoDeModeracion"
        autorNotificado:
          type: boolean
          description: >
            Si el aviso al autor salio. `false` no invalida la decision: la
            notificacion es fail-open a proposito (HU-DIS-003), porque un
            servicio de avisos caido no puede impedir que se retire un
            comentario ofensivo.

    DecisionEnLoteRequest:
      type: object
      required:
        - accion
        - motivo
        - comentarioIds
      properties:
        accion:
          type: string
          description: Cualquiera de `AccionDeModeracion` salvo EDITAR.
          enum:
            - APROBAR
            - OCULTAR
            - ELIMINAR
            - RESTAURAR
            - MARCAR
            - DESMARCAR
        motivo:
          type: string
          minLength: 3
          maxLength: 500
          description: El mismo para todo el lote; queda en cada asiento.
        comentarioIds:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            minLength: 1
            pattern: "\\S"
          description: Sin repetidos ni ids en blanco.

    ResultadoDeLote:
      type: object
      required:
        - comentario
        - asiento
        - autorNotificado
      properties:
        comentario:
          $ref: "#/components/schemas/ComentarioResponse"
        asiento:
          $ref: "#/components/schemas/AsientoDeModeracion"
        autorNotificado:
          type: boolean
          description: Como en `DecisionResponse`; `false` no invalida la decision.

    DecisionEnLoteResponse:
      type: object
      required:
        - total
        - resultados
      properties:
        total:
          type: integer
          minimum: 1
        resultados:
          type: array
          items:
            $ref: "#/components/schemas/ResultadoDeLote"

    FalloDeLote:
      type: object
      required:
        - comentarioId
        - motivo
        - detalle
      properties:
        comentarioId:
          type: string
        motivo:
          type: string
          enum:
            - COMENTARIO_NO_ENCONTRADO
            - TRANSICION_INVALIDA
        detalle:
          type: string

    LoteRechazado:
      description: >
        ProblemDetail con `motivo: LOTE_RECHAZADO` y la lista de comentarios
        que impidieron aplicar el lote.
      allOf:
        - $ref: "#/components/schemas/ProblemDetail"
        - type: object
          required:
            - fallidos
          properties:
            fallidos:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/FalloDeLote"

    EntradaDeCola:
      type: object
      required:
        - comentario
        - reportes
        - primerReporte
        - prioridadElevada
      properties:
        comentario:
          $ref: "#/components/schemas/ComentarioResponse"
        reportes:
          type: integer
          description: Cuantas personas distintas lo reportaron.
        prioridadElevada:
          type: boolean
          description: >
            1.6.0 — siempre presente. `true` si el comentario alcanzo el umbral
            de prioridad elevada; `false` si no o si no hay umbral configurado.
        porCategoria:
          type: object
          additionalProperties:
            type: integer
          description: Reportes agrupados por categoria, para ver de que se le acusa.
        primerReporte:
          type: string
          format: date-time
          description: Desempata la cola a igualdad de reportes.

    ColaDeModeracionResponse:
      type: object
      required:
        - entradas
        - total
        - pagina
        - tamano
      properties:
        entradas:
          type: array
          items:
            $ref: "#/components/schemas/EntradaDeCola"
        total:
          type: integer
          description: Cuantos comentarios hay en revision en total, no en esta pagina.
        pagina:
          type: integer
        tamano:
          type: integer

    DetalleDeModeracionResponse:
      type: object
      required:
        - comentario
        - reportes
        - historial
      properties:
        comentario:
          $ref: "#/components/schemas/ComentarioResponse"
        reportes:
          type: array
          items:
            $ref: "#/components/schemas/ReporteResponse"
        historial:
          type: array
          description: Acciones de moderacion ya aplicadas, de la mas antigua a la mas reciente.
          items:
            $ref: "#/components/schemas/AsientoDeModeracion"

    CalificacionRequest:
      type: object
      required: [estrellas]
      properties:
        estrellas:
          type: integer
          minimum: 1
          maximum: 5

    CalificacionResponse:
      type: object
      required: [productoId, estrellas, fecha]
      properties:
        productoId:
          type: string
        estrellas:
          type: integer
          minimum: 1
          maximum: 5
        fecha:
          type: string
          format: date-time
        resumen:
          $ref: "#/components/schemas/ResumenDeCalificaciones"

    ResumenDeCalificaciones:
      type: object
      required: [productoId, total, distribucion]
      properties:
        productoId:
          type: string
        promedio:
          type: [number, "null"]
          description: Con un decimal; nulo si nadie ha calificado.
        total:
          type: integer
        distribucion:
          type: object
          description: Cuantas calificaciones hay de cada numero de estrellas.
          required: ["1", "2", "3", "4", "5"]
          properties:
            "1":
              type: integer
            "2":
              type: integer
            "3":
              type: integer
            "4":
              type: integer
            "5":
              type: integer

    ImagenSubida:
      type: object
      required: [id, tipo, tamano, url]
      properties:
        id:
          type: string
          format: uuid
        tipo:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        tamano:
          type: integer
          description: Bytes.
        url:
          type: string
          description: Ruta publica relativa (`/api/v1/comentarios/imagenes/{id}`), nunca una ruta de disco.

    ProblemDetail:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        motivo:
          type: string
          enum:
            - AUTOR_SILENCIADO
            - FORMATO_DE_IMAGEN_NO_ADMITIDO
            - CALIFICACION_DUPLICADA
            - REPORTE_DUPLICADO
            - LIMITE_DE_REPORTES
            - TRANSICION_INVALIDA
            - LOTE_RECHAZADO
          description: >
            Presente en los rechazos que el cliente tiene que distinguir sin
            interpretar el texto del detalle. `AUTOR_SILENCIADO` en el 403 de
            publicar y calificar; `CALIFICACION_DUPLICADA` en el 409
            `ya-calificado` de `POST /products/{productId}/rating` (1.5.0;
            publicar un comentario ya no lo usa desde la 1.2.0);
            `FORMATO_DE_IMAGEN_NO_ADMITIDO` en el 415 de la subida de imagenes
            (1.5.0; publicar ya no responde 422).
