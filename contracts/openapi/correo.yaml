openapi: 3.1.0
info:
  title: Nexus Battles VI - Correo corporativo (M15)
  description: >
    API para que cualquier microservicio dispare el envio de un correo. Todos
    los correos se construyen sobre la plantilla corporativa unica (HU-COR-001),
    por lo que el llamante nunca envia HTML: solo el tipo de correo y sus datos.

    Un endpoint por tipo de correo, no uno generico: asi el contrato valida que
    lleguen los datos que esa plantilla necesita. Anadir tipos nuevos es anadir
    rutas, que es un cambio compatible y no rompe a quien ya consume.

    **1.4.0 (B0/B1 — correo durable).** Un `202` significa desde ahora
    «**guardado** en la cola persistente del servicio», no «entregado al
    SMTP»: cada peticion aceptada queda en la tabla de envios (PostgreSQL,
    esquema `correo`) antes de responder, y un trabajador la entrega con
    reintentos y espera exponencial (estados `PENDIENTE`, `ENVIANDO`,
    `ENVIADO`, `ERROR_REINTENTABLE`, `FALLIDO`, `DESVIADO` y `OMITIDO`). Un
    reinicio o una caida del proveedor ya no pierden correos. Cabecera
    opcional `Idempotency-Key`: la misma clave dos veces no encola dos
    correos. Nuevo: `POST /correos/sancion` (7.3.2: la suspension y el baneo
    se notifican al correo) y `GET /correos/envios` (existia sin contrato).
    El remitente sale de `MAIL_FROM` (variable del entorno), nunca de un
    valor versionado.

    Consumidores: ms-identidad (registro, confirmacion de cuenta, aviso de
    acceso y recuperacion de contrasena), misiones y subastas (correos de
    evento segun preferencia del jugador), y desde la 1.3.0 ms-finanzas
    (confirmacion de compra tras aprobar un pago, HU-PAG-003).

    Desde la 1.1.0 toda ruta exige una credencial de servicio (ADR-001 via el
    emisor transitorio de ADR-005): `Authorization: Bearer` con un token de
    `rol=SERVICIO`. Sin credencial responde 401; con un token de usuario, 403:
    correo es un servicio entre servicios y nunca lo llama un navegador. Por
    eso el borde tampoco expone `/api/v1/correos`. Es version menor porque
    rutas y cuerpos no cambian.
  version: 1.4.0
servers:
  - url: http://localhost:8082/api/v1
    description: Entorno local de desarrollo
security:
  - servicio: []

paths:
  /correos/bienvenida:
    post:
      summary: Enviar el correo de bienvenida tras completar el registro
      operationId: enviarCorreoBienvenida
      parameters:
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorreoBienvenidaRequest'
      responses:
        '202':
          description: >
            Correo guardado en la cola persistente (1.4.0); lo entrega el trabajador con reintentos. No garantiza que haya
            llegado a la bandeja del destinatario.
        '400':
          $ref: '#/components/responses/SolicitudInvalida'

  /correos/aviso-acceso:
    post:
      summary: Avisar de un acceso desde dispositivo o ubicacion no reconocidos
      description: Soporta RF-AUT-010. Lo dispara ms-identidad desde LoginService.
      operationId: enviarCorreoAvisoAcceso
      parameters:
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorreoAvisoAccesoRequest'
      responses:
        '202':
          description: Correo guardado en la cola persistente (1.4.0); lo entrega el trabajador con reintentos.
        '400':
          $ref: '#/components/responses/SolicitudInvalida'

  /correos/cambio-clave:
    post:
      summary: Avisar de que la contrasena de la cuenta cambio
      description: |
        Soporta HU-AUT-006 (RF-AUT-006, CA-01): tras un cambio de contrasena
        desde «Mi Cuenta», el usuario recibe un aviso sobre la plantilla
        corporativa. No lleva la contrasena, ni la vieja ni la nueva: solo
        que cambio, desde donde y cuando, para que quien NO lo hizo reaccione
        (recuperar la cuenta por el flujo de «olvide mi contrasena»).
        Lo dispara ms-identidad desde CambioDePasswordService.
      operationId: enviarCorreoCambioClave
      parameters:
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorreoCambioClaveRequest'
      responses:
        '202':
          description: Correo guardado en la cola persistente (1.4.0); lo entrega el trabajador con reintentos.
        '400':
          $ref: '#/components/responses/SolicitudInvalida'

  /correos/confirmacion-cuenta:
    post:
      summary: Enviar el codigo de vigencia limitada para confirmar una cuenta nueva
      description: >
        Soporta HU-COR-002 (RNF-COR-002). Este servicio SOLO envia el correo
        sobre la plantilla corporativa: generar el codigo de forma segura,
        guardarlo con su caducidad, validarlo, invalidar el anterior al
        reenviar y bloquear tras varios intentos fallidos son responsabilidad
        de ms-identidad, que es quien deja la cuenta pendiente de
        verificacion (identidad y control de acceso estan fuera del alcance
        del Equipo 6, project-charter.md).
      operationId: enviarCorreoConfirmacionCuenta
      parameters:
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorreoConfirmacionCuentaRequest'
      responses:
        '202':
          description: Correo guardado en la cola persistente (1.4.0); lo entrega el trabajador con reintentos.
        '400':
          $ref: '#/components/responses/SolicitudInvalida'

  /correos/recuperacion-clave:
    post:
      summary: Enviar el codigo de un solo uso para recuperar la contrasena
      description: >
        Soporta HU-COR-003. Este servicio SOLO envia el correo: generar,
        guardar, validar e invalidar el codigo son responsabilidad de
        ms-identidad, porque identidad y control de acceso estan fuera del
        alcance del Equipo 6 (project-charter.md).
      operationId: enviarCorreoRecuperacionClave
      parameters:
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorreoRecuperacionClaveRequest'
      responses:
        '202':
          description: Correo guardado en la cola persistente (1.4.0); lo entrega el trabajador con reintentos.
        '400':
          $ref: '#/components/responses/SolicitudInvalida'

  /correos/mision:
    post:
      summary: Enviar el correo de un evento de misiones, segun la preferencia del jugador
      description: >
        Soporta HU-COR-005. Este servicio no decide que se notifica ni si
        corresponde enviar correo: eso ya lo resolvio el modulo de misiones,
        incluida la preferencia del jugador (solo dentro de la app, o
        categoria apagada). Si debeEnviarCorreo es false, se responde 202
        igual pero no se envia nada; el registro de esa supresion es
        responsabilidad de quien llama.
      operationId: enviarCorreoMision
      parameters:
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorreoMisionRequest'
      responses:
        '202':
          description: >
            Correo aceptado y entregado al servidor SMTP, o suprimido a
            proposito porque debeEnviarCorreo era false.
        '400':
          $ref: '#/components/responses/SolicitudInvalida'

  /correos/subasta:
    post:
      summary: Enviar el correo de un evento de subastas, segun la preferencia del jugador
      description: >
        Soporta HU-COR-005. Mismo criterio que /correos/mision: el modulo de
        subastas ya decidio que se notifica y si corresponde enviar correo.
      operationId: enviarCorreoSubasta
      parameters:
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorreoSubastaRequest'
      responses:
        '202':
          description: >
            Correo aceptado y entregado al servidor SMTP, o suprimido a
            proposito porque debeEnviarCorreo era false.
        '400':
          $ref: '#/components/responses/SolicitudInvalida'

  /correos/confirmacion-compra:
    post:
      summary: Enviar la confirmacion de un pago ya aprobado
      description: >
        Soporta HU-PAG-003 (issue #537). Lo dispara ms-finanzas (Grupo
        4/Cuentas) tras aprobar el pago en su pasarela simulada. Este
        servicio no valida el monto ni conoce la transaccion: solo la
        transcribe al correo sobre la plantilla corporativa.
      operationId: enviarCorreoConfirmacionCompra
      parameters:
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorreoConfirmacionCompraRequest'
      responses:
        '202':
          description: Correo guardado en la cola persistente (1.4.0); lo entrega el trabajador con reintentos.
        '400':
          $ref: '#/components/responses/SolicitudInvalida'

  /correos/sancion:
    post:
      summary: Notificar una sancion al correo del jugador (7.3.2)
      description: >
        Lo dispara moderacion-sanciones al emitir una advertencia, una
        suspension temporal o un baneo definitivo, y al resolver una apelacion.
        El documento del curso exige «notificacion automatica al correo» de la
        suspension y «notificacion formal» del baneo.
      operationId: enviarCorreoSancion
      x-implementacion: pendiente
      x-fase: B2
      parameters:
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorreoSancionRequest'
      responses:
        '202':
          description: Correo guardado en la cola persistente.
        '400':
          $ref: '#/components/responses/SolicitudInvalida'

  /correos/envios:
    get:
      summary: Estado de la entrega y ultimos envios (diagnostico)
      description: >
        Existia sin contrato (auditoria contractual, B0). Desde 1.4.0 lee la
        tabla persistente: los contadores y la lista ya no se pierden al
        reiniciar. Los destinatarios salen enmascarados (`v***a@dominio`).
        Token de servicio, o de persona con rol ADMINISTRADOR o
        SUPER_ADMINISTRADOR.
      operationId: consultarEnviosDeCorreo
      parameters:
        - name: ultimos
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: estado
          in: query
          required: false
          description: Filtra por estado del envio (1.4.0).
          schema:
            type: string
            enum: [PENDIENTE, ENVIANDO, ENVIADO, ERROR_REINTENTABLE, FALLIDO, DESVIADO, OMITIDO]
      responses:
        '200':
          description: Estado de la entrega.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoDeEntrega'

components:
  securitySchemes:
    servicio:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Credencial de servicio (client_credentials contra ms-identidad,
        ADR-005): `sub` y `azp` = client_id del servicio que llama,
        `rol=SERVICIO`. Se verifica contra el JWKS de ms-identidad.

  parameters:
    TraceId:
      name: X-Trace-Id
      in: header
      required: false
      description: >
        Identificador de traza para correlacionar la peticion entre servicios
        (regla 5 de plataforma). Si no se envia, el servicio genera uno propio.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        1.4.0 — clave del productor para no encolar dos veces el mismo correo
        al reintentar una llamada que agoto su tiempo. Misma clave, mismo
        envio (se responde 202 sin encolar otro).
      schema:
        type: string
        maxLength: 120

  responses:
    SolicitudInvalida:
      description: Faltan datos obligatorios o el correo no tiene formato valido
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

  schemas:
    CorreoBienvenidaRequest:
      type: object
      required:
        - email
        - apodo
      properties:
        email:
          type: string
          format: email
          description: Destinatario
          examples: ['jugador@ejemplo.com']
        apodo:
          type: string
          minLength: 1
          description: Nombre visible del jugador; encabeza el saludo
          examples: ['ElGuerrero']
        nombres:
          type: string
          description: Opcional. Si viene, el saludo lo usa en lugar del apodo.
        apellidos:
          type: string
          description: Opcional.

    CorreoAvisoAccesoRequest:
      type: object
      required:
        - email
        - apodo
        - ip
        - fechaHora
      properties:
        email:
          type: string
          format: email
        apodo:
          type: string
          minLength: 1
        ip:
          type: string
          description: IP de origen del acceso, tal como la observo ms-identidad
          examples: ['190.85.12.44']
        fechaHora:
          type: string
          format: date-time
          description: Momento del acceso en ISO-8601 con zona horaria
          examples: ['2026-08-30T14:23:11-05:00']

    CorreoCambioClaveRequest:
      type: object
      description: Misma forma que el aviso de acceso; nunca lleva contrasenas.
      required:
        - email
        - apodo
        - ip
        - fechaHora
      properties:
        email:
          type: string
          format: email
        apodo:
          type: string
          minLength: 1
        ip:
          type: string
          description: IP desde la que se hizo el cambio, tal como la observo ms-identidad
          examples: ['190.85.12.44']
        fechaHora:
          type: string
          format: date-time
          description: Momento del cambio en ISO-8601 con zona horaria
          examples: ['2026-09-21T15:00:00-05:00']

    CorreoConfirmacionCuentaRequest:
      type: object
      required:
        - email
        - apodo
        - codigo
        - minutosVigencia
      properties:
        email:
          type: string
          format: email
          description: Destinatario, el correo que se esta verificando
          examples: ['jugador@ejemplo.com']
        apodo:
          type: string
          minLength: 1
          examples: ['ElGuerrero']
        codigo:
          type: string
          minLength: 1
          maxLength: 12
          description: >
            Codigo de confirmacion ya generado por ms-identidad. Este servicio
            no lo genera ni lo valida: solo lo transcribe al correo. Tampoco se
            registra en la bitacora, para no filtrarlo.
          examples: ['482915']
        minutosVigencia:
          type: integer
          minimum: 1
          description: >
            Minutos de validez del codigo desde su emision. Lo envia quien lo
            genero (configurable alli por variable de entorno) en lugar de
            fijarlo aqui: asi el correo nunca promete un plazo distinto del
            real.
          examples: [15]
        proposito:
          type: string
          enum: [ACTIVACION, VERIFICACION]
          default: ACTIVACION
          description: >
            1.4.0 — `VERIFICACION`: autorregistro de un jugador; el enlace lleva
            a `{PUBLIC_BASE_URL}/verificar`. `ACTIVACION` (por omision, lo que
            ya enviaba ms-identidad): cuenta creada por un Super
            Administrador; el enlace lleva a `{PUBLIC_BASE_URL}/restablecer`
            para fijar su propia contrasena. En los dos casos el codigo y el
            correo viajan en el fragmento (`#codigo=...&correo=...`), que el
            navegador no envia a ningun servidor ni queda en la bitacora del
            borde.

    CorreoRecuperacionClaveRequest:
      type: object
      required:
        - email
        - apodo
        - codigo
        - minutosVigencia
      properties:
        email:
          type: string
          format: email
        apodo:
          type: string
          minLength: 1
        codigo:
          type: string
          minLength: 1
          maxLength: 12
          description: >
            Codigo de un solo uso ya generado por ms-identidad. Este servicio no
            lo genera ni lo valida: solo lo transcribe al correo. Tampoco se
            registra en la bitacora, para no filtrarlo.
          examples: ['482915']
        minutosVigencia:
          type: integer
          minimum: 1
          description: >
            Minutos que le quedan de validez al codigo. Lo envia quien lo genero
            en lugar de fijarlo aqui: asi el correo nunca miente si ms-identidad
            cambia el plazo.
          examples: [15]

    CorreoMisionRequest:
      type: object
      required:
        - email
        - apodo
        - asunto
        - mensaje
        - debeEnviarCorreo
      properties:
        email:
          type: string
          format: email
        apodo:
          type: string
          minLength: 1
        asunto:
          type: string
          minLength: 1
          description: Asunto del correo. Lo decide misiones, no este servicio.
          examples: ['Nueva misión disponible: Derrota al Dragón']
        mensaje:
          type: string
          minLength: 1
          description: Cuerpo del mensaje. Se muestra tal cual sobre la plantilla corporativa.
        debeEnviarCorreo:
          type: boolean
          description: >
            false si el jugador pidio avisos solo dentro de la aplicacion, o
            si apago los correos de esta categoria (CA-02/CA-03). No es un
            error: el servicio responde 202 igual, sin enviar nada.

    CorreoSubastaRequest:
      type: object
      required:
        - email
        - apodo
        - asunto
        - mensaje
        - debeEnviarCorreo
      properties:
        email:
          type: string
          format: email
        apodo:
          type: string
          minLength: 1
        asunto:
          type: string
          minLength: 1
          examples: ['Ganaste la subasta de Espada Legendaria']
        mensaje:
          type: string
          minLength: 1
        debeEnviarCorreo:
          type: boolean
          description: Mismo criterio que en CorreoMisionRequest.

    CorreoConfirmacionCompraRequest:
      type: object
      description: >
        Misma forma que Transaccion en ms-finanzas (monto/moneda/concepto),
        para que el llamante no tenga que traducir entre convenciones.
      required:
        - email
        - apodo
        - monto
        - moneda
        - concepto
        - fechaHora
      properties:
        email:
          type: string
          format: email
        apodo:
          type: string
          minLength: 1
        monto:
          type: number
          format: decimal
          exclusiveMinimum: 0
          examples: [50000.00]
        moneda:
          type: string
          pattern: '^[A-Z]{3}$'
          description: Codigo ISO 4217 en mayusculas
          examples: ['COP']
        concepto:
          type: string
          minLength: 1
          examples: ['Paquete de créditos x500']
        fechaHora:
          type: string
          format: date-time
          description: Momento en que la pasarela aprobo el pago, en ISO-8601 con zona horaria
          examples: ['2026-09-23T10:15:00-05:00']
        lineas:
          type: array
          description: >
            1.4.0 — detalle de los productos comprados (7.5: «correo electronico
            de confirmacion de compra con el detalle de los productos adquiridos y
            el total pagado»). Opcional por compatibilidad.
          items:
            type: object
            required: [nombre, cantidad, subtotal]
            properties:
              nombre:
                type: string
              cantidad:
                type: integer
              precioUnitario:
                type: number
              subtotal:
                type: number
        orden:
          type: string
          description: 1.4.0 — identificador de la orden, para la referencia del correo.


    CorreoSancionRequest:
      type: object
      required: [email, apodo, tipo, motivo]
      properties:
        email:
          type: string
          format: email
        apodo:
          type: string
        tipo:
          type: string
          enum: [ADVERTENCIA, SUSPENSION, BANEO, APELACION_RESUELTA]
        motivo:
          type: string
          description: Causal documentada (7.3.2 «Causales de sancion»).
        hasta:
          type: [string, 'null']
          format: date-time
          description: Fin de la suspension (solo SUSPENSION).
        apelableHasta:
          type: [string, 'null']
          format: date-time
          description: Ultimo dia para apelar (30 dias, 7.3.2).
        resultadoApelacion:
          type: [string, 'null']
          enum: [MANTENIDA, REDUCIDA, REVERTIDA, null]

    EstadoDeEntrega:
      type: object
      properties:
        servidor:
          type: string
        puerto:
          type: integer
        autentica:
          type: boolean
        tls:
          type: boolean
        buzonDePruebas:
          type: boolean
        desvioDePruebas:
          type: string
        remitente:
          type: string
        aceptados:
          type: integer
          format: int64
        desviados:
          type: integer
          format: int64
        rechazados:
          type: integer
          format: int64
        omitidos:
          type: integer
          format: int64
        pendientes:
          type: integer
          format: int64
          description: 1.4.0 — en cola o esperando reintento.
        recientes:
          type: array
          items:
            $ref: '#/components/schemas/EnvioRegistrado'

    EnvioRegistrado:
      type: object
      properties:
        instante:
          type: string
          format: date-time
        destinatario:
          type: string
          description: Enmascarado desde 1.4.0.
        plantilla:
          type: string
        estado:
          type: string
        destino:
          type: string
          description: PROVEEDOR o BUZON_DE_PRUEBAS.
        identificador:
          type: [string, 'null']
        motivo:
          type: [string, 'null']
        intentos:
          type: integer
          description: 1.4.0

    ProblemDetail:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
