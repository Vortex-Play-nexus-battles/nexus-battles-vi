openapi: 3.1.0
info:
  title: Nexus Battles VI - Correo corporativo (M15)
  description: >
    API para que cualquier microservicio dispare el envio de un correo. Todos
    los correos se construyen sobre la plantilla corporativa unica (HU-COR-001),
    por lo que el llamante nunca envia HTML: solo el tipo de correo y sus datos.

    Un endpoint por tipo de correo, no uno generico: asi el contrato valida que
    lleguen los datos que esa plantilla necesita. Anadir tipos nuevos es anadir
    rutas, que es un cambio compatible y no rompe a quien ya consume.

    Consumidores: ms-identidad (registro, confirmacion de cuenta, aviso de
    acceso y recuperacion de contrasena), y en Sprint 2 misiones y subastas
    (correos de evento segun preferencia del jugador).

    Desde la 1.1.0 toda ruta exige una credencial de servicio (ADR-001 via el
    emisor transitorio de ADR-005): `Authorization: Bearer` con un token de
    `rol=SERVICIO`. Sin credencial responde 401; con un token de usuario, 403:
    correo es un servicio entre servicios y nunca lo llama un navegador. Por
    eso el borde tampoco expone `/api/v1/correos`. Es version menor porque
    rutas y cuerpos no cambian.
  version: 1.2.0
servers:
  - url: http://localhost:8082/api/v1
    description: Entorno local de desarrollo
security:
  - servicio: []

paths:
  /correos/bienvenida:
    post:
      summary: Enviar el correo de bienvenida tras completar el registro
      operationId: enviarCorreoBienvenida
      parameters:
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorreoBienvenidaRequest'
      responses:
        '202':
          description: >
            Correo aceptado y entregado al servidor SMTP. No garantiza que haya
            llegado a la bandeja del destinatario.
        '400':
          $ref: '#/components/responses/SolicitudInvalida'

  /correos/aviso-acceso:
    post:
      summary: Avisar de un acceso desde dispositivo o ubicacion no reconocidos
      description: Soporta RF-AUT-010. Lo dispara ms-identidad desde LoginService.
      operationId: enviarCorreoAvisoAcceso
      parameters:
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorreoAvisoAccesoRequest'
      responses:
        '202':
          description: Correo aceptado y entregado al servidor SMTP.
        '400':
          $ref: '#/components/responses/SolicitudInvalida'

  /correos/cambio-clave:
    post:
      summary: Avisar de que la contrasena de la cuenta cambio
      description: |
        Soporta HU-AUT-006 (RF-AUT-006, CA-01): tras un cambio de contrasena
        desde «Mi Cuenta», el usuario recibe un aviso sobre la plantilla
        corporativa. No lleva la contrasena, ni la vieja ni la nueva: solo
        que cambio, desde donde y cuando, para que quien NO lo hizo reaccione
        (recuperar la cuenta por el flujo de «olvide mi contrasena»).
        Lo dispara ms-identidad desde CambioDePasswordService.
      operationId: enviarCorreoCambioClave
      parameters:
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorreoCambioClaveRequest'
      responses:
        '202':
          description: Correo aceptado y entregado al servidor SMTP.
        '400':
          $ref: '#/components/responses/SolicitudInvalida'

  /correos/confirmacion-cuenta:
    post:
      summary: Enviar el codigo de vigencia limitada para confirmar una cuenta nueva
      description: >
        Soporta HU-COR-002 (RNF-COR-002). Este servicio SOLO envia el correo
        sobre la plantilla corporativa: generar el codigo de forma segura,
        guardarlo con su caducidad, validarlo, invalidar el anterior al
        reenviar y bloquear tras varios intentos fallidos son responsabilidad
        de ms-identidad, que es quien deja la cuenta pendiente de
        verificacion (identidad y control de acceso estan fuera del alcance
        del Equipo 6, project-charter.md).
      operationId: enviarCorreoConfirmacionCuenta
      parameters:
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorreoConfirmacionCuentaRequest'
      responses:
        '202':
          description: Correo aceptado y entregado al servidor SMTP.
        '400':
          $ref: '#/components/responses/SolicitudInvalida'

  /correos/recuperacion-clave:
    post:
      summary: Enviar el codigo de un solo uso para recuperar la contrasena
      description: >
        Soporta HU-COR-003. Este servicio SOLO envia el correo: generar,
        guardar, validar e invalidar el codigo son responsabilidad de
        ms-identidad, porque identidad y control de acceso estan fuera del
        alcance del Equipo 6 (project-charter.md).
      operationId: enviarCorreoRecuperacionClave
      parameters:
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorreoRecuperacionClaveRequest'
      responses:
        '202':
          description: Correo aceptado y entregado al servidor SMTP.
        '400':
          $ref: '#/components/responses/SolicitudInvalida'

  /correos/mision:
    post:
      summary: Enviar el correo de un evento de misiones, segun la preferencia del jugador
      description: >
        Soporta HU-COR-005. Este servicio no decide que se notifica ni si
        corresponde enviar correo: eso ya lo resolvio el modulo de misiones,
        incluida la preferencia del jugador (solo dentro de la app, o
        categoria apagada). Si debeEnviarCorreo es false, se responde 202
        igual pero no se envia nada; el registro de esa supresion es
        responsabilidad de quien llama.
      operationId: enviarCorreoMision
      parameters:
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorreoMisionRequest'
      responses:
        '202':
          description: >
            Correo aceptado y entregado al servidor SMTP, o suprimido a
            proposito porque debeEnviarCorreo era false.
        '400':
          $ref: '#/components/responses/SolicitudInvalida'

  /correos/subasta:
    post:
      summary: Enviar el correo de un evento de subastas, segun la preferencia del jugador
      description: >
        Soporta HU-COR-005. Mismo criterio que /correos/mision: el modulo de
        subastas ya decidio que se notifica y si corresponde enviar correo.
      operationId: enviarCorreoSubasta
      parameters:
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorreoSubastaRequest'
      responses:
        '202':
          description: >
            Correo aceptado y entregado al servidor SMTP, o suprimido a
            proposito porque debeEnviarCorreo era false.
        '400':
          $ref: '#/components/responses/SolicitudInvalida'

components:
  securitySchemes:
    servicio:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Credencial de servicio (client_credentials contra ms-identidad,
        ADR-005): `sub` y `azp` = client_id del servicio que llama,
        `rol=SERVICIO`. Se verifica contra el JWKS de ms-identidad.

  parameters:
    TraceId:
      name: X-Trace-Id
      in: header
      required: false
      description: >
        Identificador de traza para correlacionar la peticion entre servicios
        (regla 5 de plataforma). Si no se envia, el servicio genera uno propio.
      schema:
        type: string

  responses:
    SolicitudInvalida:
      description: Faltan datos obligatorios o el correo no tiene formato valido
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

  schemas:
    CorreoBienvenidaRequest:
      type: object
      required:
        - email
        - apodo
      properties:
        email:
          type: string
          format: email
          description: Destinatario
          examples: ['jugador@ejemplo.com']
        apodo:
          type: string
          minLength: 1
          description: Nombre visible del jugador; encabeza el saludo
          examples: ['ElGuerrero']
        nombres:
          type: string
          description: Opcional. Si viene, el saludo lo usa en lugar del apodo.
        apellidos:
          type: string
          description: Opcional.

    CorreoAvisoAccesoRequest:
      type: object
      required:
        - email
        - apodo
        - ip
        - fechaHora
      properties:
        email:
          type: string
          format: email
        apodo:
          type: string
          minLength: 1
        ip:
          type: string
          description: IP de origen del acceso, tal como la observo ms-identidad
          examples: ['190.85.12.44']
        fechaHora:
          type: string
          format: date-time
          description: Momento del acceso en ISO-8601 con zona horaria
          examples: ['2026-08-30T14:23:11-05:00']

    CorreoCambioClaveRequest:
      type: object
      description: Misma forma que el aviso de acceso; nunca lleva contrasenas.
      required:
        - email
        - apodo
        - ip
        - fechaHora
      properties:
        email:
          type: string
          format: email
        apodo:
          type: string
          minLength: 1
        ip:
          type: string
          description: IP desde la que se hizo el cambio, tal como la observo ms-identidad
          examples: ['190.85.12.44']
        fechaHora:
          type: string
          format: date-time
          description: Momento del cambio en ISO-8601 con zona horaria
          examples: ['2026-09-21T15:00:00-05:00']

    CorreoConfirmacionCuentaRequest:
      type: object
      required:
        - email
        - apodo
        - codigo
        - minutosVigencia
      properties:
        email:
          type: string
          format: email
          description: Destinatario, el correo que se esta verificando
          examples: ['jugador@ejemplo.com']
        apodo:
          type: string
          minLength: 1
          examples: ['ElGuerrero']
        codigo:
          type: string
          minLength: 1
          maxLength: 12
          description: >
            Codigo de confirmacion ya generado por ms-identidad. Este servicio
            no lo genera ni lo valida: solo lo transcribe al correo. Tampoco se
            registra en la bitacora, para no filtrarlo.
          examples: ['482915']
        minutosVigencia:
          type: integer
          minimum: 1
          description: >
            Minutos de validez del codigo desde su emision. Lo envia quien lo
            genero (configurable alli por variable de entorno) en lugar de
            fijarlo aqui: asi el correo nunca promete un plazo distinto del
            real.
          examples: [15]

    CorreoRecuperacionClaveRequest:
      type: object
      required:
        - email
        - apodo
        - codigo
        - minutosVigencia
      properties:
        email:
          type: string
          format: email
        apodo:
          type: string
          minLength: 1
        codigo:
          type: string
          minLength: 1
          maxLength: 12
          description: >
            Codigo de un solo uso ya generado por ms-identidad. Este servicio no
            lo genera ni lo valida: solo lo transcribe al correo. Tampoco se
            registra en la bitacora, para no filtrarlo.
          examples: ['482915']
        minutosVigencia:
          type: integer
          minimum: 1
          description: >
            Minutos que le quedan de validez al codigo. Lo envia quien lo genero
            en lugar de fijarlo aqui: asi el correo nunca miente si ms-identidad
            cambia el plazo.
          examples: [15]

    CorreoMisionRequest:
      type: object
      required:
        - email
        - apodo
        - asunto
        - mensaje
        - debeEnviarCorreo
      properties:
        email:
          type: string
          format: email
        apodo:
          type: string
          minLength: 1
        asunto:
          type: string
          minLength: 1
          description: Asunto del correo. Lo decide misiones, no este servicio.
          examples: ['Nueva misión disponible: Derrota al Dragón']
        mensaje:
          type: string
          minLength: 1
          description: Cuerpo del mensaje. Se muestra tal cual sobre la plantilla corporativa.
        debeEnviarCorreo:
          type: boolean
          description: >
            false si el jugador pidio avisos solo dentro de la aplicacion, o
            si apago los correos de esta categoria (CA-02/CA-03). No es un
            error: el servicio responde 202 igual, sin enviar nada.

    CorreoSubastaRequest:
      type: object
      required:
        - email
        - apodo
        - asunto
        - mensaje
        - debeEnviarCorreo
      properties:
        email:
          type: string
          format: email
        apodo:
          type: string
          minLength: 1
        asunto:
          type: string
          minLength: 1
          examples: ['Ganaste la subasta de Espada Legendaria']
        mensaje:
          type: string
          minLength: 1
        debeEnviarCorreo:
          type: boolean
          description: Mismo criterio que en CorreoMisionRequest.

    ProblemDetail:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
