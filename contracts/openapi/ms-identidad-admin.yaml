openapi: 3.1.0

# =============================================================================
# Nexus Battles VI — Administracion de cuentas (ms-identidad)
#
# B0 (BACKEND-01). Hasta aqui estas ocho rutas existian sin contrato: la
# auditoria contractual de septiembre las encontro con el guardian
# `tests/contratos/rutas-contrato-codigo.py`, y `ms-identidad-auth.yaml`
# las dejaba anotadas como «brecha conocida». Se documentan tal como las
# sirve el codigo (AdminGestionUsuarioController, AdminCuentasController,
# AdminDirectorioController), mas la ruta interna con la que
# moderacion-sanciones proyecta una sancion sobre la cuenta (B2).
#
# El control de acceso lo hace `SecurityInterceptor` con la matriz RBAC de
# `rbac.yaml` (7.3.1 del documento del curso, Tabla 24): suspender es de
# Moderador (temporal), Administrador y Super Administrador; banear y crear
# cuentas administrativas, segun la tabla.
# =============================================================================

info:
  title: Nexus Battles VI — Administracion de cuentas (ms-identidad)
  version: 1.3.0
  description: |
    ### Cambios en 1.3.0 (HU-USR-008 #561, 7.3.4 — implementado, todo aditivo)

    - `GET /admin/jugadores` admite cuatro filtros OPCIONALES: `rol`,
      `estado`, `registradoDesde` y `registradoHasta` (fecha de registro, las
      dos inclusive). Sin ellos responde igual que en 1.2.0. `buscar` encuentra
      ademas por los nombres y apellidos del perfil: se suman a apodo y correo,
      asi que lo que antes aparecia sigue apareciendo. Un valor que no existe
      (rol o estado fuera de la lista, fecha mal escrita, `registradoDesde`
      posterior a `registradoHasta`) responde 400 `datos-invalidos` en vez de
      una lista vacia que pareceria un resultado.
    - `GET /admin/jugadores/exportacion` (nueva): el listado completo con los
      mismos filtros, en CSV y con las columnas del directorio. Mismo permiso
      que el directorio. Si pasa del tope configurado responde 422
      `exportacion-demasiado-grande` y no entrega un archivo a medias.
    - `GET /admin/jugadores/indicadores` (nueva): cuantas cuentas hay en total
      y en cada estado (la foto de ahora) y cuantas se registraron cada dia de
      un rango (serie continua: los dias sin registros van con 0). Con
      `ocultarPruebas`, el mismo criterio de cuentas de pruebas que el
      directorio.
    - El «historial de sanciones» NO es filtro: este servicio solo guarda la
      sancion vigente (el `estado` SUSPENDIDO o BANEADO, que si se filtra) y la
      ultima que proyecto moderacion-sanciones, no el historial (sin
      advertencias ni las anteriores a B2). El historial es de
      moderacion-sanciones (`/sanciones/usuarios/{id}`).

    ### Cambios en 1.2.0 (RFINAL-06 — implementado, todo aditivo)

    - `EntradaDeDirectorio` gana `id`: la clave interna de la cuenta, la que
      esperan `/admin/usuarios/{usuarioId}` y `/rbac/usuarios/{usuarioId}/rol`.
      El parametro `UsuarioId` ya decia «la del directorio», pero el
      directorio solo publicaba el `uid`: no habia forma de abrir la ficha de
      una fila sin conocer un numero que ninguna pantalla mostraba.
    - `GET /admin/jugadores` admite `ocultarPruebas` (opcional, `false` por
      omision: sin el, el directorio responde igual que en 1.1.0). Con `true`
      excluye EN LA CONSULTA, antes de paginar, las cuentas que crean las
      pruebas automaticas; `total` y `totalPaginas` cuentan solo las que
      quedan.
    - `UsuarioAdministrado.id` es la clave de la CUENTA. Se construia con la
      clave del perfil; coincide con la de la cuenta porque el perfil la
      comparte (`perfiles_usuario.usuario_id` es su clave primaria), pero era
      la de otro registro y nada lo garantizaba en el contrato.

    ### Cambios en 1.1.0 (B2, BACKEND-02 — implementado)

    - 1.1.0 (B2): implementadas `PUT /internal/usuarios/{uid}/estado-sancion`
      y `GET /internal/usuarios/{uid}/contacto` (fuera las marcas
      `x-implementacion`), y la delegacion de suspender, banear y reactivar en
      moderacion-sanciones. Menor y no parche porque se documentan respuestas
      nuevas que la delegacion y la lista negra fail-closed producen, todas
      aditivas: `503 moderacion-no-disponible` (con `Retry-After`) en
      suspender, banear, reactivar, la edicion de perfil y el alta de cuentas
      administrativas; `409` en suspender y banear (moderacion responde que el
      usuario ya esta baneado); y un cuerpo OPCIONAL `{motivo}` en banear, para
      que la causal quede en el historial de moderacion como ya pasaba en
      suspender.

    Gestion de usuarios desde el panel de administracion (7.3.2 y 7.3.4 del
    documento del curso) y la proyeccion del estado de sancion.

    **Errores heredados en texto plano**: las rutas de `/admin/usuarios` y
    `/admin/cuentas` devuelven el mensaje de la excepcion como `text/plain`
    en 400 y 404, igual que el registro antes de 1.1.0 de
    `ms-identidad-auth.yaml`. El 403 lo produce el interceptor con problem
    details.

    **Unificacion de sanciones (B2).** La fuente de verdad de una sancion
    (advertencia, suspension, baneo) es `moderacion-sanciones`. Desde B2,
    `PUT .../suspender`, `.../banear` y `.../reactivar` delegan en ella, y
    ella devuelve el estado resultante a esta cuenta por
    `PUT /api/v1/internal/usuarios/{uid}/estado-sancion`: la cuenta guarda la
    proyeccion (estado, vigencia) para que el login pueda negarse sin llamar a
    otro servicio, y sube la version de token para revocar las sesiones
    abiertas.

    Como delega el panel (1.1.0): la peticion a moderacion lleva el
    `Authorization` del administrador que actua —moderacion aplica su regla de
    roles y lo anota como autor—; con su respuesta se aplica aqui la misma
    proyeccion que moderacion enviara despues (que entonces no cambia nada).
    Si moderacion no responde, 503 y aqui no se aplica nada: nunca se diverge
    en silencio. Si moderacion dice que no, se reenvia su respuesta (403 si el
    rol no alcanza, 409 si el usuario ya esta baneado, 400 si la duracion no
    cabe). El aviso al jugador (bandeja y correo) lo envia moderacion. La
    auditoria de ms-cumplimiento se intenta despues y, si falla, no deshace la
    sancion (su registro de autor y motivo ya esta en moderacion). Una cuenta
    sin `uid` (anterior al identificador publico) no existe para moderacion:
    se opera solo aqui, como antes de B2, con auditoria fail-closed.

    Estados que publica este contrato: `ACTIVO`, `PENDIENTE_VERIFICACION`
    (autorregistro sin confirmar, B1), `INACTIVO` (cuenta administrativa sin
    activar), `SUSPENDIDO` y `BANEADO`. Las filas del panel anterior a B2
    (`SUSPENDIDA`, `BANEADA`) se migraron a esta forma (V3).
  license:
    name: Uso academico — Proyecto Integrador II, UPB Bucaramanga

servers:
  - url: http://localhost:8089
    description: Desarrollo local (sin context-path; el /api/v1 va en la ruta)

tags:
  - name: administracion
    description: Panel de administracion de usuarios (7.3.2, 7.3.4)
  - name: interno
    description: Llamadas entre servicios (token de servicio)

paths:
  /api/v1/admin/jugadores:
    get:
      tags: [administracion]
      operationId: listarDirectorioDeJugadores
      summary: Directorio paginado de cuentas con busqueda
      description: |
        Las cuentas mas nuevas primero (`id` descendente). La busqueda, los
        filtros, el de pruebas automaticas y la paginacion los hace el
        servidor. Los filtros se combinan entre si (todos a la vez).
      security:
        - tokenDeUsuario: []
      parameters:
        - name: buscar
          in: query
          required: false
          description: |
            Texto a buscar en apodo o correo (sin distinguir mayusculas). 1.3.0:
            tambien en los nombres y apellidos del perfil («Ana Perez» encuentra
            a quien se llama Ana de nombre y Perez de apellido). Una cuenta sin
            perfil (las administrativas) se sigue encontrando por apodo o correo.
          schema:
            type: string
        - $ref: '#/components/parameters/FiltroRol'
        - $ref: '#/components/parameters/FiltroEstado'
        - $ref: '#/components/parameters/RegistradoDesde'
        - $ref: '#/components/parameters/RegistradoHasta'
        - name: ocultarPruebas
          in: query
          required: false
          description: |
            1.2.0 — `true` excluye las cuentas creadas por las pruebas
            automaticas (E2E, smoke, canarios, prueba del profesor y
            laboratorio visual). Una cuenta lo es si su correo esta en un
            dominio reservado para pruebas o si su apodo empieza por un prefijo
            de pruebas. Las dos listas son configuracion del servicio, no de
            este contrato: `IDENTIDAD_DIRECTORIO_PRUEBAS_DOMINIOS` (por
            omision `nexus.test`) e `IDENTIDAD_DIRECTORIO_PRUEBAS_PREFIJOS` (por
            omision `qa_,smoke_,canario_`), sin distinguir mayusculas. Se
            excluyen en la consulta, antes de paginar: `total` y
            `totalPaginas` cuentan solo las que quedan. No borra ni marca nada.
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Pagina del directorio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaDeDirectorio'
        '400':
          $ref: '#/components/responses/ConsultaInvalida'
        '403':
          $ref: '#/components/responses/Prohibido'

  /api/v1/admin/jugadores/exportacion:
    get:
      tags: [administracion]
      operationId: exportarDirectorioDeJugadores
      summary: El directorio con los filtros vigentes, en CSV (1.3.0)
      description: |
        Todas las cuentas que cumplen los filtros (no solo una pagina), en el
        orden del directorio (las mas nuevas primero), leidas en una sola
        consulta: el archivo es una foto coherente aunque alguien se registre
        mientras se descarga.

        Columnas, las que el directorio muestra y ninguna mas: `Apodo`,
        `Correo`, `Rol`, `Estado` (`BLOQUEADA` si la cuenta tiene ahora un
        bloqueo temporal por intentos fallidos, como en la tabla), `Registro`
        y `Última entrada` (fecha y hora `aaaa-mm-dd hh:mm` del reloj del
        servicio; vacia = sin dato o, en la ultima entrada, nunca ha entrado).
        Sin identificadores internos ni credenciales.

        Formato: UTF-8 con marca de orden de bytes (para que una hoja de
        calculo lea bien las tildes), separado por comas, fin de linea CRLF,
        cada celda de texto entre comillas con las comillas dobladas. Una
        celda que empiece por `=`, `+`, `-`, `@`, tabulador o retorno se
        prefija con un apostrofo: una hoja de calculo no la ejecutara como
        formula (inyeccion CSV).

        Tope tecnico de filas: `IDENTIDAD_DIRECTORIO_EXPORTACION_MAXIMO_FILAS`
        (por omision 10000). Por encima, 422 y ningun archivo.
      security:
        - tokenDeUsuario: []
      parameters:
        - $ref: '#/components/parameters/BuscarEnDirectorio'
        - $ref: '#/components/parameters/OcultarPruebas'
        - $ref: '#/components/parameters/FiltroRol'
        - $ref: '#/components/parameters/FiltroEstado'
        - $ref: '#/components/parameters/RegistradoDesde'
        - $ref: '#/components/parameters/RegistradoHasta'
      responses:
        '200':
          description: El listado en CSV.
          headers:
            Content-Disposition:
              description: '`attachment; filename="directorio-de-cuentas-aaaammdd-hhmm.csv"`'
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/ConsultaInvalida'
        '403':
          $ref: '#/components/responses/Prohibido'
        '422':
          $ref: '#/components/responses/ExportacionDemasiadoGrande'

  /api/v1/admin/jugadores/indicadores:
    get:
      tags: [administracion]
      operationId: indicadoresDeCuentas
      summary: Cuentas por estado y registros por dia (HU-USR-008, 1.3.0)
      description: |
        Dos cosas distintas en una respuesta:

        - `total` y `porEstado`: cuantas cuentas hay AHORA, en total y en cada
          estado. No dependen del rango (una cuenta suspendida lo esta hoy,
          se registrara cuando se registrara).
        - `registros`: cuantas cuentas se registraron cada dia del rango, por
          la fecha de alta de la cuenta. La serie es continua: un dia sin
          registros va con 0, no falta. Las cuentas anteriores al campo de
          fecha de alta no tienen dia y no entran en la serie (si en el total).

        El dia es el del reloj del servicio. Sin rango, los ultimos
        `IDENTIDAD_INDICADORES_DIAS_POR_OMISION` dias (por omision 30) hasta
        hoy; con solo `desde`, hasta hoy; con solo `hasta`, esos mismos dias
        hacia atras. Un rango de mas de `IDENTIDAD_INDICADORES_DIAS_MAXIMOS`
        dias (por omision 366) responde 400: es un tope tecnico del tamano de
        la serie, no una regla de negocio.

        Mismo permiso que el directorio. Solo lee: no cambia nada.
      security:
        - tokenDeUsuario: []
      parameters:
        - name: desde
          in: query
          required: false
          description: Primer dia de la serie (inclusive), `aaaa-mm-dd`.
          schema:
            type: string
            format: date
        - name: hasta
          in: query
          required: false
          description: Ultimo dia de la serie (inclusive), `aaaa-mm-dd`.
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/OcultarPruebas'
      responses:
        '200':
          description: Los indicadores.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndicadoresDeCuentas'
        '400':
          $ref: '#/components/responses/ConsultaInvalida'
        '403':
          $ref: '#/components/responses/Prohibido'

  /api/v1/admin/usuarios/{usuarioId}:
    get:
      tags: [administracion]
      operationId: obtenerUsuarioAdministrado
      summary: Ficha de una cuenta para el panel
      security:
        - tokenDeUsuario: []
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
      responses:
        '200':
          description: Ficha de la cuenta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioAdministrado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontradoTexto'

  /api/v1/admin/usuarios/{usuarioId}/perfil:
    put:
      tags: [administracion]
      operationId: editarPerfilAdministrado
      summary: Edita el perfil de cualquier cuenta (7.3.2 «Modificacion de usuarios»)
      security:
        - tokenDeUsuario: []
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                nombres:
                  type: string
                apellidos:
                  type: string
                apodo:
                  type: string
                  description: Sujeto a unicidad y a la lista negra (contexto APODO).
                preferencias:
                  type: string
                avatar:
                  type: string
                  format: binary
      responses:
        '200':
          description: Perfil actualizado.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/InvalidoTexto'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontradoTexto'
        '503':
          $ref: '#/components/responses/ModeracionNoDisponible'

  /api/v1/admin/usuarios/{usuarioId}/suspender:
    put:
      tags: [administracion]
      operationId: suspenderCuenta
      summary: Suspension temporal de una cuenta (7.3.2, sancion 2)
      description: |
        Desde B2 delega en `POST /api/v1/sanciones` de moderacion-sanciones
        (tipo SUSPENSION): la sancion queda registrada con motivo y autor, el
        usuario recibe correo y la cuenta proyecta el estado. Un Moderador
        solo puede suspender de forma temporal (Tabla 24).

        1.1.0: la duracion que se pide a moderacion son las horas enteras
        hasta `suspendidoHasta`, redondeadas hacia arriba (minimo 1); el fin
        que queda es el que devuelve moderacion. Sin `motivo`, «Suspensión
        desde el panel de administración».
      security:
        - tokenDeUsuario: []
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [suspendidoHasta]
              properties:
                suspendidoHasta:
                  type: string
                  format: date-time
                  description: Fin de la suspension; debe ser futuro.
                motivo:
                  type: string
                  description: Causal documentada (7.3.2 «Causales de sancion»). Opcional por compatibilidad.
      responses:
        '204':
          description: Cuenta suspendida.
        '400':
          $ref: '#/components/responses/InvalidoTexto'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontradoTexto'
        '409':
          $ref: '#/components/responses/ConflictoTexto'
        '503':
          $ref: '#/components/responses/ModeracionNoDisponible'

  /api/v1/admin/usuarios/{usuarioId}/banear:
    put:
      tags: [administracion]
      operationId: banearCuenta
      summary: Baneo definitivo de una cuenta (7.3.2, sancion 3)
      description: |
        Desde B2 delega en `POST /api/v1/sanciones` de moderacion-sanciones
        (tipo BANEO, `confirmacion: true`); solo Administrador o Super
        Administrador. 1.1.0: cuerpo OPCIONAL con la causal; sin el, «Baneo
        definitivo desde el panel de administración».
      security:
        - tokenDeUsuario: []
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                motivo:
                  type: string
                  maxLength: 1000
                  description: Causal documentada (7.3.2 «Causales de sancion»).
      responses:
        '204':
          description: Cuenta baneada.
        '400':
          $ref: '#/components/responses/InvalidoTexto'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontradoTexto'
        '409':
          $ref: '#/components/responses/ConflictoTexto'
        '503':
          $ref: '#/components/responses/ModeracionNoDisponible'

  /api/v1/admin/usuarios/{usuarioId}/reactivar:
    put:
      tags: [administracion]
      operationId: reactivarCuenta
      summary: Levanta la suspension o el baneo de una cuenta
      description: |
        Desde B2: consulta a moderacion-sanciones la sancion activa de la
        cuenta (credencial de servicio) y, si la hay, la levanta con
        `POST /sanciones/{sancionId}/levantamiento` y el token de quien actua
        (solo Administrador o Super Administrador); despues limpia la
        proyeccion local. Un baneo no se levanta desde aqui (7.3.2: «inhabilita
        permanentemente»; solo lo revierte una apelacion): 400.
      security:
        - tokenDeUsuario: []
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
      responses:
        '204':
          description: Cuenta activa.
        '400':
          $ref: '#/components/responses/InvalidoTexto'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontradoTexto'
        '503':
          $ref: '#/components/responses/ModeracionNoDisponible'

  /api/v1/admin/usuarios/{usuarioId}/restablecer-password:
    post:
      tags: [administracion]
      operationId: restablecerPasswordAdministrado
      summary: Envia a la cuenta un codigo de restablecimiento
      security:
        - tokenDeUsuario: []
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
      responses:
        '204':
          description: Codigo emitido y correo encolado.
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontradoTexto'

  /api/v1/admin/cuentas:
    post:
      tags: [administracion]
      operationId: crearCuentaAdministrativa
      summary: Alta de un Moderador o Administrador (solo Super Administrador)
      security:
        - tokenDeUsuario: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [nombres, apellidos, email, password, apodo, rolNombre]
              properties:
                nombres:
                  type: string
                apellidos:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                apodo:
                  type: string
                rolNombre:
                  type: string
                  enum: [MODERADOR, ADMINISTRADOR, SUPER_ADMINISTRADOR]
                avatar:
                  type: string
                  format: binary
      responses:
        '201':
          description: Cuenta creada (entidad serializada, como el registro).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/InvalidoTexto'
        '403':
          $ref: '#/components/responses/Prohibido'
        '503':
          $ref: '#/components/responses/ModeracionNoDisponible'

  /api/v1/internal/usuarios/{uid}/estado-sancion:
    put:
      tags: [interno]
      operationId: proyectarEstadoDeSancion
      summary: moderacion-sanciones fija el estado de acceso de la cuenta (B2)
      description: |
        Lo llama **solo** moderacion-sanciones (token de servicio con `azp`
        `moderacion-sanciones`) cada vez que una sancion que afecta al acceso
        empieza, se revierte o se reduce. Idempotente por `sancionId` +
        `estado`: repetir la misma proyeccion no vuelve a subir la version de
        token.

        - `SUSPENDIDO` con `hasta`: el login responde 403
          `cuenta-suspendida` con el fin de la suspension («contador visible
          del tiempo restante», 7.3.2) hasta esa fecha, sin necesitar otra
          llamada para expirar.
        - `BANEADO`: 403 `cuenta-baneada` para siempre.
        - `ACTIVO`: se levanta la proyeccion (apelacion revertida, reactivacion).

        Suspender o banear sube `versionToken`: los tokens emitidos caducan
        en ms-identidad en el acto.

        Reglas de 1.1.0, para que el orden de llegada y los reintentos no
        deshagan lo que no toca:
        - la misma `sancionId` en SUSPENDIDO con otro `hasta` actualiza el fin
          sin revocar otra vez (apelacion REDUCIDA);
        - una suspension cuyo `hasta` ya paso se guarda pero no revoca;
        - una SUSPENSION de otra sancion no rebaja un BANEADO;
        - `ACTIVO` solo levanta la restriccion si la produjo esa misma
          `sancionId` (el levantamiento de una sancion vieja no borra otra
          vigente);
        - al levantar, una cuenta que nunca confirmo su correo vuelve a
          `PENDIENTE_VERIFICACION`, nunca a ACTIVO: una sancion no es un atajo
          para saltarse la verificacion.

        Credencial: token de servicio firmado por ms-identidad (su JWKS), con
        `rol=SERVICIO` y `azp=moderacion-sanciones`. Cualquier otra —otro
        servicio, una persona aunque sea Super Administrador, un token de otro
        emisor— recibe 403. El borde no publica `/api/v1/internal/**`.
      security:
        - tokenDeServicio: []
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProyeccionDeSancion'
      responses:
        '200':
          description: Proyeccion aplicada (o ya estaba aplicada).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoDeCuenta'
        '400':
          $ref: '#/components/responses/InvalidoProblema'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          description: |
            No existe una cuenta con ese uid (o el uid no es un UUID).
            `type` `.../errors/cuenta-no-encontrada`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/internal/usuarios/{uid}/contacto:
    get:
      tags: [interno]
      operationId: contactoDeUsuario
      summary: Correo y apodo de una cuenta, para enviarle un correo (B1/B2)
      description: |
        Solo token de servicio. Lo usan los productores de correo que conocen
        al jugador por su `uid` (moderacion-sanciones, ms-ecommerce,
        ms-subastas, misiones) para no guardar copias del correo en sus
        propias bases (regla 7 y minimizacion de datos personales). Una cuenta
        `PENDIENTE_VERIFICACION` o `BANEADO` responde igual: decidir si se le
        escribe es del productor.
      security:
        - tokenDeServicio: []
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Datos de contacto.
          content:
            application/json:
              schema:
                type: object
                required: [uid, email, apodo, estado]
                properties:
                  uid:
                    type: string
                    format: uuid
                  email:
                    type: string
                    format: email
                  apodo:
                    type: string
                  estado:
                    type: string
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          description: |
            No existe una cuenta con ese uid (o el uid no es un UUID).
            `type` `.../errors/cuenta-no-encontrada`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

components:
  securitySchemes:
    tokenDeUsuario:
      type: http
      scheme: bearer
      bearerFormat: JWT
    tokenDeServicio:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token `client_credentials` con rol SERVICIO (ADR-005).

  parameters:
    UsuarioId:
      name: usuarioId
      in: path
      required: true
      description: Clave interna de la cuenta (la del directorio).
      schema:
        type: integer
        format: int64
    BuscarEnDirectorio:
      name: buscar
      in: query
      required: false
      description: |
        1.3.0 — el mismo texto que el directorio: apodo, correo o nombres y
        apellidos del perfil, sin distinguir mayusculas.
      schema:
        type: string
    OcultarPruebas:
      name: ocultarPruebas
      in: query
      required: false
      description: |
        1.3.0 — el mismo criterio que `ocultarPruebas` del directorio: `true`
        deja fuera las cuentas de las pruebas automaticas (dominio de correo
        o prefijo de apodo configurados en el servicio).
      schema:
        type: boolean
        default: false
    FiltroRol:
      name: rol
      in: query
      required: false
      description: 1.3.0 — solo las cuentas de este rol. Otro valor, 400.
      schema:
        type: string
        enum: [JUGADOR, MODERADOR, ADMINISTRADOR, SUPER_ADMINISTRADOR]
    FiltroEstado:
      name: estado
      in: query
      required: false
      description: |
        1.3.0 — solo las cuentas en este estado. SUSPENDIDO y BANEADO incluyen
        las filas que el panel anterior a B2 guardo en femenino. Otro valor, 400.
      schema:
        type: string
        enum: [ACTIVO, PENDIENTE_VERIFICACION, INACTIVO, SUSPENDIDO, BANEADO]
    RegistradoDesde:
      name: registradoDesde
      in: query
      required: false
      description: |
        1.3.0 — solo las cuentas registradas ese dia o despues (`aaaa-mm-dd`,
        dia del reloj del servicio). Con un filtro de fecha, las cuentas sin
        fecha de alta (anteriores al campo) quedan fuera.
      schema:
        type: string
        format: date
    RegistradoHasta:
      name: registradoHasta
      in: query
      required: false
      description: 1.3.0 — solo las cuentas registradas ese dia o antes (inclusive).
      schema:
        type: string
        format: date

  responses:
    Prohibido:
      description: Sin token valido o sin permiso segun la matriz RBAC.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NoEncontradoTexto:
      description: No existe la cuenta. Texto plano (heredado).
      content:
        text/plain:
          schema:
            type: string
    InvalidoTexto:
      description: Datos invalidos. Texto plano (heredado).
      content:
        text/plain:
          schema:
            type: string
    InvalidoProblema:
      description: |
        Datos invalidos. `type` `.../errors/datos-invalidos` (sin `sancionId`,
        estado desconocido, SUSPENDIDO sin `hasta`, JSON ilegible).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ConsultaInvalida:
      description: |
        1.3.0 — un filtro que no se puede aplicar: rol o estado fuera de la
        lista, una fecha que no es `aaaa-mm-dd`, un desde posterior al hasta o
        un rango de indicadores mas largo que el tope. `type`
        `.../errors/datos-invalidos`; `detail` dice cual, en palabras.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ExportacionDemasiadoGrande:
      description: |
        1.3.0 — los filtros dejan mas cuentas que el tope de una exportacion.
        `type` `.../errors/exportacion-demasiado-grande`; `detail` dice
        cuantas son y cual es el tope, para acotar los filtros. No se entrega
        ningun archivo.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ConflictoTexto:
      description: |
        1.1.0 — moderacion-sanciones respondio 409 (p. ej. el usuario ya esta
        baneado y no procede ninguna sancion mas). Texto plano con su detalle,
        como el resto de rechazos de estas rutas.
      content:
        text/plain:
          schema:
            type: string
    ModeracionNoDisponible:
      description: |
        1.1.0 — moderacion-sanciones no respondio (error, tiempo agotado,
        circuito abierto). `type` `.../errors/moderacion-no-disponible`. Nada
        se aplico: ni la sancion delegada ni un apodo sin comprobar en la
        lista negra.
      headers:
        Retry-After:
          description: Segundos sugeridos antes de reintentar (30).
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

  schemas:
    PaginaDeDirectorio:
      type: object
      required: [contenido, pagina, tamano, total, totalPaginas]
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/EntradaDeDirectorio'
        pagina:
          type: integer
        tamano:
          type: integer
        total:
          type: integer
          format: int64
        totalPaginas:
          type: integer

    EntradaDeDirectorio:
      type: object
      required: [id, apodo, email, estado, bloqueada]
      properties:
        id:
          type: integer
          format: int64
          description: |
            1.2.0 — clave interna de la cuenta: la que esperan
            `/admin/usuarios/{usuarioId}` y `/rbac/usuarios/{usuarioId}/rol`.
            Sirve para abrir la ficha desde la fila; no es un dato para leer.
        uid:
          type: [string, 'null']
          format: uuid
        apodo:
          type: string
        email:
          type: string
        estado:
          type: string
          description: ACTIVO, PENDIENTE_VERIFICACION (B1), INACTIVO (cuenta administrativa sin activar), SUSPENDIDO o BANEADO.
        rol:
          type: [string, 'null']
        creadoEn:
          type: [string, 'null']
          format: date-time
        ultimoAcceso:
          type: [string, 'null']
          format: date-time
        suspendidoHasta:
          type: [string, 'null']
          format: date-time
        bloqueada:
          type: boolean
          description: Bloqueo temporal por intentos fallidos de login (no es una sancion).

    IndicadoresDeCuentas:
      type: object
      description: 1.3.0 — `GET /admin/jugadores/indicadores`.
      required: [total, porEstado, registros, ocultarPruebas, calculadoEn]
      properties:
        total:
          type: integer
          format: int64
          description: |
            Cuentas que hay ahora (sin las de pruebas automaticas si
            `ocultarPruebas`). Es la suma de `porEstado`.
        porEstado:
          type: object
          description: |
            Cuantas cuentas hay ahora en cada estado. Trae SIEMPRE las cinco
            claves del contrato, con 0 si no hay ninguna: un estado ausente no
            es lo mismo que un estado sin cuentas. SUSPENDIDO y BANEADO suman
            las filas anteriores a B2 (SUSPENDIDA, BANEADA). Un valor guardado
            que no es ninguno de los cinco no deberia existir; si existe se
            publica con su nombre en vez de esconderlo.
          required: [ACTIVO, PENDIENTE_VERIFICACION, INACTIVO, SUSPENDIDO, BANEADO]
          properties:
            ACTIVO:
              type: integer
              format: int64
            PENDIENTE_VERIFICACION:
              type: integer
              format: int64
            INACTIVO:
              type: integer
              format: int64
            SUSPENDIDO:
              type: integer
              format: int64
            BANEADO:
              type: integer
              format: int64
          additionalProperties:
            type: integer
            format: int64
        registros:
          $ref: '#/components/schemas/RegistrosPorDia'
        ocultarPruebas:
          type: boolean
          description: Si se dejaron fuera las cuentas de pruebas automaticas.
        calculadoEn:
          type: string
          format: date-time
          description: Cuando se contaron.

    RegistrosPorDia:
      type: object
      description: 1.3.0 — altas de cuentas por dia, en un rango cerrado.
      required: [desde, hasta, total, porDia]
      properties:
        desde:
          type: string
          format: date
        hasta:
          type: string
          format: date
        total:
          type: integer
          format: int64
          description: Cuentas registradas en el rango (la suma de `porDia`).
        porDia:
          type: array
          description: Un elemento por dia, de `desde` a `hasta`, en orden; los dias sin altas con 0.
          items:
            type: object
            required: [fecha, cuentas]
            properties:
              fecha:
                type: string
                format: date
              cuentas:
                type: integer
                format: int64

    UsuarioAdministrado:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: |
            Clave interna de la CUENTA, la misma de la ruta y del directorio
            (1.2.0: se construia con la del perfil, ver el cambio).
        apodo:
          type: string
        email:
          type: string
        estado:
          type: string
        rolNombre:
          type: string
        nombres:
          type: [string, 'null']
        apellidos:
          type: [string, 'null']
        avatar:
          type: [string, 'null']
        preferencias:
          type: [string, 'null']

    ProyeccionDeSancion:
      type: object
      required: [estado, sancionId]
      properties:
        estado:
          type: string
          enum: [ACTIVO, SUSPENDIDO, BANEADO]
        hasta:
          type: [string, 'null']
          format: date-time
          description: Obligatorio con SUSPENDIDO; ignorado en los demas.
        sancionId:
          type: string
          format: uuid
          description: Sancion de moderacion-sanciones que produce el estado.
        motivo:
          type: [string, 'null']

    EstadoDeCuenta:
      type: object
      required: [uid, estado, versionToken]
      properties:
        uid:
          type: string
          format: uuid
        estado:
          type: string
        suspendidoHasta:
          type: [string, 'null']
          format: date-time
        versionToken:
          type: integer

    ProblemDetail:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
