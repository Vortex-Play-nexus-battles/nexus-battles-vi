openapi: 3.1.0
info:
  title: Nexus Battles VI - RBAC & Authorization Service (ms-identidad)
  description: >-
    API de Control de Acceso Basado en Roles (RBAC) conforme a la Tabla 24,
    extendida con las acciones requeridas por HU-RBAC-003 y HU-USR-003.
  version: 1.1.0
servers:
  - url: http://localhost:8089/api/v1
    description: Spring Boot local (perfil dev)
  - url: http://localhost:8081/api/v1
    description: Contenedor Docker Compose
paths:
  /rbac/authorize:
    post:
      summary: Evaluar permiso de un rol sobre una acción
      operationId: evaluatePermission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizationRequest'
      responses:
        '200':
          description: Resultado de la evaluación de autorización
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationResponse'
        '403':
          description: Acceso denegado (Fail-Closed)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /rbac/roles:
    get:
      summary: Obtener catálogo de roles del sistema
      operationId: getRoles
      responses:
        '200':
          description: Lista de roles disponibles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleDescriptor'

  /rbac/matrix:
    get:
      summary: Obtener la matriz de permisos versionada (Tabla 24 extendida)
      operationId: getMatrix
      responses:
        '200':
          description: Matriz completa de permisos por rol y acción
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionMatrixResponse'

  /admin/ban:
    post:
      summary: Banear definitivamente a un usuario
      description: >-
        Endpoint protegido con @RequirePermission(BANEAR_DEFINITIVAMENTE).
        El SecurityInterceptor valida el Bearer JWT y el permiso del rol antes
        de ejecutar la accion; ante credencial ausente, token invalido o rol sin
        permiso responde 403 en formato Problem Details (politica fail-closed de
        HU-RBAC-004).
      operationId: banUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BanRequest'
      responses:
        '200':
          description: Usuario baneado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccionAdminResponse'
        '403':
          description: Acceso denegado (fail-closed)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /rbac/usuarios/{usuarioId}/rol:
    put:
      summary: Asignar un rol a un usuario existente
      description: >-
        Endpoint protegido con @RequirePermission(ASIGNAR_ROL), exclusivo de
        SUPER_ADMINISTRADOR segun la Tabla 24. Al cambiar el rol se incrementa la
        version del token del usuario para invalidar sus sesiones vigentes.
      operationId: asignarRol
      security:
        - bearerAuth: []
      parameters:
        - name: usuarioId
          in: path
          required: true
          description: Identificador del usuario al que se le asigna el rol
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsignarRolRequest'
      responses:
        '200':
          description: Rol actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeResponse'
        '403':
          description: Acceso denegado (fail-closed)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: El usuario indicado no existe
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Token emitido por POST /api/v1/auth/login. El SecurityInterceptor valida
        firma, expiracion y version del token antes de evaluar el permiso.

  schemas:
    AuthorizationRequest:
      type: object
      required:
        - role
        - action
      properties:
        role:
          type: string
          enum: [JUGADOR, MODERADOR, ADMINISTRADOR, SUPER_ADMINISTRADOR]
        action:
          $ref: '#/components/schemas/RbacAction'

    RbacAction:
      type: string
      description: >-
        Acción protegida por RBAC. La matriz extendida contiene doce acciones:
        diez de la Tabla 24, ASIGNAR_ROL (HU-RBAC-003) y
        GESTIONAR_CUENTAS (HU-USR-003).
      enum:
        - CREAR_CUENTA_JUGADOR
        - MODIFICAR_PERFIL_PROPIO
        - PUBLICAR_COMENTARIOS
        - ELIMINAR_COMENTARIO_PROPIO
        - MODERAR_COMENTARIOS
        - EMITIR_ADVERTENCIAS
        - SUSPENDER_USUARIOS
        - BANEAR_DEFINITIVAMENTE
        - CREAR_ADMIN_MODERADOR
        - GESTIONAR_PRODUCTOS
        - ASIGNAR_ROL
        - GESTIONAR_CUENTAS

    AuthorizationResponse:
      type: object
      required:
        - permitted
        - permissionType
        - role
        - action
      properties:
        permitted:
          type: boolean
        permissionType:
          $ref: '#/components/schemas/PermissionType'
        role:
          type: string
        action:
          type: string
        reason:
          type: string

    RoleDescriptor:
      type: object
      required:
        - role
        - name
        - description
      properties:
        role:
          type: string
        name:
          type: string
        description:
          type: string

    PermissionMatrixResponse:
      type: object
      required:
        - version
        - matrix
      properties:
        version:
          type: string
        matrix:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/PermissionType'

    PermissionType:
      type: string
      enum: [GRANTED, DENIED, TEMPORARY]

    BanRequest:
      type: object
      required:
        - userId
      properties:
        userId:
          type: string
          description: Identificador del usuario a banear

    AccionAdminResponse:
      type: object
      properties:
        status:
          type: string
          examples: [SUCCESS]
        message:
          type: string

    AsignarRolRequest:
      type: object
      required:
        - nuevoRol
      properties:
        nuevoRol:
          type: string
          enum: [JUGADOR, MODERADOR, ADMINISTRADOR, SUPER_ADMINISTRADOR]

    MensajeResponse:
      type: object
      properties:
        mensaje:
          type: string

    ProblemDetail:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
