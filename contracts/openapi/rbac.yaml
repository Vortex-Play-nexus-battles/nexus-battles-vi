openapi: 3.1.0
info:
  title: Nexus Battles VI - RBAC & Authorization Service (ms-identidad)
  description: >-
    API de Control de Acceso Basado en Roles (RBAC) conforme a la Tabla 24,
    extendida con las acciones requeridas por HU-RBAC-003 y HU-USR-003.


    2.0.0 (7.3.1 y 7.3.9, MAYOR): se retira POST /admin/ban. Respondia «Usuario
    X ha sido baneado» sin banear a nadie (no tocaba ninguna cuenta ni dejaba
    sancion): era el fixture con el que se probo el interceptor, publicado en
    produccion. El baneo real es PUT /admin/usuarios/{usuarioId}/banear de
    ms-identidad-admin.yaml, que delega en moderacion-sanciones. Cambios
    aditivos de la misma version: la matriz gana RESTABLECER_SEGUNDO_FACTOR
    (solo Super Administrador); PUT /rbac/usuarios/{usuarioId}/rol admite un
    motivo opcional que queda en la auditoria, nunca cambia el rol de quien lo
    pide (403 jerarquia-insuficiente) ni deja el sistema sin Super
    Administrador (409), y avisa a la cuenta.


    1.2.0 (R9.5): los tres caminos de /rbac dejan de ser publicos. Hasta esta
    version el controlador no llevaba ninguna anotacion de permiso, asi que
    /rbac/matrix repartia la tabla entera de quien puede hacer que a quien la
    pidiera, y /rbac/authorize servia de oraculo para sondear la politica sin
    acreditar nada. Ahora los tres exigen GESTIONAR_CUENTAS, que es lo que la
    interfaz ya exigia por su cuenta: gestion-usuarios.js esconde la pantalla
    entera con ese mismo permiso. Cambia quien puede llamar, no la forma de
    las respuestas.
  version: 2.0.0
servers:
  - url: http://localhost:8089/api/v1
    description: Spring Boot local (perfil dev)
  - url: http://localhost:8081/api/v1
    description: Contenedor Docker Compose
paths:
  /rbac/authorize:
    post:
      summary: Evaluar permiso de un rol sobre una acción
      operationId: evaluatePermission
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizationRequest'
      responses:
        '200':
          description: Resultado de la evaluación de autorización
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationResponse'
        '403':
          description: Acceso denegado (Fail-Closed)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /rbac/roles:
    get:
      summary: Obtener catálogo de roles del sistema
      operationId: getRoles
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de roles disponibles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleDescriptor'
        '403':
          description: >-
            Acceso denegado (fail-closed, HU-RBAC-004). Sin credencial, con
            token invalido o con un rol sin GESTIONAR_CUENTAS.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /rbac/matrix:
    get:
      summary: Obtener la matriz de permisos versionada (Tabla 24 extendida)
      operationId: getMatrix
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Matriz completa de permisos por rol y acción
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionMatrixResponse'
        '403':
          description: >-
            Acceso denegado (fail-closed, HU-RBAC-004). Sin credencial, con
            token invalido o con un rol sin GESTIONAR_CUENTAS.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /rbac/usuarios/{usuarioId}/rol:
    put:
      summary: Asignar un rol a un usuario existente
      description: >-
        Endpoint protegido con @RequirePermission(ASIGNAR_ROL), exclusivo de
        SUPER_ADMINISTRADOR segun la Tabla 24. Al cambiar el rol se incrementa la
        version del token del usuario para invalidar sus sesiones vigentes.
        2.0.0: la auditoria (fail-closed, antes del cambio) lleva la cuenta por
        su uid y el motivo; nadie cambia su propio rol (403
        jerarquia-insuficiente); el ultimo Super Administrador no se degrada
        (409 ultimo-super-administrador); la cuenta recibe un aviso. Si el rol
        nuevo es administrativo, su siguiente inicio de sesion exige el segundo
        factor (ms-identidad-auth.yaml).
      operationId: asignarRol
      security:
        - bearerAuth: []
      parameters:
        - name: usuarioId
          in: path
          required: true
          description: Identificador del usuario al que se le asigna el rol
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsignarRolRequest'
      responses:
        '200':
          description: Rol actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeResponse'
        '403':
          description: Acceso denegado (fail-closed)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: El usuario indicado no existe (cuenta-no-encontrada)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: >-
            2.0.0 — quitaria el rol al unico Super Administrador que queda
            (ultimo-super-administrador).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: >-
            2.0.0 — ms-cumplimiento no registro el cambio (auditoria fail-closed,
            auditoria-no-disponible); el rol no cambio.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Token emitido por POST /api/v1/auth/login. El SecurityInterceptor valida
        firma, expiracion y version del token antes de evaluar el permiso.

  schemas:
    AuthorizationRequest:
      type: object
      required:
        - role
        - action
      properties:
        role:
          type: string
          enum: [JUGADOR, MODERADOR, ADMINISTRADOR, SUPER_ADMINISTRADOR]
        action:
          $ref: '#/components/schemas/RbacAction'

    RbacAction:
      type: string
      description: >-
        Acción protegida por RBAC. La matriz extendida contiene trece acciones:
        diez de la Tabla 24, ASIGNAR_ROL (HU-RBAC-003), GESTIONAR_CUENTAS
        (HU-USR-003) y, desde 2.0.0, RESTABLECER_SEGUNDO_FACTOR (7.3.9, solo
        Super Administrador).
      enum:
        - CREAR_CUENTA_JUGADOR
        - MODIFICAR_PERFIL_PROPIO
        - PUBLICAR_COMENTARIOS
        - ELIMINAR_COMENTARIO_PROPIO
        - MODERAR_COMENTARIOS
        - EMITIR_ADVERTENCIAS
        - SUSPENDER_USUARIOS
        - BANEAR_DEFINITIVAMENTE
        - CREAR_ADMIN_MODERADOR
        - GESTIONAR_PRODUCTOS
        - ASIGNAR_ROL
        - GESTIONAR_CUENTAS
        - RESTABLECER_SEGUNDO_FACTOR

    AuthorizationResponse:
      type: object
      required:
        - permitted
        - permissionType
        - role
        - action
      properties:
        permitted:
          type: boolean
        permissionType:
          $ref: '#/components/schemas/PermissionType'
        role:
          type: string
        action:
          type: string
        reason:
          type: string

    RoleDescriptor:
      type: object
      required:
        - role
        - name
        - description
      properties:
        role:
          type: string
        name:
          type: string
        description:
          type: string

    PermissionMatrixResponse:
      type: object
      required:
        - version
        - matrix
      properties:
        version:
          type: string
        matrix:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/PermissionType'

    PermissionType:
      type: string
      enum: [GRANTED, DENIED, TEMPORARY]

    AsignarRolRequest:
      type: object
      required:
        - nuevoRol
      properties:
        nuevoRol:
          type: string
          enum: [JUGADOR, MODERADOR, ADMINISTRADOR, SUPER_ADMINISTRADOR]
        motivo:
          type: string
          maxLength: 500
          description: >-
            2.0.0 — por que se cambia el rol; queda en la auditoria. Opcional en
            la API; la consola lo pide.

    MensajeResponse:
      type: object
      properties:
        mensaje:
          type: string

    ProblemDetail:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
