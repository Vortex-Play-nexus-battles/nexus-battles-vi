openapi: 3.1.0
info:
  title: Nexus Battles VI - Publicación de subastas
  version: 1.0.0
  description: |
    Contrato de HU-SUB-001 (7.7.5 del documento del curso). La publicación
    requiere identidad (el vendedor sale del `uid` del token, nunca del
    cuerpo), inventario, catálogo, finanzas y la consulta de sanción.

    Changelog:

    - 0.1.0-draft: borrador de HU-SUB-001.
    - 1.0.0 (B8): se publica como versión real, con las reglas de 7.7 que
      faltaban:
      - el precio de compra inmediata tiene que ser **superior** al precio
        mínimo de puja (7.7.2); antes se aceptaba igual;
      - como mucho **10 subastas activas** por vendedor (7.7.10), comprobado
        bajo un candado por vendedor para que dos publicaciones simultáneas
        no pasen las dos con 9; el Maestro de Juego está exento (7.7.4);
      - el incremento mínimo sale del parámetro `subastas.incremento-minimo`
        de admin-parametros y no de una variable de entorno. Sin valor, 503
        con `type` `.../errors/parametro-no-configurado` y
        `motivo: INCREMENTO_MINIMO_NO_CONFIGURADO` (decisión del Product
        Owner pendiente);
      - la idempotencia de `Idempotency-Key` se guarda en la base de datos
        del servicio: sobrevive a un reinicio y vale entre réplicas;
      - los errores de negocio llevan `motivo`, un código estable para que la
        interfaz elija el mensaje sin leer el texto libre.
servers:
  - url: http://localhost:8092/api/v1
security:
  - bearerJwt: []
paths:
  /subastas:
    post:
      summary: Publicar un elemento propio en subasta
      operationId: publicarSubasta
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicarSubastaRequest'
      responses:
        '201':
          description: Subasta creada en estado ACTIVA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicarSubastaResponse'
        '400':
          description: Solicitud inválida
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401':
          description: Usuario no autenticado
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '403':
          description: Propiedad inválida o sanción activa
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404':
          description: Elemento o producto inexistente
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '409':
          description: Elemento ya publicado o clave de idempotencia conflictiva
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '422':
          description: >
            Saldo insuficiente para la comisión (`motivo: SALDO_INSUFICIENTE`) o
            regla de negocio inválida
            (`motivo: LIMITE_PUBLICACIONES_ACTIVAS` al llegar a 10 subastas
            activas; `motivo: COMPRA_INMEDIATA_NO_SUPERIOR` si la compra
            inmediata no supera el precio mínimo).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '503':
          description: >
            Dependencia no disponible, o el incremento mínimo no está
            configurado en admin-parametros (`motivo:
            INCREMENTO_MINIMO_NO_CONFIGURADO`, `type`
            `https://nexusbattles.upb.edu.co/errors/parametro-no-configurado`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
components:
  securitySchemes:
    bearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Clave del cliente, única por intento de publicación del mismo vendedor.
        Repetirla con la misma solicitud devuelve la subasta ya creada; con otra
        solicitud, 409. Se guarda en la base de datos (1.0.0).
      schema: { type: string, minLength: 1, maxLength: 100 }
  schemas:
    PublicarSubastaRequest:
      type: object
      additionalProperties: false
      required: [elementoInventarioId, productoId, duracion, precioInicial]
      properties:
        elementoInventarioId: { type: string, minLength: 1 }
        productoId: { type: string, format: uuid }
        duracion: { type: string, enum: [24H, 48H] }
        precioInicial:
          type: number
          format: decimal
          exclusiveMinimum: 0
          description: Precio mínimo de puja (obligatorio, 7.7.5).
        precioCompraInmediata:
          type: number
          format: decimal
          exclusiveMinimum: 0
          nullable: true
          description: Opcional. Si viene, tiene que ser superior a `precioInicial` (7.7.2).
    PublicarSubastaResponse:
      type: object
      required: [id, productoId, elementoInventarioId, vendedorId, precioInicial, ofertaVigente, estado, fechaPublicacion, fechaFin, comisionCobrado]
      properties:
        id: { type: string, format: uuid }
        productoId: { type: string, format: uuid }
        elementoInventarioId: { type: string }
        vendedorId: { type: string, format: uuid }
        precioInicial: { type: number, format: decimal }
        ofertaVigente: { type: number, format: decimal }
        precioCompraInmediata: { type: number, format: decimal, nullable: true }
        estado: { type: string, enum: [ACTIVA, ADJUDICADA, SIN_ADJUDICACION, CANCELADA] }
        fechaPublicacion: { type: string, format: date-time }
        fechaFin: { type: string, format: date-time }
        comisionCobrado: { type: number, format: decimal }
        incrementoMinimo:
          type: number
          format: decimal
          description: El incremento con el que nace la subasta (1.0.0).
        nombreProducto: { type: string, nullable: true }
        tipoProducto: { type: string, nullable: true }
        rareza: { type: string, nullable: true }
        miniaturaUrl: { type: string, nullable: true }
        descripcionCorta: { type: string, nullable: true }
        habilidades: { type: string, nullable: true }
    ProblemDetail:
      type: object
      description: Formato de error estándar de los 20 módulos (regla 4 de plataforma).
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        motivo:
          type: string
          description: Código estable, cuando el error es una regla de negocio conocida.
          enum:
            - LIMITE_PUBLICACIONES_ACTIVAS
            - COMPRA_INMEDIATA_NO_SUPERIOR
            - INCREMENTO_MINIMO_NO_CONFIGURADO
            - SALDO_INSUFICIENTE
