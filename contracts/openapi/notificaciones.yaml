openapi: 3.1.0
info:
  title: Nexus Battles VI - Notificaciones (bandeja del jugador)
  description: >
    API de la bandeja de avisos de un jugador (HU-NOT-006, RF-NOT-003,
    RF-NOT-004, RF-NOT-006). Aqui viven las operaciones de consulta y de
    lectura. La entrega en tiempo real viaja por STOMP y esta descrita en
    contracts/websocket/notificaciones.yaml.

    El estado de lectura pertenece al jugador y no a la sesion, por eso marcar
    leido en un dispositivo se ve en todos.

    Desde la 1.1.0 las rutas exigen token de acceso (ADR-002/ADR-005):
    - `/users/{usuarioId}/**` solo la atiende el usuario cuyo `uid` del token
      es ese `usuarioId`; con otro token responde 403 y sin token 401. La
      forma de la ruta no cambia, por eso es version menor.
    - `/internal/notifications` la llaman otros servicios con su credencial
      de servicio (`ROLE_SERVICIO`); un token de usuario responde 403. El
      `usuarioId` del cuerpo es el destinatario, un dato de negocio, no
      quien llama.

    1.2.0 (auditoria de DEV del 30-sep) — el alta de un aviso declara el
    largo de lo que la bandeja guarda: `id` hasta 200 caracteres (antes la
    columna era de 64 sin decirlo, y los identificadores de torneos, de mas
    de 100, se perdian), `tipo` hasta 40 y `titulo` hasta 200. Lo que no cabe
    responde 400; el 409 queda solo para un `id` ya recibido, que es lo que
    el emisor entiende por «ya estaba». Compatible: ningun emisor valido deja
    de serlo.

    1.3.0 (HU-NOT-001 CA-02, #532) — se anade
    `POST /users/{usuarioId}/notifications/read`: marca como leidos, de una
    sola vez, todos los avisos que esten sin leer al procesar la peticion. O
    quedan leidos todos esos o no cambia ninguno: la bandeja nunca queda a
    medias. Responde cuantos avisos se marcaron y cuantos quedan sin leer.
    Igual que marcar uno, es idempotente y reenvia el contador a todas las
    sesiones del jugador. Compatible: solo anade una operacion y su esquema
    de respuesta.
  version: 1.3.0
servers:
  - url: http://localhost:8085/api/v1
    description: Entorno local de desarrollo
security:
  - bearerAuth: []
paths:
  /users/{usuarioId}/notifications:
    get:
      summary: Consultar la bandeja del jugador
      operationId: consultarBandeja
      description: >
        Devuelve el historial completo, del mas antiguo al mas reciente, con el
        estado de lectura de cada aviso y la cuenta de no leidos.
      parameters:
        - name: usuarioId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Bandeja del jugador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BandejaResponse'

  /users/{usuarioId}/notifications/{notificacionId}/read:
    post:
      summary: Marcar un aviso como leido
      operationId: marcarLeida
      description: >
        Marca el aviso como leido para todo el jugador, no solo para la sesion
        que lo pide. Es idempotente: marcar dos veces no cambia nada ni falla.
      parameters:
        - name: usuarioId
          in: path
          required: true
          schema:
            type: string
        - name: notificacionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Aviso marcado, se devuelve la cuenta actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContadorResponse'
        '404':
          description: El aviso no existe en la bandeja de ese jugador
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /users/{usuarioId}/notifications/read:
    post:
      summary: Marcar todos los avisos como leidos
      operationId: marcarTodasLeidas
      description: >
        Marca como leidos, de una sola vez, todos los avisos que esten sin leer
        al procesar la peticion, para todo el jugador, no solo para la sesion
        que lo pide. O quedan leidos todos esos o no cambia ninguno: la bandeja
        nunca queda a medias. Un aviso que llegue al mismo tiempo puede quedar
        sin leer, y entonces se cuenta en `noLeidas`.

        Despues, el contador de no leidos se reenvia a todas las sesiones del
        jugador por el canal en tiempo real (mensaje `contadorActualizado` de
        contracts/websocket/notificaciones.yaml), igual que al marcar uno.

        Es idempotente: repetirlo no cambia nada ni falla; con todo ya leido, o
        con la bandeja vacia, responde con `marcadas` en 0. Existe desde la
        1.3.0 (HU-NOT-001 CA-02).
      parameters:
        - name: usuarioId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Avisos marcados, se devuelve cuantos y la cuenta actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LecturaResponse'

  /users/{usuarioId}/sessions/{sesionId}/pending:
    post:
      summary: Entregar a una sesion lo que se perdio
      operationId: entregarPendientes
      description: >
        Devuelve los avisos que esa sesion todavia no ha recibido y los da por
        entregados. Sirve tanto para el primer ingreso como para la reconexion
        despues de una caida.

        Existe ademas del canal STOMP a proposito: cuando el canal en tiempo
        real no esta disponible, la interfaz puede recuperar lo pendiente por
        aqui. No reemplaza al canal como mecanismo principal, que es lo que
        prohibe la historia.
      parameters:
        - name: usuarioId
          in: path
          required: true
          schema:
            type: string
        - name: sesionId
          in: path
          required: true
          schema:
            type: string
          description: Identificador estable de la sesion, sobrevive a la reconexion
      responses:
        '200':
          description: Avisos entregados en esta llamada, vacio si estaba al dia
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvisoResponse'
        '400':
          description: Identificador de usuario o de sesion invalido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /internal/notifications:
    post:
      summary: Registrar un evento notificable (uso interno entre modulos)
      operationId: emitirNotificacion
      description: >
        Puerta de entrada provisional. Este modulo no inventa eventos, los
        recibe de los demas. Mientras el equipo no acuerde el bus de eventos y
        no exista broker en docker-compose.yml, los modulos publican por aqui.

        Cuando exista el bus, este camino se retira y el contrato abre version
        nueva. Por eso vive bajo /internal y no forma parte de la API publica
        del jugador.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmitirNotificacionRequest'
      responses:
        '201':
          description: Aviso registrado y entregado a las sesiones conectadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntregaResponse'
        '400':
          description: Datos del evento invalidos
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Ya existe un aviso con ese identificador en la bandeja
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Token de acceso emitido por ms-identidad (RS256, verificado contra su
        JWKS). En `/users/{usuarioId}/**` es el token del propio usuario
        (`uid` = `usuarioId`); en `/internal/**` es una credencial de
        servicio (`rol=SERVICIO`, `azp`=servicio que llama, ADR-005).
  schemas:

    EmitirNotificacionRequest:
      type: object
      required: [usuarioId, id, tipo, titulo, cuerpo, creadaEn]
      properties:
        usuarioId:
          type: string
          description: Jugador destinatario del aviso
        id:
          type: string
          maxLength: 200
          description: >
            Identificador del evento que da origen al aviso. Lo pone el modulo
            que emite, para que un reintento no duplique el aviso. Hasta 200
            caracteres (1.2.0).
        tipo:
          type: string
          maxLength: 40
        titulo:
          type: string
          maxLength: 200
        cuerpo:
          type: string
        creadaEn:
          type: string
          format: date-time

    AvisoResponse:
      type: object
      required: [id, tipo, titulo, cuerpo, creadaEn, leida]
      properties:
        id:
          type: string
        tipo:
          type: string
        titulo:
          type: string
        cuerpo:
          type: string
        creadaEn:
          type: string
          format: date-time
        leida:
          type: boolean

    BandejaResponse:
      type: object
      required: [usuarioId, noLeidas, avisos]
      properties:
        usuarioId:
          type: string
        noLeidas:
          type: integer
          minimum: 0
        avisos:
          type: array
          items:
            $ref: '#/components/schemas/AvisoResponse'

    ContadorResponse:
      type: object
      required: [usuarioId, noLeidas]
      properties:
        usuarioId:
          type: string
        noLeidas:
          type: integer
          minimum: 0

    LecturaResponse:
      type: object
      required: [usuarioId, marcadas, noLeidas]
      properties:
        usuarioId:
          type: string
        marcadas:
          type: integer
          minimum: 0
          description: >
            Avisos que pasan de no leidos a leidos con esta llamada. Vale 0 si
            ya estaba todo leido, si la bandeja estaba vacia o si otra llamada
            simultanea ya los habia marcado.
        noLeidas:
          type: integer
          minimum: 0
          description: >
            Cuenta de no leidos al terminar. Es 0, salvo que haya llegado un
            aviso nuevo al mismo tiempo y no haya alcanzado a marcarse.

    EntregaResponse:
      type: object
      required: [aviso, sesionesNotificadas]
      properties:
        aviso:
          $ref: '#/components/schemas/AvisoResponse'
        sesionesNotificadas:
          type: array
          description: >
            Sesiones a las que se entrego en el momento. Vacio si el jugador no
            tenia ninguna abierta, en cuyo caso el aviso queda pendiente.
          items:
            type: string

    ProblemDetail:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
