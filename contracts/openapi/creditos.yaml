openapi: 3.1.0

# =============================================================================
# Nexus Battles VI — Libro de creditos (ms-finanzas · equipo de Cuentas y
# comercio, Grupo 4)
#
# Regla 1 de plataforma: contrato primero. Este documento se escribe A PARTIR
# de lo que `services/cuentas/ms-finanzas` YA implementa y tiene probado
# (`CreditoController`, `CreditoService`, `GlobalExceptionHandler`), operacion
# por operacion y campo por campo. No se ha inventado ninguna regla: quien es
# dueno del saldo, de la reserva y de su expiracion es ms-finanzas.
#
# Dueno del contrato: Grupo 4 (ms-finanzas). Consumidor: salas-partidas
# (HU-JUE-014, #442). Cualquier cambio incompatible abre version nueva
# (regla 2); lo de aqui es lo que ms-finanzas responde hoy.
#
# ---------------------------------------------------------------------------
# COMO LO USA salas-partidas (HU-JUE-014)
#
#   crear / entrar a una sala con recompensa > 0 ->  reservar   (una por jugador)
#   abandonar antes de empezar, cancelar la sala ->  liberar    (la suya / todas)
#   la partida termina con ganador               ->  consumir   (cada reserva de
#                                                    los demas, con el ganador
#                                                    como beneficiario) y liberar
#                                                    la del propio ganador
#   la partida termina en empate                 ->  liberar    (todas)
#
# Todas las operaciones de escritura son idempotentes del lado de ms-finanzas
# (`Idempotency-Key` en reservar; liberar y consumir devuelven el estado que ya
# tenia la reserva), asi que salas-partidas puede reintentar una liquidacion a
# medias sin mover creditos dos veces.
#
# ---------------------------------------------------------------------------
# RECOMPENSA POR JUGAR (1.2.0, HU-JUE-012 #470 — RF-JUE-012)
#
#   la partida termina (con o sin apuesta)       ->  POST /partidas/resultado
#
# salas-partidas INFORMA quien jugo, de que tipo era la partida y quien gano;
# ms-finanzas DECIDE y acredita: 2 al ganador de un uno contra uno, 4 a cada
# ganador de una grupal, 1 por participar, y entrega los cofres de HU-JUE-013.
# Las cifras son de la ficha oficial y no se parametrizan. Idempotente por
# `partidaId`: la segunda vez responde 409 `partida-ya-procesada`, que el
# consumidor toma como «ya esta hecho». `ganadoresUid` (lista) es lo nuevo de
# 1.2.0: en una partida por equipos gana todo el equipo; `ganadorUid` (uno)
# se conserva para el uno contra uno y por compatibilidad. Es una adicion
# compatible: por eso 1.2.0 y no 2.0.0.
#
# ---------------------------------------------------------------------------
# SEGURIDAD (1.1.0, #455 — ADR-001 / ADR-005)
#
# El libro solo lo mueven los servicios: reservar, liberar y consumir exigen
# un token de servicio (`rol=SERVICIO`, emitido por ms-identidad con
# client_credentials; el `azp` dice que servicio habla). El jugador afectado
# viaja SIEMPRE en la peticion (`jugadorUid`, `vendedorUid`), nunca se deduce
# del token. Un jugador con su propio token recibe 403 aunque el uid sea el
# suyo. Excepcion unica: `GET /creditos/{uid}/saldo` lo puede consultar el
# propio usuario (uid de la ruta = claim `uid` de su token).
#
# Hasta 1.0.0 estas rutas estaban abiertas (`permitAll`) y el contrato lo
# decia; cerrarlas cambia quien puede llamar, no la forma de la llamada, y
# los consumidores conocidos (salas-partidas, ms-subastas) ya mandaban o
# mandan la credencial: por eso es 1.1.0 y no 2.0.0.
# =============================================================================

info:
  title: Nexus Battles VI — Libro de creditos
  version: 1.4.0
  description: |
    Saldo, reservas y movimientos de creditos de los jugadores.

    **Reservar no descuenta.** Una reserva aparta creditos del saldo
    disponible sin quitarlos del saldo bruto; el jugador no puede gastarlos
    en otra cosa mientras la reserva este `ACTIVA`. Se cierra de una de dos
    formas: **liberar** (vuelven a estar disponibles) o **consumir** (se
    descuentan del bruto y, si hay beneficiario, se le acreditan a el).

    **Expiracion.** Una reserva caduca a las 72 horas de crearse (lo fija
    ms-finanzas; `expiraEn` lo dice). Que pasa con una reserva expirada que
    nadie libero es una decision de ms-finanzas, no de este contrato.

    Errores en formato problem details (regla 4) con `type` estable bajo
    `https://nexusbattles.upb.edu.co/errors/`.

    **Debito y credito directos (1.4.0).** Ademas de las reservas, el libro
    admite mover saldo sin apartarlo antes: `debitar`, `reversar` y
    `acreditar`, mas la consulta de una operacion por su `refId`. Existian en
    `CreditoController` desde antes y no estaban en ningun contrato; se
    documentan ahora tal como responden hoy. Las tres escrituras comparten la
    misma tabla que las reservas, y por eso `refId` es a la vez la referencia
    del llamador y la clave de idempotencia.

    **Brecha conocida, fuera de este contrato:** `GET /api/v1/cofres/mios` de
    ms-finanzas (HU-JUE-013) no esta en ningun contrato publicado. Queda
    anotada aqui para que conste, pero no se documenta en este archivo porque
    pertenece al dominio de cofres, no al libro de creditos: mezclarla
    obligaria a este contrato a versionarse cada vez que cambie algo de
    cofres.
  license:
    name: Uso academico — Proyecto Integrador II, UPB Bucaramanga

servers:
  - url: http://localhost:8093/api/v1
    description: Desarrollo local (context-path /api/v1 del propio servicio)
  - url: http://srv-ms-finanzas:8093/api/v1
    description: Red de compose

tags:
  - name: creditos
    description: Saldo y reservas del libro de creditos (HU-PAG-001)

# Por defecto, todo el libro exige credencial de servicio. Las operaciones
# que admiten ademas al propio usuario lo declaran explicitamente.
security:
  - credencialDeServicio: []

paths:
  /creditos/{uid}/saldo:
    get:
      tags: [creditos]
      operationId: consultarSaldo
      summary: Saldo bruto, reservado y disponible de un jugador
      description: |
        Un jugador sin cuenta todavia responde 200 con todo a cero: la cuenta
        se crea con su primera operacion.

        Lo consulta un servicio (cualquier `uid`) o el propio usuario (el
        `uid` de la ruta tiene que ser el claim `uid` de su token; otro uid
        responde 403).
      security:
        - credencialDeServicio: []
        - tokenDeUsuario: []
      parameters:
        - $ref: '#/components/parameters/Uid'
      responses:
        '401':
          $ref: '#/components/responses/SinCredencial'
        '403':
          $ref: '#/components/responses/NoAutorizado'
        '200':
          description: Saldo actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Saldo'
              example:
                jugadorUid: 6f1c2a7e-3d6b-4b9a-8f0e-1c2d3e4f5a6b
                saldoBruto: 500
                saldoReservado: 120
                saldoDisponible: 380

  /creditos/{uid}/movimientos:
    get:
      tags: [creditos]
      operationId: listarMovimientos
      summary: Historial de movimientos de credito del jugador
      description: |
        Todo lo que movio el saldo del jugador, de lo mas reciente a lo mas
        antiguo: la apuesta reservada al entrar a una sala, su cobro o su
        devolucion al terminar, la recompensa por jugar (HU-JUE-012), la
        inscripcion a un torneo y cualquier debito o credito directo.

        **Por que existe (1.3.0, #569):** el jugador solo podia ver sus pagos
        en moneda real (`/transacciones/mi-historial`), asi que una partida con
        apuesta no aparecia en ninguna parte de la interfaz aunque el saldo
        hubiera cambiado. La fuente es la misma tabla que da idempotencia a
        `acreditar` y `debitar`, no un registro nuevo.

        `signo` resume la regla para la interfaz: `SUMA` (el saldo subio),
        `RESTA` (bajo), `APARTA` (reserva todavia activa) y `NEUTRO` (reserva
        liberada, no movio nada). Asi la vista no la reimplementa.

        Mismo acceso que el saldo: un servicio consulta el de cualquiera; una
        persona, solo el suyo (403 con otro `uid`). Es lectura, pero dice
        cuanto aposto y cuanto gano alguien.
      security:
        - credencialDeServicio: []
        - tokenDeUsuario: []
      parameters:
        - $ref: '#/components/parameters/Uid'
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          required: false
          description: Se acota a 100 en el servidor.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '401':
          $ref: '#/components/responses/SinCredencial'
        '403':
          $ref: '#/components/responses/NoAutorizado'
        '200':
          description: Pagina de movimientos, del mas reciente al mas antiguo
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items: { $ref: '#/components/schemas/MovimientoDeCredito' }
                  totalElements: { type: integer }
                  totalPages: { type: integer }
                  number: { type: integer }
                  size: { type: integer }
                  first: { type: boolean }
                  last: { type: boolean }
              example:
                content:
                  - id: 3f1c2a7e-3d6b-4b9a-8f0e-1c2d3e4f5a6b
                    monto: 2
                    concepto: recompensa-victoria
                    referenciaId: partida-9c1e-jugador-6f1c
                    tipo: CREDITO
                    estado: CONSUMIDA
                    signo: SUMA
                    creado: '2026-09-22T02:31:00Z'
                  - id: 8a2d3e4f-5a6b-4c7d-9e0f-1a2b3c4d5e6f
                    monto: 60
                    concepto: apuesta-sala
                    referenciaId: sala-4b7a-jugador-6f1c
                    tipo: RESERVA
                    estado: LIBERADA
                    signo: NEUTRO
                    creado: '2026-09-22T02:28:00Z'
                totalElements: 2
                totalPages: 1
                number: 0
                size: 20
                first: true
                last: true

  /creditos/reservar:
    post:
      tags: [creditos]
      operationId: reservarCreditos
      summary: Reserva creditos del jugador
      description: |
        Comprueba y aparta en una sola operacion del lado del proveedor: no
        hay hueco entre «me alcanza» y «quedan apartados».

        **Idempotente** por `Idempotency-Key`: repetir la peticion con la
        misma clave devuelve la reserva ya creada (201 igual), sin apartar
        dos veces. La clave es del llamador; ms-finanzas solo garantiza que
        dos peticiones con la misma clave son la misma reserva. Reutilizar
        una clave de una reserva ya cerrada devuelve esa reserva cerrada, no
        una nueva: quien reserva de nuevo (por ejemplo, un jugador que vuelve
        a entrar a la misma sala) tiene que usar una clave distinta.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservarCreditos'
            example:
              jugadorUid: 6f1c2a7e-3d6b-4b9a-8f0e-1c2d3e4f5a6b
              monto: 120
              concepto: apuesta-sala
              referenciaId: sala-1b4e28ba-2fa1-11d2-883f-0016d3cca427
      responses:
        '401':
          $ref: '#/components/responses/SinCredencial'
        '403':
          $ref: '#/components/responses/NoAutorizado'
        '201':
          description: Reserva creada (o ya existente con esa clave)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '422':
          description: |
            Saldo disponible insuficiente. `type` =
            `https://nexusbattles.upb.edu.co/errors/saldo-insuficiente`.
            El cuerpo no trae las cifras: quien necesite decir «tienes X y
            necesitas Y» consulta el saldo aparte.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaDeCreditos'
              example:
                type: https://nexusbattles.upb.edu.co/errors/saldo-insuficiente
                title: Saldo insuficiente
                status: 422
                detail: Saldo insuficiente para reservar 120 créditos.
        '400':
          description: Cuerpo invalido (monto no positivo, uid vacio...)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaDeCreditos'

  /creditos/reservas/{reservaId}/liberar:
    post:
      tags: [creditos]
      operationId: liberarReserva
      summary: Devuelve una reserva al saldo disponible
      description: |
        **Idempotente:** liberar una reserva que ya no esta `ACTIVA` responde
        200 con el estado que tenia (`LIBERADA` o `CONSUMIDA`) y no mueve
        nada. Solo una reserva `ACTIVA` cambia de estado.
      parameters:
        - $ref: '#/components/parameters/ReservaId'
      responses:
        '401':
          $ref: '#/components/responses/SinCredencial'
        '403':
          $ref: '#/components/responses/NoAutorizado'
        '200':
          description: Estado de la reserva tras la operacion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '404':
          description: |
            No existe una reserva con ese identificador. `type` =
            `https://nexusbattles.upb.edu.co/errors/reserva-no-encontrada`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaDeCreditos'

  /creditos/reservas/{reservaId}/consumir:
    post:
      tags: [creditos]
      operationId: consumirReserva
      summary: Cobra una reserva y, si hay beneficiario, se la acredita
      description: |
        Descuenta el monto del saldo bruto del jugador que reservo y lo suma
        al saldo bruto de `vendedorUid` si viene informado; sin beneficiario
        los creditos simplemente se descuentan.

        **Idempotente:** consumir una reserva ya `CONSUMIDA` responde 200
        con `transaccionId = TX-EXISTENTE` y no vuelve a cobrar. Consumir una
        reserva `LIBERADA` es un conflicto (409): el dinero ya se devolvio.
      parameters:
        - $ref: '#/components/parameters/ReservaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsumirReserva'
            example:
              vendedorUid: 9a8b7c6d-5e4f-4a3b-9c2d-1e0f9a8b7c6d
      responses:
        '401':
          $ref: '#/components/responses/SinCredencial'
        '403':
          $ref: '#/components/responses/NoAutorizado'
        '200':
          description: Reserva cobrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consumo'
        '404':
          description: Reserva inexistente (`reserva-no-encontrada`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaDeCreditos'
        '409':
          description: |
            La reserva ya fue liberada. `type` =
            `https://nexusbattles.upb.edu.co/errors/reserva-ya-liberada`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaDeCreditos'

  /creditos/debitar:
    post:
      tags: [creditos]
      operationId: debitarCreditos
      summary: Descuenta creditos del saldo del jugador, sin reserva previa
      description: |
        Baja el monto del saldo bruto en una sola operacion. Es el camino
        directo, para cuando no hay nada que apartar y luego cobrar: una
        comision, un cargo que ya esta decidido.

        **Idempotente por `refId`.** Si ya existe una operacion registrada con
        ese `refId`, no se vuelve a descontar: se devuelve 200 con el **mismo
        `transaccionId`** que el registro previo (`TX-DEB-` seguido de los
        ocho primeros caracteres del identificador de aquella fila, que no
        cambia). Asi un reintento de red del llamador no cobra dos veces, y
        puede comparar el `transaccionId` para saber que esta viendo la
        respuesta de la operacion original.

        A diferencia de `reservar`, la clave de idempotencia **no** va en la
        cabecera `Idempotency-Key`: es el propio `refId` del cuerpo. Un
        llamador que reutilice un `refId` para un cargo distinto no cobrara el
        segundo y recibira la respuesta del primero.

        La cuenta se crea sola en la primera operacion del jugador; no hace
        falta darla de alta antes.
      responses:
        '401':
          $ref: '#/components/responses/SinCredencial'
        '403':
          $ref: '#/components/responses/NoAutorizado'
        '200':
          description: Debito aplicado, o respuesta del debito previo con ese `refId`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Debito'
              example:
                transaccionId: TX-DEB-9C1E4B7A
                refId: comision-subasta-4b7a
                estado: EXITOSO
                montoDebitado: 15
                nuevoSaldoDisponible: 365
        '422':
          description: |
            Saldo disponible insuficiente para el debito. `type` =
            `https://nexusbattles.upb.edu.co/errors/saldo-insuficiente`. Se
            comprueba contra el **disponible**, no contra el bruto: lo que
            otra reserva ya tiene apartado no se puede debitar.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaDeCreditos'
        '400':
          description: |
            Cuerpo invalido (`argumento-invalido`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaDeCreditos'
        '500':
          $ref: '#/components/responses/ErrorInterno'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DebitarCreditos'
            example:
              uid: 6f1c2a7e-3d6b-4b9a-8f0e-1c2d3e4f5a6b
              monto: 15
              refId: comision-subasta-4b7a
              concepto: comision-subasta

  /creditos/reversar:
    post:
      tags: [creditos]
      operationId: reversarDebito
      summary: Compensa un debito anterior devolviendo el monto al jugador
      description: |
        Devuelve al saldo bruto el monto de un debito ya aplicado, y marca
        aquella operacion como `LIBERADA`. El jugador al que se le devuelve no
        se indica: se toma del debito original, para que no se pueda devolver
        el dinero de uno a la cuenta de otro.

        **Idempotente:** reversar algo ya reversado responde 200 con
        `estado = YA_REVERSADO` y no vuelve a sumar. La primera vez responde
        `REVERSADO`. Los dos estados son exito; el llamador no tiene que
        distinguirlos salvo para su propia bitacora.

        **Solo compensa operaciones de tipo DEBITO.** Reservas y creditos
        quedan fuera a proposito: antes esta busqueda no miraba el tipo de
        operacion, asi que un `refId` que coincidiera con una reserva `ACTIVA`
        o con un credito ya otorgado se «reversaba» igual —sumaba al saldo
        bruto sin tocar el reservado, creando saldo de la nada, y dejaba
        aquella reserva inconsumible para siempre—. Para deshacer una reserva
        lo que corresponde es `liberar`, no esto.
      responses:
        '401':
          $ref: '#/components/responses/SinCredencial'
        '403':
          $ref: '#/components/responses/NoAutorizado'
        '200':
          description: Debito compensado, o ya lo estaba
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reverso'
              example:
                refId: comision-subasta-4b7a
                estado: REVERSADO
                montoReversado: 15
                motivo: Subasta anulada por el administrador
        '404':
          description: |
            No hay un debito reversable con ese `refId`. `type` =
            `https://nexusbattles.upb.edu.co/errors/reserva-no-encontrada`.

            **Este 404 cubre dos situaciones distintas y no las distingue:**
            que el `refId` no exista, y que exista pero corresponda a una
            operacion que no es de tipo `DEBITO` (una reserva o un credito).
            Un llamador que vea este 404 no puede concluir que el `refId` sea
            desconocido; para saberlo tiene que consultarlo con
            `GET /creditos/operaciones/{refId}`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaDeCreditos'
        '500':
          $ref: '#/components/responses/ErrorInterno'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReversarDebito'
            example:
              refId: comision-subasta-4b7a
              motivo: Subasta anulada por el administrador

  /creditos/operaciones/{refId}:
    get:
      tags: [creditos]
      operationId: consultarOperacion
      summary: Consulta una operacion del libro por la referencia del llamador
      description: |
        Devuelve la operacion registrada con ese `refId`, sea una reserva, un
        debito o un credito: las tres comparten tabla y el `refId` es su clave
        de idempotencia.

        Es la forma de que un llamador reconcilie su propio estado tras una
        respuesta perdida: en vez de reintentar la escritura a ciegas,
        pregunta si aquel `refId` llego a registrarse y en que quedo. Tambien
        es lo que permite desambiguar el 404 de `reversar`, que confunde
        «no existe» con «existe pero no es un debito».

        A diferencia del saldo y de los movimientos, esta consulta **es solo
        para servicios**: cae en el matcher `/creditos/**` y no tiene la
        excepcion del propio dueno, porque el `refId` es un identificador del
        llamador y el servicio no puede saber de quien es sin leer la fila.
      parameters:
        - name: refId
          in: path
          required: true
          description: |
            Referencia que eligio el llamador al crear la operacion; es la
            misma que uso como clave de idempotencia.
          schema:
            type: string
      responses:
        '401':
          $ref: '#/components/responses/SinCredencial'
        '403':
          $ref: '#/components/responses/NoAutorizado'
        '200':
          description: Operacion encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operacion'
              example:
                refId: comision-subasta-4b7a
                uid: 6f1c2a7e-3d6b-4b9a-8f0e-1c2d3e4f5a6b
                monto: 15
                concepto: comision-subasta
                estado: CONSUMIDA
                fecha: '2026-09-22T02:31:00Z'
        '404':
          description: |
            No hay ninguna operacion con ese `refId`. `type` =
            `https://nexusbattles.upb.edu.co/errors/reserva-no-encontrada`.
            Aqui el 404 si significa exactamente eso, sin la ambiguedad del de
            `reversar`: esta consulta no filtra por tipo de operacion.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaDeCreditos'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /creditos/acreditar:
    post:
      tags: [creditos]
      operationId: acreditarCreditos
      summary: Suma creditos al saldo del jugador
      description: |
        Sube el monto al saldo bruto del jugador. Es el simetrico de
        `debitar`: la recompensa de una partida, la devolucion de una
        inscripcion, un ajuste a favor.

        **Idempotente por `refId`**, con la misma mecanica que `debitar`: si
        ya hay una operacion con ese `refId`, se devuelve 200 con el mismo
        `transaccionId` (`TX-ACR-` seguido de los ocho primeros caracteres del
        identificador de aquella fila) y no se vuelve a sumar. Sin esto, un
        reintento de red del llamador duplicaria los creditos otorgados por el
        mismo resultado de partida.

        **Esta operacion no puede responder 422.** A diferencia de `debitar` y
        de `reservar`, no comprueba ningun saldo: sumar nunca deja la cuenta
        corta. Un llamador que trate el 422 como caso posible aqui esta
        escribiendo una rama muerta.

        La cuenta se crea sola si el jugador no la tenia.
      responses:
        '401':
          $ref: '#/components/responses/SinCredencial'
        '403':
          $ref: '#/components/responses/NoAutorizado'
        '200':
          description: Credito aplicado, o respuesta del credito previo con ese `refId`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credito'
              example:
                transaccionId: TX-ACR-3F2A1B0C
                refId: recompensa-partida-9c1e
                estado: APLICADO
                montoAcreditado: 4
                nuevoSaldoDisponible: 384
        '400':
          description: |
            Cuerpo invalido (`argumento-invalido`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaDeCreditos'
        '500':
          $ref: '#/components/responses/ErrorInterno'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcreditarCreditos'
            example:
              uid: 6f1c2a7e-3d6b-4b9a-8f0e-1c2d3e4f5a6b
              monto: 4
              refId: recompensa-partida-9c1e
              concepto: recompensa-victoria

  /partidas/resultado:
    post:
      tags: [partidas]
      operationId: informarResultadoDePartida
      summary: Informa el resultado de una partida y acredita la recompensa por jugar
      description: |
        RF-JUE-012 (HU-JUE-012). Acredita **2** creditos al ganador de un
        `UNO_A_UNO`, **4** a cada ganador de una `GRUPAL` y **1** a cada
        participante que no gano, y registra los creditos ganados para los
        cofres de RF-JUE-013 (`cofreId` cuando toca uno). Un participante
        `sancionado` no recibe nada y vuelve en `sancionadosExcluidos`: la
        sancion la sabe quien llama (moderacion), no este servicio.

        **Idempotente por `partidaId`:** la segunda vez responde 409
        `partida-ya-procesada` y no acredita de nuevo. El consumidor debe
        tratar ese 409 como «ya esta hecho», no como fallo.

        **Ganadores:** `ganadoresUid` manda si viene con elementos (todo el
        equipo ganador, cada uno con lo del ganador); si no, `ganadorUid`.
        Los dos ausentes o vacios = nadie gano (empate, o gano la maquina):
        todos reciben solo lo de participar. La maquina no se informa: no
        tiene cuenta.
      security:
        - credencialDeServicio: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResultadoDePartida'
            example:
              partidaId: 7c2d1f0e-1b2a-4c3d-8e9f-0a1b2c3d4e5f
              tipoPartida: GRUPAL
              ganadoresUid: [3f2a1b0c-9d8e-4f7a-b6c5-d4e3f2a1b0c9, 5e4d3c2b-1a0f-4e9d-8c7b-6a5f4e3d2c1b]
              participantes:
                - { uid: 3f2a1b0c-9d8e-4f7a-b6c5-d4e3f2a1b0c9, sancionado: false }
                - { uid: 5e4d3c2b-1a0f-4e9d-8c7b-6a5f4e3d2c1b, sancionado: false }
                - { uid: 9a8b7c6d-5e4f-4a3b-9c2d-1e0f9a8b7c6d, sancionado: true }
      responses:
        '401':
          $ref: '#/components/responses/SinCredencial'
        '403':
          $ref: '#/components/responses/NoAutorizado'
        '200':
          description: Recompensa acreditada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcreditacionDePartida'
        '400':
          description: |
            Informe invalido (`argumento-invalido`): sin `partidaId`, sin
            `tipoPartida`, sin participantes, o un ganador que no jugo.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaDeCreditos'
        '409':
          description: |
            Esa partida ya se proceso. `type` =
            `https://nexusbattles.upb.edu.co/errors/partida-ya-procesada`;
            trae `partidaId`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaDeCreditos'

components:
  securitySchemes:
    credencialDeServicio:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token de servicio (ADR-005): `rol=SERVICIO`, `azp=<client_id>`,
        obtenido por `client_credentials` en `POST /api/v1/auth/token` de
        ms-identidad y verificado contra su JWKS. Es la credencial de un
        servicio (salas-partidas, ms-subastas...), nunca la de un jugador.
    tokenDeUsuario:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de sesion de un usuario (ADR-002), con claim `uid`.

  responses:
    SinCredencial:
      description: Sin token, token caducado o firmado por otra clave.
    NoAutorizado:
      description: |
        El token es valido pero no puede hacer esto: un usuario intentando
        mover saldo, o consultando el saldo de otro.
    ErrorInterno:
      description: |
        Fallo no controlado del servicio. `type` =
        `https://nexusbattles.upb.edu.co/errors/error-interno`. El `detail` es
        deliberadamente generico —no filtra detalles de implementacion— pero
        el cuerpo trae la propiedad extra **`excepcion`** con el nombre simple
        de la clase, para que un llamador pueda distinguir «excepcion X no
        mapeada» de «excepcion Y no mapeada» sin depender del texto libre ni
        tener que leer los registros del servidor.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemaInternoDeCreditos'
          example:
            type: https://nexusbattles.upb.edu.co/errors/error-interno
            title: Error interno del servidor
            status: 500
            detail: Ocurrió un error inesperado. Inténtalo de nuevo más tarde.
            excepcion: DataIntegrityViolationException

  parameters:
    Uid:
      name: uid
      in: path
      required: true
      description: Identificador estable del jugador (`uid` del token, ADR-002)
      schema:
        type: string
        maxLength: 64
    ReservaId:
      name: reservaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Clave elegida por el llamador, unica por reserva que quiere crear.
        Maximo 128 caracteres.
      schema:
        type: string
        maxLength: 128

  schemas:
    MovimientoDeCredito:
      type: object
      description: Una linea del historial de creditos del jugador (#569).
      required: [id, monto, tipo, estado, signo, creado]
      properties:
        id: { type: string, format: uuid }
        monto: { type: number }
        concepto:
          type: [string, 'null']
          description: Por ejemplo `apuesta-sala`, `recompensa-victoria`, `inscripcion-torneo`.
        referenciaId:
          type: [string, 'null']
          description: A que se refiere el movimiento (partida, sala, torneo).
        tipo: { type: string, enum: [RESERVA, DEBITO, CREDITO] }
        estado: { type: string, enum: [ACTIVA, LIBERADA, CONSUMIDA] }
        signo:
          type: string
          enum: [SUMA, RESTA, APARTA, NEUTRO]
          description: Como afecto al saldo; lo decide el servicio, no la vista.
        creado: { type: string, format: date-time }

    Saldo:
      type: object
      required: [jugadorUid, saldoBruto, saldoReservado, saldoDisponible]
      properties:
        jugadorUid: { type: string }
        saldoBruto:
          type: number
          description: Todo lo que el jugador tiene, reservado incluido
        saldoReservado:
          type: number
          description: Apartado por reservas ACTIVAS
        saldoDisponible:
          type: number
          description: bruto - reservado; lo que puede gastar o reservar

    ReservarCreditos:
      type: object
      required: [jugadorUid, monto, concepto, referenciaId]
      properties:
        jugadorUid: { type: string, maxLength: 64 }
        monto:
          type: number
          exclusiveMinimum: 0
        concepto:
          type: string
          maxLength: 128
          description: Para que se reserva (`apuesta-sala`, `puja`...)
        referenciaId:
          type: string
          maxLength: 128
          description: Identificador del objeto del dominio llamador (la sala, la subasta)

    Reserva:
      type: object
      required: [reservaId, jugadorUid, monto, estado, expiraEn]
      properties:
        reservaId: { type: string, format: uuid }
        jugadorUid: { type: string }
        monto: { type: number }
        estado:
          type: string
          enum: [ACTIVA, LIBERADA, CONSUMIDA]
        expiraEn: { type: string, format: date-time }

    ConsumirReserva:
      type: object
      properties:
        vendedorUid:
          type: [string, 'null']
          description: |
            A quien se le acreditan los creditos cobrados. Nulo o vacio: se
            descuentan sin acreditar a nadie.

    Consumo:
      type: object
      required: [reservaId, estado, montoDebitado, transaccionId]
      properties:
        reservaId: { type: string, format: uuid }
        estado:
          type: string
          enum: [CONSUMIDA]
        montoDebitado: { type: number }
        vendedorUid: { type: [string, 'null'] }
        transaccionId:
          type: string
          description: '`TX-CRED-...` en el primer cobro; `TX-EXISTENTE` en las repeticiones'

    ResultadoDePartida:
      type: object
      required: [partidaId, tipoPartida, participantes]
      properties:
        partidaId:
          type: string
          maxLength: 128
          description: Identificador de la partida en salas-partidas; clave de idempotencia
        tipoPartida:
          type: string
          enum: [UNO_A_UNO, GRUPAL]
          description: |
            `UNO_A_UNO`: dos contendientes (incluida la modalidad contra la
            maquina). `GRUPAL`: mas de dos, con o sin equipos.
        ganadorUid:
          type: [string, 'null']
          description: Ganador unico. Ignorado si `ganadoresUid` trae elementos.
        ganadoresUid:
          type: array
          items: { type: string }
          description: Ganadores (todo el equipo ganador). Vacio o ausente = nadie gano.
        participantes:
          type: array
          minItems: 1
          items:
            type: object
            required: [uid, sancionado]
            properties:
              uid: { type: string }
              sancionado:
                type: boolean
                description: Con sancion activa al terminar; no recibe creditos

    AcreditacionDePartida:
      type: object
      required: [partidaId, acreditaciones, sancionadosExcluidos]
      properties:
        partidaId: { type: string }
        acreditaciones:
          type: array
          items:
            type: object
            required: [uid, monto, esGanador]
            properties:
              uid: { type: string }
              monto:
                type: integer
                description: 2, 4 o 1 segun el caso
              esGanador: { type: boolean }
              cofreId:
                type: [string, 'null']
                format: uuid
                description: Cofre entregado con estos creditos (RF-JUE-013), si toco
        sancionadosExcluidos:
          type: array
          items: { type: string }

    DebitarCreditos:
      type: object
      description: Cuerpo de `POST /creditos/debitar` (1.4.0).
      required: [uid, monto, refId]
      properties:
        uid:
          type: string
          description: Identificador estable del jugador (ADR-002). La cuenta se crea sola si no existe.
        monto: { type: number }
        refId:
          type: string
          description: |
            Referencia del llamador y, a la vez, **clave de idempotencia**:
            repetir el mismo `refId` no vuelve a descontar. No va en la
            cabecera `Idempotency-Key`, a diferencia de `reservar`.
        concepto:
          type: [string, 'null']
          description: Para que se debita. Ausente o nulo, se registra como `DEBITO-DIRECTO`.

    Debito:
      type: object
      description: Respuesta de `POST /creditos/debitar` (1.4.0).
      required: [transaccionId, refId, estado, montoDebitado, nuevoSaldoDisponible]
      properties:
        transaccionId:
          type: string
          description: |
            `TX-DEB-` seguido de ocho caracteres hexadecimales en mayusculas.
            En un debito nuevo es aleatorio; en una repeticion del mismo
            `refId` deriva del identificador de la fila ya registrada, asi que
            es **el mismo en todas las repeticiones**.
          pattern: '^TX-DEB-[0-9A-F]{8}$'
        refId: { type: string }
        estado:
          type: string
          enum: [EXITOSO]
          description: Unico valor posible; un debito que no se aplica sale por un codigo de error.
        montoDebitado: { type: number }
        nuevoSaldoDisponible:
          type: number
          description: Saldo disponible del jugador despues del debito.

    ReversarDebito:
      type: object
      description: Cuerpo de `POST /creditos/reversar` (1.4.0).
      required: [refId]
      properties:
        refId:
          type: string
          description: |
            Referencia del debito que se quiere compensar. El jugador no se
            indica: se toma del debito original.
        motivo:
          type: [string, 'null']
          description: Por que se compensa. Se devuelve tal cual, sin interpretarse.

    Reverso:
      type: object
      description: Respuesta de `POST /creditos/reversar` (1.4.0).
      required: [refId, estado, montoReversado]
      properties:
        refId: { type: string }
        estado:
          type: string
          enum: [REVERSADO, YA_REVERSADO]
          description: |
            `REVERSADO`: se devolvio ahora. `YA_REVERSADO`: ya estaba
            compensado y no se movio nada. Los dos son exito.
        montoReversado:
          type: number
          description: Monto del debito original, tanto si se devolvio ahora como si ya lo estaba.
        motivo:
          type: [string, 'null']
          description: El mismo `motivo` que se envio.

    Operacion:
      type: object
      description: |
        Una operacion del libro vista por su `refId` (1.4.0). Cubre los tres
        tipos —reserva, debito y credito— porque los tres comparten la misma
        tabla; el tipo no se devuelve, solo el estado.
      required: [refId, uid, monto, estado, fecha]
      properties:
        refId: { type: string }
        uid:
          type: string
          description: Jugador al que pertenece la operacion.
        monto: { type: number }
        concepto:
          type: [string, 'null']
        estado:
          type: string
          enum: [ACTIVA, LIBERADA, CONSUMIDA]
          description: |
            Mismo enumerado que en las reservas. Un debito o un credito ya
            aplicados se registran como `CONSUMIDA`; un debito compensado
            queda `LIBERADA`.
        fecha:
          type: string
          format: date-time
          description: |
            Cuando se registro. Si la fila no tiene fecha guardada, el
            servicio devuelve el instante de la consulta en lugar de un nulo.

    AcreditarCreditos:
      type: object
      description: Cuerpo de `POST /creditos/acreditar` (1.4.0).
      required: [uid, monto, refId]
      properties:
        uid:
          type: string
          description: Identificador estable del jugador (ADR-002). La cuenta se crea sola si no existe.
        monto: { type: number }
        refId:
          type: string
          description: Referencia del llamador y clave de idempotencia; repetirla no vuelve a sumar.
        concepto:
          type: [string, 'null']
          description: Por que se acredita. Ausente o nulo, se registra como `CREDITO-PARTIDA`.

    Credito:
      type: object
      description: Respuesta de `POST /creditos/acreditar` (1.4.0).
      required: [transaccionId, refId, estado, montoAcreditado, nuevoSaldoDisponible]
      properties:
        transaccionId:
          type: string
          description: |
            `TX-ACR-` seguido de ocho caracteres hexadecimales en mayusculas.
            Como en `debitar`, una repeticion del mismo `refId` devuelve
            siempre el mismo valor.
          pattern: '^TX-ACR-[0-9A-F]{8}$'
        refId: { type: string }
        estado:
          type: string
          enum: [APLICADO]
          description: Unico valor posible.
        montoAcreditado: { type: number }
        nuevoSaldoDisponible:
          type: number
          description: Saldo disponible del jugador despues del credito.

    ProblemaDeCreditos:
      type: object
      description: RFC 7807 con `type` estable bajo https://nexusbattles.upb.edu.co/errors/
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }

    ProblemaInternoDeCreditos:
      description: |
        El problem detail de un fallo no controlado (500), que ademas de los
        campos comunes trae `excepcion` (1.4.0).
      allOf:
        - $ref: '#/components/schemas/ProblemaDeCreditos'
        - type: object
          required: [excepcion]
          properties:
            excepcion:
              type: string
              description: |
                Nombre simple de la clase de la excepcion que fallo. Es lo
                unico especifico que sale del servidor: el `detail` es
                generico a proposito.
