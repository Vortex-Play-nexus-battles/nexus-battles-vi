openapi: 3.1.0
info:
  title: Servicio de productos
  version: 1.0.0
  description: >
    Creación de productos del catálogo de THE NEXUS BATTLES VI
    (HU-PRD-001). Contrato publicado antes de la implementación,
    conforme a la regla de plataforma "contrato primero".

servers:
  - url: /
    description: Servicio publicado en el mismo origen configurado por la plataforma.

paths:
  /api/v1/productos/estadisticas:
    get:
      summary: Consulta el estado del catálogo
      operationId: consultarEstadoCatalogo
      description: Devuelve el total y la distribución de productos por tipo y estado.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Resumen actual del catálogo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumenCatalogo"
        "401":
          description: Token Bearer ausente, inválido o expirado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DetalleDeProblema"
  /api/v1/productos:
    post:
      summary: Crea un producto en el catálogo
      operationId: crearProducto
      description: >
        Operación permitida únicamente a los roles ADMINISTRADOR y
        SUPER_ADMINISTRADOR. El identificador, el estado inicial ACTIVO,
        la versión y las fechas son generados por el sistema.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudCrearProducto"
      responses:
        "201":
          description: Producto creado y registrado en el catálogo
          headers:
            Location:
              description: Ubicación del producto creado
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductoCreado"
        "400":
          description: >
            Solicitud inválida por campos obligatorios ausentes, precios
            negativos, tiraje inválido, tipo no permitido o atributos que
            no corresponden al tipo seleccionado.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DetalleDeProblema"

        "401":
          description: Token Bearer ausente, inválido o expirado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DetalleDeProblema"
        "403":
          description: El usuario no tiene permiso para crear productos
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DetalleDeProblema"
        "500":
          description: Error interno al registrar el producto
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DetalleDeProblema"

  /api/v1/productos/{id}:
    get:
      summary: Consulta un producto del catálogo por su identificador
      operationId: consultarProducto
      description: >
        Endpoint público, sin autenticación: a diferencia de la creación
        (POST, restringida a ADMINISTRADOR/SUPER_ADMINISTRADOR), este GET
        lo consumen otros servicios del propio dominio de juego —por
        ejemplo inventario, para resolver el nombre y tipo de un producto
        equipado (HU-INV-006)— sin que quien llama sea necesariamente un
        administrador ni un usuario autenticado. No se expone aquí ningún
        dato sensible: el mismo detalle que ya devuelve el 201 de creación.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador del producto (UUID v4).
      responses:
        "200":
          description: Producto encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductoCreado"
        "404":
          description: No existe ningún producto con ese identificador
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DetalleDeProblema"
    patch:
      summary: Modifica uno o varios campos de un producto existente
      operationId: modificarProducto
      description: >
        HU-PRD-003. Operación permitida únicamente a los roles ADMINISTRADOR
        y SUPER_ADMINISTRADOR. El cliente envía solo los campos que quiere
        cambiar; el servidor los fusiona en memoria sobre el producto
        existente y valida el resultado completo con las mismas reglas de
        SolicitudCrearProducto para el tipo ya establecido — tipo no es
        modificable. Antes de aplicar el cambio se guarda el estado anterior
        completo del producto como respaldo histórico.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador del producto (UUID v4).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudModificarProducto"
      responses:
        "200":
          description: Producto modificado, con el resultado completo ya fusionado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductoCreado"
        "400":
          description: >
            Solicitud vacía (ningún campo presente), o la combinación
            resultante de campos no corresponde al tipo del producto.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DetalleDeProblema"
        "401":
          description: Token Bearer ausente, inválido o expirado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DetalleDeProblema"
        "403":
          description: El usuario no tiene permiso para modificar productos
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DetalleDeProblema"
        "404":
          description: No existe ningún producto con ese identificador
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DetalleDeProblema"
        "500":
          description: Error interno al registrar el cambio
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DetalleDeProblema"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Token emitido por Keycloak. La creación de productos requiere el rol
        ADMINISTRADOR o SUPER_ADMINISTRADOR.
  schemas:
    SolicitudCrearProducto:
      oneOf:
        - $ref: "#/components/schemas/SolicitudCrearHeroe"
        - $ref: "#/components/schemas/SolicitudCrearHabilidad"
        - $ref: "#/components/schemas/SolicitudCrearArma"
        - $ref: "#/components/schemas/SolicitudCrearArmadura"
        - $ref: "#/components/schemas/SolicitudCrearItem"
        - $ref: "#/components/schemas/SolicitudCrearEpica"
      discriminator:
        propertyName: tipo
        mapping:
          HEROE: "#/components/schemas/SolicitudCrearHeroe"
          HABILIDAD: "#/components/schemas/SolicitudCrearHabilidad"
          ARMA: "#/components/schemas/SolicitudCrearArma"
          ARMADURA: "#/components/schemas/SolicitudCrearArmadura"
          ITEM: "#/components/schemas/SolicitudCrearItem"
          EPICA: "#/components/schemas/SolicitudCrearEpica"

    CamposComunesDeCreacion:
      type: object
      required:
        - nombre
        - imagen
        - descripcion
        - tipo
        - tiraje
        - premium
      properties:
        nombre:
          type: string
          minLength: 1
          description: Nombre visible del producto.
        imagen:
          type: string
          minLength: 1
          description: >
            Referencia de la imagen del producto. Su mecanismo de almacenamiento
            será definido por la plataforma.
        descripcion:
          type: string
          minLength: 1
          description: Descripción visible del producto.
        tipo:
          $ref: "#/components/schemas/TipoProducto"
        tiraje:
          description: >
            -1 representa tiraje ilimitado; un entero mayor que cero
            representa el total exacto.
          anyOf:
            - type: integer
              const: -1
            - type: integer
              minimum: 1
        precioCreditos:
          type: integer
          minimum: 0
          description: Obligatorio cuando premium es false.
        precioMonedaReal:
          type: number
          minimum: 0
          description: Obligatorio cuando premium es true.
        premium:
          type: boolean
          description: >
            Un producto premium se ofrece únicamente en moneda real
            y no es subastable.
      allOf:
        - if:
             type: object
             properties:
              premium:
                const: true
             required: [premium]
          then:
            type: object
            properties:
              precioMonedaReal:
                type: number
                minimum: 0
              precioCreditos:
                type: integer
                minimum: 0
            required: [precioMonedaReal]
            not:
              type: object
              properties:
                precioCreditos:
                  type: integer
              required: [precioCreditos]
          else:
            type: object
            properties:
              precioCreditos:
                type: integer
                minimum: 0
            required: [precioCreditos]

    SolicitudCrearHeroe:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/CamposComunesDeCreacion"
        - type: object
          required: [prototipo]
          properties:
            tipo:
              const: HEROE
            prototipo:
              type: string
              description: >
                Prototipo existente en el servicio de héroes. Sus estadísticas
                no se duplican ni se ingresan manualmente en productos.
              enum:
                - Guerrero Tanque
                - Guerrero Armas
                - Mago Fuego
                - Mago Hielo
                - Pícaro Veneno
                - Pícaro Machete
                - Chamán
                - Médico

    SolicitudCrearHabilidad:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/CamposComunesDeCreacion"
        - type: object
          required: [heroe, costoPoder, multiplicadorNivel, turnosCarga]
          properties:
            tipo:
              const: HABILIDAD
            heroe:
              type: string
              format: uuid
              description: Identificador del producto de tipo HÉROE asociado.
            costoPoder:
              type: integer
              minimum: 1
            multiplicadorNivel:
              type: number
              exclusiveMinimum: 0
            turnosCarga:
              type: integer
              minimum: 0

    SolicitudCrearArma:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/CamposComunesDeCreacion"
        - type: object
          required: [poderDeAtaque, tasaDeCaida]
          properties:
            tipo:
              const: ARMA
            poderDeAtaque:
              type: integer
              minimum: 1
            tasaDeCaida:
              type: number
              minimum: 0
              maximum: 100

    SolicitudCrearArmadura:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/CamposComunesDeCreacion"
        - type: object
          required: [defensa, parte, tasaDeCaida]
          properties:
            tipo:
              const: ARMADURA
            defensa:
              type: integer
              minimum: 1
            parte:
              type: string
              enum:
                - CASCO
                - PECHO
                - GUANTES
                - BRAZALETES
                - PANTALON
                - ZAPATOS
            tasaDeCaida:
              type: number
              minimum: 0
              maximum: 100

    SolicitudCrearItem:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/CamposComunesDeCreacion"
        - type: object
          required: [efecto, tasaDeCaida]
          properties:
            tipo:
              const: ITEM
            efecto:
              type: string
              minLength: 1
            tasaDeCaida:
              type: number
              minimum: 0
              maximum: 100

    SolicitudCrearEpica:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/CamposComunesDeCreacion"
        - type: object
          required:
            - heroe
            - turnosRecarga
            - efectoGeneral
            - efectoPotenciado
          properties:
            tipo:
              const: EPICA
            heroe:
              type: string
              format: uuid
              description: Identificador del producto de tipo HÉROE asociado.
            turnosRecarga:
              type: integer
              minimum: 0
            efectoGeneral:
              type: string
              minLength: 1
            efectoPotenciado:
              type: string
              minLength: 1

    SolicitudModificarProducto:
      type: object
      description: >
        Campos opcionales para modificar un producto existente. El servidor
        fusiona los campos presentes sobre el producto actual y valida el
        resultado fusionado completo contra las mismas reglas por tipo que
        SolicitudCrearProducto. tipo no está aquí porque no es modificable.
      minProperties: 1
      additionalProperties: false
      properties:
        nombre:
          type: string
          minLength: 1
        imagen:
          type: string
          minLength: 1
        descripcion:
          type: string
          minLength: 1
        tiraje:
          anyOf:
            - type: integer
              const: -1
            - type: integer
              minimum: 1
        precioCreditos:
          type: integer
          minimum: 0
        precioMonedaReal:
          type: number
          minimum: 0
        premium:
          type: boolean
        prototipo:
          type: string
          enum:
            - Guerrero Tanque
            - Guerrero Armas
            - Mago Fuego
            - Mago Hielo
            - Pícaro Veneno
            - Pícaro Machete
            - Chamán
            - Médico
        heroe:
          type: string
          format: uuid
        costoPoder:
          type: integer
          minimum: 1
        multiplicadorNivel:
          type: number
          exclusiveMinimum: 0
        turnosCarga:
          type: integer
          minimum: 0
        turnosRecarga:
          type: integer
          minimum: 0
        efectoGeneral:
          type: string
          minLength: 1
        efectoPotenciado:
          type: string
          minLength: 1
        defensa:
          type: integer
          minimum: 1
        parte:
          type: string
          enum:
            - CASCO
            - PECHO
            - GUANTES
            - BRAZALETES
            - PANTALON
            - ZAPATOS
        efecto:
          type: string
          minLength: 1
        poderDeAtaque:
          type: integer
          minimum: 1
        tasaDeCaida:
          type: number
          minimum: 0
          maximum: 100

    TipoProducto:
      type: string
      enum:
        - HEROE
        - HABILIDAD
        - ARMA
        - ARMADURA
        - ITEM
        - EPICA

    EstadoProducto:
      type: string
      enum:
        - ACTIVO
        - UNICO
        - SUSPENDIDO

    ResumenCatalogo:
      type: object
      required:
        - total
        - porTipo
        - porEstado
      properties:
        total:
          type: integer
          format: int64
          minimum: 0
        porTipo:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: Cantidad de productos para cada tipo, incluidos los tipos con cero.
        porEstado:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: Cantidad de productos para cada estado, incluidos los estados con cero.

    ProductoCreado:
      allOf:
        - $ref: "#/components/schemas/SolicitudCrearProducto"
        - type: object
          required:
            - id
            - estado
            - version
            - creadoEn
            - modificadoEn
          properties:
            id:
              type: string
              format: uuid
              description: UUID v4 generado por el sistema.
            estado:
              $ref: "#/components/schemas/EstadoProducto"
            version:
              type: integer
              minimum: 1
              example: 1
            creadoEn:
              type: string
              format: date-time
            modificadoEn:
              type: string
              format: date-time

    DetalleDeProblema:
      type: object
      description: Formato estándar de detalles de problema (RFC 9457).
      required:
        - type
        - title
        - status
        - detail
        - instance
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
