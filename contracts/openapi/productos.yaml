openapi: 3.1.0
info:
  title: Servicio de productos
  version: 1.8.0
  description: >
    Creación de productos del catálogo de THE NEXUS BATTLES VI
    (HU-PRD-001), reserva de tiraje (HU-PRD-002), modificación con
    respaldo (HU-PRD-003) y suspensión lógica con reactivación
    (HU-PRD-004), además de alertas de cambios al iniciar sesión
    (HU-PRD-014). Contrato publicado antes de la
    implementación, conforme a la regla de plataforma "contrato primero".

    1.2.0 (R16): se añade GET /api/v1/productos, el listado público y
    paginado del catálogo. Existe porque la vitrina de ms-ecommerce leía
    una tabla propia que nace vacía y no refleja este catálogo maestro; la
    decisión de arquitectura es que la vitrina proyecte este catálogo, y
    este listado es lo que consume para hacerlo. Cambio aditivo, por eso
    sube la versión menor y no la mayor.

    1.2.1 (R16): solo documentación. El borde deja de repartir la ruta
    exacta por método (#421): todo /api/v1/productos llega a este servicio.

    1.3.0 (HU-PRD-003): se añade PATCH /api/v1/productos/{id}
    (modificarProducto), que modifica un producto existente con respaldo
    previo del estado anterior y reversión si falla el guardado. Solo
    ADMINISTRADOR y SUPER_ADMINISTRADOR. Cambio aditivo: versión menor.


    1.3.1 (B0): solo marcas. `adquisiciones`, `suspender` y `reactivar`
    estaban publicadas desde 1.0.0 sin una linea de codigo detras (la
    auditoria contractual y el guardian `rutas-contrato-codigo.py` lo
    encontraron). Se marcan `x-implementacion: pendiente` (fase B4) en vez
    de borrarlas: el contrato sigue siendo el acordado y deja de mentir sobre
    lo que hay detras.


    1.4.0 (B4, BACKEND-06): catalogo administrable de verdad. (1) Se
    implementan `suspenderProducto`, `reactivarProducto` y `adquirirProducto`
    y se quitan sus marcas `pendiente`. `adquirirProducto` pasa a ser solo de
    servicios (rol SERVICIO, 403 para cualquier usuario) y exige
    `Idempotency-Key`: la misma clave devuelve el mismo resultado sin volver a
    descontar, y con otro producto responde 409. Anadir una cabecera
    obligatoria a una operacion existente seria incompatible, pero esta nunca
    tuvo implementacion (respondia 404 desde 1.0.0 y estaba marcada pendiente
    desde 1.3.1): no hay ningun consumidor al que romper, por eso sube la
    menor y no la mayor. (2) Promociones: `promocion` opcional
    (`porcentaje` 1..90, `desde`, `hasta`) al crear y al modificar; la
    respuesta la trae con `vigente`, que calcula el servidor. (3) Bloqueo
    optimista: `version` la controla el servidor y un PATCH que choca con
    otra escritura responde 409. (4) Proyeccion publica de las dos lecturas:
    sin token no aparece ningun producto SUSPENDIDO (404 por id, pagina vacia
    si se pide ese estado) ni los campos internos (`version`, `tasaDeCaida`,
    `origen`, `semillaVersion`, `modificadoPor`); un jugador ve un
    SUSPENDIDO por su id (puede tenerlo en su inventario, 7.2.1) pero tampoco
    los internos; un servicio o un ADMINISTRADOR / SUPER_ADMINISTRADOR lo ven
    todo. Por eso `version` deja de ser obligatoria en `ProductoCreado`.
    (5) Marcas de la semilla versionada (`origen`, `semillaVersion`) y autor
    de la ultima edicion (`modificadoPor`, uid del token) en la vista
    completa. Todo lo demas es aditivo.

    1.5.0 (HU-PRD-014): se añade
    GET /api/v1/productos/alertas/inicio-sesion. La operación autenticada
    devuelve los cambios del catálogo posteriores al último cambio entregado
    al jugador y registra el nuevo punto de lectura. Cambio aditivo: versión
    menor.

    1.6.0 (HU-NOT-001, #532): se añade
    GET /api/v1/productos/alertas/cambios (consultarCambiosDelCatalogo), la
    lectura de los cambios del catálogo para otro servicio. Solo con token de
    servicio (rol SERVICIO): un usuario, aunque sea ADMINISTRADOR, recibe 403.
    Es de SOLO LECTURA: no mueve el cursor de inicio-sesion ni ningún otro;
    el punto de lectura lo guarda quien consulta, con el `hasta` de cada lote.
    Sin `desde` devuelve la línea base (ninguna alerta, `hasta` = ahora); con
    `desde`, los cambios implementados en (desde, ahora], del más antiguo al
    más reciente, hasta `limite` (1..200, 50 por omisión) sin partir nunca un
    grupo de cambios con la misma marca de tiempo. La consume notificaciones
    para llevar los avisos del catálogo a la bandeja del jugador. Cambio
    aditivo: versión menor.

    1.7.0 (HU-PRD-013): incorpora la creacion, programacion, edicion y
    retiro logico de banners, ademas de la consulta publica de los que se
    encuentran vigentes. Cambio aditivo: version menor. El esquema `Banner`
    se declara completo y no como `allOf` sobre `SolicitudBanner`: esta
    cierra sus propiedades (`additionalProperties: false`) y ninguna
    respuesta con `id` habria cumplido la composicion. La home del jugador
    rota los vigentes con su fecha de publicacion y su vigencia (RF-NOT-002).

    1.7.1 (RG-085, RF-MOT-36): solo documentacion. La unica fuente de
    epicas es derrotar al Master que la tiene, asi que una EPICA no se
    vende: crearla o modificarla con `precioCreditos` mayor que 0,
    `precioMonedaReal` mayor que 0 o `premium` verdadero responde 400. Los
    esquemas no cambian (el 400 por validacion ya existia en `crearProducto`
    y `modificarProducto`); se documenta el motivo nuevo. Dejar en cero el
    precio de una epica que ya lo tenia sigue siendo valido.

    1.8.0 (#798): el detalle y el listado publico incorporan `rareza` y
    `habilidades`. Ambos campos se calculan a partir de la clasificacion y los
    efectos ya existentes en el catalogo para que tienda y subastas puedan
    mostrarlos, buscarlos y filtrarlos sin duplicar reglas.
servers:
  - url: /
    description: Servicio publicado en el mismo origen configurado por la plataforma.

paths:
  /api/v1/banners/vigentes:
    get:
      summary: Lista los banners vigentes
      operationId: consultarBannersVigentes
      description: >
        Operacion publica. Solo devuelve banners no retirados cuya fecha de
        publicacion ya comenzo y cuya vigencia aun no termino.
      responses:
        "200":
          description: Banners visibles en el momento de la consulta
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Banner"

  /api/v1/banners:
    get:
      summary: Lista todos los banners para administracion
      operationId: consultarTodosLosBanners
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Banners programados, vigentes, finalizados y retirados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Banner"
        "401":
          description: Token Bearer ausente, invalido o expirado
        "403":
          description: Se requiere rol de administracion
    post:
      summary: Crea y programa un banner
      operationId: crearBanner
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudBanner"
      responses:
        "201":
          description: Banner creado
          headers:
            Location:
              description: Ubicacion del banner creado
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Banner"
        "400":
          description: Contenido o periodo de vigencia invalido
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DetalleDeProblema"
        "401":
          description: Token Bearer ausente, invalido o expirado
        "403":
          description: Se requiere rol de administracion

  /api/v1/banners/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      summary: Edita y reprograma un banner
      operationId: editarBanner
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudBanner"
      responses:
        "200":
          description: Banner actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Banner"
        "400":
          description: Contenido o periodo de vigencia invalido
        "401":
          description: Token Bearer ausente, invalido o expirado
        "403":
          description: Se requiere rol de administracion
        "404":
          description: Banner inexistente
    delete:
      summary: Retira un banner sin eliminar su registro
      operationId: retirarBanner
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Banner retirado
        "401":
          description: Token Bearer ausente, invalido o expirado
        "403":
          description: Se requiere rol de administracion
        "404":
          description: Banner inexistente

  /api/v1/productos/alertas/inicio-sesion:
    get:
      summary: Consulta cambios del catálogo al iniciar sesión
      operationId: consultarAlertasCatalogoAlIniciarSesion
      description: >
        Devuelve, en orden cronológico, los cambios del catálogo posteriores
        al último cambio entregado al jugador autenticado. Al completar la
        respuesta, el servidor avanza ese cursor para no repetir las alertas
        sin perder un cambio que se registre al mismo tiempo que la consulta.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Alertas pendientes del jugador, o una lista vacía si no hay cambios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AlertaCambioCatalogo"
        "401":
          description: Token Bearer ausente, inválido o expirado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DetalleDeProblema"

  /api/v1/productos/alertas/cambios:
    get:
      summary: Lee los cambios del catálogo para otro servicio (1.6.0)
      operationId: consultarCambiosDelCatalogo
      description: >
        Lectura de los cambios registrados en el catálogo, para un servicio
        que los entrega por su cuenta (notificaciones los lleva a la bandeja
        del jugador, HU-NOT-001). Solo servicios: token de servicio (rol
        SERVICIO, ADR-005); un token de usuario, aunque sea de un
        ADMINISTRADOR, responde 403.

        Es de SOLO LECTURA: no toca el cursor por jugador de
        GET /api/v1/productos/alertas/inicio-sesion ni guarda nada. El punto
        de lectura lo lleva quien consulta: guarda el `hasta` de la respuesta
        y lo envía como `desde` en la siguiente consulta.

        Sin `desde` es la línea base: ninguna alerta, `hasta` = la hora del
        servicio al responder y `completo` = true. No vuelca el historial
        (la misma regla que el primer ingreso de inicio-sesion).

        Con `desde`: los cambios con `implementadaEn` en (desde, ahora], del
        más antiguo al más reciente. `hasta` es el `implementadaEn` del último
        cambio entregado, o el propio `desde` si no hubo ninguno: así un
        cambio que se registra a la vez que la consulta no se pierde, llega
        en la siguiente.

        Si hay más de `limite` cambios, el lote se corta en `limite` pero
        nunca parte un grupo de cambios con la misma marca de tiempo: incluye
        todos los de la última (por eso puede traer más de `limite`).
        `completo` es false cuando quedaron cambios posteriores a `hasta` sin
        entregar; se piden con desde=hasta.
      security:
        - BearerAuth: []
      parameters:
        - name: desde
          in: query
          required: false
          description: >
            Punto de lectura exclusivo: el `hasta` de la respuesta anterior.
            Sin él, la respuesta es la línea base.
          schema:
            type: string
            format: date-time
        - name: limite
          in: query
          required: false
          description: Cuántos cambios como máximo por lote (sin partir un grupo con la misma marca de tiempo).
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Lote de cambios del catálogo, o la línea base si no se envió `desde`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoteDeAlertasCatalogo"
        "400":
          description: "`desde` no es una fecha y hora válida o `limite` no está entre 1 y 200"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DetalleDeProblema"
        "401":
          description: Token Bearer ausente, inválido o expirado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DetalleDeProblema"
        "403":
          description: El token no es de un servicio (un usuario, aunque sea administrador)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DetalleDeProblema"

  /api/v1/productos/estadisticas:
    get:
      summary: Consulta el estado del catálogo
      operationId: consultarEstadoCatalogo
      description: Devuelve el total y la distribución de productos por tipo y estado.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Resumen actual del catálogo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumenCatalogo"
        "401":
          description: Token Bearer ausente, inválido o expirado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DetalleDeProblema"
  /api/v1/productos:
    get:
      summary: Lista el catálogo de productos por páginas
      operationId: listarProductosDelCatalogo
      description: >
        Endpoint público, sin autenticación, igual que la consulta por
        identificador: cada elemento es el mismo detalle que devuelve
        GET /api/v1/productos/{id}. Lo consume ms-ecommerce para que su
        vitrina proyecte este catálogo maestro (R16).

        Por omisión solo se listan los productos que se pueden mostrar y
        comprar, en estado ACTIVO o UNICO; un producto SUSPENDIDO nunca
        aparece por omisión y solo se obtiene pidiéndolo de forma explícita
        con estado=SUSPENDIDO. El orden es estable entre páginas: fecha de
        creación ascendente y, a igualdad, identificador ascendente, de modo
        que un producto nuevo se añade al final y no desplaza las páginas
        ya leídas.

        Enrutamiento: el borde manda todo /api/v1/productos, con cualquier
        método, a este servicio. Hasta R16 el GET exacto se desviaba a la
        vitrina de ms-ecommerce (issue #421), que ahora vive en
        /api/v1/vitrina.

        Proyeccion (1.4.0): sin token, o con token de jugador o moderador,
        cada elemento omite los campos internos (`version`, `tasaDeCaida`,
        `origen`, `semillaVersion`, `modificadoPor`) y la promocion solo sale
        mientras esta vigente; pedir estado=SUSPENDIDO devuelve una pagina
        vacia. Con token de servicio o de ADMINISTRADOR / SUPER_ADMINISTRADOR
        se ve todo, incluidos los suspendidos si se piden.
      security:
        - {}
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: Número de página, empezando en 0.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Cantidad de productos por página, entre 1 y 50.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: tipo
          in: query
          required: false
          description: Si se envía, solo se listan productos de ese tipo.
          schema:
            $ref: "#/components/schemas/TipoProducto"
        - name: estado
          in: query
          required: false
          description: >
            Si se envía, solo se listan productos en ese estado, incluido
            SUSPENDIDO. Si se omite, se listan los estados ACTIVO y UNICO.
          schema:
            $ref: "#/components/schemas/EstadoProducto"
      responses:
        "200":
          description: Página del catálogo con sus metadatos de paginación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaDeProductos"
        "400":
          description: >
            Parámetros inválidos: page negativo, size fuera de 1..50, o un
            tipo o estado que no pertenece a su enumeración.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DetalleDeProblema"
    post:
      summary: Crea un producto en el catálogo
      operationId: crearProducto
      description: >
        Operación permitida únicamente a los roles ADMINISTRADOR y
        SUPER_ADMINISTRADOR. El identificador, el estado inicial ACTIVO,
        la versión y las fechas son generados por el sistema.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudCrearProducto"
      responses:
        "201":
          description: Producto creado y registrado en el catálogo
          headers:
            Location:
              description: Ubicación del producto creado
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductoCreado"
        "400":
          description: >
            Solicitud inválida por campos obligatorios ausentes, precios
            negativos, tiraje inválido, tipo no permitido o atributos que
            no corresponden al tipo seleccionado. Una EPICA tampoco admite
            precio en créditos ni en moneda real mayor que 0, ni `premium`
            (RG-085: las épicas solo se obtienen derrotando al Máster).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DetalleDeProblema"

        "401":
          description: Token Bearer ausente, inválido o expirado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DetalleDeProblema"
        "403":
          description: El usuario no tiene permiso para crear productos
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DetalleDeProblema"
        "500":
          description: Error interno al registrar el producto
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DetalleDeProblema"

  /api/v1/productos/{id}:
    get:
      summary: Consulta un producto del catálogo por su identificador
      operationId: consultarProducto
      description: >
        Endpoint público, sin autenticación: a diferencia de la creación
        (POST, restringida a ADMINISTRADOR/SUPER_ADMINISTRADOR), este GET
        lo consumen otros servicios del propio dominio de juego —por
        ejemplo inventario, para resolver el nombre y tipo de un producto
        equipado (HU-INV-006)— sin que quien llama sea necesariamente un
        administrador ni un usuario autenticado.

        Proyeccion (1.4.0): sin token, un producto SUSPENDIDO no existe (404,
        igual que uno inexistente) y la respuesta omite los campos internos
        (`version`, `tasaDeCaida`, `origen`, `semillaVersion`,
        `modificadoPor`). Un jugador o moderador autenticado si ve el
        SUSPENDIDO —puede tenerlo en su inventario, que lo conserva (7.2.1)—
        pero tampoco los internos. Un servicio o un ADMINISTRADOR /
        SUPER_ADMINISTRADOR lo ven todo. La promocion sale siempre en la vista
        completa, con `vigente`; en las demas, solo mientras esta vigente.
      security:
        - {}
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador del producto (UUID v4).
      responses:
        "200":
          description: Producto encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductoCreado"
        "404":
          description: >
            No existe ningún producto con ese identificador, o está
            SUSPENDIDO y la petición no trae token (1.4.0).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DetalleDeProblema"
    patch:
      summary: Modifica uno o varios campos de un producto existente
      operationId: modificarProducto
      description: >
        HU-PRD-003. Operación permitida únicamente a los roles ADMINISTRADOR
        y SUPER_ADMINISTRADOR. El cliente envía solo los campos que quiere
        cambiar; el servidor los fusiona en memoria sobre el producto
        existente y valida el resultado completo con las mismas reglas de
        SolicitudCrearProducto para el tipo ya establecido — tipo no es
        modificable. Antes de aplicar el cambio se guarda el estado anterior
        completo del producto como respaldo histórico, con el autor (el
        `uid` del token, 1.4.0), que queda tambien en `modificadoPor`.

        Bloqueo optimista (1.4.0): el cambio solo se guarda si nadie escribio
        el producto desde que se leyo —otra edicion, una suspension, una
        reserva de tiraje—; si no, 409 y no se aplica nada.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador del producto (UUID v4).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudModificarProducto"
      responses:
        "200":
          description: Producto modificado, con el resultado completo ya fusionado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductoCreado"
        "400":
          description: >
            Solicitud vacía (ningún campo presente), o la combinación
            resultante de campos no corresponde al tipo del producto. A una
            EPICA no se le puede poner precio en créditos ni en moneda real
            mayor que 0, ni `premium` (RG-085); mientras conserve uno de
            ellos, hay que dejarlo en 0 en la misma solicitud.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DetalleDeProblema"
        "401":
          description: Token Bearer ausente, inválido o expirado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DetalleDeProblema"
        "403":
          description: El usuario no tiene permiso para modificar productos
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DetalleDeProblema"
        "404":
          description: No existe ningún producto con ese identificador
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DetalleDeProblema"
        "409":
          description: >
            (1.4.0) El producto cambió entre la lectura y el guardado
            (type urn:nexus:problema:conflicto-de-version). No se aplicó
            nada; se vuelve a leer y a aplicar el cambio.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DetalleDeProblema"
        "500":
          description: Error interno al registrar el cambio
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DetalleDeProblema"

  /api/v1/productos/{id}/adquisiciones:
    post:
      summary: Reserva una unidad disponible del producto
      operationId: adquirirProducto
      description: >
        Descuenta de forma atómica una unidad del tiraje limitado. Los
        productos ilimitados conservan el valor -1. Esta operación solo
        reserva disponibilidad: no registra el producto en un inventario
        ni ejecuta cobros (la entrega es POST /api/v1/inventario/entregas).

        Solo servicios (1.4.0): token de servicio (rol SERVICIO, ADR-005),
        el de quien vende. Ningún usuario reserva tiraje a mano: 403.

        Idempotente por `Idempotency-Key` (1.4.0): la clave se guarda con su
        resultado. La misma clave devuelve la misma respuesta —también un
        AGOTADO o un SUSPENDIDO— sin volver a descontar, aunque el primer
        intento no llegara a responder; la misma clave con otro producto,
        409. Un producto inexistente (404) no consume la clave.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductoId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Unidad reservada correctamente (o la reserva ya hecha con esa clave)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultadoAdquisicion"
        "400":
          description: Falta la cabecera Idempotency-Key o no tiene entre 1 y 100 caracteres
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DetalleDeProblema"
        "401":
          description: Token Bearer ausente, inválido o expirado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DetalleDeProblema"
        "403":
          description: El token no es de un servicio (1.4.0)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DetalleDeProblema"
        "404":
          description: No existe ningún producto con ese identificador
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DetalleDeProblema"
        "409":
          description: >
            El producto está agotado o suspendido (cuerpo
            ResultadoAdquisicion, application/json), o la clave de
            idempotencia ya se usó con otro producto (problem detail
            urn:nexus:problema:clave-de-idempotencia-reutilizada).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultadoAdquisicion"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DetalleDeProblema"

  /api/v1/productos/{id}/suspender:
    put:
      summary: Suspende lógicamente un producto
      operationId: suspenderProducto
      description: >
        Impide nuevas adquisiciones sin eliminar el producto ni modificar
        su tiraje. Operación exclusiva para ADMINISTRADOR y
        SUPER_ADMINISTRADOR. El producto sigue en los inventarios que ya lo
        tienen y desaparece de la proyección pública. Idempotente: suspender
        un producto ya suspendido responde 200 sin escribir nada.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductoId"
      responses:
        "200":
          description: Producto suspendido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstadoDisponibilidadProducto"
        "401":
          description: Token Bearer ausente, inválido o expirado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DetalleDeProblema"
        "403":
          description: El usuario no tiene permiso para suspender productos
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DetalleDeProblema"
        "404":
          description: No existe ningún producto con ese identificador
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DetalleDeProblema"

  /api/v1/productos/{id}/reactivar:
    put:
      summary: Reactiva un producto suspendido
      operationId: reactivarProducto
      description: >
        Restaura el estado ACTIVO o UNICO que el producto tenía antes de
        suspenderse y conserva el tiraje. Operación exclusiva para
        ADMINISTRADOR y SUPER_ADMINISTRADOR. Idempotente: reactivar un
        producto que no está suspendido responde 200 sin escribir nada.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductoId"
      responses:
        "200":
          description: Producto reactivado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstadoDisponibilidadProducto"
        "401":
          description: Token Bearer ausente, inválido o expirado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DetalleDeProblema"
        "403":
          description: El usuario no tiene permiso para reactivar productos
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DetalleDeProblema"
        "404":
          description: No existe ningún producto con ese identificador
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DetalleDeProblema"

components:
  parameters:
    ProductoId:
      name: id
      in: path
      required: true
      description: Identificador del producto (UUID v4).
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Clave de idempotencia de quien reserva (1.4.0), por ejemplo la linea
        de una orden. Se guarda con el resultado: repetirla devuelve ese
        mismo resultado.
      schema:
        type: string
        minLength: 1
        maxLength: 100
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Token de ms-identidad (RS256, JWKS en /api/v1/auth/jwks; ADR-002 y
        ADR-005). Crear, modificar, suspender y reactivar requieren el rol
        ADMINISTRADOR o SUPER_ADMINISTRADOR; reservar tiraje y leer los
        cambios del catálogo (1.6.0), un token de servicio (rol SERVICIO). En
        las lecturas del catálogo es opcional y decide la proyeccion.
  schemas:
    SolicitudBanner:
      type: object
      additionalProperties: false
      required: [contenido, publicarDesde, vigenteHasta]
      properties:
        contenido:
          type: string
          minLength: 1
          maxLength: 500
        publicarDesde:
          type: string
          format: date-time
        vigenteHasta:
          type: string
          format: date-time
          description: Debe ser posterior a publicarDesde y estar en el futuro.

    Banner:
      # Completo y no `allOf` sobre SolicitudBanner: aquella cierra sus
      # propiedades (`additionalProperties: false`) y ninguna respuesta con
      # `id` habria cumplido la composicion (ContratoDeBannersTest).
      type: object
      required:
        [id, contenido, publicarDesde, vigenteHasta, retirado, creadoEn, modificadoEn]
      properties:
        id:
          type: string
        contenido:
          type: string
          minLength: 1
          maxLength: 500
        publicarDesde:
          type: string
          format: date-time
          description: Desde cuando se muestra (RF-NOT-002 la ensena en cada mensaje).
        vigenteHasta:
          type: string
          format: date-time
          description: >
            Hasta cuando se muestra; la home lo retira sola al llegar esta
            hora aunque la pagina siga abierta (RF-NOT-002).
        retirado:
          type: boolean
        creadoEn:
          type: string
          format: date-time
        modificadoEn:
          type: string
          format: date-time

    SolicitudCrearProducto:
      oneOf:
        - $ref: "#/components/schemas/SolicitudCrearHeroe"
        - $ref: "#/components/schemas/SolicitudCrearHabilidad"
        - $ref: "#/components/schemas/SolicitudCrearArma"
        - $ref: "#/components/schemas/SolicitudCrearArmadura"
        - $ref: "#/components/schemas/SolicitudCrearItem"
        - $ref: "#/components/schemas/SolicitudCrearEpica"
      discriminator:
        propertyName: tipo
        mapping:
          HEROE: "#/components/schemas/SolicitudCrearHeroe"
          HABILIDAD: "#/components/schemas/SolicitudCrearHabilidad"
          ARMA: "#/components/schemas/SolicitudCrearArma"
          ARMADURA: "#/components/schemas/SolicitudCrearArmadura"
          ITEM: "#/components/schemas/SolicitudCrearItem"
          EPICA: "#/components/schemas/SolicitudCrearEpica"

    CamposComunesDeCreacion:
      type: object
      required:
        - nombre
        - imagen
        - descripcion
        - tipo
        - tiraje
        - premium
      properties:
        nombre:
          type: string
          minLength: 1
          description: Nombre visible del producto.
        imagen:
          type: string
          minLength: 1
          description: >
            Referencia de la imagen del producto. Su mecanismo de almacenamiento
            será definido por la plataforma.
        descripcion:
          type: string
          minLength: 1
          description: Descripción visible del producto.
        tipo:
          $ref: "#/components/schemas/TipoProducto"
        tiraje:
          description: >
            -1 representa tiraje ilimitado; un entero mayor que cero
            representa el total exacto.
          anyOf:
            - type: integer
              const: -1
            - type: integer
              minimum: 1
        precioCreditos:
          type: integer
          minimum: 0
          description: Obligatorio cuando premium es false.
        precioMonedaReal:
          type: number
          minimum: 0
          description: Obligatorio cuando premium es true.
        premium:
          type: boolean
          description: >
            Un producto premium se ofrece únicamente en moneda real
            y no es subastable.
        promocion:
          $ref: "#/components/schemas/Promocion"
      allOf:
        - if:
             type: object
             properties:
              premium:
                const: true
             required: [premium]
          then:
            type: object
            properties:
              precioMonedaReal:
                type: number
                minimum: 0
              precioCreditos:
                type: integer
                minimum: 0
            required: [precioMonedaReal]
            not:
              type: object
              properties:
                precioCreditos:
                  type: integer
              required: [precioCreditos]
          else:
            type: object
            properties:
              precioCreditos:
                type: integer
                minimum: 0
            required: [precioCreditos]

    SolicitudCrearHeroe:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/CamposComunesDeCreacion"
        - type: object
          required: [prototipo]
          properties:
            tipo:
              const: HEROE
            prototipo:
              type: string
              description: >
                Prototipo existente en el servicio de héroes. Sus estadísticas
                no se duplican ni se ingresan manualmente en productos.
              enum:
                - Guerrero Tanque
                - Guerrero Armas
                - Mago Fuego
                - Mago Hielo
                - Pícaro Veneno
                - Pícaro Machete
                - Chamán
                - Médico

    SolicitudCrearHabilidad:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/CamposComunesDeCreacion"
        - type: object
          required: [heroe, costoPoder, multiplicadorNivel, turnosCarga]
          properties:
            tipo:
              const: HABILIDAD
            heroe:
              type: string
              format: uuid
              description: Identificador del producto de tipo HÉROE asociado.
            costoPoder:
              type: integer
              minimum: 1
            multiplicadorNivel:
              type: number
              exclusiveMinimum: 0
            turnosCarga:
              type: integer
              minimum: 0

    SolicitudCrearArma:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/CamposComunesDeCreacion"
        - type: object
          required: [poderDeAtaque, tasaDeCaida]
          properties:
            tipo:
              const: ARMA
            poderDeAtaque:
              type: integer
              minimum: 1
            tasaDeCaida:
              type: number
              minimum: 0
              maximum: 100

    SolicitudCrearArmadura:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/CamposComunesDeCreacion"
        - type: object
          required: [defensa, parte, tasaDeCaida]
          properties:
            tipo:
              const: ARMADURA
            defensa:
              type: integer
              minimum: 1
            parte:
              type: string
              enum:
                - CASCO
                - PECHO
                - GUANTES
                - BRAZALETES
                - PANTALON
                - ZAPATOS
            tasaDeCaida:
              type: number
              minimum: 0
              maximum: 100

    SolicitudCrearItem:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/CamposComunesDeCreacion"
        - type: object
          required: [efecto, tasaDeCaida]
          properties:
            tipo:
              const: ITEM
            efecto:
              type: string
              minLength: 1
            tasaDeCaida:
              type: number
              minimum: 0
              maximum: 100

    SolicitudCrearEpica:
      description: >
        Una épica no se vende (RG-085, RF-MOT-36): solo se obtiene derrotando
        al Máster que la tiene. `precioCreditos` y `precioMonedaReal` solo
        admiten 0 (o `precioMonedaReal` ausente) y `premium` solo `false`;
        cualquier otro valor responde 400.
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/CamposComunesDeCreacion"
        - type: object
          required:
            - heroe
            - turnosRecarga
            - efectoGeneral
            - efectoPotenciado
          properties:
            tipo:
              const: EPICA
            heroe:
              type: string
              format: uuid
              description: Identificador del producto de tipo HÉROE asociado.
            turnosRecarga:
              type: integer
              minimum: 0
            efectoGeneral:
              type: string
              minLength: 1
            efectoPotenciado:
              type: string
              minLength: 1

    SolicitudModificarProducto:
      type: object
      description: >
        Campos opcionales para modificar un producto existente. El servidor
        fusiona los campos presentes sobre el producto actual y valida el
        resultado fusionado completo contra las mismas reglas por tipo que
        SolicitudCrearProducto. tipo no está aquí porque no es modificable.
      minProperties: 1
      additionalProperties: false
      properties:
        nombre:
          type: string
          minLength: 1
        imagen:
          type: string
          minLength: 1
        descripcion:
          type: string
          minLength: 1
        tiraje:
          anyOf:
            - type: integer
              const: -1
            - type: integer
              minimum: 1
        precioCreditos:
          type: integer
          minimum: 0
        precioMonedaReal:
          type: number
          minimum: 0
        premium:
          type: boolean
        prototipo:
          type: string
          enum:
            - Guerrero Tanque
            - Guerrero Armas
            - Mago Fuego
            - Mago Hielo
            - Pícaro Veneno
            - Pícaro Machete
            - Chamán
            - Médico
        heroe:
          type: string
          format: uuid
        costoPoder:
          type: integer
          minimum: 1
        multiplicadorNivel:
          type: number
          exclusiveMinimum: 0
        turnosCarga:
          type: integer
          minimum: 0
        turnosRecarga:
          type: integer
          minimum: 0
        efectoGeneral:
          type: string
          minLength: 1
        efectoPotenciado:
          type: string
          minLength: 1
        defensa:
          type: integer
          minimum: 1
        parte:
          type: string
          enum:
            - CASCO
            - PECHO
            - GUANTES
            - BRAZALETES
            - PANTALON
            - ZAPATOS
        efecto:
          type: string
          minLength: 1
        poderDeAtaque:
          type: integer
          minimum: 1
        tasaDeCaida:
          type: number
          minimum: 0
          maximum: 100
        promocion:
          description: >
            (1.4.0) Reemplaza la promocion entera. Para terminarla antes de
            tiempo se envia con otro `hasta`.
          allOf:
            - $ref: "#/components/schemas/Promocion"

    Promocion:
      type: object
      description: >
        (1.4.0) Descuento porcentual con vigencia. El documento pide el
        marcador del porcentaje (7.5) y fecha de publicacion y vigencia
        (7.2.4); el rango 1..90 es un limite provisional de la plataforma
        mientras el PO no fije otro.
      additionalProperties: false
      required: [porcentaje, desde, hasta]
      properties:
        porcentaje:
          type: integer
          minimum: 1
          maximum: 90
        desde:
          type: string
          format: date-time
          description: Primer instante en que aplica (incluido).
        hasta:
          type: string
          format: date-time
          description: Instante en que deja de aplicar (excluido); posterior a desde.

    PromocionVigente:
      type: object
      description: >
        (1.4.0) La promocion en una respuesta. `vigente` lo calcula el
        servidor con su reloj al responder; la proyeccion publica solo la
        incluye cuando es verdadero.
      required: [porcentaje, desde, hasta, vigente]
      properties:
        porcentaje:
          type: integer
          minimum: 1
          maximum: 90
        desde:
          type: string
          format: date-time
        hasta:
          type: string
          format: date-time
        vigente:
          type: boolean

    TipoProducto:
      type: string
      enum:
        - HEROE
        - HABILIDAD
        - ARMA
        - ARMADURA
        - ITEM
        - EPICA

    EstadoProducto:
      type: string
      enum:
        - ACTIVO
        - UNICO
        - SUSPENDIDO

    EstadoAdquisicion:
      type: string
      enum:
        - ACEPTADA
        - AGOTADO
        - SUSPENDIDO

    ResultadoAdquisicion:
      type: object
      additionalProperties: false
      required:
        - estado
        - mensaje
      properties:
        estado:
          $ref: "#/components/schemas/EstadoAdquisicion"
        mensaje:
          type: string
          minLength: 1

    EstadoDisponibilidadProducto:
      type: object
      additionalProperties: false
      required:
        - productoId
        - estado
        - tiraje
      properties:
        productoId:
          type: string
          format: uuid
        estado:
          $ref: "#/components/schemas/EstadoProducto"
        tiraje:
          description: >
            -1 representa tiraje ilimitado; cero representa un producto
            agotado; un entero positivo representa las unidades restantes.
          anyOf:
            - type: integer
              const: -1
            - type: integer
              minimum: 0

    ResumenCatalogo:
      type: object
      required:
        - total
        - porTipo
        - porEstado
      properties:
        total:
          type: integer
          format: int64
          minimum: 0
        porTipo:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: Cantidad de productos para cada tipo, incluidos los tipos con cero.
        porEstado:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: Cantidad de productos para cada estado, incluidos los estados con cero.

    ProductoCreado:
      description: >
        Un producto del catalogo. Desde 1.4.0 hay dos proyecciones: la
        completa (servicio, ADMINISTRADOR, SUPER_ADMINISTRADOR) y la publica
        (sin token, jugador, moderador), que omite `version`, `tasaDeCaida`,
        `origen`, `semillaVersion` y `modificadoPor`, y solo trae la promocion
        mientras esta vigente.
      allOf:
        - $ref: "#/components/schemas/SolicitudCrearProducto"
        - type: object
          required:
            - id
            - estado
            - creadoEn
            - modificadoEn
            - rareza
            - habilidades
          properties:
            id:
              type: string
              format: uuid
              description: UUID v4 generado por el sistema.
            estado:
              $ref: "#/components/schemas/EstadoProducto"
            version:
              type: integer
              minimum: 1
              example: 1
              description: >
                Version del documento para el bloqueo optimista (1.4.0): la
                sube cada escritura. Solo en la proyeccion completa.
            creadoEn:
              type: string
              format: date-time
            modificadoEn:
              type: string
              format: date-time
            promocion:
              $ref: "#/components/schemas/PromocionVigente"
            origen:
              type: string
              enum: [SEMILLA, ADMINISTRACION]
              description: >
                (1.4.0) De donde salio: la semilla del catalogo o un alta de
                administracion. Solo en la proyeccion completa; ausente en
                los productos anteriores a 1.4.0 que la semilla aun no adopto.
            semillaVersion:
              type: integer
              minimum: 1
              description: (1.4.0) Version de la semilla que lo escribio. Solo en la proyeccion completa.
            modificadoPor:
              type: string
              description: >
                (1.4.0) Identificador estable (uid) del ultimo administrador
                que edito el contenido. Solo en la proyeccion completa.
            rareza:
              type: string
              enum: [COMUN, EPICA]
              description: >
                (1.8.0, #798) Clasificacion publica del producto. Las
                habilidades epicas se publican como EPICA y los demas tipos
                del catalogo actual como COMUN.
            habilidades:
              type: array
              description: >
                (1.8.0, #798) Efectos o capacidades visibles y buscables del
                producto. Vacio cuando el catalogo no define ninguna.
              items:
                type: string
                minLength: 1

    PaginaDeProductos:
      type: object
      description: >
        Una página del listado del catálogo (GET /api/v1/productos). Cada
        elemento de content tiene la misma forma que la respuesta de
        GET /api/v1/productos/{id}.
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
      properties:
        content:
          type: array
          description: Productos de la página, en el orden estable del listado.
          items:
            $ref: "#/components/schemas/ProductoCreado"
        page:
          type: integer
          minimum: 0
          description: Número de la página devuelta, empezando en 0.
        size:
          type: integer
          minimum: 1
          maximum: 50
          description: Tamaño de página aplicado.
        totalElements:
          type: integer
          format: int64
          minimum: 0
          description: Total de productos que cumplen el filtro, sumando todas las páginas.
        totalPages:
          type: integer
          minimum: 0
          description: Total de páginas para ese tamaño; vale 0 si no hay productos.

    AlertaCambioCatalogo:
      type: object
      additionalProperties: false
      required:
        - id
        - productoId
        - productoNombre
        - tipo
        - descripcion
        - implementadaEn
      properties:
        id:
          type: string
          format: uuid
        productoId:
          type: string
          format: uuid
        productoNombre:
          type: string
          minLength: 1
        tipo:
          type: string
          enum:
            - NUEVO_PRODUCTO
            - PRODUCTO_MODIFICADO
            - PRODUCTO_SUSPENDIDO
            - PRODUCTO_REACTIVADO
            - CAMBIO_BALANCE
        descripcion:
          type: string
          minLength: 1
        implementadaEn:
          type: string
          format: date-time

    LoteDeAlertasCatalogo:
      type: object
      additionalProperties: false
      description: Respuesta de GET /api/v1/productos/alertas/cambios (1.6.0).
      required:
        - hasta
        - completo
        - alertas
      properties:
        hasta:
          type: string
          format: date-time
          description: >
            Hasta dónde llega este lote. Quien consulta lo guarda y lo envía
            como `desde` la vez siguiente. En la línea base es la hora del
            servicio; con `desde`, el `implementadaEn` del último cambio
            entregado o el propio `desde` si no hubo ninguno.
        completo:
          type: boolean
          description: >
            false si quedaron cambios posteriores a `hasta` sin entregar
            porque el lote se cortó en `limite`.
        alertas:
          type: array
          description: Del cambio más antiguo al más reciente.
          items:
            $ref: "#/components/schemas/AlertaCambioCatalogo"

    DetalleDeProblema:
      type: object
      description: Formato estándar de detalles de problema (RFC 9457).
      required:
        - type
        - title
        - status
        - detail
        - instance
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
