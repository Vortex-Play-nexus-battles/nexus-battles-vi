# Catalogo oficial de THE NEXUS BATTLES VI — BACKEND-06 (B4).
#
# La lista canonica del documento del cliente (Proyecto Integrador II, seccion
# 6.1), escrita TAL CUAL la escribe el documento: nombres con sus tildes y sus
# mayusculas, y nada que el documento no diga. No hay precios, ni imagenes, ni
# descripciones: el documento no los fija (los precios de la semilla son una
# decision del PO, ver catalogo-inicial.json).
#
# Es la fuente contra la que `tests/contratos/catalogo-oficial.py` compara el
# catalogo que siembra el codigo:
#
#   * services/contenido/productos/src/main/resources/semilla/catalogo-inicial.json
#   * services/contenido/heroes/src/main/java/nexus/dominio/PrototiposIniciales.java
#   * services/contenido/heroes/src/main/java/nexus/dominio/EpicasIniciales.java
#
# Si el guardian se pone rojo, el que esta mal es el codigo, no este archivo:
# este archivo solo cambia cuando cambia el documento del cliente, y entonces
# sube `version` y cambia la semilla en el mismo PR.
#
# Notas de lectura del documento (las que no son copia literal):
#   * "Chaman- heroe secundario" y "Medico- heroe secundario" (Tabla 5) son los
#     prototipos "Chamán" y "Médico": asi los nombran las Tablas 6, 7 y 20.
#   * Tabla 7, Medico, Reanimacion: su costo es "Todos los puntos de poder";
#     aqui `costo: null`.
#   * La asociacion de cada arma, armadura e item a un tipo de heroe sale de las
#     columnas "Tipo de heroe" de las Tablas 8 a 19. El documento la describe
#     ("Armas para Guerreros", "los items se describen asociados a cada heroe")
#     pero NO enuncia una regla que impida equipar objetos de otro tipo: por eso
#     el inventario no la aplica. La unica afinidad con efecto que el documento
#     define es la de las epicas (Tabla 20: efecto general para todos, efecto
#     potenciado para el tipo afin).
#   * `probabilidadCaida` y `probabilidadMaster` son porcentajes (3 = 3 %).
#   * `epicasDeMision` no es de la Tabla 20: es la epica que el documento define
#     DENTRO de la mision de ejemplo (seccion 7.8.14). Es un producto EPICA del
#     catalogo, pero no una de las ocho de `EpicasIniciales` (heroes), que son
#     las de la Tabla 20 y a las que cada tipo de heroe tiene derecho; por eso el
#     guardian la exige en la semilla de productos y la rechaza en heroes.
#     Su Master dice "0.15 % (15 % de probabilidad)": se toma la aclaracion
#     entre parentesis, como en la semilla de misiones.

version: 2
fuente: "Proyecto Integrador II, seccion 6.1: Tablas 5 y 6 (heroes), 7 (acciones), 8-11 (armas), 12-15 (armaduras), 16-19 (items), 20 (epicas); seccion 7.8.14 (epica de la mision de ejemplo)"

