// Biblioteca compartida de observabilidad (HU-REN-001).
//
// NO aplica 'nexus.spring-conventions' a proposito: esa convencion trae el
// plugin de Spring Boot, que espera una clase con main para armar el bootJar.
// Esto es una biblioteca, no un servicio: se empaqueta como jar corriente y
// son los servicios quienes la declaran como dependencia.
//
// El BOM se importa igual que en las convenciones, para que las versiones de
// Spring sean exactamente las mismas que en los veinte modulos y no aparezca
// una segunda version de spring-web en el classpath.
plugins {
    id 'java-library'
    id 'jacoco'
    id 'io.spring.dependency-management'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.boot:spring-boot-dependencies:4.1.1'
    }
}

dependencies {
    // R11 — regla 5. `FiltroDeTraza` vive en plataforma-comun (que no arrastra
    // Spring a proposito) y esta biblioteca es la que lo enciende. Va como
    // `api` y no `implementation` para que el servicio que ya usa
    // `ErrorDeNegocio` de esa misma biblioteca lo siga teniendo sin declararla
    // dos veces.
    api project(':shared:libs:plataforma-comun')

    // Todo compileOnly: los servicios que usan esta biblioteca ya traen
    // spring-boot-starter-webmvc por las convenciones, que aporta spring-web,
    // spring-webmvc y la API de servlet en tiempo de ejecucion. Declararlas
    // como implementation duplicaria esos jar en el classpath del servicio y
    // abriria la puerta a dos versiones distintas de Spring.
    compileOnly 'org.springframework:spring-web'
    compileOnly 'org.springframework:spring-webmvc'
    compileOnly 'jakarta.servlet:jakarta.servlet-api'

    // La autoconfiguracion (CA-01) necesita @AutoConfiguration y las
    // @ConditionalOn*. Tambien compileOnly: todo servicio que aplica las
    // convenciones ya trae spring-boot-autoconfigure por sus starters.
    compileOnly 'org.springframework.boot:spring-boot-autoconfigure'

    // R11 — `RestClientCustomizer`, que es el gancho por el que el interceptor
    // de traza llega a los clientes HTTP de los veinte servicios. En Spring
    // Boot 4 vive en su propio modulo (`org.springframework.boot.restclient`),
    // no en `spring-boot-web`.
    compileOnly 'org.springframework.boot:spring-boot-restclient'

    // `FilterRegistrationBean`, para registrar el filtro de traza en el primer
    // lugar de la cadena. Esta en el artefacto nucleo `spring-boot`, no en
    // `spring-boot-web-server` (se comprobo abriendo los dos jar).
    compileOnly 'org.springframework.boot:spring-boot'

    testImplementation 'org.springframework:spring-web'
    testImplementation 'org.springframework:spring-webmvc'
    testImplementation 'jakarta.servlet:jakarta.servlet-api'
    testImplementation 'org.springframework:spring-test'
    testImplementation 'org.springframework.boot:spring-boot-autoconfigure'
    testImplementation 'org.springframework.boot:spring-boot-test'
    testImplementation 'org.springframework.boot:spring-boot-restclient'
    testImplementation 'org.springframework.boot:spring-boot'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core'

    // Para las pruebas del envoltorio de DataSource: JDBC son interfaces de
    // cincuenta metodos y escribir dobles a mano solo aportaria ruido.
    testImplementation 'org.mockito:mockito-core'
    // Una implementacion de SLF4J en las PRUEBAS, o el MDC no existe.
    //
    // `InterceptorDeTraza` lee el trace id del MDC. Con solo `slf4j-api` en el
    // classpath, SLF4J instala un adaptador NOP: `MDC.put(...)` no guarda nada
    // y `MDC.get(...)` devuelve siempre null. La prueba fallaba por eso y no
    // por el interceptor —que hacia exactamente lo correcto: sin traza, no
    // pone cabecera—. En un servicio real no se nota porque Spring Boot trae
    // logback; aqui, en una biblioteca aislada, hay que traerlo a mano.
    testRuntimeOnly 'ch.qos.logback:logback-classic'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

jacocoTestReport {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}
