# Override de despliegue de services/cuentas/ms-chatbot (HU-CHA-001, HU-CHA-004,
# HU-CHA-008, HU-CHA-011).
#
# Mismo patron que los demas overrides de Cuentas (ms-finanzas, ms-subastas):
# solo declara "image:", nunca "build:". El jar se compila y la imagen se
# publica en ghcr.io en el job "construir-y-publicar" de cd.yml, nunca en el
# servidor. Se combina siempre con docker-compose.yml y
# docker-compose.deploy.yml, y solo cuando ms-chatbot esta entre los servicios
# de la corrida (lo decide desplegar.sh leyendo
# infrastructure/despliegue/servicios.json).
#
# Puerto 8094 en el host y en el contenedor (EXPOSE 8094 en su Dockerfile).
#
# CAPACIDAD: desplegableDev:false. Con 12 JVM el host de plataforma ya no tiene
# RAM ni swap libres (medido el 24-sep 03:50 UTC, CAPACIDAD.md). La credencial
# de chatbot-db ya la genera desplegar.sh en el host (secretos-bases.env): el
# unico bloqueo que queda es la memoria.
#
# B11: cd.yml ya copia este archivo al host (antes no, y un despliegue a
# demanda de ms-chatbot fallaba por archivo inexistente), y el servicio lleva
# el arranque escalonado. No usa credencial de servicio: todo lo que consulta
# de un jugador lo pide con el token del propio jugador (ADR-001/ADR-005), y
# torneos y la lista negra son publicos dentro de la red.

services:
  # Base de datos propia (regla 7, aislamiento de datos): no comparte servidor
  # con plataforma-db ni con la de ningun otro servicio.
  chatbot-db:
    image: postgres:17-alpine
    container_name: chatbot-db
    restart: unless-stopped
    mem_limit: 128m
    environment:
      POSTGRES_DB: ${MS_CHATBOT_DB_NAME:-chatbot_db}
      POSTGRES_USER: ${MS_CHATBOT_DB_USER}
      POSTGRES_PASSWORD: ${MS_CHATBOT_DB_PASSWORD}
    volumes:
      - chatbot-db-datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MS_CHATBOT_DB_USER} -d ${MS_CHATBOT_DB_NAME:-chatbot_db}"]
      interval: 5s
      timeout: 5s
      retries: 20

  srv-ms-chatbot:
    image: ghcr.io/vortex-play-nexus-battles/nexus-battles-vi-ms-chatbot:${TAG}
    container_name: srv-ms-chatbot
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "8094:8094"
    depends_on:
      # Flyway corre en el arranque (esquema "chatbot", con create-schemas):
      # si Postgres todavia no acepta conexiones, el servicio no arranca.
      chatbot-db:
        condition: service_healthy
    # Arranque escalonado del host (R16.5b): mismo script que el ancla
    # x-arranque-escalonado de docker-compose.deploy.yml, donde esta explicado.
    # Una ancla no cruza archivos, asi que se repite; el guardian
    # scripts/cd/comprobar-catalogo-servicios.sh exige que sea identico en
    # cuanto el servicio sea desplegableDev. B11 lo deja puesto para que
    # activarlo sea cambiar esa bandera, no reescribir este archivo.
    entrypoint:
      - /bin/sh
      - -c
      - |
        proc="$${ARRANQUE_PROC:-/proc}"
        creado="$${ARRANQUE_CREADO_EN:-9999999999}"
        arranque=$$(awk '/^btime/ {print $$2}' "$$proc/stat" 2>/dev/null)
        encendido=$$(cut -d. -f1 "$$proc/uptime" 2>/dev/null)
        if [ -n "$$arranque" ] && [ -n "$$encendido" ] \
           && [ "$$creado" -lt "$$arranque" ] 2>/dev/null \
           && [ "$$encendido" -lt "$${ARRANQUE_VENTANA_S:-600}" ] 2>/dev/null; then
          espera=$$(( $${ARRANQUE_TURNO:-0} * $${ARRANQUE_PASO_S:-40} ))
          echo "arranque escalonado: el host acaba de encender (hace $${encendido}s); turno $${ARRANQUE_TURNO:-0}, espero $${espera}s"
          trap 'exit 143' TERM INT
          sleep "$$espera" & wait $$!
          trap - TERM INT
        fi
        exec java -jar app.jar
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xmx128m -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=48m -XX:+ExitOnOutOfMemoryError"
      # Turno 6: los turnos 0-5 ya tienen dos JVM cada uno (CAPACIDAD.md).
      ARRANQUE_TURNO: "6"
      ARRANQUE_CREADO_EN: ${ARRANQUE_CREADO_EN:-9999999999}
      # El lado IZQUIERDO es el nombre que Spring lee (application.properties
      # de ms-chatbot). El DERECHO lo deja desplegar.sh en el .env del
      # servidor, con prefijo MS_CHATBOT_ para no pisar las variables de
      # plataforma-db ni las de los demas servicios de Cuentas.
      DB_HOST: ${MS_CHATBOT_DB_HOST:-chatbot-db}
      DB_PORT: ${MS_CHATBOT_DB_PORT:-5432}
      DB_NAME: ${MS_CHATBOT_DB_NAME:-chatbot_db}
      DB_USER: ${MS_CHATBOT_DB_USER}
      DB_PASSWORD: ${MS_CHATBOT_DB_PASSWORD}
      # Clave publica de los tokens de usuario (ADR-002), dentro de la red.
      IDENTIDAD_JWKS_URL: ${IDENTIDAD_JWKS_URL:-http://srv-ms-identidad:8089/api/v1/auth/jwks}
      # Consultas asistidas (HU-CHA-008). No usa credencial de servicio
      # (ADR-005): reenvia el token del propio jugador. Inventario vive en el
      # host de contenido, igual que en docker-compose.deploy.yml.
      INVENTARIO_BASE_URL: ${INVENTARIO_BASE_URL:-http://34.193.90.11:8102}
      SUBASTAS_BASE_URL: ${SUBASTAS_BASE_URL:-http://srv-ms-subastas:8092/api/v1}
      NOTIFICACIONES_BASE_URL: ${NOTIFICACIONES_BASE_URL:-http://srv-notificaciones:8085/api/v1}
      # B11 (ms-chatbot.yaml 2.0.0): movimientos de creditos del propio jugador
      # (con su token), torneos como dato publico y la lista negra para filtrar
      # lo que escribe el usuario (fail-closed por omision, D-14).
      FINANZAS_BASE_URL: ${FINANZAS_BASE_URL:-http://srv-ms-finanzas:8093/api/v1}
      TORNEOS_BASE_URL: ${TORNEOS_BASE_URL:-http://srv-torneos:8083/api/v1}
      LISTA_NEGRA_VERIFICAR_URL: ${LISTA_NEGRA_VERIFICAR_URL:-http://srv-moderacion-sanciones:8086/api/v1/lista-negra/verificar}
      # Limites y tiempos de espera: los valores por omision de
      # application.properties (provisionales, README de ms-chatbot) salvo que
      # el .env del host fije CHATBOT_LIMITE_* o CHATBOT_HTTP_TIMEOUT_*.

volumes:
  chatbot-db-datos:
