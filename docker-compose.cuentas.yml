# HU-CICD-002 (SCRUM-165): override de despliegue para services/cuentas/ms-identidad.
#
# Mismo patron que docker-compose.deploy.yml (Equipo 6, plataforma): solo
# declara "image:", nunca "build:" -- el jar se compila y la imagen se
# publica en ghcr.io en el job "construir-y-publicar" de cd.yml, nunca en el
# servidor. Se combina siempre con docker-compose.yml (nunca solo), y SOLO
# cuando ms-identidad esta entre los servicios modificados de esa corrida:
#   docker compose -f docker-compose.yml -f docker-compose.deploy.yml -f docker-compose.cuentas.yml pull|up -d
#
# Archivo separado de docker-compose.deploy.yml (no se agrega ahi) porque
# ms-identidad es de otro equipo (Cuentas), no de plataforma -- mantenerlo
# aparte deja claro quien es dueño de que, igual que ya separamos
# services/plataforma de services/cuentas en el resto del repo.
#
# Puerto: 8089 tanto en el host como en el contenedor.
# PENDIENTE DE CONFIRMAR: originalmente el Dockerfile de ms-identidad
# exponia 8081 (mismo puerto interno que srv-comentarios de plataforma), y
# aqui se mapeaba a un puerto de host distinto (8091) para evitar el choque.
# Cristian va a mover el puerto REAL del servicio (Dockerfile EXPOSE y
# server.port) de 8081 a 8089, con lo cual host y contenedor ya coinciden y
# el mapeo distinto deja de hacer falta. Este archivo YA asume ese cambio,
# pero Cristian todavia no confirmo que este hecho y probado de su lado --
# no desplegar hasta que confirme (si su Dockerfile sigue en 8081, este
# mapeo 8089:8089 apunta a un puerto que el contenedor no expone).
#
# ${TAG} lo exporta scripts/cd/desplegar.sh antes de invocar "docker compose"
# (mismo sha corto de esta corrida que usan las imagenes de plataforma).
#
# Variables de entorno (todas PENDIENTES, ver los secrets TODO_* en cd.yml):
# el lado IZQUIERDO de cada linea es el nombre que Spring realmente lee
# (confirmado en application-prod.properties de ms-identidad: ${DB_URL},
# ${DB_USER}, ${DB_PASSWORD}). El lado DERECHO (${MS_IDENTIDAD_...}) es la
# variable que desplegar.sh deja en el .env del servidor -- con el prefijo
# "MS_IDENTIDAD_" a proposito, porque el .env es compartido con plataforma
# y ya existen DB_USER/DB_PASS ahi (los usa plataforma-db); si este archivo
# leyera ${DB_USER} directo se pisarian entre si.
#
# LISTA_NEGRA_URL: application-prod.properties de ms-identidad TODAVIA NO
# tiene una propiedad "app.lista-negra.url" (solo existe hardcodeada en
# application-dev.properties). Esta variable queda inyectada para cuando
# Cristian agregue "app.lista-negra.url=${LISTA_NEGRA_URL:http://localhost:8086/api/v1/lista-negra/verificar}"
# -- hasta que el haga ese cambio, esto no tiene ningun efecto (Spring
# simplemente no la lee todavia).
#
# SPRING_PROFILES_ACTIVE: solo llega con valor en el despliegue a
# produccion (cd.yml la deja vacia en dev/test a proposito, hasta que
# Cristian confirme como quiere manejar los perfiles ahi). Vacia, Spring
# usa el default declarado en application.properties (spring.profiles.active=dev).

services:
  # Base de datos PROPIA de ms-identidad (regla 7: aislamiento de datos; no
  # comparte servidor con plataforma-db). Volumen con nombre para que los
  # usuarios registrados sobrevivan a un redespliegue y al apagado nocturno
  # del host. Los tres MS_IDENTIDAD_DB_* apuntan aqui:
  #   MS_IDENTIDAD_DB_URL=jdbc:postgresql://identidad-db:5432/identidaddb
  identidad-db:
    image: postgres:15-alpine
    container_name: identidad-db
    restart: unless-stopped
    mem_limit: 192m
    environment:
      POSTGRES_DB: identidaddb
      POSTGRES_USER: ${MS_IDENTIDAD_DB_USER}
      POSTGRES_PASSWORD: ${MS_IDENTIDAD_DB_PASSWORD}
    volumes:
      - identidad-db-datos:/var/lib/postgresql/data

  srv-ms-identidad:
    image: ghcr.io/vortex-play-nexus-battles/nexus-battles-vi-ms-identidad:${TAG}
    container_name: srv-ms-identidad
    restart: unless-stopped
    mem_limit: 448m
    ports:
      - "8089:8089"
    depends_on:
      - identidad-db
    # Arranque escalonado del host (R16.5b): mismo script que el ancla
    # x-arranque-escalonado de docker-compose.deploy.yml, donde esta explicado.
    # Una ancla no cruza archivos, asi que se repite; el guardian
    # scripts/cd/comprobar-catalogo-servicios.sh exige que sea identico.
    entrypoint:
      - /bin/sh
      - -c
      - |
        proc="$${ARRANQUE_PROC:-/proc}"
        creado="$${ARRANQUE_CREADO_EN:-9999999999}"
        arranque=$$(awk '/^btime/ {print $$2}' "$$proc/stat" 2>/dev/null)
        encendido=$$(cut -d. -f1 "$$proc/uptime" 2>/dev/null)
        if [ -n "$$arranque" ] && [ -n "$$encendido" ] \
           && [ "$$creado" -lt "$$arranque" ] 2>/dev/null \
           && [ "$$encendido" -lt "$${ARRANQUE_VENTANA_S:-600}" ] 2>/dev/null; then
          espera=$$(( $${ARRANQUE_TURNO:-0} * $${ARRANQUE_PASO_S:-40} ))
          echo "arranque escalonado: el host acaba de encender (hace $${encendido}s); turno $${ARRANQUE_TURNO:-0}, espero $${espera}s"
          trap 'exit 143' TERM INT
          sleep "$$espera" & wait $$!
          trap - TERM INT
        fi
        exec java -jar app.jar
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xmx128m -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=48m -XX:+ExitOnOutOfMemoryError"
      # Turno 0: todos los demas le piden token o su JWKS.
      ARRANQUE_TURNO: "0"
      ARRANQUE_CREADO_EN: ${ARRANQUE_CREADO_EN:-9999999999}
      DB_URL: ${MS_IDENTIDAD_DB_URL}
      DB_USER: ${MS_IDENTIDAD_DB_USER}
      DB_PASSWORD: ${MS_IDENTIDAD_DB_PASSWORD}
      # Integraciones dentro de la red de compose. Sin estos valores el
      # servicio caia a sus defaults de localhost (correo, notificaciones y
      # auditoria dentro de SU contenedor): el registro respondia 201 pero el
      # correo de bienvenida nunca salia y nadie lo veia porque CorreoClient
      # es fail-open. Todos los -f de compose forman un solo proyecto, asi que
      # los nombres de servicio de plataforma resuelven desde aqui.
      LISTA_NEGRA_URL: ${LISTA_NEGRA_URL:-http://srv-moderacion-sanciones:8086/api/v1/lista-negra/verificar}
      CORREO_BIENVENIDA_URL: ${CORREO_BIENVENIDA_URL:-http://srv-correo:8082/api/v1/correos/bienvenida}
      CORREO_AVISO_ACCESO_URL: ${CORREO_AVISO_ACCESO_URL:-http://srv-correo:8082/api/v1/correos/aviso-acceso}
      CORREO_RECUPERACION_CLAVE_URL: ${CORREO_RECUPERACION_CLAVE_URL:-http://srv-correo:8082/api/v1/correos/recuperacion-clave}
      CORREO_CONFIRMACION_CUENTA_URL: ${CORREO_CONFIRMACION_CUENTA_URL:-http://srv-correo:8082/api/v1/correos/confirmacion-cuenta}
      CORREO_CAMBIO_CLAVE_URL: ${CORREO_CAMBIO_CLAVE_URL:-http://srv-correo:8082/api/v1/correos/cambio-clave}
      NOTIFICACIONES_URL: ${NOTIFICACIONES_URL:-http://srv-notificaciones:8085/api/v1/internal/notifications}
      AUDITORIA_URL: ${AUDITORIA_URL:-http://srv-ms-cumplimiento:8091/api/v1/admin/auditoria/eventos}
      # R17 — alta del jugador: ms-identidad la orquesta y cada dueno hace lo
      # suyo por su API con la credencial de servicio (ADR-005). Mismas
      # variables y destinos que ya usan salas-partidas y moderacion-sanciones:
      # ms-finanzas y admin-parametros en este host; inventario y productos en
      # el host de contenido (8101-8104 solo admiten la EIP de este host, R9.4).
      CREDITOS_URL: ${CREDITOS_URL:-http://srv-ms-finanzas:8093/api/v1}
      PARAMETROS_URL: ${PARAMETROS_URL:-http://srv-admin-parametros:8088/api/v1}
      INVENTARIO_BASE_URL: ${INVENTARIO_BASE_URL:-http://34.193.90.11:8102}
      PRODUCTOS_BASE_URL: ${PRODUCTOS_BASE_URL:-http://34.193.90.11:8103}
      # RESPALDO PROVISIONAL DE DEV — no es decision de producto (D-28, D-29).
      # Solo se aplica mientras `jugador.creditos-iniciales` y
      # `jugador.kit-inicial` sigan SIN VALOR en admin-parametros; en cuanto un
      # administrador los fije desde el panel, mandan ellos. 500 creditos: la
      # misma cifra que el banco E2E usa desde R0. Kit: Guerrero Tanque (heroe
      # de combate) + Espada de una mano, ids del catalogo real de DEV
      # (comprobados por GET /api/v1/productos/{id} el 24-sep-2026). Lo minimo
      # para que HU-SAL-003 deje entrar a una partida: heroe con algo equipado.
      JUGADOR_CREDITOS_INICIALES: ${JUGADOR_CREDITOS_INICIALES:-500}
      JUGADOR_KIT_INICIAL: ${JUGADOR_KIT_INICIAL:-aec4fbd2-9615-352a-9f2b-3fad781e123c,1647b2ea-096d-37e7-b580-0172e4c62313}
      SPRING_PROFILES_ACTIVE: ${MS_IDENTIDAD_SPRING_PROFILES_ACTIVE}
      # Cuentas administrativas iniciales (AdministradoresIniciales).
      # Formato apodo|correo|clave, separadas por ";". Idempotente: si la
      # cuenta ya existe no se toca, asi que volver a desplegar no reescribe
      # una clave que alguien haya cambiado. Vacio = no se crea ninguna.
      #
      # Tres responsables con el MISMO rol y credenciales DISTINTAS: si los
      # tres entraran con la misma cuenta, la auditoria diria que "admin"
      # suspendio a alguien, que es tanto como no decir nada.
      ADMINS_INICIALES: ${ADMINS_INICIALES:-}
      # Emisor transitorio de credenciales de servicio (ADR-005): los
      # clientes y sus secretos los genera desplegar.sh en el host.
      AUTH_CLIENTES_SERVICIO: ${AUTH_CLIENTES_SERVICIO:-}
      # Clave de firma estable (ADR-002); sin valor se genera una efimera.
      JWT_CLAVE_PRIVADA: ${JWT_CLAVE_PRIVADA:-}
      # R9.5 — origenes CORS. Antes eran comodin escrito en WebSecurityConfig;
      # ahora son configuracion (regla 10). Vacio = la lista de desarrollo que
      # trae el servicio, que es restrictiva pero utilizable: en AWS el
      # navegador llega por el borde y es mismo origen, asi que hoy no hace
      # falta darle valor. Se rellena el dia que el frontend viva en otro
      # dominio, sin tocar el codigo.
      IDENTIDAD_CORS_ORIGENES: ${IDENTIDAD_CORS_ORIGENES:-}
      # R9.5 — el respaldo por cabecera X-User-Role viene APAGADO. Encenderlo
      # aqui reabre la escalada sin token: solo para una demo local y a
      # sabiendas. Nunca en un host compartido.
      RBAC_PERMITIR_HEADER_ROL: ${RBAC_PERMITIR_HEADER_ROL:-false}

volumes:
  identidad-db-datos:
