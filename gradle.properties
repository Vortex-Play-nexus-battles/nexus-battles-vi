# Propiedades de Gradle comunes a los tres equipos.
#
# IMPORTANTE: no anadir aqui "org.gradle.java.home".
# Es una ruta absoluta a la maquina de quien la escribe y rompe la compilacion
# de los otros diecisiete. Cada quien apunta su JDK 21 desde su propio entorno
# (JAVA_HOME o el ajuste de VS Code), nunca desde el repositorio.

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
