# Banco de pruebas del borde (M16A, red y balanceo).
#
# NO forma parte del despliegue. Levanta el `borde-dev.conf` REAL —con un solo
# destino cambiado, el del catalogo, ver `borde-conf`— contra servicios de
# mentira que se llaman igual que los de verdad, para poder comprobar a que
# servicio y con que ruta llega cada peticion, sin desplegar nada en la nube y
# sin gastar un centavo.
#
#   cd infrastructure/red-balanceo/pruebas
#   docker compose up -d --wait
#   ./comprobar-rutas.sh          # o comprobar-rutas.ps1 en Windows
#   docker compose down -v
#
# Por que hace falta: `proxy_pass` con variable y con URI no se comporta como
# `proxy_pass` con URI a secas —nginx manda la URI tal cual, sin el resto de
# la ruta—, y eso no se ve leyendo el fichero. Se ve aqui.
#
# R8.4 — se paso de tres ecos a once. El banco cubria carrito, productos y
# salas; el defecto de `/api/v1/admin/auditoria` (un prefijo simple tapado por
# una regex) vivio dos semanas justamente porque su ruta no estaba aqui. Ahora
# estan los once servicios que el borde enruta por nombre de contenedor.
#
# Lo que este banco NO puede cubrir: `heroes` e `inventario`, que desde el PR
# #611 apuntan al host de contenido por IP (`34.193.90.11`). Una IP no se
# puede suplantar con un nombre de servicio de Compose. Para esos dos hay un
# guardian aparte en `comprobar-rutas.sh` que comprueba el fichero, no el
# trafico.
#
# `productos` SI se prueba con trafico desde R16, gracias a `borde-conf` (mas
# abajo): es la ruta que acaba de cambiar de dueno (#421) y un `grep` no dice
# si una `location =` o una regex se la sigue quitando al catalogo. Solo lo
# dice una peticion.
services:
  # B12 — un cliente "de internet". Desde el anfitrion (localhost:8099) el borde
  # ve llegar las peticiones desde la pasarela de Docker, una direccion privada:
  # justo lo que el borde trata como origen interno (Mailpit abierto, sin
  # limite de frecuencia). Para ver lo que ve un visitante cualquiera hace falta
  # un origen publico, y este contenedor lo es: vive SOLO en la red `publico`
  # (203.0.113.0/24, TEST-NET-3, reservada para documentacion y no enrutable) y
  # habla con el borde por ella. Es la misma imagen del borde porque trae curl:
  # no se descarga nada nuevo. `comprobar-rutas.sh` lo usa con
  # `docker compose exec`.
  cliente-publico:
    image: nginx:1.27-alpine
    command: ["sleep", "86400"]
    # Con init, `docker compose down` lo para en el acto: `sleep` como PID 1 no
    # atiende SIGTERM y Compose esperaria diez segundos para matarlo.
    init: true
    networks: [publico]

  srv-comentarios:
    image: nginx:1.27-alpine
    hostname: COMENTARIOS
    volumes: [./eco.conf:/etc/nginx/conf.d/default.conf:ro]
    networks: [borde]

  srv-torneos:
    image: nginx:1.27-alpine
    hostname: TORNEOS
    volumes: [./eco.conf:/etc/nginx/conf.d/default.conf:ro]
    networks: [borde]

  srv-salas-partidas:
    image: nginx:1.27-alpine
    hostname: SALAS
    volumes: [./eco.conf:/etc/nginx/conf.d/default.conf:ro]
    networks: [borde]

  srv-notificaciones:
    image: nginx:1.27-alpine
    hostname: NOTIFICACIONES
    volumes: [./eco.conf:/etc/nginx/conf.d/default.conf:ro]
    networks: [borde]

  srv-moderacion-sanciones:
    image: nginx:1.27-alpine
    hostname: MODERACION
    volumes: [./eco.conf:/etc/nginx/conf.d/default.conf:ro]
    networks: [borde]

  srv-metricas-plataforma:
    image: nginx:1.27-alpine
    hostname: METRICAS
    volumes: [./eco.conf:/etc/nginx/conf.d/default.conf:ro]
    networks: [borde]

  srv-admin-parametros:
    image: nginx:1.27-alpine
    hostname: PARAMETROS
    volumes: [./eco.conf:/etc/nginx/conf.d/default.conf:ro]
    networks: [borde]

  srv-ms-identidad:
    image: nginx:1.27-alpine
    hostname: IDENTIDAD
    volumes: [./eco.conf:/etc/nginx/conf.d/default.conf:ro]
    networks: [borde]

  srv-ms-cumplimiento:
    image: nginx:1.27-alpine
    hostname: CUMPLIMIENTO
    volumes: [./eco.conf:/etc/nginx/conf.d/default.conf:ro]
    networks: [borde]

  srv-ms-finanzas:
    image: nginx:1.27-alpine
    hostname: FINANZAS
    volumes: [./eco.conf:/etc/nginx/conf.d/default.conf:ro]
    networks: [borde]

  srv-ms-subastas:
    image: nginx:1.27-alpine
    hostname: SUBASTAS
    volumes: [./eco.conf:/etc/nginx/conf.d/default.conf:ro]
    networks: [borde]

  srv-ms-chatbot:
    image: nginx:1.27-alpine
    hostname: CHATBOT
    volumes: [./eco.conf:/etc/nginx/conf.d/default.conf:ro]
    networks: [borde]

  srv-ms-ecommerce:
    image: nginx:1.27-alpine
    hostname: ECOMMERCE
    volumes: [./eco.conf:/etc/nginx/conf.d/default.conf:ro]
    networks: [borde]

  srv-productos:
    image: nginx:1.27-alpine
    hostname: PRODUCTOS
    volumes: [./eco.conf:/etc/nginx/conf.d/default.conf:ro]
    networks: [borde]

  # B9 — misiones vive en el host de contenido (34.193.90.11:8105); el banco lo
  # sustituye por este eco, con el mismo mecanismo que productos.
  srv-misiones:
    image: nginx:1.27-alpine
    hostname: MISIONES
    volumes: [./eco.conf:/etc/nginx/conf.d/default.conf:ro]
    networks: [borde]

  # B1 — la bandeja de pruebas. El borde la sirve en /mailpit/ y las pruebas
  # leen de su API el codigo que verifica cada cuenta nueva. Se llama como el
  # contenedor de verdad (`mailpit`, el nombre que usa `borde-dev.conf`).
  mailpit:
    image: nginx:1.27-alpine
    hostname: MAILPIT
    volumes: [./eco.conf:/etc/nginx/conf.d/default.conf:ro]
    networks: [borde]

  # R16 — adaptador del borde para el banco, el mismo mecanismo que
  # `e2e-borde-conf` en tests/e2e/compose.yml (R8.2, #614).
  #
  # Hasta R16 el borde montaba el `borde-dev.conf` tal cual, y por eso el
  # catalogo de productos no se podia probar con trafico: su destino es
  # `34.193.90.11:8103`, y una peticion del banco salia de esta maquina hacia
  # el host de contenido REAL. Mientras la ruta exacta la tenia ms-ecommerce
  # daba igual. Ahora no: `GET /api/v1/productos` acaba de cambiar de dueno
  # (#421) y es justo lo que hay que ver llegar.
  #
  # Este contenedor copia el fichero de verdad cambiando SOLO ese destino por
  # el eco `srv-productos`, que escucha en 8080 (eco.conf). Todo lo demas —
  # cada `location`, cada regex, su orden— es el fichero de despliegue sin
  # tocar, y la comprobacion de que el fichero de verdad sigue apuntando a la
  # IP la hace `comprobar-rutas.sh` contra el original, no contra esta copia.
  #
  # Falla cerrado: si la sustitucion no aplica (cambio la IP, cambio el
  # puerto), el contenedor sale con error y el borde no arranca. Mejor un
  # banco que no levanta que uno que habla con AWS.
  borde-conf:
    image: nginx:1.27-alpine
    volumes:
      - ../borde-dev.conf:/origen/borde-dev.conf:ro
      - conf-del-borde:/salida
    command:
      - sh
      - -c
      - |
        set -e
        sed -e 's|34\.193\.90\.11:8103|srv-productos:8080|g' \
            -e 's|34\.193\.90\.11:8105|srv-misiones:8080|g' \
            /origen/borde-dev.conf > /salida/default.conf
        # Solo lineas efectivas: el fichero nombra la IP en sus comentarios.
        if grep -v '^[[:space:]]*#' /salida/default.conf | grep -qE '34\.193\.90\.11:810(3|5)'; then
          echo "ADAPTACION INCOMPLETA: el catalogo o misiones siguen apuntando al host de contenido." >&2
          exit 1
        fi
        grep -q 'srv-productos:8080' /salida/default.conf || {
          echo "ADAPTACION INCOMPLETA: no aparece srv-productos:8080." >&2; exit 1; }
        grep -q 'srv-misiones:8080' /salida/default.conf || {
          echo "ADAPTACION INCOMPLETA: no aparece srv-misiones:8080." >&2; exit 1; }
        echo "Borde adaptado al banco: el catalogo de productos y misiones son ecos locales."

  borde:
    image: nginx:1.27-alpine
    volumes:
      # La configuracion DERIVADA de `borde-conf`: el fichero de verdad con el
      # destino del catalogo cambiado por el eco. Si se edita el original, la
      # siguiente corrida lo vuelve a derivar y prueba lo editado.
      - conf-del-borde:/etc/nginx/conf.d:ro
      # R17 — las vistas y el kit, donde los deja el despliegue (/srv/nexus).
      # Sin ellos no se pueden probar con trafico las direcciones limpias, el
      # <base>, el nonce ni la redireccion de las rutas antiguas.
      - ../../../frontend:/srv/nexus/frontend:ro
      - ../../../shared:/srv/nexus/shared:ro
    ports:
      - '8099:80'
    # B12 — tambien en `publico`, para que el cliente de internet llegue a el.
    networks: [borde, publico]
    depends_on:
      borde-conf: { condition: service_completed_successfully }
      srv-comentarios: { condition: service_started }
      srv-torneos: { condition: service_started }
      srv-salas-partidas: { condition: service_started }
      srv-notificaciones: { condition: service_started }
      srv-moderacion-sanciones: { condition: service_started }
      srv-metricas-plataforma: { condition: service_started }
      srv-admin-parametros: { condition: service_started }
      srv-ms-identidad: { condition: service_started }
      srv-ms-cumplimiento: { condition: service_started }
      srv-ms-finanzas: { condition: service_started }
      srv-ms-subastas: { condition: service_started }
      srv-ms-ecommerce: { condition: service_started }
      srv-ms-chatbot: { condition: service_started }
      srv-productos: { condition: service_started }
      srv-misiones: { condition: service_started }
      mailpit: { condition: service_started }

networks:
  borde:
    driver: bridge
  # B12 — la red "de internet" del banco. `internal`: ni sale a ninguna parte
  # ni da la ruta por defecto del borde, que sigue siendo `borde`. Por eso el
  # puerto publicado 8099 entra por `borde` y el anfitrion sigue siendo un
  # origen privado; comprobar-rutas.sh lo comprueba en cada corrida.
  publico:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 203.0.113.0/24

# Efimero: `docker compose down -v` lo borra y la siguiente corrida deriva la
# configuracion otra vez del `borde-dev.conf` actual.
volumes:
  conf-del-borde:
