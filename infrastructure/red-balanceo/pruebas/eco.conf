# Servicio de mentira para el banco de pruebas del borde.
#
# Responde con su propio nombre, el metodo y la ruta EXACTA que le llego.
# Eso es lo que se quiere observar: que URI reescribe el borde antes de
# reenviar. Escucha en los dos puertos que usan los servicios reales para
# poder hacer de cualquiera de ellos.
server {
    listen 8080;
    listen 8084;
    listen 8090;
    server_name _;

    location / {
        default_type text/plain;
        return 200 "$hostname $request_method $request_uri";
    }
}
