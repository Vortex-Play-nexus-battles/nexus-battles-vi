# Servicio de mentira para el banco de pruebas del borde.
#
# Responde con su propio nombre, el metodo y la ruta EXACTA que le llego.
# Eso es lo que se quiere observar: a que servicio reparte el borde cada
# peticion y que URI reescribe antes de reenviarla.
#
# Escucha en TODOS los puertos de servicio del despliegue para poder hacer de
# cualquiera de ellos: asi un solo fichero sirve para los trece ecos y no hay
# que mantener uno por servicio. Los puertos salen de `puerto_de()` en
# `.github/workflows/cd.yml`.
server {
    listen 8080;   # generico / contenido
    listen 8081;   # comentarios
    listen 8082;   # correo
    listen 8083;   # torneos
    listen 8084;   # salas-partidas
    listen 8085;   # notificaciones
    listen 8086;   # moderacion-sanciones
    listen 8087;   # metricas-plataforma
    listen 8088;   # admin-parametros
    listen 8089;   # ms-identidad
    listen 8090;   # ms-ecommerce
    listen 8091;   # ms-cumplimiento
    listen 8092;   # ms-subastas
    listen 8093;   # ms-finanzas
    listen 8094;   # ms-chatbot
    server_name _;

    # Sin limite de cuerpo: el eco no lo lee, y asi el unico limite que se
    # observa en el banco es el del borde (B3: 3m para las imagenes de
    # comentarios). Con el 1m por omision de nginx, el eco devolveria su
    # propio 413 y no se podria distinguir del del borde.
    client_max_body_size 0;

    location / {
        default_type text/plain;
        return 200 "$hostname $request_method $request_uri";
    }
}
