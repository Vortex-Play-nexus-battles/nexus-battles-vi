# Borde del host de DESARROLLO (M16A, red y balanceo). Un solo origen para
# el navegador: http://<ip-del-host>/
#
#   /                                  -> redirige a /login
#   /login /registro /preparando       -> R17: direcciones limpias de las
#   /inicio /cuenta /inventario           vistas que alguien escribe o
#   /jugar /torneos /subastas             comparte (ver "Direcciones limpias")
#   /verificar /restablecer            -> B1: las dos a las que llevan los
#                                         enlaces del correo (correo 1.4.0)
#   /frontend/app-web/src/...          -> vistas HTML/JS del repo, tal cual;
#                                         las once de arriba redirigen a su
#                                         direccion limpia
#   /shared/ui-kit/...                 -> sistema de diseno (las vistas lo
#                                         referencian con ../../../../../shared)
#   /api/v1/<prefijo>                  -> el microservicio dueno del prefijo,
#                                         sin reescribir la ruta (regla 2:
#                                         todo bajo /api/v1)
#   /ws/notificaciones                 -> canal STOMP de notificaciones
#   /ws                                -> canal STOMP de salas y chat
#   /api/v1/ws-subastas                -> canal STOMP de subastas (B8): el
#                                         listado en vivo y el de cada subasta
#   /mailpit/                          -> bandeja del SMTP de pruebas
#
# Con esto las vistas trabajan en modo "integrado" (mismo origen, sin
# <meta name="nexus-api-base">) y no hace falta CORS entre navegador y
# servicios. Los servicios se resuelven por nombre en la red del compose,
# en cada peticion (resolver + variable): el borde arranca aunque un
# servicio todavia no este desplegado y responde 502 solo para ese prefijo.
#
# Se monta como /etc/nginx/conf.d/default.conf en el contenedor srv-borde
# (docker-compose.deploy.yml). Lo copia cd.yml junto con el frontend a
# /opt/nexus/web/ en cada despliegue de plataforma.
#
# Tabla de prefijos (fuente: @RequestMapping de cada servicio en develop).
# Un prefijo nuevo se registra aqui, en su servicio y en cd.yml (puerto_de).

resolver 127.0.0.11 valid=10s ipv6=off;

# R17 — las claves de los `map` de direcciones limpias son rutas largas
# (/frontend/app-web/src/plataforma/salas-partidas/batallas.html, 62 bytes) y
# no caben en el cubo de 64 por omision: nginx se niega a arrancar. Tiene que
# ir ANTES de los `map`, que construyen su tabla al leerse.
map_hash_bucket_size 128;

map $http_upgrade $conexion_mejora {
    default upgrade;
    ''      close;
}

# Los dos canales STOMP se distinguen por la ruta: /ws/notificaciones y /ws.
# Antes se distinguian por ?usuario=..., que era tambien la identidad sin
# verificar del canal de notificaciones; desde la 1.1.0 de ese contrato la
# identidad va en el CONNECT (JWT) y la URL ya no dice quien conecta.

# ------------------------------------------------- Direcciones limpias (R17)
# Las vistas que una persona escribe, comparte o se encuentra al entrar
# tienen una direccion que se puede decir en voz alta. El fichero sigue siendo
# el mismo: el borde lo sirve en la direccion limpia y redirige la antigua.
#
# B1 suma dos: /verificar (confirmar el correo de una cuenta nueva) y
# /restablecer (canjear el codigo de recuperacion o de activacion). Son las
# direcciones de los enlaces que manda el servicio de correo, con el codigo y
# el correo en el FRAGMENTO (/verificar#codigo=...&correo=...): el navegador
# no manda el fragmento a ningun servidor, asi que no pasa por este borde ni
# queda en su bitacora, y una redireccion 302 lo conserva.
#
# Por que 302 y no 301: un 301 se queda guardado en el navegador para siempre.
# Esto es DEV, sin dominio propio; si hubiera que volver atras, un 301 dejaria
# a quien ya lo vio apuntando a una direccion que ya no existe. Con un dominio
# estable se puede pasar a 301 cambiando una palabra.
map $uri $pagina_limpia {
    /login        /frontend/app-web/src/cuentas/login.html;
    /registro     /frontend/app-web/src/cuentas/registro.html;
    /preparando   /frontend/app-web/src/cuentas/preparando.html;
    /inicio       /frontend/app-web/src/cuentas/index.html;
    /cuenta       /frontend/app-web/src/cuentas/perfil.html;
    /subastas     /frontend/app-web/src/cuentas/subastas.html;
    /inventario   /frontend/app-web/src/contenido/inventario/inventario.html;
    /jugar        /frontend/app-web/src/plataforma/salas-partidas/batallas.html;
    /torneos      /frontend/app-web/src/plataforma/torneos/torneos.html;
    /verificar    /frontend/app-web/src/cuentas/verificar-cuenta.html;
    /restablecer  /frontend/app-web/src/cuentas/restablecer-confirmar.html;
}

# La inversa, para redirigir la direccion antigua a la limpia.
map $uri $direccion_limpia {
    /frontend/app-web/src/cuentas/login.html                         /login;
    /frontend/app-web/src/cuentas/registro.html                      /registro;
    /frontend/app-web/src/cuentas/preparando.html                    /preparando;
    /frontend/app-web/src/cuentas/index.html                         /inicio;
    /frontend/app-web/src/cuentas/perfil.html                        /cuenta;
    /frontend/app-web/src/cuentas/subastas.html                      /subastas;
    /frontend/app-web/src/contenido/inventario/inventario.html       /inventario;
    /frontend/app-web/src/plataforma/salas-partidas/batallas.html    /jugar;
    /frontend/app-web/src/plataforma/torneos/torneos.html            /torneos;
    /frontend/app-web/src/cuentas/verificar-cuenta.html              /verificar;
    /frontend/app-web/src/cuentas/restablecer-confirmar.html         /restablecer;
}

# La carpeta del fichero que se sirve, para el <base> de la pagina limpia.
# Las vistas enlazan todo en relativo (./login.js, ../comun/..., el kit con
# ../../../../shared/...). Servidas en /login, esas rutas se resolverian
# contra la raiz y fallarian; con <base href="/frontend/app-web/src/cuentas/">
# se resuelven como siempre, y la barra de direcciones sigue diciendo /login.
map $uri $carpeta_de_pagina {
    ~^(?<carpeta>/frontend/app-web/src/.+/)[^/]+\.html$   $carpeta;
    default                                                /;
}

# ---------------------------------------------------------- Cabeceras (R17)
# Solo las vistas propias llevan politica de contenido: la bandeja de Mailpit
# es otra aplicacion, con sus propios scripts, y una politica pensada para
# estas vistas la romperia. Tras la reescritura de una direccion limpia, $uri
# ya es la del fichero .html, asi que esta clasificacion la cubre tambien.
map $uri $es_vista_propia {
    ~^/frontend/.*\.html$   1;
    default                 0;
}

# `connect-src` necesita el origen de los WebSocket (/ws, /ws/notificaciones)
# con su puerto: detras del banco E2E es localhost:8099, no el 80 del
# contenedor. Se toma de la cabecera Host solo si tiene forma de host[:puerto],
# para que nadie pueda colar directivas en la politica a traves de ella.
map $http_host $origen_ws {
    # Entre comillas: sin ellas nginx lee la llave de {1,5} como un bloque.
    "~^[A-Za-z0-9.-]+(:[0-9]{1,5})?$"   "ws://$http_host wss://$http_host";
    default                              "";
}

# Politica de contenido de las vistas.
#
#   script-src: 'self' + un nonce por respuesta. Las vistas tienen 36 bloques
#     <script type="module"> en linea; el borde les pone el nonce al servirlas
#     (sub_filter, mas abajo). Los modulos que importan heredan el nonce del
#     que los importa. 'unsafe-inline' solo lo leen navegadores sin soporte de
#     nonce: los que lo tienen lo ignoran cuando hay nonce.
#   style-src 'unsafe-inline': el kit pone atributos style= desde JS
#     (distintivo de rareza, marcas de progreso). Un estilo en linea no ejecuta
#     codigo; un script si, y ahi es donde la politica es estricta.
#   img-src data: blob: https: — la vitrina trae sus imagenes como data:, la
#     vista previa del avatar es un blob:, y los productos pueden traer una
#     URL propia.
#   frame-ancestors 'none': nadie puede meter el juego en un marco
#     (clickjacking). X-Frame-Options dice lo mismo para navegadores viejos.
#
# Sin Strict-Transport-Security: el borde sirve HTTP. HSTS sobre HTTP no hace
# nada, y activarlo el dia que haya HTTPS antes de que este estable deja a los
# navegadores sin poder entrar. Va con el certificado, no antes.
map $es_vista_propia $politica_de_contenido {
    1         "default-src 'self'; script-src 'self' 'nonce-$request_id' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' $origen_ws; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    default   "";
}

# Cache: el HTML no se guarda (lleva un nonce distinto en cada respuesta, y
# guardarlo haria que la copia no casara con la politica de la siguiente); JS,
# CSS e imagenes se revalidan en cada carga para que un despliegue se vea al
# momento. A la API no se le pone nada: cada servicio decide la suya.
map $uri $cache_de_ruta {
    ~^/frontend/.*\.html$     "no-store";
    ~^/(frontend|shared)/     "no-cache";
    default                   "";
}

# ------------------------------------------- Limite de frecuencia (B12)
# Solo para lo que un bot haria en bucle desde una sola direccion: probar
# contrasenas, crear cuentas, pedir codigos por correo y escribir (comentar,
# calificar, reportar, subir imagenes, mandar mensajes, pujar). La lectura no
# se limita aqui: es barata y una sola pantalla dispara varias peticiones
# seguidas. El reparto de rutas no cambia -no hay ninguna `location` nueva-:
# la ruta solo decide con que CLAVE se cuenta la peticion, y una clave vacia
# no se cuenta.
#
# 1) Quien. Los origenes internos no se limitan: son los mismos que admite
#    /mailpit/ (mas abajo), la pasarela de Docker y el propio contenedor. Por
#    ella entran el banco E2E, que hace cientos de logins por minuto desde una
#    direccion privada, y los tuneles al host. Sin real_ip, $remote_addr es el
#    par real (ver /mailpit/ si algun dia hay un proxy delante).
geo $origen_interno {
    default         0;
    127.0.0.0/8     1;
    10.0.0.0/8      1;
    172.16.0.0/12   1;
    192.168.0.0/16  1;
}

# 2) Que. Metodo y ruta juntos: solo los POST de esta lista. `$uri` llega
#    normalizada (sin //, sin /./, sin %xx), asi que otra forma de escribir la
#    misma ruta cuenta igual, y las expresiones no se anclan al final para que
#    un sufijo (/, ;parametros) tampoco la saque de la cuenta. En las
#    location que reescriben (carrito, vitrina) $uri ya es la reescrita.
#
#    El metodo decide AQUI la clave del limite y nada mas: nunca un destino
#    (#421). comprobar-rutas.sh falla si una variable que sale de
#    $request_method aparece en un set, proxy_pass, return, rewrite o if.
#
#    /api/v1/mensajes-directos tiene location desde B6 (salas-partidas): el
#    envio por HTTP, el de respaldo cuando no hay WebSocket, cuenta aqui.
#
#    La compra (B5) tambien es escritura: cada POST cobra en la pasarela
#    simulada, reserva tiraje, entrega al inventario y manda un correo. Su
#    location reescribe a /ecommerce/api/v1/... antes de que se cuente, asi
#    que la expresion lleva el prefijo del servicio (ver arriba).
map "$request_method $uri" $clase_de_limite {
    default                                             "";
    "~^POST /api/v1/auth/(login|registro)"              acceso;
    "~^POST /api/v1/auth/(verificacion|restablecer)/"   acceso;
    "~^POST /api/v1/products/[^/]+/(comments|rating)"   escritura;
    "~^POST /api/v1/comentarios/imagenes"               escritura;
    "~^POST /api/v1/mensajes-directos(/|$)"             escritura;
    "~^POST /api/v1/subastas/[^/]+/pujas"               escritura;
    "~^POST /ecommerce/api/v1/checkout(/|$)"            escritura;
}

# 3) La clave de cada zona: la direccion del cliente si el origen es externo y
#    la ruta es de esa clase; vacia en cualquier otro caso.
map "$origen_interno:$clase_de_limite" $clave_acceso {
    "0:acceso"      $binary_remote_addr;
    default         "";
}
map "$origen_interno:$clase_de_limite" $clave_escritura {
    "0:escritura"   $binary_remote_addr;
    default         "";
}

# Numeros de PROTECCION, no requisitos del documento del curso; se pueden
# mover sin tocar ningun contrato.
#   acceso     30/min por direccion, rafaga de 20 sin espera. Registrarse,
#              confirmar el correo y entrar son 3 peticiones; equivocarse de
#              contrasena un par de veces, 5 o 6. Un aula entera detras del
#              mismo NAT entra de golpe hasta 20 y despues una cada 2 s. Un bot
#              que prueba contrasenas se queda en 30/min, y ms-identidad
#              ademas bloquea la cuenta tras sus intentos fallidos.
#   escritura  120/min, rafaga de 60 sin espera: dos por segundo sostenidas
#              es mas de lo que escribe nadie a mano; un bot que publica en
#              bucle se queda ahi.
# 1m de memoria compartida por zona: unas 8 000 direcciones a la vez en 64
# bits, de sobra para DEV.
limit_req_zone $clave_acceso    zone=acceso:1m    rate=30r/m;
limit_req_zone $clave_escritura zone=escritura:1m rate=120r/m;

# Retry-After, solo en el 429 que pone ESTE borde: `$limit_req_status` dice si
# a la peticion la rechazo el limite. Un 429 que venga de un servicio (los
# intentos de un codigo en ms-identidad, el tope de reportes de comentarios)
# pasa tal cual, con su propia cabecera si la trae, y no sale duplicada. El
# valor es lo que tarda en liberarse el siguiente hueco:
# 60 s / 30 = 2 s en acceso, 60 s / 120 = 0,5 s -> 1 s en escritura. Vacio =
# la cabecera no se envia (add_header del server).
map "$status:$limit_req_status:$clase_de_limite" $reintentar_tras {
    "429:REJECTED:acceso"      2;
    "429:REJECTED:escritura"   1;
    default                    "";
}

server {
    listen 80;
    server_name _;

    # 28-sep — HTTPS con Let's Encrypt, apagado hasta que haya dominio. Sin
    # certificado este comodin no encuentra ningun archivo (no es un error) y el
    # borde queda como siempre, solo en el 80. Con certificado,
    # scripts/cd/certificado.sh deja aqui borde-tls.conf (plantilla en
    # infrastructure/red-balanceo/tls/): el MISMO server escucha tambien en el
    # 443 y el 80 redirige a https salvo /salud-borde y el reto de ACME.
    include /etc/nginx/nexus-tls/*.conf;

    root /srv/nexus;
    charset utf-8;

    # R17 — las redirecciones del borde salen relativas (`Location: /login`).
    # Por omision nginx las hace absolutas con SU puerto (el 80 del
    # contenedor), y detras de un puerto publicado distinto —el banco E2E
    # escucha en 8099— el navegador acababa en un puerto donde no hay nadie.
    absolute_redirect off;

    # Techo general de cuerpo: las subidas del alta y del perfil (avatar de
    # ms-identidad). Las imagenes de comentarios tienen el suyo, mas estrecho,
    # en su propia location (B3, mas abajo).
    client_max_body_size 10m;

    # Los servicios ponen su propio trace id; el borde solo deja pasar
    # las cabeceras (regla 5). Un id propio por si la peticion muere aqui.
    add_header X-Borde-Peticion $request_id always;

    # R17 — cabeceras de seguridad, para todo lo que sale del borde.
    #
    # OJO con add_header en nginx: una `location` que declare el suyo propio
    # deja de heredar TODOS los del servidor. Por eso ninguna location de
    # abajo lleva add_header: lo que cambia por ruta (politica de contenido,
    # cache) va en los `map` de arriba, y una cabecera con valor vacio no se
    # envia. `comprobar-rutas.sh` mira que las cabeceras salgan en /login, en
    # una vista antigua, en el kit y en la API.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy $politica_de_contenido always;
    add_header Cache-Control $cache_de_ruta;
    # B12 — solo en el 429 del limite de frecuencia (ver $reintentar_tras).
    add_header Retry-After $reintentar_tras always;

    # Cabeceras comunes de proxy para todos los /api/v1/* (heredadas por las
    # location que no definen las suyas; /ws define las propias).
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    # B12 — limite de frecuencia (zonas y claves en los `map` de arriba). A
    # nivel de server para que lo hereden TODAS las location. Igual que con
    # add_header, una location que declare su propio limit_req,
    # limit_req_status o error_page deja de heredar estos y se queda sin
    # limite o sin su 429 en problem details: ninguna lo hace, y
    # comprobar-rutas.sh falla si alguna empieza a hacerlo.
    limit_req zone=acceso burst=20 nodelay;
    limit_req zone=escritura burst=60 nodelay;
    limit_req_status 429;
    # Un rechazo es el limite haciendo su trabajo, no un error del borde.
    limit_req_log_level warn;
    error_page 429 = @demasiadas_peticiones;

    location = / {
        return 302 /login;
    }

    location = /salud-borde {
        default_type text/plain;
        return 200 "UP\n";
    }

    # 28-sep — reto HTTP-01 de Let's Encrypt. certbot (scripts/cd/certificado.sh)
    # deja el fichero en /opt/nexus/acme, montado aqui en /srv/acme. `^~` para
    # que ninguna regex de abajo se lo quede. Solo ficheros: nada se proxea.
    location ^~ /.well-known/acme-challenge/ {
        root /srv/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    # B12 — la respuesta del limite de frecuencia: problem details como el
    # resto de la API (regla 4), con Retry-After (add_header del server). Es
    # una location con nombre: no es una ruta y desde fuera no se llega; solo
    # el error_page 429 de arriba la usa. Sin `charset`: application/problem+json
    # no esta en charset_types, y JSON es UTF-8 por definicion (RFC 8259).
    location @demasiadas_peticiones {
        default_type application/problem+json;
        return 429 '{"type":"https://nexusbattles.upb.edu.co/errors/demasiadas-peticiones","title":"Demasiadas peticiones","status":429,"detail":"Has hecho demasiadas peticiones seguidas desde tu conexión. Espera unos segundos y vuelve a intentarlo."}';
    }

    # R17 — las direcciones limpias (once desde B1). Se sirve el fichero de la
    # vista con un <base> hacia su carpeta (ver $carpeta_de_pagina) y la marca
    # que le dice a la interfaz que puede enlazar en limpio (comun/sesion.js,
    # hayRutasLimpias). `break` sirve el fichero aqui mismo, sin volver a
    # buscar location: por eso la redireccion de la ruta antigua, justo debajo,
    # no la atrapa en un bucle. La consulta (?volver=...) se conserva sola.
    location ~ ^/(login|registro|preparando|inicio|cuenta|subastas|inventario|jugar|torneos|verificar|restablecer)$ {
        rewrite ^ $pagina_limpia break;
        sub_filter_once off;
        sub_filter '<head>' '<head><base href="$carpeta_de_pagina"><meta name="nexus-rutas" content="limpias">';
        sub_filter '<script' '<script nonce="$request_id"';
    }

    # Con barra final, a la direccion sin ella.
    location ~ ^/(login|registro|preparando|inicio|cuenta|subastas|inventario|jugar|torneos|verificar|restablecer)/$ {
        return 302 /$1$is_args$args;
    }

    # La direccion antigua de esas vistas lleva a la limpia, con su consulta
    # (y el navegador conserva el fragmento del enlace del correo). Es una
    # regex, asi que gana a `location /frontend/` (un prefijo sin ^~): las
    # demas vistas siguen sirviendose tal cual; restablecer-solicitar tambien.
    location ~ ^/frontend/app-web/src/(cuentas/(login|registro|preparando|index|perfil|subastas|verificar-cuenta|restablecer-confirmar)|contenido/inventario/inventario|plataforma/salas-partidas/batallas|plataforma/torneos/torneos)\.html$ {
        return 302 $direccion_limpia$is_args$args;
    }

    location /frontend/ {
        try_files $uri =404;
        # Todas las vistas llevan la marca de direcciones limpias (una vista
        # antigua tambien enlaza a /jugar) y el nonce en sus <script>.
        sub_filter_once off;
        sub_filter '<head>' '<head><meta name="nexus-rutas" content="limpias">';
        sub_filter '<script' '<script nonce="$request_id"';
    }

    location /shared/ {
        try_files $uri =404;
    }

    # Nada mas del arbol copiado se sirve (esta misma configuracion vive ahi).
    location /infrastructure/ {
        return 404;
    }

    # ----------------------------------------------------------------- API
    # Plataforma (services/plataforma/*, puertos de cd.yml puerto_de()).
    location /api/v1/salas {
        set $destino srv-salas-partidas:8084;
        proxy_pass http://$destino;
    }
    # La partida vive en el mismo servicio, pero en su propio prefijo
    # (PartidasController mapea /api/v1/partidas). Sin esta entrada caia en el
    # 404 generico de /api/ y la vista de combate no podia cargar ninguna
    # partida: `sala-batalla.html` llama a GET /api/v1/partidas/{id} nada mas
    # abrirse. Lo destapo el E2E del corte vertical.
    location /api/v1/partidas {
        set $destino srv-salas-partidas:8084;
        proxy_pass http://$destino;
    }
    # B6 — mensajes privados (feedback del profesor): conversaciones,
    # historial, el envio de respaldo cuando el WebSocket no esta y el leido.
    # Mismo servicio y su propio prefijo, igual que /api/v1/partidas; sin esta
    # entrada caia en el 404 generico de /api/ y la pestana «Mensajes
    # privados» del chat no podia cargar nada.
    location /api/v1/mensajes-directos {
        set $destino srv-salas-partidas:8084;
        proxy_pass http://$destino;
    }
    location /api/v1/users {
        set $destino srv-notificaciones:8085;
        proxy_pass http://$destino;
    }
    location /api/v1/products {
        set $destino srv-comentarios:8081;
        proxy_pass http://$destino;
    }
    # R10.1 — la cola de moderacion de comentarios (RF-COM-005/008).
    #
    # Cuelga de /api/v1/comentarios y NO de /api/v1/moderacion, que es lo que
    # habria salido de forma natural del nombre. El motivo esta unas lineas
    # mas abajo: la regex de metricas ya se queda con /api/v1/moderacion. Dos
    # servicios compartiendo prefijo se puede forzar con `^~`, pero deja una
    # trampa para el siguiente que anada una ruta y no entienda por que acaba
    # en el servicio equivocado.
    location /api/v1/comentarios {
        set $destino srv-comentarios:8081;
        proxy_pass http://$destino;
    }
    # B3 — imagenes de comentarios (comentarios.yaml 1.4.0). Va al mismo
    # servicio que el prefijo de arriba (un prefijo mas largo gana en nginx),
    # pero con su propio limite de cuerpo: el contrato admite 2 MB por imagen
    # y el servicio los comprueba; 3m deja sitio a la envoltura multipart y
    # corta aqui, sin llegar al servicio, cualquier intento de mandar mas.
    location /api/v1/comentarios/imagenes {
        client_max_body_size 3m;
        set $destino srv-comentarios:8081;
        proxy_pass http://$destino;
    }
    # /api/v1/correos NO se expone: correo es un servicio entre servicios
    # (lo llama ms-identidad dentro de la red de compose con su credencial,
    # ADR-005). Desde fuera cae en el 404 de "prefijo sin servicio".
    location /api/v1/lista-negra {
        set $destino srv-moderacion-sanciones:8086;
        proxy_pass http://$destino;
    }
    location /api/v1/sanciones {
        set $destino srv-moderacion-sanciones:8086;
        proxy_pass http://$destino;
    }
    # HU-USR-006/007: apelaciones (del jugador y del panel de revision).
    location /api/v1/apelaciones {
        set $destino srv-moderacion-sanciones:8086;
        proxy_pass http://$destino;
    }
    # M13 torneos (HU-TOR-001..005, HU-ADM-005).
    location /api/v1/torneos {
        set $destino srv-torneos:8083;
        proxy_pass http://$destino;
    }
    # HU-ADM-001: parametros del sistema (lectura publica, cambio con token).
    location /api/v1/parametros {
        set $destino srv-admin-parametros:8088;
        proxy_pass http://$destino;
    }
    location ~ ^/api/v1/(latencia|disponibilidad|consultas|degradacion|tecnicas|moderacion) {
        set $destino srv-metricas-plataforma:8087;
        proxy_pass http://$destino;
    }

    # ------------------------------------------------------------- Cuentas
    # `^~` NO es decoracion: es lo unico que hace funcionar esta regla.
    #
    # El comentario que habia aqui hasta R8.4 decia que bastaba con declarar
    # esta `location` ANTES de la regex de /admin. Eso es falso, y el arreglo
    # del 2026-09-17 que se apoyaba en ello nunca funciono. El orden de
    # precedencia de nginx es:
    #
    #   1. `=`        coincidencia exacta, gana sobre todo
    #   2. `^~`       prefijo mas largo; si gana, NO se evaluan las regex
    #   3. `~` `~*`   regex, en orden de aparicion, la primera que case
    #   4. prefijo    el mas largo memorizado, solo si ninguna regex caso
    #
    # Un prefijo simple (paso 4) se evalua DESPUES de todas las regex, asi que
    # `location ~ ^/api/v1/(auth|perfiles|rbac|admin)` de mas abajo ganaba
    # siempre, estuviera donde estuviera este bloque. Comprobado en vivo contra
    # 35.168.124.119 el 2026-09-22: la peticion salia con el 404 de Spring de
    # **ms-identidad** ("No static resource api/v1/admin/auditoria"), no con el
    # 401 de ms-cumplimiento. La vista `cuentas/auditoria.js` llevaba rota
    # desde entonces, dandose por arreglada.
    #
    # Con `^~` el prefijo gana en el paso 2 y nginx ni mira las regex.
    #
    # Cubre las dos rutas que publica ms-cumplimiento (AuditLogController):
    # GET /api/v1/admin/auditoria y POST /api/v1/admin/auditoria/eventos.
    location ^~ /api/v1/admin/auditoria {
        set $destino srv-ms-cumplimiento:8091;
        proxy_pass http://$destino;
    }

    # El estado de los diecisiete servicios lo sirve metricas-plataforma, que
    # es quien ya tiene las sondas de salud. Mismo motivo y misma forma que
    # /api/v1/admin/auditoria: `^~` para ganar en el paso 2 de nginx, porque
    # un prefijo simple se evaluaria DESPUES de la regex de /admin de abajo y
    # esta consulta acabaria en ms-identidad con un 404 de Spring.
    location ^~ /api/v1/admin/sistema {
        set $destino srv-metricas-plataforma:8087;
        proxy_pass http://$destino;
    }

    # Evidencia de entrega de correo (RF-COR-001), y SOLO eso.
    #
    # `= ` es coincidencia exacta: expone la consulta de estado y ninguna otra
    # ruta de correo. Las de envio se quedan fuera del borde a proposito --
    # desde ellas se manda a cualquier direccion un codigo de recuperacion con
    # la plantilla corporativa, y no tienen por que ser alcanzables desde
    # internet aunque exijan credencial de servicio.
    location = /api/v1/correos/envios {
        set $destino srv-correo:8082;
        proxy_pass http://$destino;
    }

    # ms-identidad: login, registro, perfiles, RBAC y administracion de
    # cuentas y usuarios.
    location ~ ^/api/v1/(auth|perfiles|rbac|admin) {
        set $destino srv-ms-identidad:8089;
        proxy_pass http://$destino;
    }

    # Auditoria de DEV del 30-sep: la foto de perfil daba 404 y se veia su
    # texto alternativo. ms-identidad guarda el avatar y devuelve
    # `/avatares-subidos/<archivo>`, una ruta del MISMO origen que sirve el
    # propio servicio (WebConfig), pero ninguna `location` la llevaba a el:
    # caia en la raiz estatica del borde. Solo lectura: la subida va por la
    # API con su token. `^~` para que ninguna regex la tape.
    location ^~ /avatares-subidos/ {
        limit_except GET {
            deny all;
        }
        set $destino srv-ms-identidad:8089;
        proxy_pass http://$destino;
    }

    # ms-finanzas: creditos del jugador e historial de transacciones.
    location ~ ^/api/v1/(creditos|transacciones) {
        set $destino srv-ms-finanzas:8093;
        proxy_pass http://$destino;
    }

    # R8.4 — /api/v1/cofres no tenia `location` NINGUNA, y no constaba en
    # ningun issue.
    #
    # `frontend/app-web/src/cuentas/mis-cofres.js` pide GET /api/v1/cofres/mios
    # y ms-finanzas lo publica (MisCofresController, con context-path /api/v1),
    # pero el borde no lo enrutaba: la peticion caia en el 404 generico de
    # "prefijo sin servicio" de mas abajo. La vista Mis cofres estaba rota por
    # enrutado, no por el servicio.
    #
    # Va como prefijo simple y no dentro de la regex de arriba a proposito: es
    # un prefijo propio del contrato de creditos y merece leerse como tal.
    # Mientras ms-finanzas no quepa en el host de dev respondera 502, que es
    # honesto —el servicio no esta— y distinto del 404 de antes, que mentia
    # diciendo que la ruta no existe.
    location /api/v1/cofres {
        set $destino srv-ms-finanzas:8093;
        proxy_pass http://$destino;
    }

    # ms-subastas: listado, publicacion, pujas y, desde B8, el panel personal
    # (/mis-subastas: publicadas, seguimiento, pendientes, historial;
    # contracts/openapi/ms-subastas-panel.yaml). `(/|$)` para que un prefijo
    # que solo EMPIECE igual (/api/v1/subastasx) no se cuele en el servicio.
    #
    # Topologia 28-sep: ms-subastas vive en el host de contenido (claseHost
    # "contenido" en infrastructure/despliegue/servicios.json), como productos
    # y misiones: el destino es su IP elastica y su puerto publicado, que el
    # grupo de seguridad de contenido admite solo desde este host.
    location ~ ^/api/v1/(subastas|mis-pujas|mis-subastas)(/|$) {
        set $destino 34.193.90.11:8092;
        proxy_pass http://$destino;
    }

    # Canal STOMP de ms-subastas (B8, contracts/websocket/subastas.yaml 1.1.0):
    # /topic/subastas/listado para todos y /topic/subastas/{subastaId} con
    # sesion. Vive DENTRO de /api/v1 porque el servicio lo publica bajo su
    # context-path (server.servlet.context-path=/api/v1), no en /ws como los de
    # plataforma. Hasta B8 no tenia location y caia en el 404 generico de
    # /api/: el listado en vivo nunca paso por el borde y la vista degradaba al
    # sondeo de 5 s sin decirlo. `^~` para que ninguna regex de /api/v1 pueda
    # quitarselo; el mismo trato de Upgrade y tiempos que /ws.
    location ^~ /api/v1/ws-subastas {
        # Mismo host y puerto que la API de subastas (ver arriba).
        set $destino_ws 34.193.90.11:8092;
        proxy_pass http://$destino_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $conexion_mejora;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # STOMP manda heartbeats; sin esto nginx corta la conexion inactiva a los 60 s.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ms-chatbot (R16.22): conversacion (/chat/mensajes, /chat/historial,
    # calificacion) y su panel de administracion (/chatbot/admin/...), segun
    # contracts/openapi/ms-chatbot.yaml. Context-path /api/v1, asi que la ruta
    # viaja tal cual. El chat general de los jugadores NO pasa por aqui: es
    # STOMP sobre /ws (salas-partidas). Hasta R16 este prefijo no tenia
    # location y caia en el 404 generico de abajo: el servicio se construia y
    # se publicaba, pero no se levantaba ni se podia alcanzar.
    location ~ ^/api/v1/(chat|chatbot)(/|$) {
        set $destino srv-ms-chatbot:8094;
        proxy_pass http://$destino;
    }

    # ms-ecommerce: vitrina y carrito. Es el unico servicio con un
    # context-path que NO es /api/v1 (declara /ecommerce), asi que aqui si
    # hay que reescribir la ruta para que el navegador siga hablando /api/v1
    # como con todos los demas (regla 2).
    #
    # El `proxy_pass` NO lleva la ruta: cuando el destino es una variable y
    # ademas se escribe una URI, nginx manda ESA URI tal cual y tira el resto
    # de la peticion. Asi estaba hasta hoy, y por eso
    # `POST /api/v1/carrito/items` llegaba al servicio como
    # `POST /ecommerce/api/v1/carrito` —sin `/items`—, que no acepta POST:
    # anadir al carrito nunca funciono a traves del borde. Comprobado en
    # pruebas/, no deducido del manual.
    #
    # Con `rewrite ... break` la ruta se reescribe antes y el `proxy_pass`
    # manda lo reescrito, sufijo incluido. Los parametros de consulta se
    # conservan solos (la sustitucion no lleva `?`).
    location /api/v1/carrito {
        set $destino srv-ms-ecommerce:8090;
        rewrite ^/api/v1/carrito(.*)$ /ecommerce/api/v1/carrito$1 break;
        proxy_pass http://$destino;
    }

    # R16 — la vitrina de la tienda, con prefijo propio.
    #
    # Hasta R16 se publicaba como `GET /api/v1/productos`, colada en el prefijo
    # del catalogo por un reparto por metodo (#421, ver la seccion Contenido).
    # Desde ecommerce-carrito.yaml 1.2.0 ms-ecommerce la sirve en
    # /ecommerce/api/v1/vitrina, publica y paginada, y ya no lee una tabla
    # propia que nacia vacia: proyecta el catalogo maestro de
    # contenido/productos, y solo lo que se vende en dinero real.
    #
    # Mismo patron que /api/v1/carrito, y por los mismos dos motivos. El
    # context-path /ecommerce obliga a reescribir para que el navegador siga
    # hablando /api/v1 (regla 2). Y el `proxy_pass` va SIN ruta: con variable Y
    # uri, nginx manda esa uri tal cual y tira el resto de la peticion, que es
    # el defecto que dejaba `POST /api/v1/carrito/items` sin su `/items`. Con
    # `rewrite ... break` sale lo reescrito, sufijo incluido.
    #
    # Aqui la consulta pesa mas que en el carrito: `page`, `size` y `tipo`
    # viajan en ella. La sustitucion no lleva `?`, asi que nginx la conserva
    # sola; si se perdiera, la tienda ensenaria siempre la primera pagina.
    # pruebas/comprobar-rutas.sh lo fija con `?page=0`.
    location /api/v1/vitrina {
        set $destino srv-ms-ecommerce:8090;
        rewrite ^/api/v1/vitrina(.*)$ /ecommerce/api/v1/vitrina$1 break;
        proxy_pass http://$destino;
    }

    # B5 — lista de deseos, compra y ordenes (ecommerce-carrito.yaml 1.4.0).
    # Mismo patron que /api/v1/carrito y por los mismos motivos: context-path
    # /ecommerce y proxy_pass sin ruta. Una sola regex para los tres prefijos,
    # anclada al segmento (`(/|$)`) para que /api/v1/ordenesX no se cuele.
    # La compra lleva Idempotency-Key: nginx reenvia las cabeceras tal cual.
    location ~ ^/api/v1/(lista-deseos|checkout|ordenes)(/|$) {
        set $destino srv-ms-ecommerce:8090;
        rewrite ^/api/v1/(.*)$ /ecommerce/api/v1/$1 break;
        proxy_pass http://$destino;
    }

    # ----------------------------------------------------------- Contenido
    # Viven en su propio host (instancia nexus-contenido-dev, IP fija
    # 34.193.90.11, docker-compose.contenido.yml los publica en 8101-8105), no
    # en la red de Compose de este borde: por eso el destino es IP:puerto y no
    # el nombre de contenedor. Ver Boveda/06-proyecto/enlaces.md del grupo 2.
    location ~ ^/api/v1/(heroes|equipos|estrategias|progresion) {
        set $destino 34.193.90.11:8101;
        proxy_pass http://$destino;
    }
    location /api/v1/inventario {
        set $destino 34.193.90.11:8102;
        proxy_pass http://$destino;
    }
    # Catalogo de productos. No confundir con /api/v1/products (en ingles),
    # que es el hilo de comentarios de plataforma y ya esta mas arriba.
    #
    # El prefijo ENTERO es de contenido/productos, para todos los metodos:
    # el listado `GET /api/v1/productos`, el alta `POST`, `GET /{id}`,
    # `/estadisticas` y lo que publique despues. Un prefijo, un dueno.
    #
    # COLISION DE PREFIJO RESUELTA (#421). Hasta R16 dos servicios de equipos
    # distintos declaraban esta ruta:
    #
    #   contenido/productos   POST /api/v1/productos              (alta en el catalogo)
    #                         GET  /api/v1/productos/{id}
    #                         GET  /api/v1/productos/estadisticas
    #   cuentas/ms-ecommerce  GET  /api/v1/productos              (vitrina, Page de Spring)
    #                         ...bajo su context-path /ecommerce
    #
    # y el borde los separaba con dos `map $request_method` y una `location =`
    # exacta: el GET sin sufijo iba a la vitrina, el resto al catalogo. Era una
    # CAPA DE ADAPTACION (riesgo #3 del project charter), no una decision de
    # contrato, y tenia la trampa que ya anunciaba su propio comentario: el dia
    # que contenido/productos publicara su listado, el borde se lo comeria y
    # se lo daria a otro servicio. Ademas era nginx decidiendo la semantica de
    # una ruta por el metodo, algo que ningun contrato decia.
    #
    # La decision queda escrita en los contratos, contract-first (R16, a la
    # espera de la validacion de los equipos duenos, avisados en #684 y #687):
    #
    #   - productos.yaml 1.2.0 (#687): contenido/productos publica
    #     `GET /api/v1/productos`, el listado publico y paginado del catalogo
    #     maestro. Todo /api/v1/productos es suyo.
    #   - ecommerce-carrito.yaml 1.2.0: la vitrina se muda a /api/v1/vitrina
    #     (mas arriba, en Cuentas) y proyecta ese mismo catalogo. Su antiguo
    #     `GET /productos` sigue dentro de ms-ecommerce, deprecado, y el borde
    #     ya no lo publica.
    #
    # Por eso aqui ya no hay reparto por metodo, ni `location =`, ni `map`:
    # una sola `location` de prefijo, como inventario. pruebas/comprobar-rutas.sh
    # fija el reparto nuevo con trafico (GET y POST exactos y /{id} al catalogo)
    # y falla si alguien vuelve a repartir por `$request_method`.
    location /api/v1/productos {
        set $destino 34.193.90.11:8103;
        proxy_pass http://$destino;
    }
    # Misiones (B9, seccion 7.8; contracts/openapi/misiones.yaml). Todo el
    # prefijo es suyo: tablon, detalle, matricula, en curso, reporte,
    # historial, favoritas y estrategias guardadas. Mismo host de contenido,
    # puerto 8105 (docker-compose.contenido.yml). Mientras el catalogo lo
    # tenga en desplegableDev: false, esta ruta da 502 en dev y la interfaz
    # ensena su estado «sin abrir» (fuente-misiones.js).
    location /api/v1/misiones {
        set $destino 34.193.90.11:8105;
        proxy_pass http://$destino;
    }

    # Prefijo sin dueno registrado: 404 con problem details minimo, en vez
    # de dejar que el navegador reciba el HTML del login.
    location /api/ {
        default_type application/problem+json;
        return 404 '{"type":"about:blank","title":"Ruta sin servicio en el borde","status":404,"detail":"Ningun servicio registrado en borde-dev.conf atiende este prefijo."}';
    }

    # ---------------------------------------------------------- WebSocket
    location /ws/notificaciones {
        set $destino_ws srv-notificaciones:8085;
        proxy_pass http://$destino_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $conexion_mejora;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /ws {
        set $destino_ws srv-salas-partidas:8084;
        proxy_pass http://$destino_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $conexion_mejora;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # STOMP manda heartbeats; sin esto nginx corta la conexion inactiva a los 60 s.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ------------------------------------------------------------ Mailpit
    # MP_WEBROOT=/mailpit en docker-compose.deploy.yml.
    #
    # B12 — la bandeja NO es publica. Hasta B12 cualquiera que abriera
    # http://<ip-del-host>/mailpit/ leia los codigos de verificacion y de
    # recuperacion de todas las cuentas @nexus.test: bastaba con eso para
    # activar o quedarse con una cuenta ajena. Ahora solo la ven los origenes
    # internos:
    #   10/8, 172.16/12, 192.168/16
    #                   la pasarela de Docker. Todo lo que entra por el
    #                   localhost:80 del propio host llega al borde desde ella:
    #                   un tunel SSH o de Session Manager (smoke-dev,
    #                   canarios-jugador y prueba-del-profesor abren uno con la
    #                   llave de despliegue), y el banco E2E y el de rutas, que
    #                   entran por el puerto publicado de su anfitrion
    #   127.0.0.0/8     el propio contenedor del borde
    # Al resto, 403. `$remote_addr` es el par real porque este borde no usa
    # real_ip: si algun dia se pone un proxy o CloudFront delante, todo
    # llegaria desde la direccion del proxy y esto habria que revisarlo antes.
    location /mailpit/ {
        allow 127.0.0.0/8;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;
        set $destino mailpit:8025;
        proxy_pass http://$destino;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $conexion_mejora;
        proxy_set_header Host $host;
    }
}
