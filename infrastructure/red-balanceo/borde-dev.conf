# Borde del host de DESARROLLO (M16A, red y balanceo). Un solo origen para
# el navegador: http://<ip-del-host>/
#
#   /                                  -> redirige al login
#   /frontend/app-web/src/...          -> vistas HTML/JS del repo, tal cual
#   /shared/ui-kit/...                 -> sistema de diseno (las vistas lo
#                                         referencian con ../../../../../shared)
#   /api/v1/<prefijo>                  -> el microservicio dueno del prefijo,
#                                         sin reescribir la ruta (regla 2:
#                                         todo bajo /api/v1)
#   /ws/notificaciones                 -> canal STOMP de notificaciones
#   /ws                                -> canal STOMP de salas y chat
#   /mailpit/                          -> bandeja del SMTP de pruebas
#
# Con esto las vistas trabajan en modo "integrado" (mismo origen, sin
# <meta name="nexus-api-base">) y no hace falta CORS entre navegador y
# servicios. Los servicios se resuelven por nombre en la red del compose,
# en cada peticion (resolver + variable): el borde arranca aunque un
# servicio todavia no este desplegado y responde 502 solo para ese prefijo.
#
# Se monta como /etc/nginx/conf.d/default.conf en el contenedor srv-borde
# (docker-compose.deploy.yml). Lo copia cd.yml junto con el frontend a
# /opt/nexus/web/ en cada despliegue de plataforma.
#
# Tabla de prefijos (fuente: @RequestMapping de cada servicio en develop).
# Un prefijo nuevo se registra aqui, en su servicio y en cd.yml (puerto_de).

resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $conexion_mejora {
    default upgrade;
    ''      close;
}

# Los dos canales STOMP se distinguen por la ruta: /ws/notificaciones y /ws.
# Antes se distinguian por ?usuario=..., que era tambien la identidad sin
# verificar del canal de notificaciones; desde la 1.1.0 de ese contrato la
# identidad va en el CONNECT (JWT) y la URL ya no dice quien conecta.

server {
    listen 80;
    server_name _;

    root /srv/nexus;
    charset utf-8;

    # Imagenes de comentarios (HU-COM-001).
    client_max_body_size 10m;

    # Los servicios ponen su propio trace id; el borde solo deja pasar
    # las cabeceras (regla 5). Un id propio por si la peticion muere aqui.
    add_header X-Borde-Peticion $request_id always;

    # Cabeceras comunes de proxy para todos los /api/v1/* (heredadas por las
    # location que no definen las suyas; /ws define las propias).
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    location = / {
        return 302 /frontend/app-web/src/cuentas/login.html;
    }

    location = /salud-borde {
        default_type text/plain;
        return 200 "UP\n";
    }

    location /frontend/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location /shared/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Nada mas del arbol copiado se sirve (esta misma configuracion vive ahi).
    location /infrastructure/ {
        return 404;
    }

    # ----------------------------------------------------------------- API
    # Plataforma (services/plataforma/*, puertos de cd.yml puerto_de()).
    location /api/v1/salas {
        set $destino srv-salas-partidas:8084;
        proxy_pass http://$destino;
    }
    # La partida vive en el mismo servicio, pero en su propio prefijo
    # (PartidasController mapea /api/v1/partidas). Sin esta entrada caia en el
    # 404 generico de /api/ y la vista de combate no podia cargar ninguna
    # partida: `sala-batalla.html` llama a GET /api/v1/partidas/{id} nada mas
    # abrirse. Lo destapo el E2E del corte vertical.
    location /api/v1/partidas {
        set $destino srv-salas-partidas:8084;
        proxy_pass http://$destino;
    }
    location /api/v1/users {
        set $destino srv-notificaciones:8085;
        proxy_pass http://$destino;
    }
    location /api/v1/products {
        set $destino srv-comentarios:8081;
        proxy_pass http://$destino;
    }
    # R10.1 — la cola de moderacion de comentarios (RF-COM-005/008).
    #
    # Cuelga de /api/v1/comentarios y NO de /api/v1/moderacion, que es lo que
    # habria salido de forma natural del nombre. El motivo esta unas lineas
    # mas abajo: la regex de metricas ya se queda con /api/v1/moderacion. Dos
    # servicios compartiendo prefijo se puede forzar con `^~`, pero deja una
    # trampa para el siguiente que anada una ruta y no entienda por que acaba
    # en el servicio equivocado.
    location /api/v1/comentarios {
        set $destino srv-comentarios:8081;
        proxy_pass http://$destino;
    }
    # /api/v1/correos NO se expone: correo es un servicio entre servicios
    # (lo llama ms-identidad dentro de la red de compose con su credencial,
    # ADR-005). Desde fuera cae en el 404 de "prefijo sin servicio".
    location /api/v1/lista-negra {
        set $destino srv-moderacion-sanciones:8086;
        proxy_pass http://$destino;
    }
    location /api/v1/sanciones {
        set $destino srv-moderacion-sanciones:8086;
        proxy_pass http://$destino;
    }
    # HU-USR-006/007: apelaciones (del jugador y del panel de revision).
    location /api/v1/apelaciones {
        set $destino srv-moderacion-sanciones:8086;
        proxy_pass http://$destino;
    }
    # M13 torneos (HU-TOR-001..005, HU-ADM-005).
    location /api/v1/torneos {
        set $destino srv-torneos:8083;
        proxy_pass http://$destino;
    }
    # HU-ADM-001: parametros del sistema (lectura publica, cambio con token).
    location /api/v1/parametros {
        set $destino srv-admin-parametros:8088;
        proxy_pass http://$destino;
    }
    location ~ ^/api/v1/(latencia|disponibilidad|consultas|degradacion|tecnicas|moderacion) {
        set $destino srv-metricas-plataforma:8087;
        proxy_pass http://$destino;
    }

    # ------------------------------------------------------------- Cuentas
    # `^~` NO es decoracion: es lo unico que hace funcionar esta regla.
    #
    # El comentario que habia aqui hasta R8.4 decia que bastaba con declarar
    # esta `location` ANTES de la regex de /admin. Eso es falso, y el arreglo
    # del 2026-09-17 que se apoyaba en ello nunca funciono. El orden de
    # precedencia de nginx es:
    #
    #   1. `=`        coincidencia exacta, gana sobre todo
    #   2. `^~`       prefijo mas largo; si gana, NO se evaluan las regex
    #   3. `~` `~*`   regex, en orden de aparicion, la primera que case
    #   4. prefijo    el mas largo memorizado, solo si ninguna regex caso
    #
    # Un prefijo simple (paso 4) se evalua DESPUES de todas las regex, asi que
    # `location ~ ^/api/v1/(auth|perfiles|rbac|admin)` de mas abajo ganaba
    # siempre, estuviera donde estuviera este bloque. Comprobado en vivo contra
    # 35.168.124.119 el 2026-09-22: la peticion salia con el 404 de Spring de
    # **ms-identidad** ("No static resource api/v1/admin/auditoria"), no con el
    # 401 de ms-cumplimiento. La vista `cuentas/auditoria.js` llevaba rota
    # desde entonces, dandose por arreglada.
    #
    # Con `^~` el prefijo gana en el paso 2 y nginx ni mira las regex.
    #
    # Cubre las dos rutas que publica ms-cumplimiento (AuditLogController):
    # GET /api/v1/admin/auditoria y POST /api/v1/admin/auditoria/eventos.
    location ^~ /api/v1/admin/auditoria {
        set $destino srv-ms-cumplimiento:8091;
        proxy_pass http://$destino;
    }

    # El estado de los diecisiete servicios lo sirve metricas-plataforma, que
    # es quien ya tiene las sondas de salud. Mismo motivo y misma forma que
    # /api/v1/admin/auditoria: `^~` para ganar en el paso 2 de nginx, porque
    # un prefijo simple se evaluaria DESPUES de la regex de /admin de abajo y
    # esta consulta acabaria en ms-identidad con un 404 de Spring.
    location ^~ /api/v1/admin/sistema {
        set $destino srv-metricas-plataforma:8087;
        proxy_pass http://$destino;
    }

    # ms-identidad: login, registro, perfiles, RBAC y administracion de
    # cuentas y usuarios.
    location ~ ^/api/v1/(auth|perfiles|rbac|admin) {
        set $destino srv-ms-identidad:8089;
        proxy_pass http://$destino;
    }

    # ms-finanzas: creditos del jugador e historial de transacciones.
    location ~ ^/api/v1/(creditos|transacciones) {
        set $destino srv-ms-finanzas:8093;
        proxy_pass http://$destino;
    }

    # R8.4 — /api/v1/cofres no tenia `location` NINGUNA, y no constaba en
    # ningun issue.
    #
    # `frontend/app-web/src/cuentas/mis-cofres.js` pide GET /api/v1/cofres/mios
    # y ms-finanzas lo publica (MisCofresController, con context-path /api/v1),
    # pero el borde no lo enrutaba: la peticion caia en el 404 generico de
    # "prefijo sin servicio" de mas abajo. La vista Mis cofres estaba rota por
    # enrutado, no por el servicio.
    #
    # Va como prefijo simple y no dentro de la regex de arriba a proposito: es
    # un prefijo propio del contrato de creditos y merece leerse como tal.
    # Mientras ms-finanzas no quepa en el host de dev respondera 502, que es
    # honesto —el servicio no esta— y distinto del 404 de antes, que mentia
    # diciendo que la ruta no existe.
    location /api/v1/cofres {
        set $destino srv-ms-finanzas:8093;
        proxy_pass http://$destino;
    }

    # ms-subastas: listado, publicacion y pujas.
    location ~ ^/api/v1/(subastas|mis-pujas) {
        set $destino srv-ms-subastas:8092;
        proxy_pass http://$destino;
    }

    # ms-ecommerce: vitrina y carrito. Es el unico servicio con un
    # context-path que NO es /api/v1 (declara /ecommerce), asi que aqui si
    # hay que reescribir la ruta para que el navegador siga hablando /api/v1
    # como con todos los demas (regla 2).
    #
    # El `proxy_pass` NO lleva la ruta: cuando el destino es una variable y
    # ademas se escribe una URI, nginx manda ESA URI tal cual y tira el resto
    # de la peticion. Asi estaba hasta hoy, y por eso
    # `POST /api/v1/carrito/items` llegaba al servicio como
    # `POST /ecommerce/api/v1/carrito` —sin `/items`—, que no acepta POST:
    # anadir al carrito nunca funciono a traves del borde. Comprobado en
    # pruebas/, no deducido del manual.
    #
    # Con `rewrite ... break` la ruta se reescribe antes y el `proxy_pass`
    # manda lo reescrito, sufijo incluido. Los parametros de consulta se
    # conservan solos (la sustitucion no lleva `?`).
    location /api/v1/carrito {
        set $destino srv-ms-ecommerce:8090;
        rewrite ^/api/v1/carrito(.*)$ /ecommerce/api/v1/carrito$1 break;
        proxy_pass http://$destino;
    }

    # R16 — la vitrina de la tienda, con prefijo propio.
    #
    # Hasta R16 se publicaba como `GET /api/v1/productos`, colada en el prefijo
    # del catalogo por un reparto por metodo (#421, ver la seccion Contenido).
    # Desde ecommerce-carrito.yaml 1.2.0 ms-ecommerce la sirve en
    # /ecommerce/api/v1/vitrina, publica y paginada, y ya no lee una tabla
    # propia que nacia vacia: proyecta el catalogo maestro de
    # contenido/productos, y solo lo que se vende en dinero real.
    #
    # Mismo patron que /api/v1/carrito, y por los mismos dos motivos. El
    # context-path /ecommerce obliga a reescribir para que el navegador siga
    # hablando /api/v1 (regla 2). Y el `proxy_pass` va SIN ruta: con variable Y
    # uri, nginx manda esa uri tal cual y tira el resto de la peticion, que es
    # el defecto que dejaba `POST /api/v1/carrito/items` sin su `/items`. Con
    # `rewrite ... break` sale lo reescrito, sufijo incluido.
    #
    # Aqui la consulta pesa mas que en el carrito: `page`, `size` y `tipo`
    # viajan en ella. La sustitucion no lleva `?`, asi que nginx la conserva
    # sola; si se perdiera, la tienda ensenaria siempre la primera pagina.
    # pruebas/comprobar-rutas.sh lo fija con `?page=0`.
    location /api/v1/vitrina {
        set $destino srv-ms-ecommerce:8090;
        rewrite ^/api/v1/vitrina(.*)$ /ecommerce/api/v1/vitrina$1 break;
        proxy_pass http://$destino;
    }

    # ----------------------------------------------------------- Contenido
    # Viven en su propio host (instancia nexus-contenido-dev, IP fija
    # 34.193.90.11, docker-compose.contenido.yml los publica en 8101-8104), no
    # en la red de Compose de este borde: por eso el destino es IP:puerto y no
    # el nombre de contenedor. Ver Boveda/06-proyecto/enlaces.md del grupo 2.
    location ~ ^/api/v1/(heroes|equipos|estrategias|progresion) {
        set $destino 34.193.90.11:8101;
        proxy_pass http://$destino;
    }
    location /api/v1/inventario {
        set $destino 34.193.90.11:8102;
        proxy_pass http://$destino;
    }
    # Catalogo de productos. No confundir con /api/v1/products (en ingles),
    # que es el hilo de comentarios de plataforma y ya esta mas arriba.
    #
    # El prefijo ENTERO es de contenido/productos, para todos los metodos:
    # el listado `GET /api/v1/productos`, el alta `POST`, `GET /{id}`,
    # `/estadisticas` y lo que publique despues. Un prefijo, un dueno.
    #
    # COLISION DE PREFIJO RESUELTA (#421). Hasta R16 dos servicios de equipos
    # distintos declaraban esta ruta:
    #
    #   contenido/productos   POST /api/v1/productos              (alta en el catalogo)
    #                         GET  /api/v1/productos/{id}
    #                         GET  /api/v1/productos/estadisticas
    #   cuentas/ms-ecommerce  GET  /api/v1/productos              (vitrina, Page de Spring)
    #                         ...bajo su context-path /ecommerce
    #
    # y el borde los separaba con dos `map $request_method` y una `location =`
    # exacta: el GET sin sufijo iba a la vitrina, el resto al catalogo. Era una
    # CAPA DE ADAPTACION (riesgo #3 del project charter), no una decision de
    # contrato, y tenia la trampa que ya anunciaba su propio comentario: el dia
    # que contenido/productos publicara su listado, el borde se lo comeria y
    # se lo daria a otro servicio. Ademas era nginx decidiendo la semantica de
    # una ruta por el metodo, algo que ningun contrato decia.
    #
    # La decision queda escrita en los contratos, contract-first (R16, a la
    # espera de la validacion de los equipos duenos, avisados en #684 y #687):
    #
    #   - productos.yaml 1.2.0 (#687): contenido/productos publica
    #     `GET /api/v1/productos`, el listado publico y paginado del catalogo
    #     maestro. Todo /api/v1/productos es suyo.
    #   - ecommerce-carrito.yaml 1.2.0: la vitrina se muda a /api/v1/vitrina
    #     (mas arriba, en Cuentas) y proyecta ese mismo catalogo. Su antiguo
    #     `GET /productos` sigue dentro de ms-ecommerce, deprecado, y el borde
    #     ya no lo publica.
    #
    # Por eso aqui ya no hay reparto por metodo, ni `location =`, ni `map`:
    # una sola `location` de prefijo, como inventario. pruebas/comprobar-rutas.sh
    # fija el reparto nuevo con trafico (GET y POST exactos y /{id} al catalogo)
    # y falla si alguien vuelve a repartir por `$request_method`.
    location /api/v1/productos {
        set $destino 34.193.90.11:8103;
        proxy_pass http://$destino;
    }

    # Prefijo sin dueno registrado: 404 con problem details minimo, en vez
    # de dejar que el navegador reciba el HTML del login.
    location /api/ {
        default_type application/problem+json;
        return 404 '{"type":"about:blank","title":"Ruta sin servicio en el borde","status":404,"detail":"Ningun servicio registrado en borde-dev.conf atiende este prefijo."}';
    }

    # ---------------------------------------------------------- WebSocket
    location /ws/notificaciones {
        set $destino_ws srv-notificaciones:8085;
        proxy_pass http://$destino_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $conexion_mejora;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /ws {
        set $destino_ws srv-salas-partidas:8084;
        proxy_pass http://$destino_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $conexion_mejora;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # STOMP manda heartbeats; sin esto nginx corta la conexion inactiva a los 60 s.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ------------------------------------------------------------ Mailpit
    # MP_WEBROOT=/mailpit en docker-compose.deploy.yml.
    location /mailpit/ {
        set $destino mailpit:8025;
        proxy_pass http://$destino;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $conexion_mejora;
        proxy_set_header Host $host;
    }
}
