# Montón real de cada JVM en el host de dev (R16.5).
#
# ## Por que existe
#
# `docker stats` dice cuanta RAM usa cada contenedor, pero no por que. En el
# host de plataforma las JVM corren con `-XX:MaxRAMPercentage=70` sobre un
# techo de 384 MiB: el montón puede crecer hasta ~269 MiB y, sin presion, la
# JVM no tiene motivo para devolver nada. `medir-memoria-servicios.yml` ya lo
# vio en un runner: el reposo sale IGUAL al techo, sea cual sea el techo.
#
# Para decidir cuanto montón necesita de verdad cada servicio hace falta el
# dato que ningun diagnostico mide: **cuanto ocupa lo vivo despues de un GC
# completo**. Este workflow lo mide en el host real, contenedor por
# contenedor, sin tocar ninguna configuracion:
#
#   1. RSS del contenedor antes (docker stats);
#   2. `jcmd GC.run` -> un GC completo (pausa de milisegundos);
#   3. montón usado/comprometido y metaspace tras el GC (`jcmd GC.heap_info`);
#   4. techo de montón con el que arranco (`jcmd VM.flags`);
#   5. RSS del contenedor despues.
#
# La diferencia entre (1) y (5) es memoria que la JVM tenia retenida sin
# necesitarla; (3) es lo que de verdad hay que dejarle.
#
# No cambia nada del despliegue. Solo mira.
name: Medir el montón de las JVM en dev

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  medir:
    name: Montón vivo por servicio en el host de plataforma
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 10
    steps:
      - name: Medir por SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST_DEV }}
          username: ${{ secrets.SSH_USER_DEV }}
          key: ${{ secrets.SSH_KEY_DEV }}
          command_timeout: 6m
          script: |
            set -u
            echo "============== MEMORIA DEL HOST ANTES =============="
            free -m
            swapon --show 2>/dev/null || true
            echo
            printf '%-28s %10s %10s %12s %14s %12s %18s\n' \
              CONTENEDOR RSS_ANTES RSS_DESPUES HEAP_MAX HEAP_VIVO HEAP_COMPR METASPACE_USO/COMPR
            for c in $(sudo docker ps --format '{{.Names}}' | grep '^srv-' | sort); do
              # Solo contenedores con JVM y con jcmd (imagenes JDK). Las JRE no
              # lo traen: se dice, no se inventa.
              if ! sudo docker exec "$c" sh -c 'command -v jcmd >/dev/null 2>&1'; then
                printf '%-28s %s\n' "$c" "(sin jcmd en la imagen: no se puede medir por dentro)"
                continue
              fi
              # jcmd tiene que correr con el mismo usuario que la JVM.
              uidjvm=$(sudo docker exec "$c" sh -c 'stat -c %u /proc/1 2>/dev/null || echo 0')
              j() { sudo docker exec -u "$uidjvm" "$c" jcmd 1 "$@" 2>/dev/null; }

              antes=$(sudo docker stats --no-stream --format '{{.MemUsage}}' "$c" | awk '{print $1}')
              j GC.run >/dev/null
              sleep 2
              info=$(j GC.heap_info)
              flags=$(j VM.flags)
              despues=$(sudo docker stats --no-stream --format '{{.MemUsage}}' "$c" | awk '{print $1}')

              # Montón: suma de "total" (comprometido) y "used" (vivo) de las
              # generaciones (Serial/Parallel) o de la línea de G1.
              heap=$(echo "$info" | awk '
                /generation|garbage-first heap/ {
                  for (i = 1; i <= NF; i++) {
                    if ($i == "total") { t += $(i+1)+0 }
                    if ($i == "used")  { u += $(i+1)+0 }
                  }
                }
                END { printf "%d %d", u/1024, t/1024 }')
              vivo=$(echo "$heap" | awk '{print $1}')
              compr=$(echo "$heap" | awk '{print $2}')
              meta=$(echo "$info" | awk '/^ *Metaspace/ {
                for (i = 1; i <= NF; i++) {
                  if ($i == "used") u = $(i+1)+0
                  if ($i == "committed,") c = $(i+1)+0
                  if ($i == "committed") c = $(i+1)+0
                }
              } END { printf "%d/%d", u/1024, c/1024 }')
              max=$(echo "$flags" | tr ' ' '\n' | awk -F= '/MaxHeapSize=/ {printf "%d", $2/1048576}')

              printf '%-28s %10s %10s %10sMi %12sMi %10sMi %16sMi\n' \
                "$c" "$antes" "$despues" "${max:-?}" "${vivo:-?}" "${compr:-?}" "${meta:-?}"
            done
            echo
            echo "============== MEMORIA DEL HOST DESPUES =============="
            free -m
            echo
            echo "Lectura: HEAP_VIVO es lo que hay que dejarle a cada servicio (con margen)."
            echo "La diferencia RSS_ANTES -> RSS_DESPUES es memoria retenida sin necesitarla."
