name: CD - Distribucion continua

# HU-CICD-002 (SCRUM-165): construye la imagen Docker de cada servicio de
# plataforma modificado en un push a develop, la publica en GitHub Container
# Registry y la despliega en cadena dev -> test -> produccion. La APROBACION
# de produccion es manual (se configura como regla de proteccion del
# "environment: produccion" en GitHub, Settings > Environments -- no en este
# archivo), pero EJECUTAR el despliegue una vez aprobado no tiene pasos
# manuales (CA-01).
#
# Depende de HU-CICD-001 (ci.yml, PR #175): ese flujo ya valida que el codigo
# compila, pasa pruebas y el analisis estatico antes de llegar a develop.
# Este flujo NO vuelve a correr pruebas: confia en que CI ya paso, porque
# solo se dispara con push a develop (protegido por PR).

on:
  push:
    branches: [develop]
  # Despliegue a demanda de servicios concretos con la version actual de
  # develop (promocion manual, HU-CICD-002): util para levantar un servicio
  # que no cambio en el ultimo push (p. ej. ms-identidad en un host nuevo)
  # o para volver a desplegar tras cambiar secrets/variables del entorno.
  # Se ejecuta desde la rama que tenga este archivo; el tag es el sha corto
  # de ese commit y las imagenes se construyen desde el, igual que en push.
  workflow_dispatch:
    inputs:
      perfil:
        description: "Perfil de despliegue (infrastructure/despliegue/servicios.json). Agrega sus servicios a los que ya corren; no apaga nada. 'ninguno' = usar solo la lista de abajo."
        type: choice
        required: false
        default: ninguno
        options: [ninguno, base, finanzas, auditoria, subastas, tienda]
      servicios:
        description: "Servicios a desplegar, separados por coma (ej: salas-partidas,notificaciones,ms-identidad). Se suma al perfil. Vacio y sin perfil = solo frontend y borde."
        type: string
        required: false
        default: ""
      # El perfil solo sabe encender. En un host donde cabe UN servicio de
      # economia a la vez, sin esto la unica forma de probar el segundo era
      # dejar los dos peleandose por la memoria (24-sep: swap al 100 % y
      # ms-finanzas en 502 sin que ningun healthcheck fallara).
      apagar:
        description: "Servicios a APAGAR en dev ANTES de desplegar, separados por coma (ej: ms-ecommerce). Libera memoria. Conserva el volumen de datos."
        type: string
        required: false
        default: ""
      # HU-CICD-002 CA-02: simulacro de reversion en dev. El servicio indicado
      # (uno de `servicios`) se despliega con la imagen buena pero con
      # SERVER_PORT movido a un puerto que nadie publica (ver desplegar.sh):
      # falla la salud, se escribe ultimo-fallo.txt, corre revertir.sh y se
      # comprueba que volvio el tag estable anterior. Es la unica manera de
      # ejercitar la reversion sin publicar una imagen rota a proposito.
      # Vacio (lo normal) = ningun simulacro; los push nunca lo activan.
      simulacro_reversion:
        description: "SOLO simulacro (HU-CICD-002): nombre de UN servicio de 'servicios' al que se le inyecta un fallo de salud para ejercitar la reversion automatica en dev. Vacio = sin simulacro."
        type: string
        required: false
        default: ""

# Minimo necesario: leer el repo y escribir paquetes (para publicar en ghcr.io).
permissions:
  contents: read
  packages: write
  # Para leer que push se desplego con exito por ultima vez (base del rango,
  # ver "Calcular servicios modificados").
  actions: read
  # Para encender el host si esta apagado, por OIDC y sin claves guardadas.
  # Ver el paso "Asegurar que el host esta encendido" del job de dev.
  id-token: write

# A diferencia de ci.yml, NUNCA cancelamos una corrida de CD a mitad de
# camino: podria dejar un ambiente a medio desplegar.
concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "21"
  JAVA_DISTRIBUTION: "temurin"
  REGISTRO_IMAGENES: "ghcr.io/vortex-play-nexus-battles"

jobs:
  # ---------------------------------------------------------------------
  # Job 1: que servicios de plataforma cambiaron en este push a develop.
  #
  # DECISION DE DISEÃ‘O: esta logica ya existe en ci.yml (job
  # "detectar-servicios"), pero aqui la DUPLICAMOS en vez de extraerla a un
  # job/workflow compartido. Razones:
  #   1) ci.yml compara contra dos casos (push Y pull_request); cd.yml SOLO
  #      se dispara por push a develop, entonces el calculo es mas simple
  #      (un solo caso, sin base de PR) -- extraerlo forzaria a mantener la
  #      rama de PR sin usarla nunca aqui, complejidad sin beneficio real.
  #   2) Un "workflow_call" o "composite action" compartido moveria esta
  #      logica a un tercer archivo, mas dificil de leer de principio a fin
  #      para alguien que recien esta aprendiendo CI/CD (este es un
  #      requisito explicito del equipo: los workflows deben poder leerse
  #      top-to-bottom).
  #   3) ci.yml ya esta fusionado y en uso (PR #175); tocarlo para extraer
  #      esta logica es riesgo innecesario para una rama que ni siquiera
  #      depende de ci.yml en tiempo de ejecucion.
  # Si el equipo prefiere unificarlo mas adelante, es un refactor aislado
  # que no cambia el comportamiento de ningun workflow.
  # ---------------------------------------------------------------------
  detectar-servicios:
    name: Detectar servicios de plataforma modificados
    runs-on: ubuntu-latest
    outputs:
      servicios: ${{ steps.detectar.outputs.servicios }}
      hay_servicios: ${{ steps.detectar.outputs.hay_servicios }}
      # Desplegar por perfil de dominio (reglas de trabajo de plataforma):
      # plataforma y cuentas van al host de plataforma; contenido a su propio
      # host. Cada lista dispara solo el job de despliegue que le toca.
      hay_plataforma: ${{ steps.detectar.outputs.hay_plataforma }}
      hay_contenido: ${{ steps.detectar.outputs.hay_contenido }}
      tag: ${{ steps.detectar.outputs.tag }}
    steps:
      - name: Descargar el repositorio con historial completo
        uses: actions/checkout@v4
        with:
          # Necesitamos el commit anterior para poder diferenciar contra el.
          fetch-depth: 0

      - name: Calcular servicios modificados, su puerto y el tag de esta corrida
        id: detectar
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # 1) Rango a comparar: el commit anterior de la rama contra el actual.
          #    (cd.yml solo corre por push a develop, nunca por pull_request,
          #    asi que a diferencia de ci.yml no hace falta resolver una base de PR).
          BASE="${{ github.event.before }}"
          HEAD="${{ github.sha }}"
          ZERO="0000000000000000000000000000000000000000"
          if [ "$BASE" = "$ZERO" ] || [ -z "$BASE" ]; then
            if git rev-parse "$HEAD^" >/dev/null 2>&1; then
              BASE=$(git rev-parse "$HEAD^")
            else
              BASE="4b825dc642cb6eb9a060e54bf8d69288fbee4904"
            fi
          fi

          # R16 — la base es lo ultimo DESPLEGADO, no el commit anterior.
          #
          # La concurrencia de este flujo (cd-...-develop) deja una corrida en
          # marcha y UNA pendiente; cuando llega otro push, GitHub cancela la
          # pendiente. Con BASE = event.before, lo que traia el push cancelado
          # no se despliega nunca: el siguiente push solo compara contra su
          # propio commit anterior. El 24-sep se perdieron asi, en una hora, la
          # semilla del catalogo (#682) y la validacion del inventario (#685),
          # con todo en verde.
          #
          # Ahora, en un push, la base es el ultimo push de develop cuyo CD
          # termino con exito (si es antepasado de HEAD): el rango cubre los
          # pushes cancelados en medio. Los despliegues a demanda no cuentan:
          # solo levantan los servicios pedidos. Si la consulta falla, se queda
          # el comportamiento de antes.
          if [ "${{ github.event_name }}" = "push" ]; then
            ULTIMO_OK=$(gh run list --repo "${{ github.repository }}" --workflow cd.yml --branch develop \
              --status success --limit 30 --json headSha,event \
              --jq '[.[] | select(.event == "push")][0].headSha // empty' 2>/dev/null || true)
            if [ -n "$ULTIMO_OK" ] && [ "$ULTIMO_OK" != "$HEAD" ] \
              && git merge-base --is-ancestor "$ULTIMO_OK" "$HEAD" 2>/dev/null; then
              if [ "$ULTIMO_OK" != "$BASE" ]; then
                echo "Base = ultimo push desplegado con exito ($ULTIMO_OK), no el commit anterior ($BASE): hubo pushes sin desplegar en medio."
              fi
              BASE="$ULTIMO_OK"
            fi
          fi

          echo "Comparando $BASE..$HEAD"

          # 2) Que servicios existen y donde viven: lo dice el CATALOGO
          #    (infrastructure/despliegue/servicios.json), que es la fuente
          #    unica de verdad del despliegue desde el 23-sep.
          #
          #    Antes esto era una regex fija -- '^services/(plataforma|
          #    contenido)/[^/]+/' -- mas tres bloques escritos a mano para
          #    services/cuentas/*. Cualquier servicio de cuentas sin su bloque
          #    era invisible para el despliegue por mucho que su CI estuviera
          #    en verde: ci.yml si miraba '^services/[^/]+/[^/]+/', las tres
          #    familias. Esa asimetria es la causa raiz de los 502 de
          #    ms-finanzas (HU-PAG-002 #536, HU-JUE-012 #470) y ms-subastas
          #    (#571). El guardian scripts/cd/comprobar-catalogo-servicios.sh
          #    falla el pull request si vuelve a abrirse la brecha.
          CATALOGO="infrastructure/despliegue/servicios.json"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Despliegue a demanda: se fabrica la misma lista de rutas que
            # produciria un push, una por servicio pedido, para reutilizar sin
            # cambios la deteccion de abajo. La ruta de cada nombre sale del
            # CATALOGO, no de un "case" con tres familias escritas a mano: ese
            # case mandaba cualquier nombre desconocido a services/plataforma/,
            # asi que pedir "ms-subastas" generaba
            # services/plataforma/ms-subastas/a-demanda, que no existe, y el
            # servicio se omitia en silencio (issue #571). Un nombre que no
            # este en el catalogo ahora se avisa en voz alta.
            PEDIDOS="${{ inputs.servicios }}"
            PERFIL="${{ inputs.perfil }}"
            if [ -n "$PERFIL" ] && [ "$PERFIL" != "ninguno" ]; then
              if ! jq -e --arg p "$PERFIL" '.perfiles | has($p)' "$CATALOGO" > /dev/null; then
                echo "::error::El perfil '$PERFIL' no existe en $CATALOGO."
                exit 1
              fi
              DEL_PERFIL=$(jq -r --arg p "$PERFIL" '.perfiles[$p] | join(",")' "$CATALOGO")
              echo "Perfil '$PERFIL' -> ${DEL_PERFIL:-(solo frontend y borde)}"
              PEDIDOS=$(echo "$PEDIDOS,$DEL_PERFIL" | tr ',' '\n' | sed '/^$/d' | sort -u | tr '\n' ',')
            fi

            ARCHIVOS=""
            DESCONOCIDOS=""
            for s in $(echo "$PEDIDOS" | tr ',' ' '); do
              ruta_s=$(jq -r --arg s "$s" '.servicios[] | select(.nombre == $s) | .ruta' "$CATALOGO")
              if [ -z "$ruta_s" ]; then
                # Antes esto era un aviso y se seguia adelante. Un aviso en un
                # log de 900 lineas no lo lee nadie, y quien pidio el servicio
                # se queda creyendo que se desplego: es el mismo silencio que
                # tuvo a ms-subastas invisible durante semanas (#571).
                DESCONOCIDOS="$DESCONOCIDOS $s"
                continue
              fi
              ARCHIVOS="$ARCHIVOS $ruta_s/a-demanda"
            done
            if [ -n "$DESCONOCIDOS" ]; then
              echo "::error::No estan en $CATALOGO:$DESCONOCIDOS"
              echo "Servicios que si se pueden pedir:"
              jq -r '.servicios[] | "  - " + .nombre' "$CATALOGO"
              echo "Perfiles disponibles:"
              jq -r '.perfiles | keys[] | "  - " + .' "$CATALOGO"
              exit 1
            fi
            ARCHIVOS=$(echo "$ARCHIVOS" | tr ' ' '\n' | sed '/^$/d')
            echo "Despliegue a demanda de: ${PEDIDOS:-(nada; solo frontend y borde)}"
          else
            ARCHIVOS=$(git diff --name-only "$BASE" "$HEAD")
          fi

          # 3) Un servicio entra en esta corrida si el push (o el despliegue a
          #    demanda) toco algo dentro de su carpeta. Puerto, herramienta de
          #    construccion y clase de host salen del catalogo: aqui ya no hay
          #    ninguna lista escrita a mano que se pueda quedar desfasada.
          MATRIZ="[]"
          while IFS=$'\t' read -r nombre ruta herramienta puerto clase; do
            echo "$ARCHIVOS" | grep -q "^$ruta/" || continue

            # El catalogo puede ir por delante del codigo (servicio declarado
            # que todavia no compila). Se comprueba contra el repositorio de
            # verdad antes de mandarlo a construir.
            if [ "$herramienta" = "gradle" ] && [ ! -f "$ruta/build.gradle" ]; then
              echo "Se omite $ruta: el catalogo dice gradle pero no tiene build.gradle"
              continue
            fi
            if [ "$herramienta" = "maven" ] && [ ! -f "$ruta/pom.xml" ]; then
              echo "Se omite $ruta: el catalogo dice maven pero no tiene pom.xml"
              continue
            fi

            ruta_gradle=""
            if [ "$herramienta" = "gradle" ]; then
              ruta_gradle=":$(echo "$ruta" | tr '/' ':')"
            fi

            MATRIZ=$(echo "$MATRIZ" | jq -c \
              --arg ruta "$ruta" \
              --arg rutaGradle "$ruta_gradle" \
              --arg servicio "$nombre" \
              --arg puerto "$puerto" \
              --arg herramienta "$herramienta" \
              --arg claseHost "$clase" \
              '. + [{ruta:$ruta, rutaGradle:$rutaGradle, servicio:$servicio, puerto:$puerto, herramienta:$herramienta, claseHost:$claseHost}]')
          done < <(jq -r '.servicios[] | [.nombre, .ruta, .herramienta, .puertoHost, .claseHost] | @tsv' "$CATALOGO")

          # 6) Servicios que NO cambiaron pero quedan desactualizados igual.
          #
          #    Un cambio en shared/libs o en buildSrc no toca ninguna carpeta
          #    de services/, asi que hasta hoy no desplegaba nada: ci.yml lo
          #    compilaba y lo probaba entero (job "cambios transversales") y
          #    dev se quedaba con la imagen vieja. Otra forma distinta del
          #    mismo problema de siempre -- verde en integracion continua,
          #    codigo viejo en el entorno -- y mas dificil de ver, porque
          #    ningun servicio "cambio".
          #
          #    Quien consume que NO se escribe aqui: se deduce de los propios
          #    build.gradle, que es donde vive esa verdad. Un servicio depende
          #    de una biblioteca si la declara el mismo, o si la inyecta una
          #    convencion de buildSrc que ese servicio aplica (hoy:
          #    spring-conventions -> plataforma-observabilidad,
          #    seguridad-conventions -> plataforma-seguridad). Un cambio en
          #    buildSrc afecta a todos los modulos Gradle por definicion.
          LIBS_CAMBIADAS=$(echo "$ARCHIVOS" | grep -oE '^shared/libs/[^/]+' | sed 's|shared/libs/||' | sort -u || true)
          CAMBIO_BUILDSRC=$(echo "$ARCHIVOS" | grep -cE '^buildSrc/' || true)

          if [ -n "$LIBS_CAMBIADAS" ] || [ "$CAMBIO_BUILDSRC" -gt 0 ]; then
            echo "Cambio transversal detectado (libs: ${LIBS_CAMBIADAS:-ninguna}; buildSrc: $CAMBIO_BUILDSRC)."
            while IFS=$'\t' read -r nombre ruta herramienta puerto clase; do
              [ "$herramienta" = "gradle" ] || continue
              [ -f "$ruta/build.gradle" ] || continue
              # Ya esta por su propio cambio: no se duplica.
              if echo "$MATRIZ" | jq -e --arg s "$nombre" 'any(.[]; .servicio == $s)' > /dev/null; then
                continue
              fi

              afectado=0
              if [ "$CAMBIO_BUILDSRC" -gt 0 ]; then
                afectado=1
              else
                # Bibliotecas que este servicio declara directamente...
                SUYAS=$(grep -oE "project\(':shared:libs:[a-z-]+'\)" "$ruta/build.gradle" \
                  | sed "s|project(':shared:libs:||;s|')||" | sort -u)
                # ...mas las que le inyectan las convenciones que aplica.
                for conv in $(grep -oE "id '(nexus\.[a-z-]+)'" "$ruta/build.gradle" | sed "s|id '||;s|'||"); do
                  archivo="buildSrc/src/main/groovy/$conv.gradle"
                  [ -f "$archivo" ] || continue
                  DE_LA_CONVENCION=$(grep -oE "project\(':shared:libs:[a-z-]+'\)" "$archivo" | sed "s|project(':shared:libs:||;s|')||")
                  SUYAS=$(printf '%s\n%s' "$SUYAS" "$DE_LA_CONVENCION")
                done
                for lib in $LIBS_CAMBIADAS; do
                  if echo "$SUYAS" | grep -qx "$lib"; then afectado=1; fi
                done
              fi

              if [ "$afectado" -eq 1 ]; then
                echo "  $nombre se redesplegaria: consume una biblioteca que cambio"
                ruta_gradle=":$(echo "$ruta" | tr '/' ':')"
                MATRIZ=$(echo "$MATRIZ" | jq -c \
                  --arg ruta "$ruta" \
                  --arg rutaGradle "$ruta_gradle" \
                  --arg servicio "$nombre" \
                  --arg puerto "$puerto" \
                  --arg herramienta "$herramienta" \
                  --arg claseHost "$clase" \
                  '. + [{ruta:$ruta, rutaGradle:$rutaGradle, servicio:$servicio, puerto:$puerto, herramienta:$herramienta, claseHost:$claseHost}]')
              fi
            done < <(jq -r '.servicios[] | [.nombre, .ruta, .herramienta, .puertoHost, .claseHost] | @tsv' "$CATALOGO")
          fi

          # 7) Lo que NO cabe en el host de dev. Ya no es una lista escrita
          #    aqui: es el campo "desplegableDev" del catalogo, con su motivo
          #    al lado, medido y fechado (ver infrastructure/despliegue/
          #    CAPACIDAD.md). Medicion del 23-sep en nexus-plataforma-dev:
          #    135 MiB de RAM disponible de 1910, y 1364 de 2047 MiB de swap
          #    ya en uso. Meter otra JVM no "desplegaria un servicio mas":
          #    empujaria a swap a los que sostienen el MVP.
          #
          #    OJO con la diferencia, que es justo lo que se confundia antes:
          #    estar aqui significa "no cabe, decision de capacidad medida",
          #    NO "el pipeline no lo conoce". La imagen se construye y se
          #    publica igual en cada push, y un despliegue a demanda si lo
          #    intenta. Sus pruebas siguen corriendo en ci.yml.
          FUERA_DEL_HOST_DEV=$(jq -r '.servicios[] | select(.desplegableDev == false) | .nombre' "$CATALOGO" | tr '\n' ' ')
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            for fuera in $FUERA_DEL_HOST_DEV; do
              if echo "$MATRIZ" | jq -e --arg s "$fuera" 'any(.[]; .servicio == $s)' > /dev/null; then
                echo "::warning::$fuera cambio, pero no se despliega en el host de dev por capacidad (ver #430); solo se publica su imagen. Para intentarlo igual: despliegue a demanda."
                MATRIZ=$(echo "$MATRIZ" | jq -c --arg s "$fuera" '[.[] | select(.servicio != $s)]')
              fi
            done
          fi

          echo "Servicios a desplegar: $MATRIZ"
          echo "servicios=$MATRIZ" >> "$GITHUB_OUTPUT"

          CANTIDAD=$(echo "$MATRIZ" | jq 'length')
          if [ "$CANTIDAD" -gt 0 ]; then
            echo "hay_servicios=true" >> "$GITHUB_OUTPUT"
          else
            echo "hay_servicios=false" >> "$GITHUB_OUTPUT"
          fi

          # Por dominio: contenido despliega en su propio host (job
          # "desplegar-contenido-dev"); todo lo demas en el de plataforma.
          CONTENIDO=$(echo "$MATRIZ" | jq '[.[] | select(.claseHost == "contenido")] | length')
          PLATAFORMA=$(echo "$MATRIZ" | jq '[.[] | select(.claseHost != "contenido")] | length')
          # El host de plataforma tambien sirve el frontend (borde nginx, ver
          # infrastructure/red-balanceo/borde-dev.conf): un cambio en las
          # vistas, el ui-kit o el propio borde se despliega aunque ningun
          # servicio haya cambiado. Un despliegue a demanda sin servicios
          # hace lo mismo (refresca frontend y borde).
          FRONTEND=$(echo "$ARCHIVOS" | grep -cE '^(frontend/app-web/src/|shared/ui-kit/|infrastructure/red-balanceo/)' || true)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$PLATAFORMA" -eq 0 ] && [ "$CONTENIDO" -eq 0 ]; then FRONTEND=1; fi
          if [ "$CONTENIDO" -gt 0 ]; then echo "hay_contenido=true" >> "$GITHUB_OUTPUT"; else echo "hay_contenido=false" >> "$GITHUB_OUTPUT"; fi
          if [ "$PLATAFORMA" -gt 0 ] || [ "$FRONTEND" -gt 0 ]; then echo "hay_plataforma=true" >> "$GITHUB_OUTPUT"; else echo "hay_plataforma=false" >> "$GITHUB_OUTPUT"; fi

          # TAG unico para toda esta corrida: se usa para nombrar las
          # imagenes en ghcr.io y para saber que version desplegar despues.
          echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  # Job 2: por cada servicio modificado, compila SOLO el jar ejecutable
  # (nada de pruebas ni Sonar: eso ya lo hizo ci.yml antes de que esto
  # llegara a develop), construye su imagen Docker y la publica en ghcr.io.
  # ---------------------------------------------------------------------
  construir-y-publicar:
    name: Construir y publicar - ${{ matrix.servicio }}
    needs: detectar-servicios
    if: needs.detectar-servicios.outputs.hay_servicios == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detectar-servicios.outputs.servicios) }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          # setup-java cachea segun la herramienta de este servicio de la
          # matriz (gradle o maven) -- mismo patron que ci.yml.
          cache: ${{ matrix.herramienta }}

      # -------------------- Rama Gradle (servicios de plataforma) --------------------

      - name: (Gradle) Dar permiso de ejecucion al wrapper
        if: matrix.herramienta == 'gradle'
        run: chmod +x ./gradlew

      # bootJar (del plugin de Spring Boot, ya aplicado por
      # buildSrc/nexus.spring-conventions.gradle) genera el jar ejecutable
      # en <servicio>/build/libs/*.jar -- exactamente lo que cada
      # Dockerfile espera copiar (COPY build/libs/*.jar app.jar).
      - name: (Gradle) Compilar el jar ejecutable del servicio
        if: matrix.herramienta == 'gradle'
        run: ./gradlew ${{ matrix.rutaGradle }}:bootJar --no-daemon

      # -------------------- Rama Maven (ms-identidad, cuentas) --------------------
      # ms-identidad es un proyecto Maven independiente con su propio
      # wrapper (igual que en ci.yml), por eso corre parado en su propia
      # carpeta en vez de invocarse desde la raiz como los de Gradle.

      - name: (Maven) Dar permiso de ejecucion al wrapper
        if: matrix.herramienta == 'maven'
        run: chmod +x ${{ matrix.ruta }}/mvnw

      # -DskipTests: ci.yml ya corrio las pruebas antes de que esto llegara
      # a develop: aqui solo empaquetamos. spring-boot-maven-plugin (ya
      # declarado en el pom.xml de ms-identidad) genera el jar ejecutable
      # en target/*.jar en la fase "package" -- lo que su Dockerfile espera
      # copiar (COPY target/*.jar app.jar).
      - name: (Maven) Empaquetar el jar ejecutable del servicio
        if: matrix.herramienta == 'maven'
        working-directory: ${{ matrix.ruta }}
        run: ./mvnw -B package -DskipTests

      - name: Iniciar sesion en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Contexto del build:
      #  - services/plataforma/*: la carpeta del servicio (matrix.ruta), donde
      #    acaba de quedar el jar (build/libs/*.jar en Gradle, target/*.jar
      #    en Maven) y donde vive su Dockerfile.
      #  - services/contenido/*: la RAIZ del monorepo, con -f al Dockerfile
      #    del servicio. Sus Dockerfiles necesitan ver el wrapper de Gradle y
      #    buildSrc (inventario, productos y motor-combate compilan dentro de
      #    la imagen; heroes copia el jar que este job ya compilo).
      - name: Construir la imagen Docker
        run: |
          IMAGEN=${{ env.REGISTRO_IMAGENES }}/nexus-battles-vi-${{ matrix.servicio }}:${{ needs.detectar-servicios.outputs.tag }}
          case "${{ matrix.ruta }}" in
            services/contenido/*)
              docker build -f "${{ matrix.ruta }}/Dockerfile" -t "$IMAGEN" . ;;
            *)
              docker build -t "$IMAGEN" "${{ matrix.ruta }}" ;;
          esac

      - name: Publicar la imagen en ghcr.io
        run: docker push ${{ env.REGISTRO_IMAGENES }}/nexus-battles-vi-${{ matrix.servicio }}:${{ needs.detectar-servicios.outputs.tag }}

  # ---------------------------------------------------------------------
  # Job 3: desplegar en dev. Un solo job (no matrix): conecta UNA vez por
  # SSH y despliega ahi todos los servicios modificados juntos, en vez de
  # abrir una conexion SSH por servicio.
  # ---------------------------------------------------------------------
  desplegar-dev:
    name: Desplegar en Dev
    needs: [detectar-servicios, construir-y-publicar]
    # Solo plataforma y cuentas: los servicios de contenido van al host de
    # contenido (job "desplegar-contenido-dev"), nunca a este. Corre tambien
    # cuando solo cambio el frontend/borde (construir-y-publicar queda
    # omitido, no fallido): de ahi el !cancelled() y la comprobacion del
    # resultado en vez del "needs" implicito.
    if: ${{ !cancelled() && needs.detectar-servicios.outputs.hay_plataforma == 'true' && needs.construir-y-publicar.result != 'failure' }}
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar lista "servicio:puerto" para este ambiente (sin contenido)
        id: lista
        run: |
          LISTA=$(echo '${{ needs.detectar-servicios.outputs.servicios }}' | jq -r '[.[] | select(.claseHost != "contenido") | "\(.servicio):\(.puerto)"] | join(" ")')
          echo "lista=$LISTA" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # El host de dev se apaga todas las noches para no gastar credito, y
      # solo se enciende de lunes a viernes. Ademas, las tareas programadas de
      # GitHub se retrasan horas cuando hay carga y a veces se descartan: el
      # 19 de septiembre el "start" de las 12:00 UTC no llego a ejecutarse, y
      # el despliegue de las 20:15 murio con "dial tcp :22: i/o timeout" tras
      # un minuto de espera, sin decir por que.
      #
      # Un despliegue no deberia depender de que un cron se haya cumplido. Si
      # el host esta apagado se enciende aqui, que es justo lo que hace falta
      # para desplegar y no cuesta nada de mas: la instancia iba a encenderse
      # igual. Si ya esta encendido, este paso no hace nada.
      # ------------------------------------------------------------------
      - name: Asumir el rol de AWS por OIDC (sin claves)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: cd-dev-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      # R9.2 — estas 45 lineas se movieron a una accion local para que el job
      # de contenido pueda usar EXACTAMENTE las mismas. Antes solo las tenia
      # plataforma, y un despliegue de contenido fuera de horario moria con
      # "i/o timeout" sin explicar por que.
      - name: Asegurar que el host esta encendido
        uses: ./.github/actions/asegurar-host-encendido
        with:
          nombre-instancia: nexus-plataforma-dev

      # Se apaga ANTES de copiar y desplegar: el sentido es hacerle sitio en
      # memoria a lo que viene detras, no limpiar despues. El script viaja en
      # el scp de abajo; si todavia no esta en el host, el paso avisa y sigue,
      # que es preferible a abortar un despliegue por esto.
      - name: Apagar servicios para hacer sitio
        if: inputs.apagar != ''
        uses: appleboy/ssh-action@v1.0.3
        env:
          SERVICIOS_APAGAR: ${{ inputs.apagar }}
        with:
          host: ${{ secrets.DEPLOY_HOST_DEV }}
          username: ${{ secrets.SSH_USER_DEV }}
          key: ${{ secrets.SSH_KEY_DEV }}
          envs: SERVICIOS_APAGAR
          script: |
            if [ ! -f /opt/nexus/scripts/cd/apagar.sh ]; then
              echo "::warning::/opt/nexus/scripts/cd/apagar.sh todavia no esta en el host; se copia en este despliegue y sirve a partir del siguiente."
              exit 0
            fi
            chmod +x /opt/nexus/scripts/cd/apagar.sh
            SERVICIOS_APAGAR="$SERVICIOS_APAGAR" /opt/nexus/scripts/cd/apagar.sh

      - name: Copiar docker-compose.yml, docker-compose.deploy.yml y el script de despliegue
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST_DEV }}
          username: ${{ secrets.SSH_USER_DEV }}
          key: ${{ secrets.SSH_KEY_DEV }}
          source: "docker-compose.yml,docker-compose.deploy.yml,docker-compose.cuentas.yml,docker-compose.ms-cumplimiento.yml,docker-compose.ms-ecommerce.yml,docker-compose.ms-finanzas.yml,docker-compose.ms-subastas.yml,docker-compose.contenido.yml,infrastructure/despliegue/servicios.json,scripts/cd/desplegar.sh,scripts/cd/asegurar-swap.sh,scripts/cd/apagar.sh,scripts/cd/comprobar-capacidad.sh,scripts/cd/revertir.sh"
          target: "/opt/nexus"
          strip_components: 0

      # El borde (nginx) sirve las vistas y el ui-kit tal cual estan en el
      # repo, con la misma jerarquia de carpetas (las vistas referencian
      # ../../../../../shared/ui-kit): por eso se copia el arbol completo a
      # /opt/nexus/web/ sin recortar componentes. La configuracion del borde
      # viaja en el mismo arbol y desplegar.sh la recarga.
      - name: Copiar frontend, ui-kit y configuracion del borde
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST_DEV }}
          username: ${{ secrets.SSH_USER_DEV }}
          key: ${{ secrets.SSH_KEY_DEV }}
          source: "frontend/app-web/src,shared/ui-kit,infrastructure/red-balanceo/borde-dev.conf"
          target: "/opt/nexus/web"
          strip_components: 0
          overwrite: true

      # Los 16 nombres vienen de .env.example. Los valores reales viven SOLO
      # como secrets de GitHub (nunca en este yml). "envs:" es lo que hace
      # que appleboy/ssh-action los reexporte como variables de entorno
      # DENTRO de la sesion SSH remota, para que desplegar.sh los use al
      # generar el .env efimero del servidor.
      # R16.6 — antes de meter otra JVM, mirar si cabe. El healthcheck de
      # desplegar.sh comprueba si el servicio nuevo contesta, no si al subirlo
      # ha empujado a otro fuera de la RAM. El 24-sep eso costo el entorno
      # entero: ningun healthcheck fallo y aun asi hubo que reiniciar la EC2.
      - name: Compuerta de capacidad (antes)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST_DEV }}
          username: ${{ secrets.SSH_USER_DEV }}
          key: ${{ secrets.SSH_KEY_DEV }}
          script: |
            if [ ! -f /opt/nexus/scripts/cd/comprobar-capacidad.sh ]; then
              echo "::warning::comprobar-capacidad.sh todavia no esta en el host; se copia en este despliegue y sirve a partir del siguiente."
              exit 0
            fi
            chmod +x /opt/nexus/scripts/cd/comprobar-capacidad.sh
            /opt/nexus/scripts/cd/comprobar-capacidad.sh antes

      - name: Desplegar en Dev
        id: desplegar
        # Solo durante un simulacro de reversion el fallo de este step no
        # detiene el job: hacen falta los steps de reversion y comprobacion
        # de abajo. En un push normal sigue como siempre: rojo y se para.
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' && inputs.simulacro_reversion != '' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          TAG: ${{ needs.detectar-servicios.outputs.tag }}
          # Para que el servidor pueda hacer pull de las imagenes privadas de
          # ghcr.io: token de esta corrida (packages:read), no un secreto guardado.
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVICIOS_PUERTOS: ${{ steps.lista.outputs.lista }}
          # HU-CICD-002 CA-02: vacio salvo en el simulacro a demanda.
          SIMULACRO_REVERSION: ${{ inputs.simulacro_reversion }}
          APP_ENV: ${{ secrets.APP_ENV }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          DB_RELACIONAL_URL: ${{ secrets.DB_RELACIONAL_URL }}
          DB_MEMORIA_URL: ${{ secrets.DB_MEMORIA_URL }}
          DIRECTORIO_ACTIVO_URL: ${{ secrets.DIRECTORIO_ACTIVO_URL }}
          # ADR-002: de donde baja la plataforma la clave publica con la que
          # verifica los tokens de usuario. Hoy la publica ms-identidad; el dia
          # que sea Keycloak, cambia esta variable y nada mas.
          IDENTIDAD_JWKS_URL: ${{ vars.IDENTIDAD_JWKS_URL }}
          JWT_CLAVE_PRIVADA: ${{ secrets.JWT_CLAVE_PRIVADA }}
          DIRECTORIO_ACTIVO_CLIENT_ID: ${{ secrets.DIRECTORIO_ACTIVO_CLIENT_ID }}
          DIRECTORIO_ACTIVO_CLIENT_SECRET: ${{ secrets.DIRECTORIO_ACTIVO_CLIENT_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          # Configuracion NO secreta de los servicios de plataforma (nombres
          # de .env.example). Son "variables" del entorno dev, no secrets:
          # URLs internas del compose y origenes CORS. desplegar.sh solo las
          # escribe en el .env si llegan con valor, para que un servicio sin
          # variable conserve el valor por defecto de su application.yml.
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          LISTA_NEGRA_VERIFICAR_URL: ${{ vars.LISTA_NEGRA_VERIFICAR_URL }}
          SALAS_WS_ORIGENES: ${{ vars.SALAS_WS_ORIGENES }}
          CHAT_WS_ORIGENES: ${{ vars.CHAT_WS_ORIGENES }}
          CHAT_HISTORIAL_TAMANO: ${{ vars.CHAT_HISTORIAL_TAMANO }}
          NOTIFICACIONES_WS_ORIGENES: ${{ vars.NOTIFICACIONES_WS_ORIGENES }}
          COMENTARIOS_FORMATOS_IMAGEN: ${{ vars.COMENTARIOS_FORMATOS_IMAGEN }}
          # PENDIENTE (TODO_*): secrets propios de ms-identidad (equipo
          # Cuentas), todavia no creados en GitHub -- ver la validacion de
          # "fallo visible" en desplegar.sh si faltan y ms-identidad esta
          # en esta corrida. SPRING_PROFILES_ACTIVE="dev": no existe
          # application-test.properties (HU-RBAC-005), asi que test tambien
          # activa el perfil "dev" -- usar "test" aqui rompe el despliegue
          # por falta de configuracion de base de datos.
          MS_IDENTIDAD_DB_URL: ${{ secrets.TODO_DB_URL_MS_IDENTIDAD }}
          MS_IDENTIDAD_DB_USER: ${{ secrets.TODO_DB_USER_MS_IDENTIDAD }}
          MS_IDENTIDAD_DB_PASSWORD: ${{ secrets.TODO_DB_PASSWORD_MS_IDENTIDAD }}
          LISTA_NEGRA_URL: ${{ secrets.TODO_LISTA_NEGRA_URL }}
          MS_IDENTIDAD_SPRING_PROFILES_ACTIVE: "dev"
          ADMINS_INICIALES: ${{ secrets.ADMINS_INICIALES }}
          # PENDIENTE (TODO_*): mismo patron de placeholder que ms-identidad
          # -- 5 secrets propios de ms-cumplimiento (equipo Cuentas),
          # todavia no creados en GitHub. Prefijo "MS_CUMPLIMIENTO_" para no
          # chocar con DB_USER/DB_PASS de plataforma ni con el esquema
          # DB_URL de ms-identidad (ver docker-compose.ms-cumplimiento.yml).
          MS_CUMPLIMIENTO_DB_HOST: ${{ vars.MS_CUMPLIMIENTO_DB_HOST }}
          MS_CUMPLIMIENTO_DB_PORT: ${{ vars.MS_CUMPLIMIENTO_DB_PORT }}
          MS_CUMPLIMIENTO_DB_NAME: ${{ vars.MS_CUMPLIMIENTO_DB_NAME }}
          MS_CUMPLIMIENTO_DB_USER: ${{ secrets.MS_CUMPLIMIENTO_DB_USER }}
          MS_CUMPLIMIENTO_DB_PASSWORD: ${{ secrets.MS_CUMPLIMIENTO_DB_PASSWORD }}
          # PENDIENTE (TODO_*): mismo patron de placeholder que los otros dos
          # servicios de Cuentas -- 5 secrets propios de ms-ecommerce,
          # todavia no creados en GitHub. Prefijo "MS_ECOMMERCE_" para no
          # chocar con ningun otro esquema (ver docker-compose.ms-ecommerce.yml).
          # Los cuatro servicios de economia usan nombres definitivos, no
          # marcadores "TODO_": el host, el puerto y el nombre de la base no
          # son secretos -- son el nombre de un contenedor de la propia red de
          # despliegue -- y meterlos en "secrets" solo servia para que nadie
          # pudiera comprobarlos sin permisos de administracion. Credencial
          # (usuario y clave) en secrets; el resto en variables.
          #
          # ms-identidad sigue con sus TODO_*: esta desplegado y funcionando
          # con esos valores, y migrarlo exige conocerlos. Queda anotado en
          # infrastructure/despliegue/CAPACIDAD.md.
          MS_ECOMMERCE_DB_HOST: ${{ vars.MS_ECOMMERCE_DB_HOST }}
          MS_ECOMMERCE_DB_PORT: ${{ vars.MS_ECOMMERCE_DB_PORT }}
          MS_ECOMMERCE_DB_NAME: ${{ vars.MS_ECOMMERCE_DB_NAME }}
          MS_ECOMMERCE_DB_USER: ${{ secrets.MS_ECOMMERCE_DB_USER }}
          MS_ECOMMERCE_DB_PASSWORD: ${{ secrets.MS_ECOMMERCE_DB_PASSWORD }}
          MS_FINANZAS_DB_HOST: ${{ vars.MS_FINANZAS_DB_HOST }}
          MS_FINANZAS_DB_PORT: ${{ vars.MS_FINANZAS_DB_PORT }}
          MS_FINANZAS_DB_NAME: ${{ vars.MS_FINANZAS_DB_NAME }}
          MS_FINANZAS_DB_USER: ${{ secrets.MS_FINANZAS_DB_USER }}
          MS_FINANZAS_DB_PASSWORD: ${{ secrets.MS_FINANZAS_DB_PASSWORD }}
          MS_SUBASTAS_DB_HOST: ${{ vars.MS_SUBASTAS_DB_HOST }}
          MS_SUBASTAS_DB_PORT: ${{ vars.MS_SUBASTAS_DB_PORT }}
          MS_SUBASTAS_DB_NAME: ${{ vars.MS_SUBASTAS_DB_NAME }}
          MS_SUBASTAS_DB_USER: ${{ secrets.MS_SUBASTAS_DB_USER }}
          MS_SUBASTAS_DB_PASSWORD: ${{ secrets.MS_SUBASTAS_DB_PASSWORD }}
          # Origenes permitidos del canal STOMP de subastas. NO es un secreto
          # (es la URL publica del borde) pero va por el mismo camino que
          # SALAS_WS_ORIGENES. Vacio = no se acepta ningun origen: el panel de
          # subastas se conectaria y el servidor le cerraria el handshake.
          SUBASTAS_WS_ORIGENES: ${{ vars.SUBASTAS_WS_ORIGENES }}
          SUBASTAS_CORS_ORIGENES: ${{ vars.SUBASTAS_CORS_ORIGENES }}
        with:
          host: ${{ secrets.DEPLOY_HOST_DEV }}
          username: ${{ secrets.SSH_USER_DEV }}
          key: ${{ secrets.SSH_KEY_DEV }}
          envs: GHCR_USER,GHCR_TOKEN,TAG,SERVICIOS_PUERTOS,SIMULACRO_REVERSION,APP_ENV,LOG_LEVEL,DB_RELACIONAL_URL,DB_MEMORIA_URL,DIRECTORIO_ACTIVO_URL,IDENTIDAD_JWKS_URL,JWT_CLAVE_PRIVADA,DIRECTORIO_ACTIVO_CLIENT_ID,DIRECTORIO_ACTIVO_CLIENT_SECRET,SMTP_HOST,DB_USER,DB_PASS,SMTP_PORT,LISTA_NEGRA_VERIFICAR_URL,SALAS_WS_ORIGENES,CHAT_WS_ORIGENES,CHAT_HISTORIAL_TAMANO,NOTIFICACIONES_WS_ORIGENES,COMENTARIOS_FORMATOS_IMAGEN,MS_IDENTIDAD_DB_URL,MS_IDENTIDAD_DB_USER,MS_IDENTIDAD_DB_PASSWORD,LISTA_NEGRA_URL,MS_IDENTIDAD_SPRING_PROFILES_ACTIVE,MS_CUMPLIMIENTO_DB_HOST,MS_CUMPLIMIENTO_DB_PORT,MS_CUMPLIMIENTO_DB_NAME,MS_CUMPLIMIENTO_DB_USER,MS_CUMPLIMIENTO_DB_PASSWORD,MS_ECOMMERCE_DB_HOST,MS_ECOMMERCE_DB_PORT,MS_ECOMMERCE_DB_NAME,MS_ECOMMERCE_DB_USER,MS_ECOMMERCE_DB_PASSWORD,MS_FINANZAS_DB_HOST,MS_FINANZAS_DB_PORT,MS_FINANZAS_DB_NAME,MS_FINANZAS_DB_USER,MS_FINANZAS_DB_PASSWORD,MS_SUBASTAS_DB_HOST,MS_SUBASTAS_DB_PORT,MS_SUBASTAS_DB_NAME,MS_SUBASTAS_DB_USER,MS_SUBASTAS_DB_PASSWORD,SUBASTAS_WS_ORIGENES,SUBASTAS_CORS_ORIGENES,ADMINS_INICIALES
          script: |
            chmod +x /opt/nexus/scripts/cd/desplegar.sh
            /opt/nexus/scripts/cd/desplegar.sh

      # CA-02 en dev/test: si /actuator/health no pasa, el step de arriba ya
      # termino en error (desplegar.sh hace "exit 1") y este job queda en
      # rojo -- eso automaticamente bloquea "desplegar-test" (depende de
      # este job via needs). No hay reversion automatica en dev/test en un
      # push normal: el diseno acordado con Santiago Gonzalez la reserva
      # para produccion (ver el job "desplegar-produccion" mas abajo).
      #
      # Lo que SI hay es el SIMULACRO a demanda (entrada simulacro_reversion):
      # como produccion no existe todavia (D-08), es la unica forma de
      # ejercitar revertir.sh de verdad -- mismo script, mismo step con el
      # mismo nombre, mismo host donde corre el MVP. Los tres steps de abajo
      # solo existen cuando el simulacro esta activo.
      # El otro lado de la compuerta: el servicio nuevo puede estar sanisimo y
      # aun asi haber dejado al host sin margen. Se mira la memoria Y que el
      # nucleo del MVP siga contestando, que es lo que el 24-sep nadie miro.
      - name: Compuerta de capacidad (despues)
        id: capacidad_despues
        if: steps.desplegar.outcome == 'success'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST_DEV }}
          username: ${{ secrets.SSH_USER_DEV }}
          key: ${{ secrets.SSH_KEY_DEV }}
          script: |
            if [ ! -f /opt/nexus/scripts/cd/comprobar-capacidad.sh ]; then
              echo "::warning::comprobar-capacidad.sh todavia no esta en el host; sirve a partir del siguiente despliegue."
              exit 0
            fi
            /opt/nexus/scripts/cd/comprobar-capacidad.sh despues

      # Si la compuerta de despues salta, se apaga lo que acaba de subir. Se
      # revierte el servicio nuevo, nunca el MVP: esa es la regla de
      # CAPACIDAD.md, y hasta ahora habia que aplicarla a mano por SSH.
      - name: Apagar lo recien desplegado si el host quedo sin margen
        if: failure() && steps.capacidad_despues.outcome == 'failure' && inputs.servicios != ''
        uses: appleboy/ssh-action@v1.0.3
        env:
          SERVICIOS_APAGAR: ${{ inputs.servicios }}
        with:
          host: ${{ secrets.DEPLOY_HOST_DEV }}
          username: ${{ secrets.SSH_USER_DEV }}
          key: ${{ secrets.SSH_KEY_DEV }}
          envs: SERVICIOS_APAGAR
          script: |
            echo "La compuerta de capacidad salto: se apaga lo que se acaba de desplegar."
            chmod +x /opt/nexus/scripts/cd/apagar.sh
            SERVICIOS_APAGAR="$SERVICIOS_APAGAR" /opt/nexus/scripts/cd/apagar.sh
            /opt/nexus/scripts/cd/comprobar-capacidad.sh despues || true

      - name: Reversion automatica por fallo de salud
        if: github.event_name == 'workflow_dispatch' && inputs.simulacro_reversion != '' && steps.desplegar.outcome == 'failure'
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Por si la imagen del tag estable ya no esta en el host y hay que
          # bajarla de ghcr.io: mismo token de la corrida que usa desplegar.sh.
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST_DEV }}
          username: ${{ secrets.SSH_USER_DEV }}
          key: ${{ secrets.SSH_KEY_DEV }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            chmod +x /opt/nexus/scripts/cd/revertir.sh
            /opt/nexus/scripts/cd/revertir.sh

      # La reversion no vale nada si no se comprueba: el contenedor tiene que
      # estar corriendo el tag estable ANTERIOR (no el de esta corrida) y su
      # /actuator/health tiene que volver a estar UP en su puerto de siempre.
      - name: Comprobar que el servicio volvio al tag estable y esta sano
        if: github.event_name == 'workflow_dispatch' && inputs.simulacro_reversion != '' && steps.desplegar.outcome == 'failure'
        uses: appleboy/ssh-action@v1.0.3
        env:
          SIMULACRO_REVERSION: ${{ inputs.simulacro_reversion }}
          TAG: ${{ needs.detectar-servicios.outputs.tag }}
          SERVICIOS_PUERTOS: ${{ steps.lista.outputs.lista }}
        with:
          host: ${{ secrets.DEPLOY_HOST_DEV }}
          username: ${{ secrets.SSH_USER_DEV }}
          key: ${{ secrets.SSH_KEY_DEV }}
          envs: SIMULACRO_REVERSION,TAG,SERVICIOS_PUERTOS
          script: |
            set -euo pipefail
            cd /opt/nexus
            servicio="$SIMULACRO_REVERSION"
            esperado=$(cat "ultimo-tag-estable-${servicio}.txt")
            actual=$(docker inspect --format '{{.Config.Image}}' "srv-${servicio}" | sed 's/^.*://')
            echo "tag de la corrida (fallido): $TAG | tag estable esperado: $esperado | tag que corre ahora: $actual"
            if [ "$actual" != "$esperado" ] || [ "$actual" = "$TAG" ]; then
              echo "La reversion NO dejo el tag estable anterior."; exit 1
            fi
            puerto=""
            for par in $SERVICIOS_PUERTOS; do
              if [ "${par%%:*}" = "$servicio" ]; then puerto="${par##*:}"; fi
            done
            for intento in $(seq 1 36); do
              if curl -fsS "http://localhost:${puerto}/actuator/health" | grep -q '"status":"UP"'; then
                echo "srv-${servicio} (puerto $puerto) volvio a estar UP en el intento $intento con el tag $actual"
                echo "ultimo-fallo.txt registro el fallo: $(grep "^${servicio}:" ultimo-fallo.txt || echo '(sin linea)')"
                exit 0
              fi
              sleep 5
            done
            echo "srv-${servicio} no volvio a estar sano tras la reversion"; exit 1

      # Veredicto: un simulacro solo se supera si el fallo inyectado se
      # detecto. Si el despliegue paso la salud con SERVER_PORT movido, el
      # healthcheck no esta mirando donde cree, y eso es un defecto del CD.
      - name: Veredicto del simulacro de reversion
        if: github.event_name == 'workflow_dispatch' && inputs.simulacro_reversion != ''
        run: |
          if [ "${{ steps.desplegar.outcome }}" != "failure" ]; then
            echo "::error::El simulacro no provoco ningun fallo de salud: el healthcheck de desplegar.sh no detecto SERVER_PORT movido. Revisar el paso 4 del script."
            exit 1
          fi
          echo "Simulacro superado: fallo de salud detectado, reversion ejecutada y comprobada (ver los dos steps anteriores)."

  # ---------------------------------------------------------------------
  # Job 3b: dev de CONTENIDO, en el host propio del dominio. Mismo script
  # (desplegar.sh), mismos compose, mismo TAG; solo cambian el host y la
  # llave (secrets *_CONTENIDO_DEV del entorno "dev"). Lo pide el propio
  # documento de plataforma ("desplegar por perfil de dominio, no los 20
  # servicios a la vez") y lo motiva el tamano del host de plataforma
  # (t3.small, 2 GiB): con nueve servicios, el borde y dos bases encima, ahi
  # no caben 20 JVM. Los servicios de contenido solo
  # leen variables propias (URIs de Mongo internas, URLs entre servicios
  # del mismo compose), asi que no necesitan los secrets de aplicacion de
  # plataforma: desplegar.sh los deja vacios en el .env sin fallar.
  # Test y produccion de contenido quedan para cuando exista ese entorno.
  # ---------------------------------------------------------------------
  desplegar-contenido-dev:
    name: Desplegar contenido en Dev
    needs: [detectar-servicios, construir-y-publicar]
    if: needs.detectar-servicios.outputs.hay_contenido == 'true'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar lista "servicio:puerto" (solo contenido)
        id: lista
        run: |
          LISTA=$(echo '${{ needs.detectar-servicios.outputs.servicios }}' | jq -r '[.[] | select(.claseHost == "contenido") | "\(.servicio):\(.puerto)"] | join(" ")')
          echo "lista=$LISTA" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # R9.2 — este job daba por hecho que el host estaba encendido.
      #
      # Plataforma dejo de darlo por hecho en #433, despues de que el "start"
      # programado del 19 de septiembre no llegara a ejecutarse y el
      # despliegue de esa tarde muriera contra un host apagado. Contenido
      # heredo el mismo cron (R9.3) pero no la correccion: un despliegue de
      # heroes, inventario, productos o motor fuera de horario moria igual,
      # con "dial tcp :22: i/o timeout" y sin decir por que.
      #
      # Ahora los dos hosts pasan por la misma accion. Es idempotente: con el
      # host ya encendido no hace nada y no cuesta un segundo de mas.
      # ------------------------------------------------------------------
      # El host de contenido NO vive en la cuenta de AWS de plataforma: es la
      # instancia nexus-contenido-dev de la cuenta gratuita del grupo 2
      # (infrastructure/entornos/contenido/, IP elastica 34.193.90.11, siempre
      # encendida). El rol OIDC de vars.AWS_ROLE_ARN pertenece a la otra cuenta,
      # asi que buscar ahi la instancia por etiqueta fallaba siempre ("No existe
      # ninguna instancia con la etiqueta Name=nexus-contenido-dev", corridas del
      # 23-sep 05:59, 12:22, 15:58 y 19:47) y ningun despliegue de contenido
      # volvia a salir. Los dos pasos corren solo si alguien configura un rol
      # OIDC en la cuenta del grupo 2 (vars.AWS_ROLE_ARN_CONTENIDO); mientras
      # tanto se omiten y el job sigue como antes de R9.2.
      - name: Asumir el rol de AWS del grupo 2 por OIDC (sin claves)
        if: vars.AWS_ROLE_ARN_CONTENIDO != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_CONTENIDO }}
          role-session-name: cd-contenido-dev-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION_CONTENIDO || 'us-east-1' }}

      - name: Asegurar que el host de contenido esta encendido
        if: vars.AWS_ROLE_ARN_CONTENIDO != ''
        uses: ./.github/actions/asegurar-host-encendido
        with:
          nombre-instancia: nexus-contenido-dev

      - name: Copiar los compose y el script de despliegue al host de contenido
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST_CONTENIDO_DEV }}
          username: ${{ secrets.SSH_USER_CONTENIDO_DEV }}
          key: ${{ secrets.SSH_KEY_CONTENIDO_DEV }}
          source: "docker-compose.yml,docker-compose.deploy.yml,docker-compose.contenido.yml,infrastructure/despliegue/servicios.json,scripts/cd/desplegar.sh,scripts/cd/asegurar-swap.sh,scripts/cd/apagar.sh,scripts/cd/comprobar-capacidad.sh"
          target: "/opt/nexus"
          strip_components: 0

      - name: Desplegar contenido en Dev
        id: desplegar
        uses: appleboy/ssh-action@v1.0.3
        env:
          TAG: ${{ needs.detectar-servicios.outputs.tag }}
          # Para que el servidor pueda hacer pull de las imagenes privadas de
          # ghcr.io: token de esta corrida (packages:read), no un secreto guardado.
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVICIOS_PUERTOS: ${{ steps.lista.outputs.lista }}
          APP_ENV: dev
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          # R9.7 — los cuatro servicios de contenido validan tokens de
          # ms-identidad (ADR-002 / ADR-005). Pero vars.IDENTIDAD_JWKS_URL vale
          # http://srv-ms-identidad:8089/..., el nombre de contenedor de la red
          # de Compose del host de plataforma, que en el host de contenido no
          # resuelve: con ese valor los cuatro servicios rechazaban TODOS los
          # tokens (UnknownHost al bajar el JWKS; corridas 1b489c7 y 5d76926).
          # Este job reparte una variable propia; vacia, docker-compose.contenido.yml
          # cae a su valor por omision, la URL publica del emisor por su IP
          # elastica. El dia que el emisor cambie de sitio se fija
          # vars.IDENTIDAD_JWKS_URL_CONTENIDO con la URL alcanzable desde fuera.
          IDENTIDAD_JWKS_URL: ${{ vars.IDENTIDAD_JWKS_URL_CONTENIDO }}
        with:
          host: ${{ secrets.DEPLOY_HOST_CONTENIDO_DEV }}
          username: ${{ secrets.SSH_USER_CONTENIDO_DEV }}
          key: ${{ secrets.SSH_KEY_CONTENIDO_DEV }}
          envs: GHCR_USER,GHCR_TOKEN,TAG,SERVICIOS_PUERTOS,APP_ENV,LOG_LEVEL,IDENTIDAD_JWKS_URL
          script: |
            chmod +x /opt/nexus/scripts/cd/desplegar.sh
            /opt/nexus/scripts/cd/desplegar.sh

  # ---------------------------------------------------------------------
  # Job 4: test. Espera a que dev termine y haya pasado salud (needs).
  #
  # Solo corre si la variable de repositorio HAY_ENTORNO_TEST vale "true".
  # La cuenta AWS de la empresa (Free Plan, USD 0 de bolsillo; ver
  # infrastructure/entornos/plataforma/README.md) tiene UN host de dev y
  # ningun host de test: sin esta condicion, cada corrida terminaba en rojo
  # despues de un dev correcto, y ese rojo tapa los fallos reales. Cuando
  # exista un host de test, se crea la variable y sus secrets *_TEST, sin
  # tocar este archivo. Produccion depende de test (needs), asi que queda
  # omitida en cadena.
  # ---------------------------------------------------------------------
  desplegar-test:
    name: Desplegar en Test
    needs: [detectar-servicios, construir-y-publicar, desplegar-dev]
    if: needs.detectar-servicios.outputs.hay_servicios == 'true' && vars.HAY_ENTORNO_TEST == 'true'
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar lista "servicio:puerto" para este ambiente
        id: lista
        run: |
          LISTA=$(echo '${{ needs.detectar-servicios.outputs.servicios }}' | jq -r '[.[] | "\(.servicio):\(.puerto)"] | join(" ")')
          echo "lista=$LISTA" >> "$GITHUB_OUTPUT"

      - name: Copiar docker-compose.yml, docker-compose.deploy.yml y el script de despliegue
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST_TEST }}
          username: ${{ secrets.SSH_USER_TEST }}
          key: ${{ secrets.SSH_KEY_TEST }}
          source: "docker-compose.yml,docker-compose.deploy.yml,docker-compose.cuentas.yml,docker-compose.ms-cumplimiento.yml,docker-compose.ms-ecommerce.yml,docker-compose.ms-finanzas.yml,docker-compose.ms-subastas.yml,docker-compose.contenido.yml,infrastructure/despliegue/servicios.json,scripts/cd/desplegar.sh,scripts/cd/asegurar-swap.sh,scripts/cd/apagar.sh,scripts/cd/comprobar-capacidad.sh"
          target: "/opt/nexus"
          strip_components: 0

      - name: Desplegar en Test
        id: desplegar
        uses: appleboy/ssh-action@v1.0.3
        env:
          TAG: ${{ needs.detectar-servicios.outputs.tag }}
          # Para que el servidor pueda hacer pull de las imagenes privadas de
          # ghcr.io: token de esta corrida (packages:read), no un secreto guardado.
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVICIOS_PUERTOS: ${{ steps.lista.outputs.lista }}
          APP_ENV: ${{ secrets.APP_ENV }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          DB_RELACIONAL_URL: ${{ secrets.DB_RELACIONAL_URL }}
          DB_MEMORIA_URL: ${{ secrets.DB_MEMORIA_URL }}
          DIRECTORIO_ACTIVO_URL: ${{ secrets.DIRECTORIO_ACTIVO_URL }}
          # ADR-002: de donde baja la plataforma la clave publica con la que
          # verifica los tokens de usuario. Hoy la publica ms-identidad; el dia
          # que sea Keycloak, cambia esta variable y nada mas.
          IDENTIDAD_JWKS_URL: ${{ vars.IDENTIDAD_JWKS_URL }}
          JWT_CLAVE_PRIVADA: ${{ secrets.JWT_CLAVE_PRIVADA }}
          DIRECTORIO_ACTIVO_CLIENT_ID: ${{ secrets.DIRECTORIO_ACTIVO_CLIENT_ID }}
          DIRECTORIO_ACTIVO_CLIENT_SECRET: ${{ secrets.DIRECTORIO_ACTIVO_CLIENT_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          # PENDIENTE (TODO_*): ver el mismo comentario en el job "Desplegar
          # en Dev" -- misma logica. SPRING_PROFILES_ACTIVE="dev" tambien
          # aqui: no existe application-test.properties (HU-RBAC-005).
          MS_IDENTIDAD_DB_URL: ${{ secrets.TODO_DB_URL_MS_IDENTIDAD }}
          MS_IDENTIDAD_DB_USER: ${{ secrets.TODO_DB_USER_MS_IDENTIDAD }}
          MS_IDENTIDAD_DB_PASSWORD: ${{ secrets.TODO_DB_PASSWORD_MS_IDENTIDAD }}
          LISTA_NEGRA_URL: ${{ secrets.TODO_LISTA_NEGRA_URL }}
          MS_IDENTIDAD_SPRING_PROFILES_ACTIVE: "dev"
          ADMINS_INICIALES: ${{ secrets.ADMINS_INICIALES }}
          # PENDIENTE (TODO_*): ver el mismo comentario en el job "Desplegar
          # en Dev" -- misma logica para los 5 secrets de ms-cumplimiento.
          MS_CUMPLIMIENTO_DB_HOST: ${{ vars.MS_CUMPLIMIENTO_DB_HOST }}
          MS_CUMPLIMIENTO_DB_PORT: ${{ vars.MS_CUMPLIMIENTO_DB_PORT }}
          MS_CUMPLIMIENTO_DB_NAME: ${{ vars.MS_CUMPLIMIENTO_DB_NAME }}
          MS_CUMPLIMIENTO_DB_USER: ${{ secrets.MS_CUMPLIMIENTO_DB_USER }}
          MS_CUMPLIMIENTO_DB_PASSWORD: ${{ secrets.MS_CUMPLIMIENTO_DB_PASSWORD }}
          # PENDIENTE (TODO_*): ver el mismo comentario en el job "Desplegar
          # en Dev" -- misma logica para los 5 secrets de ms-ecommerce.
          # Los cuatro servicios de economia usan nombres definitivos, no
          # marcadores "TODO_": el host, el puerto y el nombre de la base no
          # son secretos -- son el nombre de un contenedor de la propia red de
          # despliegue -- y meterlos en "secrets" solo servia para que nadie
          # pudiera comprobarlos sin permisos de administracion. Credencial
          # (usuario y clave) en secrets; el resto en variables.
          #
          # ms-identidad sigue con sus TODO_*: esta desplegado y funcionando
          # con esos valores, y migrarlo exige conocerlos. Queda anotado en
          # infrastructure/despliegue/CAPACIDAD.md.
          MS_ECOMMERCE_DB_HOST: ${{ vars.MS_ECOMMERCE_DB_HOST }}
          MS_ECOMMERCE_DB_PORT: ${{ vars.MS_ECOMMERCE_DB_PORT }}
          MS_ECOMMERCE_DB_NAME: ${{ vars.MS_ECOMMERCE_DB_NAME }}
          MS_ECOMMERCE_DB_USER: ${{ secrets.MS_ECOMMERCE_DB_USER }}
          MS_ECOMMERCE_DB_PASSWORD: ${{ secrets.MS_ECOMMERCE_DB_PASSWORD }}
          MS_FINANZAS_DB_HOST: ${{ vars.MS_FINANZAS_DB_HOST }}
          MS_FINANZAS_DB_PORT: ${{ vars.MS_FINANZAS_DB_PORT }}
          MS_FINANZAS_DB_NAME: ${{ vars.MS_FINANZAS_DB_NAME }}
          MS_FINANZAS_DB_USER: ${{ secrets.MS_FINANZAS_DB_USER }}
          MS_FINANZAS_DB_PASSWORD: ${{ secrets.MS_FINANZAS_DB_PASSWORD }}
          MS_SUBASTAS_DB_HOST: ${{ vars.MS_SUBASTAS_DB_HOST }}
          MS_SUBASTAS_DB_PORT: ${{ vars.MS_SUBASTAS_DB_PORT }}
          MS_SUBASTAS_DB_NAME: ${{ vars.MS_SUBASTAS_DB_NAME }}
          MS_SUBASTAS_DB_USER: ${{ secrets.MS_SUBASTAS_DB_USER }}
          MS_SUBASTAS_DB_PASSWORD: ${{ secrets.MS_SUBASTAS_DB_PASSWORD }}
          # Origenes permitidos del canal STOMP de subastas. NO es un secreto
          # (es la URL publica del borde) pero va por el mismo camino que
          # SALAS_WS_ORIGENES. Vacio = no se acepta ningun origen: el panel de
          # subastas se conectaria y el servidor le cerraria el handshake.
          SUBASTAS_WS_ORIGENES: ${{ vars.SUBASTAS_WS_ORIGENES }}
          SUBASTAS_CORS_ORIGENES: ${{ vars.SUBASTAS_CORS_ORIGENES }}
        with:
          host: ${{ secrets.DEPLOY_HOST_TEST }}
          username: ${{ secrets.SSH_USER_TEST }}
          key: ${{ secrets.SSH_KEY_TEST }}
          envs: GHCR_USER,GHCR_TOKEN,TAG,SERVICIOS_PUERTOS,APP_ENV,LOG_LEVEL,DB_RELACIONAL_URL,DB_MEMORIA_URL,DIRECTORIO_ACTIVO_URL,IDENTIDAD_JWKS_URL,JWT_CLAVE_PRIVADA,DIRECTORIO_ACTIVO_CLIENT_ID,DIRECTORIO_ACTIVO_CLIENT_SECRET,SMTP_HOST,DB_USER,DB_PASS,MS_IDENTIDAD_DB_URL,MS_IDENTIDAD_DB_USER,MS_IDENTIDAD_DB_PASSWORD,LISTA_NEGRA_URL,MS_IDENTIDAD_SPRING_PROFILES_ACTIVE,MS_CUMPLIMIENTO_DB_HOST,MS_CUMPLIMIENTO_DB_PORT,MS_CUMPLIMIENTO_DB_NAME,MS_CUMPLIMIENTO_DB_USER,MS_CUMPLIMIENTO_DB_PASSWORD,MS_ECOMMERCE_DB_HOST,MS_ECOMMERCE_DB_PORT,MS_ECOMMERCE_DB_NAME,MS_ECOMMERCE_DB_USER,MS_ECOMMERCE_DB_PASSWORD,MS_FINANZAS_DB_HOST,MS_FINANZAS_DB_PORT,MS_FINANZAS_DB_NAME,MS_FINANZAS_DB_USER,MS_FINANZAS_DB_PASSWORD,MS_SUBASTAS_DB_HOST,MS_SUBASTAS_DB_PORT,MS_SUBASTAS_DB_NAME,MS_SUBASTAS_DB_USER,MS_SUBASTAS_DB_PASSWORD,SUBASTAS_WS_ORIGENES,SUBASTAS_CORS_ORIGENES,ADMINS_INICIALES
          script: |
            chmod +x /opt/nexus/scripts/cd/desplegar.sh
            /opt/nexus/scripts/cd/desplegar.sh

  # ---------------------------------------------------------------------
  # Job 5: produccion. "environment: produccion" es lo que engancha la
  # aprobacion manual (CA-01): ese ambiente se configura en GitHub con un
  # "required reviewer" desde Settings > Environments, fuera de este
  # archivo. El job se queda esperando ahi hasta que alguien apruebe; una
  # vez aprobado, todo lo de abajo corre solo, sin pasos manuales.
  #
  # A diferencia de dev/test, aqui SI hay reversion automatica (CA-02):
  # el step de despliegue usa "continue-on-error" para que, si falla, el
  # job siga vivo el tiempo suficiente para correr el step de reversion
  # (que es su propio step, con nombre explicito, para que quede visible en
  # el resumen de la corrida). Al final, si hubo reversion, el job se marca
  # en rojo de todos modos -- revertir no es lo mismo que "todo salio bien".
  # ---------------------------------------------------------------------
  desplegar-produccion:
    name: Desplegar en Produccion
    needs: [detectar-servicios, construir-y-publicar, desplegar-test]
    # Misma logica que test: solo con host propio (variable HAY_ENTORNO_PRODUCCION).
    if: needs.detectar-servicios.outputs.hay_servicios == 'true' && vars.HAY_ENTORNO_PRODUCCION == 'true'
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar lista "servicio:puerto" para este ambiente
        id: lista
        run: |
          LISTA=$(echo '${{ needs.detectar-servicios.outputs.servicios }}' | jq -r '[.[] | "\(.servicio):\(.puerto)"] | join(" ")')
          echo "lista=$LISTA" >> "$GITHUB_OUTPUT"

      - name: Copiar docker-compose.yml, docker-compose.deploy.yml y los scripts de despliegue/reversion
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST_PROD }}
          username: ${{ secrets.SSH_USER_PROD }}
          key: ${{ secrets.SSH_KEY_PROD }}
          source: "docker-compose.yml,docker-compose.deploy.yml,docker-compose.cuentas.yml,docker-compose.ms-cumplimiento.yml,docker-compose.ms-ecommerce.yml,docker-compose.ms-finanzas.yml,docker-compose.ms-subastas.yml,docker-compose.contenido.yml,infrastructure/despliegue/servicios.json,scripts/cd/desplegar.sh,scripts/cd/asegurar-swap.sh,scripts/cd/apagar.sh,scripts/cd/comprobar-capacidad.sh,scripts/cd/revertir.sh"
          target: "/opt/nexus"
          strip_components: 0

      # continue-on-error: si /actuator/health falla, NO detenemos el job
      # aqui -- necesitamos que corra el siguiente step (la reversion).
      - name: Desplegar en Produccion
        id: desplegar
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        env:
          TAG: ${{ needs.detectar-servicios.outputs.tag }}
          # Para que el servidor pueda hacer pull de las imagenes privadas de
          # ghcr.io: token de esta corrida (packages:read), no un secreto guardado.
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVICIOS_PUERTOS: ${{ steps.lista.outputs.lista }}
          APP_ENV: ${{ secrets.APP_ENV }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          DB_RELACIONAL_URL: ${{ secrets.DB_RELACIONAL_URL }}
          DB_MEMORIA_URL: ${{ secrets.DB_MEMORIA_URL }}
          DIRECTORIO_ACTIVO_URL: ${{ secrets.DIRECTORIO_ACTIVO_URL }}
          # ADR-002: de donde baja la plataforma la clave publica con la que
          # verifica los tokens de usuario. Hoy la publica ms-identidad; el dia
          # que sea Keycloak, cambia esta variable y nada mas.
          IDENTIDAD_JWKS_URL: ${{ vars.IDENTIDAD_JWKS_URL }}
          JWT_CLAVE_PRIVADA: ${{ secrets.JWT_CLAVE_PRIVADA }}
          DIRECTORIO_ACTIVO_CLIENT_ID: ${{ secrets.DIRECTORIO_ACTIVO_CLIENT_ID }}
          DIRECTORIO_ACTIVO_CLIENT_SECRET: ${{ secrets.DIRECTORIO_ACTIVO_CLIENT_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          # PENDIENTE (TODO_*): mismos 3 secrets de ms-identidad que en
          # dev/test. A diferencia de esos jobs, aqui SI forzamos
          # SPRING_PROFILES_ACTIVE=prod (literal, no es un secret -- no hay
          # nada sensible en el nombre del perfil): application.properties
          # de ms-identidad confirma que "prod" activa
          # application-prod.properties, que a su vez lee
          # ${DB_URL}/${DB_USER}/${DB_PASSWORD} -- exactamente los que
          # mapea docker-compose.cuentas.yml.
          MS_IDENTIDAD_DB_URL: ${{ secrets.TODO_DB_URL_MS_IDENTIDAD }}
          MS_IDENTIDAD_DB_USER: ${{ secrets.TODO_DB_USER_MS_IDENTIDAD }}
          MS_IDENTIDAD_DB_PASSWORD: ${{ secrets.TODO_DB_PASSWORD_MS_IDENTIDAD }}
          LISTA_NEGRA_URL: ${{ secrets.TODO_LISTA_NEGRA_URL }}
          MS_IDENTIDAD_SPRING_PROFILES_ACTIVE: "prod"
          # PENDIENTE (TODO_*): mismos 5 secrets de ms-cumplimiento que en
          # dev/test -- este servicio no tiene perfiles Spring (un solo
          # application.properties), asi que no hace falta forzar ninguno.
          MS_CUMPLIMIENTO_DB_HOST: ${{ vars.MS_CUMPLIMIENTO_DB_HOST }}
          MS_CUMPLIMIENTO_DB_PORT: ${{ vars.MS_CUMPLIMIENTO_DB_PORT }}
          MS_CUMPLIMIENTO_DB_NAME: ${{ vars.MS_CUMPLIMIENTO_DB_NAME }}
          MS_CUMPLIMIENTO_DB_USER: ${{ secrets.MS_CUMPLIMIENTO_DB_USER }}
          MS_CUMPLIMIENTO_DB_PASSWORD: ${{ secrets.MS_CUMPLIMIENTO_DB_PASSWORD }}
          # PENDIENTE (TODO_*): mismos 5 secrets de ms-ecommerce que en
          # dev/test -- tampoco tiene perfiles Spring, no hace falta forzar
          # ninguno.
          # Los cuatro servicios de economia usan nombres definitivos, no
          # marcadores "TODO_": el host, el puerto y el nombre de la base no
          # son secretos -- son el nombre de un contenedor de la propia red de
          # despliegue -- y meterlos en "secrets" solo servia para que nadie
          # pudiera comprobarlos sin permisos de administracion. Credencial
          # (usuario y clave) en secrets; el resto en variables.
          #
          # ms-identidad sigue con sus TODO_*: esta desplegado y funcionando
          # con esos valores, y migrarlo exige conocerlos. Queda anotado en
          # infrastructure/despliegue/CAPACIDAD.md.
          MS_ECOMMERCE_DB_HOST: ${{ vars.MS_ECOMMERCE_DB_HOST }}
          MS_ECOMMERCE_DB_PORT: ${{ vars.MS_ECOMMERCE_DB_PORT }}
          MS_ECOMMERCE_DB_NAME: ${{ vars.MS_ECOMMERCE_DB_NAME }}
          MS_ECOMMERCE_DB_USER: ${{ secrets.MS_ECOMMERCE_DB_USER }}
          MS_ECOMMERCE_DB_PASSWORD: ${{ secrets.MS_ECOMMERCE_DB_PASSWORD }}
          MS_FINANZAS_DB_HOST: ${{ vars.MS_FINANZAS_DB_HOST }}
          MS_FINANZAS_DB_PORT: ${{ vars.MS_FINANZAS_DB_PORT }}
          MS_FINANZAS_DB_NAME: ${{ vars.MS_FINANZAS_DB_NAME }}
          MS_FINANZAS_DB_USER: ${{ secrets.MS_FINANZAS_DB_USER }}
          MS_FINANZAS_DB_PASSWORD: ${{ secrets.MS_FINANZAS_DB_PASSWORD }}
          MS_SUBASTAS_DB_HOST: ${{ vars.MS_SUBASTAS_DB_HOST }}
          MS_SUBASTAS_DB_PORT: ${{ vars.MS_SUBASTAS_DB_PORT }}
          MS_SUBASTAS_DB_NAME: ${{ vars.MS_SUBASTAS_DB_NAME }}
          MS_SUBASTAS_DB_USER: ${{ secrets.MS_SUBASTAS_DB_USER }}
          MS_SUBASTAS_DB_PASSWORD: ${{ secrets.MS_SUBASTAS_DB_PASSWORD }}
          # Origenes permitidos del canal STOMP de subastas. NO es un secreto
          # (es la URL publica del borde) pero va por el mismo camino que
          # SALAS_WS_ORIGENES. Vacio = no se acepta ningun origen: el panel de
          # subastas se conectaria y el servidor le cerraria el handshake.
          SUBASTAS_WS_ORIGENES: ${{ vars.SUBASTAS_WS_ORIGENES }}
          SUBASTAS_CORS_ORIGENES: ${{ vars.SUBASTAS_CORS_ORIGENES }}
        with:
          host: ${{ secrets.DEPLOY_HOST_PROD }}
          username: ${{ secrets.SSH_USER_PROD }}
          key: ${{ secrets.SSH_KEY_PROD }}
          envs: GHCR_USER,GHCR_TOKEN,TAG,SERVICIOS_PUERTOS,APP_ENV,LOG_LEVEL,DB_RELACIONAL_URL,DB_MEMORIA_URL,DIRECTORIO_ACTIVO_URL,IDENTIDAD_JWKS_URL,JWT_CLAVE_PRIVADA,DIRECTORIO_ACTIVO_CLIENT_ID,DIRECTORIO_ACTIVO_CLIENT_SECRET,SMTP_HOST,DB_USER,DB_PASS,MS_IDENTIDAD_DB_URL,MS_IDENTIDAD_DB_USER,MS_IDENTIDAD_DB_PASSWORD,LISTA_NEGRA_URL,MS_IDENTIDAD_SPRING_PROFILES_ACTIVE,MS_CUMPLIMIENTO_DB_HOST,MS_CUMPLIMIENTO_DB_PORT,MS_CUMPLIMIENTO_DB_NAME,MS_CUMPLIMIENTO_DB_USER,MS_CUMPLIMIENTO_DB_PASSWORD,MS_ECOMMERCE_DB_HOST,MS_ECOMMERCE_DB_PORT,MS_ECOMMERCE_DB_NAME,MS_ECOMMERCE_DB_USER,MS_ECOMMERCE_DB_PASSWORD,MS_FINANZAS_DB_HOST,MS_FINANZAS_DB_PORT,MS_FINANZAS_DB_NAME,MS_FINANZAS_DB_USER,MS_FINANZAS_DB_PASSWORD,MS_SUBASTAS_DB_HOST,MS_SUBASTAS_DB_PORT,MS_SUBASTAS_DB_NAME,MS_SUBASTAS_DB_USER,MS_SUBASTAS_DB_PASSWORD,SUBASTAS_WS_ORIGENES,SUBASTAS_CORS_ORIGENES,ADMINS_INICIALES
          script: |
            chmod +x /opt/nexus/scripts/cd/desplegar.sh
            /opt/nexus/scripts/cd/desplegar.sh

      # CA-02: solo corre si el step de arriba fallo. Lee
      # /opt/nexus/ultimo-fallo.txt (lo dejo escrito desplegar.sh) y por cada
      # servicio ahi listado vuelve a hacer pull+up con su tag estable
      # anterior. Nombre EXACTO pedido por el criterio de aceptacion, para
      # que quede identificable en el resumen de la corrida.
      - name: Reversion automatica por fallo de salud
        if: steps.desplegar.outcome == 'failure'
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Lo destapo el simulacro en dev: sin sesion en ghcr.io, un pull de la
          # imagen estable fallaba justo cuando mas falta hacia.
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST_PROD }}
          username: ${{ secrets.SSH_USER_PROD }}
          key: ${{ secrets.SSH_KEY_PROD }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            chmod +x /opt/nexus/scripts/cd/revertir.sh
            /opt/nexus/scripts/cd/revertir.sh

      # Revertir deja el ambiente sano de nuevo, pero el despliegue que se
      # pidio SI fallo -- el job debe quedar en rojo para que el equipo lo
      # note y lo investigue, no pasar como si nada hubiera pasado.
      - name: Marcar el job como fallido si hubo reversion
        if: steps.desplegar.outcome == 'failure'
        run: |
          echo "El despliegue a produccion fallo su verificacion de salud y se revirtio automaticamente. Revisar el step 'Reversion automatica por fallo de salud' para el detalle."
          exit 1

  # ---------------------------------------------------------------------
  # Notificacion del resultado al canal del equipo (HU-CICD-001 CA-02,
  # HU-CICD-002 SCRUM-1115). Opcional a proposito: la eleccion del canal
  # (Discord, Slack, Teams...) sigue siendo del equipo; el dia que exista,
  # basta crear el secret WEBHOOK_NOTIFICACIONES con la URL del webhook
  # entrante y este job empieza a avisar. Sin el secret no hace nada, y
  # GitHub sigue mandando su correo a quien hizo el push cuando falla.
  # El cuerpo lleva "content" (Discord) y "text" (Slack y Teams) a la vez:
  # cada servicio lee el suyo e ignora el otro.
  # ---------------------------------------------------------------------
  notificar-resultado:
    name: Avisar al canal del equipo
    needs: [detectar-servicios, construir-y-publicar, desplegar-dev, desplegar-contenido-dev, desplegar-test, desplegar-produccion]
    if: always()
    runs-on: ubuntu-latest
    env:
      WEBHOOK: ${{ secrets.WEBHOOK_NOTIFICACIONES }}
    steps:
      - name: Enviar el resultado del despliegue
        if: env.WEBHOOK != ''
        env:
          RESULTADOS: >-
            construir=${{ needs.construir-y-publicar.result }}
            dev=${{ needs.desplegar-dev.result }}
            contenido=${{ needs.desplegar-contenido-dev.result }}
            test=${{ needs.desplegar-test.result }}
            prod=${{ needs.desplegar-produccion.result }}
          SERVICIOS: ${{ needs.detectar-servicios.outputs.servicios }}
          CORRIDA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        shell: bash
        run: |
          set -euo pipefail
          if echo "$RESULTADOS" | grep -q 'failure'; then
            ESTADO="FALLO"; ICONO=":x:"
          elif echo "$RESULTADOS" | grep -q 'cancelled'; then
            ESTADO="CANCELADO"; ICONO=":warning:"
          else
            ESTADO="OK"; ICONO=":white_check_mark:"
          fi
          TEXTO="$ICONO CD $ESTADO en develop (${COMMIT:0:7}, por $ACTOR) - servicios: ${SERVICIOS:-solo frontend y borde} - $RESULTADOS - $CORRIDA"
          CUERPO=$(jq -cn --arg t "$TEXTO" '{content: $t, text: $t}')
          # El webhook nunca se imprime: solo el codigo HTTP de la respuesta.
          CODIGO=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d "$CUERPO" "$WEBHOOK" || echo "000")
          echo "Aviso enviado al canal del equipo: HTTP $CODIGO ($ESTADO)"
          case "$CODIGO" in 2*) exit 0 ;; *) echo "::warning::El canal del equipo respondio $CODIGO; el despliegue no depende de esto." ;; esac
      - name: Sin canal configurado
        if: env.WEBHOOK == ''
        run: |
          echo "Sin secret WEBHOOK_NOTIFICACIONES: no se avisa a ningun canal (GitHub sigue avisando por correo al autor si falla)."