# CI temporal del servicio de inventario hasta que plataforma publique los
# flujos reutilizables de la empresa.
name: inventario-ci

on:
  push:
    branches: [main]
    paths:
      - "services/contenido/inventario/**"
      - ".github/workflows/inventario-ci.yml"
  pull_request:
    paths:
      - "services/contenido/inventario/**"
      - ".github/workflows/inventario-ci.yml"

jobs:
  pruebas:
    name: Pruebas y compuerta de cobertura (80%)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/contenido/inventario
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Pruebas unitarias e integracion
        run: |
          chmod +x gradlew
          ./gradlew clean test jacocoTestCoverageVerification --no-daemon --console=plain
      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-jacoco-inventario
          path: services/contenido/inventario/build/reports/jacoco/test/html

  imagen:
    name: Construccion de la imagen Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t servicio-inventario services/contenido/inventario
