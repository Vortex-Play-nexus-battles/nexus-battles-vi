# Infraestructura de dev en AWS: LOS DOS hosts (plataforma y contenido).
#
# Sin claves de AWS en GitHub: el job asume el rol IAM github-actions-nexus-dev
# por OIDC (permissions.id-token). El rol solo confia en workflows de ESTE
# repositorio (condicion `sub` = repo:Vortex-Play-nexus-battles/nexus-battles-vi:*).
#
# ## R9.1/R9.3 — que cambio y por que
#
# Este workflow gobernaba SOLO el host de plataforma. El de contenido
# (`nexus-contenido-dev`, los cuatro servicios de Grupo 2 y su MongoDB) se
# aplicaba a mano, con el estado en el disco de quien lo aplico, sin bloqueo y
# sin versionado; y el apagado nocturno no lo tocaba, asi que gastaba credito
# las 24 h mientras plataforma se apagaba a las 23:23. Ahora los dos hosts
# pasan por aqui, con la MISMA politica horaria, seleccionados por la matriz.
#
# ## Compuerta del host de contenido
#
# Su estado remoto nace vacio (ver infrastructure/entornos/contenido/
# versiones.tf). Con el estado vacio, `plan` no dice "sin cambios": propone
# CREAR instancia, IP, grupo de seguridad y llave — un tercer EC2 y coste
# duplicado mientras los actuales siguen corriendo. Por eso `apply` sobre
# contenido esta BLOQUEADO hasta que la importacion este hecha y la variable
# de repositorio IMPORTACION_CONTENIDO_COMPLETADA valga "true". No depende de
# que nadie se acuerde: el paso falla solo.
#
# Variables del repositorio (Settings > Secrets and variables > Actions):
#   AWS_ROLE_ARN                        arn:aws:iam::<cuenta>:role/github-actions-nexus-dev
#   AWS_REGION                          us-east-1
#   TFSTATE_BUCKET                      bucket S3 del estado (versionado, sin acceso publico)
#   AWS_CORREO_ALERTAS                  buzon del equipo para presupuestos y recordatorios
#   IMPORTACION_CONTENIDO_COMPLETADA    "true" solo cuando el plan de contenido salga limpio
#
# Acciones:
#   inventario -> SOLO LECTURA. Imprime los identificadores reales del host
#               (instancia, IP, SG, subred, VPC, volumen, AMI, llave) para
#               rellenar los bloques `import`. No toca nada.
#   plan     -> siempre segura; corre sola en cada PR que toque una carpeta de
#               entornos y deja el plan como comentario: eso aprueba el revisor.
#   apply    -> crea/actualiza el host. Corre SOLA al fusionar en develop un
#               cambio de la carpeta de PLATAFORMA (el plan aprobado en el PR
#               es la confirmacion humana). Sobre contenido NUNCA corre sola.
#               A mano exige escribir "apply" en `confirmar`.
#   start    -> enciende la instancia (tambien por cron lun-vie 07:00 Colombia).
#   stop     -> apaga la instancia (tambien por cron todos los dias 23:00 Colombia).
#               Apagada solo factura la IP elastica (3,60 USD/mes) y el disco.
#   destroy  -> borra TODO lo de esa carpeta, incluida la IP. Exige "destroy".
#               Nunca corre sola.
#
# Limite de GitHub: el boton "Run workflow" y los `cron` solo existen cuando el
# archivo esta en la rama por defecto (`main`). Hasta que develop se promueva a
# main, el apagado nocturno no corre solo y start/stop se piden a un
# administrador. El apply por fusion en develop NO tiene esa limitacion.
#
# Politica de la cuenta (Free Plan, USD 0 de bolsillo): ver
# infrastructure/entornos/plataforma/README.md.

name: Infra dev (AWS Free Plan)

on:
  workflow_dispatch:
    inputs:
      host:
        description: "Sobre que host actuar"
        type: choice
        required: true
        default: plataforma
        options: [plataforma, contenido, ambos]
      accion:
        description: "Que hacer"
        type: choice
        required: true
        default: plan
        options: [inventario, plan, apply, start, stop, destroy]
      confirmar:
        description: "Para apply/destroy: escribe la misma accion aqui"
        type: string
        required: false
        default: ""
  pull_request:
    branches: [develop]
    paths:
      - "infrastructure/entornos/plataforma/**"
      - "infrastructure/entornos/contenido/**"
      - ".github/workflows/infra-dev.yml"
  # Fusion en develop de un cambio de la carpeta -> apply (GitOps).
  # OJO: el paso que decide la accion limita este apply automatico a
  # PLATAFORMA. Contenido se queda en `plan` hasta que la importacion este
  # hecha; ver la compuerta arriba.
  push:
    branches: [develop]
    paths:
      - "infrastructure/entornos/plataforma/**"
      - "infrastructure/entornos/contenido/**"
      - ".github/workflows/infra-dev.yml"
  # OJO con la hora exacta. Estas tareas estaban a las 04:00 y 12:00 en punto,
  # y GitHub retrasa las programadas cuando hay carga —el arranque de cada
  # hora es justo el peor momento— y, si el retraso es grande, las DESCARTA.
  # Medido en este repositorio: el apagado de las 04:00 corrio a las 08:38 y a
  # las 09:08; el encendido de las 12:00 del 19 de septiembre no llego a
  # correr nunca, y el despliegue de esa tarde murio contra un host apagado.
  #
  # Dos cambios: minutos fuera de punto, y cada accion se intenta DOS veces
  # con una hora de diferencia. Repetir no molesta porque la accion es
  # idempotente: si ya esta en el estado pedido, el paso dice "Nada que hacer".
  #
  # R9.3: estos mismos crones cubren ahora LOS DOS hosts (matriz). No se
  # cambia ni un horario: se aplica el vigente al host que no lo tenia.
  schedule:
    # Apagar: 04:23 y 05:23 UTC = 23:23 y 00:23 Colombia, todos los dias.
    # El segundo intento importa mas que el primero: una noche sin apagar se
    # come credito del Free Plan.
    - cron: "23 4 * * *"
    - cron: "23 5 * * *"
    # Encender: 12:17 y 13:17 UTC = 07:17 y 08:17 Colombia, de lunes a viernes.
    # Los fines de semana los hosts quedan apagados a proposito, por coste;
    # quien necesite desplegar un sabado no tiene que hacer nada: el propio CD
    # los enciende (ver "Asegurar que el host esta encendido" en cd.yml).
    - cron: "17 12 * * 1-5"
    - cron: "17 13 * * 1-5"

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_correo_alertas: ${{ vars.AWS_CORREO_ALERTAS }}

jobs:
  # Que hosts entran en esta corrida. Se resuelve una vez y la matriz lo lee.
  objetivos:
    name: Resolver hosts
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.calcular.outputs.hosts }}
    steps:
      - id: calcular
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch)
              case "${{ inputs.host }}" in
                plataforma) hosts='["plataforma"]' ;;
                contenido)  hosts='["contenido"]' ;;
                ambos)      hosts='["plataforma","contenido"]' ;;
                *) echo "::error::host no reconocido: '${{ inputs.host }}'"; exit 1 ;;
              esac ;;
            # Encender/apagar es para los dos: es justo el trabajo que antes
            # solo cubria a plataforma y dejaba a contenido gastando 24 h.
            schedule) hosts='["plataforma","contenido"]' ;;
            # En PR y en fusion se miran los dos; el paso "Resolver la accion"
            # decide despues si a cada uno le toca plan o apply.
            *) hosts='["plataforma","contenido"]' ;;
          esac
          echo "hosts=$hosts" >> "$GITHUB_OUTPUT"
          echo "Hosts de esta corrida: $hosts"

  infra:
    name: Host de ${{ matrix.host }}
    needs: objetivos
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Un host que falle no debe impedir que el otro se apague.
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.objetivos.outputs.hosts) }}

    # Nunca dos ejecuciones a la vez sobre el MISMO estado. Por host: apagar
    # contenido y aplicar plataforma a la vez es perfectamente seguro.
    concurrency:
      group: infra-dev-${{ matrix.host }}
      cancel-in-progress: false

    defaults:
      run:
        working-directory: infrastructure/entornos/${{ matrix.host }}

    env:
      NOMBRE_INSTANCIA: nexus-${{ matrix.host }}-dev

    steps:
      - name: Resolver la accion
        id: accion
        working-directory: .
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch) accion="${{ inputs.accion }}" ;;
            schedule)
              # Explicito en los dos sentidos: un cron que no este en esta
              # lista es un error de configuracion, no un "start" por defecto.
              # Dejarlo caer en start dejaria el host encendido gastando
              # credito sin que nadie se entere.
              case "${{ github.event.schedule }}" in
                "23 4 * * *"|"23 5 * * *")       accion=stop ;;
                "17 12 * * 1-5"|"17 13 * * 1-5") accion=start ;;
                *) echo "::error::Cron no reconocido: '${{ github.event.schedule }}'. Revisa el bloque schedule de este workflow."; exit 1 ;;
              esac ;;
            push)
              # R9.1: el apply automatico al fusionar es SOLO para plataforma.
              # El estado de contenido nace vacio y un apply ahi crearia una
              # instancia nueva en vez de adoptar la que ya corre. Hasta que
              # la importacion este hecha, a contenido le toca plan.
              if [ "${{ matrix.host }}" = "plataforma" ]; then accion=apply; else accion=plan; fi ;;
            *) accion=plan ;;
          esac
          echo "accion=$accion" >> "$GITHUB_OUTPUT"
          echo "Host ${{ matrix.host }} — accion: $accion"

      - name: Exigir confirmacion para apply/destroy manuales
        if: github.event_name == 'workflow_dispatch' && (steps.accion.outputs.accion == 'apply' || steps.accion.outputs.accion == 'destroy')
        working-directory: .
        run: |
          if [ "${{ inputs.confirmar }}" != "${{ steps.accion.outputs.accion }}" ]; then
            echo "::error::Escribe '${{ steps.accion.outputs.accion }}' en el campo 'confirmar' para ejecutar esta accion."
            exit 1
          fi

      # --------------------------------------------------------- COMPUERTA R9.1
      - name: Compuerta — no aplicar sobre contenido hasta que este importado
        if: matrix.host == 'contenido' && (steps.accion.outputs.accion == 'apply' || steps.accion.outputs.accion == 'destroy')
        working-directory: .
        run: |
          if [ "${{ vars.IMPORTACION_CONTENIDO_COMPLETADA }}" != "true" ]; then
            echo "::error::El estado de contenido todavia no ha adoptado la infraestructura existente."
            echo "Con el estado vacio, un apply CREARIA una instancia, una IP y un grupo de"
            echo "seguridad nuevos mientras los actuales siguen corriendo: un tercer EC2 y coste"
            echo "duplicado. Pasos: accion 'inventario' -> rellenar importaciones.tf -> plan"
            echo "limpio ('No changes') -> poner IMPORTACION_CONTENIDO_COMPLETADA=true."
            exit 1
          fi
          echo "Importacion declarada completada. Continua."

      - name: Descargar el repositorio
        uses: actions/checkout@v4

      # Solo se imprimen los claims del token (sub, aud, repositorio, rama),
      # nunca el token: sirve para comparar con la condicion de confianza del
      # rol cuando AWS responde "Not authorized".
      - name: Mostrar la identidad OIDC que ve AWS
        working-directory: .
        run: |
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          cuerpo=$(echo "$token" | cut -d. -f2 | tr '_-' '/+')
          case $(( ${#cuerpo} % 4 )) in 2) cuerpo="$cuerpo==";; 3) cuerpo="$cuerpo=";; esac
          echo "$cuerpo" | base64 -d | jq '{iss, sub, aud, repository, repository_owner, ref, event_name}'

      - name: Asumir el rol de AWS por OIDC (sin claves)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: infra-${{ matrix.host }}-${{ steps.accion.outputs.accion }}-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Comprobar que la cuenta sigue en Free Plan
        working-directory: .
        run: |
          # Si algun dia esta llamada devolviera PAID, el flujo se detiene: nadie
          # despliega sobre una cuenta que ya factura a la tarjeta.
          plan=$(aws freetier get-account-plan-state --query 'accountPlanType' --output text 2>/dev/null || echo DESCONOCIDO)
          echo "Plan de la cuenta: $plan"
          if [ "$plan" = "PAID" ]; then
            echo "::error::La cuenta esta en Paid Plan. Politica del proyecto: USD 0 de bolsillo. Detenido."
            exit 1
          fi

      # ------------------------------------------------------------- inventario
      # SOLO LECTURA. Sirve para rellenar los bloques `import` de R9.1 sin que
      # nadie tenga que abrir la consola ni pasarse identificadores por chat.
      # No imprime ningun secreto: identificadores de recursos, nada mas.
      - name: Inventario real del host (solo lectura)
        if: steps.accion.outputs.accion == 'inventario'
        working-directory: .
        run: |
          set -o pipefail
          echo "## Inventario de $NOMBRE_INSTANCIA" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          instancia=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$NOMBRE_INSTANCIA" "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query 'Reservations[].Instances[0]' --output json)

          if [ "$instancia" = "[]" ] || [ -z "$instancia" ]; then
            echo "No hay ninguna instancia con tag Name=$NOMBRE_INSTANCIA." | tee -a "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "$instancia" | jq -r '.[0] | {
            instancia:        .InstanceId,
            estado:           .State.Name,
            tipo:             .InstanceType,
            ami:              .ImageId,
            llave:            .KeyName,
            vpc:              .VpcId,
            subred:           .SubnetId,
            ip_privada:       .PrivateIpAddress,
            ip_publica:       .PublicIpAddress,
            perfil_iam:       (.IamInstanceProfile.Arn // "ninguno"),
            grupos_seguridad: [.SecurityGroups[] | {id: .GroupId, nombre: .GroupName}],
            volumenes:        [.BlockDeviceMappings[] | {dispositivo: .DeviceName, volumen: .Ebs.VolumeId}],
            etiquetas:        ([.Tags[] | {(.Key): .Value}] | add)
          }' | tee -a "$GITHUB_STEP_SUMMARY"

          id=$(echo "$instancia" | jq -r '.[0].InstanceId')
          echo "--- IP elastica asociada ---" | tee -a "$GITHUB_STEP_SUMMARY"
          aws ec2 describe-addresses --filters "Name=instance-id,Values=$id" \
            --query 'Addresses[].{asignacion:AllocationId,ip:PublicIp,asociacion:AssociationId}' \
            --output json | tee -a "$GITHUB_STEP_SUMMARY"

          echo "--- Reglas de entrada de sus grupos de seguridad ---" | tee -a "$GITHUB_STEP_SUMMARY"
          for sg in $(echo "$instancia" | jq -r '.[0].SecurityGroups[].GroupId'); do
            aws ec2 describe-security-groups --group-ids "$sg" \
              --query 'SecurityGroups[].{id:GroupId,nombre:GroupName,vpc:VpcId,entrada:IpPermissions}' \
              --output json | tee -a "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # --------------------------------------------------------------- start/stop
      - name: Encender o apagar la instancia
        if: steps.accion.outputs.accion == 'start' || steps.accion.outputs.accion == 'stop'
        working-directory: .
        run: |
          accion="${{ steps.accion.outputs.accion }}"
          id=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$NOMBRE_INSTANCIA" "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          if [ -z "$id" ] || [ "$id" = "None" ]; then
            echo "No hay instancia $NOMBRE_INSTANCIA: nada que $accion (todavia no se ha hecho apply, o ya se destruyo)."
            exit 0
          fi
          estado=$(aws ec2 describe-instances --instance-ids "$id" --query 'Reservations[0].Instances[0].State.Name' --output text)
          echo "Instancia $id en estado $estado"
          case "$accion:$estado" in
            start:stopped)  aws ec2 start-instances --instance-ids "$id" >/dev/null; aws ec2 wait instance-running --instance-ids "$id"; echo "Encendida." ;;
            stop:running)   aws ec2 stop-instances  --instance-ids "$id" >/dev/null; aws ec2 wait instance-stopped --instance-ids "$id"; echo "Apagada." ;;
            *)              echo "Nada que hacer." ;;
          esac

      # ------------------------------------------------------ plan/apply/destroy
      # La organizacion solo permite acciones de GitHub, verificadas en el
      # Marketplace o appleboy/*; opentofu/setup-opentofu no lo es. Se instala
      # con el script oficial, version fijada (misma que el .terraform.lock.hcl
      # de entornos/ usa "tofu").
      - name: Instalar OpenTofu
        if: steps.accion.outputs.accion == 'plan' || steps.accion.outputs.accion == 'apply' || steps.accion.outputs.accion == 'destroy'
        working-directory: .
        run: |
          curl -fsSL https://get.opentofu.org/install-opentofu.sh -o install-opentofu.sh
          chmod +x install-opentofu.sh
          sudo ./install-opentofu.sh --install-method standalone --opentofu-version 1.10.6
          rm -f install-opentofu.sh
          tofu version

      - name: tofu init (estado en S3)
        if: steps.accion.outputs.accion == 'plan' || steps.accion.outputs.accion == 'apply' || steps.accion.outputs.accion == 'destroy'
        run: |
          tofu init \
            -backend-config="bucket=${{ vars.TFSTATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: tofu fmt + validate
        if: steps.accion.outputs.accion == 'plan' || steps.accion.outputs.accion == 'apply'
        run: |
          tofu fmt -check -diff
          tofu validate

      - name: tofu plan
        if: steps.accion.outputs.accion == 'plan' || steps.accion.outputs.accion == 'apply'
        id: plan
        run: |
          set -o pipefail
          tofu plan -no-color -out=plan.tfplan | tee plan.txt

      # R9.1 — la compuerta absoluta, leida del plan y no de la buena voluntad.
      # Un `destroy` o un `replace` sobre la instancia, la IP, el volumen o el
      # grupo de seguridad detiene la corrida ANTES del apply.
      # ------------------------------------------------- COMPUERTA DE CUENTA
      # La contradiccion que costo un dia entero de diagnostico, convertida
      # en algo que la infraestructura detecta sola.
      #
      # `nexus-contenido-dev` EXISTE, pero no en esta cuenta: es del grupo 2
      # (ver el job `desplegar-contenido-dev` de cd.yml, #656; IP elastica
      # 34.193.90.11, encendida desde el 9-sep). El rol de vars.AWS_ROLE_ARN
      # es de la cuenta de plataforma y no la ve. De ahi salen dos sintomas
      # que parecen decir lo mismo y no lo dicen:
      #
      #   accion `inventario`  -> "No hay ninguna instancia con tag
      #                            Name=nexus-contenido-dev"
      #   accion `plan`        -> "5 to add" (instancia, IP, SG, llave)
      #
      # Ninguno significa "el host no existe". Significan "este rol no lo
      # ve". Aplicar ese plan crearia un TERCER EC2, en la cuenta
      # equivocada, mientras el host real sigue corriendo y recibiendo
      # despliegues: coste nuevo y un estado partido en dos.
      #
      # Por que no basta IMPORTACION_CONTENIDO_COMPLETADA: es un booleano de
      # buena fe, y el mensaje de error de esa compuerta invita justo a
      # ponerlo en "true" ("rellena importaciones.tf -> plan limpio -> pon la
      # variable"). Un administrador que siga las instrucciones al pie de la
      # letra desbloquea exactamente el apply que no debe ocurrir. Esta
      # compuerta no pregunta a nadie: lee el plan.
      - name: Compuerta — contenido NUNCA crea un host (vive en otra cuenta)
        if: matrix.host == 'contenido' && (steps.accion.outputs.accion == 'plan' || steps.accion.outputs.accion == 'apply')
        run: |
          nacimientos='aws_instance|aws_eip|aws_security_group|aws_key_pair'
          if grep -qE "^  # ($nacimientos)\..* will be created" plan.txt \
             || grep -qE "^# ($nacimientos)\..* will be created" plan.txt; then
            {
              echo "### Compuerta de cuenta — el plan de contenido propone CREAR el host"
              echo
              echo 'El plan quiere crear instancia/IP/SG/llave. Eso NO significa que'
              echo '`nexus-contenido-dev` no exista: existe, en la cuenta del grupo 2'
              echo '(cd.yml, #656). Este rol OIDC es el de plataforma y no la ve.'
              echo
              echo 'Aplicarlo levantaria un tercer EC2 en la cuenta equivocada.'
              echo 'La salida correcta NO es poner IMPORTACION_CONTENIDO_COMPLETADA'
              echo 'en "true": es gobernar esta carpeta desde la cuenta que es dueña'
              echo 'del host, o dejarla sin gobernar y desplegar por SSH como hace'
              echo 'hoy cd.yml. Ver infrastructure/entornos/contenido/README.md.'
            } >> "$GITHUB_STEP_SUMMARY"

            if [ "${{ steps.accion.outputs.accion }}" = "apply" ]; then
              echo "::error::El plan de contenido CREA un host. Existe ya, en la cuenta del grupo 2 (#656): aplicar esto es un tercer EC2 y coste nuevo. NO SE APLICA."
              exit 1
            fi
            # En `plan` no se falla: un PR que toque esta carpeta por otro
            # motivo no tiene la culpa del desajuste de cuentas. Queda el
            # aviso, bien visible, en el resumen de la corrida.
            echo "::warning::El plan de contenido propone crear el host. Es el desajuste de cuentas de #656, no un host ausente. Un apply queda bloqueado."
          else
            echo "El plan de contenido no crea ningun host."
          fi

      - name: Compuerta — 0 destroy y 0 replace sobre recursos criticos
        if: steps.accion.outputs.accion == 'apply'
        run: |
          # "must be replaced" y "will be destroyed" son las dos formas en que
          # el plan anuncia que algo desaparece. Se buscan en el bloque de cada
          # recurso critico.
          criticos='aws_instance|aws_eip|aws_ebs_volume|aws_security_group'
          if grep -nE "^# ($criticos)\..* (must be replaced|will be destroyed)" plan.txt; then
            echo "::error::El plan destruye o reemplaza un recurso critico. NO SE APLICA."
            echo "Abre issue tecnico con: recurso, motivo, riesgo y alternativa, y sigue con el resto del bloque."
            exit 1
          fi
          # Red de seguridad por si cambia el formato del encabezado.
          if grep -qE "^Plan: .* to destroy\.$" plan.txt && ! grep -qE "^Plan: .* 0 to destroy\.$" plan.txt; then
            echo "::error::El plan declara destrucciones. NO SE APLICA."
            exit 1
          fi
          echo "Sin destroy ni replace sobre recursos criticos."

      - name: Publicar el plan en el PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const host = '${{ matrix.host }}';
            const plan = fs.readFileSync(`infrastructure/entornos/${host}/plan.txt`, 'utf8');
            const resumen = (plan.match(/^(Plan:.*|No changes.*)$/m) || ['Sin resumen (ver el log).'])[0];
            const recortado = plan.length > 60000 ? plan.slice(0, 60000) + '\n... (recortado)' : plan;
            const cuerpo = [
              `### Infra dev — \`tofu plan\` (host de ${host}, AWS Free Plan)`,
              '',
              '`' + resumen.trim() + '`',
              '',
              '<details><summary>Plan completo</summary>',
              '',
              '```', recortado, '```',
              '',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body: cuerpo,
            });

      - name: tofu apply
        if: steps.accion.outputs.accion == 'apply'
        run: tofu apply -no-color -auto-approve plan.tfplan

      - name: tofu destroy
        if: steps.accion.outputs.accion == 'destroy'
        run: tofu destroy -no-color -auto-approve

      - name: Salidas
        if: steps.accion.outputs.accion == 'apply'
        run: |
          echo "## Host de ${{ matrix.host }} (dev)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tofu output -no-color >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Secretos del entorno dev a actualizar por un administrador (sufijo _CONTENIDO_DEV para el host de contenido): DEPLOY_HOST_DEV = ip_publica, SSH_USER_DEV = ubuntu, SSH_KEY_DEV = valor del parametro indicado en parametro_llave_privada (Systems Manager > Parameter Store)." >> "$GITHUB_STEP_SUMMARY"
