# Diagnostico del host de DEV — M16A (infraestructura, red, datos, DR).
#
# Por que existe: el 19 de septiembre el despliegue fallo con
# "dial tcp :22: i/o timeout" y averiguar por que costo veinte minutos de ir
# mirando corridas una por una. La respuesta resulto ser sencilla —la instancia
# estaba apagada—, pero no habia forma de saberlo sin reconstruir el historial.
#
# Este workflow contesta en una corrida: si el host esta encendido, desde
# cuando, cuanta memoria y disco le quedan, que contenedores hay y cuales se
# han reiniciado, si el nucleo mato algo por falta de memoria, y como respondio
# cada servicio. No cambia nada: solo mira.
#
# No cuesta nada: un runner de GitHub y una sesion SSH.
name: Diagnostico del host DEV

on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: "Que host mirar"
        type: choice
        required: true
        default: dev
        options: [dev, contenido]

permissions:
  id-token: write
  contents: read

jobs:
  diagnostico:
    name: Estado del host de ${{ inputs.ambiente }}
    runs-on: ubuntu-latest
    environment: dev
    steps:
      # El host de contenido es del grupo 2 y vive en OTRA cuenta de AWS
      # (ver el job "desplegar-contenido-dev" de cd.yml, #656): su rol y su
      # region son variables distintas. Si la variable del rol de contenido
      # no esta configurada, se salta este paso y el diagnostico sigue
      # adelante por SSH -- la parte de EC2 es la unica que necesita AWS.
      - name: Asumir el rol de AWS por OIDC (sin claves)
        id: aws
        if: inputs.ambiente == 'dev' || vars.AWS_ROLE_ARN_CONTENIDO != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.ambiente == 'contenido' && vars.AWS_ROLE_ARN_CONTENIDO || vars.AWS_ROLE_ARN }}
          role-session-name: diagnostico-${{ github.run_id }}
          aws-region: ${{ inputs.ambiente == 'contenido' && (vars.AWS_REGION_CONTENIDO || 'us-east-1') || vars.AWS_REGION }}

      # Lo primero, porque es la causa mas probable y la mas barata de
      # descartar: si la instancia esta apagada, todo lo demas sobra.
      - name: Estado de la instancia en EC2
        if: steps.aws.outcome == 'success'
        env:
          NOMBRE_INSTANCIA: ${{ inputs.ambiente == 'contenido' && (vars.NOMBRE_INSTANCIA_CONTENIDO || 'nexus-contenido-dev') || 'nexus-plataforma-dev' }}
        run: |
          set -euo pipefail
          # Mismo nombre de etiqueta que infra-dev.yml (NOMBRE_INSTANCIA).
          id=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$NOMBRE_INSTANCIA" \
                      "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          if [ -z "$id" ] || [ "$id" = "None" ]; then
            echo "::warning::No existe la instancia. O no se ha hecho apply, o se destruyo."
            exit 0
          fi
          aws ec2 describe-instances --instance-ids "$id" \
            --query 'Reservations[0].Instances[0].{Id:InstanceId,Estado:State.Name,Tipo:InstanceType,IP:PublicIpAddress,Arranco:LaunchTime}' \
            --output table
          estado=$(aws ec2 describe-instances --instance-ids "$id" \
            --query 'Reservations[0].Instances[0].State.Name' --output text)
          if [ "$estado" != "running" ]; then
            echo "::error::La instancia esta $estado. Enciendela con el workflow 'Infra dev', accion start."
            exit 1
          fi

      # Ojo con el orden de las comprobaciones: memoria y disco ANTES que
      # docker, porque si falta cualquiera de las dos, lo que docker cuente es
      # consecuencia y no causa.
      - name: Que dice el host por dentro
        uses: appleboy/ssh-action@v1.0.3
        env:
          # La lista "servicio:puerto" que se consulta al final cambia segun
          # el host: plataforma publica 8081-8091, contenido 8101-8104.
          PARES_SALUD: ${{ inputs.ambiente == 'contenido' && 'heroes:8101 inventario:8102 productos:8103 motor-combate:8104' || 'comentarios:8081 correo:8082 torneos:8083 salas-partidas:8084 notificaciones:8085 moderacion-sanciones:8086 metricas-plataforma:8087 admin-parametros:8088 ms-identidad:8089' }}
        with:
          host: ${{ inputs.ambiente == 'contenido' && secrets.DEPLOY_HOST_CONTENIDO_DEV || secrets.DEPLOY_HOST_DEV }}
          username: ${{ inputs.ambiente == 'contenido' && secrets.SSH_USER_CONTENIDO_DEV || secrets.SSH_USER_DEV }}
          key: ${{ inputs.ambiente == 'contenido' && secrets.SSH_KEY_CONTENIDO_DEV || secrets.SSH_KEY_DEV }}
          envs: PARES_SALUD
          command_timeout: 3m
          script: |
            echo "===================== ARRANQUE Y CARGA ====================="
            uptime
            echo "Ultimo arranque: $(who -b 2>/dev/null || stat -c %y /proc/1 2>/dev/null)"

            echo
            echo "===================== MEMORIA (MiB) ========================"
            free -m
            echo
            echo "  Swap configurado:"
            swapon --show 2>/dev/null | sed 's/^/    /' || echo "    (sin swap)"
            echo
            echo "Los cinco procesos que mas memoria usan:"
            ps -eo rss,comm --sort=-rss | head -6 | awk 'NR==1{print "  RSS(KB) PROCESO"} NR>1{printf "  %7d %s\n", $1, $2}'

            echo
            echo "===================== DISCO ================================"
            df -h / /var/lib/docker 2>/dev/null | sed 's/^/  /'
            echo "  Espacio que ocupa Docker:"
            sudo docker system df 2>/dev/null | sed 's/^/    /' || docker system df | sed 's/^/    /'

            echo
            echo "============ ¿EL NUCLEO MATO ALGO POR MEMORIA? ============="
            # Si esto imprime algo, la causa de una caida es OOM y no otra cosa.
            if sudo dmesg -T 2>/dev/null | grep -iE "out of memory|oom-killer|killed process" | tail -15; then :; else
              echo "  Nada en dmesg."
            fi
            sudo journalctl -k --since "7 days ago" 2>/dev/null \
              | grep -iE "out of memory|oom-killer" | tail -10 || echo "  Nada en journalctl."

            echo
            echo "===================== CONTENEDORES ========================="
            sudo docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.RestartCount}}' 2>/dev/null \
              || sudo docker ps -a --format 'table {{.Names}}\t{{.Status}}'
            echo
            echo "  Reinicios por contenedor (un numero alto es un servicio que no levanta):"
            for c in $(sudo docker ps -aq); do
              n=$(sudo docker inspect -f '{{.Name}}' "$c" | tr -d /)
              r=$(sudo docker inspect -f '{{.RestartCount}}' "$c")
              p=$(sudo docker inspect -f '{{.HostConfig.RestartPolicy.Name}}' "$c")
              printf '    %-28s reinicios=%-4s politica=%s\n' "$n" "$r" "$p"
            done

            echo
            echo "===================== MEMORIA POR CONTENEDOR ==============="
            sudo docker stats --no-stream \
              --format 'table {{.Name}}\t{{.MemUsage}}\t{{.MemPerc}}\t{{.CPUPerc}}'

            echo
            echo "=========== CUANTA MEMORIA HAY COMPROMETIDA (mem_limit) ====="
            # La suma de los mem_limit declarados frente a la RAM real del
            # host: es lo que decide si cabe UN servicio mas sin empujar a
            # los que sostienen el MVP a swap. Un total muy por encima de la
            # RAM no es un error por si mismo (Docker no reserva), pero dice
            # cuanto se esta confiando en el swap.
            total_lim=0
            for c in $(sudo docker ps -q); do
              n=$(sudo docker inspect -f '{{.Name}}' "$c" | tr -d /)
              l=$(sudo docker inspect -f '{{.HostConfig.Memory}}' "$c")
              lm=$(( l / 1024 / 1024 ))
              total_lim=$(( total_lim + lm ))
              printf '    %-28s limite=%s MiB\n' "$n" "$lm"
            done
            ram=$(free -m | awk '/^Mem:/{print $2}')
            libre=$(free -m | awk '/^Mem:/{print $7}')
            echo "    ----"
            printf '    %-28s %s MiB\n' "SUMA DE LIMITES" "$total_lim"
            printf '    %-28s %s MiB\n' "RAM DEL HOST" "$ram"
            printf '    %-28s %s MiB\n' "RAM DISPONIBLE AHORA" "$libre"

            echo
            echo "===================== SALUD DE CADA SERVICIO ==============="
            # Los pares "servicio:puerto" los pone el workflow segun el host
            # (PARES_SALUD); ms-ecommerce y ms-finanzas son la excepcion
            # porque tienen context-path propio (/ecommerce y /api/v1).
            for par in $PARES_SALUD; do
              s=${par%%:*}; p=${par##*:}
              r=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://localhost:$p/actuator/health" || echo "---")
              printf '    %-24s %s\n' "$s" "$r"
            done
            for par in "ms-ecommerce:8090:/ecommerce" "ms-cumplimiento:8091:" \
                       "ms-subastas:8092:/api/v1" "ms-finanzas:8093:/api/v1"; do
              s=$(echo "$par" | cut -d: -f1); p=$(echo "$par" | cut -d: -f2); ctx=$(echo "$par" | cut -d: -f3)
              r=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://localhost:$p$ctx/actuator/health" || echo "---")
              printf '    %-24s %s\n' "$s" "$r"
            done

            echo
            echo "===================== BORDE ================================"
            curl -s --max-time 5 http://localhost/salud-borde || echo "  el borde no responde"

            echo
            echo "===================== ULTIMOS ERRORES POR SERVICIO ========="
            # Lo que el smoke no cuenta: POR QUE falla. Solo lineas de error de
            # la ultima hora, recortadas, sin cuerpos de peticion. Un servicio
            # sano imprime "(sin errores)". Se mira tambien la URL del emisor
            # de credenciales de cada uno (ADR-005): es configuracion, no
            # secreto, y una URL equivocada aqui explica un 500 en cadena.
            for c in $(sudo docker ps --format '{{.Names}}' | grep '^srv-' | sort); do
              echo "  -- $c"
              emisor=$(sudo docker exec "$c" sh -c 'echo "${DIRECTORIO_ACTIVO_URL:-}"' 2>/dev/null || true)
              [ -n "$emisor" ] && echo "     emisor de credenciales: $emisor"
              errores=$(sudo docker logs --since 1h "$c" 2>&1 \
                | grep -iE '"level":"(ERROR|WARN)"|ERROR|Exception' \
                | grep -viE 'DEBUG|TRACE' | tail -8 | cut -c1-220 || true)
              if [ -n "$errores" ]; then echo "$errores" | sed 's/^/     /'; else echo "     (sin errores en la ultima hora)"; fi
            done
