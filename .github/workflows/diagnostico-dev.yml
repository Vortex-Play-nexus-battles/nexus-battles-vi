# Diagnostico del host de DEV — M16A (infraestructura, red, datos, DR).
#
# Por que existe: el 19 de septiembre el despliegue fallo con
# "dial tcp :22: i/o timeout" y averiguar por que costo veinte minutos de ir
# mirando corridas una por una. La respuesta resulto ser sencilla —la instancia
# estaba apagada—, pero no habia forma de saberlo sin reconstruir el historial.
#
# Este workflow contesta en una corrida: si el host esta encendido, desde
# cuando, cuanta memoria y disco le quedan, que contenedores hay y cuales se
# han reiniciado, si el nucleo mato algo por falta de memoria, y como respondio
# cada servicio. No cambia nada: solo mira.
#
# No cuesta nada: un runner de GitHub y una sesion SSH.
name: Diagnostico del host DEV

on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: "Que host mirar"
        type: choice
        required: true
        default: dev
        options: [dev, contenido]

permissions:
  id-token: write
  contents: read

jobs:
  diagnostico:
    name: Estado del host de ${{ inputs.ambiente }}
    runs-on: ubuntu-latest
    environment: dev
    steps:
      # El host de contenido es del grupo 2 y vive en OTRA cuenta de AWS
      # (ver el job "desplegar-contenido-dev" de cd.yml, #656): su rol y su
      # region son variables distintas. Si la variable del rol de contenido
      # no esta configurada, se salta este paso y el diagnostico sigue
      # adelante por SSH -- la parte de EC2 es la unica que necesita AWS.
      - name: Asumir el rol de AWS por OIDC (sin claves)
        id: aws
        if: inputs.ambiente == 'dev' || vars.AWS_ROLE_ARN_CONTENIDO != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.ambiente == 'contenido' && vars.AWS_ROLE_ARN_CONTENIDO || vars.AWS_ROLE_ARN }}
          role-session-name: diagnostico-${{ github.run_id }}
          aws-region: ${{ inputs.ambiente == 'contenido' && (vars.AWS_REGION_CONTENIDO || 'us-east-1') || vars.AWS_REGION }}

      # Lo primero, porque es la causa mas probable y la mas barata de
      # descartar: si la instancia esta apagada, todo lo demas sobra.
      - name: Estado de la instancia en EC2
        if: steps.aws.outcome == 'success'
        env:
          NOMBRE_INSTANCIA: ${{ inputs.ambiente == 'contenido' && (vars.NOMBRE_INSTANCIA_CONTENIDO || 'nexus-contenido-dev') || 'nexus-plataforma-dev' }}
        run: |
          set -euo pipefail
          # Mismo nombre de etiqueta que infra-dev.yml (NOMBRE_INSTANCIA).
          id=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$NOMBRE_INSTANCIA" \
                      "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          if [ -z "$id" ] || [ "$id" = "None" ]; then
            echo "::warning::No existe la instancia. O no se ha hecho apply, o se destruyo."
            exit 0
          fi
          aws ec2 describe-instances --instance-ids "$id" \
            --query 'Reservations[0].Instances[0].{Id:InstanceId,Estado:State.Name,Tipo:InstanceType,IP:PublicIpAddress,Arranco:LaunchTime}' \
            --output table
          estado=$(aws ec2 describe-instances --instance-ids "$id" \
            --query 'Reservations[0].Instances[0].State.Name' --output text)
          if [ "$estado" != "running" ]; then
            echo "::error::La instancia esta $estado. Enciendela con el workflow 'Infra dev', accion start."
            exit 1
          fi

      # Ojo con el orden de las comprobaciones: memoria y disco ANTES que
      # docker, porque si falta cualquiera de las dos, lo que docker cuente es
      # consecuencia y no causa.
      - name: Que dice el host por dentro
        uses: appleboy/ssh-action@v1.0.3
        env:
          # La lista "servicio:puerto" que se consulta al final cambia segun
          # el host: plataforma publica 8081-8091, contenido 8101-8105 (y
          # 8092, ms-subastas, desde la topologia del 28-sep).
          PARES_SALUD: ${{ inputs.ambiente == 'contenido' && 'heroes:8101 inventario:8102 productos:8103 motor-combate:8104 misiones:8105' || 'comentarios:8081 correo:8082 torneos:8083 salas-partidas:8084 notificaciones:8085 moderacion-sanciones:8086 metricas-plataforma:8087 admin-parametros:8088 ms-identidad:8089' }}
        with:
          host: ${{ inputs.ambiente == 'contenido' && secrets.DEPLOY_HOST_CONTENIDO_DEV || secrets.DEPLOY_HOST_DEV }}
          username: ${{ inputs.ambiente == 'contenido' && secrets.SSH_USER_CONTENIDO_DEV || secrets.SSH_USER_DEV }}
          key: ${{ inputs.ambiente == 'contenido' && secrets.SSH_KEY_CONTENIDO_DEV || secrets.SSH_KEY_DEV }}
          envs: PARES_SALUD
          command_timeout: 3m
          script: |
            echo "============== IDENTIDAD REAL DE ESTA MAQUINA =============="
            # Quien es esta instancia SEGUN ELLA MISMA, no segun el workflow que
            # la consulta. Sale del servicio de metadatos de EC2 (169.254.169.254),
            # que no necesita credenciales de AWS y solo lee.
            #
            # Existe porque durante semanas se discutio de memoria si los dos
            # hosts estaban en la misma cuenta, y una suposicion equivocada ahi
            # termina en un tercer EC2 en la cuenta que no es (#666). El numero
            # de cuenta no es un secreto -- aparece en el ARN del rol que ya esta
            # en las variables del repositorio -- pero la clave privada de la
            # instancia si, y aqui no se toca nada de eso.
            TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" \
              -H "X-aws-ec2-metadata-token-ttl-seconds: 120" --max-time 5 || true)
            meta() {
              if [ -n "$TOKEN" ]; then
                curl -s --max-time 5 -H "X-aws-ec2-metadata-token: $TOKEN" "http://169.254.169.254/latest/$1" || true
              else
                curl -s --max-time 5 "http://169.254.169.254/latest/$1" || true
              fi
            }
            identidad=$(meta dynamic/instance-identity/document)
            if [ -n "$identidad" ]; then
              echo "$identidad" | sed 's/^/  /'
              mac=$(meta meta-data/mac)
              echo "  vpc-id:             $(meta meta-data/network/interfaces/macs/$mac/vpc-id)"
              echo "  subnet-id:          $(meta meta-data/network/interfaces/macs/$mac/subnet-id)"
              echo "  security-group-ids: $(meta meta-data/network/interfaces/macs/$mac/security-group-ids | tr '\n' ' ')"
              echo "  ip publica:         $(meta meta-data/public-ipv4)"
              echo "  perfil IAM:         $(meta meta-data/iam/info | tr -d '\n' | cut -c1-200)"
            else
              echo "  El servicio de metadatos no contesto (¿IMDS deshabilitado?)."
            fi

            echo
            echo "===================== ARRANQUE Y CARGA ====================="
            uptime
            echo "Ultimo arranque: $(who -b 2>/dev/null || stat -c %y /proc/1 2>/dev/null)"

            echo
            echo "===================== MEMORIA (MiB) ========================"
            free -m
            echo
            echo "  Swap configurado:"
            swapon --show 2>/dev/null | sed 's/^/    /' || echo "    (sin swap)"
            echo
            echo "Los cinco procesos que mas memoria usan:"
            ps -eo rss,comm --sort=-rss | head -6 | awk 'NR==1{print "  RSS(KB) PROCESO"} NR>1{printf "  %7d %s\n", $1, $2}'

            echo
            echo "===================== DISCO ================================"
            df -h / /var/lib/docker 2>/dev/null | sed 's/^/  /'
            echo "  Espacio que ocupa Docker:"
            sudo docker system df 2>/dev/null | sed 's/^/    /' || docker system df | sed 's/^/    /'

            echo
            echo "============ ¿EL NUCLEO MATO ALGO POR MEMORIA? ============="
            # Si esto imprime algo, la causa de una caida es OOM y no otra cosa.
            if sudo dmesg -T 2>/dev/null | grep -iE "out of memory|oom-killer|killed process" | tail -15; then :; else
              echo "  Nada en dmesg."
            fi
            sudo journalctl -k --since "7 days ago" 2>/dev/null \
              | grep -iE "out of memory|oom-killer" | tail -10 || echo "  Nada en journalctl."

            echo
            echo "===================== CONTENEDORES ========================="
            sudo docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.RestartCount}}' 2>/dev/null \
              || sudo docker ps -a --format 'table {{.Names}}\t{{.Status}}'
            echo
            echo "  Reinicios por contenedor (un numero alto es un servicio que no levanta):"
            for c in $(sudo docker ps -aq); do
              n=$(sudo docker inspect -f '{{.Name}}' "$c" | tr -d /)
              r=$(sudo docker inspect -f '{{.RestartCount}}' "$c")
              p=$(sudo docker inspect -f '{{.HostConfig.RestartPolicy.Name}}' "$c")
              printf '    %-28s reinicios=%-4s politica=%s\n' "$n" "$r" "$p"
            done

            echo
            echo "===================== MEMORIA POR CONTENEDOR ==============="
            sudo docker stats --no-stream \
              --format 'table {{.Name}}\t{{.MemUsage}}\t{{.MemPerc}}\t{{.CPUPerc}}'

            echo
            echo "=========== MEMORIA REAL POR CONTENEDOR (RAM + swap) ========="
            # docker stats solo cuenta lo que esta en RAM. Con el swap lleno,
            # un servicio que parece ocupar 55 MiB puede tener 200 mas fuera:
            # es la cifra que decide si moverlo a otro host libera algo de
            # verdad. Se lee del cgroup v2 de cada contenedor (memory.current y
            # memory.swap.current: todos sus procesos, tambien los backends de
            # Postgres); si el host no tiene cgroup v2, del proceso principal
            # en /proc. Solo numeros.
            printf '    %-28s %10s %10s %10s\n' "CONTENEDOR" "RAM" "SWAP" "TOTAL"
            total_ram=0; total_swap=0
            for c in $(sudo docker ps -q --no-trunc); do
              n=$(sudo docker inspect -f '{{.Name}}' "$c" | tr -d /)
              cg="/sys/fs/cgroup/system.slice/docker-${c}.scope"
              if [ -r "$cg/memory.current" ]; then
                rss=$(( $(sudo cat "$cg/memory.current") / 1048576 ))
                swp=$(( $(sudo cat "$cg/memory.swap.current" 2>/dev/null || echo 0) / 1048576 ))
              else
                pid=$(sudo docker inspect -f '{{.State.Pid}}' "$c")
                rss=$(sudo awk '/^VmRSS:/{print int($2/1024)}' "/proc/$pid/status" 2>/dev/null || echo 0)
                swp=$(sudo awk '/^VmSwap:/{print int($2/1024)}' "/proc/$pid/status" 2>/dev/null || echo 0)
              fi
              total_ram=$(( total_ram + ${rss:-0} )); total_swap=$(( total_swap + ${swp:-0} ))
              printf '    %-28s %6s MiB %6s MiB %6s MiB\n' "$n" "${rss:-0}" "${swp:-0}" "$(( ${rss:-0} + ${swp:-0} ))"
            done
            printf '    %-28s %6s MiB %6s MiB %6s MiB\n' "SUMA" "$total_ram" "$total_swap" "$(( total_ram + total_swap ))"

            echo
            echo "=========== CUANTA MEMORIA HAY COMPROMETIDA (mem_limit) ====="
            # La suma de los mem_limit declarados frente a la RAM real del
            # host: es lo que decide si cabe UN servicio mas sin empujar a
            # los que sostienen el MVP a swap. Un total muy por encima de la
            # RAM no es un error por si mismo (Docker no reserva), pero dice
            # cuanto se esta confiando en el swap.
            total_lim=0
            for c in $(sudo docker ps -q); do
              n=$(sudo docker inspect -f '{{.Name}}' "$c" | tr -d /)
              l=$(sudo docker inspect -f '{{.HostConfig.Memory}}' "$c")
              lm=$(( l / 1024 / 1024 ))
              total_lim=$(( total_lim + lm ))
              printf '    %-28s limite=%s MiB\n' "$n" "$lm"
            done
            ram=$(free -m | awk '/^Mem:/{print $2}')
            libre=$(free -m | awk '/^Mem:/{print $7}')
            echo "    ----"
            printf '    %-28s %s MiB\n' "SUMA DE LIMITES" "$total_lim"
            printf '    %-28s %s MiB\n' "RAM DEL HOST" "$ram"
            printf '    %-28s %s MiB\n' "RAM DISPONIBLE AHORA" "$libre"

            echo
            echo "===================== SALUD DE CADA SERVICIO ==============="
            # Los pares "servicio:puerto" los pone el workflow segun el host
            # (PARES_SALUD); ms-ecommerce y ms-finanzas son la excepcion
            # porque tienen context-path propio (/ecommerce y /api/v1).
            for par in $PARES_SALUD; do
              s=${par%%:*}; p=${par##*:}
              r=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://localhost:$p/actuator/health" || echo "---")
              printf '    %-24s %s\n' "$s" "$r"
            done
            for par in "ms-ecommerce:8090:/ecommerce" "ms-cumplimiento:8091:" \
                       "ms-subastas:8092:/api/v1" "ms-finanzas:8093:/api/v1"; do
              s=$(echo "$par" | cut -d: -f1); p=$(echo "$par" | cut -d: -f2); ctx=$(echo "$par" | cut -d: -f3)
              r=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://localhost:$p$ctx/actuator/health" || echo "---")
              printf '    %-24s %s\n' "$s" "$r"
            done

            echo
            echo "===================== RED ENTRE HOSTS ======================="
            # B12 — los puertos directos de plataforma solo admiten al host de
            # contenido (SG, cidr_servicios). Desde contenido, el JWKS de
            # ms-identidad (:8089) y el libro de creditos (:8093) tienen que
            # contestar; desde cualquier otro sitio, no. Solo codigos HTTP.
            #
            # 28-sep (topologia, fase 1): misiones y ms-subastas llaman desde
            # contenido tambien a notificaciones (8085), sanciones (8086),
            # parametros (8088) y correo (8082). Y en sentido contrario, el
            # borde de plataforma tiene que llegar a lo que se publica en
            # contenido: 8101-8105 y, segun la fase, 8092, 8090 y 8094. Esos los
            # abre el grupo 2 en SU grupo de seguridad (reglas-entrada.json);
            # "000" es un puerto que el grupo de seguridad todavia no admite o
            # un servicio que no corre.
            if ! sudo docker ps --format '{{.Names}}' | grep -q '^srv-ms-identidad$'; then
              for destino in "http://35.168.124.119:8089/api/v1/auth/jwks" "http://35.168.124.119:8093/api/v1/actuator/health" \
                             "http://35.168.124.119:8085/actuator/health" "http://35.168.124.119:8086/actuator/health" \
                             "http://35.168.124.119:8088/actuator/health" "http://35.168.124.119:8082/actuator/health"; do
                r=$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 "$destino" || echo "---")
                printf '    %-55s %s\n' "$destino" "$r"
              done
            else
              echo "    desde el borde hacia el host de contenido:"
              for destino in "http://34.193.90.11:8101/actuator/health" "http://34.193.90.11:8102/actuator/health" \
                             "http://34.193.90.11:8103/actuator/health" "http://34.193.90.11:8104/actuator/health" \
                             "http://34.193.90.11:8105/actuator/health" "http://34.193.90.11:8092/api/v1/actuator/health" \
                             "http://34.193.90.11:8090/ecommerce/actuator/health" "http://34.193.90.11:8094/api/v1/actuator/health"; do
                r=$(curl -s -o /dev/null -w '%{http_code}' --max-time 6 "$destino" || echo "---")
                printf '    %-55s %s\n' "$destino" "$r"
              done
            fi

            echo
            echo "===================== CORREO: ENTREGAS DE 7 DIAS ============"
            # B13 — evidencia de que el correo sale de verdad: por el
            # proveedor SMTP (destino PROVEEDOR) para las direcciones reales y
            # por el buzon de pruebas (BUZON_DE_PRUEBAS) para las reservadas
            # (.test). Solo recuentos por plantilla, estado y destino: ninguna
            # direccion, asunto ni contenido sale de la base.
            # Quien es el proveedor, sin imprimir el valor: SMTP_HOST es un
            # secret y el registro de Actions lo taparia igual. Basta la
            # familia (GMAIL, BREVO...) para saber si el remitente configurado
            # puede autenticarse con ese proveedor.
            if sudo docker ps --format '{{.Names}}' | grep -q '^srv-correo$'; then
              familia=$(sudo docker exec srv-correo sh -c 'h=$(printf "%s" "${SMTP_HOST:-}" | tr "A-Z" "a-z"); case "$h" in "") echo VACIO ;; *gmail.com) echo GMAIL ;; *brevo.com|*sendinblue.com) echo BREVO ;; *amazonaws.com) echo AMAZON_SES ;; *resend.com) echo RESEND ;; *mailjet.com) echo MAILJET ;; *sendgrid.net) echo SENDGRID ;; *smtp2go.com) echo SMTP2GO ;; *mailgun.org) echo MAILGUN ;; mailpit|localhost|127.0.0.1) echo BUZON_LOCAL ;; *) echo OTRO ;; esac' 2>/dev/null || echo "?")
              remitente=$(sudo docker exec srv-correo sh -c 'printf "%s" "${MAIL_FROM:-}" | sed "s/.*@//; s/>.*//" | tr "A-Z" "a-z"' 2>/dev/null || echo "?")
              echo "    proveedor SMTP (familia): $familia · dominio del remitente: ${remitente:-vacio}"
            fi
            if sudo docker ps --format '{{.Names}}' | grep -q '^plataforma-db$'; then
              sudo docker exec plataforma-db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At -F " | " -c "SELECT plantilla, estado, COALESCE(destino, chr(45)), count(*) FROM correo.envios WHERE creado_en > now() - interval '"'"'7 days'"'"' GROUP BY 1, 2, 3 ORDER BY 1, 2, 3"' 2>/dev/null \
                | sed 's/^/    /' || echo "    (sin tabla correo.envios)"
              # Las direcciones REALES (fuera de los dominios reservados de la
              # RFC 2606), desde siempre: si alguna vez salio una por el
              # proveedor, y cuando. La direccion no sale de la base.
              echo "  -- direcciones reales, desde siempre: estado | destino | cuantos | ultimo dia"
              sudo docker exec -i plataforma-db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At -F " | "' 2>/dev/null <<'SQL' | sed 's/^/    /' || true
            SELECT estado, COALESCE(destino, '-'), count(*), max(COALESCE(enviado_en, actualizado_en))::date
            FROM correo.envios
            WHERE split_part(lower(destinatario), '@', 2) !~ '(^|\.)(test|example|invalid|localhost)$'
              AND split_part(lower(destinatario), '@', 2) NOT IN ('example.com', 'example.net', 'example.org')
            GROUP BY 1, 2 ORDER BY 1, 2;
            SQL
            else
              echo "    (este host no tiene la base de plataforma)"
            fi

            echo
            echo "===================== BORDE ================================"
            curl -s --max-time 5 http://localhost/salud-borde || echo "  el borde no responde"

            echo
            echo "===================== ULTIMOS ERRORES POR SERVICIO ========="
            # Lo que el smoke no cuenta: POR QUE falla. Solo lineas de error de
            # la ultima hora, recortadas, sin cuerpos de peticion. Un servicio
            # sano imprime "(sin errores)". Se mira tambien la URL del emisor
            # de credenciales de cada uno (ADR-005): es configuracion, no
            # secreto, y una URL equivocada aqui explica un 500 en cadena.
            for c in $(sudo docker ps --format '{{.Names}}' | grep '^srv-' | sort); do
              echo "  -- $c"
              emisor=$(sudo docker exec "$c" sh -c 'echo "${DIRECTORIO_ACTIVO_URL:-}"' 2>/dev/null || true)
              [ -n "$emisor" ] && echo "     emisor de credenciales: $emisor"
              errores=$(sudo docker logs --since 1h "$c" 2>&1 \
                | grep -iE '"level":"(ERROR|WARN)"|ERROR|Exception' \
                | grep -viE 'DEBUG|TRACE' | tail -8 | cut -c1-220 || true)
              if [ -n "$errores" ]; then echo "$errores" | sed 's/^/     /'; else echo "     (sin errores en la ultima hora)"; fi
            done

      # R17 — ms-identidad deja ddl-auto=update y pasa a Flyway + validate. Antes
      # de desplegarlo hay que saber como es DE VERDAD el esquema que Hibernate
      # fue creando en DEV, para probar la migracion contra el y no contra lo que
      # uno supone. Solo estructura: tablas, columnas, tipos y restricciones, y
      # un recuento de filas por tabla. Ni una fila de datos, ni un valor.
      - name: Esquema de ms-identidad (solo estructura)
        if: inputs.ambiente == 'dev'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST_DEV }}
          username: ${{ secrets.SSH_USER_DEV }}
          key: ${{ secrets.SSH_KEY_DEV }}
          command_timeout: 2m
          script: |
            echo "============== ESQUEMA DE ms-identidad (sin datos) =========="
            if ! sudo docker ps --format '{{.Names}}' | grep -qx identidad-db; then
              echo "  identidad-db no esta en marcha"
              exit 0
            fi
            sudo docker exec identidad-db sh -c 'pg_dump --schema-only --no-owner --no-privileges -U "$POSTGRES_USER" -d "$POSTGRES_DB"' \
              | grep -vE '^(--|SET |SELECT pg_catalog)' | cat -s
            echo
            echo "  historial de Flyway (vacio antes de R17):"
            sudo docker exec identidad-db sh -c 'psql -At -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT version, type, success FROM flyway_schema_history ORDER BY installed_rank"' 2>&1 | sed 's/^/    /'
            echo "  filas por tabla (solo el recuento):"
            sudo docker exec identidad-db sh -c 'psql -At -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT relname, n_live_tup FROM pg_stat_user_tables ORDER BY relname"' 2>&1 | sed 's/^/    /'
            # R17 — como va el alta de los jugadores nuevos, en agregados: cuantas
            # altas hay en cada estado y, por paso, cuantos hechos, pendientes o
            # con error, con la CAUSA del ultimo error (el prefijo que escribe
            # PasoFallido: SERVICIO_NO_DISPONIBLE, CONFIGURACION_INCOMPLETA...).
            # Ni un uid, ni un correo, ni un apodo: solo recuentos y causas.
            if sudo docker exec identidad-db sh -c 'psql -At -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT to_regclass('"'"'onboarding_jugador'"'"')"' | grep -q onboarding_jugador; then
              echo "  altas por estado:"
              sudo docker exec identidad-db sh -c 'psql -At -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT estado, count(*), max(intentos) FROM onboarding_jugador GROUP BY estado ORDER BY estado"' 2>&1 | sed 's/^/    /'
              echo "  pasos por estado (con la causa del ultimo error):"
              sudo docker exec identidad-db sh -c 'psql -At -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT paso, estado, count(*), coalesce(split_part(max(ultimo_error), '"'"':'"'"', 1), '"'"'-'"'"') FROM onboarding_paso GROUP BY paso, estado ORDER BY paso, estado"' 2>&1 | sed 's/^/    /'
            fi