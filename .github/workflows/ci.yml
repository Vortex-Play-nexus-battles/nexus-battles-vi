name: CI - Integracion continua

# HU-CICD-001 (SCRUM-164): compila, prueba, analiza y publica cobertura de cada
# servicio modificado en un push o pull request contra develop. No toca ningun
# pom.xml ni build.gradle de otros equipos: cada servicio se compila/prueba con
# su propia herramienta (gradlew de la raiz para Gradle, mvnw propio para Maven).

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

# Permiso minimo: el pipeline solo necesita leer el repo para compilar/probar.
permissions:
  contents: read

# Si llega un push nuevo a la misma rama/PR mientras una corrida anterior sigue
# activa, cancela la anterior en vez de acumular corridas redundantes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  JAVA_DISTRIBUTION: "temurin"
  SONAR_HOST_URL: "https://sonarcloud.io"
  # Organization key de SonarQube Cloud (Vortex-Play-nexus-battles).
  SONAR_ORGANIZATION: "vortex-play-nexus-battles"

jobs:
  # ---------------------------------------------------------------------
  # Job 1: detecta que servicios cambiaron en este push/PR y con que
  # herramienta de build se compilan (Gradle o Maven), comparando contra el
  # commit padre (push) o contra la base del PR. El resto del pipeline
  # SOLO corre para esos servicios, nunca para los ~20 del monorepo.
  # ---------------------------------------------------------------------
  detectar-servicios:
    name: Detectar servicios modificados
    runs-on: ubuntu-latest
    outputs:
      servicios: ${{ steps.detectar.outputs.servicios }}
      hay_servicios: ${{ steps.detectar.outputs.hay_servicios }}
    steps:
      - name: Descargar el repositorio con historial completo
        uses: actions/checkout@v4
        with:
          # fetch-depth 0 trae todo el historial: lo necesitamos para poder
          # diferenciar contra el commit padre o contra la base del PR.
          fetch-depth: 0

      - name: Calcular servicios modificados y su herramienta de build
        id: detectar
        shell: bash
        run: |
          set -euo pipefail

          # 1) Resolver el rango de commits a comparar segun el tipo de evento.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            ZERO="0000000000000000000000000000000000000000"
            if [ "$BASE" = "$ZERO" ] || [ -z "$BASE" ]; then
              # Push del primer commit de la rama (no hay "before" real):
              # comparamos contra el padre del commit actual si existe, o
              # contra el arbol vacio de git si es el primer commit del repo.
              if git rev-parse "$HEAD^" >/dev/null 2>&1; then
                BASE=$(git rev-parse "$HEAD^")
              else
                BASE="4b825dc642cb6eb9a060e54bf8d69288fbee4904"
              fi
            fi
          fi

          echo "Comparando $BASE..$HEAD"

          # 2) Listar archivos modificados y quedarnos con las carpetas de
          # servicio de tercer nivel: services/<equipo>/<servicio>/...
          ARCHIVOS=$(git diff --name-only "$BASE" "$HEAD")
          CARPETAS=$(echo "$ARCHIVOS" | grep -E '^services/[^/]+/[^/]+/' | awk -F'/' '{print $1"/"$2"/"$3}' | sort -u || true)

          # 3) Para cada carpeta, decidir la herramienta de build mirando si
          # existe build.gradle (Gradle) o pom.xml (Maven) ahi mismo. Una
          # carpeta sin ninguno de los dos (servicio aun no inicializado, solo
          # con README.md) se omite: no hay nada que compilar todavia.
          MATRIZ="[]"
          for carpeta in $CARPETAS; do
            if [ -f "$carpeta/build.gradle" ]; then
              herramienta="gradle"
              # Ruta de proyecto Gradle, ej: services/plataforma/correo -> :services:plataforma:correo
              ruta_gradle=":$(echo "$carpeta" | tr '/' ':')"
            elif [ -f "$carpeta/pom.xml" ]; then
              herramienta="maven"
              ruta_gradle=""
            else
              echo "Se omite $carpeta: no tiene build.gradle ni pom.xml"
              continue
            fi

            servicio_slug=$(echo "$carpeta" | sed 's#^services/##' | tr '/' '-')
            sonar_project_key="nexus-battles-vi_${servicio_slug}"

            MATRIZ=$(echo "$MATRIZ" | jq -c \
              --arg ruta "$carpeta" \
              --arg herramienta "$herramienta" \
              --arg rutaGradle "$ruta_gradle" \
              --arg servicio "$servicio_slug" \
              --arg sonarProjectKey "$sonar_project_key" \
              '. + [{ruta:$ruta, herramienta:$herramienta, rutaGradle:$rutaGradle, servicio:$servicio, sonarProjectKey:$sonarProjectKey}]')
          done

          echo "Servicios detectados: $MATRIZ"
          echo "servicios=$MATRIZ" >> "$GITHUB_OUTPUT"

          CANTIDAD=$(echo "$MATRIZ" | jq 'length')
          if [ "$CANTIDAD" -gt 0 ]; then
            echo "hay_servicios=true" >> "$GITHUB_OUTPUT"
          else
            echo "hay_servicios=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------
  # Job 1b: cambios TRANSVERSALES. El job de arriba solo mira
  # services/<equipo>/<servicio>/, asi que un cambio en shared/libs,
  # buildSrc o los contratos no ejecutaba absolutamente nada: una regresion
  # en plataforma-seguridad, que usan salas-partidas y moderacion-sanciones,
  # entraba a develop sin que nadie compilara. Aqui se compila y prueba el
  # monorepo Gradle entero, que es lo unico que cubre ese caso.
  #
  # No sustituye al job por servicio: aquel corre siempre que cambia un
  # servicio y ademas publica cobertura y analisis estatico por modulo.
  # ---------------------------------------------------------------------
  ci-transversal:
    name: CI - cambios transversales
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio con historial completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detectar si cambio algo transversal
        id: detectar
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=$(git merge-base "origin/${{ github.base_ref }}" "${{ github.sha }}")
          else
            BASE="${{ github.event.before }}"
            ZERO="0000000000000000000000000000000000000000"
            if [ "$BASE" = "$ZERO" ] || [ -z "$BASE" ]; then
              BASE=$(git rev-parse "${{ github.sha }}^" 2>/dev/null || echo "4b825dc642cb6eb9a060e54bf8d69288fbee4904")
            fi
          fi
          CAMBIOS=$(git diff --name-only "$BASE" "${{ github.sha }}" \
            | grep -E '^(shared/libs/|buildSrc/|contracts/|settings\.gradle|build\.gradle|gradle/)' || true)
          if [ -n "$CAMBIOS" ]; then
            echo "Cambios transversales detectados:"
            echo "$CAMBIOS"
            echo "hay=true" >> "$GITHUB_OUTPUT"
          else
            echo "Sin cambios transversales."
            echo "hay=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurar JDK 21 (Temurin)
        if: steps.detectar.outputs.hay == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Dar permiso de ejecucion al wrapper
        if: steps.detectar.outputs.hay == 'true'
        run: chmod +x ./gradlew

      # Todo el monorepo Gradle: compila los 14 servicios y las bibliotecas
      # compartidas, y corre sus pruebas (incluidos los IT de arranque, que
      # levantan contenedores con Testcontainers -- el runner trae Docker).
      - name: Compilar y probar todo el monorepo Gradle
        if: steps.detectar.outputs.hay == 'true'
        run: ./gradlew build --no-daemon

      - name: Publicar los informes de prueba si algo falla
        if: failure() && steps.detectar.outputs.hay == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: informes-de-prueba-transversal
          path: "**/build/reports/tests/test/**"
          retention-days: 7

  # ---------------------------------------------------------------------
  # Job 1-bis: el frontend.
  #
  # Hasta ahora la compuerta de calidad solo miraba Java: un PR que tocaba
  # unicamente `frontend/app-web/` entraba a develop sin ejecutar una sola
  # prueba de JavaScript, aunque el arnes de Jest existe desde el Sprint 1 y
  # tiene cientos de casos. Quedo demostrado en el PR #409, que se fusiono con
  # la matriz de servicios en "skipped" y ninguna prueba de front ejecutada.
  # La regla 11 no distingue lenguajes: esto lo corrige.
  #
  # Corre siempre, y decide dentro si hay algo que probar. Asi el check existe
  # en todos los PR y se puede exigir en el ruleset sin bloquear a los que no
  # tocan el frontend.
  # ---------------------------------------------------------------------
  ci-frontend:
    name: CI - frontend app-web
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio con historial completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detectar si cambio el frontend
        id: detectar
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=$(git merge-base "origin/${{ github.base_ref }}" "${{ github.sha }}")
          else
            BASE="${{ github.event.before }}"
            ZERO="0000000000000000000000000000000000000000"
            if [ "$BASE" = "$ZERO" ] || [ -z "$BASE" ]; then
              BASE=$(git rev-parse "${{ github.sha }}^" 2>/dev/null || echo "4b825dc642cb6eb9a060e54bf8d69288fbee4904")
            fi
          fi
          # shared/ui-kit tambien cuenta: las vistas importan sus modulos JS
          # (barra-vida.js entre otros) y romperlo rompe el frontend.
          CAMBIOS=$(git diff --name-only "$BASE" "${{ github.sha }}" \
            | grep -E '^(frontend/app-web/|shared/ui-kit/)' || true)
          if [ -n "$CAMBIOS" ]; then
            echo "Cambios en el frontend:"
            echo "$CAMBIOS"
            echo "hay=true" >> "$GITHUB_OUTPUT"
          else
            echo "Sin cambios en el frontend."
            echo "hay=false" >> "$GITHUB_OUTPUT"
          fi
          # La lista se guarda para el paso de calidad de mas abajo, que solo
          # exige ESLint y Prettier sobre lo que este cambio toca. Se filtran
          # los borrados: un archivo que ya no existe no se puede analizar.
          echo "$CAMBIOS" \
            | grep -E '^frontend/app-web/src/' \
            | while read -r archivo; do [ -f "$archivo" ] && echo "${archivo#frontend/app-web/}"; done \
            > "$RUNNER_TEMP/cambios-frontend.txt" || true
          echo "Archivos que tendran que pasar ESLint y Prettier:"
          cat "$RUNNER_TEMP/cambios-frontend.txt"

      - name: Configurar Node 22
        if: steps.detectar.outputs.hay == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/app-web/package-lock.json

      # `npm ci` y no `npm install`: instala exactamente lo del lock, que es lo
      # unico reproducible (regla de entornos, HU-POR-003).
      - name: Instalar dependencias
        if: steps.detectar.outputs.hay == 'true'
        working-directory: frontend/app-web
        run: npm ci

      # Las 43 suites de Jest estan en verde sobre develop (556 casos
      # comprobados antes de anadir este job), asi que este paso SI bloquea.
      - name: Pruebas unitarias (Jest)
        if: steps.detectar.outputs.hay == 'true'
        working-directory: frontend/app-web
        run: npm test

      # ESLint y Prettier SI bloquean, sobre los archivos que el cambio toca.
      #
      # El umbral es el de siempre: cero errores de ESLint y formato de
      # Prettier. Lo que se acota es el ALCANCE, y por un motivo concreto:
      # `develop` arrastra 1 error de ESLint y 22 archivos sin formatear, y los
      # 23 estan dentro de PR abiertos de otros equipos (#270, #390, #408,
      # #419). Exigirlos hoy en todo el arbol dejaria a los tres equipos sin
      # poder fusionar por deuda que no les toca arreglar en su PR, y
      # arreglarsela nosotros seria reformatear cientos de lineas de archivos
      # que otra persona tiene abiertos.
      #
      # Con este alcance, todo lo que entre a partir de ahora pasa la compuerta
      # entera, y la deuda se apaga sola conforme sus duenos toquen esos
      # archivos. Los dos pasos informativos de abajo la mantienen a la vista
      # para que no crezca en silencio.
      #
      # Alcance: `frontend/app-web/src/`. `shared/ui-kit/` queda fuera porque
      # tampoco lo cubren hoy `npm run lint` ni `npm run format:check` (los dos
      # apuntan a `src`), y meterlo aqui sin meterlo alli dejaria dos
      # comportamientos distintos para la misma carpeta. Es una decision aparte.
      - name: ESLint y Prettier sobre lo que cambia (bloqueante)
        if: steps.detectar.outputs.hay == 'true'
        working-directory: frontend/app-web
        shell: bash
        run: |
          set -euo pipefail
          LISTA="$RUNNER_TEMP/cambios-frontend.txt"
          if [ ! -s "$LISTA" ]; then
            echo "El cambio no toca ningun archivo de src/: nada que analizar."
            exit 0
          fi

          mapfile -t TODOS < "$LISTA"
          mapfile -t JS < <(grep -E '\.(js|mjs|cjs)$' "$LISTA" || true)

          if [ "${#JS[@]}" -gt 0 ]; then
            echo "== ESLint sobre ${#JS[@]} archivo(s)"
            npx eslint "${JS[@]}"
          fi

          echo "== Prettier sobre ${#TODOS[@]} archivo(s)"
          npx prettier --check "${TODOS[@]}"

      # Los dos de abajo miran TODO el arbol y no bloquean: son el termometro
      # de la deuda heredada, no una compuerta.
      - name: Analisis estatico de todo src (ESLint) — informativo
        if: steps.detectar.outputs.hay == 'true'
        continue-on-error: true
        working-directory: frontend/app-web
        run: npm run lint

      - name: Formato de todo src (Prettier) — informativo
        if: steps.detectar.outputs.hay == 'true'
        continue-on-error: true
        working-directory: frontend/app-web
        run: npm run format:check

      # Pruebas de aceptacion en navegador (Playwright sobre http-server con
      # rutas simuladas, sin backend): hoy son las 46 de inventario (Grupo 2)
      # y 45 fallan porque abren la vista sin sesion (#581). Informativo,
      # no bloqueante, por la misma razon que ESLint/Prettier de todo el
      # arbol: la deuda es de otro equipo y bloquear aqui pararia a los tres.
      # Cuando #581 se cierre en verde, se vuelve bloqueante quitando
      # `continue-on-error`.
      - name: Aceptacion en navegador (Playwright) — informativo (#581)
        if: steps.detectar.outputs.hay == 'true'
        continue-on-error: true
        working-directory: frontend/app-web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --config=playwright.config.js --reporter=list

      - name: Guardar el informe de aceptacion
        if: always() && steps.detectar.outputs.hay == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: informe-aceptacion
          path: frontend/app-web/test-results/**
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------
  # Job 2: por cada servicio detectado (uno por entrada de la matriz),
  # ejecuta en orden: compilar -> pruebas unitarias -> analisis estatico ->
  # publicar cobertura. fail-fast:false para que la falla de un servicio no
  # cancele la corrida de los demas servicios modificados en el mismo push.
  # ---------------------------------------------------------------------
  ci:
    name: CI - ${{ matrix.servicio }}
    needs: detectar-servicios
    if: needs.detectar-servicios.outputs.hay_servicios == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detectar-servicios.outputs.servicios) }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          # setup-java cachea el repositorio local de dependencias segun la
          # herramienta usada, para no descargar todo en cada corrida.
          cache: ${{ matrix.herramienta }}

      # -------------------- Rama Gradle --------------------
      # Los servicios Gradle son subproyectos del build raiz (ver
      # settings.gradle), por eso se invocan con el gradlew de la raiz del
      # repo y la ruta de proyecto calculada en el job anterior
      # (ej: :services:plataforma:correo).

      - name: (Gradle) Dar permiso de ejecucion al wrapper
        if: matrix.herramienta == 'gradle'
        run: chmod +x ./gradlew

      - name: (Gradle) Compilar
        if: matrix.herramienta == 'gradle'
        run: ./gradlew ${{ matrix.rutaGradle }}:compileJava ${{ matrix.rutaGradle }}:compileTestJava --no-daemon

      - name: (Gradle) Ejecutar pruebas y la compuerta de cobertura
        if: matrix.herramienta == 'gradle'
        # "check" y no "test": arrastra las pruebas MAS
        # jacocoTestCoverageVerification, que es la compuerta del 80 % que
        # exigen la regla 11 de plataforma y el punto (d) del Definition of
        # Done. Con ":test" la verificacion no se ejecutaba nunca, ni siquiera
        # en motor-combate, que era el unico modulo que la tenia enganchada.
        #
        # jacoco se configura una sola vez en buildSrc/nexus.spring-conventions.gradle
        # (finalizedBy jacocoTestReport, con xml.required=true), asi que el
        # informe sigue quedando en build/reports/jacoco/test/jacocoTestReport.xml.
        run: ./gradlew ${{ matrix.rutaGradle }}:check --no-daemon

      # El log de Gradle resume las excepciones; el informe HTML/XML trae el
      # mensaje completo. Sin esto, diagnosticar un fallo de integracion
      # obligaba a reproducirlo en la maquina de alguien.
      - name: Publicar los informes de prueba si algo falla
        if: failure() && matrix.herramienta == 'gradle'
        uses: actions/upload-artifact@v4
        with:
          name: informes-de-prueba-${{ matrix.servicio }}
          path: |
            ${{ matrix.ruta }}/build/reports/tests/test/**
            ${{ matrix.ruta }}/build/test-results/test/**
            ${{ matrix.ruta }}/build/reports/jacoco/test/**
          retention-days: 7

      # Cuando la compuerta de cobertura falla, Gradle dice "Rule violated" y el
      # porcentaje, pero no QUE clases faltan. Esto lo deja en el log para no
      # tener que descargar el informe.
      - name: (Gradle) Que quedo sin cubrir, si la compuerta fallo
        if: failure() && matrix.herramienta == 'gradle'
        shell: bash
        run: |
          set -uo pipefail
          XML="${{ matrix.ruta }}/build/reports/jacoco/test/jacocoTestReport.xml"
          [ -f "$XML" ] || { echo "Sin informe de JaCoCo: el fallo fue antes."; exit 0; }
          echo "Clases con lineas sin cubrir en ${{ matrix.servicio }} (sin cubrir / cubiertas):"
          grep -o '<class name="[^"]*"[^>]*>.\{0,400\}' "$XML" \
            | sed -E 's|<class name="([^"]*)".*counter type="LINE" missed="([0-9]+)" covered="([0-9]+)".*|\2 sin cubrir, \3 cubiertas  \1|' \
            | grep -vE '^0 ' | sort -rn | head -25 || true

      - name: (Gradle) Analisis estatico con SonarQube Cloud
        if: matrix.herramienta == 'gradle'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # El plugin de Sonar no esta declarado en build.gradle (no debemos
        # tocar ese archivo), asi que se inyecta solo para esta corrida de CI
        # mediante un init script (ver sonar-init.gradle en esta misma carpeta).
        #
        # Se invoca la tarea "sonar" DEL SERVICIO, no la del proyecto raiz
        # (issue #198). La del raiz analiza el monorepo entero, asi que cada job
        # subia los 20 modulos a la clave de proyecto de su servicio habiendo
        # ejecutado las pruebas de uno solo; los otros 19 aportaban cero
        # cobertura y la compuerta fallaba siempre, con cualquier cobertura real.
        #
        # Tampoco se pasan ya projectBaseDir, sources, tests ni la ruta del XML
        # de JaCoCo: eran relativas a la raiz del repo, pero Sonar las resuelve
        # contra el directorio base de cada modulo, y ademas se heredaban como
        # propiedad global en todos ellos. El plugin de Gradle deduce las cuatro
        # del propio proyecto, y la de JaCoCo la toma de la tarea
        # jacocoTestReport que ya configura buildSrc/nexus.spring-conventions
        # (xml.required = true). Asi vale igual para los 20 servicios, sin
        # ninguna ruta escrita a mano.
        #
        # sonar.qualitygate.wait=true hace que esta tarea falle si el Quality
        # Gate de SonarQube Cloud queda en rojo (cubre CA-03: cobertura < 80%).
        run: |
          ./gradlew ${{ matrix.rutaGradle }}:sonar --no-daemon --refresh-dependencies \
            --init-script .github/workflows/sonar-init.gradle \
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }} \
            -Dsonar.host.url=${{ env.SONAR_HOST_URL }} \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.projectKey=${{ matrix.sonarProjectKey }} \
            -DmoduloObjetivo=${{ matrix.rutaGradle }} \
            -Dsonar.qualitygate.wait=true

      - name: (Gradle) Publicar reporte de cobertura
        if: matrix.herramienta == 'gradle' && always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-${{ matrix.servicio }}
          path: ${{ matrix.ruta }}/build/reports/jacoco/test/
          if-no-files-found: warn

      # -------------------- Rama Maven --------------------
      # Los servicios Maven son proyectos independientes con su propio
      # wrapper (mvnw), por eso se ejecutan parados dentro de su carpeta.

      - name: (Maven) Dar permiso de ejecucion al wrapper
        if: matrix.herramienta == 'maven'
        run: chmod +x ${{ matrix.ruta }}/mvnw

      - name: (Maven) Compilar
        if: matrix.herramienta == 'maven'
        working-directory: ${{ matrix.ruta }}
        run: ./mvnw -B compile

      - name: (Maven) Ejecutar pruebas unitarias
        if: matrix.herramienta == 'maven'
        working-directory: ${{ matrix.ruta }}
        # jacoco-maven-plugin tiene el goal "report" atado a la fase test,
        # entonces "mvn test" ya deja el reporte de cobertura en target/site/jacoco.
        run: ./mvnw -B test

      - name: (Maven) Analisis estatico con SonarQube Cloud
        if: matrix.herramienta == 'maven'
        working-directory: ${{ matrix.ruta }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # Se invoca el plugin de Sonar por sus coordenadas completas, sin
        # declararlo en el pom.xml (ese archivo no se toca). Misma logica de
        # Quality Gate que en la rama Gradle: falla si la cobertura < 80%.
        run: |
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:4.0.0.4121:sonar \
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }} \
            -Dsonar.host.url=${{ env.SONAR_HOST_URL }} \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.projectKey=${{ matrix.sonarProjectKey }} \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true

      - name: (Maven) Publicar reporte de cobertura
        if: matrix.herramienta == 'maven' && always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-${{ matrix.servicio }}
          path: ${{ matrix.ruta }}/target/site/jacoco/
          if-no-files-found: warn

  # ---------------------------------------------------------------------
  # CA-02: notificacion inmediata ante falla, en la misma ejecucion, al
  # canal del equipo. La eleccion del canal (Discord, Slack, Teams...) sigue
  # siendo del equipo: este job solo actua si existe el secret
  # WEBHOOK_NOTIFICACIONES con la URL de un webhook entrante, y solo cuando
  # algo fallo (en verde no hace ruido). Sin el secret, GitHub sigue enviando
  # su correo al autor del push y a los observadores del repositorio, que es
  # lo que cubria el criterio hasta hoy. Mismo cuerpo que en cd.yml:
  # "content" para Discord y "text" para Slack/Teams.
  # ---------------------------------------------------------------------
  notificar-fallo:
    name: Avisar al canal del equipo si algo fallo
    needs: [detectar-servicios, ci-transversal, ci-frontend, ci]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    env:
      WEBHOOK: ${{ secrets.WEBHOOK_NOTIFICACIONES }}
    steps:
      - name: Enviar el aviso de fallo
        if: env.WEBHOOK != ''
        env:
          RESULTADOS: >-
            transversal=${{ needs.ci-transversal.result }}
            frontend=${{ needs.ci-frontend.result }}
            servicios=${{ needs.ci.result }}
          CORRIDA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REFERENCIA: ${{ github.head_ref || github.ref_name }}
          COMMIT: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        shell: bash
        run: |
          set -euo pipefail
          TEXTO=":x: CI FALLO en $REFERENCIA (${COMMIT:0:7}, por $ACTOR) - $RESULTADOS - $CORRIDA"
          CUERPO=$(jq -cn --arg t "$TEXTO" '{content: $t, text: $t}')
          CODIGO=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d "$CUERPO" "$WEBHOOK" || echo "000")
          echo "Aviso enviado al canal del equipo: HTTP $CODIGO"
          case "$CODIGO" in 2*) exit 0 ;; *) echo "::warning::El canal del equipo respondio $CODIGO; el resultado de CI no depende de esto." ;; esac
      - name: Sin canal configurado
        if: env.WEBHOOK == ''
        run: |
          echo "Sin secret WEBHOOK_NOTIFICACIONES: no se avisa a ningun canal (GitHub sigue avisando por correo al autor)."
