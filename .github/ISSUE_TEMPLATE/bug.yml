name: Bug
description: Defecto encontrado en algo ya integrado en main.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: descripcion
    attributes:
      label: Descripcion
      description: Que esta fallando, en una o dos frases.
    validations:
      required: true

  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      description: Numerados. Deben permitir a otra persona reproducirlo.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado
      description: Que deberia ocurrir segun el requisito.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Resultado actual
      description: Que ocurre en realidad.
    validations:
      required: true

  - type: dropdown
    id: modulo
    attributes:
      label: Modulo
      options:
        - Seguridad y acceso
        - Usuarios y comentarios
        - Roles y permisos
        - Jugador e inventario
        - Heroes y personajes
        - Administracion de productos
        - Carro de compras
        - Pagos
        - Subastas
        - Misiones
        - Torneos
        - Juego en linea
        - Chatbot
        - Correo electronico
        - Notificaciones
        - Comentarios
        - Auditoria
        - Privacidad
        - Metricas y analitica
        - Administracion general
        - Infraestructura
        - CI/CD
    validations:
      required: true

  - type: dropdown
    id: grupo
    attributes:
      label: Grupo responsable
      options:
        - Simon (grupo-omega) - Tiempo real, comunidad y plataforma
        - Thomas (grupo-alpha) - Contenido, simulacion y progresion
        - Santiago (grupo-beta) - Cuentas, cumplimiento y economia
        - Compartido - contracts / shared / infrastructure
        - No se sabe todavia
    validations:
      required: true

  - type: textarea
    id: evidencia
    attributes:
      label: Evidencia
      description: Capturas, logs o mensajes de error. NO pegar credenciales ni datos personales reales.
    validations:
      required: true

  - type: dropdown
    id: severidad
    attributes:
      label: Severidad
      options:
        - Critica - bloquea el juego o compromete datos o pagos (mismo dia)
        - Alta - funcionalidad principal inutilizable, sin alternativa (2 dias)
        - Media - funcionalidad afectada con alternativa (Sprint actual)
        - Baja - cosmetico o menor (cuando haya capacidad)
    validations:
      required: true

  - type: dropdown
    id: entorno
    attributes:
      label: Entorno
      options:
        - Local de desarrollo
        - Desarrollo
        - Pruebas
        - Produccion
    validations:
      required: true

  - type: input
    id: requisito
    attributes:
      label: Requisito incumplido
      description: Identificador del SRS, si se conoce.
      placeholder: RF-SUB-003
    validations:
      required: false
