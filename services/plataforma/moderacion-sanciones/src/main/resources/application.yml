server:
  port: 8086

spring:
  mvc:
    problemdetails:
      enabled: true
  # Quien emite los tokens que este servicio acepta: ms-identidad, que publica
  # su clave publica en /api/v1/auth/jwks. Misma configuracion que
  # salas-partidas; el dia que la identidad se mueva a Keycloak solo cambia la
  # URL, por variable de entorno. Ver
  # docs/gobierno/ADR-002-identidad-de-usuario.md.
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTIDAD_JWKS_URL:http://localhost:8089/api/v1/auth/jwks}
  cache:
    type: redis
    redis:
      # La lista negra se cachea con caducidad (antes no caducaba nunca): cada
      # escritura del panel la vacia, y la caducidad cubre lo que la
      # invalidacion no ve (un INSERT a mano, una carrera). 5 min por omision.
      time-to-live: ${LISTA_NEGRA_CACHE_TTL:5m}
  data:
    redis:
      url: ${DB_MEMORIA_URL:redis://localhost:6379}
      # Si Redis no esta, la verificacion sigue contra PostgreSQL
      # (ErroresDeCacheTolerados); estos tiempos acotan cuanto cuesta
      # descubrirlo en cada peticion.
      timeout: ${DB_MEMORIA_TIMEOUT:500ms}
      connect-timeout: ${DB_MEMORIA_TIMEOUT_CONEXION:500ms}
  datasource:
    url: ${DB_RELACIONAL_URL:jdbc:postgresql://localhost:5432/plataformadb}
    username: ${DB_USER:usuario_nexus}
    password: ${DB_PASS:password_secreta_123}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: moderacion_sanciones
  flyway:
    schemas: moderacion_sanciones
    default-schema: moderacion_sanciones

# --- Sanciones (HU-USR-004..007) y sus avisos (HU-NOT-005) -------------------
sanciones:
  suspension:
    # Rango de una suspension temporal. La ficha habla de horas, dias o
    # semanas y no fija el tope: 30 dias por defecto, decision D-20.
    minima-horas: ${SANCIONES_SUSPENSION_MINIMA_HORAS:1}
    maxima-dias: ${SANCIONES_SUSPENSION_MAXIMA_DIAS:30}
  apelacion:
    # Plazo para apelar una sancion desde su emision (HU-USR-007). Respaldo:
    # el valor vigente lo da admin-parametros (sanciones.apelacion.plazo-dias).
    plazo-dias: ${SANCIONES_APELACION_PLAZO_DIAS:30}
  parametros:
    # HU-ADM-001 (CA-04): rango de la suspension y plazo de apelacion por API
    # de admin-parametros. Vacio = solo las variables de entorno de arriba.
    url: ${PARAMETROS_URL:}
    cache-segundos: ${SANCIONES_PARAMETROS_CACHE_SEGUNDOS:30}
  notificaciones:
    # Bandeja del jugador (contracts/openapi/notificaciones.yaml, /internal
    # exige la credencial de servicio de ADR-005: DIRECTORIO_ACTIVO_*).
    url: ${NOTIFICACIONES_URL:http://localhost:8085/api/v1}
  identidad:
    # 7.3.2 (B2): proyeccion del estado de la cuenta y contacto para el correo
    # (ms-identidad-admin.yaml, /api/v1/internal/usuarios/**; token de servicio).
    # Sin /api/v1: la ruta ya lo lleva.
    url: ${IDENTIDAD_URL:http://localhost:8089}
  correo:
    # 7.3.2 (B2): correo de la sancion (correo.yaml, POST /api/v1/correos/sancion).
    # Sin /api/v1: la ruta ya lo lleva.
    url: ${CORREO_URL:http://localhost:8082}
  avisos:
    # Cada cuanto se intentan las salidas pendientes (avisos, proyecciones y
    # correos; CA-04 de HU-NOT-005). Es tambien la primera espera tras un fallo.
    reintento-ms: ${SANCIONES_AVISOS_REINTENTO_MS:15000}
  salidas:
    # La espera entre reintentos se duplica con cada fallo hasta este tope.
    espera-maxima-ms: ${SANCIONES_SALIDAS_ESPERA_MAXIMA_MS:900000}
    timeout-conexion-ms: ${SANCIONES_SALIDAS_TIMEOUT_CONEXION_MS:2000}
    timeout-lectura-ms: ${SANCIONES_SALIDAS_TIMEOUT_LECTURA_MS:5000}

# --- Lista negra (HU-ADM-002; moderacion-lista-negra.yaml 2.0.x) ------------
lista-negra:
  # Que hace la politica de moderacion cuando un texto coincide, segun donde
  # se va a usar. Los valores por omision son la tabla del contrato; cada uno
  # se cambia por su variable. Solo RECHAZAR, REVISION o BLOQUEAR.
  accion:
    apodo: ${LISTA_NEGRA_ACCION_APODO:RECHAZAR}
    nombre-equipo: ${LISTA_NEGRA_ACCION_NOMBRE_EQUIPO:RECHAZAR}
    nombre-torneo: ${LISTA_NEGRA_ACCION_NOMBRE_TORNEO:RECHAZAR}
    nombre-sala: ${LISTA_NEGRA_ACCION_NOMBRE_SALA:RECHAZAR}
    comentario: ${LISTA_NEGRA_ACCION_COMENTARIO:REVISION}
    chat-general: ${LISTA_NEGRA_ACCION_CHAT_GENERAL:BLOQUEAR}
    chat-sala: ${LISTA_NEGRA_ACCION_CHAT_SALA:BLOQUEAR}
    mensaje-privado: ${LISTA_NEGRA_ACCION_MENSAJE_PRIVADO:BLOQUEAR}
    generico: ${LISTA_NEGRA_ACCION_GENERICO:RECHAZAR}

# Credencial de servicio (ADR-005) con la que este servicio habla a
# notificaciones, ms-identidad y correo. Sin client-id no se crea ninguna: las
# salidas quedan pendientes y en la bitacora.
seguridad:
  servicio:
    url: ${DIRECTORIO_ACTIVO_URL:}
    client-id: ${DIRECTORIO_ACTIVO_CLIENT_ID:}
    client-secret: ${DIRECTORIO_ACTIVO_CLIENT_SECRET:}

# Regla 3 de plataforma: todo servicio expone salud Y metricas. Hasta el
# 2026-09-21 este servicio solo exponia health (valor por omision de Actuator)
# y el tablero tecnico de HU-MET-004 lo veia como brecha de observabilidad.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
