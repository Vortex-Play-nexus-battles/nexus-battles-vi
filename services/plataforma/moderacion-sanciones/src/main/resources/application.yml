server:
  port: 8086

spring:
  mvc:
    problemdetails:
      enabled: true
  # Quien emite los tokens que este servicio acepta: ms-identidad, que publica
  # su clave publica en /api/v1/auth/jwks. Misma configuracion que
  # salas-partidas; el dia que la identidad se mueva a Keycloak solo cambia la
  # URL, por variable de entorno. Ver
  # docs/gobierno/ADR-002-identidad-de-usuario.md.
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTIDAD_JWKS_URL:http://localhost:8089/api/v1/auth/jwks}
  cache:
    type: redis
  data:
    redis:
      url: ${DB_MEMORIA_URL:redis://localhost:6379}
  datasource:
    url: ${DB_RELACIONAL_URL:jdbc:postgresql://localhost:5432/plataformadb}
    username: ${DB_USER:usuario_nexus}
    password: ${DB_PASS:password_secreta_123}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: moderacion_sanciones
  flyway:
    schemas: moderacion_sanciones
    default-schema: moderacion_sanciones

# --- Sanciones (HU-USR-004..007) y sus avisos (HU-NOT-005) -------------------
sanciones:
  suspension:
    # Rango de una suspension temporal. La ficha habla de horas, dias o
    # semanas y no fija el tope: 30 dias por defecto, decision D-20.
    minima-horas: ${SANCIONES_SUSPENSION_MINIMA_HORAS:1}
    maxima-dias: ${SANCIONES_SUSPENSION_MAXIMA_DIAS:30}
  apelacion:
    # Plazo para apelar una sancion desde su emision (HU-USR-007). Respaldo:
    # el valor vigente lo da admin-parametros (sanciones.apelacion.plazo-dias).
    plazo-dias: ${SANCIONES_APELACION_PLAZO_DIAS:30}
  parametros:
    # HU-ADM-001 (CA-04): rango de la suspension y plazo de apelacion por API
    # de admin-parametros. Vacio = solo las variables de entorno de arriba.
    url: ${PARAMETROS_URL:}
    cache-segundos: ${SANCIONES_PARAMETROS_CACHE_SEGUNDOS:30}
  notificaciones:
    # Bandeja del jugador (contracts/openapi/notificaciones.yaml, /internal
    # exige la credencial de servicio de ADR-005: DIRECTORIO_ACTIVO_*).
    url: ${NOTIFICACIONES_URL:http://localhost:8085/api/v1}
  avisos:
    # Cada cuanto se reintentan los avisos que no entraron (CA-04 de HU-NOT-005).
    reintento-ms: ${SANCIONES_AVISOS_REINTENTO_MS:15000}

# Credencial de servicio (ADR-005) con la que este servicio habla a
# notificaciones. Sin client-id no se crea ninguna: en local los avisos
# quedan pendientes y en la bitacora.
seguridad:
  servicio:
    url: ${DIRECTORIO_ACTIVO_URL:}
    client-id: ${DIRECTORIO_ACTIVO_CLIENT_ID:}
    client-secret: ${DIRECTORIO_ACTIVO_CLIENT_SECRET:}
