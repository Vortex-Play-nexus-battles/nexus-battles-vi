plugins {
    id 'nexus.spring-conventions'
    id 'nexus.persistencia-conventions'
    id 'nexus.seguridad-conventions'
}

dependencies {
    // Cache en Redis: propio de este servicio, no de la plataforma.
    // La lista negra se consulta en cada mensaje de chat y en cada comentario,
    // asi que no puede ir a la base de datos cada vez.
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-cache'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
}
