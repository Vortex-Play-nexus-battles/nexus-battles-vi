plugins {
    id 'nexus.spring-conventions'
    id 'nexus.persistencia-conventions'
    id 'nexus.seguridad-conventions'
}

dependencies {
    // HU-ADM-001 (CA-04): los limites de sancion se leen de admin-parametros.
    // `LectorDeParametros` pone la politica de degradacion —cache corta,
    // respaldo por variable de entorno y nunca lanzar hacia arriba— en un solo
    // sitio, para que no haya una por servicio. La biblioteca no se reparte
    // desde buildSrc a proposito: la declara quien tiene llamadas salientes.
    implementation project(':shared:libs:plataforma-resiliencia')

    // Cache en Redis: propio de este servicio, no de la plataforma.
    // La lista negra se consulta en cada mensaje de chat y en cada comentario,
    // asi que no puede ir a la base de datos cada vez.
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-cache'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

    // Arranque real de la aplicacion contra PostgreSQL y Redis
    // (ArranqueDeLaAplicacionIT).
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation platform('org.testcontainers:testcontainers-bom:1.21.4')
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
}
