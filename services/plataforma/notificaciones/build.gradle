plugins {
    id 'nexus.spring-conventions'
    // Servidor de recursos (ADR-002): la bandeja es del uid del token y el
    // CONNECT del canal exige el mismo JWT. Trae plataforma-seguridad y sus
    // fixtures de prueba.
    id 'nexus.seguridad-conventions'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    // Canal STOMP sobre WebSocket declarado en
    // contracts/websocket/notificaciones.yaml. Se usa el broker simple que trae
    // Spring porque el docker-compose.yml no levanta ninguno externo todavia y
    // elegirlo es una decision de equipo, no de este modulo.
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // Arranque real de la aplicacion contra PostgreSQL (ArranqueDeLaAplicacionIT).
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation platform('org.testcontainers:testcontainers-bom:1.21.4')
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'

    // B8 — verificacion del pacto que ms-subastas publica sobre este servicio
    // (contracts/pactos/ms-subastas-notificaciones.json): POST
    // /api/v1/internal/notifications con credencial de servicio, 201, 409 del
    // duplicado y 401 sin credencial. Misma version y mismo modulo que
    // ms-finanzas e inventario: `junit5` a secas, NO `junit5spring`, que esta
    // compilado contra javax.servlet y revienta en Spring Boot 4.
    testImplementation 'au.com.dius.pact.provider:junit5:4.6.17'
}

// Los pactos viven fuera de este modulo, en contracts/pactos/: sin declararlos
// como entrada, un cambio solo del pacto dejaria `test` UP-TO-DATE y la
// verificacion no se repetiria (mismo motivo que en inventario).
tasks.named('test') {
    inputs.dir(rootProject.file('contracts/pactos'))
            .withPropertyName('pactos')
            .withPathSensitivity(PathSensitivity.RELATIVE)
}
