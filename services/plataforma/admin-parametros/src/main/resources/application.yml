# Parametros del sistema — HU-ADM-001. Contrato: contracts/openapi/admin-parametros.yaml.
#
# Regla 10: ningun valor real vive aqui; todo baja de variable de entorno y lo
# que hay detras de los dos puntos es el valor de desarrollo local.
server:
  port: 8088

spring:
  application:
    name: admin-parametros
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTIDAD_JWKS_URL:http://localhost:8089/api/v1/auth/jwks}
  datasource:
    url: ${DB_RELACIONAL_URL:jdbc:postgresql://localhost:5432/plataformadb}
    username: ${DB_USER:usuario_nexus}
    password: ${DB_PASS:password_secreta_123}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: admin_parametros
  flyway:
    schemas: admin_parametros
    default-schema: admin_parametros

# HU-AUD-001 / SA-5 (§7.3.5): cada cambio llega a la bitacora central de
# ms-cumplimiento (.../api/v1/admin/auditoria/eventos) desde su version, con
# la IP de quien cambio y la credencial de servicio (ADR-005), con reintentos.
# Vacio = las versiones esperan en el historial local y cada cambio queda en
# la bitacora JSON.
parametros:
  auditoria:
    url: ${AUDITORIA_URL:}
    # B12: tiempos de espera del cliente de auditoria.
    tiempo-conexion-ms: ${AUDITORIA_TIEMPO_CONEXION_MS:2000}
    tiempo-respuesta-ms: ${AUDITORIA_TIEMPO_RESPUESTA_MS:5000}
    reintento-ms: ${AUDITORIA_REINTENTO_MS:10000}
    espera-maxima-ms: ${AUDITORIA_ESPERA_MAXIMA_MS:900000}

seguridad:
  servicio:
    url: ${DIRECTORIO_ACTIVO_URL:}
    client-id: ${DIRECTORIO_ACTIVO_CLIENT_ID:}
    client-secret: ${DIRECTORIO_ACTIVO_CLIENT_SECRET:}

# Regla 3 de plataforma: todo servicio expone salud Y metricas.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
