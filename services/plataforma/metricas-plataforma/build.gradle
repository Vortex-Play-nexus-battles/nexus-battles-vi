plugins {
    id 'nexus.spring-conventions'
}

dependencies {
    // HU-DIS-003: este modulo publica el estado de degradacion del bloque.
    //
    // Se declara aqui y no en las convenciones a proposito: un corta circuitos
    // solo hace falta donde hay una llamada saliente a otro servicio, asi que
    // repartirlo a los veinte modulos meteria un jar que la mayoria no usaria.
    // La instrumentacion de latencia si va en las convenciones porque su
    // criterio de aceptacion exige que este en todos.
    implementation project(':shared:libs:plataforma-resiliencia')

    // HU-DIS-001: las interrupciones sobreviven al redespliegue en el esquema
    // `metricas` de PostgreSQL. JDBC a secas y no `nexus.persistencia-conventions`
    // (JPA): dos tablas de pocas filas no justifican Hibernate en un servicio
    // que comparte un t3.small con otros ocho. Flyway y el driver, los mismos
    // que en las convenciones, para no tener dos versiones en el monorepo.
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    // El arranque completo se prueba contra una PostgreSQL real, como en
    // salas-partidas: una prueba de integracion omitida no es una que pasa.
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation platform('org.testcontainers:testcontainers-bom:1.21.4')
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
}
