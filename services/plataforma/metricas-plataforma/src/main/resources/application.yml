server:
  port: 8087

spring:
  application:
    name: metricas-plataforma

  # HU-MET-001 (#527): servidor de recursos. La observabilidad del bloque es
  # de administracion, no publica; el emisor es ms-identidad (ADR-002/ADR-005),
  # el mismo JWKS que usan los demas servicios de plataforma.
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTIDAD_JWKS_URL:http://localhost:8089/api/v1/auth/jwks}

  # HU-DIS-001: las interrupciones y las ventanas de mantenimiento viven en el
  # esquema `metricas` de la PostgreSQL de plataforma (regla 7: esquema propio,
  # misma instancia que el resto del bloque). Mismas variables que los demas
  # servicios de plataforma (regla 10); lo de detras de los dos puntos es el
  # entorno local del docker-compose de la raiz.
  datasource:
    url: ${DB_RELACIONAL_URL:jdbc:postgresql://localhost:5432/plataformadb}
    username: ${DB_USER:usuario_nexus}
    password: ${DB_PASS:password_secreta_123}
    hikari:
      # Una escritura por caida y una lectura al arrancar: con dos conexiones
      # sobra, y la instancia compartida (256 MB) agradece cada una que no se abre.
      maximum-pool-size: 2
      minimum-idle: 0

  flyway:
    schemas: metricas
    default-schema: metricas

# HU-REN-001 — instrumentacion de latencia extremo a extremo (RNF-REN-001).
#
# El filtro que recoge las muestras NO se configura aqui: lo pone la
# autoconfiguracion de shared/libs/plataforma-observabilidad, que llega a este
# y a los otros diecinueve modulos desde nexus.spring-conventions. Lo unico que
# vive en el application.yml son los valores.
#
# El percentil: vacio aqui significa «el de ADR-006», p95, que lo aplica
# ObjetivoDeLatencia.PERCENTIL_POR_OMISION. No se escribe el 95 en este archivo
# para que la convencion viva en un solo sitio y los veinte modulos no puedan
# divergir. Poner LATENCIA_PERCENTIL=99 cambia la medicion sin recompilar.
latencia:
  objetivo-ms: ${LATENCIA_OBJETIVO_MS:500}
  percentil: ${LATENCIA_PERCENTIL:}
  capacidad: ${LATENCIA_CAPACIDAD:10000}
  operaciones-en-informe: ${LATENCIA_OPERACIONES_EN_INFORME:5}

  # HU-REN-003 — medicion de las consultas a la base de datos.
  #
  # umbral-lenta-ms vacio significa «usa objetivo-ms». No se inventa aqui un
  # presupuesto propio de base de datos: los 500 ms de RNF-REN-001 son extremo a
  # extremo —red, validacion, negocio, consulta y serializacion—, asi que una
  # consulta que sola se los come ya es un problema demostrable. Un presupuesto
  # mas estricto solo para la base de datos no esta acordado en ningun
  # requisito; acordarlo es tarea del equipo, no de este archivo.
  consultas:
    activa: ${LATENCIA_CONSULTAS_ACTIVA:true}
    umbral-lenta-ms: ${LATENCIA_CONSULTAS_UMBRAL_MS:}
    capacidad: ${LATENCIA_CONSULTAS_CAPACIDAD:10000}
    capacidad-lentas: ${LATENCIA_CONSULTAS_CAPACIDAD_LENTAS:200}
    sentencias-en-informe: ${LATENCIA_CONSULTAS_SENTENCIAS_EN_INFORME:10}

# HU-DIS-001 — monitoreo y registro de disponibilidad de los servicios del bloque.
#
# Regla 10 de plataforma: ningun valor real se versiona. Las URL salen de
# variables de entorno y lo que hay aqui son los valores de desarrollo local,
# que es donde cada servicio corre en su propio puerto.
#
# Solo van servicios del bloque (M02, M09, M13, M15, M16A/B). Los de los
# equipos socios se quedan fuera a proposito: DEC-01 excluye sus caidas de la
# cifra de disponibilidad.
disponibilidad:
  umbral-porcentaje: ${DISPONIBILIDAD_UMBRAL:99.95}
  intervalo-ms: ${DISPONIBILIDAD_INTERVALO_MS:30000}
  # Los puertos son los que declara el application.yml de cada servicio, los
  # mismos que publica docker-compose.yml y que resuelve puerto_de() en
  # cd.yml: comentarios 8081, correo 8082, torneos 8083, salas-partidas 8084,
  # notificaciones 8085, moderacion-sanciones 8086, metricas 8087,
  # admin-parametros 8088. Hasta 2026-09-17 cuatro de estas entradas
  # apuntaban a un puerto que pertenece a OTRO servicio (salas al 8083 de
  # torneos, moderacion al 8084 de salas, admin-parametros al 8086 de
  # moderacion y torneos al 8088 de admin-parametros), asi que el informe de
  # HU-DIS-001 media servicios distintos de los que nombraba.
  #
  # En un despliegue real NO valen estos valores: dentro de un contenedor,
  # localhost es el propio servicio. El host inyecta SALUD_* con el nombre de
  # cada servicio en la red del compose (http://srv-salas-partidas:8084/...).
  servicios:
    comentarios: ${SALUD_COMENTARIOS:http://localhost:8081/actuator/health}
    correo: ${SALUD_CORREO:http://localhost:8082/actuator/health}
    torneos: ${SALUD_TORNEOS:http://localhost:8083/actuator/health}
    salas-partidas: ${SALUD_SALAS_PARTIDAS:http://localhost:8084/actuator/health}
    notificaciones: ${SALUD_NOTIFICACIONES:http://localhost:8085/actuator/health}
    moderacion-sanciones: ${SALUD_MODERACION:http://localhost:8086/actuator/health}
    admin-parametros: ${SALUD_ADMIN_PARAMETROS:http://localhost:8088/actuator/health}

# HU-MET-001 — metricas de usuarios y moderacion. La fuente es
# moderacion-sanciones (GET /sanciones/metricas, agregados sin identificadores).
# umbral-sanciones-por-dia SIN valor a proposito: la ficha pide «alertas de
# alta frecuencia» pero ningun documento fija la cifra (D-25); mientras el PO
# no la apruebe, el tablero publica los conteos y dice que no hay umbral.
metricas:
  moderacion:
    url: ${SANCIONES_URL:http://localhost:8086/api/v1}
    umbral-sanciones-por-dia: ${METRICAS_UMBRAL_SANCIONES_POR_DIA:}

# Regla 3 de plataforma: este servicio tambien expone su propia salud.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# Pantalla «Sistema» de la consola administrativa: que esta encendido AHORA.
#
# Lista aparte de `disponibilidad.servicios` a proposito. Aquella alimenta la
# cifra de HU-DIS-001 y DEC-01 excluye de ella a los equipos socios; meter
# aqui los diecisiete cambiaria ese numero sin que nadie lo hubiera decidido.
# Son dos preguntas distintas: «¿cumplimos el acuerdo?» y «¿que hay arriba?».
#
# Los nombres son los del catalogo de despliegue
# (infrastructure/despliegue/servicios.json). El valor es la URL de salud, o
# la palabra NO_DESPLEGADO para los que ese catalogo marca fuera del host por
# capacidad: eso no es un fallo y la consola lo dice con esas palabras en vez
# de pintar un rojo que no corresponde.
#
# En el host, SISTEMA_SALUD_* llega con el nombre del contenedor en la red de
# compose. Los de contenido viven en otra maquina y se sondean por su IP
# publica, que es como los alcanza el borde.
sistema:
  servicios:
    comentarios: ${SISTEMA_SALUD_COMENTARIOS:http://localhost:8081/actuator/health}
    correo: ${SISTEMA_SALUD_CORREO:http://localhost:8082/actuator/health}
    torneos: ${SISTEMA_SALUD_TORNEOS:http://localhost:8083/actuator/health}
    salas-partidas: ${SISTEMA_SALUD_SALAS_PARTIDAS:http://localhost:8084/actuator/health}
    notificaciones: ${SISTEMA_SALUD_NOTIFICACIONES:http://localhost:8085/actuator/health}
    moderacion-sanciones: ${SISTEMA_SALUD_MODERACION:http://localhost:8086/actuator/health}
    metricas-plataforma: ${SISTEMA_SALUD_METRICAS:http://localhost:8087/actuator/health}
    admin-parametros: ${SISTEMA_SALUD_ADMIN_PARAMETROS:http://localhost:8088/actuator/health}
    ms-identidad: ${SISTEMA_SALUD_MS_IDENTIDAD:http://localhost:8089/actuator/health}
    ms-ecommerce: ${SISTEMA_SALUD_MS_ECOMMERCE:http://localhost:8090/ecommerce/actuator/health}
    ms-cumplimiento: ${SISTEMA_SALUD_MS_CUMPLIMIENTO:http://localhost:8091/actuator/health}
    ms-subastas: ${SISTEMA_SALUD_MS_SUBASTAS:NO_DESPLEGADO}
    ms-finanzas: ${SISTEMA_SALUD_MS_FINANZAS:http://localhost:8093/api/v1/actuator/health}
    heroes: ${SISTEMA_SALUD_HEROES:http://localhost:8101/actuator/health}
    inventario: ${SISTEMA_SALUD_INVENTARIO:http://localhost:8102/actuator/health}
    productos: ${SISTEMA_SALUD_PRODUCTOS:http://localhost:8103/actuator/health}
    motor-combate: ${SISTEMA_SALUD_MOTOR_COMBATE:http://localhost:8104/actuator/health}
