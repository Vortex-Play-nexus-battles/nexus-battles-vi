server:
  port: 8081

spring:
  mvc:
    problemdetails:
      enabled: true
  # Clave publica con la que se verifican los tokens de usuario (ADR-002).
  # Hoy la publica ms-identidad; con Keycloak solo cambia la URL, por
  # variable de entorno. Los roles y el uid los traduce ConversorRolesJwt
  # (shared/libs/plataforma-seguridad).
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTIDAD_JWKS_URL:http://localhost:8089/api/v1/auth/jwks}
  datasource:
    url: ${DB_RELACIONAL_URL:jdbc:postgresql://localhost:5432/plataformadb}
    username: ${DB_USER:usuario_nexus}
    password: ${DB_PASS:password_secreta_123}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: comentarios
  flyway:
    schemas: comentarios
    default-schema: comentarios

comentarios:
  lista-negra:
    # Endpoint de verificacion publicado por moderacion-sanciones en
    # contracts/openapi/moderacion-lista-negra.yaml (HU-ADM-002)
    url: ${LISTA_NEGRA_VERIFICAR_URL:http://localhost:8086/api/v1/lista-negra/verificar}
  sanciones:
    # Consulta de sancion activa del autor (RF-USR-004), en el mismo servicio:
    # contracts/openapi/moderacion-sanciones-consulta.yaml
    url: ${SANCIONES_URL:http://localhost:8086/api/v1}
  # R10.1 — a donde va el aviso al autor cuando se resuelve la moderacion de
  # su comentario (RF-COM-008): POST {url}/internal/notifications, que en
  # notificaciones exige ROLE_SERVICIO (contrato notificaciones 1.1.0). El
  # RestClient de este servicio ya lleva la credencial de ADR-005.
  #
  # Vacio por omision a proposito: sin URL configurada el aviso no se
  # inventa un destino, deja constancia en la bitacora y la decision de
  # moderacion sigue adelante (fail-open, HU-DIS-003). Un servicio de avisos
  # caido no puede impedir que se retire un comentario ofensivo.
  notificaciones:
    url: ${NOTIFICACIONES_URL:}
  # Lo mismo para el evento de auditoria hacia ms-cumplimiento. Sin URL, el
  # asiento queda igual en la tabla comentario_moderacion de este servicio
  # —que es el rastro que exige la ficha— y ademas se escribe en stdout en
  # una linea AUDITORIA_MODERACION (regla 6).
  auditoria:
    url: ${AUDITORIA_URL:}
  # Los formatos de imagen admitidos estan pendientes de definir con el
  # Product Owner (issue 34); mientras tanto se configuran por variable de
  # entorno y el valor local por defecto es el que usan las pruebas.
  formatos-imagen: ${COMENTARIOS_FORMATOS_IMAGEN:jpg,png,webp}

# Regla 3 de plataforma: todo servicio expone salud Y metricas. Hasta el
# 2026-09-21 este servicio solo exponia health (valor por omision de Actuator)
# y el tablero tecnico de HU-MET-004 lo veia como brecha de observabilidad.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
