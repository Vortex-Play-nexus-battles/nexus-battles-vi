server:
  port: 8081

spring:
  mvc:
    problemdetails:
      enabled: true
  # B3 — imagenes de comentario: el contrato 1.4.0 fija 2 MB por imagen. Spring
  # corta aqui lo que se pase (413 imagen-demasiado-grande) antes de leerlo
  # entero, y ExaminadorDeImagenes lo vuelve a comprobar. La peticion admite
  # algo mas que el archivo por la envoltura multipart; el borde la corta a 3m.
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  # Clave publica con la que se verifican los tokens de usuario (ADR-002).
  # Hoy la publica ms-identidad; con Keycloak solo cambia la URL, por
  # variable de entorno. Los roles y el uid los traduce ConversorRolesJwt
  # (shared/libs/plataforma-seguridad).
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTIDAD_JWKS_URL:http://localhost:8089/api/v1/auth/jwks}
  datasource:
    url: ${DB_RELACIONAL_URL:jdbc:postgresql://localhost:5432/plataformadb}
    username: ${DB_USER:usuario_nexus}
    password: ${DB_PASS:password_secreta_123}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: comentarios
  flyway:
    schemas: comentarios
    default-schema: comentarios

comentarios:
  lista-negra:
    # Endpoint de verificacion publicado por moderacion-sanciones en
    # contracts/openapi/moderacion-lista-negra.yaml (HU-ADM-002)
    url: ${LISTA_NEGRA_VERIFICAR_URL:http://localhost:8086/api/v1/lista-negra/verificar}
  sanciones:
    # Consulta de sancion activa del autor (RF-USR-004), en el mismo servicio:
    # contracts/openapi/moderacion-sanciones-consulta.yaml
    url: ${SANCIONES_URL:http://localhost:8086/api/v1}
  # R10.1 — a donde va el aviso al autor cuando se resuelve la moderacion de
  # su comentario (RF-COM-008): POST {url}/internal/notifications, que en
  # notificaciones exige ROLE_SERVICIO (contrato notificaciones 1.1.0). El
  # RestClient de este servicio ya lleva la credencial de ADR-005.
  #
  # Vacio por omision a proposito: sin URL configurada el aviso no se
  # inventa un destino, deja constancia en la bitacora y la decision de
  # moderacion sigue adelante (fail-open, HU-DIS-003). Un servicio de avisos
  # caido no puede impedir que se retire un comentario ofensivo.
  notificaciones:
    url: ${NOTIFICACIONES_URL:}
  # Lo mismo para el evento de auditoria hacia ms-cumplimiento. Sin URL, el
  # asiento queda igual en la tabla comentario_moderacion de este servicio
  # —que es el rastro que exige la ficha— y ademas se escribe en stdout en
  # una linea AUDITORIA_MODERACION (regla 6).
  auditoria:
    url: ${AUDITORIA_URL:}
  # B3 — el catalogo de productos (contenido/productos), por su API publica:
  # GET {url}/api/v1/productos/{id}. Publicar, calificar y leer el resumen de
  # un producto que no existe responde 404; si el catalogo no contesta, las
  # escrituras responden 503 (no se acepta a ciegas) y el resumen se sirve con
  # lo que hay. El valor local es el puerto del compose de contenido; en AWS
  # lo fija docker-compose.deploy.yml (host de contenido).
  productos:
    url: ${PRODUCTOS_URL:http://localhost:8103}
    timeout-conexion: ${PRODUCTOS_TIMEOUT_CONEXION:1s}
    timeout-lectura: ${PRODUCTOS_TIMEOUT_LECTURA:2s}
    # Cuanto se recuerda cada respuesta: la de «existe» 5 min, la de «no
    # existe» solo 30 s (el producto puede darse de alta justo despues).
    cache-positivos: 5m
    cache-negativos: 30s
  # B3 — tiempos de los clientes hacia lista negra, sanciones, notificaciones
  # y auditoria. Sin ellos un servicio colgado dejaba la publicacion esperando
  # y el respaldo (retener en revision, 503) no llegaba a actuar.
  http:
    timeout-conexion: 2s
    timeout-lectura: 5s
  imagenes:
    # Los formatos admitidos estaban pendientes de definir con el Product
    # Owner (issue 34); el contrato 1.4.0 los fija en JPEG, PNG y WebP, y esta
    # variable solo puede acotarlos a un subconjunto de esos tres.
    formatos: ${COMENTARIOS_FORMATOS_IMAGEN:jpg,png,webp}
    # Contrato 1.4.0: «las no usadas en 24 h se borran». La tarea corre cada
    # hora (ISO-8601, que es lo que @Scheduled entiende siempre).
    retencion-pendientes: 24h
    limpieza-cada: PT1H
    limpieza-retraso-inicial: PT10M

# Regla 3 de plataforma: todo servicio expone salud Y metricas. Hasta el
# 2026-09-21 este servicio solo exponia health (valor por omision de Actuator)
# y el tablero tecnico de HU-MET-004 lo veia como brecha de observabilidad.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
