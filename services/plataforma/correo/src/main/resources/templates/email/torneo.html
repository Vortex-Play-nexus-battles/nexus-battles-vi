<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{email/layout-corporativo}">
<body>
  <table>
    <tbody>
      <!--/*
        Hito de torneo (correo.yaml 1.5.0, B10): inscripcion confirmada, inicio,
        cancelacion con devolucion y premio entregado. Asunto y mensaje los
        decide torneos y se pintan como texto (th:text), nunca como HTML. La
        referencia del torneo solo aparece si torneos la envio.
        Comentario de Thymeleaf: no llega al correo.
      */-->
      <tr layout:fragment="contenido">
        <td align="left" style="font-size:0px;padding:10px 25px;word-break:break-word;">
          <div style="font-family:Arial, Helvetica, sans-serif;font-size:20px;font-weight:700;line-height:28px;color:#111726;padding-bottom:12px;">
            <span th:text="${asunto}">Novedades de tu torneo</span>
          </div>
          <div style="font-family:Arial, Helvetica, sans-serif;font-size:16px;line-height:24px;color:#111726;padding-bottom:8px;">
            Hola, <span th:text="${apodo}">Jugador</span>.
          </div>
          <div style="font-family:Arial, Helvetica, sans-serif;font-size:16px;line-height:24px;color:#111726;">
            <span th:text="${mensaje}">Detalle del torneo.</span>
          </div>
          <div th:if="${torneoId != null}"
               style="font-family:Arial, Helvetica, sans-serif;font-size:13px;line-height:20px;color:#48536A;padding-top:16px;">
            Referencia del torneo: <strong th:text="${torneoId}">—</strong>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</body>
</html>
