plugins {
    id 'nexus.spring-conventions'
    // Servidor de recursos (ADR-002/ADR-005): correo solo atiende a servicios
    // con credencial. Trae plataforma-seguridad y sus fixtures de prueba.
    id 'nexus.seguridad-conventions'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect:3.3.0'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // B1 — correo durable. Cada peticion aceptada se guarda en la tabla
    // `envios` del esquema `correo` (PostgreSQL de la plataforma, regla 7)
    // antes de responder 202, y un trabajador la entrega con reintentos.
    //
    // JDBC a secas y NO 'nexus.persistencia-conventions' (JPA): una tabla y
    // media docena de consultas no justifican Hibernate en un host donde doce
    // JVM comparten 2 GiB con -Xmx128m (infrastructure/despliegue/CAPACIDAD.md).
    // Mismo criterio y mismas versiones que metricas-plataforma.
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    // Regla 3: management.endpoints.web.exposure ya incluia `prometheus`,
    // pero sin el registro la ruta no existia. Con el salen tambien
    // correo_envios_total y correo_pendientes. Igual que ms-finanzas.
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    // Pruebas de integracion contra una PostgreSQL y un Mailpit reales. Mismo
    // BOM de Testcontainers que el resto de servicios de plataforma.
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation platform('org.testcontainers:testcontainers-bom:1.21.4')
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
}

// HU-COR-001 / CA-03: la plantilla corporativa tiene una sola fuente de verdad,
// el .mjml. El .html que usa Thymeleaf se genera desde ahi y nunca se edita a
// mano. PlantillaSincronizadaTest falla si los dos dejan de coincidir.
//
// No se engancha a 'build' a proposito: requiere Node en el PATH y hoy no esta
// garantizado en el entorno de CI. Se ejecuta a mano cuando cambia el diseno.
tasks.register('compilarPlantillas', Exec) {
    group = 'build'
    description = 'Compila la plantilla corporativa MJML a la plantilla Thymeleaf (HU-COR-001).'
    workingDir = projectDir
    commandLine 'node', 'tools/compilar-plantillas.mjs'
}

// Testcontainers habla con Docker a traves de docker-java, que por defecto pide
// la version 1.32 de la API. Docker Engine 25 en adelante exige 1.40 como minimo
// y responde 400 Bad Request, que Testcontainers reporta como el confuso
// "Could not find a valid Docker environment" aunque Docker este perfectamente
// levantado. Fijar la version aqui lo resuelve sin tocar nada de la maquina.
//
// Se fija 1.40 y no una mas alta a proposito: es el minimo que exigen los
// daemons modernos y a la vez esta soportada desde Docker 19.03, asi que sirve
// tanto en una maquina con Docker recien instalado como en un runner de CI con
// una version mas antigua. Pedir una version demasiado NUEVA falla igual que
// pedir una demasiado vieja.
tasks.named('test') {
    systemProperty 'api.version', '1.40'
}
