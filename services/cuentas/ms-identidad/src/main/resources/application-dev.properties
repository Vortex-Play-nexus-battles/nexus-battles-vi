spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/ms_identidad}
spring.datasource.username=${DB_USER:nexus_dev}
spring.datasource.password=${DB_PASSWORD:nexus_dev_local}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.seguridad.minutos-bloqueo=15

app.lista-negra.url=${LISTA_NEGRA_URL:http://localhost:8086/api/v1/lista-negra/verificar}

resilience4j.circuitbreaker.instances.listaNegra.sliding-window-size=10
resilience4j.circuitbreaker.instances.listaNegra.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.listaNegra.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.listaNegra.permitted-number-of-calls-in-half-open-state=3

resilience4j.retry.instances.listaNegra.max-attempts=2
resilience4j.retry.instances.listaNegra.wait-duration=300ms

app.frontend.ruta=file:../../../frontend/app-web/src/

app.seguridad.horas-expiracion-token=24

app.auditoria.url=${AUDITORIA_URL:http://localhost:8091/api/v1/admin/auditoria/eventos}

resilience4j.circuitbreaker.instances.auditoria.sliding-window-size=10
resilience4j.circuitbreaker.instances.auditoria.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.auditoria.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.auditoria.permitted-number-of-calls-in-half-open-state=3

resilience4j.retry.instances.auditoria.max-attempts=2
resilience4j.retry.instances.auditoria.wait-duration=300ms

# Respaldo de desarrollo: permite acreditar el rol con el header X-User-Role
# sin JWT, para demostrar los cuatro roles sin cuatro logins reales.
#
# R9.5 — estaba fijo en `true`, y eso no era solo "desarrollo": el CD arranca
# este servicio con el perfil dev (cd.yml), asi que en el host de dev bastaba
# con mandar `X-User-Role: SUPER_ADMINISTRADOR` para ejecutar cualquier accion
# administrativa sin token. El unico que manda esa cabecera en todo el
# repositorio es la coleccion de Postman de HU-RBAC-004 —ningun servicio, ni
# el frontend—, asi que apagarlo no rompe ningun flujo real.
#
# Sigue siendo encendible a proposito y por variable de entorno (regla 10),
# para quien quiera demostrar los cuatro roles en su maquina sin cuatro
# inicios de sesion. Lo que ya no pasa es que venga encendido de fabrica.
app.seguridad.permitir-header-rol=${RBAC_PERMITIR_HEADER_ROL:false}

# Origenes que pueden llamar a la API desde un navegador (R9.5). Antes era
# comodin escrito en el codigo; ahora es configuracion. Vacio = la lista de
# desarrollo que trae WebSecurityConfig (borde y servicio en local); en AWS el
# navegador llega por el borde y es mismo origen, asi que no hace falta.
app.seguridad.cors-origenes=${IDENTIDAD_CORS_ORIGENES:}
app.notificaciones.url=${NOTIFICACIONES_URL:http://localhost:8085/api/v1/internal/notifications}
resilience4j.circuitbreaker.instances.notificaciones.sliding-window-size=10
resilience4j.circuitbreaker.instances.notificaciones.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.notificaciones.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.notificaciones.permitted-number-of-calls-in-half-open-state=3
resilience4j.retry.instances.notificaciones.max-attempts=2
resilience4j.retry.instances.notificaciones.wait-duration=300ms

