spring.application.name=ms-identidad

spring.profiles.active=dev

server.port=8089

# Hilos virtuales de Java 21
spring.threads.virtual.enabled=true

# Formato RFC 7807 (Problem Details)
spring.mvc.problemdetails.enabled=true

# ---------------------------------------------------------
# Configuracion por ambientes
# ---------------------------------------------------------
# La configuracion especifica de base de datos se encuentra
# en los archivos de perfil:
#
# - application-dev.properties  -> desarrollo local
# - application-prod.properties -> produccion
#
# En produccion se debe activar el perfil "prod" mediante
# SPRING_PROFILES_ACTIVE=prod.

# Sobreescribible por variable de entorno para despliegue en
# Docker Compose/k3s, donde los contenedores se resuelven por
# nombre de servicio, no por localhost (pedido de Nestor, HU-CICD-002).
app.lista-negra.url=${LISTA_NEGRA_URL:http://localhost:8086/api/v1/lista-negra/verificar}

app.correo.url-bienvenida=${CORREO_BIENVENIDA_URL:http://localhost:8082/api/v1/correos/bienvenida}
app.correo.url-aviso-acceso=${CORREO_AVISO_ACCESO_URL:http://localhost:8082/api/v1/correos/aviso-acceso}
app.correo.url-recuperacion-clave=${CORREO_RECUPERACION_CLAVE_URL:http://localhost:8082/api/v1/correos/recuperacion-clave}
app.correo.url-confirmacion-cuenta=${CORREO_CONFIRMACION_CUENTA_URL:http://localhost:8082/api/v1/correos/confirmacion-cuenta}

resilience4j.circuitbreaker.instances.correo.sliding-window-size=10
resilience4j.circuitbreaker.instances.correo.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.correo.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.correo.permitted-number-of-calls-in-half-open-state=3

resilience4j.retry.instances.correo.max-attempts=2
resilience4j.retry.instances.correo.wait-duration=300ms

app.seguridad.umbral-intentos-fallidos=3

spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

app.avatares.ruta-almacenamiento=${AVATARES_RUTA:./avatares-subidos}

# Firma de los tokens de acceso.
#
# RSA, no HMAC: estos tokens los verifica toda la plataforma (salas-partidas,
# moderacion-sanciones...) y con un secreto compartido cada servicio que los
# verificara podria tambien EMITIRLOS. Con RSA los demas solo reciben la clave
# publica, por GET /api/v1/auth/jwks. Ver ClavesDeFirma y
# docs/gobierno/ADR-002-identidad-de-usuario.md.
#
# Sin valor: se genera un par al arrancar y los tokens no sobreviven a un
# reinicio (comodo en local; el servicio avisa por bitacora). Para un
# despliegue estable se define JWT_CLAVE_PRIVADA con una clave RSA PKCS#8 en
# base64:
#   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
#     | openssl pkcs8 -topk8 -nocrypt -outform DER | base64 -w0
app.jwt.clave-privada=${JWT_CLAVE_PRIVADA:}
app.jwt.emisor=${JWT_EMISOR:ms-identidad}
app.jwt.horas-expiracion=24

# Corrige PlaceholderResolutionException en produccion (hallazgo de
# Sanabria, pre-despliegue): faltaba aqui, solo vivia en
# application-dev.properties, que no aplica al perfil prod.
app.auditoria.url=${AUDITORIA_URL:http://localhost:8091/api/v1/admin/auditoria/eventos}
