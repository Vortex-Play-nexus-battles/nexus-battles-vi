spring.application.name=ms-identidad

spring.profiles.active=dev

server.port=8089

# Hilos virtuales de Java 21
spring.threads.virtual.enabled=true

# Formato RFC 7807 (Problem Details)
spring.mvc.problemdetails.enabled=true

# ---------------------------------------------------------
# Configuracion por ambientes
# ---------------------------------------------------------
# La configuracion especifica de base de datos se encuentra
# en los archivos de perfil:
#
# - application-dev.properties  -> desarrollo local
# - application-prod.properties -> produccion
#
# En produccion se debe activar el perfil "prod" mediante
# SPRING_PROFILES_ACTIVE=prod.

# Sobreescribible por variable de entorno para despliegue en
# Docker Compose/k3s, donde los contenedores se resuelven por
# nombre de servicio, no por localhost (pedido de Nestor, HU-CICD-002).
app.lista-negra.url=${LISTA_NEGRA_URL:http://localhost:8086/api/v1/lista-negra/verificar}

app.correo.url-bienvenida=${CORREO_BIENVENIDA_URL:http://localhost:8082/api/v1/correos/bienvenida}
app.correo.url-aviso-acceso=${CORREO_AVISO_ACCESO_URL:http://localhost:8082/api/v1/correos/aviso-acceso}
app.correo.url-recuperacion-clave=${CORREO_RECUPERACION_CLAVE_URL:http://localhost:8082/api/v1/correos/recuperacion-clave}
app.correo.url-confirmacion-cuenta=${CORREO_CONFIRMACION_CUENTA_URL:http://localhost:8082/api/v1/correos/confirmacion-cuenta}
# HU-AUT-006: aviso de cambio de contrasena (contracts/openapi/correo.yaml 1.2.0).
app.correo.url-cambio-clave=${CORREO_CAMBIO_CLAVE_URL:http://localhost:8082/api/v1/correos/cambio-clave}

resilience4j.circuitbreaker.instances.correo.sliding-window-size=10
resilience4j.circuitbreaker.instances.correo.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.correo.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.correo.permitted-number-of-calls-in-half-open-state=3

resilience4j.retry.instances.correo.max-attempts=2
resilience4j.retry.instances.correo.wait-duration=300ms

app.seguridad.umbral-intentos-fallidos=3

spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

app.avatares.ruta-almacenamiento=${AVATARES_RUTA:./avatares-subidos}

# Firma de los tokens de acceso.
#
# RSA, no HMAC: estos tokens los verifica toda la plataforma (salas-partidas,
# moderacion-sanciones...) y con un secreto compartido cada servicio que los
# verificara podria tambien EMITIRLOS. Con RSA los demas solo reciben la clave
# publica, por GET /api/v1/auth/jwks. Ver ClavesDeFirma y
# docs/gobierno/ADR-002-identidad-de-usuario.md.
#
# Sin valor: se genera un par al arrancar y los tokens no sobreviven a un
# reinicio (comodo en local; el servicio avisa por bitacora). Para un
# despliegue estable se define JWT_CLAVE_PRIVADA con una clave RSA PKCS#8 en
# base64:
#   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
#     | openssl pkcs8 -topk8 -nocrypt -outform DER | base64 -w0
app.jwt.clave-privada=${JWT_CLAVE_PRIVADA:}
app.jwt.emisor=${JWT_EMISOR:ms-identidad}
app.jwt.horas-expiracion=24

# Credenciales de servicio (ADR-001 implementado segun ADR-005).
#
# Mientras no haya Keycloak, este servicio es tambien el emisor de los tokens
# con los que un servicio le habla a otro: POST /api/v1/auth/token con el
# grant client_credentials. Los clientes admitidos y sus secretos vienen de
# AUTH_CLIENTES_SERVICIO con la forma "cliente=secreto;otro=secreto" (minimo
# 16 caracteres por secreto). Sin valor, ningun servicio obtiene credencial.
# Regla 10: ningun valor real aqui; en el host lo genera el flujo de CD.
app.servicios.clientes=${AUTH_CLIENTES_SERVICIO:}
app.servicios.minutos-vigencia=${AUTH_SERVICIOS_MINUTOS_VIGENCIA:15}

# Corrige PlaceholderResolutionException en produccion (hallazgo de
# Sanabria, pre-despliegue): faltaba aqui, solo vivia en
# application-dev.properties, que no aplica al perfil prod.
app.auditoria.url=${AUDITORIA_URL:http://localhost:8091/api/v1/admin/auditoria/eventos}

# Mismo defecto, misma causa, sobrevivio a aquella correccion: la leia
# NotificacionClient con @Value("${app.notificaciones.url}") sin defecto, y
# solo estaba declarada en application-dev.properties. Con
# SPRING_PROFILES_ACTIVE=prod el contexto moria al construir ese bean, antes
# de servir una sola peticion. Ninguna prueba lo veia porque todas corren
# con @ActiveProfiles("test") y la definen a mano.
#
# Aqui, en el archivo base, vale para los tres perfiles. La variable de
# entorno NOTIFICACIONES_URL la sigue pudiendo sobrescribir en el
# despliegue, igual que las de arriba.
app.notificaciones.url=${NOTIFICACIONES_URL:http://localhost:8085/api/v1/internal/notifications}

# Regla 3 de plataforma: salud Y metricas.
#
# ms-identidad esta en el camino de TODA peticion autenticada del sistema
# —es quien emite y quien publica el JWKS—, y era uno de los tres servicios
# que no exponia ninguna metrica. Es justo el que mas falta hace cuando algo
# va lento (R11).
management.endpoints.web.exposure.include=health,info,metrics,prometheus
# ---------------------------------------------------------
# Esquema por Flyway (regla 8) — R17
# ---------------------------------------------------------
# Hasta R17 el esquema lo creaba Hibernate con ddl-auto=update: cada arranque
# podia alterar tablas sin version y sin revision. Ahora lo hacen las
# migraciones de db/migration y Hibernate solo valida.
#
# Las bases que ya existen (DEV en AWS, la de cada desarrollador) tienen las
# tablas de V1 sin historial de Flyway. baseline-on-migrate las marca como
# version 1 sin tocarlas y aplica solo lo nuevo (V2 en adelante). Una base
# vacia (banco E2E, Testcontainers) recorre V1 desde cero. Probado en
# MigracionesIT con los dos casos.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ---------------------------------------------------------
# Alta del jugador (R17): creditos y heroe iniciales
# ---------------------------------------------------------
# ms-identidad orquesta; cada dueno hace lo suyo por su API con la credencial
# de servicio (ADR-005): ms-finanzas acredita, el inventario crea el heroe y su
# equipo, el catalogo dice que es cada producto y admin-parametros cuanto y
# cual. Mismos nombres de variable que ya usan los demas servicios.
app.onboarding.creditos-url=${CREDITOS_URL:http://localhost:8093/api/v1}
app.onboarding.inventario-url=${INVENTARIO_BASE_URL:http://localhost:8102}
app.onboarding.productos-url=${PRODUCTOS_BASE_URL:http://localhost:8103}
app.onboarding.parametros-url=${PARAMETROS_URL:http://localhost:8088/api/v1}
# Respaldo PROVISIONAL de desarrollo, solo mientras jugador.creditos-iniciales
# y jugador.kit-inicial no tengan valor en admin-parametros (decision del PO
# pendiente: D-28, D-29). Vacio = sin respaldo: el paso queda pendiente y lo
# dice. Nunca un valor aqui: lo pone el despliegue de cada entorno (regla 10).
app.onboarding.creditos-iniciales-respaldo=${JUGADOR_CREDITOS_INICIALES:}
app.onboarding.kit-inicial-respaldo=${JUGADOR_KIT_INICIAL:}
# segundo-plano | sincrona | manual (ver LanzadorOnboarding)
app.onboarding.ejecucion=${ONBOARDING_EJECUCION:segundo-plano}
app.onboarding.reintentos-automaticos=${ONBOARDING_REINTENTOS_AUTOMATICOS:true}
app.onboarding.intervalo-reintentos-ms=${ONBOARDING_INTERVALO_REINTENTOS_MS:30000}

# Cuentas administrativas iniciales (AdministradoresIniciales).
# Formato: apodo|correo|clave;apodo|correo|clave  -- llega por entorno, nunca
# se versiona un valor real aqui. Vacio = no se crea ninguna cuenta.
app.admins.iniciales=${ADMINS_INICIALES:}
