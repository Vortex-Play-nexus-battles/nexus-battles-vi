# La firma es RSA (ver ClavesDeFirma): en pruebas se genera un par efimero.

# R9.5 — el respaldo por cabecera X-User-Role vive SOLO aqui.
#
# Estaba fijo en `true` en application-dev.properties, y el CD arranca
# ms-identidad con el perfil dev (cd.yml) en dev y en test: o sea que en un
# host desplegado bastaba con mandar `X-User-Role: SUPER_ADMINISTRADOR` para
# ejecutar una accion administrativa sin ningun token.
#
# Este archivo esta en src/test/resources: no entra en el jar y no puede
# llegar a ningun servidor. Es el unico sitio donde "compatibilidad que solo
# sirve a pruebas" puede estar encendida sin que exista la posibilidad de que
# se despliegue por descuido. En dev queda apagado de fabrica y se enciende a
# proposito con RBAC_PERMITIR_HEADER_ROL=true para una demo local.
app.seguridad.permitir-header-rol=true
