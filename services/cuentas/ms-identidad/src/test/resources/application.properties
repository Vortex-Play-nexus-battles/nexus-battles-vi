spring.application.name=ms-identidad-test
spring.profiles.active=dev
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.correo.url-bienvenida=http://localhost:8082/api/v1/correos/bienvenida
app.correo.url-aviso-acceso=http://localhost:8082/api/v1/correos/aviso-acceso
app.correo.url-recuperacion-clave=http://localhost:8082/api/v1/correos/recuperacion-clave
app.correo.url-confirmacion-cuenta=http://localhost:8082/api/v1/correos/confirmacion-cuenta
app.correo.url-cambio-clave=http://localhost:8082/api/v1/correos/cambio-clave

app.notificaciones.url=http://localhost:8085/api/v1/internal/notifications

# R17 — en las pruebas sobre H2 el esquema lo crea Hibernate (create-drop);
# las migraciones de Flyway se prueban contra PostgreSQL real en MigracionesIT.
spring.flyway.enabled=false
# Registrar un usuario en una prueba no sale a buscar ms-finanzas ni el
# inventario: el alta se crea, pero solo la procesan las pruebas del alta.
app.onboarding.ejecucion=manual
app.onboarding.reintentos-automaticos=false

# La firma es RSA (ver ClavesDeFirma): en pruebas se genera un par efimero.
