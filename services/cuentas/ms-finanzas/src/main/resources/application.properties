server.port=8093
server.servlet.context-path=/api/v1

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5436}/${DB_NAME:finanzas_db}
spring.datasource.username=${DB_USER:finanzas_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Convención de esquema (definida por moderacion-sanciones, ver comentario
# del plugin nexus.persistencia-conventions): un esquema por servicio, aunque
# ms-finanzas hoy corra en su propia BD aislada. Deja al servicio listo para
# la eventual consolidación en un PostgreSQL compartido de plataforma.
spring.jpa.properties.hibernate.default_schema=finanzas
spring.flyway.schemas=finanzas
spring.flyway.default-schema=finanzas
# Flyway crea el esquema si no existe al arrancar (necesario en la BD limpia).
spring.flyway.create-schemas=true

# Regla 4 de plataforma: errores en formato RFC 7807 (Problem Details).
spring.mvc.problem-details.enabled=true

# Regla 8 de plataforma: el esquema lo gobierna Flyway, nunca ddl-auto.
# 'none' en vez de 'validate' porque en pruebas con Testcontainers el
# esquema lo crea Flyway después de que Hibernate arranca; 'validate' fallaría.
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Regla 3 de plataforma: todo servicio expone salud y métricas de Actuator.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.health.circuitbreakers.enabled=true

# Quién emite los tokens que este servicio acepta.
#
# Hoy es ms-identidad, que firma con RSA y publica su clave pública en
# /api/v1/auth/jwks desde el PR #393 (ADR-002 identidad-de-usuario). Se
# configura jwk-set-uri y no issuer-uri porque ms-identidad todavía no
# expone documento de descubrimiento OpenID; a cambio, esta forma sirve
# igual para Keycloak el día que la identidad se mueva allí: solo cambia
# la URL, por variable de entorno, sin tocar código.
#
# Los roles y el identificador del usuario los traduce ConversorRolesJwt
# (shared/libs/plataforma-seguridad), que entiende las dos formas de token
# (rol/uid de ms-identidad y realm_access.roles/sub de Keycloak).
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${IDENTIDAD_JWKS_URL:http://localhost:8089/api/v1/auth/jwks}
app.correo.url-confirmacion-compra=${CORREO_URL:http://localhost:8082/api/v1}/correos/confirmacion-compra

# B7 · cofres (cofres.yaml 1.1.0). Lo que el documento fija (20 créditos
# ganados por cofre, dos cofres por semana) está en ReglasDeCofres y no se
# configura. Lo que no fija, sí, con su decisión del PO:
#  - D-B7-17: la semana ISO se cuenta en esta zona, y el sobrante de la cuota
#    (22 -> 2) cuenta para el siguiente cofre.
#  - D-B7-18: la tabla del contenido. Vacía = la PROVISIONAL DE DESARROLLO que
#    viaja con el servicio (cofres/tabla-provisional-dev-1.txt). Una tabla propia
#    (productoId=peso;...) exige su propia versión.
finanzas.cofres.zona=${FINANZAS_COFRES_ZONA:America/Bogota}
finanzas.cofres.conservar-sobrante=${FINANZAS_COFRES_CONSERVAR_SOBRANTE:true}
finanzas.cofres.tabla=${FINANZAS_COFRES_TABLA:}
finanzas.cofres.tabla-version=${FINANZAS_COFRES_TABLA_VERSION:PROVISIONAL-DEV-1}
# Entrega del contenido al inventario (POST /inventario/entregas, origen COFRE),
# con la credencial de servicio de ms-finanzas. Sin URL los cofres se ganan
# pero quedan PENDIENTES hasta que la haya. Lo que no entra se reintenta.
finanzas.cofres.inventario-url=${INVENTARIO_BASE_URL:}
finanzas.cofres.reintento-ms=${FINANZAS_COFRES_REINTENTO_MS:60000}
finanzas.cofres.espera-maxima-minutos=${FINANZAS_COFRES_ESPERA_MAXIMA_MINUTOS:30}
finanzas.cofres.tiempo-conexion-ms=${FINANZAS_TIEMPO_CONEXION_MS:2000}
finanzas.cofres.tiempo-respuesta-ms=${FINANZAS_TIEMPO_RESPUESTA_MS:5000}

# Auditoria de DEV del 30-sep: una reserva de apuesta (concepto apuesta-sala)
# que sigue ACTIVA pasado su expira_en (72 h desde que se creo) se libera sola:
# la apuesta de una sala abandonada vuelve a su dueno (VencimientoDeApuestas,
# D-39). Apagable sin desplegar codigo.
finanzas.apuestas.vencer-reservas=${FINANZAS_APUESTAS_VENCER_RESERVAS:true}
finanzas.apuestas.vencimiento-ms=${FINANZAS_APUESTAS_VENCIMIENTO_MS:600000}

# Credencial de servicio con la que ms-finanzas le habla a inventario (ADR-005).
# Sin client-id no se registra ningún interceptor y la entrega sale sin
# Authorization (inventario responde 401 y el cofre queda pendiente).
seguridad.servicio.url=${DIRECTORIO_ACTIVO_URL:http://localhost:8089/api/v1/auth/token}
seguridad.servicio.client-id=${DIRECTORIO_ACTIVO_CLIENT_ID:}
seguridad.servicio.client-secret=${DIRECTORIO_ACTIVO_CLIENT_SECRET:}
