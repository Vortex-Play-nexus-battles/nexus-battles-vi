server.port=8093
server.servlet.context-path=/api/v1

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5436}/${DB_NAME:finanzas_db}
spring.datasource.username=${DB_USER:finanzas_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Convención de esquema (definida por moderacion-sanciones, ver comentario
# del plugin nexus.persistencia-conventions): un esquema por servicio, aunque
# ms-finanzas hoy corra en su propia BD aislada. Deja al servicio listo para
# la eventual consolidación en un PostgreSQL compartido de plataforma.
spring.jpa.properties.hibernate.default_schema=finanzas
spring.flyway.schemas=finanzas
spring.flyway.default-schema=finanzas
# Flyway crea el esquema si no existe al arrancar (necesario en la BD limpia).
spring.flyway.create-schemas=true

# Regla 4 de plataforma: errores en formato RFC 7807 (Problem Details).
spring.mvc.problem-details.enabled=true

# Regla 8 de plataforma: el esquema lo gobierna Flyway, nunca ddl-auto.
# 'none' en vez de 'validate' porque en pruebas con Testcontainers el
# esquema lo crea Flyway después de que Hibernate arranca; 'validate' fallaría.
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Regla 3 de plataforma: todo servicio expone salud y métricas de Actuator.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.health.circuitbreakers.enabled=true

# JWT propio (mismo patrón y misma clave que ms-identidad — los tokens los
# firma ese servicio y aquí solo se validan). La clave real llega por
# variable de entorno; el default es solo para el perfil dev/tests con Docker
# Compose local. En producción DEBE llegar por env var real (secret de CI).
app.jwt.clave-secreta=${JWT_CLAVE_SECRETA:clave-desarrollo-solo-para-local-cambiar-en-prod-de-al-menos-32-bytes}
app.jwt.horas-expiracion=${JWT_HORAS_EXPIRACION:24}

# Respaldo dev por headers X-User-Uid/X-User-Role: SOLO se activa en local
# para poder probar el frontend sin login real. En prod queda en false
# (fail-closed puro por JWT). Mismo flag que ms-identidad.
app.seguridad.permitir-header-rol=${SEGURIDAD_PERMITIR_HEADER_ROL:false}
