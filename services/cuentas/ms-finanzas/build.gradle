plugins {
    id 'nexus.spring-conventions'
}

group = 'nexus'
version = '0.0.1-SNAPSHOT'

// Web MVC, Actuator, Java 21, JUnit 5 y JaCoCo provienen de la convención.
// Aquí solo van las dependencias propias de Finanzas.
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // El esquema lo gobierna Flyway, nunca ddl-auto (regla 8 de plataforma).
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // ms-subastas ya declara un CircuitBreaker/Retry hacia este servicio en el
    // instance "creditos" (ver su application.properties). La misma versión
    // aquí asegura que los contratos de resiliencia entre servicios usen la
    // misma librería y no queden desalineados en un upgrade.
    implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.2.0'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'

    // Falla el build si un servicio importa clases internas de otro dominio.
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
}

// La compuerta del 80 % se activará cuando existan pruebas reales
// (HU-PAG-001, HU-PAG-002, HU-JUE-012). Mientras el servicio sea skeleton se
// deja desactivada para no romper el build del monorepo con 0 %.
// Cuando llegue el primer test de una HU, descomentar los dos bloques:
//
// tasks.named('jacocoTestCoverageVerification') {
//     dependsOn tasks.named('test')
// }
// tasks.named('check') {
//     dependsOn tasks.named('jacocoTestCoverageVerification')
// }
