# Regla 6 de plataforma (bitacora en JSON): la bitacora JSON de
# plataforma-observabilidad identifica cada linea con este nombre. Sin el,
# el campo de servicio sale vacio y no se sabe que lineas son del chatbot.
spring.application.name=ms-chatbot

server.port=8094
server.servlet.context-path=/api/v1

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5437}/${DB_NAME:chatbot_db}
spring.datasource.username=${DB_USER:chatbot_user}
spring.datasource.password=${DB_PASSWORD:chatbot_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Mismos nombres que ya usan ms-subastas y salas-partidas contra los mismos
# proveedores (.env.example): un solo valor por entorno.
app.inventario.url=${INVENTARIO_BASE_URL:http://localhost:8080}
app.subastas.url=${SUBASTAS_BASE_URL:http://localhost:8092/api/v1}
app.notificaciones.url=${NOTIFICACIONES_BASE_URL:http://localhost:8085/api/v1}

# CORS solo para desarrollo local (vistas en Live Server 5500 o npm run dev
# 8080 llamando directo a 8094). Mismos origenes y variable que ms-subastas.
app.cors.origenes-permitidos=${CORS_ORIGENES:http://localhost:8080,http://127.0.0.1:8080,http://localhost:5500,http://127.0.0.1:5500}

# Convencion de esquema (nexus.persistencia-conventions): un esquema por
# servicio, aunque ms-chatbot hoy corra en su propia BD aislada, igual que
# ms-finanzas.
spring.jpa.properties.hibernate.default_schema=chatbot
spring.flyway.schemas=chatbot
spring.flyway.default-schema=chatbot
spring.flyway.create-schemas=true

# Regla 4 de plataforma: errores en formato RFC 7807 (Problem Details).
spring.mvc.problem-details.enabled=true

# Regla 8 de plataforma: el esquema lo gobierna Flyway, nunca ddl-auto.
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Regla 3 de plataforma: todo servicio expone salud y metricas de Actuator.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.health.circuitbreakers.enabled=true

# Quien emite los tokens que este servicio acepta (ms-identidad).
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${IDENTIDAD_JWKS_URL:http://localhost:8089/api/v1/auth/jwks}
