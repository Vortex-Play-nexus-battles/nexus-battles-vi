# Regla 6 de plataforma (bitacora en JSON): la bitacora JSON de
# plataforma-observabilidad identifica cada linea con este nombre. Sin el,
# el campo de servicio sale vacio y no se sabe que lineas son del chatbot.
spring.application.name=ms-chatbot

server.port=8094
server.servlet.context-path=/api/v1

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5437}/${DB_NAME:chatbot_db}
spring.datasource.username=${DB_USER:chatbot_user}
spring.datasource.password=${DB_PASSWORD:chatbot_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Mismos nombres que ya usan ms-subastas y salas-partidas contra los mismos
# proveedores (.env.example): un solo valor por entorno.
app.inventario.url=${INVENTARIO_BASE_URL:http://localhost:8080}
app.subastas.url=${SUBASTAS_BASE_URL:http://localhost:8092/api/v1}
app.notificaciones.url=${NOTIFICACIONES_BASE_URL:http://localhost:8085/api/v1}

# CORS solo para desarrollo local (vistas en Live Server 5500 o npm run dev
# 8080 llamando directo a 8094). Mismos origenes y variable que ms-subastas.
app.cors.origenes-permitidos=${CORS_ORIGENES:http://localhost:8080,http://127.0.0.1:8080,http://localhost:5500,http://127.0.0.1:5500}

# Convencion de esquema (nexus.persistencia-conventions): un esquema por
# servicio, aunque ms-chatbot hoy corra en su propia BD aislada, igual que
# ms-finanzas.
spring.jpa.properties.hibernate.default_schema=chatbot
spring.flyway.schemas=chatbot
spring.flyway.default-schema=chatbot
spring.flyway.create-schemas=true

# Regla 4 de plataforma: errores en formato RFC 7807 (Problem Details).
spring.mvc.problem-details.enabled=true

# Regla 8 de plataforma: el esquema lo gobierna Flyway, nunca ddl-auto.
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Regla 6 (bitacora JSON a stdout): show-sql escribe el SQL directo en stdout,
# fuera de la bitacora JSON. Apagado desde 1.4.0.
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Regla 3 de plataforma: todo servicio expone salud y metricas de Actuator.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.health.circuitbreakers.enabled=true

# Quien emite los tokens que este servicio acepta (ms-identidad).
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${IDENTIDAD_JWKS_URL:http://localhost:8089/api/v1/auth/jwks}

# --- B11 (ms-chatbot.yaml 1.2.0) --------------------------------------------
# Consultas en vivo nuevas: movimientos de creditos del propio jugador (con su
# token) y torneos (dato publico, sin credencial). Base /api/v1 de cada uno.
app.finanzas.url=${FINANZAS_BASE_URL:http://localhost:8093/api/v1}
app.torneos.url=${TORNEOS_BASE_URL:http://localhost:8083/api/v1}
# 7.4.4 (ms-chatbot.yaml 1.3.0): misiones en curso del propio jugador (con su
# token). Base del servicio SIN /api/v1, como inventario: misiones.yaml ya lo
# lleva en sus rutas. 8105 es su puerto de host en docker-compose.contenido.yml.
app.misiones.url=${MISIONES_BASE_URL:http://localhost:8105}
# 1.10.0: catalogo publico de productos (productos.yaml, GET /api/v1/productos,
# sin token). Raiz del servicio, sin /api/v1.
app.productos.url=${PRODUCTOS_BASE_URL:http://localhost:8103}
app.lista-negra.url=${LISTA_NEGRA_VERIFICAR_URL:http://localhost:8086/api/v1/lista-negra/verificar}
# RECHAZAR (por omision, fail-closed como D-14) o PERMITIR si la lista negra no responde.
chatbot.moderacion.si-no-responde=${CHATBOT_MODERACION_SI_NO_RESPONDE:RECHAZAR}
# Tiempos de espera de toda llamada saliente. El documento pide respuestas en
# menos de 2 s (7.4.11): la consulta que no llega a tiempo responde "no
# disponible" solo para esa parte.
app.http.timeout-conexion-ms=${CHATBOT_HTTP_TIMEOUT_CONEXION_MS:1000}
app.http.timeout-lectura-ms=${CHATBOT_HTTP_TIMEOUT_LECTURA_MS:1500}
# Limite de frecuencia (7.4.8: «limite de tasa de consultas para prevenir
# abuso»). El documento no da cifras: son convencion tecnica PROVISIONAL,
# configurable. Por minuto.
chatbot.limite.mensajes-por-minuto=${CHATBOT_LIMITE_MENSAJES_POR_MINUTO:20}
# 1.4.0: mensajes por direccion de origen (X-Real-IP), sumando sus sesiones.
chatbot.limite.mensajes-por-minuto-por-origen=${CHATBOT_LIMITE_MENSAJES_POR_ORIGEN:120}
chatbot.limite.sesiones-por-minuto-por-origen=${CHATBOT_LIMITE_SESIONES_POR_ORIGEN:10}
chatbot.limite.sesiones-por-minuto-global=${CHATBOT_LIMITE_SESIONES_GLOBAL:300}
# Una sesion de visitante vence tras estas horas sin mensajes (7.4.2: historial
# persistente durante la sesion del usuario).
chatbot.sesion-anonima.horas-inactividad=${CHATBOT_SESION_ANONIMA_HORAS:24}

# ms-chatbot.yaml 1.14.0 (7.4.6): capturas de pantalla de una solicitud de
# soporte. 2 MB por captura (D-CHA-12; ExaminadorDeCapturas lo vuelve a
# comprobar). El cuerpo multipart se lee al resolver el parametro del
# controlador (resolve-lazily) para que una captura de mas responda 413 con
# su motivo desde el manejador de errores del chat.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
spring.servlet.multipart.resolve-lazily=true

# --- 7.4.9 «Requisitos tecnicos» (ms-chatbot.yaml 1.9.0) ---------------------
# Cache de respuestas frecuentes de la base de conocimiento (CacheDeRespuestas):
# cuantas respuestas y cuantos minutos vale cada una. Cifras PROVISIONALES,
# convencion tecnica (D-CHA-08). 0 la apaga.
chatbot.cache.respuestas.maximo=${CHATBOT_CACHE_RESPUESTAS_MAXIMO:500}
chatbot.cache.respuestas.minutos=${CHATBOT_CACHE_RESPUESTAS_MINUTOS:30}
# Canal en tiempo real (contracts/websocket/chatbot.yaml 1.0.0): latido STOMP
# en cada sentido, en ms, y preguntas sin responder por conexion.
# PROVISIONALES (D-CHA-09). Los origenes admitidos en el handshake son los de
# CORS (app.cors.origenes-permitidos, arriba).
chatbot.ws.latido-ms=${CHATBOT_WS_LATIDO_MS:10000}
chatbot.ws.mensajes-en-vuelo=${CHATBOT_WS_MENSAJES_EN_VUELO:2}
