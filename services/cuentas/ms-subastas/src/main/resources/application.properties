server.port=8092
server.servlet.context-path=/api/v1

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:subastas_db}
spring.datasource.username=${DB_USER:subastas_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.mvc.problem-details.enabled=true

# Origenes que pueden llamar a esta API desde un navegador. En desarrollo, el
# servidor estatico del frontend (8080/5500) y el frontend servido por ms-identidad (8089).
# En cualquier despliegue real hay que pasar el dominio de verdad por variable de entorno
# (regla 10 de plataforma): sin CORS la pantalla de subastas no carga ni el listado publico.
app.cors.origenes-permitidos=${CORS_ORIGENES:http://localhost:8080,http://127.0.0.1:8080,http://localhost:8089,http://127.0.0.1:8089,http://localhost:5500,http://127.0.0.1:5500}

# R9.6 — origenes del canal STOMP del listado en vivo (HU-SUB-011). Hasta ahora
# WebSocketConfig los traia escritos como comodin, con un "PENDIENTE: restringir
# antes de desplegar" que se desplego igual. Ahora son configuracion, como ya lo
# son SALAS_WS_ORIGENES y CHAT_WS_ORIGENES en salas-partidas y
# NOTIFICACIONES_WS_ORIGENES en notificaciones: los cuatro canales de la casa,
# del mismo modo. Vacio = la lista de desarrollo que trae WebSocketConfig.
subastas.ws.origenes=${SUBASTAS_WS_ORIGENES:}

# Configuración de Hibernate y JPA. El esquema lo gobierna Flyway
# (regla del proyecto: migraciones solo por Flyway, nunca a mano ni por ddl-auto).
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ms-finanzas: endpoint de reserva/liberación/consumo de créditos (HU-SUB-004)
app.finanzas.base-url=${FINANZAS_BASE_URL:http://localhost:8093/api/v1}
# Timeout del adaptador de comisiones de publicacion (HU-SUB-001).
app.finanzas.timeout-ms=${FINANZAS_TIMEOUT_MS:5000}

# Timeout propio del cliente de creditos de pujas (HU-SUB-004). Deliberadamente
# mas corto que el de publicacion, y no por capricho: esta llamada ocurre DENTRO
# del lock pesimista de la fila de la subasta, asi que cada milisegundo de espera
# es tiempo en el que ninguna otra puja de esa subasta puede entrar. La comision
# de publicacion no tiene ese problema y puede permitirse los 5 s.
app.finanzas.pujas.timeout-ms=${FINANZAS_PUJAS_TIMEOUT_MS:1000}

# Catálogo de productos consumido por HU-SUB-001.
app.catalogo.base-url=${CATALOGO_BASE_URL:http://localhost:8080}
app.catalogo.timeout-ms=${CATALOGO_TIMEOUT_MS:5000}

# ms-inventario consumido por HU-SUB-001 y entrega de productos (HU-SUB-004)
app.inventario.base-url=${INVENTARIO_BASE_URL:http://localhost:8080}
app.inventario.timeout-ms=${INVENTARIO_TIMEOUT_MS:5000}
app.inventario.modo=${INVENTARIO_MODO:fake}

# Cortacircuitos hacia inventario. Mismo motivo que el de creditos: la llamada
# ocurre DENTRO del lock pesimista de la fila de la subasta, asi que un
# inventario lento congela todas las pujas de esa subasta si no se corta.
resilience4j.circuitbreaker.instances.inventario.sliding-window-size=20
resilience4j.circuitbreaker.instances.inventario.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.inventario.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.inventario.permitted-number-of-calls-in-half-open-state=3

resilience4j.retry.instances.inventario.max-attempts=2
resilience4j.retry.instances.inventario.wait-duration=200ms

# Solo cuenta como fallo, y solo se reintenta, la indisponibilidad real. Un
# rechazo de negocio -el elemento ya esta bloqueado por otra subasta, o la
# identidad es ajena- es una respuesta correcta: reintentarla da lo mismo y
# abrir el cortacircuitos por ella dejaria el servicio sin inventario por algo
# que no es una averia. Lista blanca en vez de lista negra, para que una
# excepcion nueva no entre por descuido.
resilience4j.retry.instances.inventario.retry-exceptions[0]=\
  com.nexusbattles.ms_subastas.subastas.port.InventarioNoDisponibleException

resilience4j.circuitbreaker.instances.inventario.record-exceptions[0]=\
  com.nexusbattles.ms_subastas.subastas.port.InventarioNoDisponibleException

# --- Reglas de 7.7 que decide administracion (B8) ----------------------------
# Salen de admin-parametros (GET /parametros/{clave}/valor, ruta publica):
#   subastas.incremento-minimo            SIN respaldo: es decision del PO
#                                         (RF-SUB-002). Sin valor en el catalogo,
#                                         publicar responde 503
#                                         parametro-no-configurado. Hasta B8 salia
#                                         de SUBASTAS_INCREMENTO_MINIMO, vacia en DEV.
#   subastas.max-subastas-activas-por-jugador / max-pujas / intervalo-minimo:
#                                         respaldo en las app.pujas.* de abajo.
#   subastas.pendientes.al-vencer         respaldo en app.subastas.pendientes.al-vencer.
# Vacia (desarrollo local sin catalogo), todo sale del respaldo.
app.parametros.url=${PARAMETROS_URL:}
app.parametros.cache-segundos=${SUBASTAS_PARAMETROS_CACHE_SEGUNDOS:30}
app.parametros.timeout-ms=${PARAMETROS_TIMEOUT_MS:1500}

# Respaldo de los limites de participacion (7.7.10). Los valores son los del
# documento; el Project Charter los declara inalterables.
app.pujas.max-subastas-activas-por-jugador=${MAX_SUBASTAS_ACTIVAS:10}
app.pujas.max-pujas-activas-por-jugador=${MAX_PUJAS_ACTIVAS:50}
app.pujas.intervalo-minimo-segundos=${INTERVALO_MIN_PUJAS:5}

# DECISION DEL PO PENDIENTE (7.7.9 fija 7 dias para recoger lo ganado y no dice
# que pasa despues). PROVISIONAL: ENTREGAR, el producto pasa disponible al
# inventario del ganador. Alternativa implementada: DEVOLVER_AL_VENDEDOR.
app.subastas.pendientes.al-vencer=${SUBASTAS_PENDIENTES_AL_VENCER:ENTREGAR}
app.subastas.pendientes-intervalo-ms=${SUBASTAS_PENDIENTES_MS:300000}
# Aviso 1 hora antes del cierre (7.7.8): cada cuanto se buscan subastas por avisar.
app.subastas.recordatorio-intervalo-ms=${SUBASTAS_RECORDATORIO_MS:60000}
# Una Idempotency-Key de publicacion que quedo EN_CURSO (proceso caido a mitad)
# pasa a INCIERTA pasado este plazo: se pide conciliacion, no se republica.
app.subastas.idempotencia.en-curso-caduca-segundos=${SUBASTAS_IDEMPOTENCIA_CADUCA_S:120}

# Regla 3 de plataforma: todo servicio expone salud y métricas de Actuator.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.health.circuitbreakers.enabled=true

# Cortacircuitos hacia ms-finanzas.
# La reserva de créditos ocurre DENTRO del lock de la fila de la subasta,
# así que una caída de ese servicio congelaría todas las pujas de esa subasta
# si no se corta rápido.
resilience4j.circuitbreaker.instances.creditos.sliding-window-size=20
resilience4j.circuitbreaker.instances.creditos.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.creditos.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.creditos.permitted-number-of-calls-in-half-open-state=3

resilience4j.retry.instances.creditos.max-attempts=2
resilience4j.retry.instances.creditos.wait-duration=200ms

# Los rechazos de negocio NO son fallos del servicio:
# no deben reintentarse ni abrir el cortacircuitos.
# Saldo insuficiente es una respuesta válida y liberar dos veces
# la misma reserva es un error de negocio, no una recuperación.
# Lista blanca, no negra: solo la indisponibilidad real se reintenta y solo
# ella cuenta como fallo. Un saldo insuficiente o una reserva ya liberada son
# respuestas correctas del servicio; reintentarlas da lo mismo y abrir el
# cortacircuitos por ellas dejaria sin creditos a todo el mundo.
resilience4j.retry.instances.creditos.retry-exceptions[0]=\
  com.nexusbattles.ms_subastas.pujas.creditos.CreditoNoDisponibleException

resilience4j.circuitbreaker.instances.creditos.record-exceptions[0]=\
  com.nexusbattles.ms_subastas.pujas.creditos.CreditoNoDisponibleException

# Doble en memoria mientras no exista el endpoint real de ms-finanzas.
app.finanzas.modo=${FINANZAS_MODO:fake}

# Creditos ficticios con los que aparece cada jugador mientras se usa el doble.
# Tiene que ser mayor que cero: sin ms-finanzas no hay forma de acreditar a
# nadie, asi que con cero toda puja muere en SALDO_INSUFICIENTE y la historia
# no se puede ni demostrar. Se ignora en cuanto exista el cliente real.
app.finanzas.saldo-inicial-doble=${FINANZAS_SALDO_DOBLE:5000}

# Modulo de notificaciones (equipo de plataforma). El drenador del outbox
# entrega ahi los avisos de los criterios 2 y 4 de HU-SUB-004 por
# POST /internal/notifications. Ese camino es provisional por decision de su
# dueno: cuando exista el bus de eventos se retira y se publica un evento.
app.notificaciones.base-url=${NOTIFICACIONES_BASE_URL:http://localhost:8085/api/v1}
app.notificaciones.timeout-ms=${NOTIFICACIONES_TIMEOUT_MS:3000}
app.notificaciones.drenaje-intervalo-ms=${NOTIFICACIONES_DRENAJE_MS:5000}

# Correo de los avisos de 7.7.8 (B8): POST /api/v1/correos/subasta con
# Idempotency-Key estable por evento, y el contacto del jugador pedido a
# ms-identidad en el momento (GET /api/v1/internal/usuarios/{uid}/contacto).
# Las dos URL SIN /api/v1 (la ruta ya lo lleva). CORREO_URL vacia = sin correo:
# los avisos van solo a la bandeja (desarrollo local, banco E2E).
app.correo.url=${CORREO_URL:}
app.correo.timeout-ms=${CORREO_TIMEOUT_MS:3000}
app.correo.drenaje-intervalo-ms=${CORREO_DRENAJE_MS:10000}
app.correo.reintento-base-segundos=${CORREO_REINTENTO_BASE_S:30}
app.correo.max-intentos=${CORREO_MAX_INTENTOS:8}
app.identidad.url=${IDENTIDAD_URL:http://localhost:8089}
app.identidad.timeout-ms=${IDENTIDAD_TIMEOUT_MS:3000}

# --- Validacion del JWT que emite ms-identidad (ADR-002) ---------------------
# Servidor de recursos contra el JWKS de ms-identidad, igual que el resto de
# servicios: la firma es RS256 y la clave publica se descarga de ahi. Solo por
# variable de entorno (regla 10). Este servicio nunca emite tokens, solo los
# valida; los roles y el uid los traduce ConversorRolesJwt (plataforma-seguridad).
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${IDENTIDAD_JWKS_URL:http://localhost:8089/api/v1/auth/jwks}

app.sanciones.base-url=${SANCIONES_BASE_URL:http://localhost:8086}
app.sanciones.timeout-ms=${SANCIONES_TIMEOUT_MS:5000}
