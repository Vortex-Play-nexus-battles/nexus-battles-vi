server.port=8092
server.servlet.context-path=/api/v1
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:subastas_db}
spring.datasource.username=${DB_USER:subastas_user}
spring.datasource.password=${DB_PASSWORD}
spring.mvc.problem-details.enabled=true
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion de Hibernate y JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ms-finanzas: endpoint de reserva/liberacion/consumo de creditos (HU-SUB-004)
app.finanzas.base-url=${FINANZAS_BASE_URL:http://localhost:8093/api/v1}

# Parametros de participacion en pujas (RF-SUB-004), configurables desde admin-parametros
app.pujas.max-subastas-activas-por-jugador=${MAX_SUBASTAS_ACTIVAS:10}
app.pujas.max-pujas-activas-por-jugador=${MAX_PUJAS_ACTIVAS:50}
app.pujas.intervalo-minimo-segundos=${INTERVALO_MIN_PUJAS:5}
