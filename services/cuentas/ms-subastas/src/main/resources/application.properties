server.port=8092
server.servlet.context-path=/api/v1

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:subastas_db}
spring.datasource.username=${DB_USER:subastas_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.mvc.problem-details.enabled=true

# Origenes que pueden llamar a esta API desde un navegador. En desarrollo, el
# servidor estatico del frontend (8080/5500) y el frontend servido por ms-identidad (8089).
# En cualquier despliegue real hay que pasar el dominio de verdad por variable de entorno
# (regla 10 de plataforma): sin CORS la pantalla de subastas no carga ni el listado publico.
app.cors.origenes-permitidos=${CORS_ORIGENES:http://localhost:8080,http://127.0.0.1:8080,http://localhost:8089,http://127.0.0.1:8089,http://localhost:5500,http://127.0.0.1:5500}

# Configuración de Hibernate y JPA. El esquema lo gobierna Flyway
# (regla del proyecto: migraciones solo por Flyway, nunca a mano ni por ddl-auto).
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ms-finanzas: endpoint de reserva/liberación/consumo de créditos (HU-SUB-004)
app.finanzas.base-url=${FINANZAS_BASE_URL:http://localhost:8093/api/v1}

# Catálogo de productos consumido por HU-SUB-001.
app.catalogo.base-url=${CATALOGO_BASE_URL:http://localhost:8080}
app.catalogo.timeout-ms=${CATALOGO_TIMEOUT_MS:5000}

# ms-inventario consumido por HU-SUB-001 y entrega de productos (HU-SUB-004)
app.inventario.base-url=${INVENTARIO_BASE_URL:http://localhost:8080}
app.inventario.timeout-ms=${INVENTARIO_TIMEOUT_MS:5000}
app.inventario.modo=${INVENTARIO_MODO:fake}

# Incremento mínimo de puja.
# El valor definitivo está pendiente de definición por el Product Owner.
app.subastas.incremento-minimo=${SUBASTAS_INCREMENTO_MINIMO:}

# Parámetros de participación en pujas (RF-SUB-004), configurables desde admin-parámetros.
app.pujas.max-subastas-activas-por-jugador=${MAX_SUBASTAS_ACTIVAS:10}
app.pujas.max-pujas-activas-por-jugador=${MAX_PUJAS_ACTIVAS:50}
app.pujas.intervalo-minimo-segundos=${INTERVALO_MIN_PUJAS:5}

# Regla 3 de plataforma: todo servicio expone salud y métricas de Actuator.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.health.circuitbreakers.enabled=true

# Cortacircuitos hacia ms-finanzas.
# La reserva de créditos ocurre DENTRO del lock de la fila de la subasta,
# así que una caída de ese servicio congelaría todas las pujas de esa subasta
# si no se corta rápido.
resilience4j.circuitbreaker.instances.creditos.sliding-window-size=20
resilience4j.circuitbreaker.instances.creditos.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.creditos.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.creditos.permitted-number-of-calls-in-half-open-state=3

resilience4j.retry.instances.creditos.max-attempts=2
resilience4j.retry.instances.creditos.wait-duration=200ms

# Los rechazos de negocio NO son fallos del servicio:
# no deben reintentarse ni abrir el cortacircuitos.
# Saldo insuficiente es una respuesta válida y liberar dos veces
# la misma reserva es un error de negocio, no una recuperación.
resilience4j.retry.instances.creditos.ignore-exceptions[0]=\
  com.nexusbattles.ms_subastas.pujas.creditos.CreditoClientException

resilience4j.circuitbreaker.instances.creditos.ignore-exceptions[0]=\
  com.nexusbattles.ms_subastas.pujas.creditos.CreditoClientException

# Doble en memoria mientras no exista el endpoint real de ms-finanzas.
app.finanzas.modo=${FINANZAS_MODO:fake}

# Creditos ficticios con los que aparece cada jugador mientras se usa el doble.
# Tiene que ser mayor que cero: sin ms-finanzas no hay forma de acreditar a
# nadie, asi que con cero toda puja muere en SALDO_INSUFICIENTE y la historia
# no se puede ni demostrar. Se ignora en cuanto exista el cliente real.
app.finanzas.saldo-inicial-doble=${FINANZAS_SALDO_DOBLE:5000}

# Modulo de notificaciones (equipo de plataforma). El drenador del outbox
# entrega ahi los avisos de los criterios 2 y 4 de HU-SUB-004 por
# POST /internal/notifications. Ese camino es provisional por decision de su
# dueno: cuando exista el bus de eventos se retira y se publica un evento.
app.notificaciones.base-url=${NOTIFICACIONES_BASE_URL:http://localhost:8085/api/v1}
app.notificaciones.timeout-ms=${NOTIFICACIONES_TIMEOUT_MS:3000}
app.notificaciones.drenaje-intervalo-ms=${NOTIFICACIONES_DRENAJE_MS:5000}

# --- Validacion del JWT que emite ms-identidad -------------------------------
# Tiene que ser LA MISMA clave con la que ms-identidad firma, o todo token
# legitimo se rechaza por firma invalida. Solo por variable de entorno (regla 10
# de plataforma): el valor de desarrollo de abajo nunca se usa en produccion.
# Este servicio nunca emite tokens, solo los valida.
app.jwt.clave-secreta=${JWT_CLAVE_SECRETA:una-clave-de-desarrollo-muy-larga-que-nunca-se-usa-en-produccion-cambiala-siempre}

app.sanciones.base-url=${SANCIONES_BASE_URL:http://localhost:8086}
app.sanciones.timeout-ms=${SANCIONES_TIMEOUT_MS:5000}
