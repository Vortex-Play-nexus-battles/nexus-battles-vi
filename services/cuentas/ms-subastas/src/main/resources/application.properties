server.port=8092
server.servlet.context-path=/api/v1
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:subastas_db}
spring.datasource.username=${DB_USER:subastas_user}
spring.datasource.password=${DB_PASSWORD}
spring.mvc.problem-details.enabled=true
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion de Hibernate y JPA. El esquema lo gobierna Flyway
# (regla del proyecto: migraciones solo por Flyway, nunca a mano ni por ddl-auto).
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ms-finanzas: endpoint de reserva/liberacion/consumo de creditos (HU-SUB-004)
app.finanzas.base-url=${FINANZAS_BASE_URL:http://localhost:8093/api/v1}

# Parametros de participacion en pujas (RF-SUB-004), configurables desde admin-parametros
app.pujas.max-subastas-activas-por-jugador=${MAX_SUBASTAS_ACTIVAS:10}
app.pujas.max-pujas-activas-por-jugador=${MAX_PUJAS_ACTIVAS:50}
app.pujas.intervalo-minimo-segundos=${INTERVALO_MIN_PUJAS:5}

# Regla 3 de plataforma: todo servicio expone salud y metricas de Actuator.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.health.circuitbreakers.enabled=true

# Cortacircuitos hacia ms-finanzas. La reserva de creditos ocurre DENTRO del
# lock de la fila de la subasta, asi que una caida de ese servicio congelaria
# todas las pujas de esa subasta si no se corta rapido.
resilience4j.circuitbreaker.instances.creditos.sliding-window-size=20
resilience4j.circuitbreaker.instances.creditos.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.creditos.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.creditos.permitted-number-of-calls-in-half-open-state=3
resilience4j.retry.instances.creditos.max-attempts=2
resilience4j.retry.instances.creditos.wait-duration=200ms

# Los rechazos de negocio NO son fallos del servicio: no deben reintentarse ni
# abrir el cortacircuitos. Saldo insuficiente es una respuesta valida, y
# liberar dos veces la misma reserva es un error, no una recuperacion.
resilience4j.retry.instances.creditos.ignore-exceptions[0]=\
  com.nexusbattles.ms_subastas.pujas.creditos.CreditoClientException
resilience4j.circuitbreaker.instances.creditos.ignore-exceptions[0]=\
  com.nexusbattles.ms_subastas.pujas.creditos.CreditoClientException

# Doble en memoria mientras no exista el endpoint real de ms-finanzas.
app.finanzas.modo=${FINANZAS_MODO:fake}
