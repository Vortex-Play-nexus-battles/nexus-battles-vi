server.port=8090
server.servlet.context-path=/api/v1
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:ecommerce_db}
spring.datasource.username=${DB_USER:ecom_user}
spring.datasource.password=${DB_PASSWORD}
spring.mvc.problem-details.enabled=true
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion de Hibernate y JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true