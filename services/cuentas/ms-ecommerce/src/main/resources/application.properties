server.port=8090
server.servlet.context-path=/ecommerce
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:ecommerce_db}
spring.datasource.username=${DB_USER:ecom_user}
spring.datasource.password=${DB_PASSWORD}
spring.mvc.problem-details.enabled=true

# Esquema por Flyway (regla 8 de plataforma): Hibernate solo VALIDA que las
# entidades casen con las tablas; nunca las crea ni las altera. Una base que
# ya existia con las tablas creadas por el antiguo ddl-auto=update se
# baselinea en la version 1 y sigue desde ahi.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


springdoc.api-docs.path=/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Clave publica con la que se verifican los tokens de acceso (ADR-002). Hoy la
# publica ms-identidad; con Keycloak solo cambia la URL, por variable de entorno.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${IDENTIDAD_JWKS_URL:http://localhost:8089/api/v1/auth/jwks}

# Catalogo maestro (servicio productos): la vitrina y el carrito lo proyectan
# en lugar de mantener una copia propia (RF-CAR-001, RF-CAR-010). Sus lecturas
# son publicas, sin token. Tiempos cortos a proposito: el borde (nginx) corta a
# los 60 s y este servicio tiene que rendirse antes para contestar un 503 con
# Retry-After, no dejar que el borde conteste un 504.
catalogo.productos.url=${PRODUCTOS_URL:http://localhost:8103}
catalogo.productos.timeout-conexion=2s
catalogo.productos.timeout-lectura=3s

# Regla 3 de plataforma: salud Y metricas. Mismo olvido que inventario, mismo
# arreglo (R11): sin esto el servicio solo exponia `health` por omision y el
# tablero de HU-MET-004 no podia leer ninguna metrica suya.
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Origenes del navegador (ConfiguracionCors, regla 10). En dev, el del borde.
app.cors.origenes-permitidos=${CORS_ORIGENES:http://localhost:8080,http://127.0.0.1:8080}
