server.port=8090
server.servlet.context-path=/ecommerce
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:ecommerce_db}
spring.datasource.username=${DB_USER:ecom_user}
spring.datasource.password=${DB_PASSWORD}
spring.mvc.problem-details.enabled=true

# Esquema por Flyway (regla 8 de plataforma): Hibernate solo VALIDA que las
# entidades casen con las tablas; nunca las crea ni las altera. Una base que
# ya existia con las tablas creadas por el antiguo ddl-auto=update se
# baselinea en la version 1 y sigue desde ahi.
spring.jpa.hibernate.ddl-auto=validate
# Sin sesion de JPA abierta durante toda la peticion (open-in-view, activo por
# defecto). La compra trabaja con transacciones cortas y relee la orden en cada
# paso; con la sesion de la peticion, esa relectura devolvia la copia en
# memoria, anterior a la concesion tomada, y el reintento tras un 503 fallaba
# por bloqueo optimista. El carrito ya se lee dentro de su transaccion.
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


springdoc.api-docs.path=/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Clave publica con la que se verifican los tokens de acceso (ADR-002). Hoy la
# publica ms-identidad; con Keycloak solo cambia la URL, por variable de entorno.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${IDENTIDAD_JWKS_URL:http://localhost:8089/api/v1/auth/jwks}

# Catalogo maestro (servicio productos): la vitrina y el carrito lo proyectan
# en lugar de mantener una copia propia (RF-CAR-001, RF-CAR-010). Sus lecturas
# son publicas, sin token. Tiempos cortos a proposito: el borde (nginx) corta a
# los 60 s y este servicio tiene que rendirse antes para contestar un 503 con
# Retry-After, no dejar que el borde conteste un 504.
catalogo.productos.url=${PRODUCTOS_URL:http://localhost:8103}
catalogo.productos.timeout-conexion=2s
catalogo.productos.timeout-lectura=3s

# Regla 3 de plataforma: salud Y metricas. Mismo olvido que inventario, mismo
# arreglo (R11): sin esto el servicio solo exponia `health` por omision y el
# tablero de HU-MET-004 no podia leer ninguna metrica suya.
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Origenes del navegador (ConfiguracionCors, regla 10). En dev, el del borde.
app.cors.origenes-permitidos=${CORS_ORIGENES:http://localhost:8080,http://127.0.0.1:8080}

# Regla 6 de plataforma: bitacora en JSON hacia stdout, con el traceId de cada
# compra en el MDC (FiltroDeTraza). Mismo mecanismo que productos.
logging.structured.format.console=${LOGGING_STRUCTURED_FORMAT_CONSOLE:ecs}

# ---------------------------------------------------------------------------
# B5 - la compra (POST /checkout) y lo que necesita de los demas servicios.
# ---------------------------------------------------------------------------
# Credencial de servicio de la tienda (ADR-001 via el emisor de ADR-005): la
# pide a ms-identidad por client_credentials y la usa para reservar tiraje,
# entregar, registrar el pago, pedir el contacto del comprador, enviar el correo
# y leer el inventario de un jugador. Sin client_id la vitrina y el carrito
# funcionan y la compra responde 503. Ningun valor real aqui (regla 10).
tienda.credencial.url=${DIRECTORIO_ACTIVO_URL:http://localhost:8089/api/v1/auth/token}
tienda.credencial.client-id=${DIRECTORIO_ACTIVO_CLIENT_ID:}
tienda.credencial.client-secret=${DIRECTORIO_ACTIVO_CLIENT_SECRET:}

# Bases de los servicios de la compra, con los mismos nombres de variable que
# ya usan los demas servicios. El catalogo es PRODUCTOS_URL (arriba).
tienda.servicios.inventario=${INVENTARIO_BASE_URL:http://localhost:8102}
tienda.servicios.finanzas=${FINANZAS_BASE_URL:http://localhost:8093/api/v1}
tienda.servicios.correo=${CORREO_URL:http://localhost:8082}
tienda.servicios.identidad=${IDENTIDAD_URL:http://localhost:8089}
# Tasas COP -> USD/EUR (parametros tienda.tasa-cop-usd y tienda.tasa-cop-eur).
# Vacia = no se consulta: la tienda solo vende en COP.
tienda.servicios.parametros=${PARAMETROS_URL:http://localhost:8088/api/v1}
tienda.http.timeout-conexion=2s
tienda.http.timeout-lectura=5s

# El correo de confirmacion (7.5). false SOLO en un entorno sin servicio de
# correo (el banco E2E de esta rama): la orden se completa y lo dice
# (correoConfirmacion: OMITIDO). En cualquier otro, true.
tienda.correo.habilitado=${TIENDA_CORREO_HABILITADO:true}
# Zona de la fecha que lleva el correo.
tienda.zona-horaria=${TIENDA_ZONA_HORARIA:America/Bogota}

# La tarea que termina las compras a medias (ReanudadorDeOrdenes).
tienda.ordenes.reanudacion.habilitada=${TIENDA_REANUDACION_HABILITADA:true}
tienda.ordenes.reanudacion.intervalo-ms=${TIENDA_REANUDACION_INTERVALO_MS:15000}
tienda.ordenes.concesion=2m
tienda.ordenes.pendiente-caduca-tras=30m
tienda.ordenes.reintento-inicial=15s
tienda.ordenes.reintento-maximo=15m
tienda.ordenes.lote=20
