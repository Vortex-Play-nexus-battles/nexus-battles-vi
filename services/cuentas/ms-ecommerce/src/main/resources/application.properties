server.port=8090
server.servlet.context-path=/ecommerce
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:ecommerce_db}
spring.datasource.username=${DB_USER:ecom_user}
spring.datasource.password=${DB_PASSWORD}
spring.mvc.problem-details.enabled=true

# Configuraci?n de Hibernate y JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


springdoc.api-docs.path=/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
