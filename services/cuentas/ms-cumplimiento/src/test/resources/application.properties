spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update

# Este archivo SUSTITUYE al application.properties principal en las pruebas,
# asi que lo que la cadena de seguridad necesita para arrancar va aqui.
# El decodificador es perezoso: no se toca este JWKS hasta el primer token.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8089/api/v1/auth/jwks
spring.mvc.problemdetails.enabled=true
cumplimiento.auditoria.exigir-2fa=false
