spring.application.name=ms-cumplimiento
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:cumplimientodb}
spring.datasource.username=${DB_USER:usuario_cumplimiento}
spring.datasource.password=${DB_PASSWORD:password_cumplimiento_local}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
server.port=8091

# Regla 4: errores como problem details (RFC 7807).
spring.mvc.problemdetails.enabled=true

# Clave publica con la que se verifican los tokens (ADR-002/ADR-005): el
# SUPER_ADMINISTRADOR que consulta y la credencial de servicio de ms-identidad
# que escribe eventos. Hoy la publica ms-identidad; con Keycloak solo cambia
# la URL, por variable de entorno.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${IDENTIDAD_JWKS_URL:http://localhost:8089/api/v1/auth/jwks}

# Segundo factor para consultar la bitacora (RequireSuperAdmin2FAAspect).
# ms-identidad todavia no emite ningun claim de 2FA, asi que exigirlo hoy es
# negar siempre; queda apagado hasta que exista (decision pendiente del PO).
cumplimiento.auditoria.exigir-2fa=${AUDITORIA_EXIGIR_2FA:false}

# Regla 3: salud y metricas de Actuator (desplegar.sh sondea /actuator/health).
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
