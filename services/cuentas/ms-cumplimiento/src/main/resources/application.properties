spring.application.name=ms-cumplimiento
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:cumplimientodb}
spring.datasource.username=${DB_USER:usuario_cumplimiento}
spring.datasource.password=${DB_PASSWORD:password_cumplimiento_local}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
server.port=8091

# Regla 4: errores como problem details (RFC 7807).
spring.mvc.problemdetails.enabled=true

# Clave publica con la que se verifican los tokens (ADR-002/ADR-005): el
# SUPER_ADMINISTRADOR que consulta y la credencial de servicio de ms-identidad
# que escribe eventos. Hoy la publica ms-identidad; con Keycloak solo cambia
# la URL, por variable de entorno.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${IDENTIDAD_JWKS_URL:http://localhost:8089/api/v1/auth/jwks}

# Segundo factor para consultar la bitacora (RequireSuperAdmin2FAAspect).
# ms-identidad todavia no emite ningun claim de 2FA, asi que exigirlo hoy es
# negar siempre; queda apagado hasta que exista (decision pendiente del PO).
cumplimiento.auditoria.exigir-2fa=${AUDITORIA_EXIGIR_2FA:false}

# Tope del tamano de pagina de la consulta (contrato 1.3.0): antes no habia
# ninguno y `size=100000` materializaba toda la bitacora en memoria.
spring.data.web.pageable.max-page-size=100

# Regla 3: salud y metricas de Actuator (desplegar.sh sondea /actuator/health).
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true

# SA-18 (§7.2.5, §7.3.5) — la bitacora importa las operaciones de los
# administradores sobre el catalogo (GET /api/v1/productos/auditoria/operaciones
# de productos.yaml 1.12.0) con la credencial de servicio de este servicio
# (ADR-005; desplegar.sh la genera en el host de plataforma, donde vive el
# emisor). Sin CATALOGO_URL o sin la credencial, la importacion queda apagada y
# el servicio arranca igual. `solape`: cuanto se vuelve a pedir hacia atras en
# cada ronda para no perder una operacion escrita justo despues de una lectura
# (las repetidas no se registran dos veces: referencia unica).
cumplimiento.catalogo.url=${CATALOGO_URL:}
cumplimiento.catalogo.intervalo=${AUDITORIA_CATALOGO_INTERVALO:PT30S}
cumplimiento.catalogo.retraso-inicial=${AUDITORIA_CATALOGO_RETRASO_INICIAL:PT45S}
cumplimiento.catalogo.solape=${AUDITORIA_CATALOGO_SOLAPE:PT2M}
cumplimiento.catalogo.limite=100
cumplimiento.catalogo.lotes-por-ronda=10
cumplimiento.credencial.url=${DIRECTORIO_ACTIVO_URL:}
cumplimiento.credencial.client-id=${DIRECTORIO_ACTIVO_CLIENT_ID:}
cumplimiento.credencial.client-secret=${DIRECTORIO_ACTIVO_CLIENT_SECRET:}
