spring.application.name=ms-cumplimiento
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:cumplimientodb}
spring.datasource.username=${DB_USER:usuario_cumplimiento}
spring.datasource.password=${DB_PASSWORD:password_cumplimiento_local}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
server.port=8091
