spring.application.name=servicio-misiones
spring.threads.virtual.enabled=true

# Regla 10 de plataforma: configuracion solo por variable de entorno, con
# plantilla en el repo (.env.example junto al servicio) y ningun valor real.
# Todos los servicios de contenido escuchan en 8080 dentro del contenedor.
server.port=${PUERTO_MISIONES:8080}

# Base documental propia (regla 7: nadie mas la lee). Boot 4 lee
# spring.mongodb.uri, no el spring.data.mongodb.uri de Boot 3 (ver heroes).
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/misiones}
# Los indices de las colecciones (EjecucionDocumento) los crea Spring al
# arrancar, como en inventario: entre ellos el unico parcial que impide dos
# ejecuciones en curso de la misma mision para el mismo jugador.
spring.data.mongodb.auto-index-creation=true

# El contrato declara ausentes, no nulos, los campos opcionales sin valor.
spring.jackson.default-property-inclusion=non-null

# Servidor de recursos: el emisor es ms-identidad (ADR-002/ADR-005).
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=\
  ${IDENTIDAD_JWKS_URL:http://localhost:8089/api/v1/auth/jwks}

# Regla 3: salud y metricas de Actuator. Regla 6: bitacora JSON a stdout.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
logging.structured.format.console=ecs

# --- Dependencias (REST sincrono con credencial de servicio, ADR-001/005) ---
# La credencial la arma plataforma-seguridad con DIRECTORIO_ACTIVO_URL,
# DIRECTORIO_ACTIVO_CLIENT_ID (misiones) y DIRECTORIO_ACTIVO_CLIENT_SECRET.
misiones.heroes.url=${HEROES_BASE_URL:http://localhost:8101}
misiones.inventario.url=${INVENTARIO_BASE_URL:http://localhost:8102}
misiones.productos.url=${PRODUCTOS_BASE_URL:http://localhost:8103}
misiones.motor.url=${MOTOR_COMBATE_URL:http://localhost:8104}
# ms-finanzas: la base incluye su /api/v1 (creditos.yaml), como en salas y torneos.
misiones.creditos.url=${CREDITOS_URL:http://localhost:8093/api/v1}
# correo: la base incluye su /api/v1 (correo.yaml).
misiones.correo.url=${CORREO_URL:http://localhost:8082/api/v1}
# notificaciones (bandeja del jugador, RF-NOT-004): la base incluye su /api/v1
# (notificaciones.yaml), como la de correo.
misiones.notificaciones.url=${NOTIFICACIONES_URL:http://localhost:8085/api/v1}
misiones.identidad.url=${IDENTIDAD_URL:http://localhost:8089}

# HU-DIS-003: tiempos acotados en toda llamada saliente y un corta circuitos
# por dependencia.
resiliencia.tiempo-conexion-ms=${RESILIENCIA_TIEMPO_CONEXION_MS:2000}
resiliencia.tiempo-respuesta-ms=${RESILIENCIA_TIEMPO_RESPUESTA_MS:10000}
resiliencia.fallos-para-abrir=${RESILIENCIA_FALLOS_PARA_ABRIR:3}
resiliencia.reintentar-en-segundos=${RESILIENCIA_REINTENTAR_EN_SEGUNDOS:30}

# --- El modulo (ver el README: que es del documento y que es provisional) ---
# Cuanto dura en tiempo real una hora de mision. 3600 = una hora de verdad.
misiones.segundos-por-hora=${MISIONES_SEGUNDOS_POR_HORA:3600}
# Cada cuanto mira el trabajo en segundo plano las ejecuciones vencidas y las
# entregas pendientes, y cuantas atiende por vuelta.
misiones.trabajo.intervalo-ms=${MISIONES_INTERVALO_MS:30000}
misiones.trabajo.lote=${MISIONES_LOTE:20}
misiones.reintento-segundos=${MISIONES_REINTENTO_SEGUNDOS:30}
misiones.correo.activo=${MISIONES_CORREO_ACTIVO:true}
# Aviso en la bandeja del jugador al terminar (finalizacion con el detalle de
# cada recompensa, epica obtenida y misiones desbloqueadas; RF-NOT-004).
misiones.avisos.activo=${MISIONES_AVISOS_ACTIVO:true}
# Solo pruebas y banco E2E: fija el azar de todas las ejecuciones.
misiones.semilla-de-pruebas=${MISIONES_SEMILLA_DE_PRUEBAS:}
# Solo banco E2E y desarrollo: publica la semilla PROVISIONAL DE DEV.
misiones.semilla-provisional=${MISIONES_SEMILLA_PROVISIONAL:false}
# Solo el banco E2E: ruta de una semilla EXTRA en disco (no esta en el jar). La
# monta tests/e2e/compose.yml con una mision cuyo Master siempre aparece; sin la
# variable no se carga nada, y con una ruta que no existe el servicio no arranca.
misiones.semilla-extra=${MISIONES_SEMILLA_EXTRA:}

# Decisiones del PO pendientes, con su valor provisional.
# Experiencia por completar segun dificultad (6.1.1 no da cifras).
misiones.experiencia-por-completar.facil=${MISIONES_XP_COMPLETAR_FACIL:0}
misiones.experiencia-por-completar.normal=${MISIONES_XP_COMPLETAR_NORMAL:0}
misiones.experiencia-por-completar.dificil=${MISIONES_XP_COMPLETAR_DIFICIL:0}
misiones.experiencia-por-completar.extremo=${MISIONES_XP_COMPLETAR_EXTREMO:0}
# Multiplicador de creditos por escalon (7.8.11 «mejores recompensas» sin
# cifra). Vacio = el mismo factor que las estadisticas (1,5 y 2).
misiones.creditos-por-escalon.heroico=${MISIONES_CREDITOS_HEROICO:}
misiones.creditos-por-escalon.legendario=${MISIONES_CREDITOS_LEGENDARIO:}
misiones.creditos-por-escalon.mitico=${MISIONES_CREDITOS_MITICO:}
# Multiplicador de estadisticas del escalon Mitico (sin cifra en 7.8.11).
# Vacio = Mitico no se ofrece.
misiones.multiplicador-mitico=${MISIONES_MULTIPLICADOR_MITICO:}
# HU-MIS-007 pide completar la mision para quedarse la epica; 7.8.4 solo
# derrotar al Master. Por omision manda el documento.
misiones.epica-exige-completar=${MISIONES_EPICA_EXIGE_COMPLETAR:false}

# --- IA de combate con red neuronal propia (HU-SIM-008, RF-MOT-59) ---
# Apagada por omision: las jugadas las decide solo la regla de rotaciones de heroes (7.8.5). Encendida y con
# un modelo valido en la ruta, el modelo PROPONE entre las jugadas que la regla admite y la regla ACOTA (rotacion,
# poder y recarga). Si el modelo no esta, esta danado o se hizo con otras caracteristicas, decide la regla.
# La ruta es la del modelo.onnx; su modelo.json va en la misma carpeta. Ver ia/README.md.
misiones.ia.modelo.habilitado=${MISIONES_IA_MODELO_HABILITADO:false}
misiones.ia.modelo.ruta=${MISIONES_IA_MODELO_RUTA:}
# Probabilidad (0 a 1) que debe tener la mejor jugada para que decida el modelo; con menos, decide la regla.
misiones.ia.modelo.confianza-minima=${MISIONES_IA_MODELO_CONFIANZA_MINIMA:0.6}
