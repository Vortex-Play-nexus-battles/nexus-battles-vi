// OJO: este modulo NO aplica 'nexus.spring-conventions' a proposito.
//
// motor-combate es logica de dominio pura (Java y JUnit, sin Spring). Si se le
// aplican las convenciones de Spring, Gradle le anade la tarea bootJar y el
// build falla con "Main class name has not been configured" porque no hay
// ninguna clase @SpringBootApplication. Cuando el motor necesite arrancar como
// servicio, se cambia este archivo por el plugin de convenciones.

plugins {
    id 'java'
    id 'jacoco'
}

group = 'nexus'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 0.80
            }
        }
    }
}

tasks.named('check') {
    dependsOn jacocoTestCoverageVerification
}
