# Configuracion del servicio de motor de combate.
#
# Regla 10 de plataforma: solo variables de entorno, ningun valor real
# versionado. Cada clave lleva un valor por omision apto para desarrollo local
# y se sobreescribe en cada entorno.

spring:
  application:
    name: motor-combate

  # R8.1 — servidor de recursos. El emisor real es ms-identidad (ADR-002 /
  # ADR-005), que publica su JWKS en GET /api/v1/auth/jwks. Se acepta tambien
  # KEYCLOAK_JWK_SET_URI por compatibilidad con los compose del host de
  # contenido, que hoy inyectan ese nombre; el renombrado de los tres servicios
  # es trabajo de R9.7.
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTIDAD_JWKS_URL:${KEYCLOAK_JWK_SET_URI:http://localhost:8089/api/v1/auth/jwks}}

server:
  port: ${SERVER_PORT:8080}

# Regla 3: todo servicio expone salud y metricas.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

# Regla 6: bitacora a stdout. El formato JSON de plataforma se conecta cuando
# exista la biblioteca comun; hoy 'shared/libs/' solo tiene un README.
logging:
  level:
    root: ${LOG_LEVEL:INFO}

# Servicio de heroes que consume ClienteHeroesHttp (HU-JUE-003). No se toca su
# implementacion: ya es un puerto de salida correcto y respeta la regla 7.
motor:
  heroes:
    url: ${HEROES_URL:http://localhost:8081}
    # B7: la ficha de combate de un prototipo en un nivel se guarda estos
    # segundos (es un dato del catalogo que no cambia entre turnos). 0 = sin cache.
    cache-segundos: ${MOTOR_HEROES_CACHE_SEGUNDOS:300}
  productos:
    url: ${PRODUCTOS_URL:http://localhost:8092}
  inventario:
    url: ${INVENTARIO_URL:http://localhost:8091}
  # B7, §6.1.4 y D-B7-01: el indice de la tabla de 8.000 filas sigue una normal.
  # El documento no fija media ni desviacion; por omision la tabla centrada
  # (4000.5) y cubierta a tres desviaciones por lado (8000 / 6).
  indice:
    media: ${MOTOR_INDICE_MEDIA:4000.5}
    desviacion: ${MOTOR_INDICE_DESVIACION:1333.3333333333333}
  # D-41: como decide la maquina con DECISION_DE_LA_MAQUINA (IA tactica por
  # reglas, no entrenada). FACIL, NORMAL o DIFICIL; una mal escrita no arranca.
  ia:
    dificultad: ${MOTOR_IA_DIFICULTAD:NORMAL}
