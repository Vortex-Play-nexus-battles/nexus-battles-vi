spring.application.name=servicio-inventario
spring.data.mongodb.auto-index-creation=true
spring.threads.virtual.enabled=true

# HU-INV-006: base del servicio de heroes para ResolutorDeEstadisticasHeroeHttp.
# No existia ninguna convencion previa de *_BASE_URL en el repo (se busco en
# motor-combate y en infrastructure/); heroes tampoco fija server.port, asi
# que 8081 es un puerto local distinto al 8080 por defecto de este mismo
# servicio, solo para no chocar en desarrollo local.
heroes.base-url=${HEROES_BASE_URL:http://localhost:8081}

# HU-INV-006: base del servicio de productos para ResolutorDeProductoHttp
# (HU-INV-007, PR #203 - GET /api/v1/productos/{id}, publico). Tampoco
# existia ninguna convencion de puerto: ni docker-compose.yml, ni
# infrastructure/, ni el propio application.properties de productos fijan
# server.port ni una variable *_BASE_URL. 8082 sigue el mismo criterio que
# heroes.base-url (8081): un puerto local distinto al 8080 por defecto y al
# 8081 ya usado por heroes, solo para no chocar en desarrollo local.
productos.base-url=${PRODUCTOS_BASE_URL:http://localhost:8082}

# Las operaciones internas de Subastas usan OAuth2 client_credentials.
#
# R9.7 — el emisor es ms-identidad, no Keycloak.
#
# El valor por omision de esta linea apuntaba a un realm de Keycloak
# (localhost:8180) que no existe, y la variable que leia —KEYCLOAK_JWK_SET_URI—
# es la unica que el CD **no** reparte: en el host de contenido siempre ganaba
# el jwks-dev del compose. O sea, este servicio validaba con una clave mientras
# ms-subastas y salas-partidas firmaban con otra, y sus llamadas S2S no podian
# funcionar en AWS. El banco E2E no lo destapaba porque su compose si fija el
# emisor correcto.
#
# Se prefiere IDENTIDAD_JWKS_URL, que el CD ya reparte, y se conserva
# KEYCLOAK_JWK_SET_URI como respaldo para no romper a quien la inyecte todavia.
# Mismo patron que heroes y motor-combate.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=\
  ${IDENTIDAD_JWKS_URL:${KEYCLOAK_JWK_SET_URI:http://localhost:8089/api/v1/auth/jwks}}
integraciones.subastas.client-id=${SUBASTAS_CLIENT_ID:ms-subastas}
