plugins {
    id 'nexus.spring-conventions'
    id 'nexus.seguridad-conventions'
}

group = 'nexus'
version = '0.0.1-SNAPSHOT'

// Lo comun (Spring Boot, Java 21, webmvc, actuator, JUnit 5, jacoco) baja del
// plugin de convenciones. Aqui solo lo propio de inventario: MongoDB y los
// contenedores de prueba.
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'

    // HU-INV-006: ResolutorDeEstadisticasHeroeHttp parsea el JSON de heroes
    // a mano con HttpClient (mismo patron que ClienteHeroesHttp en
    // motor-combate), no via RestClient/RestTemplate de Spring. A
    // diferencia de motor-combate, jackson-databind NO llega transitivo:
    // spring-boot-starter-webmvc en Spring Boot 4 no arrastra
    // spring-boot-starter-json por si sola. Sin version fija: la resuelve
    // io.spring.dependency-management via el BOM de Spring Boot, igual que
    // el resto de dependencias de este archivo.
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    testImplementation 'org.springframework.boot:spring-boot-starter-data-mongodb-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation platform('org.testcontainers:testcontainers-bom:1.21.4')
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mongodb'

    // Verificacion del pacto que ms-subastas publica sobre este servicio
    // (contracts/pactos/ms-subastas-ms-inventario.json). Misma version y mismo
    // modulo que ms-finanzas: `junit5` a secas, NO `junit5spring`, que esta
    // compilado contra javax.servlet y revienta en Spring Boot 4 (ver el
    // javadoc de VerificacionDelPactoDeSubastasTest en ms-finanzas).
    testImplementation 'au.com.dius.pact.provider:junit5:4.6.17'
}

// Los pactos viven fuera de este modulo, en contracts/pactos/, asi que Gradle
// no los ve como entrada de `test`: si solo cambia el pacto, la tarea queda
// UP-TO-DATE y la verificacion no se repite. Se comprobo metiendo a mano en el
// pacto los dos defectos que la verificacion destapo: siguio en verde sin
// correr. Declararlos hace que cualquier cambio del contrato la vuelva a
// ejecutar.
tasks.named('test') {
    inputs.dir(rootProject.file('contracts/pactos'))
            .withPropertyName('pactos')
            .withPathSensitivity(PathSensitivity.RELATIVE)
}
