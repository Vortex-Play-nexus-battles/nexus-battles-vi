# Perfil "mongo": catalogo persistido en MongoDB 8 (seccion 8 del documento:
# personajes e items en base documental). Reactiva las autoconfiguraciones
# que el perfil en memoria excluye, con su indicador de salud y sus metricas.
spring.autoconfigure.exclude=

# La URI llega por variable de entorno (regla 10 de plataforma); el valor por
# defecto es solo el Mongo local de desarrollo, nunca una credencial real. En
# las pruebas de integracion la conexion la aporta Testcontainers.
# Nombre de la propiedad en Spring Boot 4: spring.mongodb.uri (el antiguo
# spring.data.mongodb.uri de Boot 3 se ignora; verificado en el primer
# despliegue, corrida 34306037727, y cubierto por ConfiguracionMongoTest).
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/heroes}
