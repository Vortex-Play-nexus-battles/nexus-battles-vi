spring.application.name=servicio-heroes

# El contrato promete que ataque/dano/sanar van AUSENTES cuando no aplican
# (heroes.yaml: "Ausente en sanadores"), no presentes con valor null.
spring.jackson.default-property-inclusion=non-null

# Sin el perfil "mongo" el catalogo vive en memoria: no se crea cliente de
# Mongo, ni su indicador de salud ni sus metricas (application-mongo.properties
# reactiva todo). Nombres de clase verificados en Spring Boot 4.1.1.
spring.autoconfigure.exclude=\
  org.springframework.boot.mongodb.autoconfigure.MongoAutoConfiguration,\
  org.springframework.boot.mongodb.autoconfigure.health.MongoHealthContributorAutoConfiguration,\
  org.springframework.boot.mongodb.autoconfigure.metrics.MongoMetricsAutoConfiguration,\
  org.springframework.boot.data.mongodb.autoconfigure.DataMongoAutoConfiguration,\
  org.springframework.boot.data.mongodb.autoconfigure.DataMongoRepositoriesAutoConfiguration

# Regla 3 de plataforma: todo servicio expone salud y metricas de Actuator.
management.endpoints.web.exposure.include=health,info,metrics

# Regla 6 de plataforma: bitacora en JSON hacia stdout, nunca a archivo.
logging.structured.format.console=ecs

# Regla 10 de plataforma: configuracion solo por variable de entorno, con
# plantilla en el repo (.env.example junto al servicio) y ningun valor real.
server.port=${PUERTO_HEROES:8080}
