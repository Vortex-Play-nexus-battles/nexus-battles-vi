plugins {
    id 'nexus.spring-conventions'
    // R9.7 — trae plataforma-seguridad (ConversorRolesJwt, que entiende la
    // forma de ms-identidad) y sus fixtures de tokens reales para las pruebas.
    id 'nexus.seguridad-conventions'
}

group = 'nexus'
version = '0.0.1-SNAPSHOT'

// Web MVC, Actuator, Java 21, JUnit 5 y JaCoCo provienen de la convención.
// Aquí se declaran únicamente las dependencias propias de Productos.
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:3.1.0'

    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    testImplementation 'org.springframework.boot:spring-boot-starter-data-mongodb-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-mongodb'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'io.rest-assured:rest-assured:6.0.1'

    // B5: verificacion del pacto que ms-ecommerce publica sobre este servicio
    // (contracts/pactos/ms-ecommerce-productos.json). Misma version y mismo
    // modulo que inventario y ms-finanzas: `junit5` a secas, NO `junit5spring`,
    // que esta compilado contra javax.servlet y revienta en Spring Boot 4 (ver
    // el javadoc de VerificacionDelPactoDeSubastasTest en ms-finanzas).
    testImplementation 'au.com.dius.pact.provider:junit5:4.6.17'
}

// Los pactos viven fuera de este modulo, en contracts/pactos/, asi que Gradle
// no los ve como entrada de `test`: si solo cambiara el pacto, la tarea quedaria
// UP-TO-DATE y la verificacion no se repetiria. Mismo arreglo que inventario.
tasks.named('test') {
    inputs.dir(rootProject.file('contracts/pactos'))
            .withPropertyName('pactos')
            .withPathSensitivity(PathSensitivity.RELATIVE)
}

// Productos ya cuenta con pruebas suficientes, por eso activa desde ahora
// la compuerta corporativa del 80 % definida en nexus.spring-conventions.
tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('test')
}

// El frontend de Productos vive en la carpeta transversal aprobada. Se copia
// al JAR ejecutable sin duplicar sus fuentes y conserva las rutas de imports.
tasks.named('processResources') {
    from(rootProject.file('frontend/app-web/src/contenido/productos')) {
        into 'static/contenido/productos'
        exclude '**/*.test.js', '**/*.spec.js', '**/*.feature', 'evidencia/**'
    }
    from(rootProject.file('frontend/app-web/src/comun')) {
        into 'static/comun'
        exclude '**/*.test.js', '**/*.spec.js', '**/*.md'
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}
