spring.application.name=servicio-productos

# MongoDB local por defecto; despliegue puede reemplazarlo con MONGODB_URI.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/productos}
# R9.7 — el emisor es ms-identidad, no Keycloak.
#
# Esta linea decia "Keycloak: plataforma debe proporcionar la URL JWK cuando
# confirme el realm". Esa espera termino: ADR-002 y ADR-005 fijaron a
# ms-identidad como emisor y publica su JWKS en GET /api/v1/auth/jwks.
#
# Mientras tanto, la variable que se leia aqui —KEYCLOAK_JWK_SET_URI— es la
# unica que el CD **no** reparte, asi que en el host de contenido siempre ganaba
# el valor por omision del compose (el jwks-dev de esa red). Resultado: este
# servicio validaba contra una clave y salas-partidas y ms-subastas firmaban con
# otra. El banco E2E no lo veia porque su compose si fija el emisor correcto.
#
# Se prefiere IDENTIDAD_JWKS_URL, que el CD ya reparte (cd.yml), y se conserva
# KEYCLOAK_JWK_SET_URI como respaldo para no romper a quien todavia la inyecte
# —la coleccion de Postman, sobre todo—. Mismo patron que heroes y motor.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=\
  ${IDENTIDAD_JWKS_URL:${KEYCLOAK_JWK_SET_URI:http://localhost:8089/api/v1/auth/jwks}}

# Hilos virtuales definidos en la pila tecnológica de la empresa.
spring.threads.virtual.enabled=true
spring.main.keep-alive=true

# Puntos requeridos para salud, despliegue y Prometheus.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Bitácora estructurada en JSON hacia stdout.
logging.structured.format.console=${LOGGING_STRUCTURED_FORMAT_CONSOLE:logstash}

# La API solo publica los atributos aplicables al tipo de producto.
spring.jackson.default-property-inclusion=non_null

# Catalogo inicial (semilla/catalogo-inicial.json): al arrancar crea los
# productos de las reglas del curso que falten y pone al dia los sembrados con
# una version anterior que ningun administrador edito (B4: semilla versionada).
# Encendido por omision en todos los entornos: una base nueva produce siempre
# el mismo catalogo. CATALOGO_SEMILLA=false lo apaga.
catalogo.semilla.habilitada=${CATALOGO_SEMILLA:true}

# HU-PRD-009 — recursos graficos del catalogo (contrato 1.10.0). El documento
# del curso no fija cuanto pueden pesar ni medir: es decision tecnica y se
# configura por entorno (regla 10). Por omision: imagen 2 MB y 4096 px (como
# las imagenes de los comentarios), icono 256 KB y 512 px, animacion 4 MB y
# 1024 px. El multipart deja pasar el mayor y un margen para su envoltura; por
# encima, el techo general del borde (client_max_body_size 10m) corta antes.
catalogo.recursos.imagen.bytes-maximos=${CATALOGO_RECURSOS_IMAGEN_BYTES:2097152}
catalogo.recursos.imagen.lado-maximo=${CATALOGO_RECURSOS_IMAGEN_LADO:4096}
catalogo.recursos.icono.bytes-maximos=${CATALOGO_RECURSOS_ICONO_BYTES:262144}
catalogo.recursos.icono.lado-maximo=${CATALOGO_RECURSOS_ICONO_LADO:512}
catalogo.recursos.animacion.bytes-maximos=${CATALOGO_RECURSOS_ANIMACION_BYTES:4194304}
catalogo.recursos.animacion.lado-maximo=${CATALOGO_RECURSOS_ANIMACION_LADO:1024}
spring.servlet.multipart.max-file-size=${CATALOGO_RECURSOS_MULTIPART_ARCHIVO:5MB}
spring.servlet.multipart.max-request-size=${CATALOGO_RECURSOS_MULTIPART_PETICION:6MB}
