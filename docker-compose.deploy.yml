# HU-CICD-002 (SCRUM-165): override de despliegue, SOLO para dev/test/produccion.
#
# docker-compose.yml (la raiz, de Santiago Gonzalez) usa "build: context: ..."
# pensado para desarrollo local -- eso no se toca. En un despliegue real no
# se construye nada en el servidor: se usa la imagen ya publicada en GitHub
# Container Registry por el job "construir-y-publicar" de cd.yml.
#
# Por eso este archivo SOLO declara "image:" por servicio. Se combina siempre
# con el archivo base (nunca se usa solo):
#   docker compose -f docker-compose.yml -f docker-compose.deploy.yml pull|up -d
#
# Compose mezcla ambos por nombre de servicio (srv-comentarios, srv-correo,
# etc, mismos nombres que docker-compose.yml). El resultado final tiene tanto
# "build:" (heredado del base, sin usar aqui) como "image:" (de este
# archivo) -- como no se pasa --build, Compose solo hace pull/up de la
# imagen indicada, nunca construye.
#
# ${TAG} lo exporta desplegar.sh antes de invocar "docker compose" (sha corto
# del commit que paso CI para ese servicio).

#
# Host unico de dev en AWS (t3.small, 2 GiB + 2 GB de swap; ver
# infrastructure/entornos/plataforma/README.md). Cada JVM queda acotada a
# 384 MB (MaxRAMPercentage=70 sobre el limite del contenedor) para que un
# arranque no se coma la memoria de los demas, y todo se reinicia solo
# cuando la instancia vuelve del apagado nocturno (restart: unless-stopped;
# sin esto, tras un stop/start del host los contenedores quedan parados y
# la demo aparece caida).

x-servicio-plataforma: &servicio-plataforma
  restart: unless-stopped
  mem_limit: 384m
  environment:
    JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC"

services:
  plataforma-db:
    restart: unless-stopped
    mem_limit: 256m

  plataforma-cache:
    restart: unless-stopped
    mem_limit: 64m

  mailpit:
    restart: unless-stopped
    mem_limit: 64m

  srv-comentarios:
    <<: *servicio-plataforma
    image: ghcr.io/vortex-play-nexus-battles/nexus-battles-vi-comentarios:${TAG}

  srv-correo:
    <<: *servicio-plataforma
    image: ghcr.io/vortex-play-nexus-battles/nexus-battles-vi-correo:${TAG}

  srv-torneos:
    <<: *servicio-plataforma
    image: ghcr.io/vortex-play-nexus-battles/nexus-battles-vi-torneos:${TAG}

  srv-salas-partidas:
    <<: *servicio-plataforma
    image: ghcr.io/vortex-play-nexus-battles/nexus-battles-vi-salas-partidas:${TAG}

  srv-notificaciones:
    <<: *servicio-plataforma
    image: ghcr.io/vortex-play-nexus-battles/nexus-battles-vi-notificaciones:${TAG}

  srv-moderacion-sanciones:
    <<: *servicio-plataforma
    image: ghcr.io/vortex-play-nexus-battles/nexus-battles-vi-moderacion-sanciones:${TAG}

  srv-metricas-plataforma:
    <<: *servicio-plataforma
    image: ghcr.io/vortex-play-nexus-battles/nexus-battles-vi-metricas-plataforma:${TAG}

  srv-admin-parametros:
    <<: *servicio-plataforma
    image: ghcr.io/vortex-play-nexus-battles/nexus-battles-vi-admin-parametros:${TAG}
