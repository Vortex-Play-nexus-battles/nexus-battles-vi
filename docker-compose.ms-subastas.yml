# Override de despliegue de services/cuentas/ms-subastas (issue #571).
#
# Este archivo no existia. ms-subastas tenia codigo, Dockerfile, puerto (8092),
# ruta en el borde (location ~ ^/api/v1/(subastas|mis-pujas)) y CI en verde,
# pero ningun compose lo declaraba y cd.yml no sabia que existia: ni se
# construia su imagen ni habia nada que la arrancara. De ahi el 502 de #571.
#
# Mismo patron que los demas overrides de Cuentas: solo "image:", nunca
# "build:"; se combina con docker-compose.yml + docker-compose.deploy.yml y
# solo cuando ms-subastas viene en la corrida.
#
# CAPACIDAD: desplegableDev:false. Con 12 JVM el host de plataforma ya no tiene
# RAM ni swap libres (medido el 24-sep 03:50 UTC). Opciones en
# infrastructure/despliegue/CAPACIDAD.md; el plan concreto para llevarlo al
# host de contenido, con sus comprobaciones, en services/cuentas/ms-subastas/
# README.md («Despliegue en DEV: plan»). NO usar el perfil `subastas` del
# despliegue a demanda en el host de plataforma: una decimotercera JVM es lo
# que lo colgo el 24-sep.
#
# B8 deja preparado lo que no se activa solo: el arranque escalonado (turno 6)
# y SUBASTAS_DIRECTORIO_ACTIVO_URL, para que el mismo archivo sirva en el host
# de contenido, donde srv-ms-identidad no resuelve y desplegar.sh impone ese
# nombre en DIRECTORIO_ACTIVO_URL. Con las dos sin tocar, en plataforma todo
# vale lo mismo que antes.

services:
  subastas-db:
    image: postgres:17-alpine
    container_name: subastas-db
    restart: unless-stopped
    mem_limit: 128m
    environment:
      POSTGRES_DB: ${MS_SUBASTAS_DB_NAME:-subastas_db}
      POSTGRES_USER: ${MS_SUBASTAS_DB_USER}
      POSTGRES_PASSWORD: ${MS_SUBASTAS_DB_PASSWORD}
    volumes:
      - subastas-db-datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MS_SUBASTAS_DB_USER} -d ${MS_SUBASTAS_DB_NAME:-subastas_db}"]
      interval: 5s
      timeout: 5s
      retries: 20

  srv-ms-subastas:
    image: ghcr.io/vortex-play-nexus-battles/nexus-battles-vi-ms-subastas:${TAG}
    container_name: srv-ms-subastas
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "8092:8092"
    depends_on:
      subastas-db:
        condition: service_healthy
    # Arranque escalonado del host (R16.5b): mismo script que el ancla
    # x-arranque-escalonado de docker-compose.deploy.yml, donde esta explicado.
    # Una ancla no cruza archivos, asi que se repite; el guardian
    # scripts/cd/comprobar-catalogo-servicios.sh exige que sea identico en
    # cuanto el servicio sea desplegable. Turno 6, el primero libre (los 0-5 ya
    # tienen dos JVM cada uno).
    entrypoint:
      - /bin/sh
      - -c
      - |
        proc="$${ARRANQUE_PROC:-/proc}"
        creado="$${ARRANQUE_CREADO_EN:-9999999999}"
        arranque=$$(awk '/^btime/ {print $$2}' "$$proc/stat" 2>/dev/null)
        encendido=$$(cut -d. -f1 "$$proc/uptime" 2>/dev/null)
        if [ -n "$$arranque" ] && [ -n "$$encendido" ] \
           && [ "$$creado" -lt "$$arranque" ] 2>/dev/null \
           && [ "$$encendido" -lt "$${ARRANQUE_VENTANA_S:-600}" ] 2>/dev/null; then
          espera=$$(( $${ARRANQUE_TURNO:-0} * $${ARRANQUE_PASO_S:-40} ))
          echo "arranque escalonado: el host acaba de encender (hace $${encendido}s); turno $${ARRANQUE_TURNO:-0}, espero $${espera}s"
          trap 'exit 143' TERM INT
          sleep "$$espera" & wait $$!
          trap - TERM INT
        fi
        exec java -jar app.jar
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xmx128m -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=48m -XX:+ExitOnOutOfMemoryError"
      ARRANQUE_TURNO: "6"
      ARRANQUE_CREADO_EN: ${ARRANQUE_CREADO_EN:-9999999999}
      # Credencial de servicio (ADR-005). desplegar.sh genera y persiste
      # SECRETO_SERVICIO_MS_SUBASTAS en el host y se la da a ms-identidad en
      # AUTH_CLIENTES_SERVICIO; sin estas dos lineas el servicio pide el token
      # con el client_id global, que no esta registrado, y se lo niegan.
      # El emisor de ADR-005. Sin esta linea el servicio NO ARRANCA: la
      # autoconfiguracion de credenciales se activa en cuanto
      # DIRECTORIO_ACTIVO_CLIENT_ID no esta vacio, y entonces exige la URL
      # ("Falta la URL del emisor (DIRECTORIO_ACTIVO_URL)"). Los servicios de
      # plataforma la heredan del .env por `env_file:` del compose base; los
      # de Cuentas NO estan en el compose base, asi que aqui hay que ponerla.
      #
      # B8 — SUBASTAS_DIRECTORIO_ACTIVO_URL gana si viene: en el host de
      # contenido el emisor esta en otra maquina (http://<IP de plataforma>:8089)
      # y desplegar.sh impone srv-ms-identidad en DIRECTORIO_ACTIVO_URL, en el
      # .env y en el shell, asi que esa variable no sirve alli. Vacia, todo sigue
      # como hasta ahora.
      DIRECTORIO_ACTIVO_URL: ${SUBASTAS_DIRECTORIO_ACTIVO_URL:-${DIRECTORIO_ACTIVO_URL:-http://srv-ms-identidad:8089/api/v1/auth/token}}
      DIRECTORIO_ACTIVO_CLIENT_ID: ms-subastas
      DIRECTORIO_ACTIVO_CLIENT_SECRET: ${SECRETO_SERVICIO_MS_SUBASTAS:-}
      DB_HOST: ${MS_SUBASTAS_DB_HOST:-subastas-db}
      DB_PORT: ${MS_SUBASTAS_DB_PORT:-5432}
      DB_NAME: ${MS_SUBASTAS_DB_NAME:-subastas_db}
      DB_USER: ${MS_SUBASTAS_DB_USER}
      DB_PASSWORD: ${MS_SUBASTAS_DB_PASSWORD}
      # Seguridad del canal STOMP (trabajo previo de ms-subastas: JWT en el
      # CONNECT, ChannelInterceptor y anti-suplantacion). "subastas.ws.origenes"
      # llega vacio por defecto, y vacio significa "no aceptar ningun origen":
      # si no se pone aqui, el panel de subastas se conecta y el servidor le
      # cierra el handshake. Mismo patron que SALAS_WS_ORIGENES y
      # NOTIFICACIONES_WS_ORIGENES en docker-compose.deploy.yml.
      SUBASTAS_WS_ORIGENES: ${SUBASTAS_WS_ORIGENES:-}
      CORS_ORIGENES: ${SUBASTAS_CORS_ORIGENES:-}
      # Verificacion de los tokens (ADR-002/ADR-005), dentro de la red.
      IDENTIDAD_JWKS_URL: ${IDENTIDAD_JWKS_URL:-http://srv-ms-identidad:8089/api/v1/auth/jwks}
      # Integraciones reales dentro de la red de despliegue. En local estos
      # apuntan a localhost y "modo: fake"; aqui se apunta a los contenedores.
      # Creditos REALES (R16.19). Hasta R16 esto valia "fake": ms-finanzas no
      # corria en dev y subastas usaba un doble EN MEMORIA de creditos, o sea,
      # pujas y compras que no tocaban el libro. Desde R16.5 ms-finanzas es
      # desplegableDev:true (infrastructure/despliegue/CAPACIDAD.md), y logica
      # falsa en un entorno real no se admite. OJO con el valor: el cliente real
      # se activa con "http" (CreditoClientConfig), no con "real" como decia
      # este comentario; con "real" no se crearia ningun cliente y el servicio
      # no arrancaria. Es el mismo valor que usa el banco E2E.
      FINANZAS_BASE_URL: ${FINANZAS_BASE_URL:-http://srv-ms-finanzas:8093/api/v1}
      FINANZAS_MODO: ${FINANZAS_MODO:-http}
      # Inventario (HU-SUB-004, FI-TRANSFER-1). Ninguna de estas dos estaba
      # declarada, y la omision no era neutra: application.properties trae
      # app.inventario.modo=${INVENTARIO_MODO:fake}, asi que el servicio
      # desplegado hablaba con un doble en memoria. La subasta se adjudicaba, el
      # ganador pagaba y el objeto no cambiaba de dueno, sin un solo error.
      #
      # La URL no es el nombre del contenedor: inventario es claseHost
      # "contenido" y ms-subastas es "plataforma"
      # (infrastructure/despliegue/servicios.json), asi que srv-inventario no
      # resuelve desde aqui. Se usa el puerto publicado del host de contenido,
      # igual que docker-compose.deploy.yml para salas-partidas y
      # docker-compose.ms-chatbot.yml para el chatbot.
      #
      # Y el modo va en "http", igual que finanzas desde R16.19: los dos
      # servicios estan desplegados y sanos, y logica falsa en un entorno real
      # no se admite. Entre fallar al entregar y cobrar sin entregar, lo segundo
      # es lo que no se puede permitir.
      INVENTARIO_BASE_URL: ${INVENTARIO_BASE_URL:-http://34.193.90.11:8102}
      INVENTARIO_MODO: ${INVENTARIO_MODO:-http}
      # Catalogo maestro (productos, host de contenido) para validar el producto
      # al publicar una subasta: CatalogoProductosClientHttp pide
      # GET /api/v1/productos/{id}. Sin esta linea valia http://localhost:8080,
      # el propio contenedor, y publicar fallaba con «No se pudo contactar al
      # catalogo». Mismo destino que el borde (borde-dev.conf) y que el banco E2E.
      CATALOGO_BASE_URL: ${CATALOGO_BASE_URL:-http://34.193.90.11:8103}
      # B8 — las reglas de 7.7 que decide administracion (incremento minimo,
      # topes, que pasa con lo que nadie recoge) salen de admin-parametros, en
      # este mismo host. Hasta B8 el incremento era SUBASTAS_INCREMENTO_MINIMO,
      # una variable vacia en DEV que nadie podia cambiar sin redesplegar; ya no
      # se lee. Mientras el PO no fije `subastas.incremento-minimo`, publicar
      # responde 503 INCREMENTO_MINIMO_NO_CONFIGURADO y la pantalla lo dice.
      PARAMETROS_URL: ${PARAMETROS_URL:-http://srv-admin-parametros:8088/api/v1}
      # 7.7.9: que pasa con un producto ganado que nadie recoge en 7 dias.
      # Decision del PO pendiente; ENTREGAR es el valor PROVISIONAL (queda
      # disponible para el ganador, que ya pago). Respaldo del parametro
      # `subastas.pendientes.al-vencer`, que aun no esta en el catalogo.
      SUBASTAS_PENDIENTES_AL_VENCER: ${SUBASTAS_PENDIENTES_AL_VENCER:-ENTREGAR}
      # Avisos por correo (7.7.8, POST /api/v1/correos/subasta). VACIO por
      # omision: el contacto se pide a ms-identidad
      # (GET /api/v1/internal/usuarios/{uid}/contacto), que figura como
      # pendiente (B2). Con CORREO_URL puesta y esa ruta sin desplegar, los
      # correos se reintentarian hasta FALLIDO. Se enciende con
      # SUBASTAS_CORREO_URL=http://srv-correo:8082 cuando B2 este en develop.
      CORREO_URL: ${SUBASTAS_CORREO_URL:-}
      IDENTIDAD_URL: ${IDENTIDAD_URL_INTERNA:-http://srv-ms-identidad:8089}
      NOTIFICACIONES_BASE_URL: ${NOTIFICACIONES_BASE_URL:-http://srv-notificaciones:8085/api/v1}
      SANCIONES_BASE_URL: ${SANCIONES_BASE_URL:-http://srv-moderacion-sanciones:8086}

volumes:
  subastas-db-datos:
