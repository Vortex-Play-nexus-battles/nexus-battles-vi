# Mapa contrato -> servicio que lo implementa (B0, BACKEND-01).
#
# Lo lee `rutas-contrato-codigo.py`. Es la unica fuente de verdad de «que
# servicio es dueno de que contrato»: un contrato que no aparece aqui hace
# fallar el guardian, porque una ruta sin dueno es exactamente como nacio la
# transferencia de subasta inventada (#660/#669).
#
# Los de `contracts/websocket/` son AsyncAPI: el guardian compara sus destinos
# `/app/**` con los @MessageMapping/@SubscribeMapping del servicio.

