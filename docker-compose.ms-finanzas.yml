# HU-CICD-002 (SCRUM-165): override de despliegue para services/cuentas/ms-finanzas.
#
# Mismo patron que docker-compose.ms-cumplimiento.yml y
# docker-compose.ms-ecommerce.yml: solo declara "image:", nunca "build:" -- el
# jar se compila y la imagen se publica en ghcr.io en el job
# "construir-y-publicar" de cd.yml, nunca en el servidor. Se combina siempre
# con docker-compose.yml (nunca solo), y SOLO cuando ms-finanzas esta entre
# los servicios modificados de esa corrida:
#   docker compose -f docker-compose.yml -f docker-compose.deploy.yml -f docker-compose.ms-finanzas.yml pull|up -d
#
# A diferencia de ms-identidad/ms-cumplimiento/ms-ecommerce, ms-finanzas es
# Gradle (build.gradle propio, modulo del build raiz) -- pero el patron de
# override de despliegue es el mismo para los cuatro: cada servicio de otro
# equipo mantiene su propio archivo, para que quede claro quien es dueno de
# que.
#
# Puerto: 8093 tanto en el host como en el contenedor (confirmado en el
# Dockerfile de ms-finanzas: EXPOSE 8093, sin el desfase host/contenedor que
# tuvo ms-identidad). Ya es el puerto que espera borde-dev.conf y las
# CREDITOS_URL de salas-partidas/torneos (HU-JUE-012 #470, HU-JUE-014 #442).
#
# ${TAG} lo exporta scripts/cd/desplegar.sh antes de invocar "docker compose"
# (mismo sha corto de esta corrida que usan las demas imagenes).
#
# Variables de entorno: el lado IZQUIERDO de cada linea es el nombre que
# Spring realmente lee (confirmado en application.properties de ms-finanzas:
# ${DB_HOST}, ${DB_PORT}, ${DB_NAME}, ${DB_USER}, ${DB_PASSWORD},
# ${IDENTIDAD_JWKS_URL}). El lado DERECHO (${MS_FINANZAS_...}) es la variable
# que desplegar.sh deja en el .env del servidor -- con el prefijo
# "MS_FINANZAS_" a proposito, para no chocar ni con las variables de
# plataforma (DB_USER/DB_PASS, que usa plataforma-db) ni con las de
# ms-identidad (que usa otro esquema: DB_URL en vez de DB_HOST/PORT/NAME).
#
# Todas las variables quedan PENDIENTES por ahora (ver los secrets TODO_*
# en cd.yml, mismo patron de placeholder que ms-cumplimiento/ms-ecommerce).
#
# NOTA DE CAPACIDAD (issue #571, punto 4): que este archivo exista y que
# cd.yml sepa construir la imagen de ms-finanzas NO significa que quepa en el
# host de dev actual (t3.small, ~330 MB libres). cd.yml deja a ms-finanzas en
# FUERA_DEL_HOST_DEV a proposito: la imagen se publica, pero el despliegue
# automatico no la incluye hasta que alguien mida la capacidad real. Se puede
# forzar con un despliegue a demanda (workflow_dispatch) sabiendo el riesgo.

services:
  # Base de datos PROPIA de ms-finanzas (regla 7: aislamiento de datos; no
  # comparte servidor con plataforma-db ni con la de ningun otro servicio).
  # Sin este bloque, MS_FINANZAS_DB_HOST no tiene a que apuntar -- ni
  # docker-compose.ms-cumplimiento.yml ni docker-compose.ms-ecommerce.yml lo
  # tienen tampoco todavia, mismo hueco, no soy el primero en dejarlo. Mismo
  # patron que identidad-db en docker-compose.cuentas.yml.
  finanzas-db:
    image: postgres:17-alpine
    container_name: finanzas-db
    restart: unless-stopped
    mem_limit: 192m
    environment:
      POSTGRES_DB: finanzas_db
      POSTGRES_USER: ${MS_FINANZAS_DB_USER}
      POSTGRES_PASSWORD: ${MS_FINANZAS_DB_PASSWORD}
    volumes:
      - finanzas-db-datos:/var/lib/postgresql/data

  srv-ms-finanzas:
    image: ghcr.io/vortex-play-nexus-battles/nexus-battles-vi-ms-finanzas:${TAG}
    restart: unless-stopped
    mem_limit: 384m
    ports:
      - "8093:8093"
    depends_on:
      - finanzas-db
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC"
      DB_HOST: ${MS_FINANZAS_DB_HOST:-finanzas-db}
      DB_PORT: ${MS_FINANZAS_DB_PORT:-5432}
      DB_NAME: ${MS_FINANZAS_DB_NAME:-finanzas_db}
      DB_USER: ${MS_FINANZAS_DB_USER}
      DB_PASSWORD: ${MS_FINANZAS_DB_PASSWORD}
      # Clave publica de los tokens (ADR-002/ADR-005), dentro de la red.
      IDENTIDAD_JWKS_URL: ${IDENTIDAD_JWKS_URL:-http://srv-ms-identidad:8089/api/v1/auth/jwks}

volumes:
  finanzas-db-datos:
