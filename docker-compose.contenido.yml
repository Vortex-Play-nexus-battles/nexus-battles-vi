  jwks_dev:
    content: |
      {
        "keys": [
          {
            "kty": "RSA",
            "use": "sig",
            "alg": "RS256",
            "kid": "ZWrXEjzebPN-783Y",
            "n": "pMVuOkaJc-xAMJT42ismRyqMdMOApEBBBbm56f8TCylwM-Cq7qKsm_Z6ZDLQJ6qXK0y3e_9SQXqvrqizW8JoQ6mKo7CxJdp1Css3Fy9QmFGCKdFbM8NbOh97u9dj9fAKuD9hk9SX3gfA7QXup2bWhYi7-AXcVDLcgLN6skzOVo1NYOjC825WB0OuxesnEnOwYRXBcECv4fJY5akNtGQ_0-3IL48pK7xnMNhahO4D2zgnPZPZMJmSB2Xuj79icVNJmcIjxqbm-rcCt9YYyEXpFWTg8Y6fi4cqb4a5fVZXn1xlQ0A9s-cYpko232y_Ukd-O9hOlWo0ZKh_dwitEVffgw",
            "e": "AQAB"
          }
        ]
