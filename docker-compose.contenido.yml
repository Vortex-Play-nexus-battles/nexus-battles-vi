# Servicios de contenido (Grupo 2), para desarrollo local Y para despliegue.
#
# Uso local:
#   docker compose -f docker-compose.yml -f docker-compose.contenido.yml up -d --build
#
# Levanta los 4 servicios de services/contenido/ junto con MongoDB 8 y la
# infra comun de plataforma (Postgres, Redis, Mailpit del docker-compose.yml
# base). Cada servicio se construye desde la raiz del monorepo, con -f al
# Dockerfile del servicio (heroes espera el jar ya compilado:
# ./gradlew :services:contenido:heroes:bootJar antes del build; los otros
# tres compilan dentro de la imagen).
#
# Uso en despliegue (scripts/cd/desplegar.sh lo agrega al comando SOLO cuando
# algun servicio de contenido viene entre los modificados de esa corrida,
# mismo mecanismo que docker-compose.cuentas.yml):
#   docker compose -f docker-compose.yml -f docker-compose.deploy.yml -f docker-compose.contenido.yml pull|up -d
# Ahi manda "image:" (publicada en ghcr.io por cd.yml, nunca se construye en
# el servidor: el comando no lleva --build). ${TAG} lo exporta desplegar.sh.
# La etiqueta es por servicio (${TAG_HEROES}, ${TAG_INVENTARIO}, ...) con
# ${TAG} de respaldo: el CD solo construye las imagenes de los servicios que
# cambiaron, y las dependencias que no cambiaron (p. ej. srv-heroes para
# inventario y motor) conservan la etiqueta que ya tienen desplegada. Las
# resuelve resolver_etiquetas_contenido en scripts/cd/desplegar.sh; en local
# no hace falta definir nada: todo cae en "local".
#
# Memoria: cada contenedor lleva un limite (deploy.resources.limits.memory,
# que Docker Compose v2 aplica sin swarm). Los Dockerfiles fijan
# JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=75, asi que la JVM se dimensiona
# sola dentro de ese limite. Suma ~1,7 GB: cabe en una t3.small de 2 GB, que
# es un tipo elegible del plan gratuito (ver infrastructure/entornos/contenido/).
#
# Puertos de host: 8101-8104 (ecommerce usa 8090, cumplimiento 8091;
# plataforma usa 8081-8088, cuentas 8089). Es el puerto que consulta el
# healthcheck de desplegar.sh y el que registra puerto_de() en cd.yml.
# Todos los servicios exponen 8080 internamente; el mapeo host:contenedor
# los diferencia. Entre ellos se hablan por nombre de servicio en la red de
# Compose (srv-heroes:8080, etc.), nunca por el puerto del host.

# Todos los servicios llevan `restart: unless-stopped`, como los de plataforma en
# docker-compose.deploy.yml: si uno se cae (por ejemplo, el limite de memoria lo
# mata) o la instancia se reinicia, vuelve solo. Antes tenian la politica "no" y
# un contenedor caido se quedaba caido hasta el siguiente despliegue.
services:

  # --- Base de datos documental (regla 7: un esquema por servicio) ---
  # Sin puerto publicado en el host: solo la alcanzan los servicios de esta
  # red. Para inspeccionarla en local, "docker exec -it contenido-mongo mongosh".
  contenido-mongo:
    image: mongo:8.0
    container_name: contenido-mongo
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
    volumes:
      - contenido-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Servicios de contenido ---

  srv-heroes:
    build:
      context: .
      dockerfile: services/contenido/heroes/Dockerfile
    image: ghcr.io/vortex-play-nexus-battles/nexus-battles-vi-heroes:${TAG_HEROES:-${TAG:-local}}
    container_name: srv-heroes
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 320M
    ports:
      - "8101:8080"
    environment:
      # Monton acotado, igual que en el host de plataforma (#690). Los
      # Dockerfiles fijan MaxRAMPercentage=75, y con eso una JVM ociosa se
      # expande hasta llenar su limite sin motivo para recolectar: medido el
      # 24-sep en este host, inventario 217/320, productos 225/384 y heroes
      # 170/320 MiB en reposo. En plataforma el mismo cambio dejo a los
      # servicios en 30-60 MiB. JAVA_TOOL_OPTIONS aqui gana al del Dockerfile.
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xmx128m -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=48m -XX:+ExitOnOutOfMemoryError"
      PUERTO_HEROES: 8080
      SPRING_PROFILES_ACTIVE: mongo
      MONGODB_URI: mongodb://contenido-mongo:27017/heroes
      # R8.1 — emisor real (ADR-002/ADR-005). Es ms-identidad, que corre en el
      # host de plataforma; su 8089 esta abierto en el Security Group y su IP
      # es elastica, asi que el valor por omision es estable.
      #
      # R9.7 corrigio dos cosas sobre esta linea. La primera: el comentario que
      # estaba aqui afirmaba que el CD repartia esta variable al job de
      # contenido, y era falso — `desplegar-contenido-dev` solo pasaba
      # GHCR_USER, GHCR_TOKEN, TAG, SERVICIOS_PUERTOS, APP_ENV y LOG_LEVEL.
      # Heroes y motor-combate funcionaban en AWS por el valor por omision de
      # abajo, no por la variable: correcto por casualidad. Ya se reparte.
      # La segunda: inventario y productos leian KEYCLOAK_JWK_SET_URI, que el
      # CD nunca reparte, y caian al jwks-dev de esta red en vez del emisor
      # real. Los cuatro servicios de contenido leen ahora la misma variable.
      IDENTIDAD_JWKS_URL: ${IDENTIDAD_JWKS_URL:-http://35.168.124.119:8089/api/v1/auth/jwks}
    depends_on:
      contenido-mongo:
        condition: service_healthy

  srv-inventario:
    build:
      context: .
      dockerfile: services/contenido/inventario/Dockerfile
    image: ghcr.io/vortex-play-nexus-battles/nexus-battles-vi-inventario:${TAG_INVENTARIO:-${TAG:-local}}
    container_name: srv-inventario
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 320M
    ports:
      - "8102:8080"
    environment:
      # Monton acotado, igual que en el host de plataforma (#690). Los
      # Dockerfiles fijan MaxRAMPercentage=75, y con eso una JVM ociosa se
      # expande hasta llenar su limite sin motivo para recolectar: medido el
      # 24-sep en este host, inventario 217/320, productos 225/384 y heroes
      # 170/320 MiB en reposo. En plataforma el mismo cambio dejo a los
      # servicios en 30-60 MiB. JAVA_TOOL_OPTIONS aqui gana al del Dockerfile.
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xmx128m -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=48m -XX:+ExitOnOutOfMemoryError"
      # Boot 4 lee spring.mongodb.uri (SPRING_MONGODB_URI); el nombre de Boot 3
      # se conserva porque el README y el LEEME de inventario lo documentan.
      SPRING_MONGODB_URI: mongodb://contenido-mongo:27017/inventario
      SPRING_DATA_MONGODB_URI: mongodb://contenido-mongo:27017/inventario
      HEROES_BASE_URL: http://srv-heroes:8080
      PRODUCTOS_BASE_URL: http://srv-productos:8080
      # HU-INV-010: las operaciones internas de subastas llegan con un token de
      # servicio (azp = ms-subastas) que hay que validar contra el emisor que lo
      # firmo — y ese emisor es **ms-identidad** (ADR-002 / ADR-005), no un
      # Keycloak que nunca llego.
      #
      # R9.7 — hasta aqui este servicio leia solo KEYCLOAK_JWK_SET_URI, que es
      # justo la unica variable que el CD NO reparte: en el host siempre ganaba
      # el jwks-dev de esta red. Es decir, inventario validaba con una clave
      # mientras ms-subastas y salas-partidas firmaban con otra, y sus llamadas
      # S2S no podian funcionar en AWS. El banco E2E no lo destapaba porque su
      # compose si fija el emisor correcto.
      IDENTIDAD_JWKS_URL: ${IDENTIDAD_JWKS_URL:-http://35.168.124.119:8089/api/v1/auth/jwks}
      # Respaldo heredado: se conserva para quien todavia la inyecte (la
      # coleccion de Postman de productos firma con la clave de jwks-dev). El
      # servicio prefiere IDENTIDAD_JWKS_URL cuando existe.
      KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI:-http://jwks-dev/certs.json}
    depends_on:
      contenido-mongo:
        condition: service_healthy
      srv-heroes:
        condition: service_started
      srv-productos:
        condition: service_started
      jwks-dev:
        condition: service_started

  srv-productos:
    build:
      context: .
      dockerfile: services/contenido/productos/Dockerfile
    image: ghcr.io/vortex-play-nexus-battles/nexus-battles-vi-productos:${TAG_PRODUCTOS:-${TAG:-local}}
    container_name: srv-productos
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
    ports:
      - "8103:8080"
    environment:
      # Monton acotado, igual que en el host de plataforma (#690). Los
      # Dockerfiles fijan MaxRAMPercentage=75, y con eso una JVM ociosa se
      # expande hasta llenar su limite sin motivo para recolectar: medido el
      # 24-sep en este host, inventario 217/320, productos 225/384 y heroes
      # 170/320 MiB en reposo. En plataforma el mismo cambio dejo a los
      # servicios en 30-60 MiB. JAVA_TOOL_OPTIONS aqui gana al del Dockerfile.
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xmx128m -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=48m -XX:+ExitOnOutOfMemoryError"
      MONGODB_URI: mongodb://contenido-mongo:27017/productos
      # R9.7 — el emisor es ms-identidad (ADR-002 / ADR-005). El JWKS se consulta
      # solo al validar el primer token, asi que el contenedor arranca y
      # responde salud aunque la URL no exista todavia.
      IDENTIDAD_JWKS_URL: ${IDENTIDAD_JWKS_URL:-http://35.168.124.119:8089/api/v1/auth/jwks}
      # Respaldo heredado: la coleccion de Postman de productos firma con la
      # clave de jwks-dev (servicio mas abajo), asi que la variable se conserva
      # hasta que esa coleccion emita contra ms-identidad. El servicio prefiere
      # IDENTIDAD_JWKS_URL cuando existe.
      KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI:-http://jwks-dev/certs.json}
      # Siembra al arrancar los productos de las reglas que falten (nunca pisa los existentes); false la apaga.
      CATALOGO_SEMILLA: ${CATALOGO_SEMILLA:-true}
    depends_on:
      contenido-mongo:
        condition: service_healthy
      jwks-dev:
        condition: service_started

  srv-motor-combate:
    build:
      context: .
      dockerfile: services/contenido/motor-combate/Dockerfile
    image: ghcr.io/vortex-play-nexus-battles/nexus-battles-vi-motor-combate:${TAG_MOTOR_COMBATE:-${TAG:-local}}
    container_name: srv-motor-combate
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 320M
    ports:
      - "8104:8080"
    environment:
      # Monton acotado, igual que en el host de plataforma (#690). Los
      # Dockerfiles fijan MaxRAMPercentage=75, y con eso una JVM ociosa se
      # expande hasta llenar su limite sin motivo para recolectar: medido el
      # 24-sep en este host, inventario 217/320, productos 225/384 y heroes
      # 170/320 MiB en reposo. En plataforma el mismo cambio dejo a los
      # servicios en 30-60 MiB. JAVA_TOOL_OPTIONS aqui gana al del Dockerfile.
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xmx128m -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=48m -XX:+ExitOnOutOfMemoryError"
      HEROES_URL: http://srv-heroes:8080
      # R8.1 — POST /api/v1/combate/ataques exige ROLE_SERVICIO. El token lo
      # firma ms-identidad en el host de plataforma y lo presenta
      # salas-partidas; el motor solo necesita la clave publica para
      # verificarlo. Misma variable que reparte el CD.
      IDENTIDAD_JWKS_URL: ${IDENTIDAD_JWKS_URL:-http://35.168.124.119:8089/api/v1/auth/jwks}
    depends_on:
      srv-heroes:
        condition: service_started

  # --- JWKS de desarrollo para productos ---
  # Productos valida los tokens Bearer contra un JWKS (firma y vigencia; no
  # valida emisor). Mientras cuentas no publique su Keycloak, este servidor
  # estatico sirve la clave PUBLICA de desarrollo para que se puedan probar los
  # endpoints protegidos (Newman de productos, folder de tiraje). La clave
  # privada la guarda el PO fuera del repositorio; los tokens se emiten con
  # services/contenido/productos/postman/jwks-dev/emitir-token.mjs. Quien
  # tenga esa clave es ADMINISTRADOR de productos en dev: herramienta de
  # pruebas, no sustituye la integracion con cuentas. Sin puerto en el host.
  jwks-dev:
    image: nginx:1.27-alpine
    container_name: jwks-dev
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 32M
    configs:
      - source: jwks_dev
        target: /usr/share/nginx/html/certs.json

volumes:
  contenido-mongo-data:

# Clave publica RSA del JWKS de desarrollo (kid ZWrXEjzebPN-783Y). Para
# rotarla: node generar-claves.mjs <ruta-privada.pem> y pegar aqui su salida.
