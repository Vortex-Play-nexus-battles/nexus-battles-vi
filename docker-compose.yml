version: '3.8'

services:
  plataforma-db:
    image: postgres:15-alpine
    container_name: plataforma-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: plataformadb

  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  plataforma-cache:
    image: redis:8-alpine
    container_name: plataforma-cache
    ports:
      - "6379:6379"

  srv-comentarios:
    build:
      context: ./services/plataforma/comentarios
      dockerfile: Dockerfile
    container_name: srv-comentarios
    ports:
      - "8081:8081"
    env_file:
      - .env
    depends_on:
      - plataforma-db

  srv-correo:
    build:
      context: ./services/plataforma/correo
      dockerfile: Dockerfile
    container_name: srv-correo
    ports:
      - "8082:8082"
    env_file:
      - .env
    environment:
      # Las direcciones reservadas para pruebas (@nexus.test, @example.com...)
      # van al Mailpit de este mismo compose, sea cual sea el servidor
      # principal (SMTP_HOST). Con un proveedor real configurado, las cuentas
      # que crean los canarios en cada despliegue rebotarian en el proveedor;
      # asi siguen llegando a un buzon que las pruebas pueden leer. Ver
      # correo.buzon-de-pruebas en el application.yml del servicio.
      CORREO_BUZON_PRUEBAS_HOST: mailpit
      CORREO_BUZON_PRUEBAS_PUERTO: "1025"
    depends_on:
      - plataforma-db
      - mailpit


  srv-torneos:
    build:
      context: ./services/plataforma/torneos
      dockerfile: Dockerfile
    container_name: srv-torneos
    ports:
      - "8083:8083"
    env_file:
      - .env
    depends_on:
      - plataforma-db

  srv-salas-partidas:
    build:
      context: ./services/plataforma/salas-partidas
      dockerfile: Dockerfile
    container_name: srv-salas-partidas
    ports:
      - "8084:8084"
    env_file:
      - .env
    depends_on:
      - plataforma-db

  srv-notificaciones:
    build:
      context: ./services/plataforma/notificaciones
      dockerfile: Dockerfile
    container_name: srv-notificaciones
    ports:
      - "8085:8085"
    env_file:
      - .env
    depends_on:
      - plataforma-db

  srv-moderacion-sanciones:
    build:
      context: ./services/plataforma/moderacion-sanciones
      dockerfile: Dockerfile
    container_name: srv-moderacion-sanciones
    ports:
      - "8086:8086"
    env_file:
      - .env
    depends_on:
      - plataforma-db
      - plataforma-cache

  srv-metricas-plataforma:
    build:
      context: ./services/plataforma/metricas-plataforma
      dockerfile: Dockerfile
    container_name: srv-metricas-plataforma
    ports:
      - "8087:8087"
    env_file:
      - .env
    depends_on:
      - plataforma-db

  srv-admin-parametros:
    build:
      context: ./services/plataforma/admin-parametros
      dockerfile: Dockerfile
    container_name: srv-admin-parametros
    ports:
      - "8088:8088"
    env_file:
      - .env
    depends_on:
      - plataforma-db
